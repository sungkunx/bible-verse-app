d":"dep242-5-3-3","collectionId":"dep242","sectionId":"5","subsectionId":"5-3","number":3,"code":"5-3-3","title":"필요를 채워 줌","ref":{"book":"2Cor","chapter":8,"verses":[{"start":3,"end":4}]},"texts":{"ko":"내가 증거하노니 저희가 힘대로 할 뿐아니라 힘에 지나도록 자원하여 이 은혜와 성도 섬기는 일에 참여함에 대하여 우리에게 간절히 구하니","en":null}},{"id":"dep242-5-3-4","collectionId":"dep242","sectionId":"5","subsectionId":"5-3","number":4,"code":"5-3-4","title":"그리스도의 고난에 동참함","ref":{"book":"1Pet","chapter":4,"verses":[{"start":13}]},"texts":{"ko":"오직 너희가 그리스도의 고난에 참예하는 것으로 즐거워하라 이는 그의 영광을 나타내실 때에 너희로 즐거워하고 기뻐하게 하려 함이라","en":null}},{"id":"dep242-5-3-5","collectionId":"dep242","sectionId":"5","subsectionId":"5-3","number":5,"code":"5-3-5","title":"서로의 짐을 짐","ref":{"book":"Gal","chapter":6,"verses":[{"start":2}]},"texts":{"ko":"너희가 짐을 서로 지라 그리하여 그리스도의 법을 성취하라","en":null}},{"id":"dep242-5-4-1","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":1,"code":"5-4-1","title":"마음을 같이할 것","ref":{"book":"Phil","chapter":2,"verses":[{"start":1,"end":2}]},"texts":{"ko":"그러므로 그리스도 안에 무슨 권면이나 사랑에 무슨 위로나 성령의 무슨 교제나 긍휼이나 자비가 있거든 마음을 같이 하여 같은 사랑을 가지고 뜻을 합하며 한 마음을 품어","en":null}},{"id":"dep242-5-4-2","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":2,"code":"5-4-2","title":"겸손할 것","ref":{"book":"Phil","chapter":2,"verses":[{"start":3,"end":4}]},"texts":{"ko":"아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고 각각 자기 일을 돌아볼 뿐더러 또한 각각 다른 사람들의 일을 돌아보아 나의 기쁨을 충만케 하라","en":null}},{"id":"dep242-5-4-3","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":3,"code":"5-4-3","title":"마음을 넓힐 것","ref":{"book":"2Cor","chapter":6,"verses":[{"start":12},{"start":12}]},"texts":{"ko":"너희가 우리 안에서 좁아진 것이 아니라 오직 너희 심정에서 좁아진것이니라 내가 자녀에게 말하듯 하노니 보답하는 양으로 너희도 마음을 넓히라","en":null}},{"id":"dep242-5-4-4","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":4,"code":"5-4-4","title":"피차 복종할 것","ref":{"book":"Eph","chapter":5,"verses":[{"start":21}]},"texts":{"ko":"그리스도를 경외함으로 피차 복종하라","en":null}},{"id":"dep242-5-4-5","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":5,"code":"5-4-5","title":"비교하지 말 것","ref":{"book":"Mark","chapter":9,"verses":[{"start":34,"end":35}]},"texts":{"ko":"저희가 잠잠하니 이는 노중에서 서로 누가 크냐 하고 쟁론하였음이라 예수께서 앉으사 열 두 제자를 불러서 이르시되 아무든지 첫째가 되고자 하면 뭇사람의 끝이 되며 뭇사람을 섬기는 자가 되어야 하리라 하시고","en":null}},{"id":"dep242-5-4-6","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":6,"code":"5-4-6","title":"쓴 뿌리를 갖지말 것","ref":{"book":"Heb","chapter":12,"verses":[{"start":15}]},"texts":{"ko":"너희는 돌아보아 하나님 은혜에 이르지 못하는 자가 있는가 두려워하고 또 쓴 뿌리가 나서 괴롭게 하고 많은 사람이 이로 말미암아 더러움을 입을까 두려워하고","en":null}},{"id":"dep242-5-4-7","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":7,"code":"5-4-7","title":"열매 없는 일에서 떠날 것","ref":{"book":"Eph","chapter":5,"verses":[{"start":11}]},"texts":{"ko":"너희는 열매 없는 어두움의 일에 참예하지 말고 도리어 책망하라","en":null}},{"id":"dep242-5-4-8","collectionId":"dep242","sectionId":"5","subsectionId":"5-4","number":8,"code":"5-4-8","title":"자기 일에 얽매이지 말 것","ref":{"book":"2Tim","chapter":2,"verses":[{"start":4}]},"texts":{"ko":"군사로 다니는 자는 자기 생활에 얽매이는 자가 하나도 없나니 이는 군사로 모집한 자를 기쁘게 하려 함이라","en":null}},{"id":"dep242-5-5-9","collectionId":"dep242","sectionId":"5","subsectionId":"5-5","number":9,"code":"5-5-9","title":"1-1. 성도와의 관계","ref":{"book":"Matt","chapter":5,"verses":[{"start":23,"end":24}]},"texts":{"ko":"그러므로 예물을 제단에 드리다가 거기서 네 형제에게 원망 들을만한 일이 있는줄 생각나거든 예물을 제단 앞에 두고 먼저 가서 형제와 화목하고 그 후에 와서 예물을 드리라","en":null}},{"id":"dep242-5-5-1","collectionId":"dep242","sectionId":"5","subsectionId":"5-5","number":1,"code":"5-5-1","title":"1-2. 성도와의 관계","ref":{"book":"Matt","chapter":18,"verses":[{"start":15}]},"texts":{"ko":"네 형제가 죄를 범하거든 가서 너와 그 사람과만 상대하여 권고하라 만일 들으면 네가 네 형제를 얻은 것이요","en":null}},{"id":"dep242-5-5-2","collectionId":"dep242","sectionId":"5","subsectionId":"5-5","number":2,"code":"5-5-2","title":"2-1. 하나님과의 관계","ref":{"book":"1John","chapter":1,"verses":[{"start":9}]},"texts":{"ko":"만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요","en":null}},{"id":"dep242-5-5-3","collectionId":"dep242","sectionId":"5","subsectionId":"5-5","number":3,"code":"5-5-3","title":"2-2. 하나님과의 관계","ref":{"book":"Prov","chapter":28,"verses":[{"start":13}]},"texts":{"ko":"자기의 죄를 숨기는 자는 형통치 못하나 죄를 자복하고 버리는 자는 불쌍히 여김을 받으리라","en":null}},{"id":"dep242-6-1-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-1","number":1,"code":"6-1-1","title":"모든 그리스도인","ref":{"book":"Acts","chapter":1,"verses":[{"start":8}]},"texts":{"ko":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","en":null}},{"id":"dep242-6-1-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-1","number":2,"code":"6-1-2","title":"모든 그리스도인","ref":{"book":"2Cor","chapter":5,"verses":[{"start":18,"end":19}]},"texts":{"ko":"모든 것이 하나님께로 났나니 저가 그리스도로 말미암아 우리를 자기와 화목하게 하시고 또 우리에게 화목하게 하는 직책을 주셨으니 이는 하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며 저희의 죄를 저희에게 돌리지 아니하시고 화목하게 하는 말씀을 우리에게 부탁하셨느니라","en":null}},{"id":"dep242-6-2-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":1,"code":"6-2-1","title":"하나님의 명령","ref":{"book":"2Tim","chapter":4,"verses":[{"start":1,"end":2}]},"texts":{"ko":"하나님 앞과 산 자와 죽은 자를 심판하실 그리스도 예수 앞에서 그의 나타나실 것과 그의 나라를 두고 엄히 명하노니 너는 말씀을 전파하라 때를 얻든지 못 얻든지 항상 힘쓰라 범사에 오래 참음과 가르침으로 경책하며 경계하며 권하라","en":null}},{"id":"dep242-6-2-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":2,"code":"6-2-2","title":"잃어버린 자에 대한 사랑","ref":{"book":"Luke","chapter":19,"verses":[{"start":10}]},"texts":{"ko":"인자의 온 것은 잃어버린 자를 찾아 구원하려 함이니라","en":null}},{"id":"dep242-6-2-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":3,"code":"6-2-3","title":"복음 전할 부탁을 받음","ref":{"book":"1Thess","chapter":2,"verses":[{"start":4}]},"texts":{"ko":"오직 하나님의 옳게 여기심을 입어 복음 전할 부탁을 받았으니 우리가 이와 같이 말함은 사람을 기쁘게 하려 함이 아니요 오직 우리 마음을 감찰하시는 하나님을 기쁘시게 하려 함이라","en":null}},{"id":"dep242-6-2-4","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":4,"code":"6-2-4","title":"부득불 할 일이므로","ref":{"book":"1Cor","chapter":9,"verses":[{"start":16}]},"texts":{"ko":"내가 복음을 전할찌라도 자랑할 것이 없음은 내가 부득불 할 일임이라 만일 복음을 전하지 아니하면 내게 화가 있을 것임이로라","en":null}},{"id":"dep242-6-2-5","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":5,"code":"6-2-5","title":"전파해야 믿게 되므로","ref":{"book":"Rom","chapter":10,"verses":[{"start":14}]},"texts":{"ko":"그런즉 저희가 믿지 아니하는 이를 어찌 부르리요 듣지도 못한 이를 어찌 믿으리요 전파하는 자가 없이 어찌 들으리요","en":null}},{"id":"dep242-6-2-6","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":6,"code":"6-2-6","title":"모든 사람이 구원받길 원하시므로","ref":{"book":"1Tim","chapter":2,"verses":[{"start":4}]},"texts":{"ko":"하나님은 모든 사람이 구원을 받으며 진리를 아는데 이르기를 원하시느니라","en":null}},{"id":"dep242-6-2-7","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":7,"code":"6-2-7","title":"사람을 가장 아끼시므로","ref":{"book":"Jonah","chapter":4,"verses":[{"start":10,"end":11}]},"texts":{"ko":"여호와께서 가라사대 네가 수고도 아니하였고 배양도 아니하였고 하룻밤에 났다가 하룻밤에 망한 이 박 넝쿨을 네가 아꼈거든 하물며 이 큰 성읍, 니느웨에는 좌우를 분변치 못하는 자가 십 이만 여명이요 육축도 많이 있나니 내가 아끼는 것이 어찌 합당치 아니하냐","en":null}},{"id":"dep242-6-2-8","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":8,"code":"6-2-8","title":"죄인 하나의 회개를 기뻐하시므로","ref":{"book":"Luke","chapter":15,"verses":[{"start":7}]},"texts":{"ko":"내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라","en":null}},{"id":"dep242-6-2-9","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":9,"code":"6-2-9","title":"주 안에서의 축복된 교제를 위해","ref":{"book":"1John","chapter":1,"verses":[{"start":3}]},"texts":{"ko":"우리가 보고 들은 바를 너희에게도 전함은 너희로 우리와 사귐이 있게 하려 함이니 우리의 사귐은 아버지와 그 아들 예수 그리스도와 함께 함이라","en":null}},{"id":"dep242-6-2-10","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":10,"code":"6-2-10","title":"영원한 영광이 있음","ref":{"book":"Dan","chapter":12,"verses":[{"start":3}]},"texts":{"ko":"지혜 있는 자는 궁창의 빛과 같이 빛날 것이요 많은 사람을 옳은데로 돌아오게 한 자는 별과 같이 영원토록 비취리라","en":null}},{"id":"dep242-6-3-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":1,"code":"6-3-1","title":"먼저 주님을 따를 것","ref":{"book":"Matt","chapter":4,"verses":[{"start":19}]},"texts":{"ko":"말씀하시되 나를 따라 오너라 내가 너희로 사람을 낚는 어부가 되게 하리라 하시니","en":null}},{"id":"dep242-6-3-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":2,"code":"6-3-2","title":"선한 간증의 삶을 살 것","ref":{"book":"Phil","chapter":2,"verses":[{"start":15,"end":16}]},"texts":{"ko":"이는 너희가 흠이 없고 순전하여 어그러지고 거스리는 세대 가운데서 하나님의 흠 없는 자녀로 세상에서 그들 가운데 빛들로 나타내며 생명의 말씀을 밝혀 나의 달음질도 헛되지 아니하고 수고도 헛되지 아니함으로 그리스도의 날에 나로 자랑할 것이 있게 하려 함이라","en":null}},{"id":"dep242-6-3-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":3,"code":"6-3-3","title":"기도할 것","ref":{"book":"Eph","chapter":6,"verses":[{"start":19}]},"texts":{"ko":"또 나를 위하여 구할 것은 내게 말씀을 주사 나로 입을 벌려 복음의 비밀을 담대히 알리게 하옵소서 할 것이니","en":null}},{"id":"dep242-6-3-4","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":4,"code":"6-3-4","title":"대답할 것을 예비할 것","ref":{"book":"1Pet","chapter":3,"verses":[{"start":15}]},"texts":{"ko":"너희 마음에 그리스도를 주로 삼아 거룩하게 하고 너희 속에 있는 소망에 관한 이유를 묻는 자에게는 대답할 것을 항상 예비하되 온유와 두려움으로 하고","en":null}},{"id":"dep242-6-3-5","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":5,"code":"6-3-5","title":"간증을 사용할 것","ref":{"book":"John","chapter":4,"verses":[{"start":39}]},"texts":{"ko":"여자의 말이 그가 나의 행한 모든 것을 내게 말하였다 증거하므로 그 동네 중에 많은 사마리아인이 예수를 믿는지라","en":null}},{"id":"dep242-6-3-6","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":6,"code":"6-3-6","title":"말씀의 능력을 믿고 전할 것","ref":{"book":"Heb","chapter":4,"verses":[{"start":12}]},"texts":{"ko":"하나님의 말씀은 살았고 운동력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 감찰하나니","en":null}},{"id":"dep242-6-3-7","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":7,"code":"6-3-7","title":"말씀의 결과를 믿고 전할 것","ref":{"book":"Isa","chapter":55,"verses":[{"start":11}]},"texts":{"ko":"내 입에서 나가는 말도 헛되이 내게로 돌아오지 아니하고 나의 뜻을 이루며 나의 명하여 보낸 일에 형통하리라","en":null}},{"id":"dep242-6-3-8","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":8,"code":"6-3-8","title":"전도의 초점을 예수님께 둘 것","ref":{"book":"1Cor","chapter":1,"verses":[{"start":23,"end":24}]},"texts":{"ko":"우리는 십자가에 못 박힌 그리스도를 전하니 유대인에게는 거리끼는 것이요 이방인에게는 미련한 것이로되 오직 부르심을 입은 자들에게는 유대인이나 헬라인이나 그리스도는 하나님의 능력이요 하나님의 지혜니라","en":null}},{"id":"dep242-6-3-9","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":9,"code":"6-3-9","title":"능력과 확신으로 전할 것","ref":{"book":"1Thess","chapter":1,"verses":[{"start":5}]},"texts":{"ko":"이는 우리 복음이 말로만 너희에게 이른 것이 아니라 오직 능력과 성령과 큰 확신으로 된 것이니 우리가 너희 가운데서 너희를 위하여 어떠한 사람이 된 것은 너희 아는 바와 같으니라","en":null}},{"id":"dep242-6-3-10","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":10,"code":"6-3-10","title":"영접하도록 도울 것","ref":{"book":"Rom","chapter":10,"verses":[{"start":9,"end":10}]},"texts":{"ko":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라","en":null}},{"id":"dep242-6-3-11","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":11,"code":"6-3-11","title":"미루지 않도록 도울 것","ref":{"book":"2Cor","chapter":6,"verses":[{"start":2}]},"texts":{"ko":"가라사대 내가 은혜 베풀 때에 너를 듣고 구원의 날에 너를 도왔다 하셨으니 보라 지금은 은혜 받을만한 때요 보라 지금은 구원의 날이로다","en":null}},{"id":"dep242-6-3-12","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":12,"code":"6-3-12","title":"구원을 확증토록 할 것","ref":{"book":"2Cor","chapter":13,"verses":[{"start":5}]},"texts":{"ko":"너희가 믿음에 있는가 너희 자신을 시험하고 너희 자신을 확증하라 예수 그리스도께서 너희 안에 계신 줄을 너희가 스스로 알지 못하느냐 그렇지 않으면 너희가 버리운 자니라","en":null}},{"id":"dep242-6-3-13","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":13,"code":"6-3-13","title":"전도 성경공부를 할 것","ref":{"book":"Acts","chapter":17,"verses":[{"start":2,"end":3}]},"texts":{"ko":"바울이 자기의 규례대로 저희에게로 들어가서 세 안식일에 성경을 가지고 강론하며 뜻을 풀어 그리스도가 해를 받고 죽은 자 가운데서 다시 살아야 할것을 증명하고 이르되 내가 너희에게 전하는 이 예수가 곧 그리스도라 하니","en":null}},{"id":"dep242-6-4-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-4","number":1,"code":"6-4-1","title":"바울","ref":{"book":"Acts","chapter":20,"verses":[{"start":24}]},"texts":{"ko":"나의 달려갈 길과 주 예수께 받은 사명 곧 하나님의 은혜의 복음 증거하는 일을 마치려 함에는 나의 생명을 조금도 귀한 것으로 여기지 아니하노라","en":null}},{"id":"dep242-6-4-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-4","number":2,"code":"6-4-2","title":"빌립","ref":{"book":"Acts","chapter":8,"verses":[{"start":29,"end":30}]},"texts":{"ko":"성령이 빌립더러 이르시되 이 병거로 가까이 나아가라 하시거늘 빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느뇨","en":null}},{"id":"dep242-6-4-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-4","number":3,"code":"6-4-3","title":"베드로와 요한","ref":{"book":"Acts","chapter":4,"verses":[{"start":20}]},"texts":{"ko":"우리는 보고 들은 것을 말하지 아니할 수 없다 하니","en":null}},{"id":"dep242-6-5-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":1,"code":"6-5-1","title":"1-1. 하나님의 형상으로 지음받음","ref":{"book":"Gen","chapter":1,"verses":[{"start":27}]},"texts":{"ko":"하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고","en":null}},{"id":"dep242-6-5-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":2,"code":"6-5-2","title":"2-1. 죄로 인해 하나님과 분리됨","ref":{"book":"Isa","chapter":59,"verses":[{"start":1,"end":2}]},"texts":{"ko":"여호와의 손이 짧아 구원치 못하심도 아니요 귀가 둔하여 듣지 못하심도 아니라 오직 너희 죄악이 너희와 너희 하나님 사이를 내었고 너희 죄가 그 얼굴을 가리워서 너희를 듣지 않으시게 함이니","en":null}},{"id":"dep242-6-5-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":3,"code":"6-5-3","title":"3-1. 인간의 상태-죄인","ref":{"book":"Rom","chapter":5,"verses":[{"start":12}]},"texts":{"ko":"이러므로 한 사람으로 말미암아 죄가 세상에 들어오고 죄로 말미암아 사망이 왔나니 이와 같이 모든 사람이 죄를 지었으므로 사망이 모든 사람에게 이르렀느니라","en":null}},{"id":"dep242-6-5-4","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":4,"code":"6-5-4","title":"3-1. 인간의 상태-죄인","ref":{"book":"Rom","chapter":3,"verses":[{"start":23}]},"texts":{"ko":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니","en":null}},{"id":"dep242-6-5-5","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":5,"code":"6-5-5","title":"3-2. 인간의 상태-심판","ref":{"book":"Heb","chapter":9,"verses":[{"start":27}]},"texts":{"ko":"한번 죽는 것은 사람에게 정하신 것이요 그 후에는 심판이 있으리니","en":null}},{"id":"dep242-6-5-6","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":6,"code":"6-5-6","title":"3-2. 인간의 상태-심판","ref":{"book":"2Thess","chapter":1,"verses":[{"start":8,"end":9}]},"texts":{"ko":"하나님을 모르는 자들과 우리 주 예수의 복음을 복종치 않는 자들에게 형벌을 주시리니 이런 자들이 주의 얼굴과 그의 힘의 영광을 떠나 영원한 멸망의 형벌을 받으리로다","en":null}},{"id":"dep242-6-5-7","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":7,"code":"6-5-7","title":"3-3. 인간의 상태-사망","ref":{"book":"Rom","chapter":6,"verses":[{"start":23}]},"texts":{"ko":"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라","en":null}},{"id":"dep242-6-5-8","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":8,"code":"6-5-8","title":"3-3. 인간의 상태-사망","ref":{"book":"Rev","chapter":21,"verses":[{"start":8}]},"texts":{"ko":"그러나 두려워하는 자들과 믿지 아니하는 자들과 흉악한 자들과 살인자들과 행음자들과 술객들과 우상 숭배자들과 모든 거짓말 하는 자들은 불과 유황으로 타는 못에 참예하리니 이것이 둘째 사망이라","en":null}},{"id":"dep242-6-5-9","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":9,"code":"6-5-9","title":"4-1. 인간의 힘으로 구원받지 못함-행위","ref":{"book":"Eph","chapter":2,"verses":[{"start":8,"end":9}]},"texts":{"ko":"너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑치 못하게 함이니라","en":null}},{"id":"dep242-6-5-10","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":10,"code":"6-5-10","title":"4-1. 인간의 힘으로 구원받지 못함-행위","ref":{"book":"Gal","chapter":2,"verses":[{"start":21}]},"texts":{"ko":"내가 하나님의 은혜를 폐하지 아니하노니 만일 의롭게 되는 것이 율법으로 말미암으면 그리스도께서 헛되이 죽으셨느니라","en":null}},{"id":"dep242-6-5-11","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":11,"code":"6-5-11","title":"4-2. 인간의 힘으로 구원받지 못함-종교","ref":{"book":"Acts","chapter":4,"verses":[{"start":12}]},"texts":{"ko":"다른이로서는 구원을 얻을 수 없나니 천하 인간에 구원을 얻을만한 다른 이름을 우리에게 주신 일이 없음이니라 하였더라","en":null}},{"id":"dep242-6-5-12","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":12,"code":"6-5-12","title":"4-3. 인간의 힘으로 구원받지 못함-돈","ref":{"book":"1Pet","chapter":1,"verses":[{"start":18}]},"texts":{"ko":"너희가 알거니와 너희 조상의 유전한 망령된 행실에서 구속된 것은 은이나 금 같이 없어질 것으로 한 것이 아니요","en":null}},{"id":"dep242-6-5-13","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":13,"code":"6-5-13","title":"4-4. 인간의 힘으로 구원받지 못함-신비의 체험","ref":{"book":"1Cor","chapter":1,"verses":[{"start":22,"end":23}]},"texts":{"ko":"유대인은 표적을 구하고 헬라인은 지혜를 찾으나 우리는 십자가에 못 박힌 그리스도를 전하니 유대인에게는 거리끼는 것이요 이방인에게는 미련한 것이로되","en":null}},{"id":"dep242-6-5-14","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":14,"code":"6-5-14","title":"4-5. 인간의 힘으로 구원받지 못함-지혜","ref":{"book":"1Cor","chapter":1,"verses":[{"start":21}]},"texts":{"ko":"하나님의 지혜에 있어서는 이 세상이 자기 지혜로 하나님을 알지 못하는고로 하나님께서 전도의 미련한 것으로 믿는 자들을 구원하시기를 기뻐하셨도다","en":null}},{"id":"dep242-6-5-15","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":15,"code":"6-5-15","title":"4-6. 인간의 힘으로 구원받지 못함-학문과 전통","ref":{"book":"Col","chapter":2,"verses":[{"start":8}]},"texts":{"ko":"누가 철학과 헛된 속임수로 너희를 노략할까 주의하라 이것이 사람의 유전과 세상의 초등 학문을 좇음이요 그리스도를 좇음이 아니니라","en":null}},{"id":"dep242-6-5-16","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":16,"code":"6-5-16","title":"4-7. 인간의 힘으로 구원받지 못함-혈통","ref":{"book":"John","chapter":1,"verses":[{"start":13}]},"texts":{"ko":"이는 혈통으로나 육정으로나 사람의 뜻으로 나지 아니하고 오직 하나님께로서 난 자들이니라","en":null}},{"id":"dep242-6-5-17","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":17,"code":"6-5-17","title":"4-8. 인간의 힘으로 구원받지 못함-육은 무익함","ref":{"book":"John","chapter":3,"verses":[{"start":6,"end":7}]},"texts":{"ko":"육으로 난 것은 육이요 성령으로 난 것은 영이니 내가 네게 거듭나야 하겠다 하는 말을 기이히 여기지 말라","en":null}},{"id":"dep242-6-5-18","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":18,"code":"6-5-18","title":"4-8. 인간의 힘으로 구원받지 못함-육은 무익함","ref":{"book":"John","chapter":6,"verses":[{"start":63}]},"texts":{"ko":"살리는 것은 영이니 육은 무익하니라 내가 너희에게 이른 말이 영이요 생명이라","en":null}},{"id":"dep242-6-5-19","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":19,"code":"6-5-19","title":"5-1. 하나님께로 인도하는 다리","ref":{"book":"1Pet","chapter":3,"verses":[{"start":18}]},"texts":{"ko":"그리스도께서도 한번 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니","en":null}},{"id":"dep242-6-5-20","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":20,"code":"6-5-20","title":"5-2. 독생자를 주심","ref":{"book":"John","chapter":3,"verses":[{"start":16}]},"texts":{"ko":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라","en":null}},{"id":"dep242-6-5-21","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":21,"code":"6-5-21","title":"5-3. 죄를 위해 죽으심","ref":{"book":"Rom","chapter":5,"verses":[{"start":8}]},"texts":{"ko":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라","en":null}},{"id":"dep242-6-5-22","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":22,"code":"6-5-22","title":"5-4. 부활하심","ref":{"book":"1Cor","chapter":15,"verses":[{"start":3,"end":4}]},"texts":{"ko":"내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고 장사 지낸바 되었다가 성경대로 사흘만에 다시 살아나사","en":null}},{"id":"dep242-6-5-23","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":23,"code":"6-5-23","title":"5-5. 모든 죄를 사하심","ref":{"book":"Col","chapter":2,"verses":[{"start":13}]},"texts":{"ko":"또 너희의 범죄와 육체의 무할례로 죽었던 너희를 하나님이 그와 함께 살리시고 우리에게 모든 죄를 사하시고","en":null}},{"id":"dep242-6-5-24","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":24,"code":"6-5-24","title":"6-1. 듣고 믿어야 함","ref":{"book":"John","chapter":5,"verses":[{"start":24}]},"texts":{"ko":"내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라","en":null}},{"id":"dep242-6-5-25","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":25,"code":"6-5-25","title":"6-2. 영접해야 함","ref":{"book":"John","chapter":1,"verses":[{"start":12}]},"texts":{"ko":"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니","en":null}},{"id":"dep242-6-5-26","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":26,"code":"6-5-26","title":"6-2. 영접해야 함","ref":{"book":"Rev","chapter":3,"verses":[{"start":20}]},"texts":{"ko":"볼찌어다 내가 문밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그로 더불어 먹고 그는 나로 더불어 먹으리라","en":null}},{"id":"dep242-6-5-27","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":27,"code":"6-5-27","title":"6-3. 영접 기도","ref":{"book":"Rom","chapter":10,"verses":[{"start":9,"end":10}]},"texts":{"ko":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라","en":null}},{"id":"dep242-7-1-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":1,"code":"7-1-1","title":"창조의 주 되신 그리스도","ref":{"book":"John","chapter":1,"verses":[{"start":2,"end":3}]},"texts":{"ko":"그가 태초에 하나님과 함께 계셨고 만물이 그로 말미암아 지은바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라","en":null}},{"id":"dep242-7-1-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":2,"code":"7-1-2","title":"만물의 주 되신 그리스도","ref":{"book":"Col","chapter":1,"verses":[{"start":16,"end":17}]},"texts":{"ko":"만물이 그에게 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 보좌들이나 주관들이나 정사들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고 또한 그가 만물보다 먼저 계시고 만물이 그 안에 함께 섰느니라.","en":null}},{"id":"dep242-7-1-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":3,"code":"7-1-3","title":"교회의 머리되신 그리스도","ref":{"book":"Col","chapter":1,"verses":[{"start":18}]},"texts":{"ko":"그는 몸인 교회의 머리라 그가 근본이요 죽은 자들 가운데서 먼저 나신 자니 이는 친히 만물의 으뜸이 되려 하심이요","en":null}},{"id":"dep242-7-1-4","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":4,"code":"7-1-4","title":"모든 권세위에 뛰어나신 그리스도","ref":{"book":"Eph","chapter":1,"verses":[{"start":21}]},"texts":{"ko":"모든 정사와 권세와 능력과 주관하는 자와 이 세상뿐 아니라 오는 세상에 일컫는 모든 이름 위에 뛰어나게 하시고","en":null}},{"id":"dep242-7-1-5","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":5,"code":"7-1-5","title":"모든 사람의 주님되신 그리스도","ref":{"book":"Phil","chapter":2,"verses":[{"start":10,"end":11}]},"texts":{"ko":"하늘에 있는 자들과 땅에 있는 자들과 땅 아래 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고 모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라","en":null}},{"id":"dep242-7-1-6","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":6,"code":"7-1-6","title":"산 자와 죽은 자의 주님 되심","ref":{"book":"Rom","chapter":14,"verses":[{"start":9}]},"texts":{"ko":"이를 위하여 그리스도께서 죽었다가 다시 살으셨으니 곧 죽은 자와 산 자의 주가 되려 하심이니라","en":null}},{"id":"dep242-7-1-7","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":7,"code":"7-1-7","title":"피 값으로 우리를 사심","ref":{"book":"1Cor","chapter":6,"verses":[{"start":19,"end":20}]},"texts":{"ko":"너희 몸은 너희가 하나님께로부터 받은바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라. 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라","en":null}},{"id":"dep242-7-1-8","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":8,"code":"7-1-8","title":"헌신의 결단을 할 것","ref":{"book":"2Cor","chapter":5,"verses":[{"start":15}]},"texts":{"ko":"저가 모든 사람을 대신하여 죽으심은 산 자들로 하여금 다시는 저희 자신을 위하여 살지 않고 오직 저희를 대신하여 죽었다가 다시 사신 자를 위하여 살게하려 함이니라","en":null}},{"id":"dep242-7-2-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":1,"code":"7-2-1","title":"필요를 채워주심","ref":{"book":"Matt","chapter":6,"verses":[{"start":33}]},"texts":{"ko":"너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라","en":null}},{"id":"dep242-7-2-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":2,"code":"7-2-2","title":"넘치는 보상","ref":{"book":"Mark","chapter":10,"verses":[{"start":29,"end":30}]},"texts":{"ko":"예수께서 가라사대 내가 진실로 너희에게 이르노니 나와 및 복음을 위하여 집이나 형제나 자매나 어미나 아비나 자식이나 전토를 버린 자는 금세에 있어 집과 형제와 자매와 모친과 자식과 전토를 백배나 받되 핍박을 겸하여 받고 내세에 영생을 받지 못할 자가 없느니라","en":null}},{"id":"dep242-7-2-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":3,"code":"7-2-3","title":"약속을 주심","ref":{"book":"Gen","chapter":22,"verses":[{"start":16,"end":17}]},"texts":{"ko":"가라사대 여호와께서 이르시기를 내가 나를 가리켜 맹세하노니 네가 이같이 행하여 네 아들 네 독자를 아끼지 아니하였은즉 내가 네게 큰 복을 주고 네 씨로 크게 성하여 하늘의 별과 같고 바닷가의 모래와 같게 하리니 네 씨가 그 대적의 문을 얻으리라","en":null}},{"id":"dep242-7-2-4","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":4,"code":"7-2-4","title":"함께해 주심","ref":{"book":"1Chr","chapter":28,"verses":[{"start":9}]},"texts":{"ko":"내 아들 솔로몬아 너는 네 아비의 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길찌어다 여호와께서는 뭇 마음을 감찰하사 모든 사상을 아시나니 네가 저를 찾으면 만날 것이요 버리면 저가 너를 영원히 버리시리라","en":null}},{"id":"dep242-7-2-5","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":5,"code":"7-2-5","title":"능력을 베푸심","ref":{"book":"2Chr","chapter":16,"verses":[{"start":9}]},"texts":{"ko":"여호와의 눈은 온 땅을 두루 감찰하사 전심으로 자기에게 향하는 자를 위하여 능력을 베푸시나니","en":null}},{"id":"dep242-7-2-6","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":6,"code":"7-2-6","title":"보호해 주심","ref":{"book":"Ps","chapter":91,"verses":[{"start":14}]},"texts":{"ko":"하나님이 가라사대 저가 나를 사랑한즉 내가 저를 건지리라 저가 내 이름을 안즉 내가 저를 높이리라","en":null}},{"id":"dep242-7-2-7","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":7,"code":"7-2-7","title":"귀히 여겨 주심","ref":{"book":"1Sam","chapter":2,"verses":[{"start":30}]},"texts":{"ko":"나를 존중히 여기는 자를 내가 존중히 여기고 나를 멸시하는 자를 내가 경멸히 여기리라","en":null}},{"id":"dep242-7-3-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":1,"code":"7-3-1","title":"자기 자신","ref":{"book":"Luke","chapter":9,"verses":[{"start":23}]},"texts":{"ko":"또 무리에게 이르시되 아무든지 나를 따라 오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 좇을 것이니라","en":null}},{"id":"dep242-7-3-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":2,"code":"7-3-2","title":"대인 관계","ref":{"book":"Prov","chapter":16,"verses":[{"start":7}]},"texts":{"ko":"사람의 행위가 여호와를 기쁘시게 하면 그 사람의 원수라도 그로 더불어 화목하게 하시느니라","en":null}},{"id":"dep242-7-3-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":3,"code":"7-3-3","title":"장래 진로","ref":{"book":"Prov","chapter":3,"verses":[{"start":5,"end":6}]},"texts":{"ko":"너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라","en":null}},{"id":"dep242-7-3-4","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":4,"code":"7-3-4","title":"세상 욕심","ref":{"book":"Eph","chapter":4,"verses":[{"start":22},{"start":24}]},"texts":{"ko":"너희는 유혹의 욕심을 따라 썩어져 가는구습을 좇는 옛 사람을 벗어버리고 오직 심령으로 새롭게 되어 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라","en":null}},{"id":"dep242-7-3-5","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":5,"code":"7-3-5","title":"정욕","ref":{"book":"2Tim","chapter":2,"verses":[{"start":22}]},"texts":{"ko":"또한 네가 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 좇으라","en":null}},{"id":"dep242-7-3-6","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":6,"code":"7-3-6","title":"재물","ref":{"book":"1Tim","chapter":6,"verses":[{"start":7},{"start":9}]},"texts":{"ko":"우리가 세상에 아무것도 가지고 온 것이 없으매 또한 아무것도 가지고 가지 못하리니 우리가 먹을 것과 입을 것이 있은즉 족한 줄로 알 것이니라 부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 정욕에 떨어지나니 곧 사람으로 침륜과 멸망에 빠지게 하는 것이라","en":null}},{"id":"dep242-7-3-7","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":7,"code":"7-3-7","title":"시간 사용","ref":{"book":"Eph","chapter":5,"verses":[{"start":15,"end":16}]},"texts":{"ko":"그런즉 너희가 어떻게 행할 것을 자세히 주의하여 지혜없는 자 같이 말고 오직 지혜 있는 자 같이 하여 세월을 아끼라 때가 악하니라","en":null}},{"id":"dep242-7-3-8","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":8,"code":"7-3-8","title":"부르심","ref":{"book":"Mark","chapter":1,"verses":[{"start":20}]},"texts":{"ko":"곧 부르시니 그 아비 세베대를 삯군들과 함께 배에 버려 두고 예수를 따라가니라","en":null}},{"id":"dep242-7-4-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-4","number":1,"code":"7-4-1","title":"1, 바울","ref":{"book":"Phil","chapter":1,"verses":[{"start":20}]},"texts":{"ko":"나의 간절한 기대와 소망을 따라 아무 일에든지 부끄럽지 아니하고 오직 전과 같이 이제도 온전히 담대하여 살든지 죽든지 내 몸에서 그리스도가 존귀히 되게 하려 하나니","en":null}},{"id":"dep242-7-4-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-4","number":2,"code":"7-4-2","title":"디모데","ref":{"book":"Phil","chapter":2,"verses":[{"start":21,"end":22}]},"texts":{"ko":"저희가 다 자기 일을 구하고 그리스도 예수의 일을 구하지 아니하되 디모데의 연단을 너희가 아나니 자식이 아비에게 함같이 나와 함께 복음을 위하여 수고하였느니라","en":null}},{"id":"dep242-7-4-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-4","number":3,"code":"7-4-3","title":"믿음의 용사들","ref":{"book":"Heb","chapter":11,"verses":[{"start":36},{"start":38,"suffix":"상"}]},"texts":{"ko":"또 어떤이들은 희롱과 채찍질 뿐아니라 결박과 옥에 갇히는 시험도 받았으며 돌로 치는 것과 톱으로 켜는 것과 시험과 칼에 죽는 것을 당하고 양과 염소의 가죽을 입고 유리하여 궁핍과 환난과 학대를 받았으니(이런 사람은 세상이 감당치 못하도다)","en":null}},{"id":"dep242-8-1","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":1,"code":"8-1","title":"세계를 위한 하나님의 관심과 약속","ref":{"book":"Gen","chapter":12,"verses":[{"start":2,"end":3}]},"texts":{"ko":"내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대케 하리니 너는 복의 근원이 될찌라 너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 내가 저주하리니 땅의 모든 족속이 너를 인하여 복을 얻을 것이니라 하신지라","en":null}},{"id":"dep242-8-2","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":2,"code":"8-2","title":"세계를 위한 하나님의 관심과 약속","ref":{"book":"Isa","chapter":49,"verses":[{"start":6}]},"texts":{"ko":"그가 가라사대 네가 나의 종이 되어 야곱의 지파들을 일으키며 이스라엘 중에 보전된 자를 돌아오게 할 것은 오히려 경한 일이라 내가 또 너로 이방의 빛을 삼아 나의 구원을 베풀어서 땅 끝까지 이르게 하리라","en":null}},{"id":"dep242-8-3","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":3,"code":"8-3","title":"지상사명","ref":{"book":"Matt","chapter":28,"verses":[{"start":19,"end":20}]},"texts":{"ko":"그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼찌어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라","en":null}},{"id":"dep242-8-4","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":4,"code":"8-4","title":"지상사명","ref":{"book":"Acts","chapter":1,"verses":[{"start":8}]},"texts":{"ko":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","en":null}},{"id":"dep242-8-5","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":5,"code":"8-5","title":"선교에 헌신할 것","ref":{"book":"Isa","chapter":6,"verses":[{"start":8}]},"texts":{"ko":"내가 또 주의 목소리를 들은즉 이르시되 내가 누구를 보내며 누가 우리를 위하여 갈꼬 그 때에 내가 가로되 내가 여기 있나이다 나를 보내소서","en":null}},{"id":"dep242-8-6","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":6,"code":"8-6","title":"선교에 헌신할 것","ref":{"book":"Rom","chapter":15,"verses":[{"start":16}]},"texts":{"ko":"이 은혜는 곧 나로 이방인을 위하여 그리스도 예수의 일군이 되어 하나님의 복음의 제사장 직무를 하게 하사 이방인을 제물로 드리는 그것이 성령 안에서 거룩하게 되어 받으심직하게 하려 하심이라","en":null}},{"id":"dep242-8-7","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":7,"code":"8-7","title":"세계를 위해 기도할 것","ref":{"book":"Ps","chapter":2,"verses":[{"start":8}]},"texts":{"ko":"내게 구하라 내가 열방을 유업으로 주리니 네 소유가 땅 끝까지 이르리로다","en":null}},{"id":"dep242-8-8","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":8,"code":"8-8","title":"세계를 위해 기도할 것","ref":{"book":"Ps","chapter":57,"verses":[{"start":5}]},"texts":{"ko":"하나님이여 주는 하늘 위에 높이 들리시며 주의 영광은 온 세계 위에 높아지기를 원하나이다","en":null}},{"id":"dep242-8-9","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":9,"code":"8-9","title":"전도할 것","ref":{"book":"Titus","chapter":1,"verses":[{"start":2,"end":3}]},"texts":{"ko":"영생의 소망을 인함이라 이 영생은 거짓이 없으신 하나님이 영원한 때 전부터 약속하신 것인데 자기 때에 자기의 말씀을 전도로 나타내셨으니 이 전도는 우리 구주 하나님의 명대로 내게 맡기신 것이라","en":null}},{"id":"dep242-8-10","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":10,"code":"8-10","title":"전도할 것","ref":{"book":"2Tim","chapter":4,"verses":[{"start":17}]},"texts":{"ko":"주께서 내 곁에 서서 나를 강건케 하심은 나로 말미암아 전도의 말씀이 온전히 전파되어 이방인으로 듣게 하려 하심이니 내가 사자의 입에서 건지웠느니라","en":null}},{"id":"dep242-8-11","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":11,"code":"8-11","title":"성장을 도울 것","ref":{"book":"Col","chapter":1,"verses":[{"start":28,"end":29}]},"texts":{"ko":"우리가 그를 전파하여 각 사람을 권하고 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 안에서 완전한 자로 세우려 함이니 이를 위하여 나도 내 속에서 능력으로 역사하시는 이의 역사를 따라 힘을 다하 기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라","tms60-A-3":"그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라","tms60-A-4":"나의 계명을 지키는 자라야 나를 사랑하는 자니 나를 사랑하는 자는 내 아버지께 사랑을 받을 것이요 나도 그를 사랑하여 그에게 나를 나타내리라","tms60-A-5":"모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니","tms60-A-6":"이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기록된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라","tms60-A-7":"너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라 그리하면 이루리라","tms60-A-8":"아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라","tms60-A-9":"두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라","tms60-A-10":"서로 돌아보아 사랑과 선행을 격려하며 모이기를 폐하는 어떤 사람들의 습관과 같이 하지 말고 오직 권하여 그 날이 가까움을 볼수록 더욱 그리하자","tms60-A-11":"말씀하시되 나를 따라오라 내가 너희를 사람을 낚는 어부가 되게 하리라 하시니","tms60-A-12":"내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 먼저는 유대인에게요 그리고 헬라인에게로다","tms60-B-1":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니","tms60-B-2":"우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다","tms60-B-3":"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라","tms60-B-4":"한번 죽는 것은 사람에게 정해진 것이요 그 후에는 심판이 있으리니","tms60-B-5":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라","tms60-B-6":"그리스도께서도 단번에 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니","tms60-B-7":"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라","tms60-B-8":"우리를 구원하시되 우리가 행한 바 의로운 행위로 말미암지 아니하고 오직 그의 긍휼하심을 따라 중생의 씻음과 성령의 새롭게 하심으로 하셨나니","tms60-B-9":"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니","tms60-B-10":"볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라","tms60-B-11":"내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓰는 것은 너희로 하여금 너희에게 영생이 있음을 알게 하려 함이라","tms60-B-12":"내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라","tms60-C-1":"너희는 너희가 하나님의 성전인 것과 하나님의 성령이 너희 안에 계시는 것을 알지 못하느냐","tms60-C-2":"우리가 세상의 영을 받지 아니하고 오직 하나님으로부터 온 영을 받았으니 이는 우리로 하여금 하나님께서 우리에게 은혜로 주신 것들을 알게 하려 하심이라","tms60-C-3":"두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라","tms60-C-4":"내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라","tms60-C-5":"여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다","tms60-C-6":"하나님은 사람이 아니시니 거짓말을 하지 않으시고 인생이 아니시니 후회가 없으시도다 어찌 그 말씀하신 바를 행하지 않으시며 하신 말씀을 실행하지 않으시랴","tms60-C-7":"주께서 심지가 견고한 자를 평강하고 평강하도록 지키시리니 이는 그가 주를 신뢰함이니이다","tms60-C-8":"너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라","tms60-C-9":"자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 주시지 아니하겠느냐","tms60-C-10":"나의 하나님이 그리스도 예수 안에서 영광 가운데 그 풍성한 대로 너희 모든 쓸 것을 채우시리라","tms60-C-11":"그가 시험을 받아 고난을 당하셨은즉 시험 받는 자들을 능히 도우실 수 있느니라","tms60-C-12":"청년이 무엇으로 그의 행실을 깨끗하게 하리이까 주의 말씀만 지킬 따름이니이다 내가 주께 범죄하지 아니하려 하여 주의 말씀을 내 마음에 두었나이다","tms60-D-1":"그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라","tms60-D-2":"또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 따를 것이니라","tms60-D-3":"이 세상이나 세상에 있는 것들을 사랑하지 말라 누구든지 세상을 사랑하면 아버지의 사랑이 그 안에 있지 아니하니 이는 세상에 있는 모든 것이 육신의 정욕과 안목의 정욕과 이생의 자랑이니 다 아버지께로부터 온 것이 아니요 세상으로부터 온 것이라","tms60-D-4":"너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라","tms60-D-5":"그러므로 내 사랑하는 형제들아 견실하며 흔들리지 말고 항상 주의 일에 더욱 힘쓰는 자들이 되라 이는 너희 수고가 주 안에서 헛되지 않은 줄 앎이라","tms60-D-6":"너희가 피곤하여 낙심하지 않기 위하여 죄인들이 이같이 자기에게 거역한 일을 참으신 이를 생각하라","tms60-D-7":"인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라","tms60-D-8":"우리는 우리를 전파하는 것이 아니라 오직 그리스도 예수의 주 되신 것과 또 예수를 위하여 우리가 너희의 종 된 것을 전파함이라","tms60-D-9":"네 재물과 네 소산물의 처음 익은 열매로 여호와를 공경하라 그리하면 네 창고가 가득히 차고 네 포도즙 틀에 새 포도즙이 넘치리라","tms60-D-10":"이것이 곧 적게 심는 자는 적게 거두고 많이 심는 자는 많이 거둔다 하는 말이로다 각각 그 마음에 정한 대로 할 것이요 인색함으로나 억지로 하지 말지니 하나님은 즐겨 내는 자를 사랑하시느니라","tms60-D-11":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","tms60-D-12":"그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 침례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 \" \" 함께 있으리라 하시니라","tms60-E-1":"새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라 너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인 줄 알리라","tms60-E-2":"자녀들아 우리가 말과 혀로만 사랑하지 말고 행함과 진실함으로 하자","tms60-E-3":"아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고 각각 자기 일을 돌볼뿐더러 또한 각각 다른 사람들의 일을 돌보아 나의 기쁨을 충만하게 하라","tms60-E-4":"젊은 자들아 이와 같이 장로들에게 순종하고 다 서로 겸손으로 허리를 동이라 하나님은 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라 그러므로 하나님의 능하신 손 아래서 겸손하라 때가 되면 너희를 높이시리라","tms60-E-5":"음행과 온갖 더러운 것과 탐욕은 너희 중에서 그 이름조차도 부르지 말라 이는 성도에게 마땅한 바니라","tms60-E-6":"사랑하는 자들아 거류민과 나그네 같은 너희를 권하노니 영혼을 거슬러 싸우는 육체의 정욕을 제어하라","tms60-E-7":"너희는 도적질하지 말며 속이지 말며 서로 거짓말하지 말며","tms60-E-8":"이것으로 말미암아 나도 하나님과 사람에 대하여 항상 \" 양심에 거리낌이 없기를 힘쓰나이다","tms60-E-9":"믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라","tms60-E-10":"믿음이 없어 하나님의 약속을 의심하지 않고 믿음으로 견고하여져서 하나님께 영광을 돌리며 약속하신 그것을 또한 능히 이루실 줄을 확신하였으니","tms60-E-11":"우리가 선을 행하되 낙심하지 말지니 포기하지 아니하면 때가 이르매 거두리라 그러므로 우리는 기회 있는 대로 모든 이에게 착한 일을 하되 더욱 믿음의 가정들에게 할지니라","tms60-E-12":"이같이 너희 빛이 사람 앞에 비치게 하여 그들로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라","tms180-s1-1-1":"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라","tms180-s1-1-2":"아들에 관하여는 하나님이여 주의 보좌는 영영하며 주의 나라의 규는 공평한 규이니이다","tms180-s1-1-3":"우리에게 있는 대제사장은 우리의 연약함을 동정하지 못하실 이가 아니요 모든 일에 우리와 똑같이 시험을 받으신 이로되 죄는 없으시니라","tms180-s1-1-4":"예수는 지혜와 키가 자라가며 하나님과 사람에게 더욱 사랑스러워 가시더라","tms180-s1-1-5":"내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고 장사 지낸 바 되셨다가 성경대로 사흘 만에 다시 살아나사","tms180-s1-1-6":"그러나 이제 그리스도께서 죽은 자 가운데서 다시 살아나사 잠자는 자들의 첫 열매가 되셨도다","tms180-s1-1-7":"본래 하나님을 본 사람이 없으되 아버지 품 속에 있는 독생하신 하나님이 나타내셨느니라","tms180-s1-1-8":"이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결하게 하는 일을 하시고 높은 곳에 계신 지극히 크신 이의 우편에 앉으셨느니라","tms180-s1-1-9":"인자가 온 것은 잃어버린 자를 찾아 구원하려 함이니라","tms180-s1-1-10":"너희가 알거니와 너희 조상이 물려 준 헛된 행실에서 대속함을 받은 은이나 금 같이 없어질 것으로 된 것이 아니요 오직 흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피로 된 것이니라","tms180-s1-1-11":"주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고 그 후에 우리 살아 남은 자들도 그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라","tms180-s1-1-12":"사랑하는 자들아 우리가 지금은 하나님의 자녀라 장래에 어떻게 될지는 아직 나타나지 아니하였으나 그가 나타나시면 우리가 그와 같을 줄을 아는 것은 그의 참모습 그대로 볼 것이기 때문이니 주를 향하여 이 소망을 가진 자마다 그의 깨끗하심과 같이 자기를 깨끗하게 하느니라","tms180-s1-2-1":"그러나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 스스로 말하지 않고 오직 들은 것을 말하며 장래 일을 너희에게 알리시리라 그가 내 영광을 나타내리니 내 것을 가지고 너희에게 알리시겠음이라","tms180-s1-2-2":"그러므로 내가 너희에게 알리노니 하나님의 영으로 말하는 자는 누구든지 예수를 저주할 자라 하지 아니하고 또 성령으로 아니하고는 누구든지 예수를 주시라 할 수 없느니라","tms180-s1-2-3":"만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라","tms180-s1-2-4":"너희가 아들이므로 하나님이 그 아들의 영을 우리 마음 가운데 보내사 아빠 아버지라 부르게 하셨느니라","tms180-s1-2-5":"술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라","tms180-s1-2-6":"내가 이르노니 너희는 성령을 따라 행하라 그리하면 육체의 욕심을 이루지 아니하리라","tms180-s1-2-7":"기록된 바 하나님이 자기를 사랑하는 자들을 위하여 예비하신 모든 것은 눈으로 보지 못하고 귀로 듣지 못하고 사람의 마음으로 생각하지도 못하였다 함과 같으니라 오직 하나님이 성령으로 이것을 우리에게 보이셨으니 성령은 모든 것 곧 하나님의 깊은 것까지도 통달하시느니라","tms180-s1-2-8":"보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치고 내가 너희에게 말한 모든 것을 생각나게 하리라","tms180-s1-2-9":"내 말과 내 전도함이 설득력 있는 지혜의 말로 하지 아니하고 다만 성령의 나타나심과 능력으로 하여 너희 믿음이 사람의 지혜에 있지 아니하고 다만 하나님의 능력에 있게 하려 하였노라","tms180-s1-2-10":"이는 우리 복음이 너희에게 말로만 이른 것이 아니라 또한 능력과 성령과 큰 확신으로 된 것임이라 우리가 너희 가운데서 너희를 위하여 어떤 사람이 된 것은 너희가 아는 바와 같으니라","tms180-s1-2-11":"이 모든 일은 같은 한 성령이 행하사 그의 뜻대로 각 사람에게 나누어 주는 것이니라","tms180-s1-2-12":"은사는 여러 가지나 성령은 같고 또 사역은 여러 가지나 모든 것을 모든 사람 가운데서 이루시는 하나님은 같으니","tms180-s1-3-1":"슬프도소이다 주 여호와여 주께서 큰 능력과 펴신 팔로 천지를 지으셨사오니 주에게는 할 수 없는 일이 없으시니이다","tms180-s1-3-2":"깊도다 하나님의 지혜와 지식의 풍성함이여, 그의 판단은 헤아리지 못할 것이며 그의 길은 찾지 못할 것이로다","tms180-s1-3-3":"여호와의 말씀이니라 사람이 내게 보이지 아니하려고 누가 자신을 은밀한 곳에 숨길 수 있겠느냐 여호와가 말하노라 나는 천지에 충만하지 아니하냐","tms180-s1-3-4":"하나님이 능히 모든 은혜를 너희에게 넘치게 하시나니 이는 너희로 모든 일에 항상 모든 것이 넉넉하여 모든 착한 일을 넘치게 하게 하려 하심이라","tms180-s1-3-5":"여호와여 위대하심과 권능과 영광과 승리와 위엄이 다 주께 속하였사오니 천지에 있는 것이 다 주의 것이로소이다 여호와여 주권도 주께 속하였사오니 주는 높으사 만물의 머리이심이니이다 우리 하나님이여 이제 우리가 주께 감사하오며 주의 영화로운 이름을 찬양하나이다","tms180-s1-3-6":"주는 미쁘사 너희를 굳건하게 하시고 악한 자에게서 지키시리라","tms180-s1-3-7":"하나님은 영이시니 예배하는 자가 영과 진리로 예배할지니라","tms180-s1-3-8":"오직 너희를 부르신 거룩한 이처럼 너희도 모든 행실에 거룩한 자가 되라 기록하였으되 내가 거룩하니 너희도 거룩할지어다 하셨느니라","tms180-s1-3-9":"여호와는 위대하시니 크게 찬양할 것이라 그의 위대하심을 측량하지 못하리로다","tms180-s1-3-10":"사랑은 여기 있으니 우리가 하나님을 사랑한 것이 아니요 하나님이 우리를 사랑하사 우리 죄를 속하기 위하여 화목 제물로 그 아들을 보내셨음이라","tms180-s1-3-11":"그러나 주여 주는 긍휼히 여기시며 은혜를 베푸시며 노하기를 더디하시며 인자와 진실이 풍성하신 하나님이시오니","tms180-s1-3-12":"우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라","tms180-s2-1-1":"오직 사랑 안에서 참된 것을 하여 범사에 그에게까지 자랄지라 그는 머리니 곧 그리스도라","tms180-s2-1-2":"너희가 서로 거짓말을 하지 말라 옛 사람과 그 행위를 벗어 버리고","tms180-s2-1-3":"허물을 덮어 주는 자는 사랑을 구하는 자요 그것을 거듭 말하는 자는 친한 벗을 이간하는 자니라","tms180-s2-1-4":"두루 다니며 한담하는 자는 남의 비밀을 누설하나 마음이 신실한 자는 그런 것을 숨기느니라","tms180-s2-1-5":"그리하면 내가 마땅히 할 말로써 이 비밀을 나타내리라 너희 말을 항상 은혜 가운데서 소금으로 맛을 냄과 같이 하라 그리하면 각 사람에게 마땅히 대답할 것을 알리라","tms180-s2-1-6":"유순한 대답은 분노를 쉬게 하여도 과격한 말은 노를 격동하느니라","tms180-s2-1-7":"이러므로 너희 죄를 서로 고하며 병낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 큼이니라","tms180-s2-1-8":"그러므로 예물을 제단에 드리다가 거기서 네 형제에게 원망들을 만한 \" 일이 있는 것이 생각나거든 예물을 제단 앞에 두고 먼저 가서 형제와 화목하고 그 후에 와서 예물을 드리라","tms180-s2-1-9":"내 사랑하는 형제들아 너희가 알지니 사람마다 듣기는 속히 하고 말하기는 더디 하며 성내기도 더디 하라","tms180-s2-1-10":"사연을 듣기 전에 대답하는 자는 미련하여 욕을 당하느니라","tms180-s2-1-11":"거만한 자를 책망하지 말라 그가 너를 미워할까 두려우니라 지혜 있는 자를 책망하라 그가 너를 사랑하리라 지혜 있는 자에게 교훈을 더하라 그가 더욱 지혜로워질 것이요 의로운 사람을 가르치라 그의 학식이 더하리라","tms180-s2-1-12":"네 형제가 죄를 범하거든 가서 너와 그 사람과만 상대하여 권고하라 만일 들으면 네가 네 형제를 얻은 것이요","tms180-s2-2-1":"서로 친절하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라","tms180-s2-2-2":"누가 누구에게 불만이 있거든 서로 용납하여 피차 용서하되 주께서 너희를 용서하신 것 같이 너희도 그리하고","tms180-s2-2-3":"모든 겸손과 온유로 하고 오래 참음으로 사랑 가운데서 서로 용납하고","tms180-s2-2-4":"주의 종은 마땅히 다투지 아니하고 모든 사람에 대하여 온유하며 가르치기를 잘하며 참으며 거역하는 자를 온유함으로 훈계할지니 혹 하나님이 그들에게 회개함을 주사 진리를 알게 하실까 하며","tms180-s2-2-5":"분을 내어도 죄를 짓지 말며 해가 지도록 분을 품지 말고","tms180-s2-2-6":"이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 너희 입의 부끄러운 말이라","tms180-s2-2-7":"너희는 하나님의 은혜에 이르지 못하는 자가 없도록 하고 또 쓴 뿌리가 나서 '' 괴롭게 하여 많은 사람이 이로 말미암아 더럽게 되지 않게 하며","tms180-s2-2-8":"너희는 모든 악독과 노함과 분냄과 떠드는 것과 비방하는 것을 모든 악의와 함께 버리고","tms180-s2-2-9":"죄가 있어 매를 맞고 참으면 무슨 칭찬이 있으리요 그러나 선을 행함으로 고난을 받고 참으면 이는 하나님 앞에 아름다우니라 이를 위하여 너희가 부르심을 받았으니 그리스도도 너희를 위하여 고난을 받으사 너희에게 본을 끼쳐 그 자취를 따라오게 하려 하셨느니라","tms180-s2-2-10":"내 사랑하는 자들아 너희가 친히 원수를 갚지 말고 하나님의 진노하심에 맡기라 기록되었으되 원수 갚는 것이 내게 있으니 내가 갚으리라고 주께서 말씀하시니라","tms180-s2-2-11":"분은 잔인하고 노는 창수 같거니와 투기 앞에야 누가 서리요","tms180-s2-2-12":"시기와 다툼이 있는 곳에는 혼란과 모든 악한 일이 있음이라","tms180-s2-3-1":"이제 인내와 위로의 하나님이 너희로 그리스도 예수를 본받아 서로 뜻이 같게 하여 주사 한마음과 한 입으로 하나님 곧 우리 주 예수 그리스도의 아버지께 영광을 돌리게 하려 하노라","tms180-s2-3-2":"형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 모두가 같은 말을 하고 너희 가운데 분쟁이 없이 같은 마음과 같은 뜻으로 온전히 합하라","tms180-s2-3-3":"너희 중에는 그렇지 않아야 하나니 너희 중에 누구든지 \" 크고자 하는 자는 너희를 섬기는 자가 되고 너희 중에 누구든지 \" 으뜸이 되고자 하는 자는 너희의 종이 되어야 하리라","tms180-s2-3-4":"형제들아 너희가 자유를 위하여 부르심을 입었으나 그러나 그 자유로 육체의 기회를 삼지 말고 오직 사랑으로 서로 종 노릇 하라","tms180-s2-3-5":"우리 각 사람이 이웃을 기쁘게 하되 선을 이루고 덕을 세우도록 할지니라","tms180-s2-3-6":"아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고 각각 자기 일을 돌볼뿐더러 또한 각각 다른 사람들의 일을 돌보아 나의 기쁨을 충만하게 하라","tms180-s2-3-7":"그러므로 피차 권면하고 서로 덕을 세우기를 너희가 하는 것 같이 하라","tms180-s2-3-8":"두 사람이 한 사람보다 나음은 그들이 수고함으로 좋은 상을 얻을 것임이라 혹시 그들이 넘어지면 하나가 그 동무를 붙들어 일으키려니와 홀로 있어 넘어지고 붙들어 일으킬 자가 없는 자에게는 화가 있으리라","tms180-s2-3-9":"무리를 보시고 불쌍히 여기시니 이는 그들이 목자 없는 '' 양과 같이 고생하며 기진함이라","tms180-s2-3-10":"즐거워하는 자들과 함께 즐거워하고 우는 자들과 함께 울라","tms180-s2-3-11":"오직 위로부터 난 지혜는 첫째 성결하고 다음에 화평하고 관용하고 양순하며 긍휼과 선한 열매가 가득하고 편견과 거짓이 없나니","tms180-s2-3-12":"형제들아 사람이 만일 무슨 범죄한 일이 드러나거든 신령한 너희는 온유한 심령으로 그러한 자를 바로잡고 너 자신을 살펴보아 너도 시험을 받을까 두려워하라","tms180-s3-1-1":"그의 신기한 능력으로 생명과 경건에 속한 모든 것을 우리에게 주셨으니 이는 자기의 영광과 덕으로써 우리를 부르신 이를 앎으로 말미암음이라 이로써 그 보배롭고 지극히 큰 약속을 우리에게 주사 이 약속으로 말미암아 너희가 정욕 때문에 세상에서 썩어질 것을 피하여 신성한 성품에 참여하는 자가 되게 하려 하셨느니라","tms180-s3-1-2":"하나님의 약속은 얼마든지 그리스도 안에서 예가 되니 그런즉 그로 말미암아 우리가 아멘 하여 하나님께 영광을 돌리게 되느니라","tms180-s3-1-3":"찬송하리로다 그는 우리 주 예수 그리스도의 하나님이시요 자비의 아버지시요 모든 위로의 하나님이시며 우리의 모든 환난 중에서 우리를 위로하사 우리로 하여금 하나님께 받는 위로로써 모든 환난 중에 있는 자들을 능히 위로하게 하시는 이시로다","tms180-s3-1-4":"그런즉 심는 이나 물 주는 이는 아무 것도 아니로되 오직 자라나게 하시는 이은 하나님뿐이니라 심는 이와 물 주는 이는 한가지이나 각각 자기가 일한 대로 자기의 상을 받으리라","tms180-s3-1-5":"오직 여호와의 율법을 즐거워하여 그의 율법을 주야로 묵상하는도다 그는 시냇가에 심은 나무가 철을 따라 열매를 맺으며 그 잎사귀가 마르지 아니함 같으니 그가 하는 모든 일이 다 형통하리로다","tms180-s3-1-6":"이런 것이 너희에게 있어 흡족한즉 너희로 우리 주 예수 그리스도를 알기에 게으르지 않고 열매 없는 자가 되지 않게 하려니와","tms180-s3-1-7":"모든 은혜의 하나님 곧 그리스도 안에서 너희를 부르사 자기의 영원한 영광에 들어가게 하신 이가 잠깐 고난을 당한 너희를 친히 온전하게 하시며 굳건하게 하시며 강하게 하시며 터를 견고하게 하시리라","tms180-s3-1-8":"나에게 이르시기를 내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라 하신지라 이러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 그리스도의 능력이 내게 머물게 하려 함이라","tms180-s3-1-9":"찬송하리로다 하나님 곧 우리 주 예수 그리스도의 아버지께서 그리스도 안에서 하늘에 속한 모든 신령한 복을 우리에게 주시되","tms180-s3-1-10":"또 여호와를 기뻐하라 그가 네 마음의 소원을 네게 이루어 주시리로다 네 길을 여호와께 맡기라 그를 의지하면 그가 이루시고","tms180-s3-1-11":"나의 자녀들아 내가 이것을 너희에게 씀은 너희로 죄를 범하지 않게 하려 함이라 만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니 곧 의로우신 예수 그리스도시라 그는 우리 죄를 위한 화목 제물이니 우리만 위할 뿐 아니요 온 세상의 죄를 위하심이라","tms180-s3-1-12":"동이 서에서 먼 것 같이 우리의 죄과를 우리에게서 멀리 옮기셨으며","tms180-s3-2-1":"하나님의 말씀은 살아 있고 활력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 판단하나니","tms180-s3-2-2":"이는 비와 눈이 하늘로부터 내려서 그리로 되돌아가지 아니하고 땅을 적셔서 소출이 나게 하며 싹이 나게 하며 파종하는 자에게는 종자를 주며 먹는 자에게는 양식을 줌과 같이 내 입에서 나가는 말도 이와 같이 헛되이 내게로 되돌아오지 아니하고 나의 기뻐하는 뜻을 이루며 내가 보낸 일에 형통함이니라","tms180-s3-2-3":"먼저 알 것은 성경의 모든 예언은 사사로이 풀 것이 아니니 예언은 언제든지 사람의 뜻으로 낸 것이 아니요 오직 성령의 감동하심을 받은 사람들이 하나님께 받아 말한 것임이라","tms180-s3-2-4":"이러므로 우리가 하나님께 끊임없이 감사함은 너희가 우리에게 들은 바 하나님의 말씀을 받을 때에 사람의 말로 받지 아니하고 하나님의 말씀으로 받음이니 진실로 그러하도다 이 말씀이 또한 너희 믿는 자 가운데에서 역사하느니라","tms180-s3-2-5":"만군의 하나님 여호와시여 나는 주의 이름으로 일컬음을 받는 자라 내가 주의 말씀을 얻어 먹었사오니 주의 말씀은 내게 기쁨과 내 마음의 즐거움이오나","tms180-s3-2-6":"내가 그의 입술의 명령을 어기지 아니하고 정한 음식보다 그의 입의 말씀을 귀히 여겼도나","tms180-s3-2-7":"베뢰아에 있는 사람들은 데살로니가에 있는 사람들보다 더 너그러워서 간절한 마음으로 말씀을 받고 이것이 그러한가 하여 날마다 성경을 상고하므로","tms180-s3-2-8":"너희가 성경에서 영생을 얻는 줄 생각하고 성경을 연구하거니와 이 성경이 곧 내게 대하여 증언하는 것이니다 그러나 너희가 영생을 얻기 위하여 내게 오기를 원하지 아니하는도다","tms180-s3-2-9":"그러므로 예수께서 자기를 믿은 유대인들에게 이르시되 너희가 내 말에 거하면 참으로 내 제자가 되고 진리를 알지니 진리가 너희를 자유롭게 하리라","tms180-s3-2-10":"예수께서 대답하여 이르시되 기록되었으되 사람이 떡으로만 살 것이 아니요 하나님의 입으로부터 나오는 모든 말씀으로 살 것이라 하였느니라 하시니","tms180-s3-2-11":"천지는 없어질지언정 내 말은 없어지지 아니하리라","tms180-s3-2-12":"그들을 진리로 거룩하게 하옵소서 아버지의 말씀은 진리니이다","tms180-s3-3-1":"그러므로 너희가 이제 여러 가지 시험으로 말미암아 잠깐 근심하게 되지 않을 수 없으나 오히려 크게 기뻐하는도다 너희 믿음의 확실함은 불로 연단하여도 없어질 금보다 더 귀하여 예수 그리스도께서 나타나실 때에 칭찬과 영광과 존귀를 얻게 할 것이니라","tms180-s3-3-2":"내 형제들아 너희가 여러 가지 시험을 당하거든 온전히 기쁘게 여기라 인내를 온전히 이루라 이는 너희로 온전하고 구비하여 조금도 부족함이 없게 하려 함이라","tms180-s3-3-3":"그들과 같이 우리도 복음 전함을 받은 자이나 들은 바 그 말씀이 그들에게 유익하지 못한 것은 듣는 자가 믿음과 결부시키지 아니함이라","tms180-s3-3-4":"나의 의인은 믿음으로 말미암아 살리라 또한 뒤로 물러가면 내 마음이 그를 기뻐하지 아니하리라 하셨느니라","tms180-s3-3-5":"모든 것 위에 믿음의 방패를 가지고 이로써 능히 악한 자의 모든 불화살을 소멸하고","tms180-s3-3-6":"오직 너 하나님의 사람아 이것들을 피하고 의와 경건과 믿음과 사랑과 인내와 온유를 따르며 믿음의 선한 싸움을 싸우라 영생을 취하라 이를 위하여 네가 부르심을 받았고 많은 증인 앞에서 선한 증언을 하였도다","tms180-s3-3-7":"믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니","tms180-s3-3-8":"그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라","tms180-s3-3-9":"게으르지 아니하고 믿음과 오래 참음으로 말미암아 약속들을 기업으로 받는 자들을 본받는 자 되게 하려는 것이니라","tms180-s3-3-10":"이와 같이 행함이 없는 믿음은 그 자체가 죽은 것이라","tms180-s3-3-11":"사람이 의롭게 되는 것은 율법의 행위로 말미암음이 아니요 오직 예수 그리스도를 믿음으로 말미암는 줄 알므로 우리도 그리스도 예수를 믿나니 이는 우리가 율법의 행위로써가 아니고 그리스도를 믿음으로써 의롭다 함을 얻으려 함이라 율법의 행위로써는 의롭다 함을 얻을 육체가 없느니라","tms180-s3-3-12":"그러므로 우리가 믿음으로 의롭다 하심을 받았으니 우리 주 예수 그리스도로 말미암아 하나님과 화평을 누리자","tms180-s4-1-1":"우리 주 예수 그리스도로 말미암아 우리에게 승리를 주시는 하나님께 감사하노니","tms180-s4-1-2":"항상 우리를 그리스도 안에서 이기게 하시고 우리로 말미암아 각처에서 그리스도를 아는 냄새를 나타내시는 하나님께 감사하노라","tms180-s4-1-3":"우리의 싸우는 무기는 육신에 속한 것이 아니요 오직 견고한 진도 무너뜨리는 하나님의 능력이라 모든 이론을 무너뜨리며 하나님 아는 것을 대적하여 높아진 것을 다 무너뜨리고 모든 생각을 사로잡아 그리스도에게 복종하게 하니","tms180-s4-1-4":"끝으로 너희가 주 안에서와 그 힘의 능력으로 강건하여지고 마귀의 간계를 능히 대적하기 위하여 하나님의 전신 갑주를 입으라","tms180-s4-1-5":"또 우리 형제들이 어린 양의 피와 자기들의 증언하는 말씀으로써 그를 이겼으니 그들은 죽기까지 자기들의 생명을 아끼지 아니하였도다","tms180-s4-1-6":"그런즉 너희는 하나님께 복종할지어다 마귀를 대적하라 그리하면 너희를 피하리라 하나님을 가까이하라 그리하면 너희를 가까이하시리라 죄인들아 손을 깨끗이 하라 두 마음을 품은 자들아 마음을 성결하게 하라","tms180-s4-1-7":"육신을 따르는 자는 육신의 일을, 영을 따르는 자는 영의 일을 생각하나니 육신의 생각은 사망이요 영의 생각은 생명과 평안이니라","tms180-s4-1-8":"오직 주 예수 그리스도로 옷 입고 정욕을 위하여 육신의 일을 도모하지 말라","tms180-s4-1-9":"자녀들아 너희는 하나님께 속하였고 또 그들을 이기었나니 이는 너희 안에 계신 이가 세상에 있는 자보다 크심이라","tms180-s4-1-10":"무릇 하나님께로부터 난 자마다 세상을 이기느니라 세상을 이기는 승리는 이것이니 우리의 믿음이니라 예수께서 하나님의 아들이심을 믿는 자가 아니면 세상을 이기는 자가 누구냐","tms180-s4-1-11":"그의 마음에는 하나님의 법이 있으니 그의 걸음은 실족함이 없으리로다","tms180-s4-1-12":"그러므로 너희는 죄가 너희 죽을 몸을 지배하지 못하게 하여 몸의 사욕에 순종하지 말고 또한 너희 지체를 불의의 무기로 죄에게 내주지 말고 오직 너희 자신을 죽은 자 가운데서 다시 살아난 자 같이 하나님께 드리며 너희 지체를 의의 무기로 하나님께 드리라","tms180-s4-2-1":"끝으로 형제들아 무엇에든지 참되며 무엇에든지 경건하며 무엇에든지 옳으며 무엇에든지 정결하며 무엇에든지 사랑 받을 만하며 무엇에든지 칭찬 받을 만하며 무슨 덕이 있든지 무슨 기림이 있든지 이것들을 생각하라","tms180-s4-2-2":"깨끗한 자들에게는 모든 것이 깨끗하나 더럽고 믿지 아니하는 자들에게는 아무 것도 깨끗한 것이 없고 오직 그들의 마음과 양심이 더러운지라","tms180-s4-2-3":"선한 사람은 마음에 쌓은 선에서 선을 내고 악한 자는 그 쌓은 악에서 악을 내나니 이는 마음에 가득한 것을 입으로 말함이니라","tms180-s4-2-4":"모든 지킬 만한 것 중에 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라","tms180-s4-2-5":"눈은 몸의 등불이니 그러므로 네 눈이 성하면 온 몸이 밝을 것이요","tms180-s4-2-6":"나는 너희에게 이르노니 음욕을 품고 여자를 보는 자마다 마음에 이미 간음하였느니라","tms180-s4-2-7":"하나님의 뜻은 이것이니 너희의 거룩함이라 곧 음란을 버리고","tms180-s4-2-8":"음식은 배를 위하여 있고 배는 음식을 위하여 있으나 하나님은 이것 저것을 다 폐하시리라 몸은 음란을 위하여 있지 않고 오직 주를 위하여 있으며 주는 몸을 위하여 계시느니라","tms180-s4-2-9":"무릇 더러운 말은 너희 입 밖에도 내지 말고 오직 덕을 세우는 데 소용되는 대로 선한 말을 하여 듣는 자들에게 은혜를 끼치게 하라","tms180-s4-2-10":"내가 너희에게 이르노니 사람이 무슨 '' 무익한 말을 하든지 심판 날에 이에 대하여 심문을 받으리니 네 말로 의롭다 함을 받고 네 말로 정죄함을 받으리라","tms180-s4-2-11":"악은 어떤 모양이라도 버리라","tms180-s4-2-12":"늙은이를 꾸짖지 말고 권하되 아버지에게 하듯 하며 젊은이에게는 형제에게 하듯 하고 늙은 여자에게는 어머니에게 하듯 하며 젊은 여자에게는 온전히 깨끗함으로 자매에게 하듯 하라","tms180-s4-3-1":"너희가 기도할 때에 무엇이든지 \" 믿고 구하는 것은 다 받으리라 하시니라","tms180-s4-3-2":"구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾아낼 것이요 문을 두드리라 그리하면 너희에게 열릴 것이니 구하는 이마다 받을 것이요 찾는 이는 찾아낼 것이요 두드리는 이에게는 열릴 것이니라","tms180-s4-3-3":"너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라","tms180-s4-3-4":"새벽 아직도 밝기 전에 예수께서 일어나 나가 한적한 곳으로 가사 거기서 기도하시더니","tms180-s4-3-5":"너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 은밀한 일을 네게 보이리라","tms180-s4-3-6":"우리 가운데서 역사하시는 능력대로 우리가 구하거나 생각하는 모든 것에 더 넘치도록 능히 하실 이에게","tms180-s4-3-7":"그를 향하여 우리가 가진 바 담대함이 이것이니 그의 뜻대로 무엇을 구하면 들으심이라 우리가 무엇이든지 '' 구하는 바를 들으시는 줄을 안즉 우리가 그에게 구한 그것을 얻은 줄을 또한 아느니라","tms180-s4-3-8":"쉬지 말고 기도하라 범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라","tms180-s4-3-9":"나는 너희를 위하여 기도하기를 쉬는 죄를 여호와 앞에 결단코 범하지 아니하고 선하고 의로운 길을 너희에게 가르칠 것인즉","tms180-s4-3-10":"이에 제자들에게 이르시되 추수할 것은 많되 일군이 적으니 그러므로 추수하는 주인에게 청하여 추수할 일꾼들을 보내 주소서 하라 하시니라","tms180-s4-3-11":"그러므로 우리는 예수로 말미암아 항상 찬송의 제사를 하나님께 드리자 이는 그 이름을 증언하는 입술의 열매니라","tms180-s4-3-12":"할렐루야 내 영혼아 여호와를 찬양하라 나의 생전에 여호와를 찬양하며 나의 평생에 내 하나님을 찬송하리로다","tms180-s5-1-1":"하나님이 그들로 하여금 이 비밀의 영광이 이방인 가운데 얼마나 풍성한지를 알게 하려 하심이라 이 비밀은 너희 안에 계신 그리스도시니 곧 영광의 소망이니라 우리가 그를 전파하여 각 사람을 권하고 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 안에서 완전한 자로 세우려 함이니","tms180-s5-1-2":"곧 하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며 그들의 죄를 그들에게 돌리지 아니하시고 화목하게 하는 말씀을 우리에게 부탁하셨느니라 그러므로 우리가 그리스도를 대신하여 사신이 되어 하나님이 우리를 통하여 너희를 권면하시는 것 같이 그리스도를 대신하여 간청하노니 너희는 하나님과 화목하라","tms180-s5-1-3":"오직 하나님께 옳게 여기심을 입어 복음을 위탁 받았으니 우리가 이와 같이 말함은 사람을 기쁘게 하려 함이 아니요 오직 우리 마음을 감찰하시는 하나님을 기쁘시게 하려 함이라","tms180-s5-1-4":"내가 모든 사람에게자유로우나 스스로 모든 사람에게 종이 된 것은 더 많은 사람을 얻고자 함이라","tms180-s5-1-5":"너희가 넉 달이 지나야 추수할 때가 이르겠다 하지 아니하느냐 그러나 나는 너희에게 이르노니 눈을 들어 밭을 보라 희어져 추수하게 되었도다","tms180-s5-1-6":"우리가 이같이 너희를 사모하여 하나님의 복음뿐 아니라 우리의 목숨까지도 너희에게 주기를 기뻐함은 너희가 우리의 사랑하는 자 됨이라","tms180-s5-1-7":"기록한바 의인은 없나니 하나도 없으며 다 치우쳐 함께 무익하게 되고 선을 행하는 자는 없나니 하나도 없도다","tms180-s5-1-8":"하나님을 모르는 자들과 우리 주 예수의 복음에 복종하지 않는 자들에게 형벌을 내리시리니 이런 자들은 주의 얼굴과 그의 힘의 영광을 떠나 영원한 멸망의 형벌을 받으리로다","tms180-s5-1-9":"친히 나무에 달려 그 몸으로 우리 죄를 담당하셨으니 이는 우리로 죄에 대하여 죽고 의에 대하여 살게 하려 하심이라 그가 채찍에 맞음으로 너희는 나음을 얻었나니","tms180-s5-1-10":"하나님이 우리를 구원하사 거룩하신 소명으로 부르심은 우리의 행위대로 하심이 아니요 오직 자기의 뜻과 영원 전부터 그리스도 예수 안에서 우리에게 주신 은혜대로 하심이라","tms180-s5-1-11":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리라 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라","tms180-s5-1-12":"내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요 또 그들을 내 손에서 빼앗을 자가 없느니라 그들을 주신 내 아버지는 만물보다 크시매 아무도 아버지 손에서 빼앗을 수 없느니라","tms180-s5-2-1":"사람의 행위가 자기 보기에는 모두 정직하여도 여호와는 마음을 감찰하시느니라","tms180-s5-2-2":"사람이 만일 온 천하를 얻고도 자기 목숨을 잃으면 무엇이 유익하리요","tms180-s5-2-3":"사람이 하나님의 뜻을 행하려 하면 이 교훈이 하나님께로부터 왔는지 내가 스스로 말함인지 알리라","tms180-s5-2-4":"예수께서 대답하여 이르시되 건강한 자에게는 의사가 쓸 데 없고 병든 자에게라야 쓸 데 있나니 내가 의인을 부르러 온 것이 아니요 죄인을 불러 회개시키러 왔노라","tms180-s5-2-5":"너희가 서로 영광을 취하고 유일하신 하나님께로부터 오는 영광은 구하지 아니하니 어찌 나를 믿을 수 있느냐","tms180-s5-2-6":"그러므로 자기를 힘입어 하나님께 나아가는 자들을 온전히 구원하실 수 있으니 이는 그가 항상 살아 계셔서 그들을 위하여 간구하심이라","tms180-s5-2-7":"너는 내일 일을 자랑하지 말라 하루 동안에 무슨 일이 일어날는지 네가 알 수 없음이니라","tms180-s5-2-8":"이러므로 우리 각 사람이 자기 일을 하나님께 직고하리라","tms180-s5-2-9":"너희가 성경에서 영생을 얻는 줄 생각하고 성경을 연구하거니와 이 성경이 곧 내게 대하여 증언하는 것이니다","tms180-s5-2-10":"어떤 길은 사람이 보기에 바르나 필경은 사망의 길이니라","tms180-s5-2-11":"또 왼편에 있는 자들에게 이르시되 저주를 받은 자들아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영원한 불에 들어가라","tms180-s5-2-12":"창세로부터 그의 보이지 아니하는 것들 곧 그의 영원하신 능력과 신성이 그가 만드신 만물에 분명히 보여 알려졌나니 그러므로 그들이 핑계하지 못할지니라","tms180-s5-3-1":"너희가 알거니와 너희 조상이 물려 준 헛된 행실에서 대속함을 받은 은이나 금 같이 없어질 것으로 된 것이 아니요 오직 흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피로 된 것이니라","tms180-s5-3-2":"모든 것이 하나님께로서 났으며 그가 그리스도로 말미암아 우리를 자기와 화목하게 하시고 또 우리에게 화목하게 하는 직분을 주셨으니","tms180-s5-3-3":"우리는 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 속량 곧 죄 사함을 받았느니라","tms180-s5-3-4":"죄가 너희를 주장하지 못하리니 이는 너희가 법 아래에 있지 아니하고 은혜 아래에 있음이라 그런즉 어찌하리요 우리가 법 아래에 있지 아니하고 은혜 아래에 있으니 죄를 지으리요 그럴 수 없느니라","tms180-s5-3-5":"너희가 다 믿음으로 말미암아 그리스도 예수 안에서 하나님의 아들이 되었으니","tms180-s5-3-6":"그러나 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유가 된 백성이니 이는 너희를 어두운 데서 불러 내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하려 하심이라","tms180-s5-3-7":"하나님이 죄를 알지도 못하신 이를 우리를 대신하여 죄로 삼으신 것은 우리로 하여금 그의 안에서 하나님의 의가 되게 하려 하심이라","tms180-s5-3-8":"너희는 하나님으로부터 나서 그리스도 예수 안에 있고 예수는 하나님으로부터 나와서 우리에게 지혜와 의로움과 거룩함과 구속함이 되셨으니","tms180-s5-3-9":"그가 거룩하게 된 자들을 한 번의 제사로 영원히 온전하게 하셨느니라","tms180-s5-3-10":"그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라","tms180-s5-3-11":"그러나 우리의 시민권은 하늘에 있는지라 거기로부터 구원하는 자 곧 주 예수 그리스도를 기다리노니","tms180-s5-3-12":"그 안에는 신성의 모든 충만이 육체로 거하시고 너희도 그 안에서 충만하여졌으니 그는 모든 통치자와 권세의 머리시라","dep242-1-1":"너희는 믿음 안에 있는가 너희 자신을 시험하고 너희 자신을 확증하라 예수 그리스도께서 너희 안에 계신 줄을 너희가 스스로 알지 못하느냐 그렇지 않으면 너희는 버림 받은 자니라","dep242-1-2":"또 증거는 이것이니 하나님이 우리에게 영생을 주신 것과 이 생명이 그의 아들 안에 있는 그것이니라 아들이 있는 자에게는 생명이 있고 하나님의 아들이 없는 자에게는 생명이 없느니라","dep242-1-3":"진실로 진실로 너희에게 이르노니 믿는 자는 영생을 가졌나니","dep242-1-4":"내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓰는 것은 너희로 하여금 너희에게 영생이 있음을 알게 하려 함이라","dep242-1-5":"우리는 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 속량 곧 죄 사함을 받았느니라","dep242-1-6":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니","dep242-1-7":"그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라","dep242-1-8":"그러므로 우리가 믿음으로 의롭다 하심을 받았으니 우리 주 예수 그리스도로 말미암아 하나님과 화평을 누리자","dep242-1-9":"우리 주 예수 그리스도의 아버지 하나님을 찬송하리로다 그의 많으신 긍휼대로 예수 그리스도를 죽은 자 가운데서 부활하게 하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며","dep242-1-10":"우리를 구원하시되 우리가 행한 바 의로운 행위로 말미암지 아니하고 오직 그의 긍휼하심을 따라 중생의 씻음과 성령의 새롭게 하심으로 하셨나니","dep242-1-11":"무릇 하나님의 영으로 인도함을 받는 사람은 곧 하나님의 아들이라","dep242-1-12":"너희가 다 믿음으로 말미암아 그리스도 예수 안에서 하나님의 아들이 되었으니","dep242-1-13":"만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라","dep242-1-14":"내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 영원토록 너희와 함께 있게 하리니 그는 진리의 영이라 세상은 능히 그를 받지 못하나니 이는 그를 보지도 못하고 알지도 못함이라 그러나 너희는 그를 아나니 그는 너희와 함께 거하심이요 또 너희 속에 계시겠음이라","dep242-1-15":"높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라","dep242-1-16":"내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요 또 그들을 내 손에서 빼앗을 자가 없느니라 그들을 주신 내 아버지는 만물보다 크시매 아무도 아버지 손에서 빼앗을 수 없느니라","dep242-1-17":"그 안에서 너희도 진리의 말씀 곧 너희의 구원의 복음을 듣고 그 안에서 또한 믿어 약속의 성령으로 인치심을 받았으니","dep242-1-18":"너희가 거듭난 것은 썩어질 씨로 된 것이 아니요 썩지 아니할 씨로 된 것이니 살아 있고 항상 있는 하나님의 말씀으로 되었느니라","dep242-2-1-1":"그러나 여호와께서 기다리시나니 이는 너희에게 은혜를 베풀려 하심이요 일어나시리니 이는 너희를 긍휼히 여기려 하심이라 대저 여호와는 정의의 하나님이심이라 그를 기다리는 자마다 복이 있도다","dep242-2-1-2":"너희를 불러 그의 아들 예수 그리스도 우리 주와 더불어 교제하게 하시는 하나님은 미쁘시도다","dep242-2-1-3":"너희는 여호와를 만날 만한 때에 찾으라 가까이 계실 때에 그를 부르라","dep242-2-1-4":"너희는 내 얼굴을 찾으라 하실 때에 내가 마음으로 주께 말하되 여호와여 내가 주의 얼굴을 찾으리이다 하였나이다","dep242-2-1-5":"나는 포도나무요 너희는 가지라 그가 내 안에, 내가 그 안에 거하면 사람이 열매를 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라","dep242-2-1-6":"젊은 사자는 궁핍하여 주릴지라도 여호와를 찾는 자는 모든 좋은 것에 부족함이 없으리로다","dep242-2-1-7":"아침에 나로 하여금 주의 인자한 말씀을 듣게 하소서 내가 주를 의뢰함이니이다 내가 다닐 길을 알게 하소서 내가 내 영혼을 주께 드림이니이다 주는 나의 하나님이시니 나를 가르쳐 주의 뜻을 행하게 하소서 주의 영은 선하시니 나를 공평한 땅에 인도하소서","dep242-2-1-8":"내가 내 파수하는 곳에 서며 성루에 서리라 그가 내게 무엇이라 말씀하실는지 기다리고 바라보며 나의 질문에 대하여 어떻게 대답 -6-5-15":"누가 철학과 헛된 속임수로 너희를 사로잡을까 주의하라 이것은 사람의 전통과 세상의 초등학문을 따름이요 그리스도를 따름이 아니니라","dep242-6-5-16":"이는 혈통으로나 육정으로나 사람의 뜻으로 나지 아니하고 오직 하나님께로부터 난 자들이니라","dep242-6-5-17":"육으로 난 것은 육이요 영으로 난 것은 영이니 내가 네게 거듭나야 하겠다 하는 말을 놀랍게 여기지 말라","dep242-6-5-18":"살리는 것은 영이니 육은 무익하니라 내가 너희에게 이른 말은 영이요 생명이라","dep242-6-5-19":"그리스도께서도 단번에 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니","dep242-6-5-20":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라","dep242-6-5-21":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라","dep242-6-5-22":"내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고 장사 지낸 바 되셨다가 성경대로 사흘 만에 다시 살아나사","dep242-6-5-23":"또 범죄와 육체의 무할례로 죽었던 너희를 하나님이 그와 함께 살리시고 우리의 모든 죄를 사하시고","dep242-6-5-24":"내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라","dep242-6-5-25":"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니","dep242-6-5-26":"볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라","dep242-6-5-27":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리라 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라","dep242-7-1-1":"그가 태초에 하나님과 함께 계셨고 만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라","dep242-7-1-2":"만물이 그에게서 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 왕권들이나 주권들이나 통치자들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고 또한 그가 만물보다 먼저 계시고 만물이 그 안에 함께 섰느니라","dep242-7-1-3":"그는 몸인 교회의 머리시라 그가 근본이시요 죽은 자들 가운데서 먼저 나신 이시니 이는 친히 만물의 으뜸이 되려 하심이요","dep242-7-1-4":"모든 통치와 권세와 능력과 주권과 이 세상뿐 아니라 오는 세상에 일컫는 모든 이름 위에 뛰어나게 하시고","dep242-7-1-5":"하늘에 있는 자들과 땅에 있는 자들과 땅 아래에 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고 모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라","dep242-7-1-6":"이를 위하여 그리스도께서 죽었다가 다시 살아나셨으니 곧 죽은 자와 산 자의 주가 되려 하심이라","dep242-7-1-7":"너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희 자신의 것이 아니라 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라","dep242-7-1-8":"그가 모든 사람을 대신하여 죽으심은 살아 있는 자들로 하여금 다시는 그들 자신을 위하여 살지 않고 오직 그들을 대신하여 죽었다가 다시 살아나신 이를 위하여 살게 하려 함이라","dep242-7-2-1":"그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라","dep242-7-2-2":"예수께서 이르시되 내가 진실로 너희에게 이르노니 나와 복음을 위하여 집이나 형제나 자매나 어머니나 아버지나 자식이나 전토를 버린 자는 현세에 있어 집과 형제와 자매와 어머니와 자식과 전토를 백 배나 받되 박해를 겸하여 받고 내세에 영생을 받지 못할 자가 없느니라","dep242-7-2-3":"이르시되 여호와께서 이르시기를 내가 나를 가리켜 맹세하노니 네가 이같이 행하여 네 아들 네 독자도 아끼지 아니하였은즉 내가 네게 큰 복을 주고 네 씨가 크게 번성하여 하늘의 별과 같고 바닷가의 모래와 같게 하리니 네 씨가 그 대적의 성문을 차지하리라","dep242-7-2-4":"내 아들 솔로몬아 너는 네 아버지의 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길지어다 여호와께서는 모든 마음을 감찰하사 모든 의도를 아시나니 네가 만일 그를 찾으면 만날 것이요 만일 네가 그를 버리면 그가 너를 영원히 버리시리라","dep242-7-2-5":"여호와의 눈은 온 땅을 두루 감찰하사 전심으로 자기에게 향하는 자들을 위하여 능력을 베푸시나니 이 일은 왕이 망령되이 행하였은즉 이 후부터는 왕에게 전쟁이 있으리이다 하매","dep242-7-2-6":"하나님이 이르시되 그가 나를 사랑한즉 내가 그를 건지리라 그가 내 이름을 안즉 내가 그를 높이리라","dep242-7-2-7":"그러므로 이스라엘의 하나님 나 여호와가 말하노라 내가 전에 네 집과 네 조상의 집이 내 앞에 영원히 행하리라 하였으나 이제 나 여호와가 말하노니 결단코 그렇게 하지 아니하리라 나를 존중히 여기는 자를 내가 존중히 여기고 나를 멸시하는 자를 내가 경멸하리라","dep242-7-3-1":"또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 따를 것이니라","dep242-7-3-2":"사람의 행위가 여호와를 기쁘시게 하면 그 사람의 원수라도 그와 더불어 화목하게 하시느니라","dep242-7-3-3":"너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라","dep242-7-3-4":"너희는 유혹의 욕심을 따라 썩어져 가는 구습을 따르는 옛 사람을 벗어 버리고 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라","dep242-7-3-5":"또한 너는 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 따르라","dep242-7-3-6":"우리가 세상에 아무 것도 가지고 온 것이 없으매 또한 아무 것도 가지고 가지 못하리니 부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 욕심에 떨어지나니 곧 사람으로 파멸과 멸망에 빠지게 하는 것이라","dep242-7-3-7":"그런즉 너희가 어떻게 행할지를 자세히 주의하여 지혜 없는 자 같이 하지 말고 오직 지혜 있는 자 같이 하여 세월을 아끼라 때가 악하니라","dep242-7-3-8":"곧 부르시니 그 아버지 세베대를 품꾼들과 함께 배에 버려 두고 예수를 따라가니라","dep242-7-4-1":"나의 간절한 기대와 소망을 따라 아무 일에든지 부끄러워하지 아니하고 지금도 전과 같이 온전히 담대하여 살든지 죽든지 내 몸에서 그리스도가 존귀하게 되게 하려 하나니","dep242-7-4-2":"그들이 다 자기 일을 구하고 그리스도 예수의 일을 구하지 아니하되 디모데의 연단을 너희가 아나니 자식이 아버지에게 함같이 나와 함께 복음을 위하여 수고하였느니라","dep242-7-4-3":"또 어떤 이들은 조롱과 채찍질뿐 아니라 결박과 옥에 갇히는 시련도 받았으며 (이런 사람은 세상이 감당하지 못하느니라) 그들이 광야와 산과 동굴과 토굴에 유리하였느니라","dep242-8-1":"내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라 너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 내가 저주하리니 땅의 모든 족속이 너로 말미암아 복을 얻을 것이라 하신지라","dep242-8-2":"그가 이르시되 네가 나의 종이 되어 야곱의 지파들을 일으키며 이스라엘 중에 보전된 자를 돌아오게 할 것은 매우 쉬운 일이라 내가 또 너를 이방의 빛으로 삼아 나의 구원을 베풀어서 땅 끝까지 이르게 하리라","dep242-8-3":"그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 침례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 \" \" 함께 있으리라 하시니라","dep242-8-4":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","dep242-8-5":"내가 또 주의 목소리를 들으니 주께서 이르시되 내가 누구를 보내며 누가 우리를 위하여 갈꼬 하시니 그 때에 내가 이르되 내가 여기 있나이다 나를 보내소서 하였더니","dep242-8-6":"이 은혜는 곧 나로 이방인을 위하여 그리스도 예수의 일꾼이 되어 하나님의 복음의 제사장 직분을 하게 하사 이방인을 제물로 드리는 것이 성령 안에서 거룩하게 되어 받으실 만하게 하려 하심이라","dep242-8-7":"내게 구하라 내가 이방 나라를 네 유업으로 주리니 네 소유가 땅 끝까지 이르리로다","dep242-8-8":"하나님이여 주는 하늘 위에 높이 들리시며 주의 영광이 온 세계 위에 높아지기를 원하나이다","dep242-8-9":"영생의 소망을 위함이라 이 영생은 거짓이 없으신 하나님이 영원 전부터 약속하신 것인데 자기 때에 자기의 말씀을 전도로 나타내셨으니 이 전도는 우리 구주 하나님이 명하신 대로 내게 맡기신 것이라","dep242-8-10":"주께서 내 곁에 서서 나에게 힘을 주심은 나로 말미암아 선포된 말씀이 온전히 전파되어 모든 이방인이 듣게 하려 하심이니 내가 사자의 입에서 건짐을 받았느니라","dep242-8-11":"우리가 그를 전파하여 각 사람을 권하고 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 안에서 완전한 자로 세우려 함이니 이를 위하여 나도 내 속에서 능력으로 역사하시는 이의 역사를 따라 힘을 다하여 수고하노라","dep242-8-12":"내가 기도하노라 너희 사랑을 지식과 모든 총명으로 점점 더 풍성하게 하사 예수 그리스도로 말미암아 의의 열매가 가득하여 하나님의 영광과 찬송이 되기를 원하노라","dep242-8-13":"또 네가 많은 증인 앞에서 내게 들은 바를 충성된 사람들에게 부탁하라 그들이 또 다른 사람들을 가르칠 수 있으리라","dep242-8-14":"그 작은 자가 천 명을 이루겠고 그 약한 자가 강국을 이룰 것이라 때가 되면 나 여호와가 속히 이루리라","dep242-8-15":"이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 하며","dep242-8-16":"여호와의 눈은 온 땅을 두루 감찰하사 전심으로 자기에게 향하는 자들을 위하여 능력을 베푸시나니 이 일은 왕이 망령되이 행하였은즉 이 후부터는 왕에게 전쟁이 있으리이다 하매","dep242-8-17":"이는 물이 바다를 덮음 같이 여호와의 영광을 인정하는 것이 세상에 가득함이니라","dep242-8-18":"만군의 여호와가 이르노라 해 뜨는 곳에서부터 해 지는 곳까지의 이방 민족 중에서 내 이름이 크게 될 것이라 각처에서 내 이름을 위하여 분향하며 깨끗한 제물을 드리리니 이는 내 이름이 이방 민족 중에서 크게 될 것임이니라"},"kkj":{"assurance-1":"또 증거는 이것이니, 하나님께서 우리에게 영생을 주신 것과, 이 생명이 그의 아들 안에 있다는 것이라. 그 아들이 있는 자는 생명이 있고 하나님의 아들이 없는 자는 생명이 없느니라.","assurance-2":"지금까지는 너희가 내 이름으로 아무것도 구하지 아니하였으나 구하라. 그러면 받을 것이니 너희 기쁨이 충만케 하려 함이라.","assurance-3":"사람이 감당할 수 있는 시험 외에는 너희가 당한 것이 없나니, 하나님께서는 신실하셔서 너희가 감당할 수 있는 것 이상으로 시험을 당하지 않게 하시고 시험을 당하면 피할 길도 마련하셔서 너희로 능히 감당케 하시느니라.","assurance-4":"우리가 우리 죄들을 자백하면 그는 신실하시고 의로우셔서 우리 죄들을 용서하시며, 모든 불의에서 우리를 깨끗하게 하시느니라.","assurance-5":"네 마음을 다하여 주를 신뢰하고, 네 자신의 명철을 의지하지 말라. 모든 길에서 그를 인정하라. 그리하면 그가 네 길들을 지도하시리라.","living-1":"나는 포도나무요 너희는 그 가지들이라. 그가 내 안에 내가 그 안에 거하면 그 사람은 많은 열매를 맺느니라. 이는 나를 떠나서는 너희가 아무것도 할 수 없기 때문이라.","living-2":"이제 형제들아, 내가 너희를 하나님과 그 분의 은혜의 말씀에 의탁하노니, 그 말씀이 능히 너희를 굳게 세워 줄 것이며, 또 거룩하게 된 모든 사람 가운데서 너희에게 유업을 줄 것이라.","living-3":"무릇 하나님의 영으로 인도함을 받는 이들은 곧 하나님의 아들들이니라.","living-4":"(이는 우리가 믿음으로 행하고 보는 것으로 하지 아니함이라.)","living-5":"사랑하는 자들아, 하나님께서 이처럼 우리를 사랑하셨으니 우리도 서로 사랑하는 것이 마땅하도다.","living-6":"그러나 그 분이 빛 가운데 계신 것같이 우리도 빛 가운데 행하면 우리가 서로간에 교제가 있게 되고, 그의 아들 예수 그리스도의 피가 우리를 모든 죄에서 깨끗하게 하시느니라.","living-7":"그러나 너희 마음 속에서 주 하나님을 거룩하게 여기며 너희 안에 있는 소망에 관한 이유를 묻는 모든 사람에게 답변할 것을 온유와 두려움으로 항상 예비하고","living-8":"각 사람은 미리 마음 속에 정한 대로 할 것이요, 인색함이나 억지로는 하지 말아야 하리니 이는 하나님께서는 기쁨으로 드리는 자를 사랑하심이니라.","tms60-A-1":"그러므로 누구든지 그리스도 안에 있으면 새로운 피조물이라. 옛 것들은 지나갔으니, 보라, 모든 것이 새롭게 되었도다.","tms60-A-2":"내가 그리스도와 함께 십자가에 못 박혔으나 그럼에도 나는 살아 있노라. 그러나 내가 사는 것이 아니요 그리스도께서 내 안에 사시는 것이라. 내가 이제 육신으로 사는 삶은 나를 사랑하시어 나를 위해 자신을 주신 하나님의 아들을 믿는 믿음으로 사는 것이라.","tms60-A-3":"그러므로 형제들아, 내가 하나님의 모든 자비하심으로 너희에게 권고하노니, 너희 몸을 하나님께서 기뻐하시는 거룩한 산 제물로 드리라. 이것이 너희가 드릴 합당한 예배니라.","tms60-A-4":"나의 계명들을 가지고 그것을 지키는 사람은 나를 사랑하는 사람이니, 나를 사랑하는 사람은 나의 아버지께 사랑을 받으리라. 또 나도 그를 사랑하여 그 사람에게 나 자신을 나타내리라.\"고 하시니라.","tms60-A-5":"모든 성경은 하나님의 영감으로 주어진 것으로 교리와 책망과 바로잡음과 의로 훈육하기에 유익하니","tms60-A-6":"이 율법책을 네 입에서 떠나지 않게 하고 주야로 그 안에 있는 것을 묵상하여 그 안에 기록된 모든 것대로 지켜 행하라. 그리하면 네가 너의 길을 번성하게 만들 것이고 네가 좋은 성공을 이루리라.","tms60-A-7":"너희가 내 안에 거하고 내 말들이 너희 안에 거하면 너희가 원하는 것은 무엇이나 구하라. 그러면 너희에게 이루어지리라.","tms60-A-8":"아무것도 염려하지 말고 다만 모든 일에 기도와 간구로 너희의 구하는 것들을 감사함으로 하나님께 알려지게 하라. 그리하면 모든 지각을 초월하시는 하나님의 평강이 그리스도 예수 안에서 너희의 마음과 생각을 지키시리라.","tms60-A-9":"두 세 사람이 내 이름으로 함께 모이는 곳에는 나도 그들 가운데 있느니라.\" 하시더라.","tms60-A-10":"또 서로 생각하여 사랑과 선행을 격려하며 어떤 사람들의 습관처럼 우리 자신들이 함께 모이는 것을 저버리지 말고 서로 권면하여 그 날이 가까워 오는 것을 볼수록 더욱 그리하자.","tms60-A-11":"그들에게 말씀하시기를 \"나를 따라오라. 내가 너희로 사람들을 낚는 어부가 되게 하리라.\"고 하시니","tms60-A-12":"내가 그리스도의 복음을 부끄러워하지 아니하노니, 이는 이 복음이 믿는 모든 사람을 구원에 이르게 하는 하나님의 능력이 됨이라. 첫째는 유대인에게요, 또한 헬라인에게로다.","tms60-B-1":"이는 모든 사람이 죄를 지었으므로 하나님의 영광에 이르지 못하다가","tms60-B-2":"우리는 모두 양같이 길을 잃어 각자 자기의 길로 돌이켰으나 주께서는 우리 모두의 죄악을 그에게 지우셨도다.","tms60-B-3":"이는 죄의 삯은 사망이요, 하나님의 선물은 예수 그리스도 우리 주로 말미암은 영원한 생명이기 때문이라.","tms60-B-4":"한 번 죽는 것은 사람들에게 정해진 것이고 그 뒤에는 심판이 있는 것같이","tms60-B-5":"우리가 아직 죄인이었을 때 그리스도께서 우리를 위하여 죽으심으로써 하나님께서는 우리를 향한 그의 사랑을 나타내셨느니라.","tms60-B-6":"그리스도께서도 죄들로 인하여 한 번 고난을 받으사 의인으로서 불의한 자를 대신하셨으니, 이는 육신으로는 죽임을 당하셨으나 성령에 의하여 살림을 받으심으로 우리를 하나님께로 인도하려 하심이라.","tms60-B-7":"너희가 믿음으로 말미암아 은혜로 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라. 행위에서 난 것이 아니니 아무도 자랑하지 못하게 하려 하심이라.","tms60-B-8":"우리가 행한 의로운 행위에 의하지 않고 그의 자비하심에 따라 중생의 씻음과 성령의 새롭게 하심으로 우리를 구원하셨으니","tms60-B-9":"그러나 누구든지 그를 영접한 사람들에게는 하나님의 아들들이 되는 권세를 주셨으니, 즉 그의 이름을 믿는 사람들에게니라.","tms60-B-10":"보라, 내가 문 앞에 서서 두드리노라. 누구든지 내 음성을 듣고 그 문을 열면 내가 그에게로 들어가서 그와 함께 먹으며 그도 나와 함께 먹으리라.","tms60-B-11":"내가 하나님의 아들의 이름을 믿는 너희에게 이런 것들을 씀은 너희에게 영생이 있음을 알게 하려 함이며, 또한 너희가 하나님의 아들의 이름을 믿도록 하려 함이라.","tms60-B-12":"진실로 진실로 내가 너희에게 말하노니, 내 말을 듣고, 또 나를 보내신 분을 믿는 자는 영생을 얻고, 정죄에 이르지 아니할 것이며, 사망에서 생명으로 옮겨졌느니라.","tms60-C-1":"너희가 하나님의 성전인 것과 하나님의 영께서 너희 안에 거하시는 것을 알지 못하느냐?","tms60-C-2":"우리가 세상의 영을 받지 아니하고 오직 하나님께로부터 온 영을 받았으니, 이는 우리로 하나님께서 우리에게 값없이 주신 것들을 알게 하려 하심이라.","tms60-C-3":"두려워 말라, 내가 너와 함께함이라. 놀라지 말라, 내가 네 하나님임이라. 내가 너를 강건하게 하리라. 정녕, 내가 너를 도우리라. 정녕, 내가 내 의의 오른 손으로 너를 높이리라.","tms60-C-4":"내게 능력 주시는 그리스도를 통하여 내가 모든 것을 할 수 있느니라.","tms60-C-5":"주의 자비하심으로 우리가 진멸되지 아니하였으니 그의 긍휼히 여기심이 사라지지 아니하였음이니이다. 그것들이 매일 아침 새로워지니 주의 신실하심이 크나이다.","tms60-C-6":"하나님은 사람이 아니시니 거짓말하지 않으시며, 또 사람의 아들이 아니시니 후회가 없으시도다. 그 분이 말씀하신 것을 행하지 않으시랴? 또한 이르신 것을 이루지 않으시랴?","tms60-C-7":"주께서는 마음을 주께 의탁하는 사람을 완전한 화평 속에 지키시리니, 이는 그 사람이 주를 의뢰함이니이다.","tms60-C-8":"너희의 염려를 다 하나님께 맡기라. 이는 그 분께서 너희를 돌보심이니라.","tms60-C-9":"자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내어 주신 분이 어찌 그 아들과 함께 우리에게 모든 것을 값없이 주시지 아니하겠느냐?","tms60-C-10":"그러나 나의 하나님께서 그리스도 예수를 통하여 영광 가운데서 그의 풍요함을 따라 너희의 모든 필요를 채워 주실 것이라.","tms60-C-11":"그가 이 일에 친히 시험을 받아 고난을 당하셨으므로 시험받는 자들을 능히 도와 주실 수 있느니라.","tms60-C-12":"청년이 무엇으로 자기 길을 정결케 하리이까? 주의 말씀을 따라 조심할 것이니이다. 주의 말씀을 내 마음에 간직하였으니, 이는 내가 주께 범죄치 아니하려 함이니이다.","tms60-D-1":"오직 너희는 먼저 하나님의 나라와 그 분의 의를 구하라. 그리하면 이 모든 것을 너희에게 더해 주시리라.","tms60-D-2":"또 그들 모두에게 말씀하시기를 \"누구라도 나를 따라 오려거든 자기를 부인하고 날마다 자기 십자가를 지고 나를 따르라.","tms60-D-3":"세상도, 세상에 있는 것들도 사랑하지 말라. 누구든지 세상을 사랑하면 아버지의 사랑이 그 안에 있지 아니하니 이는 세상에 있는 모든 것이 육신의 정욕과 안목의 정욕과 생의 자랑이요, 아버지께 속한 것이 아니라 세상에 속한 것이기 때문이라.","tms60-D-4":"너희는 이 세상과 일치하지 말고 너희 생각을 새롭게 함으로써 변화를 받아 하나님의 선하시고, 기뻐하시고, 온전하신 뜻이 무엇인지 입증하도록 하라.","tms60-D-5":"그러므로 나의 사랑하는 형제들아, 견고하라, 흔들리지 말라, 항상 주의 일을 넘치게 하라. 이는 너희의 수고가 주 안에서 헛되지 아니한 줄을 너희가 앎이니라.","tms60-D-6":"너희가 생각이 지쳐 낙심치 않기 위하여 자기에게 저질러진 죄인들의 그와 같은 모순된 행동들을 견뎌내신 그를 깊이 생각하라.","tms60-D-7":"인자도 섬김을 받으러 온 것이 아니요, 섬기러 왔고, 또 많은 사람을 위하여 자기 생명을 몸값으로 주려고 온 것이라.\"고 하시니라.","tms60-D-8":"우리는 우리 자신을 전파하는 것이 아니라, 그리스도 예수가 주이신 것과 우리 자신이 예수를 위하여 너희의 종인 것을 전파하노라.","tms60-D-9":"네 재물과 네 모든 소산물의 첫 열매로 주를 공경하라. 그리하면 네 창고가 가득 차고 네 포도즙틀에서는 새 포도주가 넘치리라.","tms60-D-10":"그러나 내가 이것을 말하노니 적게 심는 자는 적게 거두고, 넉넉하게 심는 자는 넉넉하게 거둔다는 것이라. 각 사람은 미리 마음 속에 정한 대로 할 것이요, 인색함이나 억지로는 하지 말아야 하리니 이는 하나님께서는 기쁨으로 드리는 자를 사랑하심이니라.","tms60-D-11":"그러나 성령께서 너희에게 임하시면 너희가 능력을 받으리니, 그러면 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내게 증인이 되리라.\"고 하시니라.","tms60-D-12":"\"그러므로 너희는 가서 모든 민족들을 가르치고, 아버지와 아들과 성령의 이름으로 침례를 주며 내가 너희에게 명령한 모든 것을 가르쳐 지키게 하라. 보라, 내가 세상 끝까지 너희와 항상 함께 있으리라.\"고 하시더라. 아멘.","tms60-E-1":"내가 새 계명을 너희에게 주노니 이는 너희가 서로 사랑하라는 것이라. 내가 너희를 사랑한 것같이 너희도 서로 사랑하라. 너희가 서로 사랑하면 이것으로 모든 사람이 너희가 나의 제자인 줄 알리라.\"고 하시더라.","tms60-E-2":"나의 어린 자녀들아, 우리가 말이나 혀로 사랑하지 말고 행동과 진리로 하자.","tms60-E-3":"어떤 일도 다툼이나 허영을 따라서 하지 말고 오직 생각의 겸손함으로 남을 자신들 보다 존중하고 각자 자기 일만 돌보지 말고 남의 일도 돌아보라.","tms60-E-4":"이와 같이 너희 젊은이들아, 장로에게 복종하라. 너희 모두가 서로 복종하고 겸손함으로 옷 입으라. 이는 하나님께서 교만한 자들을 대적하시고 겸손한 자들에게 은혜를 주심이니라. 그러므로 하나님의 능하신 손 아래서 겸손하라. 때가 되면 그 분께서 너희를 높이시리라.","tms60-E-5":"음행과 온갖 더러운 것과 탐욕은 너희 가운데서 이름조차 부르지 말라. 이것이 성도들에게 합당하니라.","tms60-E-6":"사랑하는 자들아, 타국인 같고 순례자 같은 너희에게 권고하노니 혼을 거슬러 싸우는 육신의 정욕들을 멀리하라.","tms60-E-7":"너희는 도둑질하지 말며 속이지 말고 서로에게 거짓말하지 말라.","tms60-E-8":"이 소망 때문에 나 자신도 하나님과 사람 앞에 항상 거리낌이 없는 양심을 지니려고 힘쓰나이다.","tms60-E-9":"그러나 믿음이 없이는 하나님을 기쁘시게 할 수 없나니, 하나님께 나아가는 자는 그 분이 존재하시는 것과 그 분이 자기를 열심히 찾는 자들에게 보상하는 분이심을 마땅히 믿어야 하느니라.","tms60-E-10":"그는 믿음 없음으로 인하여 하나님의 약속을 의심하지 아니하였고 오히려 믿음에 견고하여져서 하나님께 영광을 돌리며 약속하신 그것을 또한 이루실 것이라고 확신하였느니라.","tms60-E-11":"선을 행하다가 낙심하지 말지니 쓰러지지 아니하면 때가 되어 거두리라. 그러므로 우리는 기회가 닿는 대로 모든 사람에게 선을 행하되 특히 믿음의 가족들에게 할지니라.","tms60-E-12":"그러므로 너희의 빛이 사람들 앞에 비치게 하여 그들로 너희의 선행을 보게 하고, 또 하늘에 계신 너희 아버지께 영광을 돌리게 하라.","tms180-s1-1-1":"태초에 말씀이 계셨고, 그 말씀이 하나님과 함께 계셨으니, 그 말씀은 하나님이셨느니라. 그 말씀이 육신이 되어 우리 가운데 거하시므로 (우리가 그의 영광을 보니, 아버지의 독생자의 영광으로) 은혜와 진리가 충만하더라.","tms180-s1-1-2":"그러나 아들에게 말씀하시기를 \"오 하나님이여, 주의 보좌는 영원 무궁하며 주의 왕국의 홀은 의의 홀이니이다.","tms180-s1-1-3":"이는 우리의 대제사장은 우리의 연약함을 동정할 수 없는 분이 아니요, 모든 점에서 우리와 마찬가지로 시험을 받으셨지만 죄는 없으신 분이기 때문이라.","tms180-s1-1-4":"예수께서는 지혜와 키가 자라고 하나님과 사람의 총애 속에서 자라가시더라.","tms180-s1-1-5":"내가 받은 것을 먼저 너희에게 전달하였나니, 이는 성경대로 그리스도께서 우리의 죄들로 인하여 죽으시고 장사되셨다가 성경대로 셋째 날에 다시 살아나셔서","tms180-s1-1-6":"그러나 이제 그리스도께서는 죽은 자들로부터 살아나셔서 잠들었던 자들의 첫 열매들이 되셨느니라.","tms180-s1-1-7":"아무도 어느 때나 하나님을 본 사람이 없지만 아버지의 품 안에 계신 독생자뿐이라. 그가 하나님을 분명히 밝히셨느니라.","tms180-s1-1-8":"그는 하나님의 영광의 광채시며 그 분의 인격의 정확한 형상이시고, 그의 능력의 말씀으로 만물을 붙들고 계시며, 친히 우리의 죄들을 정결케 하시고 높은 곳에 위엄 있는 분의 오른편에 앉으셨으니","tms180-s1-1-9":"인자가 온 것은 잃어 버린 자를 찾고 또 구원하려는 것이라.\"고 하시더라.","tms180-s1-1-10":"이는 너희가 아는 바와 같이, 너희가 너희 조상들로부터 전통으로 이어받은 너희의 허망한 행실에서 은이나 금같은 썩어질 것들로 구속된 것이 아니라 흠도 없고 점도 없는 어린 양 같은 그리스도의 보배로운 피로 된 것이기 때문이니라.","tms180-s1-1-11":"주께서 호령과 천사장의 음성과 하나님의 나팔 소리와 함께 하늘로부터 친히 내려오시리니 그러면 그리스도 안에서 죽은 자들이 먼저 일어나고 그리고 나서 살아 남아 있는 우리도 공중에서 주와 만나기 위하여 그들과 함께 구름 속으로 끌려올라 가리니 그리하여 우리가 영원히 주와 함께 있으리라.","tms180-s1-1-12":"사랑하는 자들아, 이제는 우리가 하나님의 아들들이라. 우리가 어떻게 될 것인지는 아직 나타나지 아니하였으나 그가 나타나시면 우리가 그와 같이 되리라는 것을 아노니, 이는 우리가 그분 그대로 그분을 볼 것이기 때문이라. 그분 안에서 이 소망을 가지는 사람은 누구나 그분이 정결하신 것처럼 자신을 정결케 하느니라.","tms180-s1-2-1":"그러나 진리의 영이신 그 분이 오시면 너희를 모든 진리로 인도하시리라. 그 분은 스스로 말씀하지 아니하시며, 무엇이나 들은 것을 말씀하실 것이요, 또 너희에게 일어날 일들을 알려 주시리라. 그 분이 나를 영화롭게 하시리니, 이는 그 분이 내 것을 받아서 너희에게 알려 주실 것임이라.","tms180-s1-2-2":"그러므로 내가 너희에게 알게 하노니, 하나님의 영으로 말하는 사람은 누구라도 예수는 저주 받았다고 말하지 아니하며, 또 성령에 의하지 아니하고는 누구라도 예수를 주라고 말할 수 없느니라.","tms180-s1-2-3":"그러나 하나님의 영이 너희 안에 거하시면 너희가 육신 안에 있지 아니하고 성령 안에 있나니, 이제 누구든지 그리스도의 영이 없으면 그의 사람이 아니니라.","tms180-s1-2-4":"너희가 아들이므로 하나님께서 자기 아들의 영을 너희 마음 속에 보내시어 아바, 아버지라 부르짖게 하셨느니라.","tms180-s1-2-5":"술취하지 말라. 그것은 방탕한 것이니 오직 성령으로 충만하라.","tms180-s1-2-6":"내가 이것을 말하노니 성령 안에서 행하라. 그리하면 너희는 육신의 정욕을 이루지 아니하리라.","tms180-s1-2-7":"그러나 기록된 바와 같이 \"하나님께서 자기를 사랑하는 자들을 위하여 예비하신 것들은 눈으로 보지도 못하였고, 귀로 듣지도 못하였으며, 인간의 마음 속에 들어온 적도 없었느니라.\"한 것이라. 오직 하나님께서 이것들을 우리에게 그의 영으로 나타내셨으니, 이는 성령께서는 모든 것 심지어 하나님의 깊은 것들까지도 통찰하시기 때문이라.","tms180-s1-2-8":"그러나 위로자이신 성령을 아버지께서 내 이름으로 보내시리니, 그가 너희에게 모든 것들을 가르치시며 또 내가 너희에게 말한 모든 것들을 생각나게 하시리라.","tms180-s1-2-9":"또 내 말과 내 설교를 설득력 있는 인간의 지혜의 말로 하지 않고 성령과 능력을 나타냄으로 하였으니 이는 너희의 믿음이 인간의 지혜에 있게 하지 아니하고, 하나님의 능력에 있게 하려 함이라.","tms180-s1-2-10":"이는 우리의 복음이 말로만 너희에게 이른 것이 아니라 능력과 성령과 대단한 확신으로 된 것이니 우리가 너희 가운데서 너희를 위하여 어떻게 했다는 것을 너희도 아는 바라.","tms180-s1-2-11":"그러나 이 모든 일은 한 분이신 같은 성령께서 역사하시어 그 분께서 원하시는 대로 각 사람에게 나누어 주시느니라.","tms180-s1-2-12":"다양한 은사들이 있으나 성령은 동일하며 다양한 역사들이 있으나 모든 것 안에서 모든 것을 역사하시는 하나님은 동일하니라.","tms180-s1-3-1":"아, 주 하나님이여! 보소서, 주께서는 주의 큰 권능과 펴신 팔로 하늘과 땅을 지으셨으니, 주께는 어려워서 못하실 일이 없나이다.","tms180-s1-3-2":"오, 깊도다, 하나님의 지혜와 지식의 부요함이여! 그 분의 심판을 어찌 헤아리며 그 분의 지나간 길을 어찌 찾아 내리요?","tms180-s1-3-3":"주가 말하노라. 누가 은밀한 곳에 자신을 숨겨 나로 그를 보지 못하게 할 수 있느냐? 주가 말하노라. 내가 하늘과 땅을 충만케 하지 아니하냐?","tms180-s1-3-4":"하나님께서는 너희에게 모든 은혜를 넘치게 하실 수 있나니, 모든 것을 언제나 너희가 필요한 대로 가질 수 있게 하심으로 모든 선한 일에 넘치게 하시려는 것이라.","tms180-s1-3-5":"오 주여, 위대하심과 권세와 영광과 승리와 위엄이 주의 것이니이다. 이는 하늘과 땅에 있는 모든 것이 주의 것이며, 오 주여, 왕국이 주의 것이며, 주는 만유 위의 머리로서 높임을 받으심이니이다. 우리 하나님이여, 그러므로 이제, 우리가 주께 감사드리고 주의 영광스러운 이름을 찬양하나이다.","tms180-s1-3-6":"그러나 주께서는 신실하시어 너희를 굳게 하시고, 악으로부터 지키시리라.","tms180-s1-3-7":"하나님은 영이시니 그 분께 경배드리는 자들은 영과 진리로 경배드려야만 하리라.\"고 하시니라.","tms180-s1-3-8":"오히려 너희를 부르신 그 분께서 거룩하신 것처럼 너희도 모든 행실에 거룩하라. 이는 기록되기를 \"내가 거룩하니 너희도 거룩하라.\"고 하시기 때문이니라.","tms180-s1-3-9":"주는 위대하시며 크게 찬양을 받으실 것이요, 그의 위대하심은 헤아릴 수 없도다.","tms180-s1-3-10":"여기에 사랑이 있으니, 우리가 하나님을 사랑한 것이 아니요 그 분이 우리를 사랑하시고 그의 아들을 우리 죄들을 위하여 화목제물로 보내신 것이라.","tms180-s1-3-11":"그러나, 오 주여, 주께서는 긍휼과 은혜와 오래참음이 충만하시고 자비와 진리가 풍성하신 하나님이시니","tms180-s1-3-12":"우리가 알거니와 하나님을 사랑하는 자들과 그 분의 목적에 따라 부름받은 자들에게는 모든 일이 합력하여 선을 이루느니라.","tms180-s2-1-1":"오직 사랑 안에서 진리를 말하며 우리가 모든 일에 성장하여 그에게 이르리니 그는 머리시며 곧 그리스도시니라.","tms180-s2-1-2":"서로 거짓말하지 말라. 너희가 그 행위와 함께 옛 사람을 벗어 버리고","tms180-s2-1-3":"허물을 덮어 주는 자는 사랑을 구하나, 일을 거듭해서 말하는 자는 친한 벗들을 갈라 놓느니라.","tms180-s2-1-4":"험담하는 자는 비밀을 누설하나, 신실한 영을 가진 자는 말을 숨기느니라.","tms180-s2-1-5":"이는 내가 마땅히 해야 할 말을 하여 신비를 나타내려 함이라. 너희의 말이 항상 은혜와 더불어 있게 하고 소금으로 맛을 내듯 하라. 이는 각 사람에게 어떻게 대답해야 하는가를 알게 하려는 것이라.","tms180-s2-1-6":"유순한 대답은 진노를 삭이나, 과격한 말은 화를 일으키느니라.","tms180-s2-1-7":"그러므로 너희는 서로 잘못을 자백하고 치유를 위하여 서로 기도하라. 의인의 효과적이고 열렬한 기도는 역사하는 힘이 많으니라.","tms180-s2-1-8":"그러므로 만일 네가 예물을 제단에 드리다가 네 형제가 네게 반감을 갖고 있다는 것이 생각나거든 네 예물을 제단 앞에 놓아 두고 가서 네 형제와 먼저 화해하고 와서 예물을 드리라.","tms180-s2-1-9":"그러므로 나의 사랑하는 형제들아, 사람마다 듣기는 빨리 하고, 말하기는 더디 하며, 성내기도 더디 하라.","tms180-s2-1-10":"일을 듣기도 전에 대답하는 자는 미련하여 수치를 당하느니라.","tms180-s2-1-11":"교만한 자를 책망하지 말라. 혹 그가 너를 미워할까 함이요, 현명한 자를 꾸짖으라. 그리하면 그가 너를 사랑하리라. 현명한 자를 훈계하라. 그리하면 그가 더욱 현명해질 것이요, 의로운 사람을 가르치라. 그리하면 그의 학식이 더 늘어나리라.","tms180-s2-1-12":"또 네 형제가 네게 죄를 짓거든 가서 너와 그 사람만 있을 때 그에게 그의 잘못을 일러주라. 만일 그가 네 말을 들으면 너는 네 형제를 얻은 것이라.","tms180-s2-2-1":"너희는 서로 친절하고 다정다감하며 서로 용서하되 하나님께서 그리스도 안에서 너희를 용서하신 것같이 하라.","tms180-s2-2-2":"만일 어떤 사람이 누구에게 불평이 있으면 서로 용납하고 서로 용서하기를 마치 그리스도께서 너희를 용서하신 것같이 너희도 그리하라.","tms180-s2-2-3":"모든 겸손과 온유와 오래 참음과 사랑 가운데서 서로 용납하고","tms180-s2-2-4":"주의 종은 다투어서는 아니되고 모든 사람들에게 온유하며, 가르치기를 잘하고 잘 참으며 반대하는 자들을 온유함으로 바르게 잡아 주어야 하리니 그리하면 하나님께서 그들에게 회개하는 마음을 주셔서 진리를 깨닫도록 하실까 함이요","tms180-s2-2-5":"화를 내되 죄는 짓지 말고 해가 지도록 분노를 품지 말며","tms180-s2-2-6":"이제는 너희가 이 모든 것, 즉 분노와 성냄과 악의와 하나님을 모독하는 것과 너희 입에서 나오는 추잡한 말을 벗어 버리라.","tms180-s2-2-7":"하나님의 은혜에 미치지 못하는 자가 없도록 열심히 돌아보고 또 쓴 뿌리가 나와서 너희를 괴롭게 하거나 혹 그것 때문에 많은 사람이 더럽혀지지 않도록 하라.","tms180-s2-2-8":"모든 신랄함과 분개와 분노와 고함지르는 것과 욕설을 모든 악의와 함께 너희로부터 버리라.","tms180-s2-2-9":"너희의 잘못들로 인해 매를 맞고 참으면 무슨 영광이 있겠느냐? 그러나 선을 행하다가 고난을 받고 참으면 그것은 하나님께서 기뻐하실 만한 것이 되느니라. 이를 위하여 너희가 부르심을 받았으니 그리스도도 우리를 위하여 고난을 받으시고 우리에게 한 본을 남겨 놓으시어 너희로 그의 발자취를 따르게 하셨느니라.","tms180-s2-2-10":"사랑하는 자들아, 너희 스스로 복수하지 말고 진노하심에 맡기라. 기록되었으되 \"원수 갚는 것은 나의 일이니, 내가 갚으리라. 주가 말하노라.\"고 하였느니라.","tms180-s2-2-11":"진노는 잔인하고 성냄은 사나우나, 시기 앞에 누가 설 수 있으리요?","tms180-s2-2-12":"이는 시기와 다툼이 있는 곳에는 혼란과 온갖 악한 일이 있기 때문이라.","tms180-s2-3-1":"이제 인내와 위로의 하나님께서 너희에게 그리스도 예수를 따라서 서로 같은 생각을 갖게 하사 한 생각과 한 입으로 하나님, 곧 우리 주 예수 그리스도의 아버지께 영광을 돌리게 하시길 원하노라.","tms180-s2-3-2":"형제들아, 이제 내가 우리 주 예수 그리스도의 이름으로 너희에게 권고하노니, 너희 모두는 같은 것을 말하고 또 너희 가운데 분열이 없게 하여 같은 생각과 같은 의견으로 온전히 함께 연합하라.","tms180-s2-3-3":"그렇지만 너희는 그렇게 되어서는 아니되느니라. 너희 가운데 누구든지 크게 되고자 하는 자는 너희를 섬기는 자가 되어야 하고 너희 중에 누구든지 으뜸이 되고자 하는 자는 너희의 종이 되어야 하느니라.","tms180-s2-3-4":"형제들아, 너희가 자유에로 부름을 받았으니 그 자유를 육신을 위한 계기로 삼지 말고 사랑으로 서로 섬기라.","tms180-s2-3-5":"우리 가운데 각 사람은 선을 위하여 자기 이웃을 기쁘게 하고 덕을 세우자.","tms180-s2-3-6":"어떤 일도 다툼이나 허영을 따라서 하지 말고 오직 생각의 겸손함으로 남을 자신들 보다 존중하고 각자 자기 일만 돌보지 말고 남의 일도 돌아보라.","tms180-s2-3-7":"그러므로 너희가 행하고 있는 것처럼 서로 위로하고 서로를 세워 주라.","tms180-s2-3-8":"둘이 하나보다 더 나으니, 이는 그들이 그들의 수고에 대한 좋은 상을 가짐이라. 이는 그들이 넘어지면 하나가 그의 동료를 일으켜 세울 것임이라. 그러나 혼자 있는 자가 넘어지면 그에게 화로다. 이는 그를 도와 일으켜 줄 다른 사람이 없음이라.","tms180-s2-3-9":"주께서 무리를 보시고 그들을 가엾게 여기시니, 이는 그들이 목자 없는 양과 같이 지치고 흩어졌음이라.","tms180-s2-3-10":"즐거워하는 자들과 함께 즐거워하고 우는 자들과 함께 울라.","tms180-s2-3-11":"그러나 위로부터 오는 지혜는 첫째, 순수하고 그 다음은 화평하며, 친절하고, 양순하며, 자비와 선한 열매들로 가득하고, 편견이 없고, 위선이 없나니","tms180-s2-3-12":"형제들아, 어떤 사람이 무슨 잘못을 범하였으면 영적인 너희는 온유의 영으로 그런 자를 바로잡고 네 자신을 돌아보아 너도 시험을 받지 아니하도록 하라.","tms180-s3-1-1":"그의 신성의 능력이 생명과 경건에 속한 모든 것을 우리에게 주심에 따라 그에 관한 지식으로 말미암아 우리를 영광과 덕에 이르도록 부르셨으니 이로써 우리에게 지극히 크고 귀한 약속들을 주심은 너희로 하여금 이 약속들을 통해서 정욕으로 인해 세상에 있게 된 타락을 피하여 하나님의 본성에 동참하는 자가 되게 하려 하심이라.","tms180-s3-1-2":"그 분 안에 있는 하나님의 모든 약속은 \"예\"가 되기에 우리는 그 분 안에서 \"아멘\"하고 하나님께 영광을 돌리노라.","tms180-s3-1-3":"하나님을 송축하리로다. 그는 우리 주 예수 그리스도의 아버지시요, 자비의 아버지시요, 모든 위로의 하나님이시며 우리의 모든 환난 가운데서 우리를 위로하시는 분이시라. 그러므로 우리 자신도 하나님께 받은 위로로써 고난중에 있는 사람들을 위로할 수 있는 것이라.","tms180-s3-1-4":"그러므로 심는 자나 물 주는 자는 아무것도 아니지만, 오직 자라게 하시는 분은 하나님뿐이시니라. 이제 심는 자와 물 주는 자는 하나이니라. 그러나 각 사람은 자기의 수고에 따라 자기의 상을 받을 것이니라.","tms180-s3-1-5":"그의 즐거움이 주의 법에 있으니, 그가 주의 법을 주야로 묵상하는도다. 그는 강가에 심겨진 나무 같아서 계절을 따라 열매를 맺으며, 그의 잎사귀는 마르지 아니하리니, 그가 무엇을 하든지 번성하리로다.","tms180-s3-1-6":"이런 것들이 너희 안에 있어 풍성해지면 그것들이 너희로 우리 주 예수 그리스도에 대한 지식에 관한 한 게으르거나 열매 없는 자가 되지 않게 할 것이라.","tms180-s3-1-7":"그러나 모든 은혜의 하나님, 곧 그리스도 예수로 인하여 그의 영원한 영광으로 우리를 부르신 분께서, 너희가 잠깐 고난을 받은 후에 너희를 온전케 하시고, 굳게 세워 주시며, 힘을 주시고, 확고히 하시느니라.","tms180-s3-1-8":"주께서 내게 말씀하시기를 \"내 은혜가 네게 충분하도다. 이는 내 능력이 약한 데서 온전하게 됨이니라.\"고 하셨느니라. 그러므로 내가 오히려 매우 기쁘게 나의 약한 것을 자랑하니 그리스도의 능력이 내게 거하심이라.","tms180-s3-1-9":"그리스도 안에서 천상에 있는 모든 영적인 복으로 우리에게 복 주시는, 우리 주 예수 그리스도의 하나님 아버지는 복되시도다.","tms180-s3-1-10":"또 주를 기뻐하라. 그리하면 그가 네 마음의 소원들을 네게 주시리라. 너의 길을 주께 맡기고, 또 그를 신뢰하라. 그리하면 그가 이루어 주시리라.","tms180-s3-1-11":"나의 어린 자녀들아, 내가 이런 것들을 너희에게 쓰는 것은 너희로 죄를 짓지 않게 하려는 것이라. 그러나 만일 누가 죄를 지으면 우리에게 아버지와 함께 있는 한 변호인이 있으니 , 곧 의인이신 예수 그리스도시라. 그는 우리의 죄들을 위한 화목제물이시니, 우리뿐만 아니라 온 세상의 죄들을 위한 것이니라.","tms180-s3-1-12":"동이 서에서 먼 것같이 그가 우리의 죄과들을 우리로부터 멀리 옮기셨으며","tms180-s3-2-1":"하나님의 말씀은 살아 있고 활력이 있어 양 날이 있는 어떤 칼보다도 예리하여 혼과 영, 그리고 관절과 골수를 찔러 가르고 마음의 생각들과 의도들을 판별하느니라.","tms180-s3-2-2":"비와 눈이 하늘에서 내려 그곳으로 다시 돌아가지 않고 땅을 적셔서 싹을 내어 뿌리는 자에게 씨를 주고 먹는 자에게 양식을 줌과 같이 내 입에서 나가는 내 말도 그러하나니, 그것은 내게 헛되이 돌아오지 아니하고 내가 기뻐하는 것을 이루며 내가 보낸 곳에서 번성할 것이니라.","tms180-s3-2-3":"먼저 이것을 알지니 성경의 어떤 예언도 사사로운 해석에서 나온 것이 아니니 예언은 예전에 사람의 뜻에서 나온 것이 아니요 오직 하나님의 거룩한 사람들이 성령으로 감동을 받아 말한 것이니라.","tms180-s3-2-4":"이로 인하여 우리가 하나님께 쉬지 않고 감사함은 너희가 우리에게 들은 바 하나님의 말씀을 받을 때에 사람의 말로 받아들이지 아니하고 사실 그대로 하나님의 말씀으로 받았으니, 이 말씀이 믿는 너희 가운데서도 효과적으로 역사하느니라.","tms180-s3-2-5":"주의 말씀들이 발견되었기에 내가 그 말씀들을 먹었더니, 주의 말씀이 내게는 내 마음의 기쁨과 즐거움이 되었나이다. 오 만군의 주 하나님이여, 이는 내가 주의 이름으로 일컬음을 받는 자임이니이다.","tms180-s3-2-6":"내가 그의 입술의 명령에서 돌아서지 아니하였고, 내가 그의 입의 말씀을 내게 필요한 음식보다 더 귀히 여겼도다.","tms180-s3-2-7":"베뢰아 사람들은 데살로니가 사람들보다 더 고상하여서 전심으로 말씀을 받아들이고, 이 말씀이 그런가 하여 매일 성경을 상고하므로","tms180-s3-2-8":"성경을 상고하라. 이는 너희가 성경에 영생이 있다고 생각함이니 그 성경은 나에 관하여 증거하고 있음이라. 너희는 생명을 얻으려고 내게 오기를 원치 아니하는도다.","tms180-s3-2-9":"그때 예수께서 자기를 믿은 그 유대인들에게 말씀하시기를 \"너희가 내 말에 거하면 참으로 나의 제자가 되고 진리를 알게 되리니 그 진리가 너희를 자유롭게 하리라.\"고 하시더라.","tms180-s3-2-10":"그러나 주께서 대답하여 말씀하시기를 \"기록되었으되 '사람이 빵으로만 사는 것이 아니요 하나님의 입에서 나오는 모든 말씀으로 사느니라.'고 하였느니라.\" 하시더라.","tms180-s3-2-11":"하늘과 땅은 없어져도 내 말은 결코 없어지지 아니하리라.","tms180-s3-2-12":"아버지의 진리로 그들을 거룩하게 하여 주옵소서. 아버지의 말씀은 진리니이다.","tms180-s3-3-1":"그러므로 필요하다면 너희가 여러 가지 시험으로 잠시 슬퍼할 수 밖에 없지만 그것을 크게 기뻐하는 것은 너희 믿음의 시련이, 불로써 단련될지라도 없어져 버리는 금보다 훨씬 더 귀하게 되어 예수 그리스도께서 나타나실 때에 칭찬과 존귀와 영광을 받게 하려 함이니라.","tms180-s3-3-2":"내 형제들아, 너희가 여러 가지 시험에 빠질 때면 그것을 모두 기쁨으로 여기라. 그러나 인내를 온전히 이루라. 이는 너희가 온전하고 잘 갖추어져 아무것도 부족함이 없게 하려 함이라.","tms180-s3-3-3":"실로 복음을 전해들은 것은 그들이나 우리나 마찬가지이나 전파된 말씀이 그들에게 유익을 주지 못한 것은 그것을 들은 자들이 믿음을 결합시키지 못했기 때문이라.","tms180-s3-3-4":"이제 의인은 믿음으로 살리라. 그러나 누구라도 뒤로 물러나면 내 혼이 그를 기뻐하지 아니하리라.","tms180-s3-3-5":"모든 것 위에 믿음의 방패를 가짐으로써 능히 너희가 악한 자의 모든 불붙은 화살을 끌 수 있을 것이라.","tms180-s3-3-6":"그러나, 오, 하나님의 사람인 너는 이것들을 피하라. 그리고 의와 경건과 믿음과 사랑과 인내와 온유를 추구하라. 믿음의 선한 싸움을 싸우라. 영원한 생명을 붙잡으라. 이를 위하여 네가 또한 부르심을 받았고, 많은 증인들 앞에서 선한 고백을 하였느니라.","tms180-s3-3-7":"이제 믿음은 바라는 것들에 대한 실상이요 보이지 않는 것들에 대한 증거이니","tms180-s3-3-8":"그러므로 믿음은 들음에서 나오며 들음은 하나님의 말씀에 의해서니라.","tms180-s3-3-9":"이는 너희가 게으른 자가 되지 아니하고 믿음과 인내를 통하여 그 약속들을 유업으로 받는 사람들을 따르는 자들이 되게 하려는 것이라.","tms180-s3-3-10":"그와 같이 행함이 없으면 믿음만으로는 죽은 것이라.","tms180-s3-3-11":"사람이 율법의 행위로 의롭게 되는 것이 아니요, 예수 그리스도를 믿음으로 인하여 되는 줄 알고 우리도 예수 그리스도를 믿었나니, 이는 우리가 율법의 행위로써가 아니라 그리스도를 믿음으로 인하여 의로워지고자 함이라. 이는 율법의 행위로는 아무 육체도 의롭게 될 수 없음이라.","tms180-s3-3-12":"그러므로 우리가 믿음으로 의롭게 되었으니, 우리 주 예수 그리스도를 통하여 하나님과 화평을 갖느니라.","tms180-s4-1-1":"그러나 우리 주 예수 그리스도를 통하여 우리에게 승리를 주시는 하나님께 감사하노니","tms180-s4-1-2":"항상 우리를 그리스도 안에서 승리하게 하시고, 또 어느 곳에서나 우리를 통하여 그 분에 관한 지식의 향기를 나타내게 하시는 하나님께 이제 감사하노라.","tms180-s4-1-3":"(우리의 전쟁 무기는 육신적인 것이 아니요, 오직 하나님을 통하여 견고한 요새들을 무너뜨리는 능력이라.) 여러 가지 구상과 하나님을 아는 지식을 거역하여 스스로 추켜 세운 모든 높은 것들을 무너뜨리며 모든 생각을 사로잡아서 그
