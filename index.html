 không trung mà gặp Chúa, như vậy chúng ta sẽ ở cùng Chúa luôn luôn.","tms180-s1-1-12":"Hỡi kẻ rất yêu dấu, chính lúc bây giờ chúng ta là con cái Đức Chúa Trời, còn về sự chúng ta sẽ ra thể nào, thì điều đó chưa được bày tỏ. Chúng ta biết rằng khi Ngài hiện đến, chúng ta sẽ giống như Ngài, vì sẽ thấy Ngài như vốn có thật vậy. Ai có sự trông cậy đó trong lòng, thì tự mình làm nên thanh sạch, cũng như Ngài là thanh sạch.","tms180-s1-2-1":"Lúc nào Thần lẽ thật sẽ đến, thì Ngài dẫn các ngươi vào mọi lẽ thật; vì Ngài không nói tự mình, nhưng nói mọi điều mình đã nghe, và tỏ bày cho các ngươi những sự sẽ đến. Ay chính Ngài sẽ làm sáng danh ta, vì Ngài sẽ lấy điều thuộc về ta mà rao bảo cho các ngươi.","tms180-s1-2-2":"Bởi đó, tôi tỏ cùng anh em, chẳng ai cảm Thánh Linh của Đức Chúa Trời, mà nói rằng: Đức Chúa Jêsus đáng nguyền rủa! Nếu không cảm Đức Thánh Linh, cũng chẳng ai xưng Đức Chúa Jêsus là Chúa!","tms180-s1-2-3":"Về phần anh em, nếu thật quả Thánh Linh Đức Chúa Trời ở trong mình, thì không sống theo xác thịt đâu, nhưng theo Thánh Linh; song nếu ai không có Thánh Linh của Đấng Christ, thì người ấy chẳng thuộc về Ngài.","tms180-s1-2-4":"Lại vì anh em là con, nên Đức Chúa Trời đã sai Thánh Linh của Con Ngài vào lòng chúng ta, kêu rằng: A-ba! Cha!","tms180-s1-2-5":"Đừng say rượu, vì rượu xui cho luông tuồng; nhưng phải đầy dẫy Đức Thánh Linh.","tms180-s1-2-6":"Vậy tôi nói rằng: Hãy bước đi theo Thánh Linh, chớ hề làm trọn những điều ưa muốn của xác thịt.","tms180-s1-2-7":"Song le, như có chép rằng: Ay là sự mắt chưa thấy, tai chưa nghe, Và lòng người chưa nghĩ đến, Nhưng Đức Chúa Trời đã sắm sẵn điều ấy cho những người yêu mến Ngài. Đức Chúa Trời đã dùng Đức Thánh Linh để bày tỏ những sự đó cho chúng ta, vì Đức Thánh Linh dò xét mọi sự, cả đến sự sâu nhiệm của Đức Chúa Trời nữa.","tms180-s1-2-8":"Nhưng Đấng Yên ủi, tức là Đức Thánh Linh mà Cha sẽ nhơn danh ta sai xuống, Đấng ấy sẽ dạy dỗ các ngươi mọi sự, nhắc lại cho các ngươi nhớ mọi điều ta đã phán cùng các ngươi.","tms180-s1-2-9":"Lời nói và sự giảng của tôi chẳng phải bằng bài diễn thuyết khéo léo của sự khôn ngoan, nhưng tại sự tỏ ra Thánh Linh và quyền phép; hầu cho anh em chớ lập đức tin mình trên sự khôn ngoan loài người, bèn là trên quyền phép Đức Chúa Trời.","tms180-s1-2-10":"Vả, đạo Tin Lành chúng tôi đã rao truyền cho anh em, không những bằng lời nói thôi, lại cũng bằng quyền phép, Đức Thánh Linh và sức mạnh của sự tin quyết nữa. Vì anh em biết rõ cách chúng tôi ở giữa anh em và lòng yêu thương đối với anh em là thể nào.","tms180-s1-2-11":"Mọi điều đó là công việc của đồng một Đức Thánh Linh mà thôi, theo ý Ngài muốn, phân phát sự ban cho riêng cho mỗi người.","tms180-s1-2-12":"Vả, có các sự ban cho khác nhau, nhưng chỉ có một Đức Thánh Linh. Có các việc làm khác nhau, nhưng chỉ có một Đức Chúa Trời, là Đấng làm mọi việc trong mọi người.","tms180-s1-3-1":"Oi! Hỡi Chúa Giê-hô-va! Chính Ngài đã dùng quyền phép lớn và cánh tay giơ ra mà làm nên trời và đất; chẳng có sự gì là khó quá cho Ngài cả.","tms180-s1-3-2":"Oi! sâu nhiệm thay là sự giàu có, khôn ngoan và thông biết của Đức Chúa Trời! Sự phán xét của Ngài nào ai thấu được, đường nẻo của Ngài nào ai hiểu được!","tms180-s1-3-3":"Đức Giê-hô-va phán: Có người nào có thể giấu mình trong các nơi kín cho ta đừng thấy chăng? Đức Giê-hô-va phán: Há chẳng phải ta đầy dẫy các từng trời và đất sao?","tms180-s1-3-4":"Đức Chúa Trời có quyền ban cho anh em đủ mọi thứ ơn đầy dẫy, hầu cho anh em hằng đủ điều cần dùng trong mọi sự, lại còn có rời rộng nữa để làm các thứ việc lành,","tms180-s1-3-5":"Hỡi Đức Giê-hô-va sự cao cả, quyền năng, vinh quang, toàn thắng, và oai nghi đáng qui về Ngài; vì muôn vật trên các từng trời và dưới đất đều thuộc về Ngài. Đức Giê-hô-va ôi! nước thuộc về Ngài; Ngài được tôn cao làm Chúa tể của muôn vật. Bây giờ, Đức Chúa Trời chúng tôi ôi! chúng tôi cảm tạ Chúa và ngợi khen danh vinh hiển của Ngài.","tms180-s1-3-6":"Chúa là thành tín, sẽ làm cho anh em bền vững và giữ cho khỏi Ac giả.","tms180-s1-3-7":"Đức Chúa Trời là thần, nên ai thờ lạy Ngài thì phải lấy tâm thần và lẽ thật mà thờ lạy.","tms180-s1-3-8":"Nhưng, như Đấng gọi anh em là thánh, thì anh em cũng phải thánh trong mọi cách ăn ở mình, bởi có chép rằng: Hãy nên thánh, vì ta là thánh.","tms180-s1-3-9":"Đức Giê-hô-va là lớn và đáng ngợi khen thay; Sự cao cả Ngài không thể dò xét được.","tms180-s1-3-10":"Nầy sự yêu thương ở tại đây: ấy chẳng phải chúng ta đã yêu Đức Chúa Trời, nhưng Ngài đã yêu chúng ta, và sai Con Ngài làm của lễ chuộc tội chúng ta.","tms180-s1-3-11":"Nhưng, Chúa ơi, Chúa là Đức Chúa Trời hay thương xót và làm ơn, Chậm nóng giận, có sự nhơn từ và sự chơn thật dư dật.","tms180-s1-3-12":"Vả, chúng ta biết rằng mọi sự hiệp lại làm ích cho kẻ yêu mến Đức Chúa Trời, tức là cho kẻ được gọi theo ý muốn Ngài đã định.","tms180-s2-1-1":"nhưng muốn cho chúng ta lấy lòng yêu thương nói ra lẽ chơn thật, để trong mọi việc chúng ta đều được thêm lên trong Đấng làm đầu, tức là Đấng Christ.","tms180-s2-1-2":"Chớ nói dối nhau, vì đã lột bỏ người cũ cùng công việc nó,","tms180-s2-1-3":"Kẻ nào lấp giấu tội lỗi tìm cầu điều tình ái; Còn ai nhắc lập lại điều gì chia rẽ bạn bậu thiết cốt.","tms180-s2-1-4":"Kẻ đi thèo lẻo tỏ ra điều kín đáo; Còn ai có lòng trung tín giữ kín công việc.","tms180-s2-1-5":"lại hầu cho tôi được tỏ cho biết lẽ ấy như điều tôi phải nói. Lời nói anh em phải có ân hậu theo luôn, và nêm thêm muối, hầu cho anh em biết nên đối đáp mỗi người là thể nào.","tms180-s2-1-6":"Lời đáp êm nhẹ làm nguôi cơn giận; Còn lời xẳng xớm trêu thạnh nộ thêm.","tms180-s2-1-7":"Vậy, hãy xưng tội cùng nhau, và cầu nguyện cho nhau, hầu cho anh em được lành bịnh: người công bình lấy lòng sốt sắng cầu nguyện, thật có linh nghiệm nhiều.","tms180-s2-1-8":"Ay vậy, nếu khi nào ngươi đem dâng của lễ nơi bàn thờ, mà nhớ lại anh em có điều gì nghịch cùng mình, thì hãy để của lễ trước bàn thờ, trở về giảng hòa với anh em trước đã; rồi hãy đến dâng của lễ.","tms180-s2-1-9":"Hỡi anh em yêu dấu, anh em biết điều đó: người nào cũng phải mau nghe mà chậm nói, chậm giận;","tms180-s2-1-10":"Trả lời trước khi nghe, Ay là sự điên dại và hổ thẹn cho ai làm vậy.","tms180-s2-1-11":"Chớ trách kẻ nhạo báng, e nó ghét con; Hãy trách người khôn ngoan, thì người sẽ yêu mến con. Hãy khuyên giáo người khôn ngoan, thì người sẽ được nên khôn ngoan hơn; Khá dạy dỗ người công bình, thì người sẽ thêm tri thức nữa.","tms180-s2-1-12":"Nếu anh em ngươi phạm tội cùng ngươi, thì hãy trách người khi chỉ có ngươi với một mình người; như người nghe lời, thì ngươi được anh em lại.","tms180-s2-2-1":"Hãy ở với nhau cách nhơn từ, đầy dẫy lòng thương xót, tha thứ nhau như Đức Chúa Trời đã tha thứ anh em trong Đấng Christ vậy.","tms180-s2-2-2":"nếu một người trong anh em có sự gì phàn nàn với kẻ khác thì hãy nhường nhịn nhau và tha thứ nhau: như Chúa đã tha thứ anh em thể nào, thì anh em cũng phải tha thứ thể ấy.","tms180-s2-2-3":"phải khiêm nhường đến điều, mềm mại đến điều, phải nhịn nhục, lấy lòng thương yêu mà chìu nhau,","tms180-s2-2-4":"Vả, tôi tớ của Chúa không nên ưa sự tranh cạnh; nhưng phải ở tử tế với mọi người, có tài dạy dỗ, nhịn nhục, dùng cách mềm mại mà sửa dạy những kẻ chống trả, mong rằng Đức Chúa Trời ban cho họ sự ăn năn để nhìn biết lẽ thật,","tms180-s2-2-5":"Ví bằng anh em đương cơn giận, thì chớ phạm tội; chớ căm giận cho đến khi mặt trời lặn,","tms180-s2-2-6":"Nhưng bây giờ anh em nên trừ bỏ hết nói sự đó, tức là sự thạnh nộ, buồn giận và hung ác. Đừng nói hành ai, chớ có một lời tục tỉu nào ra từ miệng anh em.","tms180-s2-2-7":"Khá coi chừng kẻo có kẻ trật phần ân điển của Đức Chúa Trời, kẻo rễ đắng châm ra, có thể ngăn trở và làm ô uế phần nhiều trong anh em chăng.","tms180-s2-2-8":"Phải bỏ khỏi anh em những sự cay đắng, buồn giận, tức mình, kêu rêu, mắng nhiếc, cùng mọi điều hung ác.","tms180-s2-2-9":"Vả, mình làm điều ác, bị đánh mà hay nhịn chịu, thì có đáng khoe gì: Nhưng nếu anh em làm lành, mà nhịn chịu sự khốn khó, ấy là một ơn phước trước mặt Đức Chúa Trời. anh em đã được kêu gọi đến sự đó, vì Đấng Christ cũng đã chịu khổ cho anh em, để lại cho anh em một gương, hầu cho anh em noi dấu chơn Ngài;","tms180-s2-2-10":"Hỡi kẻ rất yêu dấu của tôi ơi, chính mình chớ trả thù ai, nhưng hãy nhường cho cơn thạnh nộ của Đức Chúa Trời; vì có chép lời Chúa phán rằng: Sự trả thù thuộc về ta, ta sẽ báo ứng.","tms180-s2-2-11":"Sự căm gan vốn hung dữ, và cơn giận như nước tràn ra; Nhưng ai đứng nổi trước sự ghen ghét?","tms180-s2-2-12":"Vì ở đâu có những điều ghen tương tranh cạnh ấy, thì ở đó có sự lộn lạo và đủ mọi thứ ác.","tms180-s2-3-1":"Xin Đức Chúa Trời hay nhịn nhục và yên ủi ban cho anh em được đồng lòng ở với nhau theo Đức Chúa Jêsus Christ; để anh em lấy một lòng một miệng mà ngợi khen Đức Chúa Trời, là Cha của Đức Chúa Jêsus Christ chúng ta.","tms180-s2-3-2":"Hỡi Anh em, tôi nhơn danh Đức Chúa Jêsus Christ chúng ta, khuyên anh em thảy đều phải đồng một tiếng nói với nhau, chớ phân rẽ nhau ra, nhưng phải hiệp một ý một lòng cùng nhau.","tms180-s2-3-3":"Trong các ngươi thì không như vậy; trái lại, trong các ngươi, kẻ nào muốn làm lớn, thì sẽ làm đầy tớ các ngươi; còn kẻ nào muốn làm đầu, thì sẽ làm tôi mọi các ngươi.","tms180-s2-3-4":"Hỡi anh em, anh em đã được gọi đến sự tự do, song chớ lấy sự tự do đó làm dịp cho anh em ăn ở theo tánh xác thịt, nhưng hãy lấy lòng yêu thương làm đầy tớ lẫn nhau.","tms180-s2-3-5":"Mỗi người trong chúng ta nên làm đẹp lòng kẻ lân cận mình, đặng làm điều ích và nên gương tốt.","tms180-s2-3-6":"Chớ làm sự chi vì lòng tranh cạnh hoặc vì hư vinh, nhưng hãy khiêm nhường, coi người khác như tôn trọng hơn mình. Mỗi người trong anh em chớ chăm về lợi riêng mình, nhưng phải chăm về lợi kẻ khác nữa.","tms180-s2-3-7":"Vậy thì anh em hãy khuyên bảo nhau, gây dựng cho nhau, như anh em vẫn thường làm.","tms180-s2-3-8":"Hai người hơn một, vì hai sẽ được công giá tốt về công việc mình. Nếu người này sa ngã, thì người kia sẽ đỡ bạn mình lên; nhưng khốn thay cho kẻ ở một mình mà sa ngã, không có ai đỡ mình lên!","tms180-s2-3-9":"Khi Ngài thấy những đám dân đông, thì động lòng thương xót, vì họ khốn cùng, và tan lạc như chiên không có kẻ chăn.","tms180-s2-3-10":"Hãy vui với kẻ vui, khóc với kẻ khóc.","tms180-s2-3-11":"Nhưng sự khôn ngoan từ trên mà xuống thì trước hết là thanh sạch, sau lại hòa thuận, tiết độ, nhu mì, đầy dẫy lòng thương xót và bông trái lành, không có sự hai lòng và giả hình.","tms180-s2-3-12":"Hỡi anh em, vì bằng có người nào tình cờ phạm lỗi gì, anh em là kẻ có Đức Chúa Trời, hãy lấy lòng mềm mại mà sửa họ lại; chính mình anh em lại phải giữ, e cũng bị dỗ dành chẳng.","tms180-s3-1-1":"Quyền phép Đức Chúa Trời đã ban cho chúng ta mọi điều thuộc về sự sống và sự tôn kính, khiến chúng ta biết Đấng lấy vinh hiển và nhơn đức mà gọi chúng ta, và bởi vinh hiển nhơn đức ấy, Ngài lại ban lời hứa rất quí rất lớn cho chúng ta, hầu cho nhờ đó anh em được lánh khỏi sự hư nát của thế gian bởi tư dục đến, mà trở nên người dự phần bổn tánh Đức Chúa Trời.","tms180-s3-1-2":"Vì chưng cũng như các lời hứa của Đức Chúa Trời đều là phải trong Ngài cả, ấy cũng bởi Ngài mà chúng tôi nói A-men, làm sáng danh Đức Chúa Trời.","tms180-s3-1-3":"Chúc tạ Đức Chúa Trời, Cha Đức Chúa Jêsus Christ chúng ta, là Cha hay thương xót, là Đức Chúa Trời ban mọi sự yên ủi. Ngài yên ủi chúng tôi trong mọi sự khốn nạn, hầu cho nhơn sự yên ủi mà Ngài đã yên ủi chúng tôi, thì chúng tôi cũng có thể yên ủi kẻ khác trong sự khốn nạn nào họ gặp!","tms180-s3-1-4":"Vậy, người trồng kẻ tưới, đều không ra gì, song Đức Chúa Trời là Đấng làm cho lớn lên. Người trồng, kẻ tưới, đều bằng nhau; ai nấy sẽ nhận phần thưởng tùy theo việc mình đã làm.","tms180-s3-1-5":"Song lấy làm vui vẻ về luật pháp của Đức Giê-hô-va, Và suy gẫm luật pháp ấy ngày và đêm. Người ấy sẽ như cây trồng gần dòng nước, Sanh bông trái theo thì tiết, Lá nó cũng chẳng tàn héo; Mọi sự người làm đều sẽ thạnh vượng.","tms180-s3-1-6":"Vì nếu các điều đó có đủ trong anh em và đầy dẫy nữa, thì ắt chẳng để cho anh em ở dưng hoặc không kết quả trong sự nhận biết Đức Chúa Jêsus Christ chúng ta đâu.","tms180-s3-1-7":"Đức Chúa Trời ban mọi ơn đã gọi anh em đến sự vinh hiển đời đời của Ngài trong Đấng Christ, thì sau khi anh em tạm chịu khổ, chính Ngài sẽ làm cho anh em trọn vẹn, vững vàng, và thêm sức cho.","tms180-s3-1-8":"Nhưng Chúa phán rằng: An điển ta đủ cho ngươi rồi, vì sức mạnh của ta nên trọn vẹn trong sự yếu đuối. Vậy, tôi sẽ rất vui lòng khoe mình về sự yếu đuối tôi, hầu cho sức mạnh của Đấng Christ ở trong tôi.","tms180-s3-1-9":"Ngợi khen Đức Chúa Trời, Cha Đức Chúa Jêsus Christ chúng ta, Ngài đã xuống phước cho chúng ta trong Đấng Christ đủ mọi thứ phước thiêng liêng ở các nơi trên trời,","tms180-s3-1-10":"Cũng hãy khoái lạc nơi Đức Giê-hô-va, Thì Ngài sẽ ban cho ngươi điều lòng mình ao ước. Hãy phó thác đường lối mình cho Đức Giê-hô-va, Và nhờ cậy nơi Ngài, thì Ngài sẽ làm thành việc ấy.","tms180-s3-1-11":"Hỡi con cái bé mọn ta, ta viết cho các con những điều nầy, hầu cho các con khỏi phạm tội. Nếu có ai phạm tội, thì chúng ta có Đấng cầu thay ở nơi Đức Chúa Cha, là Đức Chúa Jêsus Christ, tức là Đấng công bình. Ay chính Ngài làm của lễ chuộc tội lỗi chúng ta, không những vì tội lỗi chúng ta thôi đâu, mà cũng vì tội lỗi cả thế gian nữa.","tms180-s3-1-12":"Phương đông xa cách phương tây bao nhiêu, Thì Ngài đã đem sự vi phạm chúng tôi khỏi xa chúng tôi bấy nhiêu.","tms180-s3-2-1":"Vì lời của Đức Chúa Trời là lời sống và linh nghiệm, sắc hơn gươm hai lưỡi, thấu vào đến đỗi chia hồn, linh, cốt, tủy, xem xét tư tưởng và ý định trong lòng.","tms180-s3-2-2":"Vả, như mưa và tuyết xuống từ trên trời và không trở lại nữa, mà đượm nhuần đất đai, làm cho sanh ra và kết nụ, đặng có giống cho kẻ giao, có bánh cho kẻ ăn, thì lời nói của ta cũng vậy, đã ra từ miệng ta, thì chẳng trở về luống nhưng, mà chắc sẽ làm trọn điều ta muốn, thuận lợi công việc ta đã sai khiến nó.","tms180-s3-2-3":"Trước hết, phải biết rõ rằng chẳng có lời tiên tri nào trong Kinh Thánh lấy ý riêng giải nghĩa được. Vì chẳng hề có lời tiên tri nào là bởi ý một người nào mà ra, nhưng ấy là Ngài Đức Thánh Linh cảm động mà người ta đã nói bởi Đức Chúa Trời.","tms180-s3-2-4":"Bởi vậy, chúng tôi tạ ơn Đức Chúa Trời không thôi về sự anh em tiếp nhận lời của Đức Chúa Trời mà chúng tôi đã truyền cho, không coi như lời của loài người, bèn coi như lời của Đức Chúa Trời, vì thật là lời Đức Chúa Trời, cũng hành động trong anh em có lòng tin.","tms180-s3-2-5":"Tôi vừa nghe những lời Ngài, thì đã ăn lấy rồi; lời Ngài là sự vui mừng hớn hở của lòng tôi vậy. Hỡi Giê-hô-va Đức Chúa Trời vạn quân, vì tôi được xưng bằng danh Ngài!","tms180-s3-2-6":"Tôi chẳng hề lìa bỏ các điều răn của môi Ngài, Vẫn vâng theo lời của miệng Ngài hơn là ý muốn lòng tôi.","tms180-s3-2-7":"Những người nầy có ý hẳn hoi hơn người Tê-sa-lô-ni-ca, đều sẵn lòng chịu lấy đạo, ngày nào cũng tra xem Kinh Thánh, để xét lời giảng có thật chăng.","tms180-s3-2-8":"Các ngươi dò xem Kinh Thánh, vì tưởng bởi đó được sự sống đời đời: ấy là Kinh Thánh làm chứng về ta vậy. Các ngươi không muốn đến cùng ta để được sự sống!","tms180-s3-2-9":"Bấy giờ Ngài phán cùng những người Giu-đa đã tin Ngài, rằng: Nếu các ngươi hằng ở trong đạo ta, thì thật là môn đồ ta; các ngươi sẽ biết lẽ thật, và lẽ thật sẽ buông tha các ngươi.","tms180-s3-2-10":"Đức Chúa Jêsus đáp: Có lời chép rằng: Người ta sống chẳng phải chỉ nhờ bánh mà thôi, song nhờ mọi lời nói ra từ miệng Đức Chúa Trời.","tms180-s3-2-11":"Trời đất sẽ qua, nhưng lời ta nói chẳng bao giờ qua đi.","tms180-s3-2-12":"Xin Cha lấy lẽ thật khiến họ nên thánh; lời Cha tức là lẽ thật.","tms180-s3-3-1":"Anh em vui mừng về điều đó, dầu hiện nay anh em vì sự thử thách trăm bề buộc phải buồn bã ít lâu; hầu cho sự thử thách đức tin anh em quí hơn vàng hay hư nát, dầu đã bị thử lửa, sanh ra ngợi khen, tôn trọng, vinh hiển cho anh em khi Đức Chúa Jêsus Christ hiện ra.","tms180-s3-3-2":"Hỡi anh em, hãy coi sự thử thách trăm bề thoạt đến cho anh em như là điều vui mừng trọn vẹn, Nhưng sự nhịn nhục phải làm trọn việc nó, hầu cho chính mình anh em cũng trọn lành toàn vẹn, không thiếu thốn chút nào.","tms180-s3-3-3":"Vì tin Lành nầy đã rao truyền cho chúng ta cũng như cho họ; những lời họ đã nghe không ích chi hết, vì trong khi nghe, chẳng lấy đức tin nhận lời đó thuộc về mình.","tms180-s3-3-4":"Người công bình của ta sẽ cậy đức tin mà sống, Nhưng nếu lui đi thì linh hồn ta chẳng lấy làm đẹp chút nào.","tms180-s3-3-5":"Lại phải lấy thêm đức tin làm thuẫn, nhờ đó anh em có thể dập tắt được các tên lửa của kẻ dữ.","tms180-s3-3-6":"Nhưng, hỡi con, là người của Đức Chúa Trời, hãy tránh những sự đó đi, mà tìm điều công bình, tôn kính, đức tin, yêu thương, nhịn nhục, mềm mại. Hãy vì đức tin mà đánh trận tốt lành, bắt lấy sự sống đời đời, là sự mà con đã được gọi đến, và vì đó mà con đã làm chứng tốt lành trước mặt nhiều người chứng kiến.","tms180-s3-3-7":"Vả, đức tin là sự biết chắc vững vàng của những điều mình đương trông mong là bằng cớ của những điều mình chẳng xem thấy.","tms180-s3-3-8":"Như vậy, đức tin đến bởi sự người ta nghe, mà người ta nghe, là khi lời của Đấng Christ được rao giảng.","tms180-s3-3-9":"đến nỗi anh em không trễ nải, nhưng cứ học đòi những kẻ bởi đức tin và lòng nhịn nhục mà được hưởng lời hứa.","tms180-s3-3-10":"Về đức tin, cũng một lẽ ấy; nếu đức tin không sanh ra việc làm, thì tự mình nó chết.","tms180-s3-3-11":"Dầu vậy, đã biết rằng người ta được xưng công bình, chẳng phải bởi các việc luật pháp đâu, bèn là cậy đức tin trong Đức Chúa Jêsus Christ, nên chính chúng tôi đã tin Đức Chúa Jêsus Christ, để được xưng công bình bởi đức tin trong Đấng Christ, chớ chẳng bởi các việc luật pháp; vì chẳng có ai được xưng công bình bởi các việc luật pháp.","tms180-s3-3-12":"Vậy chúng ta đã được xưng công bình bởi đức tin, thì được hòa thuận với Đức Chúa Trời, bởi Đức Chúa Jêsus Christ chúng ta,","tms180-s4-1-1":"Nhưng, tạ ơn Đức Chúa Trời đã cho chúng ta sự thắng, nhờ Đức Chúa Jêsus Christ chúng ta.","tms180-s4-1-2":"Song tạ ơn Đức Chúa Trời, Ngài làm cho chúng tôi được thắng trong Đấng Christ luôn luôn, và bởi chúng tôi, Ngài rải mùi thơm về sự nhận biết Ngài khắp chốn!","tms180-s4-1-3":"Vả, những khí giới mà chúng tôi dùng để chiến tranh là không phải thuộc về xác thịt đâu, bèn là bởi quyền năng của Đức Chúa Trời, có sức mạnh để đạp đổ các đồn lũy: nhờ khí giới đó chúng tôi đánh đổ các lý luận, mọi sự cao tự nổi lên nghịch cùng sự hiểu biết Đức Chúa Trời, và bắt hết các ý tưởng làm tôi vâng phục Đấng Christ.","tms180-s4-1-4":"Vả lại, anh em phải làm mạnh dạn trong Chúa, nhờ sức toàn năng của Ngài. Hãy mang lấy mọi khí giới của Đức Chúa Trời, để được đứng vững mà địch cùng mưu kế của ma quỉ.","tms180-s4-1-5":"Chúng đã thắng nó bởi huyết Chiên Con và bởi lời làm chứng của mình; chúng chẳng tiếc sự sống mình cho đến chết.","tms180-s4-1-6":"Vậy hãy phục Đức Chúa Trời; hãy chống trả ma quỉ, thì nó sẽ lánh xa anh em. Hãy đến gần Đức Chúa Trời, thì Ngài sẽ đến gần anh em. Hỡi kẻ có tội, hãy lau tay mình, có ai hai lòng, hãy làm sạch lòng đi;","tms180-s4-1-7":"Thật thế, kẻ sống theo xác thịt thì chăm những sự thuộc về xác thịt; còn kẻ sống theo Thánh Linh thì chăm những sự thuộc về Thánh Linh. Vả, chăm về xác thịt sanh ra sự chết, còn chăm về Thánh Linh sanh ra sự sống và bình an;","tms180-s4-1-8":"nhưng hãy mặc lấy Đức Chúa Jêsus Christ, chớ chăm nom về xác thịt mà làm cho phỉ lòng dục nó.","tms180-s4-1-9":"Hỡi các con cái bé mọn, phần các con, là thuộc về Đức Chúa Trời, đã thắng được họ rồi, vì Đấng ở trong các con là lớn hơn kẻ ở trong thế gian.","tms180-s4-1-10":"vì hễ sự gì sanh bởi Đức Chúa Trời, thì thắng hơn thế gian; và sự thắng hơn thế gian, ấy là đức tin của chúng ta. Ai là người thắng hơn thế gian, há chẳng phải kẻ tin Đức Chúa Jêsus là Con Đức Chúa Trời hay sao?","tms180-s4-1-11":"Luật pháp Đức Chúa Trời người ở trong lòng người; Bước người không hề xiêu tó.","tms180-s4-1-12":"Vậy, chớ để tội lỗi cai trị trong xác hay chết của anh em, và chớ chiều theo tư dục nó. Chớ nộp chi thể mình cho tội lỗi, như là đồ dùng gian ác, nhưng hãy phó chính mình anh em cho Đức Chúa Trời, dường như đã chết mà nay trở nên sống, và dâng chi thể mình cho Đức Chúa Trời như là đồ dùng về sự công bình.","tms180-s4-2-1":"Rốt lại, hỡi anh em, phàm điều cho chơn thật, điều chi đáng tôn, điều chi công bình, điều chi thánh sạch, điều chi đáng yêu chuộng, điều chi có tiếng tốt, điều chi có nhân đức đáng khen, thì anh em phải nghĩ đến.","tms180-s4-2-2":"Mọi sự là tinh sạch cho những người tinh sạch, nhưng, cho những kẻ dơ dáy và chẳng tin, thì không sự gì là tinh sạch cả; trái lại, tâm thần và lương tâm họ là dơ dáy nữa.","tms180-s4-2-3":"Người lành bởi lòng chứa điều thiện mà phát ra điều thiện, kẻ dữ bởi lòng chứa điều ác mà phát ra điều ác; vì do sự đầy dẫy trong lòng mà miệng nói ra.","tms180-s4-2-4":"Khá cẩn thận giữ tấm lòng của con hơn hết, Vì các nguồn sự sống do nơi nó mà ra.","tms180-s4-2-5":"Con mắt là đèn của thân thể. Nếu mắt ngươi sáng sủa thì cả thân thể ngươi sẽ được sáng láng;","tms180-s4-2-6":"Song ta phán cho các ngươi biết: Hễ ai ngó đờn bà mà động tình tham muốn, thì trong lòng đã phạm tội tà dâm cùng người rồi.","tms180-s4-2-7":"Vì ý muốn Đức Chúa Trời, ấy là khiến anh em nên thánh: tức là phải lánh sự ô uế,","tms180-s4-2-8":"Đồ ăn vì bụng, bụng vì đồ ăn, Đức Chúa Trời sẽ hủy hoại cái nọ và cái kia. Nhưng thân thể chẳng phải vì sự dâm dục đâu, bèn là vì Chúa, và Chúa vì thân thể;","tms180-s4-2-9":"chớ có một lời dữ nào ra từ miệng anh em; nhưng khi đáng nói hãy nói một vài lời lành giúp ơn cho và có ích lợi cho kẻ nghe đến.","tms180-s4-2-10":"Vả, ta bảo các ngươi, đến ngày phán xét, người ta sẽ khai ra mọi lời hư không mà mình đã nói; vì bởi lời nói mà ngươi sẽ được xưng là công bình, cũng bởi lời nói mà ngươi sẽ bị phạt.","tms180-s4-2-11":"Bất cứ việc gì tựa như điều ác, thì phải tránh đi.","tms180-s4-2-12":"Chớ quở nặng người già cả, nhưng hãy khuyên dỗ họ như cha, còn kẻ trẻ thì như anh em, đờn bà có tuổi cũng như mẹ, bọn thiếu nữ như chị em, mà phải lấy cách thánh sạch trọn vẹn.","tms180-s4-3-1":"Trong khi cầu nguyện, các ngươi lấy đức tin xin việc gì bất kỳ, thảy đều được cả.","tms180-s4-3-2":"Hãy xin, sẽ được; hãy tìm, sẽ gặp; hãy gõ cửa, sẽ mở cho. Bởi vì, hễ ai xin thì được; ai tìm thì gặp; ai gõ cửa thì được mở.","tms180-s4-3-3":"Song khi ngươi cầu nguyện, hãy vào phòng riêng, đóng cửa lại, rồi cầu nguyện Cha ngươi, ở nơi kín nhiệm đó; và Cha ngươi, là Đấng thấy trong chỗ kín nhiệm, sẽ thưởng cho ngươi.","tms180-s4-3-4":"Sáng hôm sau trời còn mờ mờ, Ngài chờ dậy, bước ra, đi vào nơi vắng vẻ, và cầu nguyện tại đó.","tms180-s4-3-5":"Hãy kêu cầu ta, ta sẽ trả lời cho; ta sẽ tỏ cho ngươi những việc lớn và khó, là những việc ngươi chưa từng biết.","tms180-s4-3-6":"Vả, Đức Chúa Trời, bởi quyền lực cảm động trong chúng ta, có thể làm trổi hơn vô cùng mọi việc chúng ta cầu xin hoặc suy tưởng,","tms180-s4-3-7":"Nầy là điều chúng ta dạn dĩ ở trước mặt Chúa, nếu chúng ta theo ý muốn Ngài mà cầu xin việc gì, thì Ngài nghe chúng ta. Nếu chúng ta biết không cứ mình xin điều gì, Ngài cũng nghe chúng ta, thì chúng ta biết mình đã nhận lãnh điều mình xin Ngài.","tms180-s4-3-8":"cầu nguyện không thôi, phàm làm việc gì cũng phải tạ ơn Chúa; vì ý muốn của Đức Chúa Trời trong Đức Chúa Jêsus Christ đối với anh em là như vậy.","tms180-s4-3-9":"Còn ta đây, cũng chẳng phạm tội cùng Đức Giê-hô-va mà thôi cầu nguyện cho các ngươi. Ta sẽ dạy các ngươi biết con đường lành và ngay.","tms180-s4-3-10":"Ngài bèn phán cùng môn đồ rằng: Mùa gặt thì thật trúng, song con gặt thì ít. Vậy, hãy cầu xin chủ mùa gặt sai con gặt đến trong mùa mình.","tms180-s4-3-11":"Vậy, hãy cậy Đức Chúa Jêsus mà hằng dâng tế lễ bằng lời ngợi khen cho Đức Chúa Trời, nghĩa là bông trái của môi miếng xưng danh Ngài ra.","tms180-s4-3-12":"Ha-lê-lu-gia! Hỡi linh hồn ta, hãy ngợi khen Đức Giê-hô-va! Trọn đời sống tôi sẽ ngợi khen Đức Giê-hô-va; Hễ tôi còn sống chừng nào tôi sẽ hát xướng cho Đức Chúa Trời tôi chừng nấy.","tms180-s5-1-1":"Vì Đức Chúa Trời muốn khiến họ biết sự giàu vinh hiển của sự mầu nhiệm đó ở giữa dân ngoại là thể nào, nghĩa là Đấng Christ ở trong anh em, là sự trông cậy về vinh hiển. Ay là Ngài mà chúng tôi rao giảng, lấy mọi sự khôn ngoan răn bảo mọi người, dạy dỗ mọi người, hầu cho bày tỏ mọi người trở nên trọn vẹn trong Đấng Christ ra trước mặt Đức Chúa Trời.","tms180-s5-1-2":"Vì chưng Đức Chúa Trời vốn ở trong Đấng Christ, làm cho thế gian lại hòa với Ngài, chẳng kể tội lỗi cho loài người, và đã phó đạo giảng hòa cho chúng tôi. Vậy chúng tôi làm chức khâm sai của Đấng Christ, cũng như Đức Chúa Trời bởi chúng tôi mà khuyên bảo. Chúng tôi nhơn danh Đấng Christ mà nài xin anh em: hãy hòa thuận lại với Đức Chúa Trời.","tms180-s5-1-3":"Nhưng vì Đức Chúa Trời đã xét chúng tôi là xứng đáng giao cho việc giảng Tin Lành, nên chúng tôi cứ nói, không phải để đẹp lòng loài người, nhưng để đẹp lòng Đức Chúa Trời, là Đấng dò xét lòng chúng tôi.","tms180-s5-1-4":"Vả, tôi đối với ai vẫn cũng là được tự do, mà tôi đành phục mọi người, hầu cho tôi được nhiều người hơn.","tms180-s5-1-5":"Các ngươi há chẳng nói rằng còn bốn tháng nữa thì tới mùa gặt sao? Song ta nói với các ngươi: Hãy nhướng mắt lên và xem đồng ruộng, đã vàng sẵn cho mùa gặt.","tms180-s5-1-6":"Vậy, vì lòng rất yêu thương của chúng tôi đối với anh em, nên ước ao ban cho anh em, không những Tin Lành Đức Chúa Trời thôi đâu, song cả đến chính sự sống chúng tôi nữa, bởi anh em đã trở nên thiết nghĩa với chúng tôi là bao.","tms180-s5-1-7":"như có chép rằng: Chẳng có một người công bình nào hết, dẫu một người cũng không. Chúng nó đều sai lạc cả, thảy cùng nhau ra vô ích; Chẳng có một người làm điều lành, dẫu một người cũng không.","tms180-s5-1-8":"báo thù những kẻ chẳng hề nhận biết Đức Chúa Trời, và không vâng phục Tin Lành của Đức Chúa Jêsus Christ chúng ta. Họ sẽ bị hình phạt hư mất đời đời, xa cách mặt Chúa và sự vinh hiển của quyền phép Ngài,","tms180-s5-1-9":"Ngài gánh tội lỗi chúng ta trong thân thể Ngài trên cây gỗ, hầu cho chúng ta là kẻ đã chết về tội lỗi, được sống cho sự công bình; lại nhơn những lằn đòn của Ngài mà anh em đã được lành bịnh.","tms180-s5-1-10":"Ay chính Chúa đã cứu chúng ta, đã gọi chúng ta bởi sự kêu gọi thánh, chẳng phải theo việc làm chúng ta, bèn theo ý riêng Ngài chỉ định, theo ân điển đã ban cho chúng ta trong Đức Chúa Jêsus Christ từ trước muôn đời vô cùng,","tms180-s5-1-11":"Vậy nếu miệng ngươi xưng Đức Chúa Jêsus ra và lòng ngươi tin rằng Đức Chúa Trời đã khiến Ngài từ kẻ chết sống lại, thì ngươi sẽ được cứu; vì tin bởi trong lòng mà được sự công bình, còn bởi miệng làm chứng mà được sự cứu rỗi.","tms180-s5-1-12":"Ta ban cho nó sự sống đời đời; nó chẳng chết mất bao giờ, và chẳng ai cướp nó khỏi tay ta. Cha ta là Đấng lớn hơn hết đã cho ta chiên đó, và chẳng ai cướp nổi chiên đó khỏi tay Cha.","tms180-s5-2-1":"Các đường lối của loài người đều chánh đáng theo mắt họ; Song Đức Giê-hô-va cân nhắc cái lòng.","tms180-s5-2-2":"Người nào nếu được cả thiên hạ mà mất linh hồn mình, thì có ích gì?","tms180-s5-2-3":"Nếu ai khứng làm theo ý muốn của Đức Chúa Trời, thì sẽ biết đạo lý ta có phải là bởi Đức Chúa Trời, hay là ta nói theo ý ta.","tms180-s5-2-4":"Đức Chúa Jêsus phán cùng họ rằng: Không phải người khỏe mạnh cần thầy thuốc, song là người đau ốm. Ta Không phải đến gọi kẻ công bình hối cải, song gọi kẻ có tội.","tms180-s5-2-5":"Các ngươi vẫn chịu vinh hiển lẫn của nhau, không tìm kiếm vinh hiển bởi một mình Đức Chúa Trời đến, thì thể nào các ngươi tin được?","tms180-s5-2-6":"Bởi đó Ngài có thể cứu toàn vẹn những kẻ nhờ Ngài mà đến gần Đức Chúa Trời, vì Ngài hằng sống để cầu thay cho những kẻ ấy.","tms180-s5-2-7":"Chớ khoe khoang về ngày mai; Vì con chẳng biết ngày mai sẽ sanh ra điều gì.","tms180-s5-2-8":"Như vậy, mỗi người trong chúng ta sẽ khai trình việc mình với Đức Chúa Trời.","tms180-s5-2-9":"Các ngươi dò xem Kinh Thánh, vì tưởng bởi đó được sự sống đời đời: ấy là Kinh Thánh làm chứng về ta vậy.","tms180-s5-2-10":"Có một con đường coi dường chánh đáng cho loài người; Nhưng đến cuối cùng nó thành ra nẻo sự chết.","tms180-s5-2-11":"Kế đó, Ngài sẽ phán cùng những người ở bên tả rằng: Hỡi kẻ bị rủa, hãy lui ra khỏi ta; đi vào lửa đời đời đã sắm sẵn cho ma quỉ và những quỉ sứ nó.","tms180-s5-2-12":"bởi những sự trọn lành của Ngài mắt không thấy được, tức là quyền phép đời đời và bổn tánh Ngài, thì từ buổi sáng thế vẫn sờ sờ như mắt xem thấy, khi người ta xem xét công việc của Ngài. Cho nên họ không thể chữa mình được,","tms180-s5-3-1":"vì biết rằng chẳng phải bởi vật hay hư nát như bạc hoặc vàng mà anh em đã được chuộc khỏi sự ăn ở không ra chi của tổ tiên truyền lại cho mình, bèn là bởi huyết báu Đấng Christ, dường như huyết của chiên con không lỗi không vít,","tms180-s5-3-2":"Mọi điều đó đến bởi Đức Chúa Trời, Ngài đã làm cho chúng ta nhờ Đấng Christ mà được hòa thuận lại cùng Ngài, và giao chức vụ giảng hòa cho chúng ta.","tms180-s5-3-3":"Ay là trong Đấng Christ, chúng ta được cứu chuộc bởi huyết Ngài, được tha tội, theo sự dư dật của ân điển Ngài,","tms180-s5-3-4":"Vì tội lỗi không cai trị trên anh em đâu; bởi anh em chẳng thuộc dưới luật pháp, mà thuộc dưới ân điển. Vậy thì làm sao! Vì chúng ta không thuộc dưới luật pháp, nhưng thuộc dưới ân điển, thì chúng ta sẽ phạm tội hay sao? Chẳng hề như vậy!","tms180-s5-3-5":"Vì chưng anh em bởi tin Đức Chúa Jêsus Christ, nên hết thảy đều là con trai của Đức Chúa Trời.","tms180-s5-3-6":"Nhưng anh em là dòng giống được lựa chọn, là chức thầy tế lễ nhà vua, là dân thánh là dân thuộc về Đức Chúa Trời, hầu cho anh em rao giảng nhơn đức của Đấng đã gọi anh em ra khỏi nơi tối tăm, đến nơi sáng láng lạ lùng của Ngài;","tms180-s5-3-7":"Đức Chúa Trời đã làm cho Đấng vốn chẳng biết tội lỗi trở nên tội lỗi vì chúng ta, hầu cho chúng ta nhờ Đấng đó mà được trở nên sự công bình của Đức Chúa Trời.","tms180-s5-3-8":"Vả, ấy là nhờ Ngài mà anh em ở trong Đức Chúa Jêsus Christ, là Đấng mà Đức Chúa Trời đã làm nên sự khôn ngoan, sự công bình, sự nên thánh, và sự cứu chuộc cho chúng ta;","tms180-s5-3-9":"Vì nhờ dâng chỉ một của tế lễ, Ngài làm cho những kẻ nên thánh được trọn vẹn đời đời.","tms180-s5-3-10":"và họ nhờ ân điển Ngài mà được xưng công bình nhưng không, bởi sự chuộc tội đã làm trọn trong Đức Chúa Jêsus Christ,","tms180-s5-3-11":"Nhưng chúng ta là công dân trên trời; ấy là từ nơi đó mà chúng ta trông đợi Cứu Chúa mình là Đức Chúa Jêsus Christ,","tms180-s5-3-12":"Vì sự đầy dẫy của bổn tánh Đức Chúa Trời thảy đều ở trong Đấng ấy như có hình. Anh em lại nhờ Ngài mà có được đầy dẫy mọi sự, vì Ngài là đầu của mọi quyền cai trị và mọi thế lực.","dep242-1-1":"Chính anh em hãy tự xét để xem mình có đức tin chăng. Hãy tự thử mình: anh em há không nhận biết rằng có Đức Chúa Jêsus Christ ở trong anh em sao? miễn là anh em không đáng bị bỏ.","dep242-1-2":"Chừng ấy tức là Đức Chúa Trời đã ban sự sống đời đời cho chúng ta, và sự sống ấy ở trong Con Ngài. Ai có Đức Chúa Con thì có sự sống; ai không có Con Đức Chúa Trời thì không có sự sống.","dep242-1-3":"Quả thật, quả thật, ta nói cùng các ngươi, hễ ai tin thì được sự sống đời đời.","dep242-1-4":"Ta đã viết những điều nầy cho các con, hầu cho các con biết mình có sự sống đời đời, là kẻ nào tin đến danh Con Đức Chúa Trời.","dep242-1-5":"Ay là trong Đấng Christ, chúng ta được cứu chuộc bởi huyết Ngài, được tha tội, theo sự dư dật của ân điển Ngài,","dep242-1-6":"Cho nên hiện nay chẳng còn có sự đoán phạt nào cho những kẻ ở trong Đức Chúa Jêsus Christ;","dep242-1-7":"và họ nhờ ân điển Ngài mà được xưng công bình nhưng không, bởi sự chuộc tội đã làm trọn trong Đức Chúa Jêsus Christ,","dep242-1-8":"Vậy chúng ta đã được xưng công bình bởi đức tin, thì được hòa thuận với Đức Chúa Trời, bởi Đức Chúa Jêsus Christ chúng ta,","dep242-1-9":"Ngợi khen Đức Chúa Trời, là Cha Đức Chúa Jêsus Christ chúng ta, Ngài lấy lòng thương xót cả thể khiến chúng ta lại sanh, đặng chúng ta nhờ sự Đức Chúa Jêsus Christ sống lại từ trong kẻ chết mà có sự trông cậy sống,","dep242-1-10":"không phải cứu vì việc công bình chúng ta đã làm, nhưng cứ theo lòng thương xót Ngài, bởi sự rửa về sự lại sanh và sự đổi mới của Đức Thánh Linh","dep242-1-11":"Vì hết thảy kẻ nào được Thánh Linh của Đức Chúa Trời dắt dẫn, đều là con của Đức Chúa Trời.","dep242-1-12":"Vì chưng anh em bởi tin Đức Chúa Jêsus Christ, nên hết thảy đều là con trai của Đức Chúa Trời.","dep242-1-13":"Về phần anh em, nếu thật quả Thánh Linh Đức Chúa Trời ở trong mình, thì không sống theo xác thịt đâu, nhưng theo Thánh Linh; song nếu ai không có Thánh Linh của Đấng Christ, thì người ấy chẳng thuộc về Ngài.","dep242-1-14":"Ta lại sẽ nài xin Cha, Ngài sẽ ban cho các ngươi một Đấng Yên ủi khác, để ở với các ngươi đời đời, tức là Thần lẽ thật, mà thế gian không thể nhận lãnh được, vì chẳng thấy và chẳng biết Ngài; nhưng các ngươi biết Ngài, vì Ngài vẫn ở với các ngươi và sự ở trong các ngươi.","dep242-1-15":"bề cao, hay là bề sâu, hoặc một vật nào, chẳng có thể phân rẽ chúng ta khỏi sự yêu thương mà Đức Chúa Trời đã chứng cho chúng ta trong Đức Chúa Jêsus Christ, là Chúa chúng ta.","dep242-1-16":"Ta ban cho nó sự sống đời đời; nó chẳng chết mất bao giờ, và chẳng ai cướp nó khỏi tay ta. Cha ta là Đấng lớn hơn hết đã cho ta chiên đó, và chẳng ai cướp nổi chiên đó khỏi tay Cha.","dep242-1-17":"Ay lại cũng trong Ngài mà anh em sau khi đã nghe đạo chơn thật, là đạo Tin Lành về sự cứu rỗi anh em, ấy là trong Ngài mà anh em đã tin và được ấn chứng bằng Đức Thánh Linh là Đấng Chúa đã hứa,","dep242-1-18":"anh em đã được lại sanh, chẳng phải bởi giống hay hư nát, nhưng bởi giống chẳng hay hư nát, là bởi lời hằng sống và bền vững của Đức Chúa Trời.","dep242-2-1-1":"Dầu vậy, Đức Giê-hô-va còn chờ đợi để làm ơn cho các ngươi; Ngài sẽ được tôn lên mà thương xót các ngươi; vì Giê-hô-va là Đức Chúa Trời công nghĩa. Phước thay cho mọi kẻ trông đợi Ngài!","dep242-2-1-2":"Đức Chúa Trời là thành tín, Ngài đã gọi anh em được thông công với Con Ngài là Đức Chúa Jêsus Christ, Chúa chúng ta.","dep242-2-1-3":"Hãy tìm kiếm Đức Giê-hô-va đang khi mình gặp được; hãy kêu cầu đang khi Ngài ở gần!","dep242-2-1-4":"Khi Chúa phán rằng: Các ngươi hãy tim mặt ta; Thì lòng tôi thưa cùng Chúa rằng: Đức Giê-hô-va ôi! tôi sẽ tìm mặt Ngài.","dep242-2-1-5":"Ta là gốc nho, các ngươi là nhánh. Ai cứ ở trong ta và ta trong họ thì sinh ra lắm trái; vì ngoài ta, các ngươi chẳng làm chi được.","dep242-2-1-6":"Sư tử tơ bị thiếu kém, và đói; Nhưng người nào tìm cầu Đức Giê-hô-va sẽ chẳng thiếu của tốt gì.","dep242-2-1-7":"Vừa buổi sáng, xin cho tôi nghe sự nhơn từ Chúa, Vì tôi để lòng trông cậy nơi Chúa; Xin chỉ cho tôi biết con đường phải đi, Vì linh hồn tôi ngưỡng vọng Chúa. Xin dạy tôi làm theo ý muốn Chúa, Vì Chúa là Đức Chúa Trời tôi; Nguyện Thần tốt lành của Chúa đến tôi vào đất bằng thẳng.","dep242-2-1-8":"Ta sẽ đứng nơi vọng canh, chôn chơn nơi đồn lũy, rình xem Ngài bảo ta điều gì, và ta trả lời thế nào về sự đối nại của ta.","dep242-2-2-1":"Hỡi linh hồn ta, cớ sao ngươi sờn ngã và bồn chồn trong mình ta? Hãy trông cậy nơi Đức Chúa Trời; ta sẽ còn khen ngợi Ngài nữa: Ngài là sự cứu rỗi của mặt ta, và là Đức Chúa Trời ta.","dep242-2-2-2":"nhìn xem Đức Chúa Jêsus, là cội rễ và cuối cùng của đức tin, tức là Đấng vì sự vui mừng đã đặt trước mặt mình, chịu lấy thập tự giá, khinh điều sỉ nhục, và hiện nay ngồi bên hữu ngai Đức Chúa Trời.","dep242-2-2-3":"Tôi trông đợi Đức Giê-hô-va, linh hồn tôi trông đợi Ngài; Tôi trông đợi lời của Ngài. Linh hồn tôi trông đợi Chúa Hơn người lính canh trông đợi sáng, Thật, hơn người lính canh trông đợi sáng.","dep242-2-2-4":"Đức Chúa Trời ôi! linh hồn tôi mơ ước Chúa, Như con nai cái thèm khát khe nước.","dep242-2-2-5":"Hãy trao gánh nặng ngươi cho Đức Giê-hô-va, Ngài sẽ nâng đỡ ngươi; Ngài sẽ chẳng hề cho người công bình bị rúng động.","dep242-2-2-6":"Đáng ngợi khen Chúa thay, Là Đấng hằng ngày gánh gánh nặng của chúng tôi, Tức là Đức Chúa Trời, sự cứu rỗi của chúng tôi.","dep242-2-2-7":"Bước ngươi đã nhờ Đức Giê-hô-va làm nơi nương náu mình, Và Đấng Chí cao làm nơi ở mình, Nên sẽ chẳng có tai họa gì xảy đến ngươi, Cũng chẳng có ôn-địch nào tới gần trại ngươi.","dep242-2-2-8":"Hỡi những kẻ mệt mỏi và gánh nặng, hãy đến cùng ta, ta sẽ cho các ngươi được yên nghỉ. Ta có lòng nhu mì, khiêm nhường; nên hãy gánh lấy ách của ta, và học theo ta; thì linh hồn các ngươi sẽ được yên nghỉ.","dep242-2-2-9":"Tôi thức trước rạng đông và kêu cầu; Tôi trông cậy nơi lời Chúa. Canh đêm chưa khuya, mắt tôi mở tỉnh ra, Đặng suy gẫm lời Chúa.","dep242-2-2-10":"Đức Giê-hô-va ôi! buổi sáng Ngài sẽ nghe tiếng tôi; Buổi sáng tôi sẽ trình bày duyên cớ tôi trước mặt Ngài, và trông đợi.","dep242-2-2-11":"Hãy đến, cúi xuống mà thờ lạy; Khá quì gối xuống trước mặt Đức Giê-hô-va, là Đấng Tạo hóa chúng tôi!","dep242-2-2-12":"Vậy, hãy cậy Đức Chúa Jêsus mà hằng dâng tế lễ bằng lời ngợi khen cho Đức Chúa Trời, nghĩa là bông trái của môi miếng xưng danh Ngài ra.","dep242-2-2-13":"Oi! xin Chúa cho chúng tôi buổi sáng được thỏa dạ về sự nhơn từ Chúa, Thì trọn đời chúng tôi sẽ hát mừng vui vẻ.","dep242-2-2-14":"Vì Ngài làm cho lòng khao khát được thỏa thích, Khiến cho hồn đói được đầy dẫy vật tốt.","dep242-2-3-15":"Sáng hôm sau trời còn mờ mờ, Ngài chờ dậy, bước ra, đi vào nơi vắng vẻ, và cầu nguyện tại đó.","dep242-2-3-1":"Đức Giê-hô-va đối diện phán cùng Môi-se, như một người nói chuyện cùng bạn hữu mình. Đoạn, Môi-se trở về trại quân, còn kẻ hầu trẻ của người, tên là Giô-suê, con trai của Nun, không ra khỏi Trại.","dep242-2-3-2":"Khi Đa-ni-ên nghe rằng chỉ dụ đó đã ký tên rồi, thì về nhà mình (những cửa sổ của phòng người thì mở về hướng Giê-ru-sa-lem). Tại đó, cứ một ngày ba lần, người quì gối xuống, cầu nguyện, xưng tạ trước mặt Đức Chúa Trời mình, như vẫn làm khi trước.","dep242-2-3-3":"Ngài chẳng hề giảng cho chúng mà không dùng thí dụ; nhưng, khi ở riêng, Ngài cắt nghĩa hết cho môn đồ mình.","dep242-3-1-1":"Vì chẳng hề có lời tiên tri nào là bởi ý một người nào mà ra, nhưng ấy là Ngài Đức Thánh Linh cảm động mà người ta đã nói bởi Đức Chúa Trời.","dep242-3-1-2":"Cả Kinh Thánh đều là bởi Đức Chúa Trời soi dẫn, có ích cho sự dạy dỗ, bẻ trách, sửa trị, dạy người trong sự công bình,","dep242-3-1-3":"Trời đất sẽ qua, nhưng lời ta nói chẳng bao giờ qua đi.","dep242-3-1-4":"Vì, Mọi xác thịt vì như cỏ, Mọi sự vinh hiển của nó vì như hoa cỏ. Cỏ khô, hoa rụng, Nhưng lời Chúa còn lại đời đời. Và lời đó là đạo Tin Lành đã giảng ra cho anh em.","dep242-3-1-5":"Xin Cha lấy lẽ thật khiến họ nên thánh; lời Cha tức là lẽ thật.","dep242-3-1-6":"Vậy bây giờ, hỡi Chúa Giê-hô-va! Ngài là Đức Chúa Trời, và các lời của Ngài là chơn thật; Chúa đã hứa cùng kẻ tôi tớ Chúa làm cho nó những ơn phước nầy.","dep242-3-1-7":"Lời ta há chẳng như lửa, như búa đập vỡ đá sao? Đức Giê-hô-va phán vậy.","dep242-3-1-8":"vì Tin Lành đó mà ta chịu khổ, rất đỗi bị trói như người phạm tội; nhưng đạo của Đức Chúa Trời không hề bị trói đâu.","dep242-3-1-9":"Đức Chúa Jêsus đáp: Có lời chép rằng: Người ta sống chẳng phải chỉ nhờ bánh mà thôi, song nhờ mọi lời nói ra từ miệng Đức Chúa Trời.","dep242-3-1-10":"Đoạn, Ngài bắt đầu từ Môi-se rồi kế đến mọi đấng tiên tri mà cắt nghĩa cho hai người đó những lời chỉ về Ngài trong cả Kinh Thánh.","dep242-3-2-1":"anh em đã được lại sanh, chẳng phải bởi giống hay hư nát, nhưng bởi giống chẳng hay hư nát, là bởi lời hằng sống và bền vững của Đức Chúa Trời.","dep242-3-2-2":"Ay chính Ngài theo ý muốn mình, đã dùng lời chân thật sanh chúng ta, hầu cho chúng ta được nên như trái đầu mùa của những vật Ngài dựng nên.","dep242-3-2-3":"thì hãy ham thích sữa thiêng liêng của đạo, như trẻ con mới đẻ vậy, hầu cho anh em nhờ đó lớn lên mà được rỗi linh hồn,","dep242-3-2-4":"Bây giờ tôi giao phó anh em cho Đức Chúa Trời và cho đạo của ơn Ngài, là giao phó cho Đấng có thể gây dựng và ban gia tài cho anh em chung với hết thảy những người được nên thánh.","dep242-3-2-5":"Lời Chúa là ngọn đèn cho chơn tôi, Anh sáng cho đường lối tôi.","dep242-3-2-6":"Khi con đi, các lời đó sẽ dẫn dắt con; Lúc con ngủ, nó gìn giữ con; Và khi con thúc đẩy, thì nó sẽ trò chuyện với con. Vì điều răn là một cái đèn, luật pháp là ánh sáng, Và sự quở trách khuyên dạy là con đường sự sống,","dep242-3-2-7":"Ngài ra lịnh chữa họ lành, Rút họ khỏi cái huyệt.","dep242-3-2-8":"Thầy đội thưa rằng: Lạy Chúa, tôi chẳng đáng rước Chúa vào nhà; xin Chúa chỉ phán một lời, thì đầy tớ tôi sẽ được lành.","dep242-3-2-9":"Tôi vừa nghe những lời Ngài, thì đã ăn lấy rồi; lời Ngài là sự vui mừng hớn hở của lòng tôi vậy. Hỡi Giê-hô-va Đức Chúa Trời vạn quân, vì tôi được xưng bằng danh Ngài!","dep242-3-2-10":"Chứng cớ Chúa là cơ nghiệp tôi đến đời đời; Vì ấy là sự mừng rỡ của lòng tôi.","dep242-3-2-11":"Cũng hãy lấy sự cứu chuộc làm mão trụ, và cầm gươm của Đức Thánh Linh, là lời Đức Chúa Trời.","dep242-3-2-12":"Vì lời của Đức Chúa Trời là lời sống và linh nghiệm, sắc hơn gươm hai lưỡi, thấu vào đến đỗi chia hồn, linh, cốt, tủy, xem xét tư tưởng và ý định trong lòng.","dep242-3-3-1":"Những người nầy có ý hẳn hoi hơn người Tê-sa-lô-ni-ca, đều sẵn lòng chịu lấy đạo, ngày nào cũng tra xem Kinh Thánh, để xét lời giảng có thật chăng.","dep242-3-3-2":"Tôi yêu mến luật pháp Chúa biết bao! Trọn ngày tôi suy gẫm luật pháp ấy.","dep242-3-3-3":"Vì E-xơ-ra đã định chí tra xét luật pháp của Đức Giê-hô-va, giữ làm theo, và dạy cho dân Y-sơ-ra-ên biết những luật pháp và giới mạng.","dep242-3-3-4":"Tôi chẳng hề lìa bỏ các điều răn của môi Ngài, Vẫn vâng theo lời của miệng Ngài hơn là ý muốn lòng tôi.","dep242-3-3-5":"Si-môn thưa rằng: Thưa thầy, chúng tôi đã làm suốt đêm không bắt được chi hết; dầu vậy, tôi cũng theo lời thầy mà thả lưới. Họ thả lưới xuống, được nhiều cá lắm, đến nỗi lưới phải đứt ra.","dep242-3-4-1":"Như vậy, đức tin đến bởi sự người ta nghe, mà người ta nghe, là khi lời của Đấng Christ được rao giảng.","dep242-3-4-2":"Đức Chúa Jêsus đáp rằng: Những kẻ nghe và giữ lời Đức Chúa Trời còn có phước hơn!","dep242-3-4-3":"Phước cho kẻ đọc cùng những kẻ nghe lời tiên tri nầy, và giữ theo điều đã viết ra đây. Vì thì giờ đã gần rồi.","dep242-3-4-4":"Bản ấy phải ở bên vua trọn đời, vua phải đọc ở trong, để tập biết kính sợ Giê-hô-va Đức Chúa Trời mình, cẩn thận làm theo các lời của luật pháp nầy, và hết thảy điều răn nầy,","dep242-3-4-5":"Những người nầy có ý hẳn hoi hơn người Tê-sa-lô-ni-ca, đều sẵn lòng chịu lấy đạo, ngày nào cũng tra xem Kinh Thánh, để xét lời giảng có thật chăng.","dep242-3-4-6":"Hãy chuyên tâm cho được đẹp lòng Đức Chúa Trời như người làm công không chỗ trách được, lấy lòng ngay thẳng giảng dạy lời của lẽ thật.","dep242-3-4-7":"Các lời mà ta truyền cho ngươi ngày nay sẽ ở tại trong lòng ngươi;","dep242-3-4-8":"Hỡi con, hãy giữ các lời ta, Và giấu nơi lòng các mạng lịnh ta. Hãy cột nó nơi ngón tay con, Ghi nó trên bia lòng con.","dep242-3-4-9":"Phước cho người nào chẳng theo mưu kế của kẻ dữ, Chẳng đứng trong đường tội nhơn, Không ngồi chỗ của kẻ nhạo báng; Song lấy làm vui vẻ về luật pháp của Đức Giê-hô-va, Và suy gẫm luật pháp ấy ngày và đêm.","dep242-3-4-10":"Quyển sách luật pháp này chớ xa miệng ngươi, hãy suy gẫm ngày và đêm, hầu cho cẩn thận làm theo mọi điều đã chép ở trong; vì như vậy ngươi mới được may mắn trong con đường mình, và mới được phước.","dep242-4-1-1":"cầu nguyện không thôi,","dep242-4-1-2":"Phải bền đổ và tỉnh thức trong sự cầu nguyện, mà thêm sự tạ ơn vào.","dep242-4-1-3":"Sự cuối cùng của muôn vật đã gần; vậy hãy khôn ngoan tỉnh thức mà cầu nguyện.","dep242-4-1-4":"Vậy, trước hết mọi sự ta dặn rằng, phải khẩn nguyện, cầu xin, kêu van, tạ ơn cho mọi người, cho các vua, cho hết thảy các bậc cầm quyền, để chúng ta được lấy điều nhơn đức và thành thật mà ở đời cho bình tịnh yên ổn.","dep242-4-2-1":"Các ngươi nhơn danh ta mà cầu xin điều chi mặc dầu, ta sẽ làm cho, để Cha được sáng danh nơi Con. Nếu các ngươi nhơn danh ta xin điều chi, ta sẽ làm cho.","dep242-4-2-2":"Vả, Đức Chúa Trời, bởi quyền lực cảm động trong chúng ta, có thể làm trổi hơn vô cùng mọi việc chúng ta cầu xin hoặc suy tưởng,","dep242-4-2-3":"Hãy kêu cầu ta, ta sẽ trả lời cho; ta sẽ tỏ cho ngươi những việc lớn và khó, là những việc ngươi chưa từng biết.","dep242-4-2-4":"Ví bằng trong anh em có kẻ kém khôn ngoan, hãy cầu xin Đức Chúa Trời, là Đấng ban cho mọi người cách rộng rãi, không trách móc ai, thì kẻ ấy sẽ được ban cho.","dep242-4-2-5":"Tôi đã tìm cầu Đức Giê-hô-va, Ngài đáp lại tôi, Giải cứu tôi khỏi các đều sợ hãi.","dep242-4-2-6":"Trong ngày gian truân hãy kêu cầu cùng ta: Ta sẽ giải cứu ngươi, và ngươi sẽ ngợi khen ta.","dep242-4-2-7":"Khi đã cầu nguyện, thì nơi nhóm lại rúng động; ai nấy đều được đầy dẫy Đức Thánh Linh, giảng đạo Đức Chúa Trời cách dạn dĩ.","dep242-4-2-8":"Cũng hãy cầu nguyện cho chúng tôi, xin Đức Chúa Trời mở cửa cho sự giảng đạo, hầu cho tôi được rao truyền lẽ mầu nhiệm của Đấng Christ, vì lẽ đó mà tôi bị xiềng xích,","dep242-4-3-1":"Đến bây giờ, các ngươi chưa từng nhơn danh ta mà cầu xin điều chi hết. Hãy cầu xin đi, các ngươi sẽ được, hầu cho sự vui mừng các ngươi được trọn vẹn.","dep242-4-3-2":"Trong khi cầu nguyện, các ngươi lấy đức tin xin việc gì bất kỳ, thảy đều được cả.","dep242-4-3-3":"Hãy nhờ Đức Thánh Linh, thường thường làm đủ mọi thứ cầu nguyện và nài xin. Hãy dùng sự bền đổ trọn vẹn mà tỉnh thức về điều đó, và cầu nguyện cho hết thảy các thánh đồ.","dep242-4-3-4":"Nầy là điều chúng ta dạn dĩ ở trước mặt Chúa, nếu chúng ta theo ý muốn Ngài mà cầu xin việc gì, thì Ngài nghe chúng ta. Nếu chúng ta biết không cứ mình xin điều gì, Ngài cũng nghe chúng ta, thì chúng ta biết mình đã nhận lãnh điều mình xin Ngài.","dep242-4-3-5":"Nếu lòng tôi có chú về tội ác, Ay Chúa chẳng nghe tôi.","dep242-4-3-6":"và chúng ta xin điều gì mặc dầu, thì nhận được đều ấy, bởi chúng ta vâng giữ các điều răn của Ngài và làm những điều đẹp ý Ngài.","dep242-4-3-7":"Quả thật, ta lại nói cùng các ngươi, nếu hai người trong các ngươi thuận nhau ở dưới đất mà cầu xin không cứ việc chi, thì Cha ta ở trên trời sẽ cho họ.","dep242-4-3-8":"Hãy xin, sẽ được; hãy tìm, sẽ gặp; hãy gõ cửa, sẽ mở cho.","dep242-4-3-9":"Bấy giờ các ngươi sẽ kêu cầu ta, sẽ đi và cầu nguyện ta, và ta sẽ nhậm lời. Các ngươi sẽ tìm ta, và gặp được, khi các ngươi tìm kiếm ta hết lòng.","dep242-4-3-10":"còn nếu các ngươi trở lại cùng ta, gìn giữ làm theo các điều răn của ta, dầu khi kẻ bị tan lạc của các ngươi ở cuối tận trời, ta cũng sẽ từ đó chiêu tập chúng nó về, và dẫn chúng nó đến nơi ta đã chọn đặng cho danh ta ngự tại đó.","dep242-4-4-1":"Khi Đa-ni-ên nghe rằng chỉ dụ đó đã ký tên rồi, thì về nhà mình (những cửa sổ của phòng người thì mở về hướng Giê-ru-sa-lem). Tại đó, cứ một ngày ba lần, người quì gối xuống, cầu nguyện, xưng tạ trước mặt Đức Chúa Trời mình, như vẫn làm khi trước.","dep242-4-4-2":"Danh tiếng Ngài càng ngày càng vang ra, và một đoàn dân đông nhóm họp để nghe Ngài và để được chữa lành bịnh. Song Ngài lánh đi nơi đồng vắng mà cầu nguyện.","dep242-4-4-3":"Trong lúc đó, Đức Chúa Jêsus đi lên núi để cầu nguyện; và thức thâu đêm cầu nguyện Đức Chúa Trời.","dep242-4-4-4":"Ê-li vốn là người yếu đuối như chúng ta. Người cầu nguyện, cố xin cho đừng mưa, thì không mưa xuống đất trong ba năm rưỡi. Đoạn, người cầu nguyện lại, trời bèn mưa, và đất sanh sản hoa màu.","dep242-4-4-5":"Lối nữa đêm, Phao-lô và Si-la đương cầu nguyện, hát ngợi khen Đức Chúa Trời; và những tù phạm đều nghe.","dep242-4-5-1":"Hỡi Đức Giê-hô-va sự cao cả, quyền năng, vinh quang, toàn thắng, và oai nghi đáng qui về Ngài; vì muôn vật trên các từng trời và dưới đất đều thuộc về Ngài. Đức Giê-hô-va ôi! nước thuộc về Ngài; Ngài được tôn cao làm Chúa tể của muôn vật. Bây giờ, Đức Chúa Trời chúng tôi ôi! chúng tôi cảm tạ Chúa và ngợi khen danh vinh hiển của Ngài.","dep242-4-5-2":"Vậy, trước hết mọi sự ta dặn rằng, phải khẩn nguyện, cầu xin, kêu van, tạ ơn cho mọi người, cho các vua, cho hết thảy các bậc cầm quyền, để chúng ta được lấy điều nhơn đức và thành thật mà ở đời cho bình tịnh yên ổn.","dep242-4-5-3":"phàm làm việc gì cũng phải tạ ơn Chúa; vì ý muốn của Đức Chúa Trời trong Đức Chúa Jêsus Christ đối với anh em là như vậy.","dep242-4-5-4":"Còn nếu chúng ta xưng tội mình, thì Ngài là thành tín công bình để tha tội cho chúng ta, và làm cho chúng ta sạch mọi điều gian ác.","dep242-4-5-5":"Chớ lo phiền chi hết, nhưng trong mọi sự hãy dùng lời cầu nguyện, nài xin, và sự tạ ơn và trình các sự cầu xin của mình cho Đức Chúa Trời. Sự bình an của Đức Chúa Trời vượt quá mọi sự hiểu biết, sẽ gìn giữ lòng và ý tưởng anh em trong Đức Chúa Jêsus Christ.","dep242-5-1-1":"Nhưng trong Đức Chúa Jêsus Christ, anh em là kẻ ngày trước cách xa, hiện nay đã nhờ huyết Đấng Christ mà được gần rồi.","dep242-5-1-2":"và bởi huyết Ngài trên thập tự giá, thì đã làm nên hòa bình, khiến muôn vật dưới đất trên trời đều nhờ Ngài mà hòa thuận cùng chính mình Đức Chúa Trời.","dep242-5-1-3":"chúng tôi lấy điều đã thấy đã nghe mà truyền cho anh em, hầu cho anh em cũng được giao thông với chúng tôi. Vả, chúng tôi vẫn được giao thông với Đức Chúa Cha, và với Con Ngài là Đức Chúa Jêsus Christ.","dep242-5-1-4":"Nguyền xin ơn của Đức Chúa Jêsus Christ, sự yêu thương của Đức Chúa Trời, và sự giao thông của Đức Thánh Linh ở với anh em hết thảy!","dep242-5-2-1":"Vì nơi nào có hai ba người nhơn danh ta nhóm nhau lại, thì ta ở giữa họ.","dep242-5-2-2":"Kìa, anh em ăn ở hòa thuận nhau Thật tốt đẹp thay! Lại khác nào sương móc Hẹt-môn Sa xuống các núi Si-ôn; Vì tại đó Đức Giê-hô-va đã ban phước, Tức là sự sống cho đến đời đời.","dep242-5-2-3":"Nhưng hằng ngày anh em hãy khuyên bảo lẫn nhau, đang khi còn gọi là Ngày nay, hầu cho trong anh em không ai bị tội lỗi dỗ dành mà cứng lòng.","dep242-5-2-4":"Hai người hơn một, vì hai sẽ được công giá tốt về công việc mình. Nếu người này sa ngã, thì người kia sẽ đỡ bạn mình lên; nhưng khốn thay cho kẻ ở một mình mà sa ngã, không có ai đỡ mình lên!","dep242-5-2-5":"Cũng hãy tránh khỏi tình dục trai trẻ, mà tìm những điều công bình, đức tin, yêu thương, hòa thuận với kẻ lấy lòng tinh sạch kêu cầu Chúa.","dep242-5-2-6":"Sắt mài nhọn sắt. Cũng vậy người bổ dưỡng diện mạo bạn hữu mình. Mặt dọi mặt trong nước thế nào, Lòng người đối với người cũng thế ấy.","dep242-5-2-7":"Ai giao tiếp với người khôn ngoan, trở nên khôn ngoan; Nhưng kẻ làm bạn với bọn điên dại sẽ bị tàn hại.","dep242-5-2-8":"cho đến chừng chúng ta thảy đều hiệp một trong đức tin và trong sự hiểu biết Con Đức Chúa Trời, mà nên bậc thành nhơn, được tầm thước vóc giạc trọn vẹn của Đấng Christ.","dep242-5-2-9":"Vả, những người ấy bền lòng giữ lời dạy của các sứ đồ, sự thông công của anh em, lễ bẻ bánh, và sự cầu nguyện. ngợi khen Đức Chúa Trời và được đẹp lòng cả dân chúng. Mỗi ngày Chúa lấy những kẻ được cứu thêm vào Hội thánh.","dep242-5-3-1":"vì cớ từ buổi ban đầu cho đến bây giờ, anh em đã được thông công trong sự tấn tới của đạo Tin Lành; Duy anh em phải ăn ở một cách xứng đáng với đạo Tin Lành của Đấng Christ, để hoặc khi đến thăm anh em, hoặc khi vắng mặt, tôi cũng biết rằng anh em một lòng đứng vững, đồng tâm chống cự vì đức tin của đạo Tin Lành, phàm sự chẳng để cho kẻ thù nghịch ngăm dọa mình;","dep242-5-3-2":"Ai nấy hãy coi sóc nhau để khuyên giục về lòng yêu thương và việc tốt lành; chớ bỏ qua sự nhóm lại như mấy kẻ quen làm, nhưng phải khuyên bảo nhau, và hễ anh em thấy ngày ấy hầu gần chừng nào, thì càng phải làm như vậy chừng nấy.","dep242-5-3-3":"Vì tôi làm chứng cho họ rằng họ đã tự ý quyên tiền theo sức mình, hoặc cũng quá sức nữa, và nài xin chúng tôi làm ơn cho họ có phần vào sự giùm giúp các thánh đồ.","dep242-5-3-4":"Nhưng anh em có phần trong sự thương khó của Đấng Christ bao nhiêu, thì hãy vui mừng bấy nhiêu, hầu cho đến ngày vinh hiển của Ngài hiện ra, thì anh em cũng được vui mừng nhảy nhót.","dep242-5-3-5":"Hãy mang lấy gánh nặng cho nhau, như vậy anh em sẽ làm trọn luật pháp của Đấng Christ.","dep242-5-4-1":"Vậy nếu trong Đấng Christ có điều yên ủi nào, nếu vì lòng yêu thương có điều cứu giúp nào, nếu có sự thông công nơi Thánh Linh, nếu có lòng yêu mến và lòng thương xót, thì anh em hãy hiệp ý với nhau, đồng tình yêu thương, đồng tâm, đồng tư tưởng mà làm cho tôi vui mừng trọn vẹn.","dep242-5-4-2":"Chớ làm sự chi vì lòng tranh cạnh hoặc vì hư vinh, nhưng hãy khiêm nhường, coi người khác như tôn trọng hơn mình. Mỗi người trong anh em chớ chăm về lợi riêng mình, nhưng phải chăm về lợi kẻ khác nữa.","dep242-5-4-3":"Chẳng phải chúng tôi hẹp hòi đãi anh em, nhưng ấy là lòng anh em tự làm nên hẹp hòi. Chẳng phải chúng tôi hẹp hòi đãi anh em, nhưng ấy là lòng anh em tự làm nên hẹp hòi.","dep242-5-4-4":"Hãy kính sợ Đấng Christ mà vâng phục nhau.","dep242-5-4-5":"Môn đồ đều làm thinh; vì dọc đường đã cãi nhau cho biết ai là lớn hơn trong bọn mình. Ngài bèn ngồi, kêu mười hai sứ đồ mà phán rằng: Nếu ai muốn làm đầu, thì phải làm rốt hết và làm tôi tớ mọi người.","dep242-5-4-6":"Khá coi chừng kẻo có kẻ trật phần ân điển của Đức Chúa Trời, kẻo rễ đắng châm ra, có thể ngăn trở và làm ô uế phần nhiều trong anh em chăng.","dep242-5-4-7":"và chớ dự vào công việc vô ích của sự tối tăm, thà quở trách chúng nó thì hơn;","dep242-5-4-8":"Khi một người đi ra trận, thì chẳng còn lấy việc đời lụy mình, làm vậy đặng đẹp lòng kẻ chiêu mộ mình.","dep242-5-5-9":"Ay vậy, nếu khi nào ngươi đem dâng của lễ nơi bàn thờ, mà nhớ lại anh em có điều gì nghịch cùng mình, thì hãy để của lễ trước bàn thờ, trở về giảng hòa với anh em trước đã; rồi hãy đến dâng của lễ.","dep242-5-5-1":"Nếu anh em ngươi phạm tội cùng ngươi, thì hãy trách người khi chỉ có ngươi với một mình người; như người nghe lời, thì ngươi được anh em lại.","dep242-5-5-2":"Còn nếu chúng ta xưng tội mình, thì Ngài là thành tín công bình để tha tội cho chúng ta, và làm cho chúng ta sạch mọi điều gian ác.","dep242-5-5-3":"Người nào giấu tội lỗi mình sẽ không được may mắn; Nhưng ai xưng nó ra và lìa bỏ nó sẽ được thương xót.","dep242-6-1-1":"Nhưng khi Đức Thánh Linh giáng trên các ngươi, thì các ngươi sẽ nhận lấy quyền phép, và làm chứng về ta tại thành Giê-ru-sa-lem, cả xứ Giu-đê, xứ Sa-ma-ri, cho đến cùng trái đất.","dep242-6-1-2":"Mọi điều đó đến bởi Đức Chúa Trời, Ngài đã làm cho chúng ta nhờ Đấng Christ mà được hòa thuận lại cùng Ngài, và giao chức vụ giảng hòa cho chúng ta. Vì chưng Đức Chúa Trời vốn ở trong Đấng Christ, làm cho thế gian lại hòa với Ngài, chẳng kể tội lỗi cho loài người, và đã phó đạo giảng hòa cho chúng tôi.","dep242-6-2-1":"Ta ở trước mặt Đức Chúa Trời và trước mặt Đức Chúa Jêsus Christ là Đấng sẽ đoán xét kẻ sống và kẻ chết, nhơn sự đến của Ngài và nước Ngài mà răn bảo con rằng: hãy giảng đạo, cố khuyên, bất luận gặp thời hay không gặp thời, hãy đem lòng rất nhịn nhục mà bẻ trách, nài khuyên, sửa trị, cứ dạy dỗ chẳng thôi.","dep242-6-2-2":"Bởi Con người đã đến tìm và cứu kẻ bị mất.","dep242-6-2-3":"Nhưng vì Đức Chúa Trời đã xét chúng tôi là xứng đáng giao cho việc giảng Tin Lành, nên chúng tôi cứ nói, không phải để đẹp lòng loài người, nhưng để đẹp lòng Đức Chúa Trời, là Đấng dò xét lòng chúng tôi.","dep242-6-2-4":"Ví bằng tôi rao truyền Tin Lành, tôi chẳng có cớ khoe mình, vì có lẽ cần buộc tôi; còn không rao truyền Tin Lành, thì khốn khó cho tôi thay.","dep242-6-2-5":"Nhưng họ chưa tin Ngài thì kêu cầu sao được? Chưa nghe nói về Ngài thì làm thể nào mà tin? Nếu chẳng ai rao giảng, thì nghe làm sao?","dep242-6-2-6":"Ngài muốn cho mọi người được cứu rỗi và hiểu biết lẽ thật.","dep242-6-2-7":"Đức Giê-hô-va lại phán: Ngươi đoái tiếc một dây mà ngươi chưa hề khó nhọc vì nó, ngươi không làm cho nó mọc, một đêm thấy nó sanh ra và một đêm thấy nó chết. Còn ta, há không đoái tiếc thành lớn Ni-ni-ve, trong đó có hơn mười hai vạn người không biết phân biệt tay hữu và tay tả, lại với một số thú vật rất nhiều hay sao?","dep242-6-2-8":"Ta nói cùng các ngươi, trên trời cũng như vậy, sẽ vui mừng cho một kẻ có tội ăn năn hơn là chín mươi chín kẻ công bình không cần phải ăn năn.","dep242-6-2-9":"chúng tôi lấy điều đã thấy đã nghe mà truyền cho anh em, hầu cho anh em cũng được giao thông với chúng tôi. Vả, chúng tôi vẫn được giao thông với Đức Chúa Cha, và với Con Ngài là Đức Chúa Jêsus Christ.","dep242-6-2-10":"Những kẻ khôn sáng sẽ được rực rỡ như sự sáng trên vòng khung; và những kẻ dắt đem nhiều người về sự công bình sẽ sáng láng như các ngôi sao đời đời mãi mãi.","dep242-6-3-1":"Ngài phán cùng hai người rằng: Các ngươi hãy theo ta, ta sẽ cho các ngươi nên tay đánh lưới người.","dep242-6-3-2":"hầu cho anh em ở giữa dòng dõi hung ác ngang nghịch, được nên con cái của Đức Chúa Trời, không vít, không tì, không chỗ trách được, lại giữa dòng dõi đó, giữ lấy đạo sự sống, chiếu sáng như đuốc trong thế gian; cho đến nỗi tới ngày của Đấng Christ, tôi có thể khoe mình rằng chẳng đã chạy vô ích và khó nhọc luống công.","dep242-6-3-3":"Cũng hãy vì tôi mà cầu nguyện, để khi tôi mở miệng ra, Chúa ban cho tôi tự do mọi bề, bày tỏ lẽ mầu nhiệm của đạo Tin Lành,","dep242-6-3-4":"nhưng hãy tôn Đấng Christ, là Chúa, làm thánh trong lòng mình. Hãy thường thường sẵn sàng để trả lời mọi kẻ hỏi lẽ về sự trông cậy trong anh em, song phải hiền hòa và kính sợ,","dep242-6-3-5":"Có nhiều người Sa-ma-ri ở thành đó tin Ngài, vì cứ lời đờn bà đã làm chứng về Ngài mà rằng: Ngài đã bảo tôi mọi điều tôi đã làm.","dep242-6-3-6":"Vì lời của Đức Chúa Trời là lời sống và linh nghiệm, sắc hơn gươm hai lưỡi, thấu vào đến đỗi chia hồn, linh, cốt, tủy, xem xét tư tưởng và ý định trong lòng.","dep242-6-3-7":"thì lời nói của ta cũng vậy, đã ra từ miệng ta, thì chẳng trở về luống nhưng, mà chắc sẽ làm trọn điều ta muốn, thuận lợi công việc ta đã sai khiến nó.","dep242-6-3-8":"thì chúng ta giảng Đấng Christ bị đóng đinh trên cây thập tự, là sự người Giu-đa lấy làm gương xấu, dân ngoại cho là dồ dại; song le, về những người được gọi, bất luận người Giu-đa hay người Gờ-réc, thì Đấng Christ là quyền phép của Đức Chúa Trời và sự khôn ngoan của Đức Chúa Trời.","dep242-6-3-9":"Vả, đạo Tin Lành chúng tôi đã rao truyền cho anh em, không những bằng lời nói thôi, lại cũng bằng quyền phép, Đức Thánh Linh và sức mạnh của sự tin quyết nữa. Vì anh em biết rõ cách chúng tôi ở giữa anh em và lòng yêu thương đối với anh em là thể nào.","dep242-6-3-10":"Vậy nếu miệng ngươi xưng Đức Chúa Jêsus ra và lòng ngươi tin rằng Đức Chúa Trời đã khiến Ngài từ kẻ chết sống lại, thì ngươi sẽ được cứu; vì tin bởi trong lòng mà được sự công bình, còn bởi miệng làm chứng mà được sự cứu rỗi.","dep242-6-3-11":"Vì Ngài phán rằng: Ta đã nhậm lời ngươi trong thì thuận tiện, Ta đã phù hộ ngươi trong ngày cứu rỗi. Kìa, hiện nay là thì thuận tiện; kìa, hiện nay là ngày cứu rỗi!","dep242-6-3-12":"Chính anh em hãy tự xét để xem mình có đức tin chăng. Hãy tự thử mình: anh em há không nhận biết rằng có Đức Chúa Jêsus Christ ở trong anh em sao? miễn là anh em không đáng bị bỏ.","dep242-6-3-13":"Phao-lô tới nhà hội theo thói quen mình, và trong ba ngày Sa-bát bàn luận với họ, lấy Kinh Thánh cắt nghĩa và giải tỏ tường về Đấng Christ phải chịu thương khó, rồi từ kẻ chết sống lại. Người nói rằng Đấng Christ nầy, tức là Đức Chúa Jêsus mà ta rao truyền cho các ngươi.","dep242-6-4-1":"nhưng tôi chẳng kể sự sống mình là quí, miễn chạy cho xong việc dua tôi và chức vụ tôi đã lãnh nơi Đức Chúa Jêsus, để mà làm chứng về Tin Lành của ơn Đức Chúa Trời.","dep242-6-4-2":"Đức Thánh Linh phán cùng Phi-líp rằng: Hãy lại gần và theo kịp xe đó. Phi-líp chạy đến, nghe người Ê-thi-ô-bi đọc sách tiên tri Ê-sai, thì nói rằng: Ong hiểu lời mình đọc đó chăng?","dep242-6-4-3":"Vì, về phần chúng tôi, không có thể chẳng nói về những điều mình đã thấy và nghe.","dep242-6-5-1":"Đức Chúa Trời dựng nên loài người như hình Ngài; Ngài dựng nên loài người giống như hình Đức Chúa Trời; Ngài dựng nên người nam cùng người nữ.","dep242-6-5-2":"Nầy, tay Đức Giê-hô-va chẳng trở nên ngắn mà không cứu được; tai Ngài cũng chẳng nặng nề mà không nghe được đâu. Nhưng ấy là sự gian ác các ngươi làm xa cách mình với Đức Chúa Trời; và tội lỗi các ngươi đã che khuất mặt Ngài khỏi các ngươi, đến nỗi Ngài không nghe các ngươi nữa.","dep242-6-5-3":"Cho nên, như bởi một người mà tội lỗi vào trong thế gian, lại bởi tội lỗi mà có sự chết, thì sự chết đã trải qua trên hết thảy mọi người như vậy, vì mọi người đều phạm tội.","dep242-6-5-4":"vì mọi người đều đã phạm tội, thiếu mất sự vinh hiển của Đức Chúa Trời,","dep242-6-5-5":"Theo như đã định cho loài người phải chết một lần, rồi chịu phán xét,","dep242-6-5-6":"báo thù những kẻ chẳng hề nhận biết Đức Chúa Trời, và không vâng phục Tin Lành của Đức Chúa Jêsus Christ chúng ta. Họ sẽ bị hình phạt hư mất đời đời, xa cách mặt Chúa và sự vinh hiển của quyền phép Ngài,","dep242-6-5-7":"Vì tiền công của tội lỗi là sự chết; nhưng sự ban cho của Đức Chúa Trời là sự sống đời đời trong Đức Chúa Jêsus Christ, Chúa chúng ta.","dep242-6-5-8":"Còn những kẻ hèn nhát, kẻ chẳng tin, kẻ đáng gớm ghét, kẻ giết người, kẻ dâm loạn, kẻ phù phép, kẻ thờ thần tượng, và phàm kẻ nào nói dối, phần của chúng nó ở trong hồ có lửa và diêm cháy bừng bừng: đó là sự chết thứ hai.","dep242-6-5-9":"Vả, ấy là nhờ ân điển, bởi đức tin, mà anh em được cứu, điều đó không phải đến từ anh em, bèn là sự ban cho của Đức Chúa Trời. Ay chẳng phải bởi việc làm đâu, hầu cho không ai khoe mình;","dep242-6-5-10":"Tôi không muốn làm cho ân điển Đức Chúa Trời ra vô ích; vì nếu bởi luật pháp mà được sự công bình, thì Đấng Christ chịu chết là vô ích.","dep242-6-5-11":"Chẳng có sự cứu rỗi trong đấng nào khác; vì ở dưới trời, chẳng có danh nào khác ban cho loài người, để chúng ta phải nhờ đó mà được cứu.","dep242-6-5-12":"vì biết rằng chẳng phải bởi vật hay hư nát như bạc hoặc vàng mà anh em đã được chuộc khỏi sự ăn ở không ra chi của tổ tiên truyền lại cho mình,","dep242-6-5-13":"Vả, đương khi người Giu-đa đòi phép lạ, người Gờ-réc tìm sự khôn ngoan, thì chúng ta giảng Đấng Christ bị đóng đinh trên cây thập tự, là sự người Giu-đa lấy làm gương xấu, dân ngoại cho là dồ dại;","dep242-6-5-14":"Vì, tại thế gian cậy sự khôn ngoan mình, chẳng nhờ sự khôn ngoan Đức Chúa Trời mà nhận biết Đức Chúa Trời, nên Ngài đành lòng dùng sự giảng dồ dại của chúng ta mà cứu rỗi những người tin cậy.","dep242-6-5-15":"Hãy giữ chừng, kẻo có ai lấy triết học và lời hư không, theo lời truyền khẩu của loài người, sơ học của thế gian, không theo Đấng Christ, mà bắt anh em phục chăng.","dep242-6-5-16":"là kẻ chẳng phải sanh bởi khí huyết, hoặc bởi tình dục, hoặc bởi ý người, nhưng sanh bởi Đức Chúa Trời vậy.","dep242-6-5-17":"Hễ chi sanh bởi xác thịt là xác thịt; hễ chi sanh bởi Thánh Linh là thần. Chớ lấy làm lạ về điều ta đã nói với ngươi: Các ngươi phải sanh lại.","dep242-6-5-18":"Ay là thần linh làm cho sống, xác thịt chẳng ích chi. Những lời ta phán cùng các ngươi đều là thần linh và sự sống.","dep242-6-5-19":"Vả, Đấng Christ cũng vì tội lỗi chịu chết một lần, là Đấng công bình thay cho kẻ không công bình, để dẫn chúng ta đến cùng Đức Chúa Trời; về phần xác thịt thì Ngài đã chịu chết, nhưng về phần linh hồn thì được sống.","dep242-6-5-20":"Vì Đức Chúa Trời yêu thương thế gian, đến nỗi đã ban Con một của Ngài, hầu cho hễ ai tin Con ấy không bị hư mất mà được sự sống đời đời.","dep242-6-5-21":"Nhưng Đức Chúa Trời tỏ lòng yêu thương Ngài đối với chúng ta, khi chúng ta còn là người có tội, thì Đấng Christ vì chúng ta chịu chết.","dep242-6-5-22":"Vả trước hết tôi đã dạy dỗ anh em điều mà chính tôi đã nhận lãnh, ấy là Đấng Christ chịu chết vì tội chúng ta theo lời Kinh Thánh; Ngài đã bị chôn, đến ngày thứ ba, Ngài sống lại, theo lời Kinh Thánh;","dep242-6-5-23":"Khi anh em đã chết bởi tội lỗi mình và sự xác thịt mình không chịu cắt bì, thì Đức Chúa Trời đã khiến anh em sống lại với Đấng Christ, vì đã tha thứ hết mọi tội chúng ta:","dep242-6-5-24":"Quả thật, quả thật, ta nói cùng các ngươi, ai nghe lời ta mà tin Đấng đã sai ta, thì được sự sống đời đời, và không đến sự phán xét, song vượt khỏi sự chết mà đến sự sống.","dep242-6-5-25":"Nhưng hễ ai đã nhận Ngài, thì Ngài ban cho quyền phép trở nên con cái Đức Chúa Trời, là ban cho những kẻ tin danh Ngài,","dep242-6-5-26":"Nầy, ta đứng ngoài cửa mà gõ; nếu ai nghe tiếng ta mà mở cửa cho, thì ta sẽ vào cùng người ấy, ăn bữa tối với người, và người với ta.","dep242-6-5-27":"Vậy nếu miệng ngươi xưng Đức Chúa Jêsus ra và lòng ngươi tin rằng Đức Chúa Trời đã khiến Ngài từ kẻ chết sống lại, thì ngươi sẽ được cứu; vì tin bởi trong lòng mà được sự công bình, còn bởi miệng làm chứng mà được sự cứu rỗi.","dep242-7-1-1":"Ban đầu Ngài ở cùng Đức Chúa Trời. Muôn vật bởi Ngài làm nên, chẳng vật chi đã làm nên mà không bởi Ngài.","dep242-7-1-2":"Vì muôn vật đã được dựng nên trong Ngài, bất luận trên trời, dưới đất, vật thấy được, vật không thấy được, hoặc ngôi vua, hoặc quyền cai trị, hoặc chấp chánh, hoặc cầm quyền, đều là bởi Ngài và vì Ngài mà được dựng nên cả. Ngài có trước muôn vật, và muôn vật đứng vững trong Ngài.","dep242-7-1-3":"Ay cũng chính Ngài là đầu của thân thể, tức là đầu Hội thánh. Ngài là ban đầu sanh trước nhứt từ trong những kẻ chết, hầu cho trong mọi vật, Ngài đứng đầu hàng.","dep242-7-1-4":"cao hơn hết mọi quyền, mọi phép, mọi thế lực, mọi quân chủ cùng mọi danh vang ra, không những trong đời nầy, mà cũng trong đời hầu đến nữa.","dep242-7-1-5":"hầu cho nghe đến danh Đức Chúa Jêsus, mọi đầu gối trên trời, dưới đất, bên dưới đất, thảy đều quì xuống, và mọi lưỡi thảy đều xưng Jêsus Christ là Chúa, mà tôn vinh Đức Chúa Trời, là Đức Chúa Cha.","dep242-7-1-6":"Đấng Christ đã chết và sống lại, ấy là để làm Chúa kẻ chết và kẻ sống.","dep242-7-1-7":"Anh em há chẳng biết rằng thân thể mình là đền thờ của Đức Thánh Linh đang ngự trong anh em, là Đấng mà anh em đã nhận bởi Đức Chúa Trời, và anh em chẳng phải thuộc về chính mình sao? Vì chưng anh em đã được chuộc bằng giá cao rồi. Vậy, hãy lấy thân thể mình làm sáng danh Đức Chúa Trời.","dep242-7-1-8":"lại Ngài đã chết vì mọi người, hầu cho những kẻ còn sống không vì chính mình mà sống nữa, nhưng sống vì Đấng đã chết và sống lại cho mình.","dep242-7-2-1":"Nhưng trước hết, hãy tìm kiếm nước Đức Chúa Trời và sự công bình của Ngài, thì Ngài sẽ cho thêm các ngươi mọi điều ấy nữa.","dep242-7-2-2":"Đức Chúa Jêsus đáp rằng: Quả thật, ta nói cùng các ngươi chẳng một người nào vì ta và Tin Lành từ bỏ nhà cửa, anh em, chị em, cha mẹ, con cái, đất ruộng, mà chẳng lãnh được đương bây giờ, trong đời nầy, trăm lần hơn về những nhà cửa, anh em, chị em, mẹ con, đất ruộng, với sự bắt bớ, và sự sống đời đời trong đời sau.","dep242-7-2-3":"Đức Giê-hô-va phán rằng: Vì ngươi đã làm điều đó, không tiếc con ngươi, tức con một ngươi, thì ta lấy chánh mình ta mà thề rằng: sẽ ban phước cho ngươi, thêm dòng dõi ngươi nhiều như sao trên trời, đông như cát bờ biển, và dòng dõi đó sẽ chiếm được cửa thành quân nghịch.","dep242-7-2-4":"Còn ngươi, là Sa-lô-môn, con trai ta, hãy nhận biết Đức Chúa Trời của cha, hết lòng vui ý mà phục sự Ngài; vì Đức Giê-hô-va dò xét tấm lòng, và phân biệt các ý tưởng. Nếu con tìm kiếm Ngài, Ngài sẽ cho con gặp; nhưng nếu con lìa bỏ Ngài, ắt Ngài sẽ từ bỏ con đời đời.","dep242-7-2-5":"Vì con mắt của Đức Giê-hô-va soi xét khắp thế gian, đặng giúp sức cho kẻ nào có lòng trọn thành đối với Ngài. Trong việc này vua có cư xử cách dại dột, nên từ này về sau vua sẽ có giặc giã.","dep242-7-2-6":"Bởi vì người tríu mến ta, nên ta sẽ giải cứu người; Ta sẽ đặt người lên nơi cao, bước người biết danh ta.","dep242-7-2-7":"Bởi cớ đó, Giê-hô-va Đức Chúa Trời của Y-sơ-ra-ên phán như vầy: Ta có phán rằng nhà ngươi và nhà cha ngươi sẽ đời đời hầu việc trước mặt ta. Nhưng bây giờ, Đức Giê-hô-va phán, điều đó chẳng hề được như vậy! Vì phàm ai tôn kính ta, ta sẽ làm cho được tôn trọng, còn ai khinh bỉ ta, tất sẽ bị khinh bỉ lại.","dep242-7-3-1":"Đoạn, Ngài phải cùng mọi người rằng: Nếu ai muốn theo ta, phải tự bỏ mình đi, mỗi ngày vác thập tự giá mình mà theo ta.","dep242-7-3-2":"Khi tánh hạnh của người nào đẹp lòng Đức Giê-hô-va, Thì Ngài cũng khiến các thù nghịch người ở hòa thuận với người.","dep242-7-3-3":"Hãy hết lòng tin cậy Đức Giê-hô-va, Chớ nương cậy nơi sự thông sáng của con; Phàm trong các việc làm của con, khá nhận biết Ngài, Thì Ngài sẽ chỉ dẫn các nẻo của con.","dep242-7-3-4":"rằng anh em phải bỏ cách ăn nết ở ngày trước, thoát lốt người cũ là người bị hư hỏng bởi tư dục dỗ dành, và mặc lấy người mới, tức là người đã được dựng nên giống như Đức Chúa Trời, trong sự công bình và sự thánh sạch của lẽ thật.","dep242-7-3-5":"Cũng hãy tránh khỏi tình dục trai trẻ, mà tìm những điều công bình, đức tin, yêu thương, hòa thuận với kẻ lấy lòng tinh sạch kêu cầu Chúa.","dep242-7-3-6":"Vì chúng ta ra đời chẳng đem gì theo, chúng ta qua đời cũng chẳng đem gì đi được. Còn như kẻ muốn nên giàu có, ắt sa vào sự cám dỗ, mắc bẫy dò, ngã trong nhiều sự tham muốn vô lý thiệt hại kia, là sự làm đắm người ta vào sự hủy diệt hư mất.","dep242-7-3-7":"Vậy, hãy giữ cho khéo về sự ăn ở của anh em, chớ xử mình như người dại dột, nhưng như người khôn ngoan. Hãy lợi dụng thì giờ, vì những ngày là xấu.","dep242-7-3-8":"Ngài liền kêu hai người; thì họ để Xê-bê-đê, cho mình, ở lại trong thuyền với mấy người làm thuê, mà theo Ngài.","dep242-7-4-1":"Tôi có lòng trông cậy chắc chắn nầy, việc chi tôi cũng chẳng hổ thẹn cả, nhưng bao giờ cũng thế, tôi nói cách tự do mọi bề, như vậy, dầu tôi sống hay chết, Đấng Christ sẽ được cả sáng trong mình tôi.","dep242-7-4-2":"ai nấy đều tìm lợi riêng của mình, chớ không tìm của Đức Chúa Jêsus Christ. Nhưng anh em đã biết sự trung tín từng trải của người; và biết người là trung thành với tôi về việc Tin Lành, như con ở với cha vậy.","dep242-7-4-3":"Có kẻ khác chịu nhạo cười, roi vọt, lại cũng chịu xiềng xích, lao tù nữa. thế gian không xứng đáng cho họ ở, phải lưu lạc trong đồng vắng, trên núi trong hang, trong những hầm dưới đất.","dep242-8-1":"Ta sẽ làm cho ngươi nên một dân lớn; ta sẽ ban phước cho ngươi, cùng làm nổi danh ngươi, và ngươi sẽ thành một nguồn phước. Ta sẽ ban phước cho người nào chúc phước cho ngươi, rủa sả kẻ nào rủa sả ngươi; và các chi tộc nơi thế gian sẽ nhờ ngươi mà được phước.","dep242-8-2":"Ngài có phán cùng ta rằng: Ngươi làm tôi tớ ta đặng lập lại các chi phái Gia-cốp, và làm cho những kẻ được gìn giữ của Y-sơ-ra-ên lại được trở về, còn là việc nhỏ; ta sẽ khiến ngươi làm sự sáng cho các dân ngoại, hầu cho ngươi làm sự cứu rỗi của ta đến nơi đầu cùng đất.","dep242-8-3":"Vậy, hãy đi dạy dỗ muôn dân, hãy nhơn danh Đức Cha, Đức Con, và Đức Thánh Linh mà làm phép báp tem cho họ, và dạy họ giữ hết cả mọi điều mà ta đã truyền cho các ngươi. Và nầy, ta thường ở cùng các ngươi luôn cho đến tận thế.","dep242-8-4":"Nhưng khi Đức Thánh Linh giáng trên các ngươi, thì các ngươi sẽ nhận lấy quyền phép, và làm chứng về ta tại thành Giê-ru-sa-lem, cả xứ Giu-đê, xứ Sa-ma-ri, cho đến cùng trái đất.","dep242-8-5":"Đoạn, tôi nghe tiếng Chúa phán rằng: Ta sẽ sai ai đi? Ai sẽ đi cho chúng ta? Tôi thưa rằng: Có tôi đây; xin hãy sai tôi.","dep242-8-6":"nên chức việc của Đức Chúa Jêsus Christ giữa dân ngoại, làm chức tế lễ của Tin Lành Đức Chúa Trời, hầu cho dân ngoại được làm của lễ vừa ý Chúa, nên thánh bởi Đức Thánh Linh.","dep242-8-7":"Hãy cầu ta, ta sẽ ban cho Con các ngoại bang làm cơ nghiệp, Và các đầu cùng đất làm của cải.","dep242-8-8":"Hỡi Đức Chúa Trời, nguyện Chúa được tôn cao hơn các từng trời; Nguyện sự vinh hiển Chúa trổi hơn cả trái đất!","dep242-8-9":"trông cậy sự sống đời đời, là sự sống mà Đức Chúa Trời không thể nói dối đã hứa từ muôn đời về trước, tới kỳ chỉ định, Ngài đã bày tỏ lời của Ngài ra bởi sự giảng dạy, là sự ta đã chịu giao phó theo mạng lịnh Đức Chúa Trời, là Cứu Chúa chúng ta,","dep242-8-10":"Nhưng Chúa đã giúp đỡ ta và thêm sức cho ta, hầu cho Tin Lành bởi ta được rao truyền đầy dẫy, để hết thảy dân ngoại đều nghe; ta lại đã được cứu khỏi hàm sư tử.","dep242-8-11":"Ay là Ngài mà chúng tôi rao giảng, lấy mọi sự khôn ngoan răn bảo mọi người, dạy dỗ mọi người, hầu cho bày tỏ mọi người trở nên trọn vẹn trong Đấng Christ ra trước mặt Đức Chúa Trời. Ay cũng là vì đó mà tôi làm việc, nhờ Ngài giúp đỡ mà chiến đấu, là sức hành động cách có quyền trong tôi.","dep242-8-12":"Lại, điều tôi xin trong khi cầu nguyện, ấy là lòng yêu thương của anh em càng ngày càng chan chứa hơn, trong sự thông biết và sự suy hiểu, được đầy trái công bình đến bởi Đức Chúa Jêsus Christ, làm cho sáng danh và khen ngợi Đức Chúa Trời.","dep242-8-13":"Những điều con đã nghe nơi ta ở trước mặt nhiều người chứng, hãy giao phó cho mấy người trung thành, cũng có tài dạy dỗ kẻ khác.","dep242-8-14":"Kẻ rất nhỏ trong vòng họ sẽ nên một ngàn, còn kẻ rất hèn yếu sẽ trở nên một dân mạnh. Ta, Đức Giê-hô-va, sẽ nôn nả làm điều ấy trong kỳ nó!","dep242-8-15":"Thế thì, vì chúng ta được nhiều người chứng kiến vây lấy như đám mây rất lớn, chúng ta cũng nên quăng hết gánh nặng và tội lỗi dễ vấn vương ta, lấy lòng nhịn nhục theo đòi cuộc chạy đua đã bày ra cho ta,","dep242-8-16":"Vì con mắt của Đức Giê-hô-va soi xét khắp thế gian, đặng giúp sức cho kẻ nào có lòng trọn thành đối với Ngài. Trong việc này vua có cư xử cách dại dột, nên từ này về sau vua sẽ có giặc giã.","dep242-8-17":"Vì sự nhận biết vinh quang Đức Giê-hô-va sẽ đầy dẫy khắp đất như nước đầy tràn biển.","dep242-8-18":"Vì từ nơi mặt trời mọc cho đến nơi mặt trời lặn, danh ta sẽ là lớn giữa các dân ngoại. Trong khắp mọi nơi, người ta sẽ dâng hương và của lễ thanh sạch cho danh ta; vì danh ta sẽ là lớn giữa các dân ngoại, Đức Giê-hô-va vạn quân phán vậy."},"hin":{"assurance-1":"और वह गवाही यह है, कि परमेश्‍वर ने हमें अनन्त जीवन दिया है और यह जीवन उसके पुत्र में है। जिसके पास पुत्र है, उसके पास जीवन है; और जिसके पास परमेश्‍वर का पुत्र नहीं, उसके पास जीवन भी नहीं है।","assurance-2":"अब तक तुम ने मेरे नाम से कुछ नहीं माँगा; माँगो तो पाओगे ताकि तुम्हारा आनन्द पूरा हो जाए।।","assurance-3":"तुम किसी ऐसी परीक्षा में नहीं पड़े, जो मनुष्य के सहने के बाहर है: और परमेश्‍वर विश्वासयोग्य है: वह तुम्हें सामर्थ्य से बाहर परीक्षा में न पड़ने देगा, वरन् परीक्षा के साथ निकास भी करेगा; कि तुम सह सको।","assurance-4":"यदि हम अपने पापों को मान लें, तो वह हमारे पापों को क्षमा करने, और हमें सब अधर्म से शुद्ध करने में विश्वासयोग्य और धर्मी है।","assurance-5":"तू अपनी समझ का सहारा न लेना, वरन् सम्पूर्ण मन से यहोवा पर भरोसा रखना। उसी को स्मरण करके सब काम करना, तब वह तेरे लिये सीधा मार्ग निकालेगा।","living-1":"मैं दाखलता हूँ: तुम डालियाँ हो; जो मुझ में बना रहता है, और मैं उसमें, वह बहुत फल फलता है, क्योंकि मुझसे अलग होकर तुम कुछ भी नहीं कर सकते।","living-2":"और अब मैं तुम्हें परमेश्‍वर को, और उसके अनुग्रह के वचन को सौंप देता हूँ; जो तुम्हारी उन्नति कर सकता है, और सब पवित्र किये गये लोगों में सहभागी होकर विरासत दे सकता है।","living-3":"इसलिए कि जितने लोग परमेश्‍वर के आत्मा के चलाए चलते हैं, वे ही परमेश्‍वर के पुत्र हैं।","living-4":"क्योंकि हम रूप को देखकर नहीं, पर विश्वास से चलते हैं।","living-5":"हे प्रियों, जब परमेश्‍वर ने हम से ऐसा प्रेम किया, तो हमको भी आपस में प्रेम रखना चाहिए।","living-6":"पर यदि जैसा वह ज्योति में है, वैसे ही हम भी ज्योति में चलें, तो एक दूसरे से सहभागिता रखते हैं और उसके पुत्र यीशु मसीह का लहू हमें सब पापों से शुद्ध करता है।","living-7":"पर मसीह को प्रभु जानकर अपने-अपने मन में पवित्र समझो, और जो कोई तुम से तुम्हारी आशा के विषय में कुछ पूछे, तो उसे उत्तर देने के लिये सर्वदा तैयार रहो, पर नम्रता और भय के साथ;","living-8":"हर एक जन जैसा मन में ठाने वैसा ही दान करे; न कुढ़-कुढ़ के, और न दबाव से, क्योंकि परमेश्‍वर हर्ष से देनेवाले से प्रेम रखता है।","tms60-A-1":"इसलिए यदि कोई मसीह में है तो वह नई सृष्टि है: पुरानी बातें बीत गई हैं; देखो, वे सब नई हो गईं।","tms60-A-2":"मैं मसीह के साथ क्रूस पर चढ़ाया गया हूँ, और अब मैं जीवित न रहा, पर मसीह मुझ में जीवित है: और मैं शरीर में अब जो जीवित हूँ तो केवल उस विश्वास से जीवित हूँ, जो परमेश्‍वर के पुत्र पर है, जिस ने मुझसे प्रेम किया, और मेरे लिये अपने आप को दे दिया।","tms60-A-3":"इसलिए हे भाइयों, मैं तुम से परमेश्‍वर की दया स्मरण दिलाकर विनती करता हूँ, कि अपने शरीरों को जीवित, और पवित्र, और परमेश्‍वर को भावता हुआ बलिदान करके चढ़ाओ; यही तुम्हारी आत्मिक सेवा है।","tms60-A-4":"जिसके पास मेरी आज्ञा है, और वह उन्हें मानता है, वही मुझसे प्रेम रखता है, और जो मुझसे प्रेम रखता है, उससे मेरा पिता प्रेम रखेगा, और मैं उससे प्रेम रखूँगा, और अपने आप को उस पर प्रगट करूँगा।”","tms60-A-5":"सम्पूर्ण पवित्रशास्त्र परमेश्‍वर की प्रेरणा से रचा गया है और उपदेश, और समझाने, और सुधारने, और धार्मिकता की शिक्षा के लिये लाभदायक है,","tms60-A-6":"व्यवस्था की यह पुस्तक तेरे चित्त से कभी न उतरने पाए, इसी में दिन-रात ध्यान दिए रहना, इसलिए कि जो कुछ उसमें लिखा है उसके अनुसार करने की तू चौकसी करे; क्योंकि ऐसा ही करने से तेरे सब काम सफल होंगे, और तू प्रभावशाली होगा।","tms60-A-7":"यदि तुम मुझ में बने रहो, और मेरी बातें तुम में बनी रहें तो जो चाहो माँगो और वह तुम्हारे लिये हो जाएगा।","tms60-A-8":"किसी भी बात की चिन्ता मत करो; परन्तु हर एक बात में तुम्हारे निवेदन, प्रार्थना और विनती के द्वारा धन्यवाद के साथ परमेश्‍वर के सम्मुख उपस्थित किए जाएँ। तब परमेश्‍वर की शान्ति, जो सारी समझ से बिलकुल परे है, तुम्हारे हृदय और तुम्हारे विचारों को मसीह यीशु में सुरक्षित रखेगी।","tms60-A-9":"क्योंकि जहाँ दो या तीन मेरे नाम पर इकट्ठे होते हैं वहाँ मैं उनके बीच में होता हूँ।”","tms60-A-10":"और प्रेम, और भले कामों में उस्काने के लिये एक दूसरे की चिन्ता किया करें। और एक दूसरे के साथ इकट्ठा होना न छोड़ें, जैसे कि कितनों की रीति है, पर एक दूसरे को समझाते रहें; और ज्यों-ज्यों उस दिन को निकट आते देखो, त्यों-त्यों और भी अधिक यह किया करो।","tms60-A-11":"और उनसे कहा, “मेरे पीछे चले आओ, तो मैं तुम को मनुष्यों के पकड़नेवाले बनाऊँगा।”","tms60-A-12":"क्योंकि मैं सुसमाचार से नहीं लज्जाता, इसलिए कि वह हर एक विश्वास करनेवाले के लिये, पहले तो यहूदी, फिर यूनानी के लिये, उद्धार के निमित्त परमेश्‍वर की सामर्थ्य है।","tms60-B-1":"इसलिए कि सब ने पाप किया है और परमेश्‍वर की महिमा से रहित है,","tms60-B-2":"हम तो सबके सब भेड़ों के समान भटक गए थे; हम में से हर एक ने अपना-अपना मार्ग लिया; और यहोवा ने हम सभी के अधर्म का बोझ उसी पर लाद दिया।","tms60-B-3":"क्योंकि पाप की मजदूरी तो मृत्यु है, परन्तु परमेश्‍वर का वरदान हमारे प्रभु मसीह यीशु में अनन्त जीवन है।","tms60-B-4":"और जैसे मनुष्यों के लिये एक बार मरना और उसके बाद न्याय का होना नियुक्त है।","tms60-B-5":"परन्तु परमेश्‍वर हम पर अपने प्रेम की भलाई इस रीति से प्रगट करता है, कि जब हम पापी ही थे तभी मसीह हमारे लिये मरा।","tms60-B-6":"इसलिए कि मसीह ने भी, अर्थात् अधर्मियों के लिये धर्मी ने पापों के कारण एक बार दुःख उठाया, ताकि हमें परमेश्‍वर के पास पहुँचाए; वह शरीर के भाव से तो मारा गया, पर आत्मा के भाव से जिलाया गया।","tms60-B-7":"क्योंकि विश्वास के द्वारा अनुग्रह ही से तुम्हारा उद्धार हुआ है, और यह तुम्हारी ओर से नहीं, वरन् परमेश्‍वर का दान है; और न कर्मों के कारण, ऐसा न हो कि कोई घमण्ड करे।","tms60-B-8":"तो उसने हमारा उद्धार किया और यह धार्मिक कामों के कारण नहीं, जो हमने आप किए, पर अपनी दया के अनुसार, नये जन्म के स्नान, और पवित्र आत्मा के हमें नया बनाने के द्वारा हुआ।","tms60-B-9":"परन्तु जितनों ने उसे ग्रहण किया, उसने उन्हें परमेश्‍वर के सन्तान होने का अधिकार दिया, अर्थात् उन्हें जो उसके नाम पर विश्वास रखते हैं","tms60-B-10":"देख, मैं द्वार पर खड़ा हुआ खटखटाता हूँ; यदि कोई मेरा शब्द सुनकर द्वार खोलेगा, तो मैं उसके पास भीतर आकर उसके साथ भोजन करूँगा, और वह मेरे साथ।","tms60-B-11":"मैंने तुम्हें, जो परमेश्‍वर के पुत्र के नाम पर विश्वास करते हो, इसलिए लिखा है कि तुम जानो कि अनन्त जीवन तुम्हारा है।","tms60-B-12":"मैं तुम से सच-सच कहता हूँ, जो मेरा वचन सुनकर मेरे भेजनेवाले पर विश्वास करता है, अनन्त जीवन उसका है, और उस पर दण्ड की आज्ञा नहीं होती परन्तु वह मृत्यु से पार होकर जीवन में प्रवेश कर चुका है।","tms60-C-1":"क्या तुम नहीं जानते, कि तुम परमेश्‍वर का मन्दिर हो, और परमेश्‍वर का आत्मा तुम में वास करता है?","tms60-C-2":"परन्तु हमने संसार की आत्मा नहीं, परन्तु वह आत्मा पाया है, जो परमेश्‍वर की ओर से है, कि हम उन बातों को जानें, जो परमेश्‍वर ने हमें दी हैं।","tms60-C-3":"मत डर, क्योंकि मैं तेरे संग हूँ, इधर-उधर मत ताक, क्योंकि मैं तेरा परमेश्‍वर हूँ; मैं तुझे दृढ़ करूँगा और तेरी सहायता करूँगा, अपने धर्ममय दाहिने हाथ से मैं तुझे सम्भाले रहूँगा।","tms60-C-4":"जो मुझे सामर्थ्य देता है उसमें मैं सब कुछ कर सकता हूँ।","tms60-C-5":"हम मिट नहीं गए; यह यहोवा की महाकरुणा का फल है, क्योंकि उसकी दया अमर है। प्रति भोर वह नई होती रहती है; तेरी सच्चाई महान है।","tms60-C-6":"परमेश्‍वर मनुष्य नहीं कि झूठ बोले, और न वह आदमी है कि अपनी इच्छा बदले। क्या जो कुछ उसने कहा उसे न करे? क्या वह वचन देकर उसे पूरा न करे?","tms60-C-7":"जिसका मन तुझ में धीरज धरे हुए हैं, उसकी तू पूर्ण शान्ति के साथ रक्षा करता है, क्योंकि वह तुझ पर भरोसा रखता है।","tms60-C-8":"अपनी सारी चिन्ता उसी पर डाल दो, क्योंकि उसको तुम्हारा ध्यान है।","tms60-C-9":"जिस ने अपने निज पुत्र को भी न रख छोड़ा, परन्तु उसे हम सब के लिये दे दिया, वह उसके साथ हमें और सब कुछ क्यों न देगा?","tms60-C-10":"और मेरा परमेश्‍वर भी अपने उस धन के अनुसार जो महिमा सहित मसीह यीशु में है तुम्हारी हर एक घटी को पूरी करेगा।","tms60-C-11":"क्योंकि जब उसने परीक्षा की दशा
