리스도께 복종케 하니","tms180-s4-1-4":"끝으로 나의 형제들아, 주 안에서와 그의 힘의 능력 안에서 강건하라. 너희는 마귀의 술책에 대항하여 설 수 있도록 하나님의 전신갑옷을 입으라.","tms180-s4-1-5":"그들이 어린 양의 피와 자기들이 증거한 말로 그를 이겼으니, 그들은 죽기까지 자기들의 생명을 사랑하지 아니하였도다.","tms180-s4-1-6":"그러므로 하나님께 복종하라. 마귀를 대적하라. 그리하면 그가 너희로부터 도망하리라. 하나님께 가까이 다가가라. 그리하면 그 분께서도 너희에게 가까이 다가가시리라. 너희 죄인들아, 손을 깨끗이 하라. 너희 두 생각을 품은 자들아, 마음을 정결케 하라.","tms180-s4-1-7":"육신을 따르는 사람들은 육신의 일들을 생각하나 성령을 따르는 사람들은 성령의 일들을 생각하느니라. 육신적으로 생각하는 것은 사망이나, 영적으로 생각하는 것은 생명과 화평이니라.","tms180-s4-1-8":"오직 주 예수 그리스도로 옷 입고 정욕을 채우기 위하여 육신을 위해 계획하지 말라.","tms180-s4-1-9":"어린 자녀들아, 너희는 하나님께 속하였고 또 그들을 이겼으니, 이는 너희 안에 계신 분이 세상에 있는 자보다 더 크시기 때문이라.","tms180-s4-1-10":"이는 하나님께로부터 태어난 자는 누구든지 세상을 이기기 때문이라. 세상을 이기는 승리는 이것이니, 곧 우리의 믿음이라. 예수께서 하나님의 아들이심을 믿는 자 외에 세상을 이기는 자가 누구뇨?","tms180-s4-1-11":"그의 마음에는 그의 하나님의 법이 있으니, 그의 걸음에 실족함이 없으리로다.","tms180-s4-1-12":"그러므로 너희는 죄가 너희 죽을 몸 안에서 군림하지 못하게 하여 몸의 정욕 가운데 죄에게 순종하지 말고 또 너희 지체를 불의의 병기로 죄에게 내어 주지 말고, 다만 너희 자신을 죽은 자들로부터 살아난 자처럼 하나님께 드리며 너희 지체를 의의 병기로 하나님께 드리라.","tms180-s4-2-1":"끝으로 형제들아, 무슨 일에든지 참되며, 무슨 일에든지 정직하며, 무슨 일에든지 의로우며, 무슨 일에든지 순결하며, 무슨 일에든지 사랑스러우며, 무슨 일에든지 좋은 평판을 얻고, 만일 무슨 덕이 있거나 무슨 칭찬이 있으면 이런 것에 대해서 생각하라.","tms180-s4-2-2":"정결한 사람들에게는 모든 것이 정결하나 더럽혀진 자들과 믿지 않는 자들에게는 아무것도 정결한 것이 없고, 도리어 그들의 마음과 양심이 다 더럽혀져 있느니라.","tms180-s4-2-3":"선한 사람은 마음에 쌓은 선한 보화에서 선한 것을 내고 악한 사람은 마음에 쌓은 악한 보화에서 악한 것을 내느니라. 이는 마음에서 넘쳐나는 것을 그 입이 말하기 때문이라.","tms180-s4-2-4":"열심을 다하여 네 마음을 지키라. 이는 삶의 문제들이 거기서 나옴이라.","tms180-s4-2-5":"몸의 빛은 눈이라. 그러므로 네 눈이 순전하면 네 온 몸이 빛으로 가득 찰 것이요","tms180-s4-2-6":"내가 너희에게 말하노니, 음욕을 품고 여자를 바라보는 자는 누구나 그의 마음에 그녀와 더불어 이미 간음하였느니라.","tms180-s4-2-7":"하나님의 뜻은 이것이니, 곧 너희의 거룩함이니라. 너희는 음행을 삼가고","tms180-s4-2-8":"음식은 배를 위하고 배는 음식을 위하나 하나님께서는 이것과 저것 둘 다 폐하시리라. 이제 몸은 음행을 위하지 아니하고 주를 위하며, 주께서는 몸을 위하시느니라.","tms180-s4-2-9":"너희 입에서 어떠한 더러운 말도 나오지 아니하게 하고 오직 덕을 세우는 데 필요한 좋은 것만을 말하여 듣는 자들에게 은혜를 끼치게 하라.","tms180-s4-2-10":"그러나 내가 너희에게 말하노니 사람이 말하는 어떠한 빈 말이라도 심판 날에는 그에 관하여 해명하게 되리라. 이는 네 말들로 인하여 네가 의롭게 되고 또 네 말들로 인하여 네가 정죄함을 받게 될 것이기 때문이라.\"고 하시니라.","tms180-s4-2-11":"악은 어떤 형태이든지 피하라.","tms180-s4-2-12":"나이 많은 이를 책망하지 말고 오히려 아버지처럼, 젊은 남자들은 형제처럼 권고하며 나이 많은 여인들은 어머니처럼, 젊은 여인들은 온전한 정결로써 자매처럼 권고하라.","tms180-s4-3-1":"또 기도할 때에 무엇이든지 너희가 믿고 구하는 것은 다 받으리라.\"고 하시더라.","tms180-s4-3-2":"구하라 그러면 너희에게 주실 것이요, 찾으라 그러면 너희가 찾을 것이요, 두드리라 그러면 너희에게 열릴 것이라. 이는 구하는 자마다 받을 것이요, 찾는 자는 찾을 것이요, 또 두드리는 자에게는 열릴 것이기 때문이라.","tms180-s4-3-3":"그러나 너는 기도할 때에 너의 골방에 들어가 방문을 닫고 은밀히 계신 네 아버지께 기도하라. 그러면 은밀히 보시는 네 아버지께서 너에게 드러나게 갚아 주시리라.","tms180-s4-3-4":"이른 아침 아직 동이 트지도 않았는데, 주께서 일어나 밖으로 나가 한적한 곳으로 가셔서 거기서 기도하시더라.","tms180-s4-3-5":"나를 부르라. 그리하면 내가 네게 응답하겠고 네가 알지 못하는 크고 능력있는 일들을 네게 보이리라.","tms180-s4-3-6":"우리 안에서 역사하시는 능력을 따라 우리가 구하는 것이나 생각하는 모든 것보다 훨씬 풍성하게 행하실 수 있는 그 분께","tms180-s4-3-7":"우리가 그의 안에서 가지는 담대함이 이것이니, 그의 뜻대로 무엇이든지 구하면 그가 우리를 들으시는 것이라. 우리가 구하는 것은 무엇이나 그가 들으시는 줄을 안다면, 우리가 그에게 구한 요청들을 받은 줄도 아느니라.","tms180-s4-3-8":"쉬지 말고 기도하라. 모든 일에 감사하라. 이것은 그리스도 예수 안에서 너희에 관한 하나님의 뜻이니라.","tms180-s4-3-9":"또 나로서는 결단코 너희를 위하여 기도하기를 그침으로 주께 대하여 죄를 범하지 아니하며, 내가 선하고 의로운 길을 너희에게 가르치리니","tms180-s4-3-10":"그때 주께서 제자들에게 말씀하시기를 \"참으로 추수할 것은 많으나 일꾼들이 적구나 그러므로 추수의 주께 기도하여 추수할 일꾼들을 보내 주소서 하라.\"고 하시더라.","tms180-s4-3-11":"그러므로 우리가 그분을 통해서 찬양의 제물을 하나님께 계속해서 드리자. 이것이 그의 이름에 감사하는 우리 입술의 열매니라.","tms180-s4-3-12":"너희는 주를 찬양하라. 오 내 혼아, 주를 찬양하라. 내가 살아 있는 동안 주를 찬양할 것이요, 내가 존재하는 동안 나의 하나님을 찬송하리로다.","tms180-s5-1-1":"하나님께서는 이들에게 이방인들 가운데서 이 신비의 영광의 풍요함이 어떠한지를 알리고자 하셨으니, 이 신비는 너희 안에 계신 그리스도시니, 곧 영광의 소망이라. 우리가 그를 전파하고 각 사람을 훈계하며 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 예수 안에서 온전하게 제시하려는 것이라.","tms180-s5-1-2":"즉 하나님께서 그리스도 안에 계셔서 세상을 자신과 화해하게 하시며 그들의 죄과를 그들에게 돌리지 아니하시고 우리에게 화해의 말씀을 맡겨 주신 것이라. 그러므로 이제 우리는 그리스도를 대신한 대사들로서 하나님께서 우리를 통하여 너희를 권면하신 것같이 우리도 그리스도를 대신하여 너희에게 간구하노니, 너희는 하나님과 화해하라.","tms180-s5-1-3":"오직 하나님의 승인을 받아 복음을 위탁받은 대로 전하노니 이는 사람들을 기쁘게 하려 함이 아니며 우리의 마음을 시험하시는 하나님만을 기쁘시게 하려 함이니라.","tms180-s5-1-4":"내가 모든 사람으로부터 자유인이 되었지만, 스스로 모든 사람에게 종이 된 것은 더 많은 사람을 얻으려 함이라.","tms180-s5-1-5":"너희가 아직도 넉 달이 있어야 추수할 때가 된다고 말하지 아니하느냐? 보라, 내가 너희에게 말하노니 눈을 들어 밭을 보라. 이는 곡식이 추수하도록 이미 하얗게 되었음이라.","tms180-s5-1-6":"너희를 그처럼 그리워하여 하나님의 복음 뿐만 아니라 우리 자신의 생명까지도 너희에게 주기를 기뻐하였으니 이는 너희가 우리의 사랑하는 자가 되었기 때문이니라.","tms180-s5-1-7":"기록된 바와 같이 \"의인은 없나니, 없도다, 한 사람도 없도다. 모두가 탈선하여 함께 무익하게 되었으며 선을 행하는 자는 없으니, 없도다, 한 사람도 없도다.","tms180-s5-1-8":"하나님을 알지 못하는 자들과 우리 주 예수 그리스도의 복음에 순종치 아니하는 자들에게 불길 가운데서 벌 주시리니 이런 자들은 주의 임재와 그의 능력의 영광으로부터 떠나 영원한 멸망의 형벌을 받게 될 것이라.","tms180-s5-1-9":"그가 친히 나무에 달린 자신의 몸으로 우리의 죄들을 담당하셨으니, 이는 우리가 죄들에는 죽고 의에는 살게 하려 하심이니라. 그가 채찍에 맞음으로 너희가 낫게 되었느니라.","tms180-s5-1-10":"하나님께서 우리를 구원하시고 거룩한 소명으로 부르심은 우리의 행위에 따라 하신 것이 아니라 그 분의 목적과 은혜에 따라 하신 것이니, 이는 세상이 시작되기 이전에 그리스도 예수 안에서 우리에게 주신 것이라.","tms180-s5-1-11":"네가 네 입으로 주 예수를 시인하고 또 하나님께서 그를 죽은 자들로부터 살리신 것을 네 마음에 믿으면 구원을 받으리라. 이는 사람이 마음으로 믿어 의에 이르고 입으로 고백하여 구원에 이르기 때문이라.","tms180-s5-1-12":"내가 그들에게 영생을 주노니 그들은 영원히 멸망하지 않을 것이며, 또 아무도 그들을 나의 손에서 빼앗지 못할 것이니라. 그들을 나에게 주신 내 아버지는 만유보다 더 위대하시니, 아무도 내 아버지 손에서 그들을 빼앗아 갈 수 없느니라.","tms180-s5-2-1":"사람의 모든 행위가 자신의 눈에는 옳으나, 주께서는 마음들을 감찰하시느니라.","tms180-s5-2-2":"사람이 온 세상을 얻고도 자신의 혼을 잃는다면 무슨 유익이 있겠느냐?","tms180-s5-2-3":"만일 누구든지 그 분의 뜻을 행하려고 한다면, 그 교리가 하나님으로부터 온 것인지 아니면 내가 내 자신에 관하여 말하는 것인지 알게 되리라.","tms180-s5-2-4":"예수께서 대답하여 그들에게 말씀하시기를 \"건강한 사람들에게는 의사가 필요없지만 병든 사람들에게는 필요하니라. 나는 의인들을 부르러 온 것이 아니요, 죄인들을 회개에 이르게 하려고 왔노라.\"고 하시더라.","tms180-s5-2-5":"너희가 서로 영광을 받으면서 오직 하나님으로부터 오는 영광은 구하지 아니하니, 어찌 나를 믿을 수 있겠느냐?","tms180-s5-2-6":"이러므로 그는 또한 자기를 통하여 하나님께 나아오는 자들을 끝까지 구원하실 수 있으니, 이는 그가 항상 살아 계셔 그들을 위하여 중보하심이라.","tms180-s5-2-7":"너는 내일을 자랑하지 말라. 하루 동안에 무슨 일이 일어날는지 네가 알 수 없음이라.","tms180-s5-2-8":"그러므로 우리 각 사람이 하나님께 자신들에 관해 직접 설명하리라.","tms180-s5-2-9":"성경을 상고하라. 이는 너희가 성경에 영생이 있다고 생각함이니 그 성경은 나에 관하여 증거하고 있음이라.","tms180-s5-2-10":"사람에게 옳게 보이는 길이 있으나, 그 끝은 죽음의 길이니라.","tms180-s5-2-11":"그때에 왕이 왼편에 있는 자들에게도 말하기를 '너희 저주받은 자들아, 내게서 떠나 마귀와 그의 천사들을 위하여 준비한 영원한 불 속으로 들어가라.","tms180-s5-2-12":"세상의 창조 때부터 그 분에 속한 보이지 않는 것들이 분명히 보여졌고 심지어는 그 분의 영원한 능력과 신격까지도 만들어진 것들에 의해 알려졌으므로 그들이 변명하지 못하느니라.","tms180-s5-3-1":"이는 너희가 아는 바와 같이, 너희가 너희 조상들로부터 전통으로 이어받은 너희의 허망한 행실에서 은이나 금같은 썩어질 것들로 구속된 것이 아니라 흠도 없고 점도 없는 어린 양 같은 그리스도의 보배로운 피로 된 것이기 때문이니라.","tms180-s5-3-2":"모든 것이 하나님께로부터 났으며 그 분께서는 예수 그리스도를 통하여 스스로 우리와 화해하셨고 화해의 직분을 우리에게 주셨으니","tms180-s5-3-3":"그 사랑하시는 이 안에서 우리는 그의 은혜의 풍성함을 따라 그의 피를 통하여 구속 즉 죄들의 용서함을 받았느니라.","tms180-s5-3-4":"죄가 너희를 주관하지 못하리니, 이는 너희가 율법 아래 있지 아니하고 은혜 아래 있기 때문이라. 그런즉 어떻게 하리요? 우리가 율법 아래 있지 아니하고 은혜 아래 있으니 죄를 지어도 된다는 말인가? 결코 그럴 수 없느니라.","tms180-s5-3-5":"너희가 다 그리스도 예수 안에서 믿음으로 말미암아 하나님의 자녀들이 되었으니","tms180-s5-3-6":"그러나 너희는 선택받은 세대요 왕 같은 제사장이며, 거룩한 민족이요 그에게 속한 친백성이니, 이는 너희를 어두움에서 불러내어 그의 놀라운 빛으로 들어가게 하신 분의 덕을 너희로 선포하게 하려는 것이니라.","tms180-s5-3-7":"하나님께서 죄를 알지도 못하는 그를 우리를 위하여 죄로 삼으신 것은 우리로 하여금 그 안에서 하나님의 의가 되게 하려 하심이라.","tms180-s5-3-8":"그러나 너희는 그 분에게서 나서 그리스도 예수 안에 있고, 주께서는 하나님에게서 나셔서 우리에게 지혜와 의와 거룩함과 구속이 되셨으니","tms180-s5-3-9":"이는 그가 한 번의 제사로써 거룩하게 된 자들을 영원히 온전케 하셨기 때문이라.","tms180-s5-3-10":"그리스도 예수 안에 있는 구속을 통하여 그의 은혜로 값없이 의롭게 되었음이라.","tms180-s5-3-11":"우리의 시민권은 하늘에 있으므로 우리가 그 곳으로부터 오실 구주이신 주 예수 그리스도를 기다리고 있으니","tms180-s5-3-12":"그 분 안에는 신격의 모든 충만함이 몸의 형태로 거하시나니 너희도 모든 정사와 권세의 머리이신 그의 안에서 온전하게 되느니라.","dep242-1-1":"너희가 믿음 안에 있는지 너희 자신을 시험하고 스스로 입증하라. 예수 그리스도께서 너희 안에 계신 것을 스스로 알지 못하느냐? 그렇지 못하면 너희는 버림받은 자들이라.","dep242-1-2":"또 증거는 이것이니, 하나님께서 우리에게 영생을 주신 것과, 이 생명이 그의 아들 안에 있다는 것이라. 그 아들이 있는 자는 생명이 있고 하나님의 아들이 없는 자는 생명이 없느니라.","dep242-1-3":"진실로 진실로 내가 너희에게 말하노니, 나를 믿는 사람은 영생을 가졌나니","dep242-1-4":"내가 하나님의 아들의 이름을 믿는 너희에게 이런 것들을 씀은 너희에게 영생이 있음을 알게 하려 함이며, 또한 너희가 하나님의 아들의 이름을 믿도록 하려 함이라.","dep242-1-5":"그 사랑하시는 이 안에서 우리는 그의 은혜의 풍성함을 따라 그의 피를 통하여 구속 즉 죄들의 용서함을 받았느니라.","dep242-1-6":"그러므로 이제 그리스도 예수 안에 있는 자들에게는 결코 정죄함이 없나니, 그들은 육신을 따라 행하지 아니하고 성령을 따라 행하느니라.","dep242-1-7":"그리스도 예수 안에 있는 구속을 통하여 그의 은혜로 값없이 의롭게 되었음이라.","dep242-1-8":"그러므로 우리가 믿음으로 의롭게 되었으니, 우리 주 예수 그리스도를 통하여 하나님과 화평을 갖느니라.","dep242-1-9":"하나님 곧 우리 주 예수 그리스도의 아버지를 송축하리로다. 그 분은 그의 풍성하신 자비하심을 따라 죽은 자들로부터의 예수 그리스도의 부활로 인하여 우리를 거듭나게 하사 산 소망을 갖게 하셨으며","dep242-1-10":"우리가 행한 의로운 행위에 의하지 않고 그의 자비하심에 따라 중생의 씻음과 성령의 새롭게 하심으로 우리를 구원하셨으니","dep242-1-11":"무릇 하나님의 영으로 인도함을 받는 이들은 곧 하나님의 아들들이니라.","dep242-1-12":"너희가 다 그리스도 예수 안에서 믿음으로 말미암아 하나님의 자녀들이 되었으니","dep242-1-13":"그러나 하나님의 영이 너희 안에 거하시면 너희가 육신 안에 있지 아니하고 성령 안에 있나니, 이제 누구든지 그리스도의 영이 없으면 그의 사람이 아니니라.","dep242-1-14":"또 내가 아버지께 기도하겠고, 그 분께서 다른 위로자를 너희에게 주시리니 그가 너희와 함께 영원히 거하시리라. 진리의 영인 그를 세상은 영접할 수 없으니 이는 세상이 그를 보지도 못하며 또한 알지 못하기 때문이라. 그러나 너희는 그를 아나니 이는 그가 너희와 함께 거하시며 또 너희 안에 계실 것임이라.","dep242-1-15":"높음이나 깊음이나 어떤 다른 피조물이라도 우리를 그리스도 예수 우리 주 안에 있는 하나님의 사랑에서 떼어 놓을 수 없으리라.","dep242-1-16":"내가 그들에게 영생을 주노니 그들은 영원히 멸망하지 않을 것이며, 또 아무도 그들을 나의 손에서 빼앗지 못할 것이니라. 그들을 나에게 주신 내 아버지는 만유보다 더 위대하시니, 아무도 내 아버지 손에서 그들을 빼앗아 갈 수 없느니라.","dep242-1-17":"그 분 안에서 너희도 진리의 말씀, 곧 너희 구원의 복음을 듣고 그 분 안에서 또한 믿었으니 너희는 약속의 성령으로 인침을 받은 것이니라.","dep242-1-18":"너희가 거듭난 것은 썩어질 씨로 된 것이 아니라 썩지 아니할 씨로 된 것이니 살아 있고 영원히 거하는 하나님의 말씀으로 되었느니라.","dep242-2-1-1":"그러므로 주께서 기다리시나니 이는 그가 너희에게 은혜로우심이요, 그러므로 그가 높임을 받으시리니 이는 그가 너희에게 자비를 베푸시려 함이라. 주는 공의의 하나님이시니 그를 기다리는 자들은 모두가 복이 있도다.","dep242-2-1-2":"너희를 그의 아들 예수 그리스도 우리 주의 교제 안으로 부르신 하나님께서는 신실하시도다.","dep242-2-1-3":"그를 찾을 만한 때에 너희는 주를 구하며, 그가 가까이 계실 때 그를 부르라.","dep242-2-1-4":"주께서 말씀하시기를 \"너희는 내 얼굴을 찾으라.\" 하셨을 때에, 내 마음이 주께 말씀드리기를 \"주여, 내가 주의 얼굴을 찾으리이다.\" 하였나이다.","dep242-2-1-5":"나는 포도나무요 너희는 그 가지들이라. 그가 내 안에 내가 그 안에 거하면 그 사람은 많은 열매를 맺느니라. 이는 나를 떠나서는 너희가 아무것도 할 수 없기 때문이라.","dep242-2-1-6":"젊은 사자는 궁핍하여 굶주려도, 주를 찾는 자들은 모든 좋은 것에 부족함이 없으리라.","dep242-2-1-7":"아침에 나로 주의 자애를 듣게 하소서. 이는 내가 주를 의지함이니이다. 나로 하여금 내가 가야 할 길을 알게 하소서. 이는 내가 나의 혼을 주께 들어올렸기 때문이니이다. 주의 뜻을 행하도록 나를 가르치소서. 이는 주께서 나의 하나님이시기 때문이니이다. 주의 영이 선하시니 나를 정직한 자의 땅으로 인도하소서.","dep242-2-1-8":"내가 내 파수하는 곳에 서며 망대에 서서 그가 내게 말씀하실 것과 책망받을 때에 내가 어떻게 대답할 것인지를 지켜보리라.","dep242-2-2-1":"오 내 혼아, 어찌하여 네가 낙담하느냐? 어찌하여 네가 내 안에서 불안해 하느냐? 너는 하나님을 바라라. 내 얼굴을 강건케 하시는 분이요 나의 하나님이신 그 분을 내가 여전히 찬양하리라.","dep242-2-2-2":"그리고 우리 믿음의 창시자요 완성자이신 예수를 바라보자. 그는 자기 앞에 있는 즐거움을 위하여 십자가를 견디시고 수치를 개의치 아니하시더니 하나님의 보좌 오른편에 앉으셨느니라.","dep242-2-2-3":"내가 주를 기다리며 내 혼이 기다리오니, 내가 주의 말씀을 바라나이다. 파수하는 자들이 아침을 기다리는 것보다 내 혼이 주를 더욱 기다리오니, 내가 말씀드리건대, 파수하는 자들이 아침을 기다리는 것보다 더하나이다.","dep242-2-2-4":"수사슴이 시냇물을 갈망하는 것같이, 오 하나님이여, 내 혼도 그처럼 주를 갈망하나이다.","dep242-2-2-5":"너의 짐을 주께 맡기라. 그리하면 그가 너를 붙드시고, 의인이 흔들리는 것을 결코 허락하지 아니하시리라.","dep242-2-2-6":"날마다 우리에게 베푸심을 더하시는 주, 곧 구원의 하나님을 송축하리로다. 셀라.","dep242-2-2-7":"네가 나의 피난처이신 주, 곧 지극히 높으신 분을 네 처소로 삼았으므로 어떠한 재앙도 네게 닥치지 못하며, 어떠한 전염병도 네 장막에 가까이 가지 못하리라.","dep242-2-2-8":"수고하고 무거운 짐진 자들아, 다 내게로 오라. 그러면 내가 너희에게 쉼을 주리라. 나는 마음이 온유하고 겸손하니 내 멍에를 메고 나에게서 배우라. 그리하면 너희가 너희 혼에 쉼을 얻으리라.","dep242-2-2-9":"내가 아침이 동터오기 전에 일어나 부르짖었으니, 내가 주의 말씀을 바랐나이다. 내가 주의 말씀을 묵상하려고 내 눈이 밤의 경점들 전에 깨나이다.","dep242-2-2-10":"오 주여, 주께서 아침에 내 목소리를 들으시리니, 아침에 내가 주께 나의 기도를 드리고 바라보리이다.","dep242-2-2-11":"오, 오라, 우리가 경배하며 절하자. 우리가 우리를 만드신 주 앞에 무릎을 꿇자.","dep242-2-2-12":"그러므로 우리가 그분을 통해서 찬양의 제물을 하나님께 계속해서 드리자. 이것이 그의 이름에 감사하는 우리 입술의 열매니라.","dep242-2-2-13":"오, 아침에 주의 자비로 우리를 만족케 하시며, 평생 동안 우리로 즐거워하고 기뻐하게 하소서.","dep242-2-2-14":"이는 그가 사모하는 혼을 만족케 하시며 굶주린 혼을 선하심으로 채워 주심이라.","dep242-2-3-15":"이른 아침 아직 동이 트지도 않았는데, 주께서 일어나 밖으로 나가 한적한 곳으로 가셔서 거기서 기도하시더라.","dep242-2-3-1":"주께서는 사람이 자기 친구와 말하는 것같이 모세와 대면하여 말씀하시니라. 모세는 다시 진영으로 돌아왔으나 눈의 아들인 그의 종 청년 여호수아는 성막을 떠나지 아니하니라.","dep242-2-3-2":"이제 다니엘이 그 문서가 서명된 것을 알았을 때 그의 집으로 가서 그의 방에서 예루살렘을 향해 창문을 열어 두고, 그가 전에 하던 대로 하루에 세 번씩 무릎을 끓고 기도하였으며 그의 하나님 앞에 감사를 드렸더라.","dep242-2-3-3":"그들에게는 비유를 들지 아니하고는 말씀하지 아니하시고, 제자들만 있을 때에는 모든 것을 풀어서 설명해 주시더라.","dep242-3-1-1":"예언은 예전에 사람의 뜻에서 나온 것이 아니요 오직 하나님의 거룩한 사람들이 성령으로 감동을 받아 말한 것이니라.","dep242-3-1-2":"모든 성경은 하나님의 영감으로 주어진 것으로 교리와 책망과 바로잡음과 의로 훈육하기에 유익하니","dep242-3-1-3":"하늘과 땅은 없어져도 내 말은 결코 없어지지 아니하리라.","dep242-3-1-4":"이는 모든 육체는 풀과 같고 사람의 모든 영광은 풀의 꽃과 같으며, 풀은 마르고 꽃은 져도 주의 말씀은 영원토록 남아 있음이라. 이것이 너희에게 복음으로 전해진 말씀이니라.","dep242-3-1-5":"아버지의 진리로 그들을 거룩하게 하여 주옵소서. 아버지의 말씀은 진리니이다.","dep242-3-1-6":"오 주 하나님이여, 주는 그 하나님이시며, 주의 말씀은 참되시고, 주께서는 이 선하심을 주의 종에게 약속하셨나이다.","dep242-3-1-7":"주가 말하노라. 내 말이 불 같지 아니하냐? 바위를 부수어 조각내는 큰 망치 같지 아니하냐?","dep242-3-1-8":"이 복음으로 인하여 내가 악을 행하는 자처럼 매여서까지 고난을 받고 있으나 하나님의 말씀은 매이지 아니하느니라.","dep242-3-1-9":"그러나 주께서 대답하여 말씀하시기를 \"기록되었으되 '사람이 빵으로만 사는 것이 아니요 하나님의 입에서 나오는 모든 말씀으로 사느니라.'고 하였느니라.\" 하시더라.","dep242-3-1-10":"모세와 모든 선지자들로부터 시작하여 자신에 관하여 모든 성경에 있는 것들을 그들에게 설명하시더라.","dep242-3-2-1":"너희가 거듭난 것은 썩어질 씨로 된 것이 아니라 썩지 아니할 씨로 된 것이니 살아 있고 영원히 거하는 하나님의 말씀으로 되었느니라.","dep242-3-2-2":"그 분 자신의 뜻으로 우리를 진리의 말씀으로 낳으셔서 우리로 그의 피조물들 가운데 첫 열매들에 속한 자들이 되게 하셨으니","dep242-3-2-3":"갓난 아기들로서 순수한 말씀의 젖을 사모하라. 이는 너희가 그것으로 인하여 자라게 하려 함이니라.","dep242-3-2-4":"이제 형제들아, 내가 너희를 하나님과 그 분의 은혜의 말씀에 의탁하노니, 그 말씀이 능히 너희를 굳게 세워 줄 것이며, 또 거룩하게 된 모든 사람 가운데서 너희에게 유업을 줄 것이라.","dep242-3-2-5":"주의 말씀은 내 발에 등불이요, 내 길에 빛이니이다.","dep242-3-2-6":"그것이 네가 다닐 때에 너를 인도하며, 네가 잠들 때에 너를 지켜 주고, 네가 깰 때에 너와 더불어 말하리니 이는 계명은 등불이 되고 법은 빛이 되며 훈계의 책망은 생명의 길이 되어","dep242-3-2-7":"그가 그의 말씀을 보내시어 그들을 고치셨으며 그들의 파멸에서 그들을 구하셨도다.","dep242-3-2-8":"그 백부장이 대답하여 말씀드리기를 \"주여, 주께서 내 지붕 아래로 오시는 것을 내가 감당할 수 없사오니 오직 말씀만 하옵소서. 그러면 내 종이 나을 것이옵니다.","dep242-3-2-9":"주의 말씀들이 발견되었기에 내가 그 말씀들을 먹었더니, 주의 말씀이 내게는 내 마음의 기쁨과 즐거움이 되었나이다. 오 만군의 주 하나님이여, 이는 내가 주의 이름으로 일컬음을 받는 자임이니이다.","dep242-3-2-10":"내가 주의 증거들을 영원히 한 유산으로 삼았으니, 이는 그것들이 내 마음에 기쁨이 됨이니이다.","dep242-3-2-11":"또한 구원의 투구와 성령의 칼, 곧 하나님의 말씀을 가지고","dep242-3-2-12":"하나님의 말씀은 살아 있고 활력이 있어 양 날이 있는 어떤 칼보다도 예리하여 혼과 영, 그리고 관절과 골수를 찔러 가르고 마음의 생각들과 의도들을 판별하느니라.","dep242-3-3-1":"베뢰아 사람들은 데살로니가 사람들보다 더 고상하여서 전심으로 말씀을 받아들이고, 이 말씀이 그런가 하여 매일 성경을 상고하므로","dep242-3-3-2":"오, 내가 얼마나 주의 법을 사랑하는지요! 그것이 온종일 나의 묵상이 되나이다.","dep242-3-3-3":"에스라가 주의 율법을 찾고, 그것을 행하고, 규례들과 명령들을 이스라엘에게 가르칠 것을 마음으로 준비하였더라.","dep242-3-3-4":"내가 그의 입술의 명령에서 돌아서지 아니하였고, 내가 그의 입의 말씀을 내게 필요한 음식보다 더 귀히 여겼도다.","dep242-3-3-5":"시몬이 대답하여 주께 말씀드리기를 \"선생님, 우리가 밤새도록 애써 일하였으나 아무것도 잡지 못하였나이다. 그러나 선생님의 말씀에 따라 내가 그물을 내리겠나이다.\"라고 한 후 그렇게 하였더니 굉장히 많은 고기가 잡힌지라. 그들의 그물이 찢어지더라.","dep242-3-4-1":"그러므로 믿음은 들음에서 나오며 들음은 하나님의 말씀에 의해서니라.","dep242-3-4-2":"주께서 말씀하시기를 \"정녕 하나님의 말씀을 듣고 그것을 지키는 사람들이 오히려 복이 있느니라.\"고 하시더라.","dep242-3-4-3":"이 예언의 말씀을 읽는 자와 듣는 자들과 거기에 기록된 것들을 지키는 자들은 복이 있나니 이는 그 때가 가까움이니라.","dep242-3-4-4":"자기와 함께 두고 평생 동안 그것을 읽어서, 그로 주 그의 하나님을 두려워함을 배우게 하고 이 율법의 모든 말과 이러한 규례들을 지켜 그것들을 행하게 할지니라.","dep242-3-4-5":"베뢰아 사람들은 데살로니가 사람들보다 더 고상하여서 전심으로 말씀을 받아들이고, 이 말씀이 그런가 하여 매일 성경을 상고하므로","dep242-3-4-6":"네가 진리의 말씀을 올바로 나누어 자신이 하나님 앞에 부끄럽지 않은 일꾼으로 인정받도록 공부하라.","dep242-3-4-7":"내가 오늘 네게 명령한 이 말씀들을 네 마음 속에 두고","dep242-3-4-8":"내 아들아, 내 말을 지키고 내 계명들을 간직하라. 그것들을 네 손가락에 묶으며 네 마음판에 새기라.","dep242-3-4-9":"악인들의 간계를 따르지 아니하며 죄인들의 길에 서지 아니하며 조롱하는 자들의 자리에 앉지 아니하는 사람은 복이 있도다. 그의 즐거움이 주의 법에 있으니, 그가 주의 법을 주야로 묵상하는도다.","dep242-3-4-10":"이 율법책을 네 입에서 떠나지 않게 하고 주야로 그 안에 있는 것을 묵상하여 그 안에 기록된 모든 것대로 지켜 행하라. 그리하면 네가 너의 길을 번성하게 만들 것이고 네가 좋은 성공을 이루리라.","dep242-4-1-1":"쉬지 말고 기도하라.","dep242-4-1-2":"꾸준히 기도하고 감사함으로 기도에 깨어 있으라.","dep242-4-1-3":"만물의 마지막이 가까웠으니 그러므로 너희는 정신을 차리고 깨어 기도하라.","dep242-4-1-4":"그러므로 내가 무엇보다도 먼저 권하노니, 모든 사람을 위하여 간구와 기도와 중보와 감사를 하되 왕들과 권세 있는 모든 사람을 위하여 하라. 이는 우리가 모든 경건과 청렴함 가운데 평온하고 조용한 생활을 하려 함이라.","dep242-4-2-1":"또 너희가 내 이름으로 무엇이든지 구하면 내가 그것을 행하리니, 이는 아버지로 아들 안에서 영광을 받으시게 하려는 것이라. 너희가 무엇이나 내 이름으로 구하면 내가 행하리라.","dep242-4-2-2":"우리 안에서 역사하시는 능력을 따라 우리가 구하는 것이나 생각하는 모든 것보다 훨씬 풍성하게 행하실 수 있는 그 분께","dep242-4-2-3":"나를 부르라. 그리하면 내가 네게 응답하겠고 네가 알지 못하는 크고 능력있는 일들을 네게 보이리라.","dep242-4-2-4":"너희 중에 누가 지혜가 부족하면, 모든 사람에게 아낌없이 주시고 꾸짖지 아니하시는 하나님께 구하라. 그러면 그 분께서 주실 것이라.","dep242-4-2-5":"내가 주를 찾았더니 그가 나를 들으시고 내 모든 두려움에서 나를 건지셨도다.","dep242-4-2-6":"고난의 날에 나를 부르라. 내가 너를 구해 낼 것이요, 너는 나를 영화롭게 하리라.","dep242-4-2-7":"그들이 기도를 마치자 그들이 함께 모여 있는 곳이 진동하더니 그들이 모두 성령으로 충만하여 담대하게 하나님의 말씀을 선포하더라.","dep242-4-2-8":"또한 하나님께서 우리에게 말문을 열어 주사 그리스도의 신비를 말하게 하여 주시도록 기도하라. 이로 인하여 내가 매인 바 되었나니","dep242-4-3-1":"지금까지는 너희가 내 이름으로 아무것도 구하지 아니하였으나 구하라. 그러면 받을 것이니 너희 기쁨이 충만케 하려 함이라.","dep242-4-3-2":"또 기도할 때에 무엇이든지 너희가 믿고 구하는 것은 다 받으리라.\"고 하시더라.","dep242-4-3-3":"모든 기도와 간구로 항상 성령 안에서 기도하고 이를 위하여 모든 성도들을 위해 모든 인내와 간구로 깨어 있으라.","dep242-4-3-4":"우리가 그의 안에서 가지는 담대함이 이것이니, 그의 뜻대로 무엇이든지 구하면 그가 우리를 들으시는 것이라. 우리가 구하는 것은 무엇이나 그가 들으시는 줄을 안다면, 우리가 그에게 구한 요청들을 받은 줄도 아느니라.","dep242-4-3-5":"내가 내 마음에 죄악을 생각하면 주께서 듣지 아니하시리라.","dep242-4-3-6":"무엇이든지 구하는 것을 그에게서 받나니, 이는 우리가 그의 계명들을 지키고 그의 목전에 기쁨이 되는 일들을 행함이라.","dep242-4-3-7":"다시 내가 너희에게 말하노니, 만일 너희 중에 두 사람이 무엇이든지 구할 것을 땅에서 합심하면 하늘에 계신 내 아버지께서 그들에게 이루어 주실 것이라.","dep242-4-3-8":"구하라 그러면 너희에게 주실 것이요, 찾으라 그러면 너희가 찾을 것이요, 두드리라 그러면 너희에게 열릴 것이라.","dep242-4-3-9":"그때 너희가 나를 부르고 너희가 가서 내게 기도하면 내가 너희에게 경청하리라. 너희가 너희의 온 마음으로 나를 찾으려 하면 너희는 나를 찾게 되고 나를 만나리라.","dep242-4-3-10":"만일 너희가 내게로 돌이켜 내 계명들을 지키고 그것들을 행하면, 너희 가운데 하늘의 맨 끝까지 쫓겨난 자가 있다 할지라도 내가 그들을 거기서 불러 모아 내가 내 이름을 두려고 택한 장소로 그들을 데려오리라.' 하신 그 말씀을 기억하소서.","dep242-4-4-1":"이제 다니엘이 그 문서가 서명된 것을 알았을 때 그의 집으로 가서 그의 방에서 예루살렘을 향해 창문을 열어 두고, 그가 전에 하던 대로 하루에 세 번씩 무릎을 끓고 기도하였으며 그의 하나님 앞에 감사를 드렸더라.","dep242-4-4-2":"그러나 주에 관한 명성이 더 멀리 퍼지니, 큰 무리가 말씀을 들으려고 함께 와서 자기들의 병약함을 치유받더라. 그 후 주께서는 광야로 물러가서 기도하시더라.","dep242-4-4-3":"그 무렵 주께서 기도하러 산에 올라가셨는데 하나님께 기도하시면서 온 밤을 새우시더라.","dep242-4-4-4":"엘리야는 우리와 같은 성정에 속한 사람이지만 비가 오지 않기를 간절히 기도하였더니 삼 년 육 개월이나 땅에 비가 오지 않았고 다시 기도하였더니 하늘이 비를 내려 땅이 열매를 내었느니라.","dep242-4-4-5":"한밤중에 바울과 실라가 기도하고 하나님께 찬송을 부르니 죄수들이 듣더라.","dep242-4-5-1":"오 주여, 위대하심과 권세와 영광과 승리와 위엄이 주의 것이니이다. 이는 하늘과 땅에 있는 모든 것이 주의 것이며, 오 주여, 왕국이 주의 것이며, 주는 만유 위의 머리로서 높임을 받으심이니이다. 우리 하나님이여, 그러므로 이제, 우리가 주께 감사드리고 주의 영광스러운 이름을 찬양하나이다.","dep242-4-5-2":"그러므로 내가 무엇보다도 먼저 권하노니, 모든 사람을 위하여 간구와 기도와 중보와 감사를 하되 왕들과 권세 있는 모든 사람을 위하여 하라. 이는 우리가 모든 경건과 청렴함 가운데 평온하고 조용한 생활을 하려 함이라.","dep242-4-5-3":"모든 일에 감사하라. 이것은 그리스도 예수 안에서 너희에 관한 하나님의 뜻이니라.","dep242-4-5-4":"우리가 우리 죄들을 자백하면 그는 신실하시고 의로우셔서 우리 죄들을 용서하시며, 모든 불의에서 우리를 깨끗하게 하시느니라.","dep242-4-5-5":"아무것도 염려하지 말고 다만 모든 일에 기도와 간구로 너희의 구하는 것들을 감사함으로 하나님께 알려지게 하라. 그리하면 모든 지각을 초월하시는 하나님의 평강이 그리스도 예수 안에서 너희의 마음과 생각을 지키시리라.","dep242-5-1-1":"그러나 한 때 멀리 있었던 너희가 이제 그리스도 예수 안에서 그리스도의 피로 가까워졌느니라.","dep242-5-1-2":"그의 십자가의 보혈을 통하여 화평을 이루고 땅에 있는 것이나 하늘에 있는 것이나 그에 의하여 모든 것이 자신과 화해하는 것이라.","dep242-5-1-3":"우리가 보고 들은 것을 너희에게 전함은 너희도 우리와 교제를 갖게 하려는 것이니, 참으로 우리의 교제는 아버지와 그의 아들 예수 그리스도와 함께하는 것이라.","dep242-5-1-4":"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교제가 너희 모두와 함께 있을지어다. 아멘.","dep242-5-2-1":"두 세 사람이 내 이름으로 함께 모이는 곳에는 나도 그들 가운데 있느니라.\" 하시더라.","dep242-5-2-2":"보라, 형제들이 하나되어 함께 거하는 것이 얼마나 좋고 얼마나 기쁜가! 헤르몬의 이슬이 시온의 산들 위에 내림 같도다. 거기에서 주께서 복을 명하셨으니, 곧 영생이로다.","dep242-5-2-3":"오직 오늘이라고 부르는 동안 매일 서로 권면하여 너희 중 아무도 죄의 속임수에 빠져 완악하게 되는 일이 없도록 하라.","dep242-5-2-4":"둘이 하나보다 더 나으니, 이는 그들이 그들의 수고에 대한 좋은 상을 가짐이라. 이는 그들이 넘어지면 하나가 그의 동료를 일으켜 세울 것임이라. 그러나 혼자 있는 자가 넘어지면 그에게 화로다. 이는 그를 도와 일으켜 줄 다른 사람이 없음이라.","dep242-5-2-5":"네가 젊음의 정욕을 피하고 오직 순수한 마음으로 주를 부르는 사람들과 함께 의와 믿음과 사랑과 화평을 추구하라.","dep242-5-2-6":"철이 철을 날카롭게 하듯이 사람이 자기 친구의 얼굴을 빛나게 하느니라. 물에서 얼굴과 얼굴이 서로 비치듯이 사람의 마음도 사람에게 그러하니라.","dep242-5-2-7":"현명한 사람과 동행하는 자는 지혜롭게 될 것이나, 어리석은 자들의 친구는 멸망하리라.","dep242-5-2-8":"우리 모두가 믿음의 하나됨과 하나님의 아들을 아는 지식의 하나됨에 도달하게 하고, 온전한 사람이 되어 그리스도의 충만하심의 장성한 분량에까지 이르게 하려 하심이라.","dep242-5-2-9":"그들이 사도들이 가르친 교리와 교제, 빵을 떼는 것과 기도하는 데 전념하더라. 하나님을 찬양하고, 또 모든 사람에게 칭찬을 받더라. 주께서 구원받는 사람들을 그 교회에 날마다 더해 주시더라.","dep242-5-3-1":"첫날부터 지금까지 너희가 복음에 동참함이라. 오직 너희의 행위가 그리스도의 복음에 합당하게 되라. 이는 내가 가서 보든지 멀리 떨어져 있든지 너희가 한 영 안에 굳게 서서 한 마음으로 복음의 믿음을 위하여 함께 싸우고 있다는 소식을 듣고자 함이라.","dep242-5-3-2":"또 서로 생각하여 사랑과 선행을 격려하며 어떤 사람들의 습관처럼 우리 자신들이 함께 모이는 것을 저버리지 말고 서로 권면하여 그 날이 가까워 오는 것을 볼수록 더욱 그리하자.","dep242-5-3-3":"내가 증거하노니 그들은 자기들의 능력에 따라 하였고, 또 능력 이상으로 자원하여 하였으며 우리가 은혜를 받을 것과 성도들을 섬기는 일에 동참할 것을 많은 서원으로 간청하였노라.","dep242-5-3-4":"도리어 너희가 그리스도의 고난에 참여하는 자들이 되는 것이니 즐거워하라. 이는 그의 영광이 나타나실 때에 너희도 큰 기쁨으로 즐거워하게 하려 함이니라.","dep242-5-3-5":"너희는 서로의 짐을 지라. 그리하여 그리스도의 법을 이루라.","dep242-5-4-1":"그러므로 그리스도 안에 어떤 격려나 사랑의 위로나 성령의 교제나 인정이나 자비가 있다면 같은 생각이 되어 같은 사랑을 가지고 하나 되고 한 생각이 되어 너희는 나의 기쁨을 이루라.","dep242-5-4-2":"어떤 일도 다툼이나 허영을 따라서 하지 말고 오직 생각의 겸손함으로 남을 자신들 보다 존중하고 각자 자기 일만 돌보지 말고 남의 일도 돌아보라.","dep242-5-4-3":"너희는 우리 안에서 좁아진 것이 아니요 너희의 애정 안에서 좁아진 것이니라. 너희는 우리 안에서 좁아진 것이 아니요 너희의 애정 안에서 좁아진 것이니라.","dep242-5-4-4":"하나님을 두려워함으로 서로 복종하라.","dep242-5-4-5":"그들은 잠잠하더라. 이는 그들이 도중에 누가 가장 큰 사람인가로 서로 다투었음이라. 주께서 앉으신 후 열둘을 불러 그들에게 말씀하시기를 \"만일 누구든지 첫째가 되고자 하면 모든 사람의 끝이 되고 모든 사람의 종이 되리라.\"고 하시니라.","dep242-5-4-6":"하나님의 은혜에 미치지 못하는 자가 없도록 열심히 돌아보고 또 쓴 뿌리가 나와서 너희를 괴롭게 하거나 혹 그것 때문에 많은 사람이 더럽혀지지 않도록 하라.","dep242-5-4-7":"열매 없는 어두움의 일들에 관여하지 말고 오히려 그것들을 책망하라.","dep242-5-4-8":"군사로 복무하는 자는 아무도 자신의 생활에 얽매이지 아니하나니, 이는 자기를 군사로 뽑은 자를 기쁘게 하려 함이라.","dep242-5-5-9":"그러므로 만일 네가 예물을 제단에 드리다가 네 형제가 네게 반감을 갖고 있다는 것이 생각나거든 네 예물을 제단 앞에 놓아 두고 가서 네 형제와 먼저 화해하고 와서 예물을 드리라.","dep242-5-5-1":"또 네 형제가 네게 죄를 짓거든 가서 너와 그 사람만 있을 때 그에게 그의 잘못을 일러주라. 만일 그가 네 말을 들으면 너는 네 형제를 얻은 것이라.","dep242-5-5-2":"우리가 우리 죄들을 자백하면 그는 신실하시고 의로우셔서 우리 죄들을 용서하시며, 모든 불의에서 우리를 깨끗하게 하시느니라.","dep242-5-5-3":"자기 죄들을 숨기는 자는 번성하지 못할 것이나, 죄를 자백하고 버리는 자는 누구나 자비를 얻으리라.","dep242-6-1-1":"그러나 성령께서 너희에게 임하시면 너희가 능력을 받으리니, 그러면 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내게 증인이 되리라.\"고 하시니라.","dep242-6-1-2":"모든 것이 하나님께로부터 났으며 그 분께서는 예수 그리스도를 통하여 스스로 우리와 화해하셨고 화해의 직분을 우리에게 주셨으니 즉 하나님께서 그리스도 안에 계셔서 세상을 자신과 화해하게 하시며 그들의 죄과를 그들에게 돌리지 아니하시고 우리에게 화해의 말씀을 맡겨 주신 것이라.","dep242-6-2-1":"그러므로 내가 하나님과 주 예수 그리스도, 곧 그가 나타나실 때와 그의 왕국에서 산 자들과 죽은 자들을 심판하실 분 앞에서 네게 명하노니 너는 말씀은 전파하라. 때를 얻든지 못 얻든지 항상 대비하라. 모든 오래 참음과 교리로 견책하고 책망하며 권고하라.","dep242-6-2-2":"인자가 온 것은 잃어 버린 자를 찾고 또 구원하려는 것이라.\"고 하시더라.","dep242-6-2-3":"오직 하나님의 승인을 받아 복음을 위탁받은 대로 전하노니 이는 사람들을 기쁘게 하려 함이 아니며 우리의 마음을 시험하시는 하나님만을 기쁘시게 하려 함이니라.","dep242-6-2-4":"내가 복음을 전할지라도 내게 자랑할 것이 없으니, 이는 내가 부득불 해야 할 일이기 때문이라. 만일 내가 복음을 전하지 아니하면 내게 화가 있으리라.","dep242-6-2-5":"그런즉 그들이 믿지 아니한 이를 어찌 부르리요? 듣지도 못한 이를 어찌 믿으리요? 전파하는 자가 없이 어찌 들으리요?","dep242-6-2-6":"하나님께서는 모든 사람이 구원을 받고 진리의 지식에 이르기를 원하시느니라.","dep242-6-2-7":"그러자 주께서 말씀하시기를 \"네가 수고도 아니하였고 기르지도 아니하였으면서도, 하룻밤에 나와서 하룻밤에 없어진 그 박 넝쿨을 긍휼히 여겼거늘 자기들의 오른쪽과 왼쪽도 분별할 줄 모르는 십이만 이상 되는 사람들과 많은 가축들이 있는 저 큰 성읍 니느웨를 내가 아끼는 것이 부당하냐?\" 하시니라.","dep242-6-2-8":"내가 너희에게 말하노니, 이와 같이 하늘에서는 회개할 필요가 없는 아흔 아홉 명의 의인들보다 회개하는 한 사람의 죄인을 더 기뻐하리라.","dep242-6-2-9":"우리가 보고 들은 것을 너희에게 전함은 너희도 우리와 교제를 갖게 하려는 것이니, 참으로 우리의 교제는 아버지와 그의 아들 예수 그리스도와 함께하는 것이라.","dep242-6-2-10":"현명한 자들은 창공의 밝음처럼 빛날 것이요, 많은 사람을 의로 돌이키는 자들은 별들처럼 영원 무궁토록 빛나리라.","dep242-6-3-1":"그들에게 말씀하시기를 \"나를 따라오라. 내가 너희로 사람들을 낚는 어부가 되게 하리라.\"고 하시니","dep242-6-3-2":"이는 너희 하나님의 아들들이 흠 없고 순전하여, 비뚤어지고 변질된 민족 가운데서 책망받지 않게 하려 함이니 너희는 세상에서 빛들을 비추는 자들이라. 생명의 말씀을 제시하여 내가 헛되이 달리지도 아니하였고 헛되이 수고하지도 아니하였다는 것을 그리스도의 날에 내가 자랑하려 함이라.","dep242-6-3-3":"그리고 나를 위하여서는 내게 말씀을 주시어 내 입을 열어 담대하게 복음의 신비를 알리게 하도록 기도하라.","dep242-6-3-4":"그러나 너희 마음 속에서 주 하나님을 거룩하게 여기며 너희 안에 있는 소망에 관한 이유를 묻는 모든 사람에게 답변할 것을 온유와 두려움으로 항상 예비하고","dep242-6-3-5":"그 성읍의 많은 사마리아인들이 그 여인의 말로 인하여 주를 믿었으니 그녀가 증거하기를 \"그 분은 내가 행한 모든 것을 내게 말씀하셨다.\"고 함이더라.","dep242-6-3-6":"하나님의 말씀은 살아 있고 활력이 있어 양 날이 있는 어떤 칼보다도 예리하여 혼과 영, 그리고 관절과 골수를 찔러 가르고 마음의 생각들과 의도들을 판별하느니라.","dep242-6-3-7":"내 입에서 나가는 내 말도 그러하나니, 그것은 내게 헛되이 돌아오지 아니하고 내가 기뻐하는 것을 이루며 내가 보낸 곳에서 번성할 것이니라.","dep242-6-3-8":"우리는 십자가에 처형되신 그리스도를 전파하노니, 이것이 유대인들에게는 거치는 것이 되고 헬라인들에게는 어리석은 것이 되지만 부르심을 받은 사람들에게는, 유대인들에게나 헬라인들에게나, 그리스도는 하나님의 능력이요 또 하나님의 지혜니라.","dep242-6-3-9":"이는 우리의 복음이 말로만 너희에게 이른 것이 아니라 능력과 성령과 대단한 확신으로 된 것이니 우리가 너희 가운데서 너희를 위하여 어떻게 했다는 것을 너희도 아는 바라.","dep242-6-3-10":"네가 네 입으로 주 예수를 시인하고 또 하나님께서 그를 죽은 자들로부터 살리신 것을 네 마음에 믿으면 구원을 받으리라. 이는 사람이 마음으로 믿어 의에 이르고 입으로 고백하여 구원에 이르기 때문이라.","dep242-6-3-11":"(말씀하시기를 \"내가 기뻐 받아들여진 때에 네 말을 들었고 구원의 날에 너를 도왔도다. 보라, 지금이 기뻐 받아들여진 때요, 보라, 지금이 구원의 날이라.\" 하니라.)","dep242-6-3-12":"너희가 믿음 안에 있는지 너희 자신을 시험하고 스스로 입증하라. 예수 그리스도께서 너희 안에 계신 것을 스스로 알지 못하느냐? 그렇지 못하면 너희는 버림받은 자들이라.","dep242-6-3-13":"바울은 습관대로 그들에게 가서 세 안식일에 걸쳐 성경을 가지고 그들과 변론하며 그리스도께서 고난을 당하셔야 했던 것과 죽은 자들로부터 다시 살아나셔야 했음을 설명하고 입증하면서, \"내가 여러분에게 전하는 이 예수가 바로 그리스도라\"고 하자","dep242-6-4-1":"그러나 나의 달려갈 길을 기쁨으로 끝마치고, 내가 주 예수로부터 받은 사역, 곧 하나님의 은혜의 복음을 온전히 증거하기 위해서라면 이런 일을 전혀 개의치 아니할 뿐 아니라 나의 생명을 조금도 아끼지 아니하리라.","dep242-6-4-2":"그때 성령께서 빌립에게 말씀하시기를 \"가까이 가서 이 마차에 함께 타라.\" 하시더라. 그러므로 빌립이 거기로 달려가니 그가 선지자 이사야의 글을 읽고 있는지라. 말하기를 \"당신이 읽고 있는 것을 이해하느뇨?\" 하니","dep242-6-4-3":"우리는 보고 들은 일들을 말하지 아니할 수 없노라.\"고 하더라.","dep242-6-5-1":"그리하여 하나님께서 자신의 형상대로 사람을 창조하시니, 곧 하나님의 형상대로 그를 창조하셨으며, 그들을 남자와 여자로 창조하시니라.","dep242-6-5-2":"보라, 주의 손이 짧아서 구원하지 못하심도 아니요, 그의 귀가 둔하여 듣지 못하심도 아니라. 오직 너희 죄악들이 너희와 너희 하나님 사이를 나누었고 너희 죄들이 그의 얼굴을 너희로부터 가렸기에 그가 듣지 아니하심이라.","dep242-6-5-3":"이런 연유로 한 사람에 의하여 죄가 세상으로 들어오고 그 죄에 의하여 사망이 왔으니, 그리하여 모든 사람이 죄를 지었으므로 사망이 모든 사람에게 전달되었느니라.","dep242-6-5-4":"이는 모든 사람이 죄를 지었으므로 하나님의 영광에 이르지 못하다가","dep242-6-5-5":"한 번 죽는 것은 사람들에게 정해진 것이고 그 뒤에는 심판이 있는 것같이","dep242-6-5-6":"하나님을 알지 못하는 자들과 우리 주 예수 그리스도의 복음에 순종치 아니하는 자들에게 불길 가운데서 벌 주시리니 이런 자들은 주의 임재와 그의 능력의 영광으로부터 떠나 영원한 멸망의 형벌을 받게 될 것이라.","dep242-6-5-7":"이는 죄의 삯은 사망이요, 하나님의 선물은 예수 그리스도 우리 주로 말미암은 영원한 생명이기 때문이라.","dep242-6-5-8":"그러나 두려워하는 자들과 믿지 아니하는 자들과 가증스런 자들과 살인자들과 음행하는 자들과 마술하는 자들과 우상 숭배하는 자들과 모든 거짓말하는 자들은 불과 유황이 타는 못에 참여하리니 이것이 둘째 사망이라.\"고 하시더라.","dep242-6-5-9":"너희가 믿음으로 말미암아 은혜로 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라. 행위에서 난 것이 아니니 아무도 자랑하지 못하게 하려 하심이라.","dep242-6-5-10":"나는 하나님의 은혜를 저버릴 수 없나니, 만일 의가 율법으로 인하여 온 것이라면 그리스도께서는 헛되이 죽으신 것이라.","dep242-6-5-11":"그러므로 다른 이에게는 구원이 없나니, 이는 하늘 아래서 우리가 구원을 받을 수 있는 다른 이름을 인간에게 주신 적이 없음이라.\"고 하더라.","dep242-6-5-12":"이는 너희가 아는 바와 같이, 너희가 너희 조상들로부터 전통으로 이어받은 너희의 허망한 행실에서 은이나 금같은 썩어질 것들로 구속된 것이 아니라","dep242-6-5-13":"유대인들은 표적을 구하고, 헬라인들은 지혜를 찾지만 우리는 십자가에 처형되신 그리스도를 전파하노니, 이것이 유대인들에게는 거치는 것이 되고 헬라인들에게는 어리석은 것이 되지만","dep242-6-5-14":"하나님의 지혜에 있어서는, 세상이 그 지혜로 하나님을 알지 못하였기에 하나님께서 전도의 어리석음으로 믿는 자들을 구원하시기를 기뻐하셨느니라.","dep242-6-5-15":"아무도 너희를 철학과 헛된 속임수로 노략질하지 못하도록 주의하라. 그것들은 사람의 전통과 세상의 유치한 원리를 따른 것이며, 그리스도를 따른 것이 아니니라.","dep242-6-5-16":"그들은 혈로나 육신의 뜻으로나 또한 사람의 뜻으로 나지 아니하였고 하나님에게서 난 사람들이라.","dep242-6-5-17":"육신으로 난 것은 육이요, 또 성령으로 난 것은 영이니라. 내가 너에게 '너희는 거듭나야만 한다.'고 말한 것을 이상히 여기지 말라.","dep242-6-5-18":"살리는 것은 영이니, 육은 전혀 무익하니라. 내가 너희에게 한 말들은 영이요, 생명이라.","dep242-6-5-19":"그리스도께서도 죄들로 인하여 한 번 고난을 받으사 의인으로서 불의한 자를 대신하셨으니, 이는 육신으로는 죽임을 당하셨으나 성령에 의하여 살림을 받으심으로 우리를 하나님께로 인도하려 하심이라.","dep242-6-5-20":"하나님께서 세상을 이처럼 사랑하셔서 그의 독생자를 주셨으니, 이는 그를 믿는 사람은 누구든지 멸망하지 않고 영생을 얻게 하려 하심이라.","dep242-6-5-21":"우리가 아직 죄인이었을 때 그리스도께서 우리를 위하여 죽으심으로써 하나님께서는 우리를 향한 그의 사랑을 나타내셨느니라.","dep242-6-5-22":"내가 받은 것을 먼저 너희에게 전달하였나니, 이는 성경대로 그리스도께서 우리의 죄들로 인하여 죽으시고 장사되셨다가 성경대로 셋째 날에 다시 살아나셔서","dep242-6-5-23":"너희의 죄들과 육체의 무할례로 죽었던 너희를 하나님께서 그와 함께 살리셔서 우리의 모든 허물을 용서하셨으니","dep242-6-5-24":"진실로 진실로 내가 너희에게 말하노니, 내 말을 듣고, 또 나를 보내신 분을 믿는 자는 영생을 얻고, 정죄에 이르지 아니할 것이며, 사망에서 생명으로 옮겨졌느니라.","dep242-6-5-25":"그러나 누구든지 그를 영접한 사람들에게는 하나님의 아들들이 되는 권세를 주셨으니, 즉 그의 이름을 믿는 사람들에게니라.","dep242-6-5-26":"보라, 내가 문 앞에 서서 두드리노라. 누구든지 내 음성을 듣고 그 문을 열면 내가 그에게로 들어가서 그와 함께 먹으며 그도 나와 함께 먹으리라.","dep242-6-5-27":"네가 네 입으로 주 예수를 시인하고 또 하나님께서 그를 죽은 자들로부터 살리신 것을 네 마음에 믿으면 구원을 받으리라. 이는 사람이 마음으로 믿어 의에 이르고 입으로 고백하여 구원에 이르기 때문이라.","dep242-7-1-1":"그 말씀이 태초에 하나님과 함께 계셨느니라. 만물은 그에 의하여 지은 바 되었으며, 이미 지음받은 것 가운데 그가 없이 지어진 것은 아무것도 없더라.","dep242-7-1-2":"이는 만물이 그에 의하여 창조되되 하늘에 있는 것들과 땅에 있는 것들과 보이는 것들과 보이지 않는 것들과 보좌들이나 주권들이나 정사들이나 권세들이나 만물이 그에 의하여 또 그를 위하여 창조되었기 때문이라. 그는 만물 이전에 계시고 또 만물은 그로 말미암아 존속하느니라.","dep242-7-1-3":"그는 몸인 교회의 머리시라. 그는 시작이시며, 죽은 자들로부터 첫 번째로 나셨으니 이는 그가 만물 안에서 으뜸이 되려 하심이라.","dep242-7-1-4":"모든 정사와 권세와 능력과 다스림과 이 세상뿐만 아니라 오는 세상에서도 이름 지어진 모든 이름 위에 뛰어나게 하셨으며","dep242-7-1-5":"하늘에 있는 것이나 땅 위에 있는 것이나 땅 아래 있는 것이나 모든 무릎을 예수의 이름에 꿇게 하시고 모든 혀가 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라.","dep242-7-1-6":"이를 위하여 그리스도께서 죽으시고 일어나사 다시 사셨으니, 이는 죽은 자들과 산 자들의 주가 되려 하심이라.","dep242-7-1-7":"또한, 너희 몸은 너희가 하나님으로부터 받은 바 너희 안에 계신 성령의 전인 것을 알지 못하느냐? 너희는 너희 자신의 것이 아니니라. 너희는 값을 치르고 산 것이니 그러므로 하나님의 것인 너희 몸과 너희 영으로 하나님께 영광을 돌리라.","dep242-7-1-8":"그가 모든 사람을 위하여 죽으신 것은 산 자들이 이제부터는 더이상 자신들을 위하여 살지 않고 자기들을 위하여 죽었다가 다시 살아나신 그 분을 위하여 살게 하려는 것이라.","dep242-7-2-1":"오직 너희는 먼저 하나님의 나라와 그 분의 의를 구하라. 그리하면 이 모든 것을 너희에게 더해 주시리라.","dep242-7-2-2":"예수께서 대답하여 말씀하시기를 \"진실로 내가 너희에게 말하노니, 누구든지 나와 복음을 위하여 집이나, 형제나, 자매나, 아버지나, 어머니나, 아내나, 자식이나, 토지를 버린 사람은 현세에서는 집이나, 형제나, 자매나, 어머니나, 자식이나, 토지를 일백 배로 받되 박해와 더불어 받겠으며, 또 오는 세상에서는 영생을 얻으리라.","dep242-7-2-3":"말하기를 \"주가 말하노라. 내가 스스로 맹세하노라. 이는 네가 이같이 행하여 네 아들 곧 네 독자를 아끼지 아니하였기에 복으로 내가 네게 복을 주고, 번성으로 내가 너의 씨를 하늘의 별들처럼, 또 바닷가의 모래처럼 번성케 하리니 네 씨가 그의 원수들의 문을 차지하리라.","dep242-7-2-4":"너, 내 아들 솔로몬아, 너는 네 아버지의 하나님을 알라. 그리고 온전한 마음과 기쁜 뜻으로 그 분을 섬기라. 주께서는 모든 마음을 살피시고 생각의 모든 상상을 아시나니, 만일 네가 그 분을 찾으면 그가 너를 만나실 것이나, 만일 네가 그 분을 버리면 그가 너를 영원히 버리시리라.","dep242-7-2-5":"이는 주의 눈은 온 땅을 두루 살피시어 자신을 향하여 마음이 온전한 자들을 위하여 자신이 강함을 보이심이니이다. 왕이 이 일을 어리석게 행하셨나이다 그러므로 이제부터 왕에게 전쟁들이 있으리이다.\" 하더라.","dep242-7-2-6":"그가 나를 사랑하였으므로 내가 그를 구해 낼 것이며, 그가 나의 이름을 알았으므로 내가 그를 높이리라.","dep242-7-2-7":"그러므로 이스라엘의 주 하나님이 말하노라. 내가 참으로 네 집과 네 조상의 집이 내 앞에서 영원히 행하리라고 말하였으나, 이제 주가 말하노니, 결코 그렇게 하지 아니하리라. 나를 존중하는 자들을 내가 존중하고 나를 멸시하는 자들을 내가 소홀히 여기리라.","dep242-7-3-1":"또 그들 모두에게 말씀하시기를 \"누구라도 나를 따라 오려거든 자기를 부인하고 날마다 자기 십자가를 지고 나를 따르라.","dep242-7-3-2":"사람의 행위가 주를 기쁘시게 하면 주께서 그 사람의 원수들까지도 그와 화목하게 하시느니라.","dep242-7-3-3":"네 마음을 다하여 주를 신뢰하고, 네 자신의 명철을 의지하지 말라. 모든 길에서 그를 인정하라. 그리하면 그가 네 길들을 지도하시리라.","dep242-7-3-4":"이전 행실에 관해서는 기만의 욕망에 따라 썩어진 옛 사람을 벗어 버리고 하나님을 따라 의와 참된 거룩함 안에서 창조된 새 사람을 입으라.","dep242-7-3-5":"네가 젊음의 정욕을 피하고 오직 순수한 마음으로 주를 부르는 사람들과 함께 의와 믿음과 사랑과 화평을 추구하라.","dep242-7-3-6":"우리가 세상에 아무것도 가지고 온 것이 없으며 아무것도 가지고 갈 수 없는 것이 분명하니 그러나 부유하게 되고자 하는 자들은 유혹과 올무와 여러 가지 어리석고 해로운 정욕에 빠지리니, 이는 사람들로 파멸과 멸망에 빠지게 하는 것이라.","dep242-7-3-7":"그러므로 너희가 얼마나 정확히 행하고 있는지 주의하라. 미련한 사람같이 행하지 말고 현명한 사람같이 행하여 시간을 사서 얻으라. 이는 그 날들이 악하기 때문이니라.","dep242-7-3-8":"주께서 곧 그들을 부르시자 그들은 자기들의 아버지 세베대를 일꾼들과 함께 배에 남겨둔 채 주를 따라가더라.","dep242-7-4-1":"나의 간절한 기도와 소망에 따라 내가 어떤 일에도 부끄러움을 당하지 아니하고 항상 그러하듯이 지금도 온전히 담대하여 살든지 죽든지 그리스도가 내 몸 안에서 늘 높임을 받으시게 하려는 것이라.","dep242-7-4-2":"모두 자기 자신의 일만을 구하고 그리스도 예수의 일은 구하지 아니하느니라. 그러나 너희는 디모데의 증거를 아나니 마치 아들이 아버지와 함께 섬긴 것처럼 그가 복음 안에서 나와 함께 섬겼느니라.","dep242-7-4-3":"또 어떤 사람들은 잔혹한 조롱과 채찍질의 시련도 받았고, 더욱이 결박당하고 감옥에도 갇혔으며 (세상은 그들이 살 만한 데가 못되었으므로) 그들은 광야와 산속과 동굴과 토굴에서 유리하였느니라.","dep242-8-1":"내가 너로 큰 민족을 이루게 할 것이며 네게 복을 주고 네 이름을 위대하게 하리니, 너는 복이 되리라. 너를 축복하는 자들에게 내가 복을 주고, 너를 저주하는 자를 저주하리라. 네 안에서 땅의 모든 족속들이 복을 받을 것이라.\" 하셨더라.","dep242-8-2":"그가 또 말씀하셨도다. 네가 나의 종이 되어 야곱의 지파들을 일으키며 이스라엘의 보존된 자들을 돌아오게 하는 것은 쉬운 일이라. 내가 또한 너를 이방인들에게 빛으로 주리니 네가 땅 끝까지 나의 구원이 되리라.","dep242-8-3":"\"그러므로 너희는 가서 모든 민족들을 가르치고, 아버지와 아들과 성령의 이름으로 침례를 주며 내가 너희에게 명령한 모든 것을 가르쳐 지키게 하라. 보라, 내가 세상 끝까지 너희와 항상 함께 있으리라.\"고 하시더라. 아멘.","dep242-8-4":"그러나 성령께서 너희에게 임하시면 너희가 능력을 받으리니, 그러면 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내게 증인이 되리라.\"고 하시니라.","dep242-8-5":"또 내가 주의 음성을 들은즉 말씀하시기를 \"내가 누구를 보내며 누가 우리를 위하여 가랴?\" 하시기에, 그때 내가 말하기를 \"내가 여기 있나이다. 나를 보내소서.\" 하였더라.","dep242-8-6":"이는 나로 이방인들을 위한 예수 그리스도의 일꾼이 되게 하시어 하나님의 복음을 수행하게 하심으로써 이방인들을 제물로 드리는 일이 성령으로 거룩하게 되어 받으실 수 있도록 하심이라.","dep242-8-7":"내게 구하라. 그러면 내가 너에게 이방을 네 유업으로, 땅끝을 네 소유로 주리라.","dep242-8-8":"오 하나님이여, 주께서는 하늘들 위로 높임을 받으소서. 주의 영광으로 온 땅 위에 있게 하소서.","dep242-8-9":"영원한 생명의 소망 안에서 주어진 것으로, 이 영생은 거짓말하실 수 없는 하나님께서 세상이 시작되기 이전에 약속하셨다가 때가 되어 그의 말씀을 복음 전파를 통해 나타내셨는데, 이 일은 우리 구주 하나님의 명령에 따라 내게 맡겨진 것이라.","dep242-8-10":"그러나 주께서 내 곁에 서서 내게 힘을 주신 것은 나를 통하여 복음 전파가 온전히 수행되어 모든 이방인들로 그것을 들을 수 있게 하려 하심이며, 또 내가 사자의 입에서 구출되었느니라.","dep242-8-11":"우리가 그를 전파하고 각 사람을 훈계하며 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 예수 안에서 온전하게 제시하려는 것이라. 이를 위하여 나도 내 속에서 능력으로 역사하시는 그 분의 역사를 따라 수고하며 애쓰노라.","dep242-8-12":"내가 이것을 기도하노니, 너희의 사랑이 지식과 모든 판단에 있어서 더욱 더 풍성하게 되어 예수 그리스도를 통하여 얻는 의의 열매들로 가득차서, 하나님께 영광과 찬양이 되기를 바라노라.","dep242-8-13":"그리고 네가 많은 증인들 가운데서 내게 들은 것들을 신실한 사람들에게 맡기라. 그들이 또 다른 사람들을 가르칠 수 있으리라.","dep242-8-14":"작은 자가 일천이 되겠고 약한 자가 강한 민족이 되리라. 나 주가 자기 때에 그것을 속히 이루리라.","dep242-8-15":"그러므로 이처럼 많은 구름 같은 증인들이 또한 우리를 둘러싸고 있으니, 우리 또한 모든 무거운 것과 쉽게 에워싸는 죄를 벗어 버리고 인내로 우리 앞에 놓인 경주를 하자.","dep242-8-16":"이는 주의 눈은 온 땅을 두루 살피시어 자신을 향하여 마음이 온전한 자들을 위하여 자신이 강함을 보이심이니이다. 왕이 이 일을 어리석게 행하셨나이다 그러므로 이제부터 왕에게 전쟁들이 있으리이다.\" 하더라.","dep242-8-17":"마치 물이 바다를 덮음같이 땅이 주의 영광의 지식으로 가득 차리라.","dep242-8-18":"이는 해 뜨는 데부터 해 지는 데까지 내 이름이 이방인들 가운데서 위대하게 될 것이기 때문이라. 각처에서 내 이름에 향을 피우며 순결한 제물이 드려질 것이니, 이는 내 이름이 이방 가운데서 위대하게 될 것임이라. 만군의 주가 말하노라."},"swm":{"assurance-1":"또한 우리를 향한 하나님의 증언은 이것입니다. 곧 하나님께서 우리에게 영원한 생명을 주셨다는 것과, 그 생명이 자기 아들 예수 그리스도 안에 있다는 것입니다. 그러므로 하나님의 증언을 받아들여 그분의 아들을 모신 사람은 생명을 가진 자요, 하나님의 증언을 배척하여 그분의 아들을 모시지 않은 사람은 생명을 갖지 못한 자입니다.","assurance-2":"그러므로 구하라. 지금까지는 너희가 내 이름으로 아무것도 구하지 않았다. 그러나 이제 내 이름으로 힘껏 구하라. 그러면 너희는 받게 될 것이고, 너희 잔은 기쁨으로 넘칠 것이다.”","assurance-3":"여러분에게 주어진 시련은 모든 사람들이 다 겪는 시련입니다. 하나님께서는 신실하셔서 여러분이 감당할 수 없는 시련은 주지 않으십니다. 만일 여러분이 시련을 겪고 있다면, 하나님께서는 여러분이 능히 감당할 수 있도록 그 시련을 벗어날 길도 함께 마련해 주십니다.","assurance-4":"그러나 우리가 죄인임을 인정하고 스스로 죄를 고백하면, 하나님께서는 참으로 신실하고 의로우신 분이시므로 우리의 죄를 다 용서해 주시고, 모든 불의에서 우리를 깨끗하게 해주실 것입니다.","assurance-5":"너는 온 마음을 다하여 오직 주를 신뢰하고, 네 지식을 의지하지 말아라. 무슨 일을 하든지, 너는 주님을 인정하여라. 그리하면 주께서 너를 인도하셔서, 네게 바른 길을 알려주실 것이다.","living-1":"나는 포도나무요, 너희는 가지다. 그러므로 누구든지 그가 내 안에 살고, 또 내가 그 안에 살면, 그는 많은 열매를 맺게 될 것이다. 너희가 나를 떠나서는 아무것도 할 수 없다.","living-2":"이제 나는 하나님과 그분의 은혜로운 말씀에 여러분을 온전히 맡깁니다. 그 말씀이 여러분의 신앙을 바로 세워 줄 것이고, 또한 하나님을 위해서 거룩하게 구별된 사람들이 상속받는 유산을 여러분도 차지하게 해줄 것입니다.","living-3":"왜냐하면 누구든지 하나님의 영 곧 성령에 의해 인도받는 사람들은 하나님의 자녀들이기 때문입니다.","living-4":"우리는 눈에 보이는 것으로 살아가는 것이 아니라, 오직 믿음으로 살아갑니다.","living-5":"사랑하는 형제들이여, 하나님께서 이토록 우리를 사랑하셨으니, 우리 또한 서로 사랑해야 마땅합니다.","living-6":"그러나 하나님께서 빛 가운데 계신 것같이 우리도 빛 가운데서 살아간다면, 우리와 하나님 사이에는 서로 참된 교제가 있고, 그 결과로 하나님의 아들 예수 그리스도의 피가 우리를 모든 죄에서 깨끗하게 해 주십니다.","living-7":"오직 여러분의 마음속 깊은 곳에 그리스도를 주로 삼아 거룩하게 모시고, 또 여러분이 품고 있는 영생의 소망에 대하여 그 근거를 묻는 사람들에게 언제 어디서든지 답변할 것을 항상 준비하고 있되,","living-8":"각 사람은 자기 마음에 정한 대로 정성껏 헌금해야 하고, 아까워하면서 하거나, 또는 마지못해서 하는 일이 없어야 할 것입니다. 하나님께서는 기쁜 마음으로 바치는 사람을 사랑하십니다.","tms60-A-1":"누구든지 그리스도 안에 있으면, 그는 새로운 사람입니다. 옛것은 지나갔고, 보십시오! 이제 새것이 되었습니다.","tms60-A-2":"나는 그리스도와 함께 십자가에 못 박혔습니다. 그러므로 이제는 더 이상 내가 사는 것이 아니라, 내 안에 계시는 그리스도께서 사시는 것입니다. 내가 지금 육신을 갖고 살고 있는 것은, 오직 나를 사랑하셔서 나를 위해 자기 몸을 내어 주신 하나님의 아들 그리스도를 믿는 믿음으로 살고 있는 것입니다.","tms60-A-3":"형제들이여, 내가 하나님의 자비하심으로 여러분에게 권면합니다. 모쪼록 여러분의 몸을 하나님께서 기뻐하며 받으실 거룩한 산 제물로 바치십시오. 이것이야말로 여러분이 하나님께 드릴 합당한 영적 예배입니다.","tms60-A-4":"내 계명을 지키는 사람은 누구든지 나를 사랑하는 사람이다. 그처럼 나를 사랑하는 사람은 내 아버지께서도 그를 사랑하신다. 나 역시 그를 사랑하여, 나 자신을 그에게 나타내 보일 것이다.”","tms60-A-5":"성경의 모든 책들은 하나님의 영감을 받아 기록된 것으로, 참된 진리가 무엇인지 가르치고, 책망을 통해 잘못을 바로잡게 하고, 또 의로써 훈련시키기에 아주 유익한 책입니다.","tms60-A-6":"이 율법책을 네 입술에서 떨어지지 않도록 하여라. 밤낮으로 그 율법책을 묵상하고, 거기에 쓰인 그대로 행하도록 하여라. 그러면 너는 무슨 일이든지 다 잘 되어 크게 번영할 것이다.","tms60-A-7":"너희가 내 안에 살고, 또 내 말이 너희 안에 살게 되면, 너희가 무엇을 구하든지 그대로 다 이루어질 것이다.","tms60-A-8":"어떤 일이든, 걱정하지 마십시오. 무슨 일을 당할지라도, 오직 기도와 간구로 여러분이 하나님께 바라는 것을 감사하는 마음으로 아뢰도록 하십시오. 그렇게 하면, 모든 인간적인 헤아림을 뛰어넘는 하나님의 평강이 여러분의 마음과 생각을 그리스도 예수 안에서 지켜 주실 것입니다.","tms60-A-9":"두세 사람이 내 이름으로 모인 그곳에는 나도 그들 가운데 그들과 함께 있다.”","tms60-A-10":"그리고 우리는 서로를 사랑하고, 선한 일을 하도록 피차 돌아보고 격려합시다. 어떤 사람들의 잘못된 습관처럼, 우리는 함께 모이는 일을 절대로 소홀히 하지 말고, 도리어 서로를 격려하고 권면하는 가운데 주의 재림의 날이 가까워 오는 것을 볼수록 더욱 힘써 모이도록 합시다.","tms60-A-11":"예수께서 그들 두 형제를 향해 말씀하셨다. “나를 따라오시오. 내가 당신들을 사람 낚는 어부로 만들어 주겠소.”","tms60-A-12":"나는 복음을 조금도 부끄럽게 생각하지 않습니다. 이 복음은 유대인으로부터 헬라인에 이르기까지, 모든 믿는 사람들에게 구원을 주시는 하나님의 크신 능력이기 때문입니다.","tms60-B-1":"그것은, 모두가 죄를 지어서 하나님의 영광에는 이를 수가 없는 처지이기 때문입니다.","tms60-B-2":"그때에 우리는 모두 길 잃은 양과 같아서, 저마다 각각 제 갈 길로 흩어져 갔지만, 주께서는 그에게 우리 모두의 죄악을 지게 하셨다.","tms60-B-3":"죄의 대가는 오직 죽음입니다. 그러나 하나님께서 거저 주시는 선물은 우리 주 예수 그리스도 안에 있는 영생입니다.","tms60-B-4":"사람은 누구나 한 번 죽게 되어 있고, 죽은 다음에는 심판이 있습니다.","tms60-B-5":"하지만 하나님의 독생자 그리스도께서는 우리가 아직 죄인이었을 때 우리를 위해 죽으셨습니다. 하나님께서는 우리를 위한 자신의 사랑을 이런 식으로 보여 주셨습니다.","tms60-B-6":"이는, 그리스도께서도 여러분을 하나님께로 인도하기 위해 사람들의 모든 죄를 짊어지시고 단 한 번 십자가 위에 달리심으로써, 의인으로서 불의한 사람들을 대신하여 죽으셨기 때문입니다. 하지만 그리스도께서 죽임을 당하신 것은 그분의 육신일 뿐이요, 영으로는 도리어 살리심을 받으셨습니다.","tms60-B-7":"여러분은 그리스도를 믿는 믿음을 통해서 하나님의 은혜로 구원을 받았습니다. 그러므로 구원은 결코 여러분에게서 나온 것이 아니라, 오직 하나님께서 베푸신 선물입니다. 여러분의 행위로 구원받은 것이 아니므로, 아무도 자신의 구원을 자랑할 수가 없습니다.","tms60-B-8":"우리를 그런 죄악의 구렁텅이 속에서 구원해 주셨습니다. 그것은, 우리에게 구원받을 의로운 행위가 있었기 때문이 결코 아니라, 오직 하나님의 크신 은혜와 자비하심에 따라, 우리를 거듭나게 씻어 주시고 또 성령으로 새롭게 해주셨기 때문입니다.","tms60-B-9":"그러나 그분께서는 그분을 받아들인 사람들, 곧 그분의 이름을 믿는 자들에게는 하나님의 자녀가 되는 특권을 주셨다.","tms60-B-10":"보라, 내가 문 밖에 서서 문을 계속 두드리고 있다. 누구든지 내 음성을 듣고 문을 열면, 나는 안으로 들어가 그와 함께 먹을 것이고, 그도 나와 함께 먹을 것이다.","tms60-B-11":"내가 하나님의 아들 예수의 이름을 믿고 있는 여러분에게 이 같은 글을 써 보내는 것은, 여러분이 영원한 생명을 갖고 있다는 사실을 알게 하기 위함입니다.","tms60-B-12":"내가 진정으로 밝히 말하겠소. 누구든지 내 말을 듣고 또 나를 보내신 분을 믿는 사람은 영원한 생명을 얻으며, 정죄를 받지 않을 것이오. 그런 자들은 이미 죽음에서 생명으로 옮겨졌소.","tms60-C-1":"형제 여러분, 여러분은 자신이 하나님의 성전인 줄을 알지 못합니까? 여러분 안에 하나님의 성령이 계신다는 것을 알지 못합니까?","tms60-C-2":"하나님께서는 이 세상의 영이 아닌, 바로 이 하나님의 영을 우리에게 주셨습니다. 그래서 하나님께서 우리에게 값없이 그저 주신 놀라운 은혜의 선물을 우리로 알게 하셨습니다.","tms60-C-3":"그러므로 너는 두려워하지 마라. 내가 항상 너와 함께 있다. 너는 겁내지 마라. 내가 바로 네 하나님이다. 내가 너를 강하게 하고, 너를 도와주겠다. 내가 나의 의로운 오른팔로 너를 굳세게 붙들어 주겠다.","tms60-C-4":"나에게 능력을 공급해 주시는 분 안에서, 나는 모든 일을 능히 감당할 수 있습니다.","tms60-C-5":"우리를 향한 주님의 크신 사랑과 자비가 영원토록 다함이 없기에, 우리가 완전히 소멸되지 않았다는 사실입니다. 진실로 이 사실이 아침마다 새록새록 새로운 것은 정녕 우리를 향한 주님의 신실하심이 크고도 크기 때문입니다.","tms60-C-6":"하나님께서는 사람이 아니시니 거짓말을 하시지 않고, 사람의 아들이 아니시니 변덕이 죽 끓듯 하지 않으시네. 한 번 하신 말씀은 반드시 지키시니, 약속하신 것은 무엇이든 실천하시고야 마시는 분이시네.","tms60-C-7":"‘주여, 한결같은 마음으로 주를 믿고 의지하는 사람들에게 언제나 평화를 넘치도록 부어 주소서! 그들은 항상 주를 믿고 의지하는 자들이기 때문입니다.’","tms60-C-8":"여러분의 모든 근심과 염려를 하나님께 전부 맡기십시오. 하나님께서 여러분을 보살펴 주실 것입니다.","tms60-C-9":"생각해 보십시오. 하나님께서는 우리를 위해 자기 독생자까지도 아낌없이 선뜻 내어 주셨습니다. 그러할진대, 하물며 그 아들과 함께 다른 모든 것들도 우리에게 선물로 거저 주시지 않을 리가 있겠습니까?","tms60-C-10":"나의 하나님께서 그리스도 예수 안에서 영광 가운데 그분의 풍성하심을 따라 여러분의 모든 필요를 차고 넘치도록 풍족하게 채워 주실 것입니다.","tms60-C-11":"결국 예수께서는 몸소 시험을 받으시고 또 고난을 겪으셨기 때문에, 시험당하는 사람들을 넉넉히 도우실 수 있게 되었습니다.","tms60-C-12":"청년이 어떻게 해야 일생 동안 깨끗하고 온전하게 살아갈 수 있겠습니까? 그것은 주님의 말씀을 따라 살아가는 길, 오직 그 길뿐입니다. 내가 주님께 죄를 짓지 않으려고, 주의 말씀을 내 마음속 깊이 간직하렵니다.","tms60-D-1":"여러분은 무엇보다 먼저 하나님의 나라와 하나님의 의를 추구하십시오. 그리하면, 이 모든 것들을 여러분에게 덤으로 더해 주실 것입니다.","tms60-D-2":"그리고 모든 사람들에게 말씀하셨다. “누구든지 나를 따르려거든, 자기를 부인하고 날마다 자기 십자가를 지고 나를 따라야 합니다.","tms60-D-3":"여러분은 세상을 사랑하지 마십시오. 또한 세상에 속한 어떤 것들도 사랑하지 마십시오. 누구든지 세상을 사랑한다면, 그 사람에게는 아버지 하나님을 향한 사랑이 없습니다. 그 까닭은, 세상에 속한 모든 것들 곧 육신의 정욕과 눈의 욕망과 세상살이의 자랑 등은 모두 아버지 하나님께로부터 비롯되는 것이 아니라, 타락한 세상에서 비롯되는 것이기 때문입니다.","tms60-D-4":"여러분은 이 세상의 풍조를 더 이상 본받지 말고, 여러분의 마음을 새롭게 하여 변화되십시오. 그리하여 여러분은 하나님의 뜻이 무엇인지, 또 하나님께서 기뻐하시는 선하고 온전한 뜻이 어디에 있는지 옳게 분별하여, 그것을 받아들이도록 하십시오.","tms60-D-5":"나의 사랑하는 형제들이여, 그러므로 굳게 서서 흔들리지 말고, 항상 주의 일에 더욱 힘쓰는 자들이 되십시오. 여러분이 아시는 대로, 주 안에서 행하시는 여러분의 모든 수고가 결코 헛되지 않습니다.","tms60-D-6":"그러므로 여러분은 죄인들의 숱한 배척과 모진 학대를 견뎌 내신 예수 그리스도를 항상 생각하면서, 믿음의 경주를 달릴 때 낙심하여 지치는 일이 없도록 하십시오.","tms60-D-7":"인자는 섬김을 받으러 온 것이 아니라 섬기러 왔고, 많은 사람들을 구하기 위하여 자기 목숨을 내어 주려고 온 것이다.”","tms60-D-8":"우리는 우리 자신을 전파하려는 것이 결코 아닙니다. 다만 우리는 예수 그리스도께서 우리의 주가 되신다는 사실과 또 예수로 인하여 우리가 여러분의 종이 된 사실을 가르치고 전파합니다.","tms60-D-9":"너는 네가 가진 재산으로, 네가 거둔 첫 열매로, 힘써 주님을 공경하여라. 그리하면 네 곡식 창고가 가득 찰 것이고, 네 술틀에는 새 포도주가 철철 넘쳐날 것이다.","tms60-D-10":"이 점을 명심하십시오. 적게 뿌린 사람은 적게 거두고, 많이 뿌린 사람은 많이 거두게 마련입니다. 각 사람은 자기 마음에 정한 대로 정성껏 헌금해야 하고, 아까워하면서 하거나, 또는 마지못해서 하는 일이 없어야 할 것입니다. 하나님께서는 기쁜 마음으로 바치는 사람을 사랑하십니다.","tms60-D-11":"그러나 성령이 너희에게 임하시면, 너희는 권능을 받게 될 것이다. 그러면 너희는 예루살렘에서, 유대와 사마리아 전 지역에서, 그리고 땅 끝까지 이르러 나의 증인이 될 것이다.”","tms60-D-12":"그러므로 너희는 가서, 세상 모든 민족의 모든 사람들을 제자로 삼아, 아버지와 아들과 성령의 이름으로 세례를 베풀고, 내가 너희에게 명한 모든 것을 그들에게 가르쳐 지키게 하라. 보라, 내가 세상 끝날까지 항상 너희와 함께 있겠다.”","tms60-E-1":"이제 내가 너희에게 새 계명을 준다. 서로 사랑하여라. 내가 너희를 사랑한 것같이, 너희도 서로 사랑하여라. 너희가 서로 사랑하면, 그것을 보고, 세상 사람들이 너희가 내 제자인 것을 알게 될 것이다.”","tms60-E-2":"자녀들이여, 그러므로 우리가 말이나 혀로만 사랑하지 말고, 행동으로 진실하게 사랑합시다.","tms60-E-3":"무슨 일을 하든지, 이기심이나 허영으로 하지 말고, 오직 겸손한 마음으로 자기보다 다른 사람을 더 낫게 여기십시오. 또한 여러분은 각자 자기 일만 돌보지 말고, 다른 사람의 일도 관심을 갖고 돌보아 주십시오.","tms60-E-4":"청년들이여, 이와 같이 여러분도 장로들에게 복종하십시오. 또한 겸손의 옷을 입고, 서로를 먼저 섬기십시오. 성경에 기록되기를 “하나님께서는 교만한 자를 물리치시고, 겸손한 자에게 은혜를 베푸신다.”라고 했습니다. 그러므로 여러분은 하나님의 권능의 손 아래서 자신을 낮춰 스스로 겸손하십시오. 때가 되면, 하나님께서 친히 여러분을 높이실 것입니다.","tms60-E-5":"여러분 가운데 온갖 음란함이나 부도덕이나 탐욕은 그 이름조차도 입에 담지 마십시오. 그렇게 하는 것이 성도에게 합당한 삶입니다.","tms60-E-6":"사랑하는 형제들이여, 이 세상에서 나그네요 외인 같은 여러분에게 내가 권면합니다. 여러분은 여러분의 영혼을 대적하여 싸우는 타락한 육체의 욕망을 멀리 하십시오.","tms60-E-7":"도둑질하지 말아라. 거짓말하지 말아라. 서로 속이지 말아라.","tms60-E-8":"이런 까닭에, 저는 하나님 앞에서나 사람들 앞에서 언제나 양심에 부끄러움이 없는 생활을 하려고 애쓰고 있습니다.","tms60-E-9":"그렇습니다. 믿음이 없이는 아무도 하나님을 기쁘시게 해 드릴 수 없습니다. 그러므로 하나님께로 나아가려고 하는 사람은 누구든지 하나님께서 살아 계신다는 것과, 또 그분은 자신을 진정으로 열심히 따르는 사람들에게 반드시 상을 주시는 분이시라는 것을 믿어야 합니다.","tms60-E-10":"아브라함은 하나님의 약속을 굳게 믿고 조금도 의심하지 않았습니다. 도리어 믿음이 날로 더욱 굳건해져서 하나님께 영광을 돌리기까지 했습니다. 진실로 하나님께서는 어떤 약속도 능히 이루어 주실 것임을 믿어 의심치 않았습니다.","tms60-E-11":"선한 일을 하다가 도중에 낙심하지 마십시오. 포기하지 않고 꾸준히 선한 일을 행하면, 때가 이를 때에 반드시 거둘 것입니다. 그러므로 기회 있을 때마다, 모든 사람에게 선한 일을 행합시다. 특히 믿음의 식구들에게는 더욱 그렇게 합시다.","tms60-E-12":"이와 같이 여러분도 여러분의 빛을 가리지 말고, 모든 사람들에게 환히 비추십시오. 그리하여 세상 사람들이 여러분의 착한 행실을 보고, 하늘에 계신 여러분의 아버지께 영광을 돌리게 하십시오.”","tms180-s1-1-1":"태초에 ‘말씀’이 계셨다. 그 ‘말씀’은 하나님과 함께 계셨고, 그 ‘말씀’은 곧 하나님이셨다. 그 ‘말씀’이 육신이 되어, 우리 가운데 사셨다. 우리가 그분의 영광을 보았으니, 그 영광은 곧 자기 외아들을 보내신 아버지의 영광이었고, 은혜와 진리로 충만한 영광이었다.","tms180-s1-1-2":"그러나 그 아들을 두고서는 성경에 기록되기를 “오 하나님! 주의 보좌는 영원하고, 주의 왕국의 홀은 의의 홀입니다.","tms180-s1-1-3":"우리의 위대한 대제사장이신 예수는 우리의 연약함을 모르시는 분이 결코 아닙니다. 그분은 우리의 연약함을 충분히 동정하시는 분으로서, 우리와 마찬가지로 모든 면에서 시험을 받으셨지만, 우리와는 달리 죄라고는 모르시는 분입니다.","tms180-s1-1-4":"예수는 날로 키와 지혜가 자라났고, 자라면서 하나님과 사람들에게서 더욱 사랑을 받았다.","tms180-s1-1-5":"나는 내가 전해 받은 가장 중요한 것들을 여러분에게 그대로 전했습니다. 그것은 곧, 그리스도께서는 성경에 기록된 대로 우리의 죄를 위해 죽으셨다는 것과, 무덤에 묻히셨다는 것과, 성경에 기록된 대로 사흘 만에 다시 살아나셨다는 것과,","tms180-s1-1-6":"그러나 절대로 그렇지 않습니다! 그리스도께서는 분명 죽으셨다가 다시 살아나셨습니다. 그리하여 모든 죽은 사람들의 첫 열매가 되셨습니다.","tms180-s1-1-7":"지금까지 하나님을 본 사람은 아무도 없다. 그러나 아버지 품에 계시는 외아들이신 그분께서 아버지 하나님을 우리에게 알려 주셨다.","tms180-s1-1-8":"그 아들은 하나님의 영광의 광채이시고, 하나님의 본체 그대로의 모습이십니다. 또한 그 아들은 자신의 능력 있는 말씀으로 만물을 굳게 붙들어 보존하시고, 우리의 모든 죄를 깨끗이 씻어 주신 후에, 하늘에 오르셔서 높은 곳에 계신 존엄하신 하나님의 오른편에 앉으셨습니다.","tms180-s1-1-9":"보시오, 인자는 잃어버린 사람을 찾아 구원하러 이 땅에 왔소.”","tms180-s1-1-10":"여러분도 이미 알고 있듯이, 여러분이 조상들로부터 물려받은 헛된 생활방식에서 해방되어 참된 구원을 받게 된 것은, 은이나 금같이 장차 없어질 것들로 된 것이 아니라, 오직 한 점의 죄도 없고 흠도 없으신 하나님의 어린 양이신 예수 그리스도의 보배롭고 고귀한 피로 된 것입니다.","tms180-s1-1-11":"주께서 큰 호령과 천사장의 소리와 하나님의 나팔 소리와 함께, 친히 하늘로부터 내려오실 터인데, 그때에 그리스도 안에서 이미 죽은 자들이 먼저 일어나고, 그런 다음에, 아직 살아 남아 있는 우리가 그들과 함께 구름 가운데로 이끌려 올라가, 공중에서 주를 만나게 될 것입니다. 그리하여 우리는 영원히 주와 함께 있을 것입니다.","tms180-s1-1-12":"사랑하는 형제들이여, 누가 뭐래도 이제 우리는 하나님의 자녀입니다. 우리가 앞으로 어떻게 될는지는 아직 알 수 없습니다. 하지만 그리스도께서 다시 오실 때, 우리도 그분처럼 될 것임을 우리는 알고 있습니다. 그때에 우리는 그분의 참 모습을 보게 될 것이기 때문입니다. 그러므로 누구든지 그분에게 소망을 두고 살아가는 사람은 자기 자신을 정결하게 합니다. 그분은 참으로 정결하신 분이시기 때문입니다.","tms180-s1-2-1":"그러나 ‘돕는 분’ 곧 진리의 성령이 오시면, 그분이 너희를 모든 진리 가운데로 인도하실 것이다. 그분은 자신의 생각대로 말씀하시지 않고, 자신이 들은 것만을 너희에게 전해 주실 것이며, 또 앞으로 일어날 일도 너희에게 알려 주실 것이다. 그분은 내 것을 넘겨받아 너희에게 알려 주심으로써 나를 영광스럽게 할 것이다.","tms180-s1-2-2":"그러므로 나는 여러분에게 이 사실을 알려 드립니다. 하나님의 영 곧 성령으로 말하는 사람은 누구도 예수를 저주하지 않습니다. 또 성령으로 말미암지 않고는 누구도 “예수님은 주시다.” 라고 말할 수 없습니다.","tms180-s1-2-3":"그러나 여러분 안에 하나님의 성령이 거하시면, 여러분은 육신에 따르지 않고 성령에 따라 살게 됩니다. 누구든지 그리스도의 영이 없으면, 그 사람은 그리스도의 사람이 아니므로 그리스도께 속할 수 없습니다.","tms180-s1-2-4":"그리하여 여러분은 이제 하나님의 자녀이므로, 하나님께서는 우리 마음속에 자기 아들의 영을 보내주셔서, 우리로 하여금 하나님을 “아바, 아버지”라고 부를 수 있게 하셨습니다.","tms180-s1-2-5":"술에 취해 살지 마십시오. 그 길은 방탕의 길입니다. 오직 성령으로 충만해지십시오.","tms180-s1-2-6":"그러므로 내가 또 여러분에게 말합니다. 오직 성령의 인도에 따라 살아가십시오. 그러면 죄 많은 육체의 욕망을 만족시키려고 애쓰지 않게 될 것입니다.","tms180-s1-2-7":"그래서 성경에 기록되기를, “하나님께서는 어느 누구도 보지 못했던 것을, 어느 누구도 듣지 못했던 것을, 어느 누구도 생각하지 못했던 것을, 자기를 사랑하는 자들을 위해 예비해 두셨다.”라고 했습니다. 그렇습니다. 하나님께서는 성령을 통하여 우리에게 이 지혜를 드러내 보여 주셨습니다. 모든 것을 살피시는 성령께서는 하나님의 가장 깊은 비밀스런 경륜까지도 다 살피시는 분입니다.","tms180-s1-2-8":"그러나 이제 내 아버지께서 내 이름으로 보내실 ‘돕는 분’이신 성령이 이 모든 것을 너희에게 가르쳐 줄 것이고, 또한 내가 너희에게 말한 모든 것을 너희가 생각해낼 수 있도록 그가 너희에게 또다시 일깨워 줄 것이다.”","tms180-s1-2-9":"그래서 내가 여러분에게 전하는 말과 설교는 그리 지혜롭지도 못했고, 설득력이 있는 것도 아니었습니다. 다만 나는 성령의 능력을 보여 주고자 한 것뿐입니다. 그리하여 나는 여러분의 믿음이 사람의 지혜에 뿌리를 내리지 않고, 오직 하나님의 능력에 뿌리 내리기를 간절히 바랐던 것입니다.","tms180-s1-2-10":"그러기에 우리가 전한 복음이 여러분에게 단지 말로써만 아니라, 능력으로, 성령으로, 큰 확신으로 여러분에게 깊숙이 가 닿았던 것입니다. 우리가 여러분 가운데 함께 있었을 때, 여러분을 위해 우리가 어떻게 처신하였는지는 여러분이 잘 알고 있습니다.","tms180-s1-2-11":"이 모든 은사들은 한 분이신 동일한 성령에게서 비롯되는 일입니다. 진실로 성령께서는 자신이 원하시는 대로 각 사람에게 적합한 은사를 나누어 주십니다.","tms180-s1-2-12":"은사는 여러 종류가 있지만, 모두 동일한 성령에게서 비롯된 것입니다. 다양한 종류의 사역이 있지만, 사람들을 통해 그 모든 사역을 이루시는 분은 동일한 하나님이십니다.","tms180-s1-3-1":"“아, 우리 주 하나님이시여! 주께서는 큰 능력과 권능의 펴신 팔로 하늘과 땅을 창조하셨습니다. 진실로 주께서는 무슨 일이든지 능히 다 하실 수 있고, 주께서 하지 못하실 일이란 온 천지에 아무것도 없습니다.","tms180-s1-3-2":"하나님의 지혜와 지식은 얼마나 풍성하고 또 얼마나 깊이가 있는지요! 그분의 판단력은 감히 헤아릴 길이 없고, 그분이 가시는 길은 감히 더듬어 추적할 수가 없습니다!","tms180-s1-3-3":"나 주가 말한다. 내가 찾을 수 없는 곳에 숨어 있을 수 있는 사람은 아무도 없다. 온 천지의 모든 곳에 내가 있고, 온 세상 어디에도 내가 없는 곳은 없다.”","tms180-s1-3-4":"하나님께서는 여러분에게 모든 은혜를 풍성하게 베풀어 주실 수 있는 분이십니다. 그러므로 여러분은 언제든지 필요한 것을 넉넉히 가질 수 있고, 그래서 모든 선한 일을 넘치도록 할 수 있습니다.","tms180-s1-3-5":"주여, 위대함과 능력과 영광과 승리와 존귀와 위엄이 모두 주의 것입니다. 하늘과 땅에 있는 모든 것들은 다 주의 것입니다. 이 땅의 모든 통치권과 주권도 모두 주의 것입니다. 그러므로 우리는 지금 우리 하나님께 감사를 드리며, 주님의 영광스러운 이름을 높이 찬양합니다.","tms180-s1-3-6":"그러나 주께서는 신실하신 분이므로, 여러분을 강하게 하시고, 모든 악한 자들로부터 여러분을 보호해 주실 것입니다.","tms180-s1-3-7":"하나님께서는 영이시오. 그러므로 하나님을 예배하는 자들은 영과 진리로 예배를 드려야 하오.”","tms180-s1-3-8":"여러분을 부르신 분이 거룩하신 것처럼, 여러분도 삶의 모든 행실에 거룩한 사람들이 되십시오. 성경에 기록되기를 “내가 거룩하므로, 너희도 거룩하여라.” 하였습니다.","tms180-s1-3-9":"진실로 주님께서는 위대하신 분이시니, 드높이 찬양받기에 합당하신 분이십니다. 주님의 그 위대하심을 우리가 어찌 측량인들 감히 할 수 있겠습니까!","tms180-s1-3-10":"사랑이 바로 여기에 있으니, 곧 우리가 하나님을 사랑한 것이 아니라, 하나님께서 먼저 우리를 사랑하셔서, 우리의 죄를 용서해 주시기 위해 자기 아들을 화목제물로 삼아 이 세상에 보내 주신 것입니다.","tms180-s1-3-11":"주여, 주께서는 참으로 자비롭고 은혜로우시며, 노하기를 더디 하시고, 사랑과 신실함이 한량없이 넘치시는 분이십니다.","tms180-s1-3-12":"하나님을 사랑하는 사람들, 곧 하나님께 부르심을 받아 그분의 뜻대로 살아가는 사람들에게는, 모든 일들이 서로서로 협력해서 결국에는 선을 이룰 것임을 우리는 알고 있습니다.","tms180-s2-1-1":"모쪼록 우리는 사랑 안에서 진리만을 말하면서, 우리 삶의 모든 면에서 더욱 자라나, 마침내 머리 되시는 그리스도에게까지 다다라야 합니다.","tms180-s2-1-2":"특히, 서로 거짓말을 하지 마십시오. 여러분은 옛 사람을 그 행실과 함께 다 벗어 버리고,","tms180-s2-1-3":"남의 허물을 덮어주면 사랑을 받고, 남의 허물을 거듭거듭 들추어내면 친한 벗까지도 등을 돌린다.","tms180-s2-1-4":"말 많은 수다쟁이는 여기저기 돌아다니면서 남의 비밀을 누설하지만, 그 마음이 믿음직한 사람은 남의 비밀을 잘 지켜준다.","tms180-s2-1-5":"그러니 내가 마땅히 해야 할 말로써 분명하게 말씀을 선포할 수 있도록 우리를 위해 기도해 주십시오. 또 여러분은 소금으로 음식 맛을 내는 것처럼 언제나 은혜가 넘치는 말을 하도록 하십시오. 그러면 여러분은 각 사람에게 때에 맞는 적절한 대답을 할 수 있게 될 것입니다.","tms180-s2-1-6":"부드러운 대답은 분노를 가라앉혀도, 거친 말은 화를 돋운다.","tms180-s2-1-7":"그러므로 여러분은 서로 죄를 고백하고, 병이 낫도록 서로를 위해 기도하십시오. 특히 의롭고 경건한 사람의 간절한 기도는 큰 효력이 있습니다.","tms180-s2-1-8":"만일 당신이 하나님께 제물을 드리려고 할 때, 당신에게 원한을 품고 있는 형제가 생각나거든, 제물을 그대로 두고, 그 형제를 찾아가서 먼저 화해한 다음에 다시 돌아와서 하나님께 제물을 바치도록 하십시오.","tms180-s2-1-9":"사랑하는 나의 형제들이여, 이것을 마음에 새겨 두십시오. 즉, 사람마다 듣기는 빨리 하고, 말하기는 더디 하며, 노하기도 천천히 하십시오.","tms180-s2-1-10":"사연을 다 들어보기도 전에 대답부터 하는 것은 어리석은 짓이어서, 망신을 당하기 십상이다.","tms180-s2-1-11":"그러니 우쭐대는 거만한 자를 꾸짖을 생각일랑은 하지도 말아라. 아무 유익 없이, 그에게 미움만 당할 뿐이기 때문이다. 도리어 현명한 사람을 꾸짖어라, 그러면 그가 너를 사랑할 것이다. 지혜로운 사람을 훈계를 하면 훈계할수록 더욱 지혜로워지고, 의로운 사람을 가르치면 가르칠수록 더욱 더 많은 것을 깨닫게 될 것이다.","tms180-s2-1-12":"“어떤 형제가 네게 잘못한 일이 있거든, 단둘이서 만나 그의 잘못을 타일러 주어라. 그 형제가 네 말을 듣고 잘못을 고백하면, 너는 형제 하나를 얻은 것이다.","tms180-s2-2-1":"오직 서로에게 친절히 대하고, 서로를 불쌍히 여기며, 하나님께서 그리스도 안에서 여러분을 용서하신 것과 같이 서로가 서로에게 먼저 용서를 베푸십시오.","tms180-s2-2-2":"누가 누구에게 불평거리가 있더라도, 서로를 너그럽게 대하고 또 서로 용서하도록 하십시오. 주께서 여러분을 용서하신 것처럼, 여러분도 그렇게 용서하십시오.","tms180-s2-2-3":"곧, 겸손하고 온유한 사람이 되십시오, 사랑 안에서 서로를 받아들이시고, 많이 참으십시오.","tms180-s2-2-4":"주의 종은 다투지 말아야 합니다. 아무쪼록 주의 종은 모든 이들에게 온유하게 대하고, 가르치기를 잘 하며, 모든 일에 참을성이 있어야 하고, 반대하는 사람일지라도 온화한 태도로 바로잡아 주어야 합니다. 그렇게 해야 하는 까닭은, 하나님께서 그런 자들을 마침내 회개로 이끄셔서 진리를 깨닫게 해 주실 수도 있기 때문이고,","tms180-s2-2-5":"“화를 내더라도, 죄를 짓는 데까지 이르지 마십시오.” 아무리 분한 일이 있더라도, 해가 지기 전에 다 풀어 버리십시오.","tms180-s2-2-6":"그러나 여러분은 이제 그 모든 것들, 곧 분노와 증오와 악의와 비방을 여러분에게서 스스로 다 제거해야 합니다.","tms180-s2-2-7":"아무도 하나님의 은혜에서 떨어져 나가는 일이 없도록 삼가 자신을 늘 살피고, 또한 여러분 사이에 독초가 생겨나서 문제를 만드는 일이 없도록 잘 단속해서, 그로 인해 많은 사람들이 피해를 입는 일이 없도록 주의하십시오.","tms180-s2-2-8":"모든 독설과 분노와 성내는 버릇과 말다툼과 비방하는 말을 삼가고, 모든 악의도 함께 던져 버리십시오.","tms180-s2-2-9":"그러나 악한 일을 저지른 탓에 그 죄로 매를 맞고 참는다면, 그것이 무슨 자랑이 되겠습니까? 다만 옳은 일을 행하다가 핍박을 받고 참는다면, 그것은 하나님 보시기에 칭찬할 만한 일입니다. 바로 이런 일을 위해, 여러분은 하나님께 부르심을 받았습니다. 그리스도께서도 여러분을 위해 몸소 고난을 받으심으로써, 여러분들로 하여금 자신의 발자취를 따르도록 본보기가 되어 주셨습니다.","tms180-s2-2-10":"사랑하는 내 형제들이여, 원수에 대하여 여러분이 직접 복수하려고 하지 말고, 그 일은 하나님의 진노하심에 맡기십시오. 성경에 기록된 대로, 하나님께서는 말씀하시기를 “원수 갚는 일은 내가 할 일이니, 내게 다 맡기라.” 하셨습니다.","tms180-s2-2-11":"분노는 폭풍처럼 잔인하고 진노는 범람하는 큰물처럼 걷잡을 수 없다지만, 어찌 활활 타오르는 질투에 비할 수 있으랴!","tms180-s2-2-12":"시기심과 이기적인 욕망이 들끓는 곳에는 온갖 혼란과 악행이 차고 넘칩니다.","tms180-s2-3-1":"인내와 위로를 주시는 하나님께서 여러분을 도와, 서로가 같은 뜻을 품고 한마음이 되어, 그리스도 예수를 따를 수 있게 되기를 바랍니다. 그리하여 우리 모두가 한 마음과 한 입으로 하나님 곧 우리 주 예수 그리스도의 아버지께 영광을 돌릴 수 있게 되기를 빕니다.","tms180-s2-3-2":"형제 여러분, 내가 주 예수 그리스도의 이름으로 여러분에게 권면합니다. 여러분 안에 분쟁이나 분열이 없도록, 그리하여 마음과 생각이 일치할 수 있도록, 서로서로 한마음이 되십시오.","tms180-s2-3-3":"그러나 너희들은 절대로 그렇게 해서는 안 된다. 너희 가운데 누구든지 높은 사람이 되기를 원하는 사람은 너희를 섬기는 사람이 되어야 한다. 또 너희 중에 으뜸이 되기를 원하는 사람은 너희의 종이 되어야 한다.","tms180-s2-3-4":"나의 형제들이여, 하나님께서는 여러분을 부르셔서 여러분에게 자유를 주셨습니다. 이처럼 여러분은 이미 자유를 누리고 있는 자들입니다. 하지만 여러분은 주님께서 주신 그 자유를 육체의 욕망을 채우기 위한 기회로 사용해서는 안 됩니다. 오직 서로 사랑하면서 서로를 섬기는 일에 사용하십시오.","tms180-s2-3-5":"우리는 저마다 이웃을 기쁘게 하고, 이웃의 유익을 위해 살아야 하며, 이웃에게 덕을 세우도록 해야 합니다.","tms180-s2-3-6":"무슨 일을 하든지, 이기심이나 허영으로 하지 말고, 오직 겸손한 마음으로 자기보다 다른 사람을 더 낫게 여기십시오. 또한 여러분은 각자 자기 일만 돌보지 말고, 다른 사람의 일도 관심을 갖고 돌보아 주십시오.","tms180-s2-3-7":"그러므로 여러분은 지금 그렇게 하고 있는 것처럼, 서로 격려하고, 서로를 세워 주십시오.","tms180-s2-3-8":"내가 또 깨닫고 보니, 혼자보다는 둘이 더 낫다. 혼자서 애쓰는 것보다는 둘이서 함께 일하고 노력할 때 더욱 좋은 결과를 얻을 수 있기 때문이다. 둘이면, 길을 가다가 그중에 한 사람이 넘어지면 다른 한 사람이 얼른 자기 동무를 일으켜 줄 수 있다. 그러나 혼자 가다가 넘어지면, 불쌍하게도 그를 일으켜 줄 사람이 아무도 없다.","tms180-s2-3-9":"예수께서는 또 모여든 사람들을 보시고 늘 불쌍히 여기셨다. 그들은 마치 목자 없는 양처럼 어디로 가야 할지를 모르는 가엾은 백성들이었기 때문이었다.","tms180-s2-3-10":"기뻐하는 사람들과 함께 기뻐하고, 슬퍼하는 사람들과 함께 슬퍼하십시오.","tms180-s2-3-11":"그러나 하늘로부터 오는 지혜는 무엇보다 순결하고, 또한 화평하고, 너그럽고, 양순하고, 자비와 선한 열매가 풍성하고, 편견이 없고, 위선적이지 않습니다.","tms180-s2-3-12":"형제들이여, 형제들 가운데 어떤 사람이 무슨 죄에 빠져 있거든, 성령의 인도를 따라 살아가는 여러분은 그런 사람을 온유한 마음으로 부드럽게 이끌어 바로 잡아 주어야 합니다. 그러면서 여러분은 스스로를 잘 살펴, 그런 죄의 유혹에 빠지지 않도록 조심하십시오.","tms180-s3-1-1":"그리스도께서는 신적인 능력으로 자신의 영광과 존귀함 가운데로 우리를 부르셨고, 자신을 아는 지식을 통하여 생명과 경건에 이르게 하는 모든 것들을 우리에게 주셨습니다. 또한 그분께서는 우리에게 지극히 크고 보배로운 약속들을 주셨는데, 이는 그러한 약속들로 말미암아 여러분들로 하여금 이 세상의 정욕 때문에 타락하는 것을 피하게 하고, 오직 신의 성품에 참여하게 하려는 것입니다.","tms180-s3-1-2":"그렇습니다. 아무리 많은 하나님의 약속도 그리스도 안에서는 모두 “예”가 됩니다. 그러므로 우리는 “아멘”하면서, 그리스도를 통해 하나님께 영광을 돌리는 것입니다.","tms180-s3-1-3":"우리 주 예수 그리스도의 아버지이신 하나님을 찬양합시다. 그분은 자비로우신 아버지시요, 모든 위로의 하나님이십니다. 그분은 우리가 온갖 환난을 겪고 있을 때 우리를 풍성히 위로해 주시는 분입니다. 그렇게 하심으로써 우리 자신이 하나님께 받은 그 위로로, 우리도 역시 온갖 환난을 겪고 있는 사람들을 또한 위로하게 하시려는 것입니다.","tms180-s3-1-4":"그러므로 씨를 뿌리는 사람이나 물을 주는 사람은 아무것도 아닙니다. 오직 자라나게 하신 분, 곧 하나님이 가장 중요합니다. 씨를 뿌린 사람과 물을 준 사람은 똑같은 일꾼으로서, 그들은 각자 자기가 수고한 만큼 하나님께 품삯을 받게 될 것입니다.","tms180-s3-1-5":"오직 주의 교훈을 즐거워하면서, 그 교훈을 밤낮으로 읊조리며 깊이 생각하는 사람이다. 이런 사람은, 시냇가에 심은 나무가 철따라 열매를 풍성히 맺고 그 잎사귀가 조금도 시들지 아니하는 것처럼, 하는 모든 일마다 다 형통할 것이다.","tms180-s3-1-6":"이런 성품들이 여러분에게 있고 또 더욱 넉넉해진다면, 이런 성품들로 인해 여러분은 우리 주 예수 그리스도를 아는 일에 결코 게으름을 피우지 않을 것이고, 그래서 열매를 맺지 못하는 일이 전혀 없게 될 것입니다.","tms180-s3-1-7":"여러분이 잠시 동안 고난을 겪고 나면, 모든 은혜를 넘치도록 부어 주시는 하나님, 곧 그리스도를 통해서 여러분을 자신의 영원한 영광 가운데로 불러 주신 분께서 여러분을 친히 온전하게 하시고, 굳세게 하시며, 강하게 하시고, 견고하게 세워 주실 것입니다.","tms180-s3-1-8":"그러나 주님께서는 내게 이렇게 말씀하셨습니다. “나는 네게 충분히 은혜를 베풀었다. 왜냐하면 나의 능력은 네가 약한 데서 비로소 완전해지기 때문이다.” 그러므로 나는 그리스도의 능력이 내게 온전히 머물도록 하기 위해서, 나의 연약함에 대해 크게 기뻐하며 더욱 자랑할 것입니다.","tms180-s3-1-9":"우리 주 예수 그리스도의 아버지 하나님께 찬양을 드립니다. 하나님께서는 그리스도 안에서 하늘에 속한 온갖 신령한 복을 우리에게 베풀어 주셨습니다.","tms180-s3-1-10":"오직 주님만을 기뻐하라. 그러면 주께서 네가 간절히 바라는 마음의 소원을 이루어 주실 것이다. 네 갈 길을 주께 맡기고, 오직 주만 신뢰하여라. 그러면 주께서 모든 것을 다 이루어 주실 것이다.","tms180-s3-1-11":"사랑하는 나의 자녀들이여, 내가 여러분에게 이 편지를 쓰는 것은, 여러분으로 하여금 죄를 짓지 않게 하기 위함입니다. 그러나 혹시 여러분 가운데 누군가 죄를 짓더라도, 우리에게는 우리를 위해 아버지 하나님께 변호해 주시는 분이 계시는데, 그분은 곧 의로우신 예수 그리스도이십니다. 그리스도께서는 우리의 죄를 대속하기 위해 하나님께 화목제물로 바쳐졌는데, 우리 죄뿐만 아니라 온 세상 모든 사람들의 죄를 위해서도 그리 되셨습니다.","tms180-s3-1-12":"동녘이 서녘에서 한없이 멀듯이, 주께서는 우리의 죄악과 허물을 우리에게서 그처럼 멀리 옮겨 주신다.","tms180-s3-2-1":"참으로 하나님의 말씀은 살아 있고, 능력이 넘치며, 어떤 양날의 칼보다도 더 날카롭기 때문에, 우리의 영과 혼까지 능히 찔러 쪼개며, 관절과 골수까지 충분히 꿰뚫어서 파고듭니다. 뿐만 아니라, 하나님의 말씀은 우리의 마음속에 있는 생각이나 의도조차도 모조리 다 밝혀냅니다.","tms180-s3-2-2":"하늘에서 비와 눈이 내리면, 하늘로 그냥 돌아가는 법이 없이 땅을 적셔 싹을 틔우고, 그 싹이 자라게 하여, 그로써 농부들로 뿌릴 씨앗도 얻게 하고 먹을 양식도 얻게 하는 것처럼, 내 입에서 한번 나간 말도 그와 같으니, 곧 나의 모든 말은 아무런 성과 없이 그냥 내게로 돌아오는 법이 결코 없이, 내가 원하는 일을 다 이루고, 내가 맡겨 준 사명을 그대로 다 성취한다.”","tms180-s3-2-3":"하지만 무엇보다 여러분이 먼저 알아야 할 것이 있습니다. 그것은, 성경 속의 모든 예언들을 자기 마음대로 해석해서는 절대로 안 된다는 사실입니다. 성경 속의 모든 예언들은 사람의 뜻에 따라 나온 것이 아니라, 오직 성령의 감동을 받은 사람들이 하나님께로부터 전해 받은 말씀을 선포한 것이기 때문입니다.","tms180-s3-2-4":"우리가 하나님께 끊임없이 감사드리는 것은, 여러분이 우리에게서 하나님의 말씀을 받을 때에 사람의 말로 받아들이지 아니하고, 있는 그대로 실제 하나님의 말씀으로 받아들였다는 사실입니다. 참으로 그 말씀은 믿는 여러분 가운데서 지금 살아 역사하고 있습니다.","tms180-s3-2-5":"전능하신 만군의 주 하나님이시여, 저는 주님의 이름으로 불리는 자입니다. 주님의 말씀이 제게 내리면, 저는 그 말씀을 그대로 받아 삼켰습니다. 진실로 주님의 말씀은 저의 기쁨과 즐거움이었습니다.","tms180-s3-2-6":"나는 지금껏 그분의 입술에서 나오는 계명을 어긴 일이 없고, 그분의 입에서 나오는 말씀을 내 매일의 양식보다 더 귀히 여겼건만!","tms180-s3-2-7":"베뢰아 사람들은 데살로니가 사람들보다 마음 씀씀이가 훨씬 고상했다. 그들은 기쁜 마음으로 말씀을 받아들이고, 바울이 말한 것이 맞는지를 알아보려고 날마다 성경을 연구했다.","tms180-s3-2-8":"당신들이 성경을 열심히 연구하는 것은, 성경에서 영원한 생명을 얻을 수 있다고 생각하기 때문이오. 그렇소. 그 성경이 바로 나를 증언하고 있소. 그런데도 당신들은 생명을 얻기 위해 나에게 오려고 하지 않소.","tms180-s3-2-9":"예수께서 자신을 믿는 유대인들에게 말씀하셨다. “여러분이 내 가르침을 따라 산다면, 여러분은 참으로 나의 제자들입니다. 그러면 여러분은 진리를 알게 될 것이고, 진리가 여러분을 자유롭게 할 것입니다.”","tms180-s3-2-10":"예수께서 대답하셨다. “성경에 기록되기를 ‘사람이 빵으로만 사는 것이 아니라, 하나님의 입에서 나오는 모든 말씀으로 산다.’하였다.”","tms180-s3-2-11":"하늘과 땅은 없어질지라도, 내가 한 말은 결단코 없어지지 않을 것이다.”","tms180-s3-2-12":"아버지여, 진리로 그들을 거룩하게 해 주소서. 아버지의 말씀이 곧 진리입니다.","tms180-s3-3-1":"그러므로 여러분이 지금 잠깐 동안 온갖 시련 가운데서 어쩔 수 없이 고통을 당할지라도, 진심으로 기뻐하십시오. 이런 시련은 여러분의 믿음이 얼마나 순결한 것인가를 입증하기 위한 시험에 불과한 것으로, 그런 시련을 통해 여러분의 믿음은 비록 불에 의해 정련되더라도 결국엔 사라지고 마는 금보다 더 귀한 것으로 판명되어, 마침내 예수 그리스도께서 오실 때에 여러분은 그분에게서 칭찬과 영광과 존귀를 얻게 될 것입니다.","tms180-s3-3-2":"나의 형제들이여, 살면서 여러 가지 시험을 만나거든, 여러분은 그것을 순전한 기쁨으로 여기십시오. 그러므로 여러분은 무엇보다 인내하는 사람이 되십시오. 인내는 여러분을 온전히 성숙하게 만들어 주어, 여러분으로 하여금 모든 일에 조금도 부족함이 없는 사람이 되게 할 것입니다.","tms180-s3-3-3":"오늘날 우리와 마찬가지로, 과거 우리 조상들도 기쁜 소식을 전해 들었습니다. 하지만 그들이 들은 기쁜 소식은 그들에게 아무런 유익이 되지 못했는데, 그것은 우리 조상들이 그처럼 기쁜 소식을 전해 듣고도, 그것을 믿음으로 받아들이지 않았기 때문입니다.","tms180-s3-3-4":"그때에 나의 의인은 오직 믿음으로 말미암아 살 것이다. 누구든지 믿음에서 물러선다면, 내 마음이 그를 기뻐하지 않을 것이다.” 하였습니다.","tms180-s3-3-5":"또 이 모든 것에 더하여, 손에는 믿음의 방패를 들도록 하십시오. 그래서 그 방패로 악한 자가 쏘는 불화살을 막아 꺼뜨릴 수 있어야 합니다.","tms180-s3-3-6":"오 하나님의 사람 디모데여! 그대는 이 모든 악한 것들을 피하고, 오직 의와 경건과 믿음과 사랑과 오래 참음과 온유함을 추구하도록 하십시오. 믿음을 위해 선한 싸움을 싸우도록 하십시오. 하나님께서 그대에게 주신 영원한 생명을 굳게 붙들도록 하십시오. 하나님께서는 이 영원한 생명을 위해 그대를 부르셨고, 그대는 많은 증인들 앞에서 훌륭하게 믿음을 고백하였습니다.","tms180-s3-3-7":"믿음은 우리가 바라는 것들에 대한 실체요, 보이지 않는 것들에 대한 증거입니다.","tms180-s3-3-8":"그러므로 결국 믿음은 말씀을 듣는 데서부터 시작되고, 또 듣는 것은 그리스도의 말씀에서 비롯됩니다.","tms180-s3-3-9":"그러므로 여러분은 게을러서는 안 됩니다. 오직 믿음과 인내로 약속된 유산을 물려받은 신앙의 인물들을 본받는 자들이 되어야 합니다.","tms180-s3-3-10":"이와 같이 믿음에 행함이 따르지 않는다면, 그 믿음은 죽은 것입니다.","tms180-s3-3-11":"하지만 우리는 율법을 잘 지킨다고 의롭다 인정받는 것이 아니라, 예수 그리스도를 믿어야만 비로소 의롭다 인정받는다는 사실을 알고 있습니다. 그렇기에 우리는 율법을 잘 준행함으로써가 아니라, 그리스도를 믿음으로써 의롭다 인정을 받고자, 이처럼 예수 그리스도를 믿게 된 것입니다. 율법을 지키는 행위로서는 어느 누구도 의롭다 인정받을 수가 없기 때문입니다.","tms180-s3-3-12":"그러므로 우리는 믿음으로 하나님께 의롭다고 인정을 받아, 우리 주 예수 그리스도를 통해 하나님과 더불어 평화를 누리게 되었습니다.","tms180-s4-1-1":"그러나 여러분은 하나님께 감사를 드리십시오! 그분은 우리 주 예수 그리스도를 통하여 우리에게 승리를 주십니다.","tms180-s4-1-2":"그러나 나는 하나님께 감사를 드립니다. 하나님께서는 언제나 우리를 그리스도 안에서 승리의 행렬에 동참하도록 이끄십니다. 또한 우리를 통하여 그리스도에 대한 앎의 향기를 도처에 퍼뜨리게 하십니다.","tms180-s4-1-3":"우리가 들고 싸우는 무기는 육신에 속한 세상 무기가 아닙니다. 그것은 아무리 견고한 요새일지라도 능히 무너뜨리는 하나님의 강력한 무기입니다. 이 무기로 우리는 세상의 모든 궤변을 무찌릅니다. 또한 하나님을 아는 지식에 반대하는 온갖 교만한 사상을 무너뜨리고, 사람들의 모든 사상을 포로로 사로잡아 그리스도께 복종시킵니다.","tms180-s4-1-4":"끝으로 당부를 드립니다. 여러분은 주 안에서, 또 주의 강한 능력으로 담대해지십시오. 마귀의 계략에 당당히 맞설 수 있도록, 하나님의 무기로 온몸을 무장하십시오.","tms180-s4-1-5":"우리 형제들은 어린양의 피와 자신들의 복음 증거로 그 마귀를 이겼으니, 그들은 죽기까지 자기 목숨을 아끼지 않고 마귀와 싸웠다.","tms180-s4-1-6":"그러므로 하나님께 복종하고, 마귀에게 대항하십시오, 그리하면, 마귀가 여러분을 피해 도망칠 것입니다. 하나님을 가까이하십시오. 그러면 하나님께서도 여러분을 가까이하실 것입니다. 죄인들이여, 죄악에서 떠나 손을 씻으십시오. 두 마음을 품은 자들이여, 여러분의 마음을 정결하게 하십시오.","tms180-s4-1-7":"죄 많은 육신에 따라 사는 사람은 오직 육신의 일만을 생각하지만, 성령에 따라 사는 사람은 성령의 일을 생각합니다. 육신을 따르는 생각은 죽음을 가져다 주지만, 성령을 따르는 생각은 생명과 평화를 가져다 줍니다.","tms180-s4-1-8":"오직 주 예수 그리스도로 옷 입고, 세상 정욕을 채우려고 죄 많은 육신의 일을 추구하지 마십시오.","tms180-s4-1-9":"사랑하는 자녀들이여, 여러분은 모두 하나님께로부터 비롯된 자들로서, 거짓 예언자들을 능히 물리쳐 이긴 사람들입니다. 여러분 안에 계신 분이 세상에 있는 악한 자보다 훨씬 더 크시기 때문입니다.","tms180-s4-1-10":"왜냐하면 하나님께로부터 태어난 그분의 자녀들은 누구나 세상을 이길 수 있기 때문입니다. 세상을 이길 수 있는 승리의 길은 이것이니, 곧 우리의 믿음입니다. 정녕 누가 세상을 이길 수 있습니까? 예수께서 하나님의 아들이심을 믿는 자들이 아니고서야, 누가 세상을 이길 수 있단 말입니까?","tms180-s4-1-11":"그들의 마음속에는 항상 하나님의 법이 있으니, 걸려서 넘어지는 일이 없다.","tms180-s4-1-12":"그러므로 여러분은 삼가 죄가 여러분의 죽을 육신을 지배하지 못하게 해서, 여러분이 육신의 정욕에 굴복하는 일이 없도록 하십시오. 여러분은 육신의 한 부분이라도 죄에 내맡겨 죄의 도구가 되게 해서는 안 됩니다. 도리어 죽은 자들 가운데서 살아난 사람들답게 여러분 자신을 하나님께 바쳐야 합니다. 그래서 하나님께서 여러분의 몸의 모든 부분을 의의 도구로 사용할 수 있도록 하십시오.","tms180-s4-2-1":"마지막으로 당부합니다. 형제들이여, 무엇이든 참된 것과 무엇이든 경건한 것과 무엇이든 옳은 것과 무엇이든 거룩한 것과 무엇이든 사랑스러운 것과 무엇이든 칭찬할 만한 것이 있다면, 거기에 무슨 덕이나 칭송이 있든지 모쪼록 그런 것들을 마음속에 생각하고 살도록 하십시오.","tms180-s4-2-2":"깨끗한 마음을 가진 사람들에게는 모든 것들이 깨끗하게 보입니다. 그러나 마음이 부패하여 믿지 않는 자들에게는 깨끗한 것이 아무것도 없습니다. 그들의 마음과 양심이 다 더러워졌기 때문입니다.","tms180-s4-2-3":"선한 사람은 선한 마음으로부터 선한 행동을 하고, 악한 사람은 악한 것이 마음속에 숨어 있어서 자연스레 악한 행동을 한다. 이와 같이 마음속에 들어 있는 것들이 입 밖으로 흘러나오는 법이다.”","tms180-s4-2-4":"무엇보다도 네 마음을 잘 지켜라. 네 마음에서 생명의 샘이 흘러나오기 때문이다.","tms180-s4-2-5":"눈은 몸의 등불입니다. 그러므로 당신의 눈이 좋으면 당신의 온몸이 밝을 것이고,","tms180-s4-2-6":"그러나 나는 여러분에게 말합니다. 여자를 바라보고 음란한 생각을 하는 사람은 이미 마음속으로 그 여자와 간음한 것입니다.","tms180-s4-2-7":"하나님의 뜻은 모쪼록 여러분이 거룩하게 되는 것입니다. 곧 음란한 행위를 멀리하고,","tms180-s4-2-8":"“음식은 배를 채우기 위해 있고, 배는 음식으로 채워지기 위해 있습니다.”―하지만 하나님께서는 음식도 배도 둘 다 모두 없애 버리실 것입니다. 우리 몸은 성적인 문란함을 위해서 있는 것이 아니라, 주님의 영광을 나타내기 위해서 있는 것이며, 또한 주님은 우리 몸을 위해 계십니다.","tms180-s4-2-9":"남을 헐뜯는 나쁜 말은 입 밖에도 내지 말고, 기회가 닿는 대로 다른 사람을 일으켜 세워 주는 선한 말을 해서, 듣는 사람들에게 은혜를 끼치도록 하십시오.","tms180-s4-2-10":"내가 진정으로 당신들에게 말하겠소. 장차 최후의 심판 날에는, 당신들이 내뱉은 아무리 사소한 말이라도 다 스스로 책임을 져야 할 것이오. 당신들이 한 말에 따라 옳은 사람으로 인정받기도 하고, 혹은 죄인으로 판결받기도 할 것이오.”","tms180-s4-2-11":"악은 어떤 종류일지라도 흉내조차 내지 마십시오.","tms180-s4-2-12":"그대는 나이 많은 남자 교인을 거친 말로 나무라지 말고, 마치 아버지를 대하듯이 권면하십시오. 또 젊은 남자에게는 친형제를 대하듯이 권면하십시오. 나이 많은 여자 교인에게는 마치 어머니를 대하듯이 권면하고, 또 젊은 여자에게는 친자매를 대하듯이, 오직 순결한 마음으로 권면하십시오.","tms180-s4-3-1":"너희가 기도할 때 믿고 구하면, 구하는 것이 무엇이든 다 얻을 수 있다.”","tms180-s4-3-2":"“구하십시오! 그러면, 받을 것입니다. 찾으십시오! 그러면, 얻을 것입니다. 두드리십시오! 그러면, 열릴 것입니다. 누구든지 구하면 받고, 찾으면 얻고, 두드리면 열릴 것입니다.","tms180-s4-3-3":"그러므로 당신은 혼자 골방에 들어가서, 문을 닫고 아버지께 기도하십시오. 그리하면 숨어서 지켜보시는 당신의 아버지께서 다 들어주실 것입니다.","tms180-s4-3-4":"이튿날 새벽, 예수께서 날이 밝기도 전에 한적한 곳으로 홀로 나아가 기도하고 계셨다.","tms180-s4-3-5":"너는 내게 부르짖어라. 그러면 내가 네게 응답하겠고, 네가 알지 못하는 크고 놀랍고 비밀스러운 일들을 네게 말해줄 것이다.”","tms180-s4-3-6":"진실로 우리 가운데 역사하시는 하나님의 능력에 따라, 우리가 구하거나 생각하는 것 이상으로 측량할 수 없는 놀라운 일을 행하실 수 있는 하나님께,","tms180-s4-3-7":"하나님 앞에서 우리가 갖는 확신은 이러하니, 곧 무엇이든지 우리가 하나님의 뜻에 따라 구하면, 하나님께서는 언제든지 우리의 기도를 들어주신다는 사실입니다. 또 무엇을 구하든지 하나님께서 우리의 기도를 들어주신다는 것을 안다면, 우리가 하나님께 구한 것들을 그분께로부터 반드시 받게 된다는 것도 압니다.","tms180-s4-3-8":"끊임없이 기도에 힘쓰십시오. 어떤 처지에 놓여 있든, 모든 일에 감사하는 마음을 가지십시오. 이것이 그리스도 예수 안에서 여러분에게 바라시는 하나님의 뜻입니다.","tms180-s4-3-9":"저도 여러분을 위해 주께 계속하여 기도하겠습니다. 만약 그렇게 하지 않으면, 그건 제가 주께 죄를 짓는 일이 될 것입니다. 그리고 무엇이 선하고 옳은 길인지 여러분에게 가르쳐 드리겠습니다.","tms180-s4-3-10":"그래서 예수께서 제자들에게 말씀하셨다. “추수할 것은 많은데, 일꾼들은 턱없이 부족하구나. 그러니 너희는 주인에게 요청하여, 추수할 일꾼들을 추수 밭으로 보내 달라고 하여라.”","tms180-s4-3-11":"그러므로 우리는 예수를 통하여 하나님께 날마다 찬양의 제사를 드립시다. 그렇게 하는 것은, 그분의 이름에 감사하며 우리의 신앙을 고백하는 입술의 열매입니다.","tms180-s4-3-12":"할렐루야! 내 영혼아, 주를 찬양하여라. 내가 평생토록 주님을 찬양하겠고, 이 목숨이 살아 있는 동안, 내가 나의 하나님을 소리 높여 찬양하리라.","tms180-s5-1-1":"하나님께서는 이방인들 가운데 나타난 이 비밀의 영광이 얼마나 풍성한지를 자기 백성들에게 알리려고 하셨습니다. 이 비밀은 여러분 안에 계시는 그리스도, 곧 영광의 소망이십니다. 우리는 바로 이 그리스도를 선포합니다. 우리는 모든 사람이 그리스도 안에서 하나님 앞에 온전히 설 수 있도록 지혜를 다해 가르치고 깨우칩니다.","tms180-s5-1-2":"곧 하나님께서는 그리스도 안에서 이 세상과 화해하심으로써 사람들의 죄를 묻지 않으셨습니다. 이것이 바로 화해의 직분을 맡은 자로서 우리가 세상 모든 사람들에게 전해야 할 화해의 말씀입니다. 그러므로 우리는 그리스도의 대사입니다. 하나님께서는 우리를 시켜서 여러분에게 자신의 말씀을 하십니다. 이제 우리는 그리스도를 대신하여 여러분에게 간청합니다. 여러분은 필히 하나님과 화해하십시오.","tms180-s5-1-3":"오직 우리는 하나님께 임명받는 복음 전도자로서 말했습니다. 우리가 그렇게 한 것은, 우리의 전도가 사람을 기쁘게 하려는 것이 아니라, 우리의 마음속 깊은 곳까지도 살펴보시는 하나님을 기쁘시게 해 드리려는 것입니다.","tms180-s5-1-4":"나는 누구에게도 얽매이지 않은 자유로운 몸이지만, 내 스스로 모든 사람의 종이 되었습니다. 그것은 되도록 많은 사람들을 얻기 위해서입니다.","tms180-s5-1-5":"너희는 ‘아직도 넉 달이 더 지나야 추수 때가 된다.’ 하고 말한다. 그러나 나는 너희에게 말한다. 자, 눈을 들어 들판을 보아라. 벌써 곡식이 다 익어서, 거두어들일 때가 되지 않았느냐?","tms180-s5-1-6":"우리는 이토록 여러분을 극진히 사랑하여, 여러분에게 하나님의 복음을 나누어 주는 데 그치지 않고, 우리의 목숨까지도 기꺼이 내어 줄 정도였습니다. 그것은 참으로 여러분이 우리에게 사랑받는 자들이 되었기 때문입니다.","tms180-s5-1-7":"이 사실은 성경에 기록된 말씀과 똑같습니다. 곧 “의인은 아무도 없다. 한 사람도 없다. 모두가 곁길로 빠져 못된 짓을 저지르는 쓸모없는 사람들뿐이니, 선한 일을 하는 사람은 찾아볼 수 없다. 단 한 사람도 찾을 수가 없다.”","tms180-s5-1-8":"그때에 하나님께서는 하나님을 알지 못한 자들과 우리 주 예수의 복음에 순종하지 않은 자들에게 두려운 형벌을 내리실 것입니다. 곧, 그런 자들은 주 앞에서 추방되고 주의 영광스러운 능력에서 떨어져 나가, 영원한 멸망의 형벌을 받게 될 것입니다.","tms180-s5-1-9":"또 그분께서는 몸소 우리의 모든 죄를 짊어지시고 나무에 달려 죽으셨습니다. 그것은, 우리로 죄에 대해서는 죽고, 의를 위해 살 수 있도록 하시려는 것이었습니다. 진실로 그분께서 매를 맞고 상함으로써 여러분이 낫게 되었습니다.","tms180-s5-1-10":"하나님께서는 우리를 구원해 주시고, 거룩한 삶 가운데로 우리를 부르셨습니다. 이것은 우리의 행실을 보고 그렇게 하신 것이 아니라, 오직 하나님 자신의 은혜와 계획에 따른 것입니다. 이 같은 은혜는 영원 전부터 그리스도 예수 안에서 우리에게 이미 주신 것인데,","tms180-s5-1-11":"만일 여러분이 “예수는 나의 주님이십니다.”라고 입으로 고백하고, 또한 “하나님께서 예수를 죽은 자들 가운데서 살리셨다.”라는 사실을 마음으로 믿으면, 여러분은 구원을 받을 것입니다. 이처럼 사람이 마음으로 믿으면 하나님께 의롭다는 인정을 받게 되고, 입으로 그 믿음을 고백하면 구원을 얻게 됩니다.","tms180-s5-1-12":"나는 그들에게 영원한 생명을 줄 터인데, 그러면 그들은 결코 멸망하지 않을 것이오. 어느 누구도 그들을 내 아버지의 손에서 빼앗아가지 못한다오. 그들을 내게 주신 내 아버지께서는 그 무엇보다도 크고 위대하신 분이라오. 그러므로 온 세상의 그 누구도 그들을 내 아버지의 손에서 빼앗아가지 못한다오.","tms180-s5-2-1":"사람의 눈으로 보기에는 자기가 하는 일이 모두 옳게 보이지만, 주께서는 그 사람을 속마음을 살피시고 다 꿰뚫어 보신다.","tms180-s5-2-2":"생각해 보십시오, 온 세상을 다 얻는다고 해도 자기 생명을 잃어버린다면 무슨 유익이 있겠습니까?","tms180-s5-2-3":"당신들 가운데 누구든지 참으로 하나님의 뜻을 행하려는 사람이 있다면, 그 사람은 내 가르침이 하나님으로부터 온 것인지, 아니면 내가 내 마음대로 말하는 것인지를 알 수 있을 것이오.","tms180-s5-2-4":"그 말을 듣고, 예수께서 그들에게 말씀하셨다. “건강한 사람에게는 의사가 필요하지 않소. 그러나 병든 사람에게는 의사가 필요하오. 나는 의인들을 부르러 이 땅에 온 것이 아니라, 죄인들을 불러 회개시키려고 왔소.”","tms180-s5-2-5":"당신들이 당신들끼리는 서로 영광을 주고받으면서도, 정작 유일하신 하나님께는 영광을 받으려고 애쓰지 않으니, 당신들이 어떻게 믿을 수 있겠소?","tms180-s5-2-6":"따라서 예수께서는 자신을 통해 하나님께로 나아오는 사람들을 온전히 구원하실 수 있습니다. 그것은, 예수께서는 항상 살아계셔서 그들을 위해 중보의 기도를 드리고 계시기 때문입니다.","tms180-s5-2-7":"너는 내일 일을 자랑하지 말라. 오늘 하루 동안에 무슨 일이 일어날는지 네가 어찌 알 수 있으랴!","tms180-s5-2-8":"그렇습니다. 그때가 되면, 우리 각자는 하나님 앞에 자기 일을 낱낱이 자백해야 할 것입니다.","tms180-s5-2-9":"당신들이 성경을 열심히 연구하는 것은, 성경에서 영원한 생명을 얻을 수 있다고 생각하기 때문이오. 그렇소. 그 성경이 바로 나를 증언하고 있소.","tms180-s5-2-10":"사람의 눈에는 바른 길처럼 보일지라도, 결국에는 그 길이 죽음에 이를 수도 있다.","tms180-s5-2-11":"그런 후에, 나는 왼편에 있는 사람들을 향해 이렇게 말할 것이다. ‘저주받은 자들아, 내게서 물러가 마귀와 그 졸개들을 위해 준비해 둔 영원한 불 속으로 들어가라.","tms180-s5-2-12":"세상이 창조된 이후로, 하나님의 보이지 않는 성품 곧 하나님의 영원하신 권능과 신성은 그분이 지으신 만물 가운데 분명히 나타나 있으므로, 사람이 그것을 보고 충분히 깨닫고 알 수 있도록 되어 있습니다. 그러므로 사람들은 하나님을 몰랐다고 핑계를 댈 수 없습니다.","tms180-s5-3-1":"여러분도 이미 알고 있듯이, 여러분이 조상들로부터 물려받은 헛된 생활방식에서 해방되어 참된 구원을 받게 된 것은, 은이나 금같이 장차 없어질 것들로 된 것이 아니라, 오직 한 점의 죄도 없고 흠도 없으신 하나님의 어린 양이신 예수 그리스도의 보배롭고 고귀한 피로 된 것입니다.","tms180-s5-3-2":"이 모든 일은 하나님에게서 비롯된 것입니다. 하나님께서는 독생자 그리스도를 통하여 우리를 자신과 화해하게 하셨고, 나아가 우리에게 화해의 직분을 맡겨 주셨습니다.","tms180-s5-3-3":"그리하여 우리는 그리스도 안에서 하나님의 풍성하신 은혜에 따라 독생자 예수의 피를 통해 죄 용서를 받고 구원을 받았습니다.","tms180-s5-3-4":"죄가 다시는 여러분의 주인이 될 수 없습니다. 이제 여러분은 율법 아래 있는 것이 아니라, 은혜 아래 있기 때문입니다. 그러면 어떻게 해야 하겠습니까? 우리가 율법 아래 있지 않고 은혜 아래 있기 때문에, 죄를 지어도 상관없다는 말입니까? 절대로 그렇지 않습니다.","tms180-s5-3-5":"이제 여러분은 모두 그리스도 예수를 믿음으로써 그분 안에서 하나님의 자녀가 되었습니다.","tms180-s5-3-6":"그러나 여러분은 하나님께서 택하신 족속이요, 왕 같은 제사장들이요, 거룩한 나라요, 하나님의 소유가 된 백성들입니다. 그렇게 된 것은, 여러분을 죄악의 어둠에서 불러내어 자신의 놀라운 구원의 빛 가운데로 인도하신 그분의 은혜를, 여러분들로 하여금 널리 찬양하도록 하기 위해서입니다.","tms180-s5-3-7":"하나님께서는 죄를 전혀 알지도 못하시는 분 곧 그리스도에게 우리 대신 죄를 짊어지게 하셨습니다. 그것은 우리로 그리스도 안에서 하나님께 의롭다는 인정을 받게 하시기 위함이었습니다.","tms180-s5-3-8":"그러나 여러분은 하나님의 부르심을 받고 그리스도 예수 안에 있는 자들입니다. 그리고 그분 예수는 우리에게 하나님께로부터 오는 지혜가 되어 주셨고, 또한 우리의 의로움과 거룩함과 구속함이 되어 주셨습니다.","tms180-s5-3-9":"그리스도께서는 자신이 드린 단 한 번의 희생제사로 거룩하게 된 사람들을 영원토록 온전하게 만들어 주셨습니다.","tms180-s5-3-10":"이처럼 모두가 죄인일지라도, 그리스도 예수께서 마련해 놓으신 죄 사함을 통해 하나님의 은혜로 말미암아 모두가 아무런 대가도 치르지 않고 값없이 하나님께 의롭다는 인정을 받을 수 있습니다.","tms180-s5-3-11":"그러나 우리의 시민권은 하늘에 있습니다. 우리는 거기 하늘로부터 장차 오실 우리의 구원자, 곧 주 예수 그리스도를 간절히 기다리고 있습니다.","tms180-s5-3-12":"오직 그리스도 안에 온갖 충만한 신적 성품이 육신의 형태로 머물고 있습니다. 그리고 여러분도 그분 그리스도 안에서 충만함을 입었습니다. 참으로 그리스도는 모든 통치와 권세의 머리가 되시는 분이십니다.","dep242-1-1":"여러분은 자신의 믿음을 잘 살펴, 여러분 자신을 스스로 시험해 보십시오. 여러분은 그리스도 예수께서 여러분 안에 계시다는 것을 실감하고 계십니까? 만일 그렇지 않다면, 말할 나위도 없이 여러분은 시험에서 떨어진 것입니다.","dep242-1-2":"또한 우리를 향한 하나님의 증언은 이것입니다. 곧 하나님께서 우리에게 영원한 생명을 주셨다는 것과, 그 생명이 자기 아들 예수 그리스도 안에 있다는 것입니다. 그러므로 하나님의 증언을 받아들여 그분의 아들을 모신 사람은 생명을 가진 자요, 하나님의 증언을 배척하여 그분의 아들을 모시지 않은 사람은 생명을 갖지 못한 자입니다.","dep242-1-3":"내가 진정으로 당신들에게 밝히 말하겠소. 누구든지 나를 믿는 사람에게는 영원한 생명이 있소.","dep242-1-4":"내가 하나님의 아들 예수의 이름을 믿고 있는 여러분에게 이 같은 글을 써 보내는 것은, 여러분이 영원한 생명을 갖고 있다는 사실을 알게 하기 위함입니다.","dep242-1-5":"그리하여 우리는 그리스도 안에서 하나님의 풍성하신 은혜에 따라 독생자 예수의 피를 통해 죄 용서를 받고 구원을 받았습니다.","dep242-1-6":"그러므로 이제 그리스도 예수께 속한 사람은 결코 정죄 받는 일이 없습니다.","dep242-1-7":"이처럼 모두가 죄인일지라도, 그리스도 예수께서 마련해 놓으신 죄 사함을 통해 하나님의 은혜로 말미암아 모두가 아무런 대가도 치르지 않고 값없이 하나님께 의롭다는 인정을 받을 수 있습니다.","dep242-1-8":"그러므로 우리는 믿음으로 하나님께 의롭다고 인정을 받아, 우리 주 예수 그리스도를 통해 하나님과 더불어 평화를 누리게 되었습니다.","dep242-1-9":"우리 주 예수 그리스도의 아버지 하나님께 찬양을 드립시다. 하나님께서는 헤아릴 길 없는 그 크신 자비하심으로 우리를 거듭나게 하시고, 죽은 자들 가운데서 다시 살아나신 예수 그리스도로 말미암아 산 소망을 갖게 하심으로써,","dep242-1-10":"우리를 그런 죄악의 구렁텅이 속에서 구원해 주셨습니다. 그것은, 우리에게 구원받을 의로운 행위가 있었기 때문이 결코 아니라, 오직 하나님의 크신 은혜와 자비하심에 따라, 우리를 거듭나게 씻어 주시고 또 성령으로 새롭게 해주셨기 때문입니다.","dep242-1-11":"왜냐하면 누구든지 하나님의 영 곧 성령에 의해 인도받는 사람들은 하나님의 자녀들이기 때문입니다.","dep242-1-12":"이제 여러분은 모두 그리스도 예수를 믿음으로써 그분 안에서 하나님의 자녀가 되었습니다.","dep242-1-13":"그러나 여러분 안에 하나님의 성령이 거하시면, 여러분은 육신에 따르지 않고 성령에 따라 살게 됩니다. 누구든지 그리스도의 영이 없으면, 그 사람은 그리스도의 사람이 아니므로 그리스도께 속할 수 없습니다.","dep242-1-14":"그러면 내가 아버지께 구할 것이고, 아버지께서는 다른 ‘돕는 분’을 너희에게 보내셔서, 너희와 영원히 함께하게 하실 것이다. 그분은 진리의 영이시다. 세상은 그분을 받아들일 수 없다. 세상은 그분을 보지도 못하고, 알지도 못하기 때문이다. 그러나 너희는 그분을 알고 있다. 그분이 너희와 함께 살고, 또 너희 안에 계실 것이기 때문이다.","dep242-1-15":"아무리 높은 곳도, 아무리 깊은 곳도, 그리고 세상의 그 어떤 피조물일지라도, 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 결코 떼어놓을 수 없습니다.","dep242-1-16":"나는 그들에게 영원한 생명을 줄 터인데, 그러면 그들은 결코 멸망하지 않을 것이오. 어느 누구도 그들을 내 아버지의 손에서 빼앗아가지 못한다오. 그들을 내게 주신 내 아버지께서는 그 무엇보다도 크고 위대하신 분이라오. 그러므로 온 세상의 그 누구도 그들을 내 아버지의 손에서 빼앗아가지 못한다오.","dep242-1-17":"그리고 여러분은 그리스도 안에서 진리의 말씀, 곧 여러분을 구원하는 복음을 듣고 그리스도를 믿었으므로, 그에 대한 증표로 하나님께서는 약속하신 성령으로 여러분 각자를 도장 찍으셨습니다.","dep242-1-18":"여러분이 거듭 태어난 것은, 이 세상의 썩어질 씨로 된 것이 아니라 썩지 않을 씨 곧 언제까지나 영원토록 살아 있는 하나님의 말씀으로 되었습니다.","dep242-2-1-1":"그러나 주께서는 너희에게 다시 은혜를 베풀 수 있기를 간절히 기다리시고, 마침내 너희를 불쌍히 여기셔서 너희를 도우시러 일어나신다. 진실로 우리 주님은 공의의 하나님이시다. 그러므로 복 되도다, 주를 기다리는 모든 사람들이여!","dep242-2-1-2":"여러분을 부르셔서, 자신의 독생자이신 우리 주 예수 그리스도와 교제하며 사귈 수 있도록 해주신 하나님께서는 진실로 신실하신 분이십니다.","dep242-2-1-3":"너희는, 주를 만날 수 있을 때 주를 힘껏 찾아라. 너희는, 그분께서 가까이 계실 때 그분을 열심히 불러라.","dep242-2-1-4":"주께서 이르시길 “너는 내게로 와서 나를 경배하라.” 하셨을 때, “주여, 이 몸이 가서 주를 경배하겠습니다.” 하고 대답하였으니,","dep242-2-1-5":"나는 포도나무요, 너희는 가지다. 그러므로 누구든지 그가 내 안에 살고, 또 내가 그 안에 살면, 그는 많은 열매를 맺게 될 것이다. 너희가 나를 떠나서는 아무것도 할 수 없다.","dep242-2-1-6":"비록 젊은 사자들은 먹이를 잃고 굶주릴지라도, 주를 찾는 사람은 온갖 복을 다 받아 무엇 하나 부족할 것이 없으리라.","dep242-2-1-7":"내가 주님을 믿고 의지하오니, 아침마다 주님의 한결같은 사랑의 말씀을 듣게 해 주소서. 내 영혼을 주님께 바치오니, 내가 마땅히 가야 할 길을 알려 주소서. 주님은 나의 하나님이시니, 내가 오직 주님의 뜻에 따라 살아갈 수 있도록 그 길을 내게 가르쳐 주소서. 주님의 영은 선하오니, 그 선하신 영으로 나를 평탄한 길로 이끌어 주소서.","dep242-2-1-8":"그때에 내가 스스로 말하기를 “이제 내가 초소에 올라가서 서고, 망대에 올라가서 서겠다. 그런 뒤에 주께서 내게 무슨 말씀을 하실지 내가 기다리고, 나의 호소에 대해 주께서 어떤 답변을 하실지 내가 지켜보겠다.” 하였다.","dep242-2-2-1":"오 나의 영혼아, 어찌 그리 풀이 죽어 낙심하느냐? 어찌 그리 불안해하며 괴로워하느냐? 오직 너는 하나님을 소망하며 살아라. 이제 나는 내 구원자이신 나의 하나님을 도리어 찬양하며 살리로다.","dep242-2-2-2":"우리는 오직 믿음의 창시자이시요 완성자이신 예수만을 바라봅시다. 그분은 자기 앞에 놓여 있는 영광스런 기쁨을 위해 모든 부끄러움을 조금도 개의치 않으시고 십자가의 고통을 견뎌 내셔서, 마침내 하나님의 보좌 오른편에 앉으셨습니다.","dep242-2-2-3":"주여, 내가 애타게 주님을 바라고, 내 영혼이 간절하게 주님을 기다립니다. 나는 내 모든 소망을 오직 주님의 말씀 위에 두고 있습니다. 파수꾼이 아침 오기를 기다리는 것보다 내 영혼이 더욱더 주님을 기다립니다. 진실로 파수꾼이 아침 오기를 기다리는 것보다 내가 더욱더 애타게 주님을 기다립니다.","dep242-2-2-4":"오 하나님이시여, 목마른 사슴이 헐떡거리며 시냇물을 애타게 찾듯이, 내 영혼이 목이 말라 헐떡거리며 주를 찾습니다.","dep242-2-2-5":"너는 네 짐을 주께 맡겨라. 주께서 너를 붙들어 주시리라. 주께서는 올바르게 살려고 하는 의인을 망하도록 내버려두지 않으신다.","dep242-2-2-6":"너희는 소리 높여 주를 찬양하여라. 그분께서는 날마다 우리의 무거운 짐을 대신 짊어져주시는, 우리의 구원자이시도다. (셀라)","dep242-2-2-7":"네가 주님을 너의 피난처로 삼고, 지극히 높으신 분을 너의 거처로 삼았으니, 어떤 불행도 너를 덮치지 못하겠고, 어떤 재앙도 네 집 가까이에 이르지 못하리라.","dep242-2-2-8":"“수고하고 무거운 짐을 진 자들이여, 다 내게로 오십시오. 내가 여러분을 편히 쉬게 하겠습니다. 나는 온유하고 겸손하니, 누구든지 내 멍에를 메고 내게서 배우십시오. 그리하면, 여러분의 마음이 참된 안식을 얻을 것입니다.","dep242-2-2-9":"내가 나의 모든 소망을 주님의 말씀에 두었으므로, 동이 트기도 전에 일어나 주께 부르짖습니다. 또한 내가 주님의 말씀을 깊이 묵상하느라, 뜬 눈으로 밤을 지새웁니다.","dep242-2-2-10":"주여, 주께서는 아침마다 내 목소리를 들으시니, 내가 아침에 내 사정을 주께 다 아뢰고, 겸손히 주의 응답을 기다리겠습니다.","dep242-2-2-11":"그러므로 오라, 모두 와서 우리 다 함께 주님 앞에 엎드려 경배를 드리자. 우리를 지으신 주님 앞에 무릎을 꿇자.","dep242-2-2-12":"그러므로 우리는 예수를 통하여 하나님께 날마다 찬양의 제사를 드립시다. 그렇게 하는 것은, 그분의 이름에 감사하며 우리의 신앙을 고백하는 입술의 열매입니다.","dep242-2-2-13":"주님의 그칠 줄 모르는 사랑으로 아침마다 우리를 흡족히 채워주셔서, 우리로 한평생 기뻐하고 즐거워하게 해주소서.","dep242-2-2-14":"진실로 주님께서는 목마른 심령에게 실컷 물을 들이키게 하셨고, 배고픈 영혼에게 맘껏 좋은 음식을 먹게 하셨도다.","dep242-2-3-15":"이튿날 새벽, 예수께서 날이 밝기도 전에 한적한 곳으로 홀로 나아가 기도하고 계셨다.","dep242-2-3-1":"주께서는 마치 다정한 벗과 이야기를 나누는 것처럼 모세와 얼굴을 마주보고 말씀을 나누셨다. 모세가 다시 진지로 돌아온 뒤에도, 모세의 젊은 보좌관인 눈의 아들 여호수아는 그 장막을 떠나지 않았다.","dep242-2-3-2":"다니엘도 왕의 도장이 찍힌 이 같은 금지령이 공포된 것을 알았다. 그럴지라도 다니엘은 자기 집으로 돌아간 후, 그 창문이 예루살렘 쪽으로 나 있는 다락방으로 올라갔다. 그리고 그는 평소에 행하던 습관대로 하루에 세 번씩 무릎을 꿇고 하나님께 기도하며 감사드렸다.","dep242-2-3-3":"그래서 비유가 아니면 말씀하시지 않으셨지만, 제자들과 함께 있을 때는 그 뜻을 따로 설명해 주셨다.","dep242-3-1-1":"성경 속의 모든 예언들은 사람의 뜻에 따라 나온 것이 아니라, 오직 성령의 감동을 받은 사람들이 하나님께로부터 전해 받은 말씀을 선포한 것이기 때문입니다.","dep242-3-1-2":"성경의 모든 책들은 하나님의 영감을 받아 기록된 것으로, 참된 진리가 무엇인지 가르치고, 책망을 통해 잘못을 바로잡게 하고, 또 의로써 훈련시키기에 아주 유익한 책입니다.","dep242-3-1-3":"하늘과 땅은 없어질지라도, 내가 한 말은 결단코 없어지지 않을 것이다.”","dep242-3-1-4":"기록되기를 “모든 육체는 풀과 같고, 그의 모든 영광은 들에 핀 풀의 꽃과 같도다. 풀은 이내 시들고 꽃은 쉬이 떨어지지만, 주님의 말씀은 영원토록 있도다.”라고 했습니다. 바로 이것이 여러분에게 전파된 기쁜 소식입니다.","dep242-3-1-5":"아버지여, 진리로 그들을 거룩하게 해 주소서. 아버지의 말씀이 곧 진리입니다.","dep242-3-1-6":"주여, 주님께서는 참으로 하나님이십니다! 주님의 말씀은 언제나 신실하십니다. 주께서는 주의 종에게 이토록 선한 일들을 약속해 주셨습니다.","dep242-3-1-7":"나 주가 말한다. 내 말은 활활 타오르는 불과 같고, 바위를 산산조각으로 부수는 망치와 같다.","dep242-3-1-8":"나는 이 복음을 위해 고난을 겪고 있고, 죄수처럼 감옥에 갇혀 있습니다. 그러나 비록 나는 쇠사슬에 묶여 있지만, 하나님의 말씀은 결코 묶여 있지 않습니다.","dep242-3-1-9":"예수께서 대답하셨다. “성경에 기록되기를 ‘사람이 빵으로만 사는 것이 아니라, 하나님의 입에서 나오는 모든 말씀으로 산다.’하였다.”","dep242-3-1-10":"그러고 나서 예수께서는 모세부터 시작해서 구약의 예언자들이 기록해 놓은 구절들을 일일이 인용해 가면서, 예수 자신에 관해 적혀 있는 것들을 일일이 설명해 주셨다.","dep242-3-2-1":"여러분이 거듭 태어난 것은, 이 세상의 썩어질 씨로 된 것이 아니라 썩지 않을 씨 곧 언제까지나 영원토록 살아 있는 하나님의 말씀으로 되었습니다.","dep242-3-2-2":"하나님께서는 자신의 기쁘신 뜻에 따라 진리의 말씀으로 우리를 낳아 주셔서, 우리로 하여금 모든 피조물들 가운데 첫 열매가 되게 하셨습니다.","dep242-3-2-3":"이제 갓 태어난 아기들처럼, 순수하고 신령한 말씀의 젖을 간절히 사모하십시오. 그래야 그 젖을 먹고, 구원에 이르도록 자라날 수 있기 때문입니다.","dep242-3-2-4":"이제 나는 하나님과 그분의 은혜로운 말씀에 여러분을 온전히 맡깁니다. 그 말씀이 여러분의 신앙을 바로 세워 줄 것이고, 또한 하나님을 위해서 거룩하게 구별된 사람들이 상속받는 유산을 여러분도 차지하게 해줄 것입니다.","dep242-3-2-5":"주님의 말씀은 내 발을 인도하는 등불이요, 내 길을 비춰주는 빛입니다.","dep242-3-2-6":"네가 길을 갈 때 그것이 너를 인도해 줄 것이고, 네가 잠잘 때에 그것이 너를 지켜줄 것이다. 네가 깨어 있을 때에는 그것이 네게 말을 걸어 조언해 줄 것이다. 참으로 그 명령은 등불이요, 그 가르침은 빛이며, 그 훈계의 꾸지람은 생명의 길이니,","dep242-3-2-7":"말씀으로써 그들을 고쳐 주셨고, 파멸의 구덩이에서 그들을 건져 주셨다.","dep242-3-2-8":"그러자 그 백부장이 말하였다. “주님, 저는 주님을 제 집에 모실 자격조차 없습니다. 주님이 이 자리에서 나으라고 말씀만 하셔도 제 하인은 나을 것입니다.","dep242-3-2-9":"전능하신 만군의 주 하나님이시여, 저는 주님의 이름으로 불리는 자입니다. 주님의 말씀이 제게 내리면, 저는 그 말씀을 그대로 받아 삼켰습니다. 진실로 주님의 말씀은 저의 기쁨과 즐거움이었습니다.","dep242-3-2-10":"진실로 주의 법은 나의 영원한 유산이요, 내 마음의 참된 기쁨입니다.","dep242-3-2-11":"그리고 머리에는 구원의 투구를 쓰고, 무엇보다 하나님의 말씀인 성령의 칼을 손에 쥐십시오.","dep242-3-2-12":"참으로 하나님의 말씀은 살아 있고, 능력이 넘치며, 어떤 양날의 칼보다도 더 날카롭기 때문에, 우리의 영과 혼까지 능히 찔러 쪼개며, 관절과 골수까지 충분히 꿰뚫어서 파고듭니다. 뿐만 아니라, 하나님의 말씀은 우리의 마음속에 있는 생각이나 의도조차도 모조리 다 밝혀냅니다.","dep242-3-3-1":"베뢰아 사람들은 데살로니가 사람들보다 마음 씀씀이가 훨씬 고상했다. 그들은 기쁜 마음으로 말씀을 받아들이고, 바울이 말한 것이 맞는지를 알아보려고 날마다 성경을 연구했다.","dep242-3-3-2":"오, 내가 참으로 주님의 법을 얼마나 사랑하는지요! 하루 종일 주님의 법을 묵상합니다.","dep242-3-3-3":"에스라는 이전부터 온 마음을 다해 주의 율법을 깊이 연구하고 신실하게 실천했으며, 나아가 이스라엘 백성들에게 주의 율법과 규례를 가르치기로 결심하고 그 일에 전적으로 헌신하였다.","dep242-3-3-4":"나는 지금껏 그분의 입술에서 나오는 계명을 어긴 일이 없고, 그분의 입에서 나오는 말씀을 내 매일의 양식보다 더 귀히 여겼건만!","dep242-3-3-5":"시몬이 대답했다. “선생님, 저희가 밤새도록 애써 곳곳에 그물을 내렸지만, 한 마리도 잡지 못했습니다. 그러나 선생님께서 그렇게 말씀하시니, 한번 더 그물을 내려 보겠습니다.” 시몬이 깊은 데로 나가 그물을 내렸더니, 과연 그물이 가득 차서 찢어질 정도로 엄청난 양의 고기가 잡혔다.","dep242-3-4-1":"그러므로 결국 믿음은 말씀을 듣는 데서부터 시작되고, 또 듣는 것은 그리스도의 말씀에서 비롯됩니다.","dep242-3-4-2":"그러자 예수께서 대답하셨다. “그렇소. 그러나 그보다 더욱 복 받은 자들은 하나님의 말씀을 듣고 순종하는 사람들이오.”","dep242-3-4-3":"이 예언의 말씀들을 읽는 사람들과 듣는 사람들 및 그 가운데 기록된 것들을 지키는 사람들은 복 있는 사람들입니다. 여기 기록된 예언들이 이루어질 때가 가까이 이르렀기 때문입니다.","dep242-3-4-4":"항상 가까운 곳에 두고 평생 동안 읽어야 합니다. 그럼으로써 왕은 주를 경외하는 법을 배우고, 또한 이 율법책의 모든 말씀과 규정들을 실천해야 합니다.","dep242-3-4-5":"베뢰아 사람들은 데살로니가 사람들보다 마음 씀씀이가 훨씬 고상했다. 그들은 기쁜 마음으로 말씀을 받아들이고, 바울이 말한 것이 맞는지를 알아보려고 날마다 성경을 연구했다.","dep242-3-4-6":"오직 그대는 진리의 말씀을 올바르게 가르치는, 조금도 부끄러울 것이 없는 일꾼으로 하나님께 인정받을 수 있도록 최선을 다해 힘쓰십시오.","dep242-3-4-7":"내가 오늘 여러분에게 명하는 주님의 말씀을 항상 마음에 품고 사십시오.","dep242-3-4-8":"내 아들아, 내가 이르는 말을 꼭 지키고, 나의 명령을 마음속 깊이 새겨 두어라. 나의 가르침을 반지 끼듯 네 손가락에 끼고, 나의 교훈을 네 마음 판에 새기고 다녀라.","dep242-3-4-9":"복 있는 사람은 악한 사람들의 꾀를 따르지 아니하고, 죄인들의 길에 들어서지 아니하며, 하나님을 비웃는 거만한 사람들과 자리를 함께 하지 않으며, 오직 주의 교훈을 즐거워하면서, 그 교훈을 밤낮으로 읊조리며 깊이 생각하는 사람이다.","dep242-3-4-10":"이 율법책을 네 입술에서 떨어지지 않도록 하여라. 밤낮으로 그 율법책을 묵상하고, 거기에 쓰인 그대로 행하도록 하여라. 그러면 너는 무슨 일이든지 다 잘 되어 크게 번영할 것이다.","dep242-4-1-1":"끊임없이 기도에 힘쓰십시오.","dep242-4-1-2":"기도에 힘쓰십시오. 감사하는 마음으로 기도하면서, 항상 깨어 있도록 하십시오.","dep242-4-1-3":"세상 만물의 마지막이 가까이에 이르렀습니다. 그러므로 여러분은 정신을 바짝 차리고, 삼가 조심하면서 힘써 기도하십시오.","dep242-4-1-4":"그러므로 이제 나는 그대에게 당부합니다. 무엇보다 먼저, 모든 사람을 위해 간구와 기도와 중보기도와 감사를 하나님께 드리십시오. 왕들과 높은 자리에 있는 모든 사람들을 위해서도 그처럼 기도하십시오. 그래야 사회 질서가 안정되고 평화로운 가운데, 우리가 경건하고 거룩한 신앙생활을 잘 영위해 나갈 수가 있기 때문입니다.","dep242-4-2-1":"너희가 내 이름으로 아버지께 구하는 것은 무엇이든지 내가 다 이루어 줄 것이다. 그리하여야 아들이 아버지께 영광을 돌릴 수 있게 될 것이기 때문이다. 그러므로 너희는 구하라. 내 이름으로 무엇이든지 구하라. 그리하면, 내가 다 이루어 주겠다.”","dep242-4-2-2":"진실로 우리 가운데 역사하시는 하나님의 능력에 따라, 우리가 구하거나 생각하는 것 이상으로 측량할 수 없는 놀라운 일을 행하실 수 있는 하나님께,","dep242-4-2-3":"너는 내게 부르짖어라. 그러면 내가 네게 응답하겠고, 네가 알지 못하는 크고 놀랍고 비밀스러운 일들을 네게 말해줄 것이다.”","dep242-4-2-4":"혹 여러분 가운데 누구든지 지혜가 부족하거든, 하나님께 지혜를 달라고 간구하십시오. 그러면 조금도 나무라는 일 없이 너그럽게 후히 주시는 하나님께서는 간구하는 모든 이들에게 지혜를 풍성하게 부어 주실 것입니다.","dep242-4-2-5":"내가 주를 찾아 그분께 간구하였더니, 주께서 내 기도를 들어 주셨네. 주께서 두려워 떨고 있는 나를 건져 주셨네.","dep242-4-2-6":"너희는 고통과 재난의 날에 나를 부르라. 내가 너희를 건져 주리니, 그러면 너희가 내게 영광을 돌리게 되리라.”","dep242-4-2-7":"기도가 끝나자, 신자들이 모여 있던 곳이 크게 흔들렸다. 그들은 모두 성령으로 충만해져서, 하나님의 말씀을 담대하고 힘차게 전하였다.","dep242-4-2-8":"또 우리를 위해서도 기도해 주십시오. 기도할 때, 하나님께서 우리에게 전도의 문을 활짝 열어 주셔서, 우리가 그리스도의 비밀을 담대히 선포할 수 있도록 해 달라고 간구하십시오. 지금 나는 이 일 때문에 갇혀 있는 몸이 되었습니다.","dep242-4-3-1":"그러므로 구하라. 지금까지는 너희가 내 이름으로 아무것도 구하지 않았다. 그러나 이제 내 이름으로 힘껏 구하라. 그러면 너희는 받게 될 것이고, 너희 잔은 기쁨으로 넘칠 것이다.”","dep242-4-3-2":"너희가 기도할 때 믿고 구하면, 구하는 것이 무엇이든 다 얻을 수 있다.”","dep242-4-3-3":"어떤 경우에든지 성령 안에서 하나님께 간구하고 기도하십시오. 이것을 위하여 항상 깨어 모든 일을 참고 견디면서, 모든 성도를 위해 간구하기를 게을리 하지 마십시오.","dep242-4-3-4":"하나님 앞에서 우리가 갖는 확신은 이러하니, 곧 무엇이든지 우리가 하나님의 뜻에 따라 구하면, 하나님께서는 언제든지 우리의 기도를 들어주신다는 사실입니다. 또 무엇을 구하든지 하나님께서 우리의 기도를 들어주신다는 것을 안다면, 우리가 하나님께 구한 것들을 그분께로부터 반드시 받게 된다는 것도 압니다.","dep242-4-3-5":"만일 내가 마음속에 죄악을 품었더라면, 어찌 주께서 내 기도에 응답해 주셨으랴!","dep242-4-3-6":"그 결과, 우리가 구하는 것들은 무엇이든 하나님께 다 받을 수 있을 것입니다. 왜냐하면, 우리가 하나님의 계명을 잘 지킴으로써 그분께서 기뻐하시는 일을 행하고 있기 때문입니다.","dep242-4-3-7":"내가 또 진정으로 거듭 말한다. 너희 중에 두 사람이 땅 위에서 마음을 합하여 무엇이든지 구하면, 하늘에 계신 내 아버지께서 그들에게 이루어 주실 것이다.","dep242-4-3-8":"“구하십시오! 그러면, 받을 것입니다. 찾으십시오! 그러면, 얻을 것입니다. 두드리십시오! 그러면, 열릴 것입니다.","dep242-4-3-9":"그때가 되어 너희가 나를 찾고 나에게 와서 기도하면, 내가 너희의 기도를 들어줄 것이다. 너희가 온전한 마음으로 나를 찾고 찾으면, 너희는 반드시 나를 만날 것이다.","dep242-4-3-10":"그러나 만일 너희가 회개하고 내게로 돌아와서 내 계명을 다시 존중하고 실천하면, 너희가 하늘 끝으로 쫓겨났을지라도 내가 거기서 너희를 불러 모아 다시 데려오겠다. 곧 너희를 모은 후 다시 고향 땅으로 데려와서, 내가 내 이름을 둘 거처로 선택한 그 땅에서 살도록 하겠다.’ 하시지 않았습니까?","dep242-4-4-1":"다니엘도 왕의 도장이 찍힌 이 같은 금지령이 공포된 것을 알았다. 그럴지라도 다니엘은 자기 집으로 돌아간 후, 그 창문이 예루살렘 쪽으로 나 있는 다락방으로 올라갔다. 그리고 그는 평소에 행하던 습관대로 하루에 세 번씩 무릎을 꿇고 하나님께 기도하며 감사드렸다.","dep242-4-4-2":"그러나 예수에 대한 소문은 금세 널리 퍼져 나갔고, 사람들은 예수의 말씀도 듣고, 또 자기들의 병도 고침 받기 위해 떼를 지어 예수께로 몰려들었다. 그러나 예수께서는 사람들을 피해 한적한 곳으로 물러나셔서, 종종 홀로 기도하셨다.","dep242-4-4-3":"어느 날, 예수께서 따로 산에 올라가, 밤이 새도록 열심히 기도하셨다.","dep242-4-4-4":"엘리야를 보십시오. 그는 우리와 똑같은 본성을 지닌 사람이었지만, 비가 오지 않기를 간절히 기도했더니, 무려 3년 반 동안이나 한 방울의 비도 오지 않았지 않습니까? 그런데 그가 다시 비가 오게 해 달라고 간절히 기도했더니, 하늘에서 비가 주룩주룩 쏟아져 땅에서 곡식들이 다시 자라나지 않았습니까?","dep242-4-4-5":"한밤중이었다. 바울과 실라는 주께 기도하면서 찬송을 불렀고, 다른 죄수들은 그 찬송 소리를 듣고 있었다.","dep242-4-5-1":"주여, 위대함과 능력과 영광과 승리와 존귀와 위엄이 모두 주의 것입니다. 하늘과 땅에 있는 모든 것들은 다 주의 것입니다. 이 땅의 모든 통치권과 주권도 모두 주의 것입니다. 그러므로 우리는 지금 우리 하나님께 감사를 드리며, 주님의 영광스러운 이름을 높이 찬양합니다.","dep242-4-5-2":"그러므로 이제 나는 그대에게 당부합니다. 무엇보다 먼저, 모든 사람을 위해 간구와 기도와 중보기도와 감사를 하나님께 드리십시오. 왕들과 높은 자리에 있는 모든 사람들을 위해서도 그처럼 기도하십시오. 그래야 사회 질서가 안정되고 평화로운 가운데, 우리가 경건하고 거룩한 신앙생활을 잘 영위해 나갈 수가 있기 때문입니다.","dep242-4-5-3":"어떤 처지에 놓여 있든, 모든 일에 감사하는 마음을 가지십시오. 이것이 그리스도 예수 안에서 여러분에게 바라시는 하나님의 뜻입니다.","dep242-4-5-4":"그러나 우리가 죄인임을 인정하고 스스로 죄를 고백하면, 하나님께서는 참으로 신실하고 의로우신 분이시므로 우리의 죄를 다 용서해 주시고, 모든 불의에서 우리를 깨끗하게 해주실 것입니다.","dep242-4-5-5":"어떤 일이든, 걱정하지 마십시오. 무슨 일을 당할지라도, 오직 기도와 간구로 여러분이 하나님께 바라는 것을 감사하는 마음으로 아뢰도록 하십시오. 그렇게 하면, 모든 인간적인 헤아림을 뛰어넘는 하나님의 평강이 여러분의 마음과 생각을 그리스도 예수 안에서 지켜 주실 것입니다.","dep242-5-1-1":"그처럼 그때에 하나님에게서 그렇게도 멀리 떨어져 있었던 여러분이 이제는 그리스도 예수 안에서 그리스도의 십자가 피로 하나님과 가까워졌습니다.","dep242-5-1-2":"그 아들을 통하여 만물과 기꺼이 화해하셨습니다. 곧 하늘에 있는 것이나 땅에 있는 것이나, 온 세상의 모든 피조물들이 십자가 위에서 죽으신 그 아들 그리스도의 피로 말미암아 하나님과 화해함으로써 참 평화를 이루게 된 것입니다.","dep242-5-1-3":"이처럼 우리가 보고 들은 것을 여러분에게 전파하는 것은, 여러분도 우리와 함께 서로 교제를 나누도록 하기 위함입니다. 이 같은 우리의 교제에는 아버지 하나님과 그분의 아들 예수 그리스도도 함께 하십니다.","dep242-5-1-4":"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 사귐이 여러분 모두에게 함께하시기를 빕니다.","dep242-5-2-1":"두세 사람이 내 이름으로 모인 그곳에는 나도 그들 가운데 그들과 함께 있다.”","dep242-5-2-2":"형제가 서로 어울려 한 마음으로 사이좋게 지내는 것은 그 얼마나 아름답고 보기에 좋은가! 헤르몬 산의 이슬이 시온 산 위에 수북이 내리는 것 같도다. 주께서는 그 시온 산에서 복을 베푸셨으니, 그 복은 곧 영생이로다.","dep242-5-2-3":"도리어 여러분은 ‘오늘’이라고 말할 수 있는 매일의 그날그날 동안에 서로 권면하고 격려하여, 아무도 죄의 유혹에 빠져 마음이 완고해지는 일이 없도록 하십시오.","dep242-5-2-4":"내가 또 깨닫고 보니, 혼자보다는 둘이 더 낫다. 혼자서 애쓰는 것보다는 둘이서 함께 일하고 노력할 때 더욱 좋은 결과를 얻을 수 있기 때문이다. 둘이면, 길을 가다가 그중에 한 사람이 넘어지면 다른 한 사람이 얼른 자기 동무를 일으켜 줄 수 있다. 그러나 혼자 가다가 넘어지면, 불쌍하게도 그를 일으켜 줄 사람이 아무도 없다.","dep242-5-2-5":"그러므로 그대는 청년의 정욕을 피하고, 주를 찾는 이들과 함께 순결한 마음으로 의로움과 믿음과 사랑과 화평을 추구하도록 하십시오.","dep242-5-2-6":"쇠는 쇠로써 비벼대야 강하고 날카로워지듯, 사람도 다른 사람들과 어울리고 부대껴야 그 지혜가 예리하게 된다. 물속에 사람의 얼굴이 비치듯이, 사람의 마음도 그 사람의 얼굴에 나타나 있다.","dep242-5-2-7":"지혜로운 사람과 어울려 함께 길을 떠나면 지혜를 얻지만, 어리석은 자와 어울리면 끝내 해를 입는다.","dep242-5-2-8":"그리하여 우리 모두는 하나님의 아들 예수 그리스도를 믿는 일과 아는 일에 하나가 되고, 나아가 더욱 온전한 모습으로 성숙해져서, 마침내 그리스도의 충만하심의 경지에까지 이르게 됩니다.","dep242-5-2-9":"그들은 열심을 내어 사도들의 가르침을 받고, 서로 교제하면서 빵을 떼어 음식을 함께 나누어 먹고, 기도하는 일에도 전적으로 힘썼다. 하나님을 찬양했다. 그래서 이를 본 사람들은 믿는 사람들을 칭찬하였다. 주께서는 날마다 구원받는 사람들의 숫자를 더하여 주셨다.","dep242-5-3-1":"여러분이 그리스도의 복음을 처음 듣던 그날부터 오늘에 이르기까지, 여러분은 복음을 전하는 일에 나의 좋은 동반자 역할을 해주었기 때문입니다. 여러분이 무슨 일을 겪든, 오직 그리스도의 복음에 합당하게 처신하십시오. 내가 여러분을 만나러 가든, 혹은 여러분을 떠나서 여러분에 관한 소식만 듣게 되든, 여러분은 하나의 영으로 굳게 서서, 복음의 신앙을 위하여 한 사람처럼 매진하도록 하십시오.","dep242-5-3-2":"그리고 우리는 서로를 사랑하고, 선한 일을 하도록 피차 돌아보고 격려합시다. 어떤 사람들의 잘못된 습관처럼, 우리는 함께 모이는 일을 절대로 소홀히 하지 말고, 도리어 서로를 격려하고 권면하는 가운데 주의 재림의 날이 가까워 오는 것을 볼수록 더욱 힘써 모이도록 합시다.","dep242-5-3-3":"내가 여러분에게 자신 있게 말할 수 있는 것은, 그들은 자기들이 할 수 있는 만큼 힘닿는 대로 힘껏 헌금했을 뿐만 아니라, 도리어 힘에 지나도록 헌금을 했다는 사실입니다. 그들은 어려움에 처한 성도들을 구제할 수 있는 특권에 동참하게 해 달라고, 우리에게 간절히 부탁했습니다.","dep242-5-3-4":"도리어 그런 시련을 통해 여러분이 그리스도의 고난에 함께 참여하게 된 것을 기뻐하십시오. 그러면 장차 그리스도의 영광이 나타나는 날, 여러분은 또한 그리스도와 더불어 한없는 기쁨을 맛보게 될 것입니다.","dep242-5-3-5":"여러분은 서로 짐을 져 주십시오. 그리하면 여러분은 그리스도의 법을 성취할 수 있게 될 것입니다.","dep242-5-4-1":"그러므로 여러분이 그리스도 안에서 무슨 격려나 무슨 사랑의 위로나 무슨 성령의 교제나 무슨 자비나 무슨 긍휼을 베풀려거든, 여러분은 한마음과 한뜻으로, 같은 사랑을 가지고 하나가 되어 행함으로써, 내 기쁨이 넘치게 해 주십시오.","dep242-5-4-2":"무슨 일을 하든지, 이기심이나 허영으로 하지 말고, 오직 겸손한 마음으로 자기보다 다른 사람을 더 낫게 여기십시오. 또한 여러분은 각자 자기 일만 돌보지 말고, 다른 사람의 일도 관심을 갖고 돌보아 주십시오.","dep242-5-4-3":"우리가 여러분에게 마음을 옹졸하게 쓰는 것이 아니라, 여러분이 우리에게 마음을 활짝 열지 않고 있습니다. 우리가 여러분에게 마음을 옹졸하게 쓰는 것이 아니라, 여러분이 우리에게 마음을 활짝 열지 않고 있습니다.","dep242-5-4-4":"그리스도를 경외하는 마음으로 서로에게 순종하십시오.","dep242-5-4-5":"제자들은 잠자코 대답을 하지 못했다. 누가 제일 높은지를 놓고 서로 다투었기 때문이었다. 예수께서 자리에 앉으신 후, 열두 제자들을 모두 불러놓고 말씀하셨다. “누구든지 첫째가는 사람이 되려면, 꼴찌가 되어 모든 사람을 섬겨야 한다.”","dep242-5-4-6":"아무도 하나님의 은혜에서 떨어져 나가는 일이 없도록 삼가 자신을 늘 살피고, 또한 여러분 사이에 독초가 생겨나서 문제를 만드는 일이 없도록 잘 단속해서, 그로 인해 많은 사람들이 피해를 입는 일이 없도록 주의하십시오.","dep242-5-4-7":"여러분은 아무런 빛의 열매도 거둘 수 없는 악한 행위에 절대로 끼어들지 마시고, 도리어 그런 일을 폭로하고 책망하십시오.","dep242-5-4-8":"누구든지 군사가 된 이상 세상일에 얽매여서는 안 됩니다. 군사로 부름 받은 자는 자기를 군사로 모집한 상관을 먼저 기쁘게 해 주어야 합니다.","dep242-5-5-9":"만일 당신이 하나님께 제물을 드리려고 할 때, 당신에게 원한을 품고 있는 형제가 생각나거든, 제물을 그대로 두고, 그 형제를 찾아가서 먼저 화해한 다음에 다시 돌아와서 하나님께 제물을 바치도록 하십시오.","dep242-5-5-1":"“어떤 형제가 네게 잘못한 일이 있거든, 단둘이서 만나 그의 잘못을 타일러 주어라. 그 형제가 네 말을 듣고 잘못을 고백하면, 너는 형제 하나를 얻은 것이다.","dep242-5-5-2":"그러나 우리가 죄인임을 인정하고 스스로 죄를 고백하면, 하나님께서는 참으로 신실하고 의로우신 분이시므로 우리의 죄를 다 용서해 주시고, 모든 불의에서 우리를 깨끗하게 해주실 것입니다.","dep242-5-5-3":"자기 허물을 자꾸 감추려는 사람은 잘 되는 법이 없지만, 누구든지 자기 죄를 고백하고 죄를 끊어 더 이상 죄짓지 않는 사람은 불쌍히 여김을 받는다.","dep242-6-1-1":"그러나 성령이 너희에게 임하시면, 너희는 권능을 받게 될 것이다. 그러면 너희는 예루살렘에서, 유대와 사마리아 전 지역에서, 그리고 땅 끝까지 이르러 나의 증인이 될 것이다.”","dep242-6-1-2":"이 모든 일은 하나님에게서 비롯된 것입니다. 하나님께서는 독생자 그리스도를 통하여 우리를 자신과 화해하게 하셨고, 나아가 우리에게 화해의 직분을 맡겨 주셨습니다. 곧 하나님께서는 그리스도 안에서 이 세상과 화해하심으로써 사람들의 죄를 묻지 않으셨습니다. 이것이 바로 화해의 직분을 맡은 자로서 우리가 세상 모든 사람들에게 전해야 할 화해의 말씀입니다.","dep242-6-2-1":"나는 하나님 앞에서, 또한 장차 산 자와 죽은 자를 심판하실 그리스도 예수 앞에서, 그분의 재림과 그분의 왕국을 두고 그대에게 엄숙히 명령합니다. 그대는 말씀을 전파하십시오! 때를 가리지 말고, 언제 어디서든 항상 하나님의 말씀을 힘써 전파하십시오. 또한 끝까지 오래 참고 견디는 가운데 신도들을 잘 가르쳐 허물을 바로잡고, 책망하고, 격려하십시오.","dep242-6-2-2":"보시오, 인자는 잃어버린 사람을 찾아 구원하러 이 땅에 왔소.”","dep242-6-2-3":"오직 우리는 하나님께 임명받는 복음 전도자로서 말했습니다. 우리가 그렇게 한 것은, 우리의 전도가 사람을 기쁘게 하려는 것이 아니라, 우리의 마음속 깊은 곳까지도 살펴보시는 하나님을 기쁘시게 해 드리려는 것입니다.","dep242-6-2-4":"복음을 전하는 것이 내게는 하등 자랑거리가 될 수 없습니다. 나는 어쩔 수 없이 복음을 꼭 전해야만 하기 때문입니다. 만일 내가 복음을 전하는 일을 그만둔다면, 내게 재앙이 미칠 것입니다.","dep242-6-2-5":"그런데 생각해 보십시오. 주님을 믿지 않는다면, 그들이 어떻게 주님을 부를 수 있겠습니까? 또 주님의 이름을 한 번도 들어 본 적이 없다면, 어떻게 주님을 믿을 수 있겠습니까? 또 누군가 주님에 대해 전하는 사람이 없다면, 그들이 어떻게 들을 수 있겠습니까?","dep242-6-2-6":"하나님께서는 모든 사람이 다 구원을 얻고 진리를 깨닫게 되기를 원하십니다.","dep242-6-2-7":"그러자 주께서 말씀하셨다. “요나야, 보다시피 너는 네 스스로 수고도 하지 않았고, 네가 키우지도 않았으며, 다만 하룻밤 사이에 생겨났다가 하룻밤 사이에 죽어버린 저 박 넝쿨 한 포기조차도 그토록 아끼고 아까워했다. 그러니 너는 생각해 보라. 하물며 이 큰 성읍 니느웨, 곧 옳고 그름을 구별할 줄도 모르는 사람들이 무려 12만 명이나 있고, 또한 가축들도 수없이 많이 있는 이 큰 성읍 니느웨를 내가 아끼고 아까워하는 것이 어찌 옳지 않으냐?”","dep242-6-2-8":"내가 진정으로 당신들에게 말하겠소. 이와 같이 하늘나라에서는 회개할 필요가 없는 의인 아흔아홉 명보다 회개하는 죄인 한 사람을 두고 더욱 기뻐한다오.”","dep242-6-2-9":"이처럼 우리가 보고 들은 것을 여러분에게 전파하는 것은, 여러분도 우리와 함께 서로 교제를 나누도록 하기 위함입니다. 이 같은 우리의 교제에는 아버지 하나님과 그분의 아들 예수 그리스도도 함께 하십니다.","dep242-6-2-10":"그러나 지혜 있는 사람은 하늘의 빛처럼 밝게 빛날 것이요, 많은 사람을 옳은 길로 인도한 사람은 공중의 별처럼 영원히 빛날 것이다.","dep242-6-3-1":"예수께서 그들 두 형제를 향해 말씀하셨다. “나를 따라오시오. 내가 당신들을 사람 낚는 어부로 만들어 주겠소.”","dep242-6-3-2":"그리하면 여러분은 비뚤어지고 뒤틀린 세대 속에서 흠 없고 순결한 하나님의 자녀가 되어, 하늘에 빛나는 별처럼 세상에 빛을 발하게 될 것입니다. 또 생명의 말씀을 굳게 붙잡도록 하십시오. 그러면 내가 애써 달려온 것과 힘써 수고한 것이 헛되지 아니하여서, 그리스도께서 다시 오실 그때에 내가
