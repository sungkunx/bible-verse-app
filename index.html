/* ── 덱 갱신 (카드 넘김/체크 시 부분 갱신) ─────── */
/**
 * 덱 갱신. enter로 새 카드가 들어오는 연출을 지정한다.
 *   'stack' — 뒤 카드뭉치에서 앞으로 올라옴 (다음 카드로 넘길 때)
 *   'left'  — 화면 왼쪽에서 미끄러져 들어옴 (이전 카드로 돌아갈 때)
 */
function updateDeck(enter) {
  const list = currentVerses();
  if (state.index >= list.length) state.index = Math.max(0, list.length - 1);
  const v = list[state.index];
  const el = document.getElementById('deckCurrent');
  if (!el || !v) return;
  el.style.transition = 'none';
  el.innerHTML = cardHTML(v);
  if (enter === 'stack') {
    el.style.transform = 'translateY(7px) scale(0.975)';
    el.offsetHeight; // 강제 리플로우 — 드래그하던 위치가 아니라 이 위치에서 시작
    el.style.transition = 'transform 0.24s ease-out';
    el.style.transform = '';
  } else {
    el.style.transform = '';
  }
  updateControls();
  fitCardBody();
}

/* 카운터·버튼·뒤 카드뭉치 표시 (카드 내용과 별개로 즉시 갱신) */
function updateControls() {
  const list = currentVerses();
  const v = list[state.index];
  const u1 = document.getElementById('under1');
  if (!u1 || !v) return;
  u1.style.display = state.index + 1 < list.length ? '' : 'none';
  document.getElementById('under2').style.display = state.index + 2 < list.length ? '' : 'none';
  document.getElementById('counter').innerHTML = (state.index + 1) + ' <em>/ ' + list.length + '</em>';
  document.getElementById('btnPrev').disabled = state.index === 0;
  document.getElementById('btnNext').disabled = state.index >= list.length - 1;
  document.getElementById('btnFav').className = 'action-btn' + (state.fav.has(v.id) ? ' star-on' : '');
  document.getElementById('btnDone').className = 'action-btn' + (state.done.has(v.id) ? ' check-on' : '');
}

/* 본문이 카드에 안 들어가면 글자를 단계적으로 줄여서 맞춘다.
 * (최소 68%까지 — 그래도 넘치면 스크롤로 본다) */
function fitCardBody(scope) {
  const body = (scope || document).querySelector('.card-front .card-body');
  if (!body) return;
  body.style.fontSize = '';
  body.style.lineHeight = '';
  const base = parseFloat(getComputedStyle(body).fontSize);
  let k = 1;
  while (body.scrollHeight > body.clientHeight + 1 && k > 0.68) {
    k -= 0.04;
    body.style.fontSize = (base * k).toFixed(2) + 'px';
    if (k < 0.85) body.style.lineHeight = '1.65';
  }
}

/** 뒷면 '확인' — 입력한 본문을 채점해 결과를 보여준다 */
function runQuizCheck() {
  const box = document.querySelector('#deckCurrent .card-back');
  if (!box) return;
  const input = box.querySelector('.quiz-input');
  const result = box.querySelector('.quiz-result');
  const score = box.querySelector('.quiz-score');
  const v = currentVerses()[state.index];
  if (!input || !result || !v) return;
  typedText[v.id] = input.value;
  const answer = getVerseTextWithFallback(v, state.trans).text;
  const g = gradeHTML(input.value, answer);
  const quiz = box.querySelector('.card-quiz');
  if (g.empty) {
    result.innerHTML = '';
    quiz.classList.remove('graded');
    score.textContent = '먼저 본문을 입력해 보세요';
    score.className = 'quiz-score';
    return;
  }
  result.innerHTML = g.html;
  quiz.classList.add('graded');
  const pct = g.total ? Math.round(g.ok / g.total * 100) : 0;
  const perfect = pct === 100 && !g.spaceOnly;
  score.textContent = perfect ? '완벽해요!'
    : pct + '% 일치' + (g.spaceOnly ? ' · 띄어쓰기 ' + g.spaceOnly + '곳' : '');
  score.className = 'quiz-score' + (perfect ? ' perfect' : '');
}

/* 입력 내용은 구절별로 기억 (카드를 뒤집거나 넘겨도 유지) */
document.addEventListener('input', e => {
  if (!e.target.classList || !e.target.classList.contains('quiz-input')) return;
  const v = currentVerses()[state.index];
  if (v) typedText[v.id] = e.target.value;
  // 내용을 고치면 이전 채점 결과는 지운다
  const back = e.target.closest('.card-back');
  if (back) {
    back.querySelector('.quiz-result').innerHTML = '';
    back.querySelector('.card-quiz').classList.remove('graded');
    const sc = back.querySelector('.quiz-score');
    sc.textContent = '';
    sc.className = 'quiz-score';
  }
});

/* ── 이전 카드 되돌리기 ─────────────────────────────
 * 오른쪽으로 스와이프하면 현재 카드는 그대로 두고, 바로 앞 카드가
 * 화면 왼쪽 밖에서 손가락을 따라 덱 위로 들어온다.
 * (카드뭉치에서 한 장이 빠졌다가 다시 얹히는 느낌) */
function incomingEl() { return document.getElementById('deckIncoming'); }

function prepIncoming() {
  const inc = incomingEl();
  if (!inc) return null;
  if (inc.dataset.ready) return inc;
  const v = currentVerses()[state.index - 1];
  if (!v) return null;
  inc.innerHTML = cardHTML(v);   // 되돌아오는 카드는 항상 앞면
  inc.style.display = 'block';
  inc.style.transition = 'none';
  inc.style.transform = 'translateX(-100%)';
  inc.dataset.ready = '1';
  inc.offsetHeight;
  fitCardBody(inc);
  return inc;
}

function moveIncoming(dx) {
  const inc = prepIncoming();
  if (!inc) return false;
  inc.style.transition = 'none';
  inc.style.transform = 'translateX(-100%) translateX(' + Math.max(0, dx) + 'px)';
  return true;
}

function clearIncoming() {
  const inc = incomingEl();
  if (!inc) return;
  inc.style.transition = 'none';
  inc.style.display = 'none';
  inc.innerHTML = '';
  delete inc.dataset.ready;
}

/** 되돌리기 취소 — 들어오던 카드를 화면 밖으로 되돌린다 */
function cancelIncoming() {
  const inc = incomingEl();
  if (!inc || !inc.dataset.ready) return;
  inc.style.transition = 'transform 0.22s ease-out';
  inc.style.transform = 'translateX(-100%)';
  setTimeout(clearIncoming, 240);
}

/** 되돌리기 확정 — 들어오던 카드를 덱 위에 안착시키고 본 카드로 교체 */
function commitIncoming() {
  const inc = prepIncoming();
  if (!inc) return;
  inc.style.transition = 'transform 0.26s cubic-bezier(0.22, 0.7, 0.3, 1)';
  inc.style.transform = 'translateX(0)';
  state.index -= 1;
  state.flipped = false;
  updateControls();          // 카운터·별·체크는 즉시 반영
  setTimeout(() => {
    updateDeck();             // 본 카드를 새 인덱스로 교체 (연출 없음)
    clearIncoming();
  }, 265);
}

/* 카드 넘김
 * 다음 카드(dir>0): 현재 카드가 드래그하던 위치에서 왼쪽으로 날아가고
 *                   새 카드가 뒤 카드뭉치에서 올라온다.
 * 이전 카드(dir<0): 현재 카드는 그대로 두고, 이전 카드가 화면 왼쪽 밖에서
 *                   덱 위로 들어온다 (commitIncoming). */
function goCard(dir, fromDx) {
  const list = currentVerses();
  const next = state.index + dir;
  if (next < 0 || next >= list.length) { resetCardTransform(); return; }
  if (dir < 0) { commitIncoming(); return; }
  fromDx = fromDx || 0;
  const deck = document.getElementById('deck');
  const curEl = document.getElementById('deckCurrent');
  if (deck && curEl) {
    const ghost = document.createElement('div');
    ghost.className = 'deck-leaving';
    ghost.innerHTML = curEl.innerHTML;
    // 시작 위치 = 현재 드래그 위치
    ghost.style.transform = 'translateX(' + fromDx + 'px) rotate(' + fromDx * 0.04 + 'deg)';
    ghost.style.opacity = '1';
    deck.appendChild(ghost);
    ghost.offsetHeight; // 강제 리플로우 — 시작 위치를 확정시켜야 transition이 걸림
    ghost.style.transition = 'transform 0.24s ease-out, opacity 0.24s ease-out';
    ghost.style.transform = 'translateX(-120%) rotate(-7deg)';
    ghost.style.opacity = '0.3';
    setTimeout(() => ghost.remove(), 320);
  }
  state.index = next;
  state.flipped = false;
  updateDeck('stack');
}

function toggleSet(kind, id) {
  const set = kind === 'fav' ? state.fav : state.done;
  set.has(id) ? set.delete(id) : set.add(id);
  saveSet(kind === 'fav' ? 'favorites' : 'completed', set);
}

/* ── 역본 선택 시트 ───────────────────────────── */
function openTransMenu() {
  const m = document.getElementById('modal');
  m.innerHTML = '<div class="sheet-overlay" data-action="trans-close"><div class="sheet" data-action="noop">' +
    '<div class="sheet-title">역본 선택</div>' +
    TRANS_LIST.map(t =>
      '<button class="sheet-item' + (t.id === state.trans ? ' on' : '') + '" data-action="pick-trans" data-id="' + t.id + '">' +
      '<span class="sheet-check">' + (t.id === state.trans ? '✓' : '') + '</span>' +
      '<span class="t-name">' + esc(t.name) + '</span>' +
      '<span class="t-short">' + esc(t.short) + '</span>' +
      '</button>').join('') +
    '</div></div>';
}
function closeTransMenu() { document.getElementById('modal').innerHTML = ''; }

/* ── 렌더 ─────────────────────────────────────── */
const root = document.getElementById('root');
function render() {
  const s = cur();
  if (s.name === 'home') root.innerHTML = homeHTML();
  else if (s.name === 'group') root.innerHTML = groupHTML(s);
  else {
    root.innerHTML = verseScreenHTML(s, currentVerses());
    if (state.mode === 'card') updateDeck();
  }
  window.scrollTo(0, 0);
}

/* ── 이벤트 (위임) ────────────────────────────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  const s = cur();
  if (a === 'back') pop();
  else if (a === 'go-home') goHome();
  else if (a === 'trans-menu') openTransMenu();
  else if (a === 'trans-close') closeTransMenu();
  else if (a === 'pick-trans') {
    state.trans = btn.dataset.id;
    try { localStorage.setItem('bmc.trans.v1', state.trans); } catch (err) {}
    closeTransMenu();
    render();
  }
  else if (a === 'open-col') {
    const col = getCollection(btn.dataset.id);
    if (!col.sections.length) push({ name: 'verses', collectionId: col.id, title: col.name });
    else push({ name: 'group', collectionId: col.id });
  }
  else if (a === 'open-kind') {
    push({ name: 'verses', kind: btn.dataset.kind, title: btn.dataset.kind === 'favorites' ? '즐겨찾기' : '암송완료' });
  }
  else if (a === 'open-group') push({ name: 'group', collectionId: btn.dataset.col, sectionId: btn.dataset.sec });
  else if (a === 'open-verses') {
    const col = getCollection(btn.dataset.col);
    const sec = btn.dataset.sec && col.sections.find(x => x.id === btn.dataset.sec);
    const sub = sec && btn.dataset.sub && sec.subsections.find(x => x.id === btn.dataset.sub);
    push({
      name: 'verses', collectionId: col.id,
      sectionId: btn.dataset.sec || null, subsectionId: btn.dataset.sub || null,
      title: sub ? sub.name
        : sec ? (btn.dataset.all ? sec.name + ' 전체' : sec.name)
        : col.shortName + ' 전체',
    });
  }
  else if (a === 'mode-card') { state.mode = 'card'; render(); }
  else if (a === 'mode-list') { state.mode = 'list'; render(); }
  else if (a === 'font-inc' || a === 'font-dec') {
    const d = a === 'font-inc' ? FS_STEP : -FS_STEP;
    state.fontScale = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, state.fontScale + d)) * 10) / 10;
    applyFontScale(state.fontScale);
    render(); // 버튼 활성 상태 갱신 + 카드 자동 맞춤 재계산
  }
  else if (a === 'open-card') { state.mode = 'card'; state.index = +btn.dataset.idx; state.flipped = false; render(); }
  else if (a === 'prev') goCard(-1);
  else if (a === 'next') goCard(1);
  else if (a === 'quiz-check') runQuizCheck();
  else if (a === 'fav' || a === 'done') {
    const v = currentVerses()[state.index];
    // 카드 내용은 그대로 두고 버튼 상태만 갱신 (뒷면 입력 내용 보존)
    if (v) { toggleSet(a, v.id); s.kind ? render() : updateControls(); }
  }
  else if (a === 'row-fav' || a === 'row-done') {
    toggleSet(a === 'row-fav' ? 'fav' : 'done', btn.dataset.id);
    render();
  }
});

/* ── 덱 스와이프 + 탭 뒤집기 ─────────────────────
 * 터치는 touch 이벤트로 직접 처리하고, 첫 움직임에서
 * 가로/세로 방향을 잠근다. 가로로 판정되면 preventDefault로
 * 브라우저 스크롤 가로채기를 막아 끝까지 우리가 제어한다.
 * (기존 pointer 이벤트 방식은 손가락이 조금만 비스듬해도
 *  브라우저가 스크롤로 가져가며 pointercancel로 끊겼음) */
let drag = null;

function setCardTransform(dx) {
  const el = document.getElementById('deckCurrent');
  if (!el) return;
  el.style.transition = 'none';
  el.style.transform = 'translateX(' + dx + 'px) rotate(' + dx * 0.04 + 'deg)';
}
function resetCardTransform() {
  const el = document.getElementById('deckCurrent');
  if (el) { el.style.transition = 'transform 0.25s ease'; el.style.transform = ''; }
}
function dampedDx(dx) {
  const list = currentVerses();
  const atEdge = (dx > 0 && state.index === 0) || (dx < 0 && state.index >= list.length - 1);
  return atEdge ? dx * 0.3 : dx; // 끝 카드에서는 저항감
}

function dragStart(x, y, target) {
  // 뒷면의 입력창·버튼 영역은 손대지 않는다 (타이핑·선택이 우선)
  if (target && target.closest && target.closest('.card-quiz')) { drag = null; return; }
  // 터치 시작 지점의 스크롤 가능한 본문 (세로 드래그 시 직접 스크롤)
  let scrollEl = null;
  if (target && target.closest) {
    const body = target.closest('.card-body');
    if (body && body.scrollHeight > body.clientHeight + 1) scrollEl = body;
  }
  drag = { x, y, lock: null, t: Date.now(), lastX: x, lastT: Date.now(), vx: 0,
           scrollEl, scrollTop: scrollEl ? scrollEl.scrollTop : 0 };
}
function dragMove(x, y, e) {
  if (!drag) return;
  const dx = x - drag.x, dy = y - drag.y;
  if (!drag.lock) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 아직 판정 전
    drag.lock = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
  }
  if (drag.lock !== 'h') {
    // 세로: 본문이 스크롤 가능하면 직접 스크롤 (3D 카드 구조에서
    // 브라우저 기본 스크롤이 안 먹는 기기 대응)
    if (drag.scrollEl) {
      if (e && e.cancelable) e.preventDefault();
      drag.scrollEl.scrollTop = drag.scrollTop - dy;
    }
    return;
  }
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now > drag.lastT) drag.vx = (x - drag.lastX) / (now - drag.lastT);
  drag.lastX = x; drag.lastT = now;
  // 오른쪽으로 끌면: 현재 카드는 고정하고 이전 카드가 왼쪽에서 따라 들어온다
  if (dx > 0 && state.index > 0) {
    resetCardTransform();
    if (moveIncoming(dx)) return;
  }
  if (dx <= 0) clearIncoming();   // 방향을 바꿔 왼쪽으로 끌면 미리보기 제거
  setCardTransform(dampedDx(dx));
}
function dragEnd(x) {
  if (!drag) return false;
  const d = drag; drag = null;
  const dx = x - d.x;
  const dt = Date.now() - d.t;

  if (d.lock === 'h') {
    const deckEl = document.getElementById('deck');
    const width = deckEl ? deckEl.offsetWidth : 320;
    const threshold = Math.min(60, width * 0.18);
    // 플릭 판정: 마지막 순간 속도 또는 제스처 전체 평균 속도
    const avx = dt > 0 ? dx / dt : 0;
    const flick = (Math.abs(d.vx) > 0.25 || Math.abs(avx) > 0.35) &&
      Math.abs(dx) > 15 && (d.vx === 0 || (d.vx < 0) === (dx < 0));
    const list = currentVerses();
    if ((dx < -threshold || (flick && dx < 0)) && state.index < list.length - 1) { goCard(1, dx); return true; }
    if ((dx > threshold || (flick && dx > 0)) && state.index > 0) { commitIncoming(); return true; }
    cancelIncoming();          // 문턱을 넘지 못하면 들어오던 카드를 되돌린다
    resetCardTransform();
    return true; // 가로 드래그였으면 탭으로 치지 않음
  }
  if (!d.lock && dt < 400) { // 탭 → 뒤집기
    state.flipped = !state.flipped;
    const card = document.querySelector('#deckCurrent .card3d');
    if (card) card.classList.toggle('flipped', state.flipped);
    return true;
  }
  resetCardTransform();
  return false;
}
function dragCancel() { drag = null; cancelIncoming(); resetCardTransform(); }

/* 터치 (모바일) */
document.addEventListener('touchstart', e => {
  if (!e.target.closest('#deck')) return;
  if (e.touches.length !== 1) { dragCancel(); return; }
  dragStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!drag) return;
  dragMove(e.touches[0].clientX, e.touches[0].clientY, e);
}, { passive: false });
document.addEventListener('touchend', e => {
  if (!drag) return;
  const handled = dragEnd(e.changedTouches[0].clientX);
  if (handled && e.cancelable) e.preventDefault(); // 고스트 클릭 방지
}, { passive: false });
document.addEventListener('touchcancel', dragCancel);

/* 마우스 (데스크톱) */
let mouseDown = false;
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#deck')) return;
  mouseDown = true;
  dragStart(e.clientX, e.clientY, e.target);
});
document.addEventListener('mousemove', e => {
  if (mouseDown) dragMove(e.clientX, e.clientY, null);
});
document.addEventListener('mouseup', e => {
  if (!mouseDown) return;
  mouseDown = false;
  dragEnd(e.clientX);
});

/* 키보드 (데스크톱) — 입력창에서는 가로채지 않는다 */
document.addEventListener('keydown', e => {
  if (cur().name !== 'verses' || state.mode !== 'card') return;
  const t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
  if (e.key === 'ArrowLeft') goCard(-1);
  else if (e.key === 'ArrowRight') goCard(1);
  else if (e.key === ' ') {
    e.preventDefault();
    state.flipped = !state.flipped;
    const card = document.querySelector('#deckCurrent .card3d');
    if (card) card.classList.toggle('flipped', state.flipped);
  }
});

/* ── 안드로이드 뒤로가기 ───────────────────────────
 * 히스토리에 여유 항목을 하나 유지하고, 뒤로가기가 그것을 소비할 때
 * 앱 안에서 한 단계 뒤로 이동한다. 홈에서는 한 번 더 누를 때만 나간다.
 * (웹에서는 시스템 종료 확인창을 띄울 수 없어 토스트로 안내) */
function pushHistory() {
  try { history.pushState({ bmc: state.stack.length }, ''); } catch (e) {}
}
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
}
let exitArmedAt = 0;
let exiting = false;   // 종료 진행 중이면 더 이상 가로채지 않는다
window.addEventListener('popstate', () => {
  if (exiting) return;
  // 1) 역본 시트가 열려 있으면 먼저 닫는다
  if (document.getElementById('modal').innerHTML) {
    closeTransMenu();
    pushHistory();
    return;
  }
  // 2) 앱 안에서 한 단계 뒤로
  if (state.stack.length > 1) {
    state.stack.pop();
    pushHistory();
    render();
    return;
  }
  // 3) 홈: 2초 안에 다시 누르면 그대로 나간다
  if (Date.now() - exitArmedAt < 2000) {
    exiting = true;
    setTimeout(() => history.back(), 0);
    return;
  }
  exitArmedAt = Date.now();
  showToast('한 번 더 누르면 앱을 닫습니다');
  pushHistory();
});
pushHistory();   // 뒤로가기가 소비할 여유 항목

render();
</script>
</body>
