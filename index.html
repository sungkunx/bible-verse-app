-3-6":"But the Lord is faithful; he will strengthen you and guard you from the evil one.","tms180-s1-3-7":"For God is Spirit, so those who worship him must worship in spirit and in truth.”","tms180-s1-3-8":"But now you must be holy in everything you do, just as God who chose you is holy. For the Scriptures say, “You must be holy because I am holy.”","tms180-s1-3-9":"Great is the LORD! He is most worthy of praise! No one can measure his greatness.","tms180-s1-3-10":"This is real love—not that we loved God, but that he loved us and sent his Son as a sacrifice to take away our sins.","tms180-s1-3-11":"But you, O Lord, are a God of compassion and mercy, slow to get angry and filled with unfailing love and faithfulness.","tms180-s1-3-12":"And we know that God causes everything to work together for the good of those who love God and are called according to his purpose for them.","tms180-s2-1-1":"Instead, we will speak the truth in love, growing in every way more and more like Christ, who is the head of his body, the church.","tms180-s2-1-2":"Don’t lie to each other, for you have stripped off your old sinful nature and all its wicked deeds.","tms180-s2-1-3":"Love prospers when a fault is forgiven, but dwelling on it separates close friends.","tms180-s2-1-4":"A gossip goes around telling secrets, but those who are trustworthy can keep a confidence.","tms180-s2-1-5":"Pray that I will proclaim this message as clearly as I should. Let your conversation be gracious and attractive so that you will have the right response for everyone.","tms180-s2-1-6":"A gentle answer deflects anger, but harsh words make tempers flare.","tms180-s2-1-7":"Confess your sins to each other and pray for each other so that you may be healed. The earnest prayer of a righteous person has great power and produces wonderful results.","tms180-s2-1-8":"“So if you are presenting a sacrifice at the altar in the Temple and you suddenly remember that someone has something against you, leave your sacrifice there at the altar. Go and be reconciled to that person. Then come and offer your sacrifice to God.","tms180-s2-1-9":"Understand this, my dear brothers and sisters: You must all be quick to listen, slow to speak, and slow to get angry.","tms180-s2-1-10":"Spouting off before listening to the facts is both shameful and foolish.","tms180-s2-1-11":"So don’t bother correcting mockers; they will only hate you. But correct the wise, and they will love you. Instruct the wise, and they will be even wiser. Teach the righteous, and they will learn even more.","tms180-s2-1-12":"“If another believer sins against you, go privately and point out the offense. If the other person listens and confesses it, you have won that person back.","tms180-s2-2-1":"Instead, be kind to each other, tenderhearted, forgiving one another, just as God through Christ has forgiven you.","tms180-s2-2-2":"Make allowance for each other’s faults, and forgive anyone who offends you. Remember, the Lord forgave you, so you must forgive others.","tms180-s2-2-3":"Always be humble and gentle. Be patient with each other, making allowance for each other’s faults because of your love.","tms180-s2-2-4":"A servant of the Lord must not quarrel but must be kind to everyone, be able to teach, and be patient with difficult people. Gently instruct those who oppose the truth. Perhaps God will change those people’s hearts, and they will learn the truth.","tms180-s2-2-5":"And “don’t sin by letting anger control you.” Don’t let the sun go down while you are still angry,","tms180-s2-2-6":"But now is the time to get rid of anger, rage, malicious behavior, slander, and dirty language.","tms180-s2-2-7":"Look after each other so that none of you fails to receive the grace of God. Watch out that no poisonous root of bitterness grows up to trouble you, corrupting many.","tms180-s2-2-8":"Get rid of all bitterness, rage, anger, harsh words, and slander, as well as all types of evil behavior.","tms180-s2-2-9":"Of course, you get no credit for being patient if you are beaten for doing wrong. But if you suffer for doing good and endure it patiently, God is pleased with you. For God called you to do good, even if it means suffering, just as Christ suffered for you. He is your example, and you must follow in his steps.","tms180-s2-2-10":"Dear friends, never take revenge. Leave that to the righteous anger of God. For the Scriptures say, “I will take revenge; I will pay them back,” says the LORD.","tms180-s2-2-11":"Anger is cruel, and wrath is like a flood, but jealousy is even more dangerous.","tms180-s2-2-12":"For wherever there is jealousy and selfish ambition, there you will find disorder and evil of every kind.","tms180-s2-3-1":"May God, who gives this patience and encouragement, help you live in complete harmony with each other, as is fitting for followers of Christ Jesus. Then all of you can join together with one voice, giving praise and glory to God, the Father of our Lord Jesus Christ.","tms180-s2-3-2":"I appeal to you, dear brothers and sisters, by the authority of our Lord Jesus Christ, to live in harmony with each other. Let there be no divisions in the church. Rather, be of one mind, united in thought and purpose.","tms180-s2-3-3":"But among you it will be different. Whoever wants to be a leader among you must be your servant, and whoever wants to be first among you must become your slave.","tms180-s2-3-4":"For you have been called to live in freedom, my brothers and sisters. But don’t use your freedom to satisfy your sinful nature. Instead, use your freedom to serve one another in love.","tms180-s2-3-5":"We should help others do what is right and build them up in the Lord.","tms180-s2-3-6":"Don’t be selfish; don’t try to impress others. Be humble, thinking of others as better than yourselves. Don’t look out only for your own interests, but take an interest in others, too.","tms180-s2-3-7":"So encourage each other and build each other up, just as you are already doing.","tms180-s2-3-8":"Two people are better off than one, for they can help each other succeed. If one person falls, the other can reach out and help. But someone who falls alone is in real trouble.","tms180-s2-3-9":"When he saw the crowds, he had compassion on them because they were confused and helpless, like sheep without a shepherd.","tms180-s2-3-10":"Be happy with those who are happy, and weep with those who weep.","tms180-s2-3-11":"But the wisdom from above is first of all pure. It is also peace loving, gentle at all times, and willing to yield to others. It is full of mercy and the fruit of good deeds. It shows no favoritism and is always sincere.","tms180-s2-3-12":"Dear brothers and sisters, if another believer is overcome by some sin, you who are godly should gently and humbly help that person back onto the right path. And be careful not to fall into the same temptation yourself.","tms180-s3-1-1":"By his divine power, God has given us everything we need for living a godly life. We have received all of this by coming to know him, the one who called us to himself by means of his marvelous glory and excellence. And because of his glory and excellence, he has given us great and precious promises. These are the promises that enable you to share his divine nature and escape the world’s corruption caused by human desires.","tms180-s3-1-2":"For all of God’s promises have been fulfilled in Christ with a resounding “Yes!” And through Christ, our “Amen” (which means “Yes”) ascends to God for his glory.","tms180-s3-1-3":"All praise to God, the Father of our Lord Jesus Christ. God is our merciful Father and the source of all comfort. He comforts us in all our troubles so that we can comfort others. When they are troubled, we will be able to give them the same comfort God has given us.","tms180-s3-1-4":"It’s not important who does the planting, or who does the watering. What’s important is that God makes the seed grow. The one who plants and the one who waters work together with the same purpose. And both will be rewarded for their own hard work.","tms180-s3-1-5":"But they delight in the law of the LORD, meditating on it day and night. They are like trees planted along the riverbank, bearing fruit each season. Their leaves never wither, and they prosper in all they do.","tms180-s3-1-6":"The more you grow like this, the more productive and useful you will be in your knowledge of our Lord Jesus Christ.","tms180-s3-1-7":"In his kindness God called you to share in his eternal glory by means of Christ Jesus. So after you have suffered a little while, he will restore, support, and strengthen you, and he will place you on a firm foundation.","tms180-s3-1-8":"Each time he said, “My grace is all you need. My power works best in weakness.” So now I am glad to boast about my weaknesses, so that the power of Christ can work through me.","tms180-s3-1-9":"All praise to God, the Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing in the heavenly realms because we are united with Christ.","tms180-s3-1-10":"Take delight in the LORD, and he will give you your heart’s desires. Commit everything you do to the LORD. Trust him, and he will help you.","tms180-s3-1-11":"My dear children, I am writing this to you so that you will not sin. But if anyone does sin, we have an advocate who pleads our case before the Father. He is Jesus Christ, the one who is truly righteous. He himself is the sacrifice that atones for our sins—and not only our sins but the sins of all the world.","tms180-s3-1-12":"He has removed our sins as far from us as the east is from the west.","tms180-s3-2-1":"For the word of God is alive and powerful. It is sharper than the sharpest two-edged sword, cutting between soul and spirit, between joint and marrow. It exposes our innermost thoughts and desires.","tms180-s3-2-2":"“The rain and snow come down from the heavens and stay on the ground to water the earth. They cause the grain to grow, producing seed for the farmer and bread for the hungry. It is the same with my word. I send it out, and it always produces fruit. It will accomplish all I want it to, and it will prosper everywhere I send it.","tms180-s3-2-3":"Above all, you must realize that no prophecy in Scripture ever came from the prophet’s own understanding, or from human initiative. No, those prophets were moved by the Holy Spirit, and they spoke from God.","tms180-s3-2-4":"Therefore, we never stop thanking God that when you received his message from us, you didn’t think of our words as mere human ideas. You accepted what we said as the very word of God—which, of course, it is. And this word continues to work in you who believe.","tms180-s3-2-5":"When I discovered your words, I devoured them. They are my joy and my heart’s delight, for I bear your name, O LORD God of Heaven’s Armies.","tms180-s3-2-6":"I have not departed from his commands, but have treasured his words more than daily food.","tms180-s3-2-7":"And the people of Berea were more open-minded than those in Thessalonica, and they listened eagerly to Paul’s message. They searched the Scriptures day after day to see if Paul and Silas were teaching the truth.","tms180-s3-2-8":"“You search the Scriptures because you think they give you eternal life. But the Scriptures point to me! Yet you refuse to come to me to receive this life.","tms180-s3-2-9":"Jesus said to the people who believed in him, “You are truly my disciples if you remain faithful to my teachings. And you will know the truth, and the truth will set you free.”","tms180-s3-2-10":"But Jesus told him, “No! The Scriptures say, ‘People do not live by bread alone, but by every word that comes from the mouth of God.’ ”","tms180-s3-2-11":"Heaven and earth will disappear, but my words will never disappear.","tms180-s3-2-12":"Make them holy by your truth; teach them your word, which is truth.","tms180-s3-3-1":"So be truly glad. There is wonderful joy ahead, even though you must endure many trials for a little while. These trials will show that your faith is genuine. It is being tested as fire tests and purifies gold—though your faith is far more precious than mere gold. So when your faith remains strong through many trials, it will bring you much praise and glory and honor on the day when Jesus Christ is revealed to the whole world.","tms180-s3-3-2":"Dear brothers and sisters, when troubles of any kind come your way, consider it an opportunity for great joy. So let it grow, for when your endurance is fully developed, you will be perfect and complete, needing nothing.","tms180-s3-3-3":"For this good news—that God has prepared this rest—has been announced to us just as it was to them. But it did them no good because they didn’t share the faith of those who listened to God.","tms180-s3-3-4":"And my righteous ones will live by faith. But I will take no pleasure in anyone who turns away.”","tms180-s3-3-5":"In addition to all of these, hold up the shield of faith to stop the fiery arrows of the devil.","tms180-s3-3-6":"But you, Timothy, are a man of God; so run from all these evil things. Pursue righteousness and a godly life, along with faith, love, perseverance, and gentleness. Fight the good fight for the true faith. Hold tightly to the eternal life to which God has called you, which you have declared so well before many witnesses.","tms180-s3-3-7":"Faith shows the reality of what we hope for; it is the evidence of things we cannot see.","tms180-s3-3-8":"So faith comes from hearing, that is, hearing the Good News about Christ.","tms180-s3-3-9":"Then you will not become spiritually dull and indifferent. Instead, you will follow the example of those who are going to inherit God’s promises because of their faith and endurance.","tms180-s3-3-10":"So you see, faith by itself isn’t enough. Unless it produces good deeds, it is dead and useless.","tms180-s3-3-11":"Yet we know that a person is made right with God by faith in Jesus Christ, not by obeying the law. And we have believed in Christ Jesus, so that we might be made right with God because of our faith in Christ, not because we have obeyed the law. For no one will ever be made right with God by obeying the law.”","tms180-s3-3-12":"Therefore, since we have been made right in God’s sight by faith, we have peace with God because of what Jesus Christ our Lord has done for us.","tms180-s4-1-1":"But thank God! He gives us victory over sin and death through our Lord Jesus Christ.","tms180-s4-1-2":"But thank God! He has made us his captives and continues to lead us along in Christ’s triumphal procession. Now he uses us to spread the knowledge of Christ everywhere, like a sweet perfume.","tms180-s4-1-3":"We use God’s mighty weapons, not worldly weapons, to knock down the strongholds of human reasoning and to destroy false arguments. We destroy every proud obstacle that keeps people from knowing God. We capture their rebellious thoughts and teach them to obey Christ.","tms180-s4-1-4":"A final word: Be strong in the Lord and in his mighty power. Put on all of God’s armor so that you will be able to stand firm against all strategies of the devil.","tms180-s4-1-5":"And they have defeated him by the blood of the Lamb and by their testimony. And they did not love their lives so much that they were afraid to die.","tms180-s4-1-6":"So humble yourselves before God. Resist the devil, and he will flee from you. Come close to God, and God will come close to you. Wash your hands, you sinners; purify your hearts, for your loyalty is divided between God and the world.","tms180-s4-1-7":"Those who are dominated by the sinful nature think about sinful things, but those who are controlled by the Holy Spirit think about things that please the Spirit. So letting your sinful nature control your mind leads to death. But letting the Spirit control your mind leads to life and peace.","tms180-s4-1-8":"Instead, clothe yourself with the presence of the Lord Jesus Christ. And don’t let yourself think about ways to indulge your evil desires.","tms180-s4-1-9":"But you belong to God, my dear children. You have already won a victory over those people, because the Spirit who lives in you is greater than the spirit who lives in the world.","tms180-s4-1-10":"For every child of God defeats this evil world, and we achieve this victory through our faith. And who can win this battle against the world? Only those who believe that Jesus is the Son of God.","tms180-s4-1-11":"They have made God’s law their own, so they will never slip from his path.","tms180-s4-1-12":"Do not let sin control the way you live; do not give in to sinful desires. Do not let any part of your body become an instrument of evil to serve sin. Instead, give yourselves completely to God, for you were dead, but now you have new life. So use your whole body as an instrument to do what is right for the glory of God.","tms180-s4-2-1":"And now, dear brothers and sisters, one final thing. Fix your thoughts on what is true, and honorable, and right, and pure, and lovely, and admirable. Think about things that are excellent and worthy of praise.","tms180-s4-2-2":"Everything is pure to those whose hearts are pure. But nothing is pure to those who are corrupt and unbelieving, because their minds and consciences are corrupted.","tms180-s4-2-3":"A good person produces good things from the treasury of a good heart, and an evil person produces evil things from the treasury of an evil heart. What you say flows from what is in your heart.","tms180-s4-2-4":"Guard your heart above all else, for it determines the course of your life.","tms180-s4-2-5":"“Your eye is like a lamp that provides light for your body. When your eye is healthy, your whole body is filled with light.","tms180-s4-2-6":"But I say, anyone who even looks at a woman with lust has already committed adultery with her in his heart.","tms180-s4-2-7":"God’s will is for you to be holy, so stay away from all sexual sin.","tms180-s4-2-8":"You say, “Food was made for the stomach, and the stomach for food.” (This is true, though someday God will do away with both of them.) But you can’t say that our bodies were made for sexual immorality. They were made for the Lord, and the Lord cares about our bodies.","tms180-s4-2-9":"Don’t use foul or abusive language. Let everything you say be good and helpful, so that your words will be an encouragement to those who hear them.","tms180-s4-2-10":"And I tell you this, you must give an account on judgment day for every idle word you speak. The words you say will either acquit you or condemn you.”","tms180-s4-2-11":"Stay away from every kind of evil.","tms180-s4-2-12":"Never speak harshly to an older man, but appeal to him respectfully as you would to your own father. Talk to younger men as you would to your own brothers. Treat older women as you would your mother, and treat younger women with all purity as you would your own sisters.","tms180-s4-3-1":"You can pray for anything, and if you have faith, you will receive it.”","tms180-s4-3-2":"“Keep on asking, and you will receive what you ask for. Keep on seeking, and you will find. Keep on knocking, and the door will be opened to you. For everyone who asks, receives. Everyone who seeks, finds. And to everyone who knocks, the door will be opened.","tms180-s4-3-3":"But when you pray, go away by yourself, shut the door behind you, and pray to your Father in private. Then your Father, who sees everything, will reward you.","tms180-s4-3-4":"Before daybreak the next morning, Jesus got up and went out to an isolated place to pray.","tms180-s4-3-5":"Ask me and I will tell you remarkable secrets you do not know about things to come.","tms180-s4-3-6":"Now all glory to God, who is able, through his mighty power at work within us, to accomplish infinitely more than we might ask or think.","tms180-s4-3-7":"And we are confident that he hears us whenever we ask for anything that pleases him. And since we know he hears us when we make our requests, we also know that he will give us what we ask for.","tms180-s4-3-8":"Never stop praying. Be thankful in all circumstances, for this is God’s will for you who belong to Christ Jesus.","tms180-s4-3-9":"“As for me, I will certainly not sin against the LORD by ending my prayers for you. And I will continue to teach you what is good and right.","tms180-s4-3-10":"He said to his disciples, “The harvest is great, but the workers are few. So pray to the Lord who is in charge of the harvest; ask him to send more workers into his fields.”","tms180-s4-3-11":"Therefore, let us offer through Jesus a continual sacrifice of praise to God, proclaiming our allegiance to his name.","tms180-s4-3-12":"Praise the LORD! Let all that I am praise the LORD. I will praise the LORD as long as I live. I will sing praises to my God with my dying breath.","tms180-s5-1-1":"For God wanted them to know that the riches and glory of Christ are for you Gentiles, too. And this is the secret: Christ lives in you. This gives you assurance of sharing his glory. So we tell others about Christ, warning everyone and teaching everyone with all the wisdom God has given us. We want to present them to God, perfect in their relationship to Christ.","tms180-s5-1-2":"For God was in Christ, reconciling the world to himself, no longer counting people’s sins against them. And he gave us this wonderful message of reconciliation. So we are Christ’s ambassadors; God is making his appeal through us. We speak for Christ when we plead, “Come back to God!”","tms180-s5-1-3":"For we speak as messengers approved by God to be entrusted with the Good News. Our purpose is to please God, not people. He alone examines the motives of our hearts.","tms180-s5-1-4":"Even though I am a free man with no master, I have become a slave to all people to bring many to Christ.","tms180-s5-1-5":"You know the saying, ‘Four months between planting and harvest.’ But I say, wake up and look around. The fields are already ripe for harvest.","tms180-s5-1-6":"We loved you so much that we shared with you not only God’s Good News but our own lives, too.","tms180-s5-1-7":"As the Scriptures say, “No one is righteous— not even one. All have turned away; all have become useless. No one does good, not a single one.”","tms180-s5-1-8":"in flaming fire, bringing judgment on those who don’t know God and on those who refuse to obey the Good News of our Lord Jesus. They will be punished with eternal destruction, forever separated from the Lord and from his glorious power.","tms180-s5-1-9":"He personally carried our sins in his body on the cross so that we can be dead to sin and live for what is right. By his wounds you are healed.","tms180-s5-1-10":"For God saved us and called us to live a holy life. He did this, not because we deserved it, but because that was his plan from before the beginning of time—to show us his grace through Christ Jesus.","tms180-s5-1-11":"If you openly declare that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved. For it is by believing in your heart that you are made right with God, and it is by openly declaring your faith that you are saved.","tms180-s5-1-12":"I give them eternal life, and they will never perish. No one can snatch them away from me, for my Father has given them to me, and he is more powerful than anyone else. No one can snatch them from the Father’s hand.","tms180-s5-2-1":"People may be right in their own eyes, but the LORD examines their heart.","tms180-s5-2-2":"And what do you benefit if you gain the whole world but lose your own soul?","tms180-s5-2-3":"Anyone who wants to do the will of God will know whether my teaching is from God or is merely my own.","tms180-s5-2-4":"Jesus answered them, “Healthy people don’t need a doctor—sick people do. I have come to call not those who think they are righteous, but those who know they are sinners and need to repent.”","tms180-s5-2-5":"No wonder you can’t believe! For you gladly honor each other, but you don’t care about the honor that comes from the one who alone is God.","tms180-s5-2-6":"Therefore he is able, once and forever, to save those who come to God through him. He lives forever to intercede with God on their behalf.","tms180-s5-2-7":"Don’t brag about tomorrow, since you don’t know what the day will bring.","tms180-s5-2-8":"Yes, each of us will give a personal account to God.","tms180-s5-2-9":"“You search the Scriptures because you think they give you eternal life. But the Scriptures point to me!","tms180-s5-2-10":"There is a path before each person that seems right, but it ends in death.","tms180-s5-2-11":"“Then the King will turn to those on the left and say, ‘Away with you, you cursed ones, into the eternal fire prepared for the devil and his demons.","tms180-s5-2-12":"For ever since the world was created, people have seen the earth and sky. Through everything God made, they can clearly see his invisible qualities—his eternal power and divine nature. So they have no excuse for not knowing God.","tms180-s5-3-1":"For you know that God paid a ransom to save you from the empty life you inherited from your ancestors. And it was not paid with mere gold or silver, which lose their value. It was the precious blood of Christ, the sinless, spotless Lamb of God.","tms180-s5-3-2":"And all of this is a gift from God, who brought us back to himself through Christ. And God has given us this task of reconciling people to him.","tms180-s5-3-3":"He is so rich in kindness and grace that he purchased our freedom with the blood of his Son and forgave our sins.","tms180-s5-3-4":"Sin is no longer your master, for you no longer live under the requirements of the law. Instead, you live under the freedom of God’s grace. Well then, since God’s grace has set us free from the law, does that mean we can go on sinning? Of course not!","tms180-s5-3-5":"For you are all children of God through faith in Christ Jesus.","tms180-s5-3-6":"But you are not like that, for you are a chosen people. You are royal priests, a holy nation, God’s very own possession. As a result, you can show others the goodness of God, for he called you out of the darkness into his wonderful light.","tms180-s5-3-7":"For God made Christ, who never sinned, to be the offering for our sin, so that we could be made right with God through Christ.","tms180-s5-3-8":"God has united you with Christ Jesus. For our benefit God made him to be wisdom itself. Christ made us right with God; he made us pure and holy, and he freed us from sin.","tms180-s5-3-9":"For by that one offering he forever made perfect those who are being made holy.","tms180-s5-3-10":"Yet God, in his grace, freely makes us right in his sight. He did this through Christ Jesus when he freed us from the penalty for our sins.","tms180-s5-3-11":"But we are citizens of heaven, where the Lord Jesus Christ lives. And we are eagerly waiting for him to return as our Savior.","tms180-s5-3-12":"For in Christ lives all the fullness of God in a human body. So you also are complete through your union with Christ, who is the head over every ruler and authority.","dep242-1-1":"Examine yourselves to see if your faith is genuine. Test yourselves. Surely you know that Jesus Christ is among you; if not, you have failed the test of genuine faith.","dep242-1-2":"And this is what God has testified: He has given us eternal life, and this life is in his Son. Whoever has the Son has life; whoever does not have God’s Son does not have life.","dep242-1-3":"“I tell you the truth, anyone who believes has eternal life.","dep242-1-4":"I have written this to you who believe in the name of the Son of God, so that you may know you have eternal life.","dep242-1-5":"He is so rich in kindness and grace that he purchased our freedom with the blood of his Son and forgave our sins.","dep242-1-6":"So now there is no condemnation for those who belong to Christ Jesus.","dep242-1-7":"Yet God, in his grace, freely makes us right in his sight. He did this through Christ Jesus when he freed us from the penalty for our sins.","dep242-1-8":"Therefore, since we have been made right in God’s sight by faith, we have peace with God because of what Jesus Christ our Lord has done for us.","dep242-1-9":"All praise to God, the Father of our Lord Jesus Christ. It is by his great mercy that we have been born again, because God raised Jesus Christ from the dead. Now we live with great expectation,","dep242-1-10":"he saved us, not because of the righteous things we had done, but because of his mercy. He washed away our sins, giving us a new birth and new life through the Holy Spirit.","dep242-1-11":"For all who are led by the Spirit of God are children of God.","dep242-1-12":"For you are all children of God through faith in Christ Jesus.","dep242-1-13":"But you are not controlled by your sinful nature. You are controlled by the Spirit if you have the Spirit of God living in you. (And remember that those who do not have the Spirit of Christ living in them do not belong to him at all.)","dep242-1-14":"And I will ask the Father, and he will give you another Advocate, who will never leave you. He is the Holy Spirit, who leads into all truth. The world cannot receive him, because it isn’t looking for him and doesn’t recognize him. But you know him, because he lives with you now and later will be in you.","dep242-1-15":"No power in the sky above or in the earth below—indeed, nothing in all creation will ever be able to separate us from the love of God that is revealed in Christ Jesus our Lord.","dep242-1-16":"I give them eternal life, and they will never perish. No one can snatch them away from me, for my Father has given them to me, and he is more powerful than anyone else. No one can snatch them from the Father’s hand.","dep242-1-17":"And now you Gentiles have also heard the truth, the Good News that God saves you. And when you believed in Christ, he identified you as his own by giving you the Holy Spirit, whom he promised long ago.","dep242-1-18":"For you have been born again, but not to a life that will quickly end. Your new life will last forever because it comes from the eternal, living word of God.","dep242-2-1-1":"So the LORD must wait for you to come to him so he can show you his love and compassion. For the LORD is a faithful God. Blessed are those who wait for his help.","dep242-2-1-2":"God will do this, for he is faithful to do what he says, and he has invited you into partnership with his Son, Jesus Christ our Lord.","dep242-2-1-3":"Seek the LORD while you can find him. Call on him now while he is near.","dep242-2-1-4":"My heart has heard you say, “Come and talk with me.” And my heart responds, “LORD, I am coming.”","dep242-2-1-5":"“Yes, I am the vine; you are the branches. Those who remain in me, and I in them, will produce much fruit. For apart from me you can do nothing.","dep242-2-1-6":"Even strong young lions sometimes go hungry, but those who trust in the LORD will lack no good thing.","dep242-2-1-7":"Let me hear of your unfailing love each morning, for I am trusting you. Show me where to walk, for I give myself to you. Teach me to do your will, for you are my God. May your gracious Spirit lead me forward on a firm footing.","dep242-2-1-8":"I will climb up to my watchtower and stand at my guardpost. There I will wait to see what the LORD says and how he will answer my complaint.","dep242-2-2-1":"Why am I discouraged? Why is my heart so sad? I will put my hope in God! I will praise him again— my Savior and my God!","dep242-2-2-2":"We do this by keeping our eyes on Jesus, the champion who initiates and perfects our faith. Because of the joy awaiting him, he endured the cross, disregarding its shame. Now he is seated in the place of honor beside God’s throne.","dep242-2-2-3":"I am counting on the LORD; yes, I am counting on him. I have put my hope in his word. I long for the Lord more than sentries long for the dawn, yes, more than sentries long for the dawn.","dep242-2-2-4":"As the deer longs for streams of water, so I long for you, O God.","dep242-2-2-5":"Give your burdens to the LORD, and he will take care of you. He will not permit the godly to slip and fall.","dep242-2-2-6":"Praise the Lord; praise God our savior! For each day he carries us in his arms. Interlude","dep242-2-2-7":"If you make the LORD your refuge, if you make the Most High your shelter, no evil will conquer you; no plague will come near your home.","dep242-2-2-8":"Then Jesus said, “Come to me, all of you who are weary and carry heavy burdens, and I will give you rest. Take my yoke upon you. Let me teach you, because I am humble and gentle at heart, and you will find rest for your souls.","dep242-2-2-9":"I rise early, before the sun is up; I cry out for help and put my hope in your words. I stay awake through the night, thinking about your promise.","dep242-2-2-10":"Listen to my voice in the morning, LORD. Each morning I bring my requests to you and wait expectantly.","dep242-2-2-11":"Come, let us worship and bow down. Let us kneel before the LORD our maker,","dep242-2-2-12":"Therefore, let us offer through Jesus a continual sacrifice of praise to God, proclaiming our allegiance to his name.","dep242-2-2-13":"Satisfy us each morning with your unfailing love, so we may sing for joy to the end of our lives.","dep242-2-2-14":"For he satisfies the thirsty and fills the hungry with good things.","dep242-2-3-15":"Before daybreak the next morning, Jesus got up and went out to an isolated place to pray.","dep242-2-3-1":"Inside the Tent of Meeting, the LORD would speak to Moses face to face, as one speaks to a friend. Afterward Moses would return to the camp, but the young man who assisted him, Joshua son of Nun, would remain behind in the Tent of Meeting.","dep242-2-3-2":"But when Daniel learned that the law had been signed, he went home and knelt down as usual in his upstairs room, with its windows open toward Jerusalem. He prayed three times a day, just as he had always done, giving thanks to his God.","dep242-2-3-3":"In fact, in his public ministry he never taught without using parables; but afterward, when he was alone with his disciples, he explained everything to them.","dep242-3-1-1":"or from human initiative. No, those prophets were moved by the Holy Spirit, and they spoke from God.","dep242-3-1-2":"All Scripture is inspired by God and is useful to teach us what is true and to make us realize what is wrong in our lives. It corrects us when we are wrong and teaches us to do what is right.","dep242-3-1-3":"Heaven and earth will disappear, but my words will never disappear.","dep242-3-1-4":"As the Scriptures say, “People are like grass; their beauty is like a flower in the field. The grass withers and the flower fades. But the word of the Lord remains forever.” And that word is the Good News that was preached to you.","dep242-3-1-5":"Make them holy by your truth; teach them your word, which is truth.","dep242-3-1-6":"For you are God, O Sovereign LORD. Your words are truth, and you have promised these good things to your servant.","dep242-3-1-7":"Does not my word burn like fire?” says the LORD. “Is it not like a mighty hammer that smashes a rock to pieces?","dep242-3-1-8":"And because I preach this Good News, I am suffering and have been chained like a criminal. But the word of God cannot be chained.","dep242-3-1-9":"But Jesus told him, “No! The Scriptures say, ‘People do not live by bread alone, but by every word that comes from the mouth of God.’ ”","dep242-3-1-10":"Then Jesus took them through the writings of Moses and all the prophets, explaining from all the Scriptures the things concerning himself.","dep242-3-2-1":"For you have been born again, but not to a life that will quickly end. Your new life will last forever because it comes from the eternal, living word of God.","dep242-3-2-2":"He chose to give birth to us by giving us his true word. And we, out of all creation, became his prized possession.","dep242-3-2-3":"Like newborn babies, you must crave pure spiritual milk so that you will grow into a full experience of salvation. Cry out for this nourishment,","dep242-3-2-4":"“And now I entrust you to God and the message of his grace that is able to build you up and give you an inheritance with all those he has set apart for himself.","dep242-3-2-5":"Your word is a lamp to guide my feet and a light for my path.","dep242-3-2-6":"When you walk, their counsel will lead you. When you sleep, they will protect you. When you wake up, they will advise you. For their command is a lamp and their instruction a light; their corrective discipline is the way to life.","dep242-3-2-7":"He sent out his word and healed them, snatching them from the door of death.","dep242-3-2-8":"But the officer said, “Lord, I am not worthy to have you come into my home. Just say the word from where you are, and my servant will be healed.","dep242-3-2-9":"When I discovered your words, I devoured them. They are my joy and my heart’s delight, for I bear your name, O LORD God of Heaven’s Armies.","dep242-3-2-10":"Your laws are my treasure; they are my heart’s delight.","dep242-3-2-11":"Put on salvation as your helmet, and take the sword of the Spirit, which is the word of God.","dep242-3-2-12":"For the word of God is alive and powerful. It is sharper than the sharpest two-edged sword, cutting between soul and spirit, between joint and marrow. It exposes our innermost thoughts and desires.","dep242-3-3-1":"And the people of Berea were more open-minded than those in Thessalonica, and they listened eagerly to Paul’s message. They searched the Scriptures day after day to see if Paul and Silas were teaching the truth.","dep242-3-3-2":"Oh, how I love your instructions! I think about them all day long.","dep242-3-3-3":"This was because Ezra had determined to study and obey the Law of the LORD and to teach those decrees and regulations to the people of Israel.","dep242-3-3-4":"I have not departed from his commands, but have treasured his words more than daily food.","dep242-3-3-5":"“Master,” Simon replied, “we worked hard all last night and didn’t catch a thing. But if you say so, I’ll let the nets down again.” And this time their nets were so full of fish they began to tear!","dep242-3-4-1":"So faith comes from hearing, that is, hearing the Good News about Christ.","dep242-3-4-2":"Jesus replied, “But even more blessed are all who hear the word of God and put it into practice.”","dep242-3-4-3":"God blesses the one who reads the words of this prophecy to the church, and he blesses all who listen to its message and obey what it says, for the time is near.","dep242-3-4-4":"He must always keep that copy with him and read it daily as long as he lives. That way he will learn to fear the LORD his God by obeying all the terms of these instructions and decrees.","dep242-3-4-5":"And the people of Berea were more open-minded than those in Thessalonica, and they listened eagerly to Paul’s message. They searched the Scriptures day after day to see if Paul and Silas were teaching the truth.","dep242-3-4-6":"Work hard so you can present yourself to God and receive his approval. Be a good worker, one who does not need to be ashamed and who correctly explains the word of truth.","dep242-3-4-7":"And you must commit yourselves wholeheartedly to these commands that I am giving you today.","dep242-3-4-8":"Follow my advice, my son; always treasure my commands. Tie them on your fingers as a reminder. Write them deep within your heart.","dep242-3-4-9":"Oh, the joys of those who do not follow the advice of the wicked, or stand around with sinners, or join in with mockers. But they delight in the law of the LORD, meditating on it day and night.","dep242-3-4-10":"Study this Book of Instruction continually. Meditate on it day and night so you will be sure to obey everything written in it. Only then will you prosper and succeed in all you do.","dep242-4-1-1":"Never stop praying.","dep242-4-1-2":"Devote yourselves to prayer with an alert mind and a thankful heart.","dep242-4-1-3":"The end of the world is coming soon. Therefore, be earnest and disciplined in your prayers.","dep242-4-1-4":"I urge you, first of all, to pray for all people. Ask God to help them; intercede on their behalf, and give thanks for them. Pray this way for kings and all who are in authority so that we can live peaceful and quiet lives marked by godliness and dignity.","dep242-4-2-1":"You can ask for anything in my name, and I will do it, so that the Son can bring glory to the Father. Yes, ask me for anything in my name, and I will do it!","dep242-4-2-2":"Now all glory to God, who is able, through his mighty power at work within us, to accomplish infinitely more than we might ask or think.","dep242-4-2-3":"Ask me and I will tell you remarkable secrets you do not know about things to come.","dep242-4-2-4":"If you need wisdom, ask our generous God, and he will give it to you. He will not rebuke you for asking.","dep242-4-2-5":"I prayed to the LORD, and he answered me. He freed me from all my fears.","dep242-4-2-6":"Then call on me when you are in trouble, and I will rescue you, and you will give me glory.”","dep242-4-2-7":"After this prayer, the meeting place shook, and they were all filled with the Holy Spirit. Then they preached the word of God with boldness.","dep242-4-2-8":"Pray for us, too, that God will give us many opportunities to speak about his mysterious plan concerning Christ. That is why I am here in chains.","dep242-4-3-1":"You haven’t done this before. Ask, using my name, and you will receive, and you will have abundant joy.","dep242-4-3-2":"You can pray for anything, and if you have faith, you will receive it.”","dep242-4-3-3":"Pray in the Spirit at all times and on every occasion. Stay alert and be persistent in your prayers for all believers everywhere.","dep242-4-3-4":"And we are confident that he hears us whenever we ask for anything that pleases him. And since we know he hears us when we make our requests, we also know that he will give us what we ask for.","dep242-4-3-5":"If I had not confessed the sin in my heart, the Lord would not have listened.","dep242-4-3-6":"And we will receive from him whatever we ask because we obey him and do the things that please him.","dep242-4-3-7":"“I also tell you this: If two of you agree here on earth concerning anything you ask, my Father in heaven will do it for you.","dep242-4-3-8":"“Keep on asking, and you will receive what you ask for. Keep on seeking, and you will find. Keep on knocking, and the door will be opened to you.","dep242-4-3-9":"In those days when you pray, I will listen. If you look for me wholeheartedly, you will find me.","dep242-4-3-10":"But if you return to me and obey my commands and live by them, then even if you are exiled to the ends of the earth, I will bring you back to the place I have chosen for my name to be honored.’","dep242-4-4-1":"But when Daniel learned that the law had been signed, he went home and knelt down as usual in his upstairs room, with its windows open toward Jerusalem. He prayed three times a day, just as he had always done, giving thanks to his God.","dep242-4-4-2":"But despite Jesus’ instructions, the report of his power spread even faster, and vast crowds came to hear him preach and to be healed of their diseases. But Jesus often withdrew to the wilderness for prayer.","dep242-4-4-3":"One day soon afterward Jesus went up on a mountain to pray, and he prayed to God all night.","dep242-4-4-4":"Elijah was as human as we are, and yet when he prayed earnestly that no rain would fall, none fell for three and a half years! Then, when he prayed again, the sky sent down rain and the earth began to yield its crops.","dep242-4-4-5":"Around midnight Paul and Silas were praying and singing hymns to God, and the other prisoners were listening.","dep242-4-5-1":"Yours, O LORD, is the greatness, the power, the glory, the victory, and the majesty. Everything in the heavens and on earth is yours, O LORD, and this is your kingdom. We adore you as the one who is over all things. “O our God, we thank you and praise your glorious name!","dep242-4-5-2":"I urge you, first of all, to pray for all people. Ask God to help them; intercede on their behalf, and give thanks for them. Pray this way for kings and all who are in authority so that we can live peaceful and quiet lives marked by godliness and dignity.","dep242-4-5-3":"Be thankful in all circumstances, for this is God’s will for you who belong to Christ Jesus.","dep242-4-5-4":"But if we confess our sins to him, he is faithful and just to forgive us our sins and to cleanse us from all wickedness.","dep242-4-5-5":"Don’t worry about anything; instead, pray about everything. Tell God what you need, and thank him for all he has done. Then you will experience God’s peace, which exceeds anything we can understand. His peace will guard your hearts and minds as you live in Christ Jesus.","dep242-5-1-1":"But now you have been united with Christ Jesus. Once you were far away from God, but now you have been brought near to him through the blood of Christ.","dep242-5-1-2":"and through him God reconciled everything to himself. He made peace with everything in heaven and on earth by means of Christ’s blood on the cross.","dep242-5-1-3":"We proclaim to you what we ourselves have actually seen and heard so that you may have fellowship with us. And our fellowship is with the Father and with his Son, Jesus Christ.","dep242-5-1-4":"May the grace of the Lord Jesus Christ, the love of God, and the fellowship of the Holy Spirit be with you all.","dep242-5-2-1":"For where two or three gather together as my followers, I am there among them.”","dep242-5-2-2":"[A song for pilgrims ascending to Jerusalem. A psalm of David.] How wonderful and pleasant it is when brothers live together in harmony! Harmony is as refreshing as the dew from Mount Hermon that falls on the mountains of Zion. And there the LORD has pronounced his blessing, even life everlasting.","dep242-5-2-3":"You must warn each other every day, while it is still “today,” so that none of you will be deceived by sin and hardened against God.","dep242-5-2-4":"Two people are better off than one, for they can help each other succeed. If one person falls, the other can reach out and help. But someone who falls alone is in real trouble.","dep242-5-2-5":"Run from anything that stimulates youthful lusts. Instead, pursue righteous living, faithfulness, love, and peace. Enjoy the companionship of those who call on the Lord with pure hearts.","dep242-5-2-6":"As iron sharpens iron, so a friend sharpens a friend. As a face is reflected in water, so the heart reflects the real person.","dep242-5-2-7":"Walk with the wise and become wise; associate with fools and get in trouble.","dep242-5-2-8":"This will continue until we all come to such unity in our faith and knowledge of God’s Son that we will be mature in the Lord, measuring up to the full and complete standard of Christ.","dep242-5-2-9":"All the believers devoted themselves to the apostles’ teaching, and to fellowship, and to sharing in meals (including the Lord’s Supper ), and to prayer. all the while praising God and enjoying the goodwill of all the people. And each day the Lord added to their fellowship those who were being saved.","dep242-5-3-1":"for you have been my partners in spreading the Good News about Christ from the time you first heard it until now. Above all, you must live as citizens of heaven, conducting yourselves in a manner worthy of the Good News about Christ. Then, whether I come and see you again or only hear about you, I will know that you are standing together with one spirit and one purpose, fighting together for the faith, which is the Good News.","dep242-5-3-2":"Let us think of ways to motivate one another to acts of love and good works. And let us not neglect our meeting together, as some people do, but encourage one another, especially now that the day of his return is drawing near.","dep242-5-3-3":"For I can testify that they gave not only what they could afford, but far more. And they did it of their own free will. They begged us again and again for the privilege of sharing in the gift for the believers in Jerusalem.","dep242-5-3-4":"Instead, be very glad—for these trials make you partners with Christ in his suffering, so that you will have the wonderful joy of seeing his glory when it is revealed to all the world.","dep242-5-3-5":"Share each other’s burdens, and in this way obey the law of Christ.","dep242-5-4-1":"Is there any encouragement from belonging to Christ? Any comfort from his love? Any fellowship together in the Spirit? Are your hearts tender and compassionate? Then make me truly happy by agreeing wholeheartedly with each other, loving one another, and working together with one mind and purpose.","dep242-5-4-2":"Don’t be selfish; don’t try to impress others. Be humble, thinking of others as better than yourselves. Don’t look out only for your own interests, but take an interest in others, too.","dep242-5-4-3":"There is no lack of love on our part, but you have withheld your love from us. There is no lack of love on our part, but you have withheld your love from us.","dep242-5-4-4":"And further, submit to one another out of reverence for Christ.","dep242-5-4-5":"But they didn’t answer, because they had been arguing about which of them was the greatest. He sat down, called the twelve disciples over to him, and said, “Whoever wants to be first must take last place and be the servant of everyone else.”","dep242-5-4-6":"Look after each other so that none of you fails to receive the grace of God. Watch out that no poisonous root of bitterness grows up to trouble you, corrupting many.","dep242-5-4-7":"Take no part in the worthless deeds of evil and darkness; instead, expose them.","dep242-5-4-8":"Soldiers don’t get tied up in the affairs of civilian life, for then they cannot please the officer who enlisted them.","dep242-5-5-9":"“So if you are presenting a sacrifice at the altar in the Temple and you suddenly remember that someone has something against you, leave your sacrifice there at the altar. Go and be reconciled to that person. Then come and offer your sacrifice to God.","dep242-5-5-1":"“If another believer sins against you, go privately and point out the offense. If the other person listens and confesses it, you have won that person back.","dep242-5-5-2":"But if we confess our sins to him, he is faithful and just to forgive us our sins and to cleanse us from all wickedness.","dep242-5-5-3":"People who conceal their sins will not prosper, but if they confess and turn from them, they will receive mercy.","dep242-6-1-1":"But you will receive power when the Holy Spirit comes upon you. And you will be my witnesses, telling people about me everywhere—in Jerusalem, throughout Judea, in Samaria, and to the ends of the earth.”","dep242-6-1-2":"And all of this is a gift from God, who brought us back to himself through Christ. And God has given us this task of reconciling people to him. For God was in Christ, reconciling the world to himself, no longer counting people’s sins against them. And he gave us this wonderful message of reconciliation.","dep242-6-2-1":"I solemnly urge you in the presence of God and Christ Jesus, who will someday judge the living and the dead when he comes to set up his Kingdom: Preach the word of God. Be prepared, whether the time is favorable or not. Patiently correct, rebuke, and encourage your people with good teaching.","dep242-6-2-2":"For the Son of Man came to seek and save those who are lost.”","dep242-6-2-3":"For we speak as messengers approved by God to be entrusted with the Good News. Our purpose is to please God, not people. He alone examines the motives of our hearts.","dep242-6-2-4":"Yet preaching the Good News is not something I can boast about. I am compelled by God to do it. How terrible for me if I didn’t preach the Good News!","dep242-6-2-5":"But how can they call on him to save them unless they believe in him? And how can they believe in him if they have never heard about him? And how can they hear about him unless someone tells them?","dep242-6-2-6":"who wants everyone to be saved and to understand the truth.","dep242-6-2-7":"Then the LORD said, “You feel sorry about the plant, though you did nothing to put it there. It came quickly and died quickly. But Nineveh has more than 120,000 people living in spiritual darkness, not to mention all the animals. Shouldn’t I feel sorry for such a great city?”","dep242-6-2-8":"In the same way, there is more joy in heaven over one lost sinner who repents and returns to God than over ninety-nine others who are righteous and haven’t strayed away!","dep242-6-2-9":"We proclaim to you what we ourselves have actually seen and heard so that you may have fellowship with us. And our fellowship is with the Father and with his Son, Jesus Christ.","dep242-6-2-10":"Those who are wise will shine as bright as the sky, and those who lead many to righteousness will shine like the stars forever.","dep242-6-3-1":"Jesus called out to them, “Come, follow me, and I will show you how to fish for people!”","dep242-6-3-2":"so that no one can criticize you. Live clean, innocent lives as children of God, shining like bright lights in a world full of crooked and perverse people. Hold firmly to the word of life; then, on the day of Christ’s return, I will be proud that I did not run the race in vain and that my work was not useless.","dep242-6-3-3":"And pray for me, too. Ask God to give me the right words so I can boldly explain God’s mysterious plan that the Good News is for Jews and Gentiles alike.","dep242-6-3-4":"Instead, you must worship Christ as Lord of your life. And if someone asks about your hope as a believer, always be ready to explain it.","dep242-6-3-5":"Many Samaritans from the village believed in Jesus because the woman had said, “He told me everything I ever did!”","dep242-6-3-6":"For the word of God is alive and powerful. It is sharper than the sharpest two-edged sword, cutting between soul and spirit, between joint and marrow. It exposes our innermost thoughts and desires.","dep242-6-3-7":"It is the same with my word. I send it out, and it always produces fruit. It will accomplish all I want it to, and it will prosper everywhere I send it.","dep242-6-3-8":"So when we preach that Christ was crucified, the Jews are offended and the Gentiles say it’s all nonsense. But to those called by God to salvation, both Jews and Gentiles, Christ is the power of God and the wisdom of God.","dep242-6-3-9":"For when we brought you the Good News, it was not only with words but also with power, for the Holy Spirit gave you full assurance that what we said was true. And you know of our concern for you from the way we lived when we were with you.","dep242-6-3-10":"If you openly declare that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved. For it is by believing in your heart that you are made right with God, and it is by openly declaring your faith that you are saved.","dep242-6-3-11":"For God says, “At just the right time, I heard you. On the day of salvation, I helped you.” Indeed, the “right time” is now. Today is the day of salvation.","dep242-6-3-12":"Examine yourselves to see if your faith is genuine. Test yourselves. Surely you know that Jesus Christ is among you; if not, you have failed the test of genuine faith.","dep242-6-3-13":"As was Paul’s custom, he went to the synagogue service, and for three Sabbaths in a row he used the Scriptures to reason with the people. He explained the prophecies and proved that the Messiah must suffer and rise from the dead. He said, “This Jesus I’m telling you about is the Messiah.”","dep242-6-4-1":"But my life is worth nothing to me unless I use it for finishing the work assigned me by the Lord Jesus—the work of telling others the Good News about the wonderful grace of God.","dep242-6-4-2":"The Holy Spirit said to Philip, “Go over and walk along beside the carriage.” Philip ran over and heard the man reading from the prophet Isaiah. Philip asked, “Do you understand what you are reading?”","dep242-6-4-3":"We cannot stop telling about everything we have seen and heard.”","dep242-6-5-1":"So God created human beings in his own image. In the image of God he created them; male and female he created them.","dep242-6-5-2":"Listen! The LORD’s arm is not too weak to save you, nor is his ear too deaf to hear you call. It’s your sins that have cut you off from God. Because of your sins, he has turned away and will not listen anymore.","dep242-6-5-3":"When Adam sinned, sin entered the world. Adam’s sin brought death, so death spread to everyone, for everyone sinned.","dep242-6-5-4":"For everyone has sinned; we all fall short of God’s glorious standard.","dep242-6-5-5":"And just as each person is destined to die once and after that comes judgment,","dep242-6-5-6":"in flaming fire, bringing judgment on those who don’t know God and on those who refuse to obey the Good News of our Lord Jesus. They will be punished with eternal destruction, forever separated from the Lord and from his glorious power.","dep242-6-5-7":"For the wages of sin is death, but the free gift of God is eternal life through Christ Jesus our Lord.","dep242-6-5-8":"“But cowards, unbelievers, the corrupt, murderers, the immoral, those who practice witchcraft, idol worshipers, and all liars—their fate is in the fiery lake of burning sulfur. This is the second death.”","dep242-6-5-9":"God saved you by his grace when you believed. And you can’t take credit for this; it is a gift from God. Salvation is not a reward for the good things we have done, so none of us can boast about it.","dep242-6-5-10":"I do not treat the grace of God as meaningless. For if keeping the law could make us right with God, then there was no need for Christ to die.","dep242-6-5-11":"There is salvation in no one else! God has given no other name under heaven by which we must be saved.”","dep242-6-5-12":"For you know that God paid a ransom to save you from the empty life you inherited from your ancestors. And it was not paid with mere gold or silver, which lose their value.","dep242-6-5-13":"It is foolish to the Jews, who ask for signs from heaven. And it is foolish to the Greeks, who seek human wisdom. So when we preach that Christ was crucified, the Jews are offended and the Gentiles say it’s all nonsense.","dep242-6-5-14":"Since God in his wisdom saw to it that the world would never know him through human wisdom, he has used our foolish preaching to save those who believe.","dep242-6-5-15":"Don’t let anyone capture you with empty philosophies and high-sounding nonsense that come from human thinking and from the spiritual powers of this world, rather than from Christ.","dep242-6-5-16":"They are reborn—not with a physical birth resulting from human passion or plan, but a birth that comes from God.","dep242-6-5-17":"Humans can reproduce only human life, but the Holy Spirit gives birth to spiritual life. So don’t be surprised when I say, ‘You must be born again.’","dep242-6-5-18":"The Spirit alone gives eternal life. Human effort accomplishes nothing. And the very words I have spoken to you are spirit and life.","dep242-6-5-19":"Christ suffered for our sins once for all time. He never sinned, but he died for sinners to bring you safely home to God. He suffered physical death, but he was raised to life in the Spirit.","dep242-6-5-20":"“For this is how God loved the world: He gave his one and only Son, so that everyone who believes in him will not perish but have eternal life.","dep242-6-5-21":"But God showed his great love for us by sending Christ to die for us while we were still sinners.","dep242-6-5-22":"I passed on to you what was most important and what had also been passed on to me. Christ died for our sins, just as the Scriptures said. He was buried, and he was raised from the dead on the third day, just as the Scriptures said.","dep242-6-5-23":"You were dead because of your sins and because your sinful nature was not yet cut away. Then God made you alive with Christ, for he forgave all our sins.","dep242-6-5-24":"“I tell you the truth, those who listen to my message and believe in God who sent me have eternal life. They will never be condemned for their sins, but they have already passed from death into life.","dep242-6-5-25":"But to all who believed him and accepted him, he gave the right to become children of God.","dep242-6-5-26":"“Look! I stand at the door and knock. If you hear my voice and open the door, I will come in, and we will share a meal together as friends.","dep242-6-5-27":"If you openly declare that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved. For it is by believing in your heart that you are made right with God, and it is by openly declaring your faith that you are saved.","dep242-7-1-1":"He existed in the beginning with God. God created everything through him, and nothing was created except through him.","dep242-7-1-2":"for through him God created everything in the heavenly realms and on earth. He made the things we can see and the things we can’t see— such as thrones, kingdoms, rulers, and authorities in the unseen world. Everything was created through him and for him. He existed before anything else, and he holds all creation together.","dep242-7-1-3":"Christ is also the head of the church, which is his body. He is the beginning, supreme over all who rise from the dead. So he is first in everything.","dep242-7-1-4":"Now he is far above any ruler or authority or power or leader or anything else—not only in this world but also in the world to come.","dep242-7-1-5":"that at the name of Jesus every knee should bow, in heaven and on earth and under the earth, and every tongue declare that Jesus Christ is Lord, to the glory of God the Father.","dep242-7-1-6":"Christ died and rose again for this very purpose—to be Lord both of the living and of the dead.","dep242-7-1-7":"Don’t you realize that your body is the temple of the Holy Spirit, who lives in you and was given to you by God? You do not belong to yourself, for God bought you with a high price. So you must honor God with your body.","dep242-7-1-8":"He died for everyone so that those who receive his new life will no longer live for themselves. Instead, they will live for Christ, who died and was raised for them.","dep242-7-2-1":"Seek the Kingdom of God above all else, and live righteously, and he will give you everything you need.","dep242-7-2-2":"“Yes,” Jesus replied, “and I assure you that everyone who has given up house or brothers or sisters or mother or father or children or property, for my sake and for the Good News, will receive now in return a hundred times as many houses, brothers, sisters, mothers, children, and property—along with persecution. And in the world to come that person will have eternal life.","dep242-7-2-3":"“This is what the LORD says: Because you have obeyed me and have not withheld even your son, your only son, I swear by my own name that I will certainly bless you. I will multiply your descendants beyond number, like the stars in the sky and the sand on the seashore. Your descendants will conquer the cities of their enemies.","dep242-7-2-4":"“And Solomon, my son, learn to know the God of your ancestors intimately. Worship and serve him with your whole heart and a willing mind. For the LORD sees every heart and knows every plan and thought. If you seek him, you will find him. But if you forsake him, he will reject you forever.","dep242-7-2-5":"The eyes of the LORD search the whole earth in order to strengthen those whose hearts are fully committed to him. What a fool you have been! From now on you will be at war.”","dep242-7-2-6":"The LORD says, “I will rescue those who love me. I will protect those who trust in my name.","dep242-7-2-7":"“Therefore, the LORD, the God of Israel, says: I promised that your branch of the tribe of Levi would always be my priests. But I will honor those who honor me, and I will despise those who think lightly of me.","dep242-7-3-1":"Then he said to the crowd, “If any of you wants to be my follower, you must give up your own way, take up your cross daily, and follow me.","dep242-7-3-2":"When people’s lives please the LORD, even their enemies are at peace with them.","dep242-7-3-3":"Trust in the LORD with all your heart; do not depend on your own understanding. Seek his will in all you do, and he will show you which path to take.","dep242-7-3-4":"throw off your old sinful nature and your former way of life, which is corrupted by lust and deception. Put on your new nature, created to be like God—truly righteous and holy.","dep242-7-3-5":"Run from anything that stimulates youthful lusts. Instead, pursue righteous living, faithfulness, love, and peace. Enjoy the companionship of those who call on the Lord with pure hearts.","dep242-7-3-6":"After all, we brought nothing with us when we came into the world, and we can’t take anything with us when we leave it. But people who long to be rich fall into temptation and are trapped by many foolish and harmful desires that plunge them into ruin and destruction.","dep242-7-3-7":"So be careful how you live. Don’t live like fools, but like those who are wise. Make the most of every opportunity in these evil days.","dep242-7-3-8":"He called them at once, and they also followed him, leaving their father, Zebedee, in the boat with the hired men.","dep242-7-4-1":"For I fully expect and hope that I will never be ashamed, but that I will continue to be bold for Christ, as I have been in the past. And I trust that my life will bring honor to Christ, whether I live or die.","dep242-7-4-2":"All the others care only for themselves and not for what matters to Jesus Christ. But you know how Timothy has proved himself. Like a son with his father, he has served with me in preaching the Good News.","dep242-7-4-3":"Some were jeered at, and their backs were cut open with whips. Others were chained in prisons. They were too good for this world, wandering over deserts and mountains, hiding in caves and holes in the ground.","dep242-8-1":"I will make you into a great nation. I will bless you and make you famous, and you will be a blessing to others. I will bless those who bless you and curse those who treat you with contempt. All the families on earth will be blessed through you.”","dep242-8-2":"He says, “You will do more than restore the people of Israel to me. I will make you a light to the Gentiles, and you will bring my salvation to the ends of the earth.”","dep242-8-3":"Therefore, go and make disciples of all the nations, baptizing them in the name of the Father and the Son and the Holy Spirit. Teach these new disciples to obey all the commands I have given you. And be sure of this: I am with you always, even to the end of the age.”","dep242-8-4":"But you will receive power when the Holy Spirit comes upon you. And you will be my witnesses, telling people about me everywhere—in Jerusalem, throughout Judea, in Samaria, and to the ends of the earth.”","dep242-8-5":"Then I heard the Lord asking, “Whom should I send as a messenger to this people? Who will go for us?” I said, “Here I am. Send me.”","dep242-8-6":"I am a special messenger from Christ Jesus to you Gentiles. I bring you the Good News so that I might present you as an acceptable offering to God, made holy by the Holy Spirit.","dep242-8-7":"Only ask, and I will give you the nations as your inheritance, the whole earth as your possession.","dep242-8-8":"Be exalted, O God, above the highest heavens! May your glory shine over all the earth.","dep242-8-9":"This truth gives them confidence that they have eternal life, which God—who does not lie—promised them before the world began. And now at just the right time he has revealed this message, which we announce to everyone. It is by the command of God our Savior that I have been entrusted with this work for him.","dep242-8-10":"But the Lord stood with me and gave me strength so that I might preach the Good News in its entirety for all the Gentiles to hear. And he rescued me from certain death.","dep242-8-11":"So we tell others about Christ, warning everyone and teaching everyone with all the wisdom God has given us. We want to present them to God, perfect in their relationship to Christ. That’s why I work and struggle so hard, depending on Christ’s mighty power that works within me.","dep242-8-12":"I pray that your love will overflow more and more, and that you will keep on growing in knowledge and understanding. May you always be filled with the fruit of your salvation—the righteous character produced in your life by Jesus Christ—for this will bring much glory and praise to God.","dep242-8-13":"You have heard me teach things that have been confirmed by many reliable witnesses. Now teach these truths to other trustworthy people who will be able to pass them on to others.","dep242-8-14":"The smallest family will become a thousand people, and the tiniest group will become a mighty nation. At the right time, I, the LORD, will make it happen.”","dep242-8-15":"Therefore, since we are surrounded by such a huge crowd of witnesses to the life of faith, let us strip off every weight that slows us down, especially the sin that so easily trips us up. And let us run with endurance the race God has set before us.","dep242-8-16":"The eyes of the LORD search the whole earth in order to strengthen those whose hearts are fully committed to him. What a fool you have been! From now on you will be at war.”","dep242-8-17":"For as the waters fill the sea, the earth will be filled with an awareness of the glory of the LORD.","dep242-8-18":"But my name is honored by people of other nations from morning till night. All around the world they offer sweet incense and pure offerings in honor of my name. For my name is great among the nations,” says the LORD of Heaven’s Armies."},"jpn":{"assurance-1":"そのあかしとは、神が永遠のいのちをわたしたちに賜り、かつ、そのいのちが御子のうちにあるということである。 御子を持つ者はいのちを持ち、神の御子を持たない者はいのちを持っていない。","assurance-2":"今までは、あなたがたはわたしの名によって求めたことはなかった。求めなさい。そうすれば、与えられるであろう。そして、あなたがたの喜びが満ちあふれるであろう。","assurance-3":"あなたがたの会った試練で、世の常でないものはない。神は真実である。あなたがたを耐えられないような試練に会わせることはないばかりか、試練と同時に、それに耐えられるように、のがれる道を備えて下さるのである。","assurance-4":"もし、わたしたちが自分の罪を告白するならば、神は真実で正しいかたであるから、その罪をゆるし、すべての不義からわたしたちをきよめて下さる。","assurance-5":"心をつくして主に信頼せよ、自分の知識にたよってはならない。 すべての道で主を認めよ、そうすれば、主はあなたの道をまっすぐにされる。","living-1":"わたしはぶどうの木、あなたがたはその枝である。もし人がわたしにつながっており、またわたしがその人とつながっておれば、その人は実を豊から結ぶようになる。わたしから離れては、あなたがたは何一つできないからである。","living-2":"今わたしは、主とその恵みの言とに、あなたがたをゆだねる。御言には、あなたがたの徳をたて、聖別されたすべての人々と共に、御国をつがせる力がある。","living-3":"すべて神の御霊に導かれている者は、すなわち、神の子である。","living-4":"わたしたちは、見えるものによらないで、信仰によって歩いているのである。","living-5":"愛する者たちよ。神がこのようにわたしたちを愛して下さったのであるから、わたしたちも互に愛し合うべきである。","living-6":"しかし、神が光の中にいますように、わたしたちも光の中を歩くならば、わたしたちは互に交わりをもち、そして、御子イエスの血が、すべての罪からわたしたちをきよめるのである。","living-7":"ただ、心の中でキリストを主とあがめなさい。また、あなたがたのうちにある望みについて説明を求める人には、いつでも弁明のできる用意をしていなさい。","living-8":"各自は惜しむ心からでなく、また、しいられてでもなく、自ら心で決めたとおりにすべきである。","tms60-A-1":"だれでもキリストにあるならば、その人は新しく造られた者である。古いものは過ぎ去った、見よ、すべてが新しくなったのである。","tms60-A-2":"生きているのは、もはや、わたしではない。キリストが、わたしたちのうちに生きておられるのである。しかし、わたしがいま肉にあって生きているのは、わたしを愛し、わたしのためにご自身をささげられた神の御子を信じる信仰によって、生きているのである。","tms60-A-3":"兄弟たちよ。そういうわけで、神のあわれみによってあなたがたに勧める。あなたがたのからだを、神に喜ばれる、生きた、聖なる供え物としてささげなさい。それが、あなたがたのなすべき霊的な礼拝である。","tms60-A-4":"わたしのいましめを心にいだいてこれを守る者は、わたしを愛する者である。わたしを愛する者は、わたしの父に愛されるであろう。わたしもその人を愛し、その人にわたし自身をあらわすであろう」。","tms60-A-5":"聖書は、すべて神の霊感を受けて書かれたものであって、人を教え、戒め、正しくし、義に導くのに有益である。","tms60-A-6":"この律法の書をあなたの口から離すことなく、昼も夜もそれを思い、そのうちにしるされていることを、ことごとく守って行わなければならない。そうするならば、あなたの道は栄え、あなたは勝利を得るであろう。","tms60-A-7":"あなたがたはわたしんつながっており、わたしの言葉があなたがたにとどまっているならば、なんでも望むものを求めるがよい。そうすれば、与えられるであろう。","tms60-A-8":"何事も思い煩ってはならない。ただ、事ごとに、感謝をもって祈りと願いとをささげ、あなたがたの求めるところを神に申し上げるがよい。 そうすれば、人知ではとうてい測り知ることのできない神の平安が、あなたがたの心と思いとを、キリスト・イエスにあって守るであろう。","tms60-A-9":"ふたりまたは三人が、わたしの名によって集まっている所には、わたしもその中にいるのである。","tms60-A-10":"愛と善行とを励むように互に努め、 ある人たちがいつもしているように、集会をやめることはしないで互に励まし、かの日が近づいているのを見て、ますます、そうしようではないか。","tms60-A-11":"イエスは彼らに言われた、「わたしについてきなさい。あなたがたを、人間をとる漁師にしてあげよう」。","tms60-A-12":"わたしは福音を恥としない。それは、ユダヤ人をはじめ、ギリシャ人にも、すべて信じる者に、救いを得させる神の力である。","tms60-B-1":"すなわち、すべての人は罪を犯したため、神の栄光を受けられなくなっており、","tms60-B-2":"われわれはみな羊のように迷って、おのおの自分の道に向かって行った。主はわれわれすべての者の不義を、彼の上におかれた。","tms60-B-3":"罪の支払う報酬は死である。しかし神の賜物は、わたしたちの主イエス・キリストにおける永遠のいのちである。","tms60-B-4":"そして、一度だけ死ぬことと、死んだ後さばきを受けることが、人間に定まっているように、","tms60-B-5":"しかし、まだ罪人であった時、わたしたちのためにキリストが死んで下さったことによって、神はわたしたちに対する愛を示されたのである。","tms60-B-6":"キリストも、あなたがたを神に近づけようとして、自らは義なるかたであるのに、不義なる人々のために、ひとたび罪のゆえに死なれたのである。ただし、肉においては殺されたが、霊においては生かされたのである。","tms60-B-7":"あなたがたの救われたのは、実に、恵みにより、信仰によるのである。それは、あなたがた自身から出たものではなく、神の賜物である。 決して行いによるのではない。それは、だれも誇ることがないためなのである。","tms60-B-8":"わたしたちの行った義のわざによってではなく、ただ神のあわれみによって、再生の洗いを受け、聖霊により新たにされて、わたしたちは救われたのである。","tms60-B-9":"しかし、彼を受けいれた者、すなわち、その名を信じた人々には、彼は神の子となる力を与えたのである。","tms60-B-10":"見よ、わたしを聞いて戸をあけるなら、わたしはその中にはいって彼と食を共にし、彼もまたわたしと食を共にするであろう。","tms60-B-11":"これらのことをあなたがたに書きおくったのは、神の子の御名を信じるあなたがたに、永遠のいのちを持っていることを、悟らせるためである。","tms60-B-12":"よくよくあなたがたに言っておく。わたしの言葉を聞いて、わたしをつかわされたかたを信じる者は、永遠の命を受け、またさばかれることがなく、死から命に移っているのである。","tms60-C-1":"あなたがたは神の宮であって、神の御霊が自分のうちに宿っていることを知らないのか。","tms60-C-2":"ところが、わたしたちが受けたのは、この世の霊ではなく、神からの霊である。それによって、神から賜った恵みを悟るためである。","tms60-C-3":"恐れてはならない、わたしはあなたと共にいる。驚いてはならない、わたしはあなたの神である。わたしはあなたを強くし、あなたを助け、わが勝利の右の手をもって、あなたをささえる。","tms60-C-4":"わたしを強くして下さるかたによって、何事でもすることができる。","tms60-C-5":"主のいつくしみは絶えることがなく、そのあわれみは尽きることがない。 これは朝ごとに新しく、あなたの真実は大きい。","tms60-C-6":"神は人のように偽ることはなく、／また人の子のように悔いることもない。言ったことで、行わないことがあろうか、／語ったことで、しとげないことがあろうか。","tms60-C-7":"あなたは全き平安をもって／こころざしの堅固なものを守られる。彼はあなたに信頼しているからである。","tms60-C-8":"神はあなたがたをかえりみていて下さるのであるから、自分の思いわずらいを、いっさい神にゆだねるがよい。","tms60-C-9":"ご自身の御子をさえ惜しまないで、わたしたちすべての者のために死に渡されたかたが、どうして、御子のみならず万物をも賜らないことがあろうか。","tms60-C-10":"わたしの神は、ご自身の栄光の富の中から、あなたがたのいっさいの必要を、キリスト・イエスにあって満たして下さるであろう。","tms60-C-11":"主ご自身、試練を受けて苦しまれたからこそ、試練の中にある者たちを助けることができるのである。","tms60-C-12":"若い人はどうしておのが道を／清く保つことができるでしょうか。み言葉にしたがって、それを守るよりほかにありません。 わたしはあなたにむかって／罪を犯すことのないように、心のうちにみ言葉をたくわえました。","tms60-D-1":"まず神の国と神の義とを求めなさい。そうすれば、これらのものは、すべて添え与えられるであろう。","tms60-D-2":"それから、みんなの者に、言われた、「だれでもわたしについてきたいと思うなら、自分を捨て、日々自分の十字架を負うて、わたしに従ってきなさい。","tms60-D-3":"世と世にあるものを、愛してはいけない。もし、世を愛する者があれば、父の愛は彼のうちにない。 すべて世にあるものは、すなわち、肉の欲、目の欲、持ち物の誇は、父から出たものではなく、世から出たものである。","tms60-D-4":"あなたがたは、この世と妥協してはならない。むしろ、心を新たにすることによって、作りかえられ、何が神の御旨であるか、何が善であって、神に喜ばれ、かつ全きことであるかを、わきまえて知るべきである。","tms60-D-5":"だから愛する兄弟たちよ。固く立って動かされず、いつも全力を注いで主のわざに励みなさい。主にあっては、あなたがたの労苦がむだになることはないと、あなたがたは知っているからである。","tms60-D-6":"あなたがたは、弱り果てて意気そそうしないために、罪人らのこのような反抗を堪え忍んだかたのことを、思いみるべきである。","tms60-D-7":"人の子がきたのも、仕えられるためではなく、仕えるためであり、また多くの人のあがないとして、自分の命を与えるためである」。","tms60-D-8":"しかし、わたしたちは自分自身を宣べ伝えるのではなく、主なるキリスト・イエスを宣べ伝える。わたしたち自身は、ただイエスのために働くあなたがたの僕にすぎない。","tms60-D-9":"あなたの財産と、すべての産物の初なりをもって主をあがめよ。 そうすれば、あなたの倉は満ちて余り、あなたの酒ぶねは新しい酒であふれる。","tms60-D-10":"わたしの考えはこうである。少ししかまかない者は、少ししか刈り取らず、豊かにまく者は、豊かに刈り取ることになる。 各自は惜しむ心からでなく、また、しいられてでもなく、自ら心で決めたとおりにすべきである。","tms60-D-11":"ただ、聖霊があなたがたにくだる時、あなたがたは力を受けて、エルサレム、ユダヤとサマリヤの全土、さらに地のはてまで、わたしの証人となるであろう」。","tms60-D-12":"それゆえに、あなたがたは行って、すべての国民を弟子として、父と子と聖霊との名によって、彼らにバプテスマを施し、 あなたがたに命じておいたいっさいのことを守るように教えよ。見よ、わたしは世の終わりまで、いつもあなたがたと共にいるのである」。","tms60-E-1":"わたしは、新しいいましめをあなたがたに与える、互いに愛し合いなさい。わたしがあなたがたを愛したように、あなたがたも互いに愛し合いなさい。 互いに愛し合うならば、それによって、あなたがたがわたしの弟子であることを、すべての者が認めるであろう」。","tms60-E-2":"子たちよ。わたしたちは言や口先だけで愛するのではなく、行いと真実とをもって愛し合おうではないか。","tms60-E-3":"何事も党派心や虚栄からするのでなく、へりくだった心をもって互いに人を自分よりすぐれた者としなさい。 おのおの、自分のことばかりではなく、他人のことも考えなさい。","tms60-E-4":"同じように、若い人たちよ。長老たちに従いなさい。また、みな互に謙遜を身につけなさい。神は高ぶる者をしりぞけ、へりくだる者に恵みを賜るからである。 だから、あなたがたは、神の力強い御手の下に、自らを低くしなさい。時が来れば神はあなたがたを高くして下さるであろう。","tms60-E-5":"また、不品行といろいろな汚れや貪欲などを、聖徒にふさわしく、あなたがたの間では、口にすることさえしてはならない。","tms60-E-6":"愛する者たちよ。あなたがたに勧める。あなたがたは、この世の旅人であり寄留者であるから、たましいに戦いをいどむ肉の欲を避けなさい。","tms60-E-7":"あなたがたは盗んではならない。欺いてはならない。互に偽ってはならない。","tms60-E-8":"わたしはまた、神に対しまた人に対して、良心に責められることのないように、常に努めています。","tms60-E-9":"信仰がなくては、神に喜ばれることはできない。なぜなら、神に来る者は、神のいますことと、ご自身を求める者に報いて下さることとを、必ず信じるはずだからである。","tms60-E-10":"彼は、神の約束を不信仰のゆえに疑うようなことはせず、かえって信仰によって強められ、栄光を神に帰し、 神はその約束されたことを、また成就することができると確信した。","tms60-E-11":"わたしたちは、善を行うことに、うみ疲れてはならない。たゆまないでいると、時が来れば刈り取るようになる。 だから、機会あるごとに、だれに対しても、とくに信仰の仲間に対して、善を行おうではないか。","tms60-E-12":"そのように、あなたがたの光を人々の前に輝やかし、そして、人々があなたがたのよいおこないを見て、天にいますあなたがたの父をあがめるようにしなさい。","tms180-s1-1-1":"初めに言があった。言は主と共にあった。言は神であった。 そして言は肉体となり、わたしたちのうちに宿った。わたしたちはその栄光を見た。それは父のひとり子としての栄光であった。めぐみとまことに満ちていた。","tms180-s1-1-2":"御子については、「神よ、あなたの御座は世々限りなく続き、あなたの支配のつえは、公平のつえである。","tms180-s1-1-3":"この大祭司は、わたしたちの弱さを思いやることのできないようなかたではない。罪は犯されなかったが、すべてのことについて、わたしたちと同じように試練に会われたのである。","tms180-s1-1-4":"イエスはますます知恵が加わり、背たけも伸び、そして神と人から愛された。","tms180-s1-1-5":"わたしが最も大事なこととしてあなたがたに伝えたのは、わたし自身も受けたことであった。すなわちキリストが、聖書に書いてあるとおり、わたしたちの罪のために死んだこと、 そして葬られたこと、聖書に書いてあるとおり、三日目によみがえったこと、","tms180-s1-1-6":"しかし事実、キリストは眠っている者の初穂として、死人の中からよみがえったのである。","tms180-s1-1-7":"神を見た者はまだひとりもいない。ただ父のふところにいるひとりの子なる神だけが、神をあらわしたのである。","tms180-s1-1-8":"御子は神の栄光の輝きであり、神の本質の真の姿であって、罪のきよめのわざをなし終えてから、いと高きところにいます大能者の右に、座につかれたのである。","tms180-s1-1-9":"人の子がきたのは、失われたものを尋ね出して救うためである」。","tms180-s1-1-10":"あなたがたのよく知っているとおり、あなたがたの先祖伝来の空疎な生活からあがない出されたのは、金や銀のような朽ちる物によったのではなく、 きずも、しみもない小羊のようなキリストの尊い血によったのである。","tms180-s1-1-11":"すなわち、主ご自身が天使のかしらの声と神のラッパの鳴り響くうちに、合図の声で、天から下ってこられる。その時、キリストにあって死んだ人々が、まず最初によみがえり、 それから生き残っているわたしたちが、彼らと共に雲に包まれて引き上げられ、空中で主に会い、こうして、いつも主と共にいるであろう。","tms180-s1-1-12":"愛する者たちよ。わたしたちは今や神の子である。しかし、わたしたちがどうなるのか、まだ明かではない。彼らが現れる時、わたしたちは、自分たちが彼に似るものとなることを知っている。そのまことの御姿を見るからである。 彼についてこの望みを抱いている者は皆、彼がきよくあられるように、自らをきよくする。","tms180-s1-2-1":"けれども真理の御霊が来る時には、あなたがたをあらゆる真理に導いてくれるであろう。それは自分から語るのではなく、その聞くところを語り、きたるべき事をあなたがに知らせるであろう。 御霊はわたしに栄光を得させるであろう。","tms180-s1-2-2":"そこで、あなたがたに言っておくが、神の霊によって語る者はだれも「イエスはのろわれよ」とは言わないし、また、聖霊によらなければ、だれも「イエスは主である」と言うことができない。","tms180-s1-2-3":"しかし、神の御霊があなたがたの内に宿っているなら、あなたがたは肉におるのではなく、霊におるのである。もし、キリストの霊を持たない人がいるなら、その人はキリストのものではない。","tms180-s1-2-4":"このように、あなたがたは子であるのだから、神はわたしたちの心の中に、「アバ、父よ」と呼ぶ御子の霊をおくって下さったのである。","tms180-s1-2-5":"酒に酔ってはいけない。それは乱行のもとである。むしろ御霊に満たされて、","tms180-s1-2-6":"わたしは命じる。御霊によって歩きなさい。そうすれば、決して肉の欲を満たすことはない。","tms180-s1-2-7":"しかし、聖書に書いてあるとおり、「目がまだ見ず、耳がまだ聞かず、人の心に思い浮かびもしなかったを、神はご自分を愛する者たちのために備えられた」のである。 そして、それは神は、御霊によってわたしたちに啓示して下さったのである。御霊はすべてのものをきわめ、神の深みまでもきわめるのだからである。","tms180-s1-2-8":"しかし、助け主、すなわち、父がわたしの名によってつかわされる聖霊は、あなたがたにすべてのことを教え、またわたしが話しておいたことを、ことごとく思い起こさせるであろう。","tms180-s1-2-9":"そして、わたしの言葉もわたしの宣教も、巧みな知恵の言葉によらないで、霊と力との証明によったのである。 それは、あなたがたの信仰が人の知恵によらないで、神の力によるものとなるためである。","tms180-s1-2-10":"なぜなら、わたしたちの福音があなたがたに伝えられたとき、それは言葉だけによらず、力と聖霊と強い確信とによったからである。わたしたちが、あなたがたの間で、みんなのためにどんなことをしたか、あなたがたの知っているとおりである。","tms180-s1-2-11":"すべてこれらのものは、一つの同じ御霊の働きであって、御霊は思いのままに、それらを各自に分け与えられるのである。","tms180-s1-2-12":"霊の賜物は種々あるが、御霊は同じである。 働きは種々あるが、すべてのものの中に働いてすべてのことなさる神は、同じである。","tms180-s1-3-1":"『ああ主なる神よ、あなたは大いなる力と、伸べた腕をもって天と地をお造りになったのです。あなたのできないことは、ひとつもありません。","tms180-s1-3-2":"ああ深いかな、神の知恵と知識との富は。そのさばきは窮めがたく、その道は測りがたい。","tms180-s1-3-3":"主は言われる、人は、ひそかな所に身を隠して、わたしに見られないようにすることができようか。主は言われる、わたしは天と地とに満ちているではないか。","tms180-s1-3-4":"神は喜んで施す人を愛して下さるのである。神はあなたがたにあらゆる恵みを豊かに与え、あなたがたを常にすべてのことに満ち足らせ、すべての良いわざに富ませる力のあるかたなのである。","tms180-s1-3-5":"主よ、大いなることと、力と、栄光と、勝利と、威光とはあなたのものです。天にあるもの、地にあるものも皆あなたのものです。主よ、国もまたあなたのものです。あなたは万有のかしらとして、あがめられます。 われわれの神よ、われわれは、いま、あなたに感謝し、あなたの光栄ある名をたたえます。","tms180-s1-3-6":"しかし、主は真実なかたであるから、あなたがたを強め、悪しき者から守って下さるであろう。","tms180-s1-3-7":"神は霊であるから、礼拝をする者も、霊とまこととをもって礼拝するべきである」。","tms180-s1-3-8":"むしろ、あなたがたを召して下さった霊なるかたにならって、あなたがた自身も、あらゆる行いにおいて霊なる者となりなさい。 聖書に、「わたしが聖なる者であるから、あなたがたも聖なる者になるべきである」と書いてあるからである。","tms180-s1-3-9":"主は大いなる神で、大いにほめたたえらるべきです。その大いなることは測り知ることができません。","tms180-s1-3-10":"わたしたちが神を愛したのではなく、神がわたしたちを愛して下さって、わたしたちの罪のためにあがないの供え物として、御子をおつかわしになった。ここに愛がある。","tms180-s1-3-11":"しかし主よ、あなたはあわれみと恵みに富み、怒りをおそくし、いつくしみと、まこととに／豊かな神でいらせられます。","tms180-s1-3-12":"神は、神を愛する者たち、すなわち、ご計画に従って召された者たちと共に働いて、万事を益となるようにして下さることを、わたしたちは知っている。","tms180-s2-1-1":"愛にあって真理を語り、あらゆる点において成長し、かくらなるキリストに達するのである。","tms180-s2-1-2":"互いにうそを言ってはならない。あなたがたは、古き人をその行いと一緒に脱ぎ捨て、","tms180-s2-1-3":"愛を追い求める人は人のあやまちをゆるす、人のことを言いふらす者は友を離れさせる。","tms180-s2-1-4":"人のよしあしを言いあるく者は秘密をもらす、心の忠信なる者は事を隠
