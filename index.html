nde es Jehová y digno de suprema alabanza; su grandeza es insondable.","tms180-s1-3-10":"En esto consiste el amor: no en que nosotros hayamos amado a Dios, sino en que él nos amó a nosotros y envió a su Hijo en propiciación por nuestros pecados.","tms180-s1-3-11":"Mas tú, Señor, Dios misericordioso y clemente, lento para la ira y grande en misericordia y verdad,","tms180-s1-3-12":"Sabemos, además, que a los que aman a Dios, todas las cosas los ayudan a bien, esto es, a los que conforme a su propósito son llamados.","tms180-s2-1-1":"sino que, siguiendo la verdad en amor, crezcamos en todo en aquel que es la cabeza, esto es, Cristo,","tms180-s2-1-2":"No mintáis los unos a los otros, habiéndoos despojado del viejo hombre con sus hechos","tms180-s2-1-3":"El que encubre la falta busca la amistad; el que la divulga, aparta al amigo.","tms180-s2-1-4":"El que anda con chismes revela el secreto; el de espíritu fiel lo guarda íntegro.","tms180-s2-1-5":"para que lo dé a conocer anunciándolo como es debido. Sea vuestra palabra siempre con gracia, sazonada con sal, para que sepáis cómo debéis responder a cada uno.","tms180-s2-1-6":"La respuesta suave aplaca la ira, pero la palabra áspera hace subir el furor.","tms180-s2-1-7":"Confesaos vuestras ofensas unos a otros y orad unos por otros, para que seáis sanados. La oración eficaz del justo puede mucho.","tms180-s2-1-8":"\"Por tanto, si traes tu ofrenda al altar y allí te acuerdas de que tu hermano tiene algo contra ti, deja allí tu ofrenda delante del altar y ve, reconcíliate primero con tu hermano, y entonces vuelve y presenta tu ofrenda.","tms180-s2-1-9":"Por esto, mis amados hermanos, todo hombre sea pronto para oir, tardo para hablar, tardo para airarse,","tms180-s2-1-10":"Al que responde sin haber escuchado, la palabra le es fatuidad y vergüenza.","tms180-s2-1-11":"No reprendas al escarnecedor, para que no te aborrezca; corrige al sabio, y te amará. Da al sabio, y será más sabio; enseña al justo, y aumentará su saber.","tms180-s2-1-12":"\"Por tanto, si tu hermano peca contra ti, ve y repréndelo estando tú y él solos; si te oye, has ganado a tu hermano.","tms180-s2-2-1":"Antes sed bondadosos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo.","tms180-s2-2-2":"Soportaos unos a otros y perdonaos unos a otros, si alguno tiene queja contra otro. De la manera que Cristo os perdonó, así también hacedlo vosotros.","tms180-s2-2-3":"con toda humildad y mansedumbre, soportándoos con paciencia los unos a los otros en amor,","tms180-s2-2-4":"porque el siervo del Señor no debe ser amigo de contiendas, sino amable para con todos, apto para enseñar, sufrido. Debe corregir con mansedumbre a los que se oponen, por si quizá Dios les conceda que se arrepientan para conocer la verdad","tms180-s2-2-5":"Airaos, pero no pequéis; no se ponga el sol sobre vuestro enojo,","tms180-s2-2-6":"Pero ahora dejad también vosotros todas estas cosas: ira, enojo, malicia, blasfemia, palabras deshonestas de vuestra boca.","tms180-s2-2-7":"Mirad bien, para que ninguno deje de alcanzar la gracia de Dios, y para que no brote ninguna raíz de amargura que os perturbe y contamine a muchos.","tms180-s2-2-8":"Quítense de vosotros toda amargura, enojo, ira, gritería, maledicencia y toda malicia.","tms180-s2-2-9":"pues ¿qué mérito tiene el soportar que os abofeteen si habéis pecado? Pero si por hacer lo que es bueno sufrís, y lo soportáis, esto ciertamente es aprobado delante de Dios. Para esto fuisteis llamados, porque también Cristo padeció por nosotros, dejándonos ejemplo para que sigáis sus pisadas.","tms180-s2-2-10":"No os venguéis vosotros mismos, amados míos, sino dejad lugar a la ira de Dios, porque escrito está: \"Mía es la venganza, yo pagaré, dice el Señor\".","tms180-s2-2-11":"Cruel es la ira e impetuoso el furor, pero ¿quién podrá sostenerse delante de la envidia?","tms180-s2-2-12":"pues donde hay celos y rivalidad, allí hay perturbación y toda obra perversa.","tms180-s2-3-1":"Y el Dios de la paciencia y de la consolación os dé entre vosotros un mismo sentir según Cristo Jesús, para que unánimes, a una voz, glorifiquéis al Dios y Padre de nuestro Señor Jesucristo.","tms180-s2-3-2":"Os ruego, pues, hermanos, por el nombre de nuestro Señor Jesucristo, que habléis todos una misma cosa, y que no haya entre vosotros divisiones, sino que estéis perfectamente unidos en una misma mente y un mismo parecer,","tms180-s2-3-3":"Pero entre vosotros no será así, sino que el que quiera hacerse grande entre vosotros será vuestro servidor, y el que quiera ser el primero entre vosotros será vuestro siervo;","tms180-s2-3-4":"Vosotros, hermanos, a libertad fuisteis llamados; solamente que no uséis la libertad como ocasión para la carne, sino servíos por amor los unos a los otros,","tms180-s2-3-5":"Cada uno de nosotros agrade a su prójimo en lo que es bueno, para edificación,","tms180-s2-3-6":"Nada hagáis por rivalidad o por vanidad; antes bien, con humildad, estimando cada uno a los demás como superiores a él mismo. No busquéis vuestro propio provecho, sino el de los demás.","tms180-s2-3-7":"Por lo cual, animaos unos a otros y edificaos unos a otros, así como lo estáis haciendo.","tms180-s2-3-8":"Mejor son dos que uno, pues reciben mejor paga por su trabajo. Porque si caen, el uno levantará a su compañero; pero ¡ay del que está solo! Cuando caiga no habrá otro que lo levante.","tms180-s2-3-9":"Al ver las multitudes tuvo compasión de ellas, porque estaban desamparadas y dispersas como ovejas que no tienen pastor.","tms180-s2-3-10":"Gozaos con los que se gozan; llorad con los que lloran.","tms180-s2-3-11":"Pero la sabiduría que es de lo alto es primeramente pura, después pacífica, amable, benigna, llena de misericordia y de buenos frutos, sin incertidumbre ni hipocresía.","tms180-s2-3-12":"Hermanos, si alguno es sorprendido en alguna falta, vosotros que sois espirituales, restauradlo con espíritu de mansedumbre, considerándote a ti mismo, no sea que tú también seas tentado.","tms180-s3-1-1":"Todas las cosas que pertenecen a la vida y a la piedad nos han sido dadas por su divino poder, mediante el conocimiento de aquel que nos llamó por su gloria y excelencia; por medio de estas cosas nos ha dado preciosas y grandísimas promesas, para que por ellas lleguéis a ser participantes de la naturaleza divina, habiendo huido de la corrupción que hay en el mundo a causa de las pasiones.","tms180-s3-1-2":"porque todas las promesas de Dios son en él \"sí\", y en él \"Amén\", por medio de nosotros, para la gloria de Dios.","tms180-s3-1-3":"Bendito sea el Dios y Padre de nuestro Señor Jesucristo, Padre de misericordias y Dios de toda consolación, el cual nos consuela en todas nuestras tribulaciones, para que podamos también nosotros consolar a los que están en cualquier tribulación, por medio de la consolación con que nosotros somos consolados por Dios.","tms180-s3-1-4":"Así que ni el que planta es algo ni el que riega, sino Dios que da el crecimiento. Y el que planta y el que riega son una misma cosa, aunque cada uno recibirá su recompensa conforme a su labor,","tms180-s3-1-5":"sino que en la ley de Jehová está su delicia y en su Ley medita de día y de noche. Será como árbol plantado junto a corrientes de aguas, que da su fruto en su tiempo y su hoja no cae, y todo lo que hace prosperará.","tms180-s3-1-6":"Si tenéis estas cosas y abundan en vosotros, no os dejarán estar ociosos ni sin fruto en cuanto al conocimiento de nuestro Señor Jesucristo.","tms180-s3-1-7":"Pero el Dios de toda gracia, que nos llamó a su gloria eterna en Jesucristo, después que hayáis padecido un poco de tiempo, él mismo os perfeccione, afirme, fortalezca y establezca.","tms180-s3-1-8":"Y me ha dicho: \"Bástate mi gracia, porque mi poder se perfecciona en la debilidad\". Por tanto, de buena gana me gloriaré más bien en mis debilidades, para que repose sobre mí el poder de Cristo.","tms180-s3-1-9":"Bendito sea el Dios y Padre de nuestro Señor Jesucristo, que nos bendijo con toda bendición espiritual en los lugares celestiales en Cristo,","tms180-s3-1-10":"Deléitate asimismo en Jehová y él te concederá las peticiones de tu corazón. Encomienda a Jehová tu camino, confía en él y él hará.","tms180-s3-1-11":"Hijitos míos, estas cosas os escribo para que no pequéis. Pero si alguno ha pecado, abogado tenemos para con el Padre, a Jesucristo, el justo. Él es la propiciación por nuestros pecados, y no solamente por los nuestros, sino también por los de todo el mundo.","tms180-s3-1-12":"Cuanto está lejos el oriente del occidente, hizo alejar de nosotros nuestras rebeliones.","tms180-s3-2-1":"La palabra de Dios es viva, eficaz y más cortante que toda espada de dos filos: penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón.","tms180-s3-2-2":"\"Porque como desciende de los cielos la lluvia y la nieve, y no vuelve allá, sino que riega la tierra y la hace germinar y producir, y da semilla al que siembra y pan al que come, así será mi palabra que sale de mi boca: no volverá a mí vacía, sino que hará lo que yo quiero y será prosperada en aquello para lo cual la envié.","tms180-s3-2-3":"Pero ante todo entended que ninguna profecía de la Escritura es de interpretación privada, porque nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo.","tms180-s3-2-4":"Por lo cual también nosotros damos gracias a Dios sin cesar, porque cuando recibisteis la palabra de Dios que oísteis de nosotros, la recibisteis no como palabra de hombres, sino según es en verdad, la palabra de Dios, la cual actúa en vosotros los creyentes.","tms180-s3-2-5":"Fueron halladas tus palabras, y yo las comí. Tu palabra me fue por gozo y por alegría de mi corazón; porque tu nombre se invocó sobre mí, Jehová, Dios de los ejércitos.","tms180-s3-2-6":"Nunca me separé del mandamiento de sus labios, sino que guardé las palabras de su boca más que mi comida.","tms180-s3-2-7":"Estos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así.","tms180-s3-2-8":"Escudriñad las Escrituras, porque a vosotros os parece que en ellas tenéis la vida eterna, y ellas son las que dan testimonio de mí; y no queréis venir a mí para que tengáis vida.","tms180-s3-2-9":"y conoceréis la verdad y la verdad os hará libres. Le respondieron: —Descendientes de Abraham somos y jamás hemos sido esclavos de nadie. ¿Cómo dices tú: \"Seréis libres\"?","tms180-s3-2-10":"Él respondió y dijo: —Escrito está: \"No solo de pan vivirá el hombre, sino de toda palabra que sale de la boca de Dios\".","tms180-s3-2-11":"El cielo y la tierra pasarán, pero mis palabras no pasarán.","tms180-s3-2-12":"Santifícalos en tu verdad: tu palabra es verdad.","tms180-s3-3-1":"Por lo cual vosotros os alegráis, aunque ahora por un poco de tiempo, si es necesario, tengáis que ser afligidos en diversas pruebas, para que, sometida a prueba vuestra fe, mucho más preciosa que el oro (el cual, aunque perecedero, se prueba con fuego), sea hallada en alabanza, gloria y honra cuando sea manifestado Jesucristo.","tms180-s3-3-2":"Hermanos míos, gozaos profundamente cuando os halléis en diversas pruebas, Pero tenga la paciencia su obra completa, para que seáis perfectos y cabales, sin que os falte cosa alguna.","tms180-s3-3-3":"También a nosotros se nos ha anunciado la buena nueva como a ellos; a ellos de nada les sirvió haber oído la palabra, por no ir acompañada de fe en los que la oyeron.","tms180-s3-3-4":"Mas el justo vivirá por fe; pero si retrocede, no agradará a mi alma\".","tms180-s3-3-5":"Sobre todo, tomad el escudo de la fe, con que podáis apagar todos los dardos de fuego del maligno.","tms180-s3-3-6":"Pero tú, hombre de Dios, huye de estas cosas y sigue la justicia, la piedad, la fe, el amor, la paciencia, la mansedumbre. Pelea la buena batalla de la fe, echa mano de la vida eterna, a la cual asimismo fuiste llamado, habiendo hecho la buena profesión delante de muchos testigos.","tms180-s3-3-7":"Es, pues, la fe la certeza de lo que se espera, la convicción de lo que no se ve.","tms180-s3-3-8":"Así que la fe es por el oir, y el oir, por la palabra de Dios.","tms180-s3-3-9":"a fin de que no os hagáis perezosos, sino imitadores de aquellos que por la fe y la paciencia heredan las promesas.","tms180-s3-3-10":"Así también la fe, si no tiene obras, está completamente muerta.","tms180-s3-3-11":"sabiendo que el hombre no es justificado por las obras de la Ley, sino por la fe de Jesucristo, nosotros también hemos creído en Jesucristo, para ser justificados por la fe de Cristo y no por las obras de la Ley, por cuanto por las obras de la Ley nadie será justificado.","tms180-s3-3-12":"Justificados, pues, por la fe, tenemos paz para con Dios por medio de nuestro Señor Jesucristo,","tms180-s4-1-1":"Pero gracias sean dadas a Dios, que nos da la victoria por medio de nuestro Señor Jesucristo.","tms180-s4-1-2":"Pero gracias a Dios, que nos lleva siempre en triunfo en Cristo Jesús, y que por medio de nosotros manifiesta en todo lugar el olor de su conocimiento,","tms180-s4-1-3":"porque las armas de nuestra milicia no son carnales, sino poderosas en Dios para la destrucción de fortalezas, derribando argumentos y toda altivez que se levanta contra el conocimiento de Dios, y llevando cautivo todo pensamiento a la obediencia a Cristo,","tms180-s4-1-4":"Por lo demás, hermanos míos, fortaleceos en el Señor y en su fuerza poderosa. Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo,","tms180-s4-1-5":"Ellos lo han vencido por medio de la sangre del Cordero y de la palabra del testimonio de ellos, que menospreciaron sus vidas hasta la muerte.","tms180-s4-1-6":"Someteos, pues, a Dios; resistid al diablo, y huirá de vosotros. Acercaos a Dios, y él se acercará a vosotros. Pecadores, limpiad las manos; y vosotros los de doble ánimo, purificad vuestros corazones.","tms180-s4-1-7":"Los que son de la carne piensan en las cosas de la carne; pero los que son del Espíritu, en las cosas del Espíritu. El ocuparse de la carne es muerte, pero el ocuparse del Espíritu es vida y paz,","tms180-s4-1-8":"Al contrario, vestíos del Señor Jesucristo y no satisfagáis los deseos de la carne.","tms180-s4-1-9":"Hijitos, vosotros sois de Dios y los habéis vencido, porque mayor es el que está en vosotros que el que está en el mundo.","tms180-s4-1-10":"porque todo lo que es nacido de Dios vence al mundo; y esta es la victoria que ha vencido al mundo, nuestra fe. ¿Quién es el que vence al mundo, sino el que cree que Jesús es el Hijo de Dios?","tms180-s4-1-11":"La Ley de su Dios está en su corazón; por tanto, sus pies no resbalarán.","tms180-s4-1-12":"No reine, pues, el pecado en vuestro cuerpo mortal, de modo que lo obedezcáis en sus apetitos; ni tampoco presentéis vuestros miembros al pecado como instrumentos de iniquidad, sino presentaos vosotros mismos a Dios como vivos de entre los muertos, y vuestros miembros a Dios como instrumentos de justicia.","tms180-s4-2-1":"Por lo demás, hermanos, todo lo que es verdadero, todo lo honesto, todo lo justo, todo lo puro, todo lo amable, todo lo que es de buen nombre; si hay virtud alguna, si algo digno de alabanza, en esto pensad.","tms180-s4-2-2":"Todas las cosas son puras para los puros, pero para los corrompidos e incrédulos nada es puro, pues hasta su mente y su conciencia están corrompidas.","tms180-s4-2-3":"El hombre bueno, del buen tesoro de su corazón saca lo bueno; y el hombre malo, del mal tesoro de su corazón saca lo malo, porque de la abundancia del corazón habla la boca.","tms180-s4-2-4":"Sobre toda cosa que guardes, guarda tu corazón, porque de él mana la vida.","tms180-s4-2-5":"\"La lámpara del cuerpo es el ojo; así que, si tu ojo es bueno, todo tu cuerpo estará lleno de luz;","tms180-s4-2-6":"Pero yo os digo que cualquiera que mira a una mujer para codiciarla, ya adulteró con ella en su corazón.","tms180-s4-2-7":"La voluntad de Dios es vuestra santificación: que os apartéis de fornicación;","tms180-s4-2-8":"Los alimentos son para el vientre, y el vientre para los alimentos; pero tanto al uno como a los otros destruirá Dios. Pero el cuerpo no es para la fornicación, sino para el Señor y el Señor para el cuerpo.","tms180-s4-2-9":"Ninguna palabra corrompida salga de vuestra boca, sino la que sea buena para la necesaria edificación, a fin de dar gracia a los oyentes.","tms180-s4-2-10":"Pero yo os digo que de toda palabra ociosa que hablen los hombres, de ella darán cuenta en el día del juicio, pues por tus palabras serás justificado, y por tus palabras serás condenado\".","tms180-s4-2-11":"Absteneos de toda especie de mal.","tms180-s4-2-12":"No reprendas al anciano, sino exhórtalo como a padre; a los más jóvenes, como a hermanos; a las ancianas, como a madres; a las jovencitas, como a hermanas, con toda pureza.","tms180-s4-3-1":"Y todo lo que pidáis en oración, creyendo, lo recibiréis.","tms180-s4-3-2":"\"Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá, porque todo aquel que pide, recibe; y el que busca, halla; y al que llama, se le abrirá.","tms180-s4-3-3":"Pero tú, cuando ores, entra en tu cuarto, cierra la puerta y ora a tu Padre que está en secreto; y tu Padre, que ve en lo secreto, te recompensará en público.","tms180-s4-3-4":"Levantándose muy de mañana, siendo aún muy oscuro, salió y se fue a un lugar desierto, y allí oraba.","tms180-s4-3-5":"Clama a mí y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces.","tms180-s4-3-6":"Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, según el poder que actúa en nosotros,","tms180-s4-3-7":"Esta es la confianza que tenemos en él, que si pedimos alguna cosa conforme a su voluntad, él nos oye. Y si sabemos que él nos oye en cualquiera cosa que pidamos, sabemos que tenemos las peticiones que le hayamos hecho.","tms180-s4-3-8":"Orad sin cesar. Dad gracias en todo, porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.","tms180-s4-3-9":"Así que, lejos de mí pecar contra Jehová dejando de rogar por vosotros; antes os instruiré en el camino bueno y recto.","tms180-s4-3-10":"Entonces dijo a sus discípulos: \"A la verdad la mies es mucha, pero los obreros pocos. Rogad, pues, al Señor de la mies, que envíe obreros a su mies\".","tms180-s4-3-11":"Así que, ofrezcamos siempre a Dios, por medio de él, sacrificio de alabanza, es decir, fruto de labios que confiesan su nombre.","tms180-s4-3-12":"¡Alaba, alma mía, a Jehová! Alabaré a Jehová en mi vida; cantaré salmos a mi Dios mientras viva.","tms180-s5-1-1":"A ellos, Dios quiso dar a conocer las riquezas de la gloria de este misterio entre los gentiles, que es Cristo en vosotros, esperanza de gloria. Nosotros anunciamos a Cristo, amonestando a todo hombre y enseñando a todo hombre en toda sabiduría, a fin de presentar perfecto en Cristo Jesús a todo hombre.","tms180-s5-1-2":"Dios estaba en Cristo reconciliando consigo al mundo, no tomándoles en cuenta a los hombres sus pecados, y nos encargó a nosotros la palabra de la reconciliación. Así que, somos embajadores en nombre de Cristo, como si Dios rogara por medio de nosotros; os rogamos en nombre de Cristo: Reconciliaos con Dios.","tms180-s5-1-3":"Al contrario, si hablamos es porque Dios nos aprobó y nos confió el evangelio. No procuramos agradar a los hombres, sino a Dios, que prueba nuestros corazones,","tms180-s5-1-4":"Por lo cual, siendo libre de todos, me he hecho siervo de todos para ganar al mayor número.","tms180-s5-1-5":"¿No decís vosotros: \"Aún faltan cuatro meses para que llegue la siega\"? Yo os digo: Alzad vuestros ojos y mirad los campos, porque ya están blancos para la siega.","tms180-s5-1-6":"Tan grande es nuestro afecto por vosotros, que hubiéramos querido entregaros no solo el evangelio de Dios, sino también nuestras propias vidas, porque habéis llegado a sernos muy queridos.","tms180-s5-1-7":"Como está escrito: \"No hay justo, ni aun uno; Todos se desviaron, a una se hicieron inútiles; no hay quien haga lo bueno, no hay ni siquiera uno.","tms180-s5-1-8":"en llama de fuego, para dar retribución a los que no conocieron a Dios ni obedecen al evangelio de nuestro Señor Jesucristo. Estos sufrirán pena de eterna perdición, excluidos de la presencia del Señor y de la gloria de su poder,","tms180-s5-1-9":"Él mismo llevó nuestros pecados en su cuerpo sobre el madero, para que nosotros, estando muertos a los pecados, vivamos a la justicia. ¡Por su herida habéis sido sanados!","tms180-s5-1-10":"Él nos salvó y llamó con llamamiento santo, no conforme a nuestras obras, sino según el propósito suyo y la gracia que nos fue dada en Cristo Jesús antes de los tiempos de los siglos,","tms180-s5-1-11":"Si confiesas con tu boca que Jesús es el Señor y crees en tu corazón que Dios lo levantó de entre los muertos, serás salvo, porque con el corazón se cree para justicia, pero con la boca se confiesa para salvación.","tms180-s5-1-12":"yo les doy vida eterna y no perecerán jamás, ni nadie las arrebatará de mi mano. Mi Padre, que me las dio, mayor que todos es, y nadie las puede arrebatar de la mano de mi Padre.","tms180-s5-2-1":"Todo camino del hombre es recto en su propia opinión, pero Jehová pesa los corazones.","tms180-s5-2-2":"porque ¿de qué le aprovechará al hombre ganar todo el mundo, si pierde su alma?","tms180-s5-2-3":"El que quiera hacer la voluntad de Dios, conocerá si la doctrina es de Dios o si yo hablo por mi propia cuenta.","tms180-s5-2-4":"Respondiendo Jesús, les dijo: —Los que están sanos no tienen necesidad de médico, sino los enfermos. No he venido a llamar a justos, sino a pecadores al arrepentimiento.","tms180-s5-2-5":"¿Cómo podéis vosotros creer, pues recibís gloria los unos de los otros y no buscáis la gloria que viene del Dios único?","tms180-s5-2-6":"Por eso puede también salvar perpetuamente a los que por él se acercan a Dios, viviendo siempre para interceder por ellos.","tms180-s5-2-7":"No te jactes del día de mañana porque no sabes qué dará de sí el día.","tms180-s5-2-8":"De manera que cada uno de nosotros dará a Dios cuenta de sí.","tms180-s5-2-9":"Escudriñad las Escrituras, porque a vosotros os parece que en ellas tenéis la vida eterna, y ellas son las que dan testimonio de mí;","tms180-s5-2-10":"Hay camino que al hombre le parece derecho, pero es camino que lleva a la muerte.","tms180-s5-2-11":"\"Entonces dirá también a los de la izquierda: \"Apartaos de mí, malditos, al fuego eterno preparado para el diablo y sus ángeles,","tms180-s5-2-12":"Lo invisible de él, su eterno poder y su deidad, se hace claramente visible desde la creación del mundo y se puede discernir por medio de las cosas hechas. Por lo tanto, no tienen excusa,","tms180-s5-3-1":"pues ya sabéis que fuisteis rescatados de vuestra vana manera de vivir (la cual recibisteis de vuestros padres) no con cosas corruptibles, como oro o plata, sino con la sangre preciosa de Cristo, como de un cordero sin mancha y sin contaminación.","tms180-s5-3-2":"Y todo esto proviene de Dios, quien nos reconcilió consigo mismo por Cristo, y nos dio el ministerio de la reconciliación:","tms180-s5-3-3":"En él tenemos redención por su sangre, el perdón de pecados según las riquezas de su gracia,","tms180-s5-3-4":"El pecado no se enseñoreará de vosotros, pues no estáis bajo la Ley, sino bajo la gracia. ¿Qué, pues? ¿Pecaremos porque no estamos bajo la Ley, sino bajo la gracia? ¡De ninguna manera!","tms180-s5-3-5":"porque todos sois hijos de Dios por la fe en Cristo Jesús,","tms180-s5-3-6":"Pero vosotros sois linaje escogido, real sacerdocio, nación santa, pueblo adquirido por Dios, para que anunciéis las virtudes de aquel que os llamó de las tinieblas a su luz admirable.","tms180-s5-3-7":"Al que no conoció pecado, por nosotros lo hizo pecado, para que nosotros seamos justicia de Dios en él.","tms180-s5-3-8":"Pero por él estáis vosotros en Cristo Jesús, el cual nos ha sido hecho por Dios sabiduría, justificación, santificación y redención,","tms180-s5-3-9":"Y así, con una sola ofrenda hizo perfectos para siempre a los santificados.","tms180-s5-3-10":"y son justificados gratuitamente por su gracia, mediante la redención que es en Cristo Jesús,","tms180-s5-3-11":"Pero nuestra ciudadanía está en los cielos, de donde también esperamos al Salvador, al Señor Jesucristo.","tms180-s5-3-12":"Porque en él habita corporalmente toda la plenitud de la divinidad, y vosotros estáis completos en él, que es la cabeza de todo principado y potestad.","dep242-1-1":"Examinaos a vosotros mismos, para ver si estáis en la fe; probaos a vosotros mismos. ¿O no os conocéis a vosotros mismos? ¿No sabéis que Jesucristo está en vosotros? ¡A menos que estéis reprobados!","dep242-1-2":"Y este es el testimonio: que Dios nos ha dado vida eterna y esta vida está en su Hijo. El que tiene al Hijo tiene la vida; el que no tiene al Hijo de Dios no tiene la vida.","dep242-1-3":"De cierto, de cierto os digo: El que cree en mí tiene vida eterna.","dep242-1-4":"Estas cosas os he escrito a vosotros que creéis en el nombre del Hijo de Dios, para que sepáis que tenéis vida eterna y para que creáis en el nombre del Hijo de Dios.","dep242-1-5":"En él tenemos redención por su sangre, el perdón de pecados según las riquezas de su gracia,","dep242-1-6":"Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, sino conforme al Espíritu,","dep242-1-7":"y son justificados gratuitamente por su gracia, mediante la redención que es en Cristo Jesús,","dep242-1-8":"Justificados, pues, por la fe, tenemos paz para con Dios por medio de nuestro Señor Jesucristo,","dep242-1-9":"Bendito el Dios y Padre de nuestro Señor Jesucristo, que según su gran misericordia nos hizo renacer para una esperanza viva, por la resurrección de Jesucristo de los muertos,","dep242-1-10":"nos salvó, no por obras de justicia que nosotros hubiéramos hecho, sino por su misericordia, por el lavamiento de la regeneración y por la renovación en el Espíritu Santo,","dep242-1-11":"Todos los que son guiados por el Espíritu de Dios, son hijos de Dios,","dep242-1-12":"porque todos sois hijos de Dios por la fe en Cristo Jesús,","dep242-1-13":"Pero vosotros no vivís según la carne, sino según el Espíritu, si es que el Espíritu de Dios está en vosotros. Y si alguno no tiene el Espíritu de Cristo, no es de él.","dep242-1-14":"Y yo rogaré al Padre y os dará otro Consolador, para que esté con vosotros para siempre: el Espíritu de verdad, al cual el mundo no puede recibir, porque no lo ve ni lo conoce; pero vosotros lo conocéis, porque vive con vosotros y estará en vosotros.","dep242-1-15":"ni lo alto ni lo profundo, ni ninguna otra cosa creada nos podrá separar del amor de Dios, que es en Cristo Jesús, Señor nuestro.","dep242-1-16":"yo les doy vida eterna y no perecerán jamás, ni nadie las arrebatará de mi mano. Mi Padre, que me las dio, mayor que todos es, y nadie las puede arrebatar de la mano de mi Padre.","dep242-1-17":"En él también vosotros, habiendo oído la palabra de verdad, el evangelio de vuestra salvación, y habiendo creído en él, fuisteis sellados con el Espíritu Santo de la promesa,","dep242-1-18":"pues habéis renacido, no de simiente corruptible, sino de incorruptible, por la palabra de Dios que vive y permanece para siempre,","dep242-2-1-1":"Sin embargo, Jehová esperará para tener piedad de vosotros. A pesar de todo, será exaltado y tendrá de vosotros misericordia, porque Jehová es Dios justo. ¡Bienaventurados todos los que confían en él!","dep242-2-1-2":"Fiel es Dios, por el cual fuisteis llamados a la comunión con su Hijo Jesucristo, nuestro Señor.","dep242-2-1-3":"\"¡Buscad a Jehová mientras puede ser hallado, llamadle en tanto que está cercano!","dep242-2-1-4":"Mi corazón ha dicho de ti: \"Buscad mi rostro\". Tu rostro buscaré, Jehová;","dep242-2-1-5":"\"Yo soy la vid, vosotros los pámpanos; el que permanece en mí y yo en él, este lleva mucho fruto, porque separados de mí nada podéis hacer.","dep242-2-1-6":"Los leoncillos necesitan, y tienen hambre; pero los que buscan a Jehová no tendrán falta de ningún bien.","dep242-2-1-7":"Hazme oír por la mañana tu misericordia, porque en ti he confiado. Hazme saber el camino por donde ande, porque hacia ti he elevado mi alma. Enséñame a hacer tu voluntad, porque tú eres mi Dios; tu buen espíritu me guíe a tierra de rectitud.","dep242-2-1-8":"\"En mi puesto de guardia estaré, sobre la fortaleza afirmaré el pie. Velaré para ver lo que se me dirá y qué he de responder tocante a mi queja.","dep242-2-2-1":"¿Por qué te abates, alma mía, y por qué te turbas dentro de mí? Espera en Dios, porque aún he de alabarlo, ¡salvación mía y Dios mío!","dep242-2-2-2":"puestos los ojos en Jesús, el autor y consumador de la fe, el cual por el gozo puesto delante de él sufrió la cruz, menospreciando el oprobio, y se sentó a la diestra del trono de Dios.","dep242-2-2-3":"Esperé yo en Jehová; esperó mi alma, en su palabra he esperado. Mi alma espera en Jehová más que los centinelas la mañana, más que los vigilantes la mañana.","dep242-2-2-4":"Como el ciervo brama por las corrientes de las aguas, así clama por ti, Dios, el alma mía.","dep242-2-2-5":"Echa sobre Jehová tu carga y él te sostendrá; no dejará para siempre caído al justo.","dep242-2-2-6":"¡Bendito sea el Señor! ¡Cada día nos colma de beneficios el Dios de nuestra salvación! Selah","dep242-2-2-7":"Porque has puesto a Jehová, que es mi esperanza, al Altísimo por tu habitación, no te sobrevendrá mal ni plaga tocará tu morada,","dep242-2-2-8":"Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar. Llevad mi yugo sobre vosotros y aprended de mí, que soy manso y humilde de corazón, y hallaréis descanso para vuestras almas,","dep242-2-2-9":"Me anticipé al alba y clamé; esperé en tu palabra. Se anticiparon mis ojos a las vigilias de la noche, para meditar en tus mandatos.","dep242-2-2-10":"Jehová, de mañana oirás mi voz; de mañana me presentaré delante de ti y esperaré.","dep242-2-2-11":"Venid, adoremos y postrémonos; arrodillémonos delante de Jehová, nuestro hacedor,","dep242-2-2-12":"Así que, ofrezcamos siempre a Dios, por medio de él, sacrificio de alabanza, es decir, fruto de labios que confiesan su nombre.","dep242-2-2-13":"De mañana sácianos de tu misericordia, y cantaremos y nos alegraremos todos nuestros días.","dep242-2-2-14":"porque sacia al alma menesterosa, y llena de bien al alma hambrienta.","dep242-2-3-15":"Levantándose muy de mañana, siendo aún muy oscuro, salió y se fue a un lugar desierto, y allí oraba.","dep242-2-3-1":"Jehová hablaba con Moisés cara a cara, como habla cualquiera con su compañero. Luego Moisés volvía al campamento, pero el joven Josué hijo de Nun, su servidor, nunca se apartaba de en medio del Tabernáculo.","dep242-2-3-2":"Cuando Daniel supo que el edicto había sido firmado, entró en su casa; abiertas las ventanas de su habitación que daban a Jerusalén, se arrodillaba tres veces al día, oraba y daba gracias delante de su Dios como solía hacerlo antes.","dep242-2-3-3":"Y sin parábolas no les hablaba; aunque a sus discípulos se lo explicaba todo en privado.","dep242-3-1-1":"porque nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo.","dep242-3-1-2":"Toda la Escritura es inspirada por Dios y útil para enseñar, para redargüir, para corregir, para instruir en justicia,","dep242-3-1-3":"El cielo y la tierra pasarán, pero mis palabras no pasarán.","dep242-3-1-4":"porque: \"Toda carne es como hierba y toda la gloria del hombre como flor de la hierba; la hierba se seca y la flor se cae, mas la palabra del Señor permanece para siempre\". Y esta es la palabra que por el evangelio os ha sido anunciada.","dep242-3-1-5":"Santifícalos en tu verdad: tu palabra es verdad.","dep242-3-1-6":"Ahora pues, Jehová Dios, tú eres Dios, y tus palabras son verdad, y tú has prometido este bien a tu siervo.","dep242-3-1-7":"¿No es mi palabra como un fuego, dice Jehová, y como un martillo que quebranta la piedra?","dep242-3-1-8":"en el cual sufro penalidades, hasta prisiones a modo de malhechor; pero la palabra de Dios no está presa.","dep242-3-1-9":"Él respondió y dijo: —Escrito está: \"No solo de pan vivirá el hombre, sino de toda palabra que sale de la boca de Dios\".","dep242-3-1-10":"Y comenzando desde Moisés y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían.","dep242-3-2-1":"pues habéis renacido, no de simiente corruptible, sino de incorruptible, por la palabra de Dios que vive y permanece para siempre,","dep242-3-2-2":"Él, de su voluntad, nos hizo nacer por la palabra de verdad, para que seamos primicias de sus criaturas.","dep242-3-2-3":"y desead, como niños recién nacidos, la leche espiritual no adulterada, para que por ella crezcáis para salvación,","dep242-3-2-4":"\"Y ahora, hermanos, os encomiendo a Dios y a la palabra de su gracia, que tiene poder para sobreedificaros y daros herencia con todos los santificados.","dep242-3-2-5":"Lámpara es a mis pies tu palabra y lumbrera a mi camino.","dep242-3-2-6":"Te guiarán cuando camines, te guardarán cuando duermas y hablarán contigo cuando despiertes. Porque el mandamiento es lámpara, la enseñanza es luz, y camino de vida son las reprensiones que te instruyen","dep242-3-2-7":"Envió su palabra y los sanó; los libró de su ruina.","dep242-3-2-8":"Respondió el centurión y dijo: —Señor, no soy digno de que entres bajo mi techo; solamente di la palabra y mi criado sanará,","dep242-3-2-9":"Fueron halladas tus palabras, y yo las comí. Tu palabra me fue por gozo y por alegría de mi corazón; porque tu nombre se invocó sobre mí, Jehová, Dios de los ejércitos.","dep242-3-2-10":"Por heredad he tomado tus testimonios para siempre, porque son el gozo de mi corazón.","dep242-3-2-11":"Tomad el yelmo de la salvación, y la espada del Espíritu, que es la palabra de Dios.","dep242-3-2-12":"La palabra de Dios es viva, eficaz y más cortante que toda espada de dos filos: penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón.","dep242-3-3-1":"Estos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así.","dep242-3-3-2":"¡Cuánto amo yo tu Ley! ¡Todo el día es ella mi meditación!","dep242-3-3-3":"Porque Esdras había preparado su corazón para estudiar la ley de Jehová y para cumplirla, y para enseñar en Israel sus estatutos y decretos.","dep242-3-3-4":"Nunca me separé del mandamiento de sus labios, sino que guardé las palabras de su boca más que mi comida.","dep242-3-3-5":"Respondiendo Simón, le dijo: —Maestro, toda la noche hemos estado trabajando y nada hemos pescado; pero en tu palabra echaré la red. Cuando lo hicieron, recogieron tal cantidad de peces que su red se rompía.","dep242-3-4-1":"Así que la fe es por el oir, y el oir, por la palabra de Dios.","dep242-3-4-2":"Pero él dijo: —¡Antes bien, bienaventurados los que oyen la palabra de Dios y la obedecen!","dep242-3-4-3":"Bienaventurado el que lee y los que oyen las palabras de esta profecía, y guardan las cosas en ella escritas, porque el tiempo está cerca.","dep242-3-4-4":"Lo tendrá consigo y lo leerá todos los días de su vida, para que aprenda a temer a Jehová, su Dios, guardando todas las palabras de esta Ley y estos estatutos, y poniéndolos por obra.","dep242-3-4-5":"Estos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así.","dep242-3-4-6":"Procura con diligencia presentarte a Dios aprobado, como obrero que no tiene de qué avergonzarse, que usa bien la palabra de verdad.","dep242-3-4-7":"\"Estas palabras que yo te mando hoy, estarán sobre tu corazón.","dep242-3-4-8":"\"Hijo mío, guarda mis razones y atesora para ti mis mandamientos. Átalos a tus dedos, escríbelos en la tabla de tu corazón.","dep242-3-4-9":"Bienaventurado el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado, sino que en la ley de Jehová está su delicia y en su Ley medita de día y de noche.","dep242-3-4-10":"Nunca se apartará de tu boca este libro de la Ley, sino que de día y de noche meditarás en él, para que guardes y hagas conforme a todo lo que está escrito en él, porque entonces harás prosperar tu camino y todo te saldrá bien.","dep242-4-1-1":"Orad sin cesar.","dep242-4-1-2":"Perseverad en la oración, velando en ella con acción de gracias.","dep242-4-1-3":"El fin de todas las cosas se acerca; sed, pues, sobrios y velad en oración.","dep242-4-1-4":"Exhorto ante todo, a que se hagan rogativas, oraciones, peticiones y acciones de gracias por todos los hombres, por los reyes y por todos los que tienen autoridad, para que vivamos quieta y reposadamente en toda piedad y honestidad.","dep242-4-2-1":"Todo lo que pidáis al Padre en mi nombre, lo haré, para que el Padre sea glorificado en el Hijo. Si algo pedís en mi nombre, yo lo haré.","dep242-4-2-2":"Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, según el poder que actúa en nosotros,","dep242-4-2-3":"Clama a mí y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces.","dep242-4-2-4":"Si alguno de vosotros tiene falta de sabiduría, pídala a Dios, el cual da a todos abundantemente y sin reproche, y le será dada.","dep242-4-2-5":"Busqué a Jehová, y él me oyó y me libró de todos mis temores.","dep242-4-2-6":"Invócame en el día de la angustia; te libraré y tú me honrarás\".","dep242-4-2-7":"Cuando terminaron de orar, el lugar en que estaban congregados tembló; y todos fueron llenos del Espíritu Santo y hablaban con valentía la palabra de Dios.","dep242-4-2-8":"Orad también al mismo tiempo por nosotros, para que el Señor nos abra puerta para la palabra, a fin de dar a conocer el misterio de Cristo, por el cual también estoy preso,","dep242-4-3-1":"Hasta ahora nada habéis pedido en mi nombre; pedid, y recibiréis, para que vuestro gozo sea completo.","dep242-4-3-2":"Y todo lo que pidáis en oración, creyendo, lo recibiréis.","dep242-4-3-3":"Orad en todo tiempo con toda oración y súplica en el Espíritu, y velad en ello con toda perseverancia y súplica por todos los santos","dep242-4-3-4":"Esta es la confianza que tenemos en él, que si pedimos alguna cosa conforme a su voluntad, él nos oye. Y si sabemos que él nos oye en cualquiera cosa que pidamos, sabemos que tenemos las peticiones que le hayamos hecho.","dep242-4-3-5":"Si en mi corazón hubiera yo mirado a la maldad, el Señor no me habría escuchado.","dep242-4-3-6":"y cualquiera cosa que pidamos la recibiremos de él, porque guardamos sus mandamientos y hacemos las cosas que son agradables delante de él.","dep242-4-3-7":"Otra vez os digo que si dos de vosotros se ponen de acuerdo en la tierra acerca de cualquier cosa que pidan, les será hecho por mi Padre que está en los cielos,","dep242-4-3-8":"\"Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá,","dep242-4-3-9":"Entonces me invocaréis. Vendréis y oraréis a mí, y yo os escucharé. Me buscaréis y me hallaréis, porque me buscaréis de todo vuestro corazón.","dep242-4-3-10":"pero si os volvéis a mí y guardáis mis mandamientos y los ponéis por obra, aunque vuestra dispersión sea hasta el extremo de los cielos, de allí os recogeré y os traeré al lugar que escogí para hacer habitar allí mi nombre\".","dep242-4-4-1":"Cuando Daniel supo que el edicto había sido firmado, entró en su casa; abiertas las ventanas de su habitación que daban a Jerusalén, se arrodillaba tres veces al día, oraba y daba gracias delante de su Dios como solía hacerlo antes.","dep242-4-4-2":"Pero su fama se extendía más y más; y se reunía mucha gente para oírlo y para que los sanara de sus enfermedades. Pero él se apartaba a lugares desiertos para orar.","dep242-4-4-3":"En aquellos días él fue al monte a orar, y pasó la noche orando a Dios.","dep242-4-4-4":"Elías era hombre sujeto a pasiones semejantes a las nuestras, y oró fervientemente para que no lloviera, y no llovió sobre la tierra durante tres años y seis meses. Y otra vez oró, y el cielo dio lluvia y la tierra produjo su fruto.","dep242-4-4-5":"Pero a medianoche, orando Pablo y Silas, cantaban himnos a Dios; y los presos los oían.","dep242-4-5-1":"Tuya es, Jehová, la magnificencia y el poder, la gloria, la victoria y el honor; porque todas las cosas que están en los cielos y en la tierra son tuyas. Tuyo, Jehová, es el reino, y tú eres excelso sobre todos. Ahora pues, Dios nuestro, nosotros alabamos y loamos tu glorioso nombre.","dep242-4-5-2":"Exhorto ante todo, a que se hagan rogativas, oraciones, peticiones y acciones de gracias por todos los hombres, por los reyes y por todos los que tienen autoridad, para que vivamos quieta y reposadamente en toda piedad y honestidad.","dep242-4-5-3":"Dad gracias en todo, porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.","dep242-4-5-4":"Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados y limpiarnos de toda maldad.","dep242-4-5-5":"Por nada estéis angustiados, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias. Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús.","dep242-5-1-1":"Pero ahora en Cristo Jesús, vosotros que en otro tiempo estabais lejos, habéis sido hechos cercanos por la sangre de Cristo.","dep242-5-1-2":"y por medio de él reconciliar consigo todas las cosas, así las que están en la tierra como las que están en los cielos, haciendo la paz mediante la sangre de su cruz.","dep242-5-1-3":"lo que hemos visto y oído, eso os anunciamos, para que también vosotros tengáis comunión con nosotros; y nuestra comunión verdaderamente es con el Padre y con su Hijo Jesucristo.","dep242-5-1-4":"La gracia del Señor Jesucristo, el amor de Dios y la comunión del Espíritu Santo sean con todos vosotros. Amén.","dep242-5-2-1":"porque donde están dos o tres congregados en mi nombre, allí estoy yo en medio de ellos.","dep242-5-2-2":"¡Mirad cuán bueno y cuán delicioso es que habiten los hermanos juntos en armonía! como el rocío del Hermón, que desciende sobre los montes de Sión, porque allí envía Jehová bendición y vida eterna.","dep242-5-2-3":"Antes bien, exhortaos los unos a los otros cada día, entre tanto que se dice: \"Hoy\", para que ninguno de vosotros se endurezca por el engaño del pecado,","dep242-5-2-4":"Mejor son dos que uno, pues reciben mejor paga por su trabajo. Porque si caen, el uno levantará a su compañero; pero ¡ay del que está solo! Cuando caiga no habrá otro que lo levante.","dep242-5-2-5":"Huye también de las pasiones juveniles y sigue la justicia, la fe, el amor y la paz, con los que de corazón limpio invocan al Señor.","dep242-5-2-6":"El hierro con hierro se afila, y el hombre con el rostro de su amigo. Como el rostro en el agua es reflejo del rostro, así el hombre se refleja en el corazón del hombre.","dep242-5-2-7":"El que anda entre sabios será sabio, pero el que se junta con necios saldrá mal parado.","dep242-5-2-8":"hasta que todos lleguemos a la unidad de la fe y del conocimiento del Hijo de Dios, al hombre perfecto, a la medida de la estatura de la plenitud de Cristo.","dep242-5-2-9":"Y perseveraban en la doctrina de los apóstoles, en la comunión unos con otros, en el partimiento del pan y en las oraciones. alabando a Dios y teniendo favor con todo el pueblo. Y el Señor añadía cada día a la iglesia los que habían de ser salvos.","dep242-5-3-1":"por vuestra comunión en el evangelio desde el primer día hasta ahora, Solamente os ruego que os comportéis como es digno del evangelio de Cristo, para que, sea que vaya a veros o que esté ausente, oiga de vosotros que estáis firmes en un mismo espíritu, combatiendo unánimes por la fe del evangelio","dep242-5-3-2":"Y considerémonos unos a otros para estimularnos al amor y a las buenas obras, no dejando de congregarnos, como algunos tienen por costumbre, sino exhortándonos; y tanto más, cuanto veis que aquel día se acerca.","dep242-5-3-3":"Doy testimonio de que con agrado han dado conforme a sus fuerzas, y aun más allá de sus fuerzas, pidiéndonos con muchos ruegos que les concediéramos el privilegio de participar en este servicio para los santos.","dep242-5-3-4":"Al contrario, gozaos por cuanto sois participantes de los padecimientos de Cristo, para que también en la revelación de su gloria os gocéis con gran alegría.","dep242-5-3-5":"Sobrellevad los unos las cargas de los otros, y cumplid así la ley de Cristo.","dep242-5-4-1":"Por tanto, si hay algún consuelo en Cristo, si algún estímulo de amor, si alguna comunión del Espíritu, si algún afecto entrañable, si alguna misericordia, completad mi gozo, sintiendo lo mismo, teniendo el mismo amor, unánimes, sintiendo una misma cosa.","dep242-5-4-2":"Nada hagáis por rivalidad o por vanidad; antes bien, con humildad, estimando cada uno a los demás como superiores a él mismo. No busquéis vuestro propio provecho, sino el de los demás.","dep242-5-4-3":"No hemos sido mezquinos en nuestro amor por vosotros, pero vosotros sí lo habéis sido en vuestro propio corazón. No hemos sido mezquinos en nuestro amor por vosotros, pero vosotros sí lo habéis sido en vuestro propio corazón.","dep242-5-4-4":"Someteos unos a otros en el temor de Dios.","dep242-5-4-5":"Pero ellos callaron, porque por el camino habían discutido entre sí sobre quién había de ser el mayor. Entonces él se sentó, llamó a los doce y les dijo: —Si alguno quiere ser el primero, será el último de todos y el servidor de todos.","dep242-5-4-6":"Mirad bien, para que ninguno deje de alcanzar la gracia de Dios, y para que no brote ninguna raíz de amargura que os perturbe y contamine a muchos.","dep242-5-4-7":"Y no participéis en las obras infructuosas de las tinieblas, sino más bien reprendedlas,","dep242-5-4-8":"Ninguno que milita se enreda en los negocios de la vida, a fin de agradar a aquel que lo tomó por soldado.","dep242-5-5-9":"\"Por tanto, si traes tu ofrenda al altar y allí te acuerdas de que tu hermano tiene algo contra ti, deja allí tu ofrenda delante del altar y ve, reconcíliate primero con tu hermano, y entonces vuelve y presenta tu ofrenda.","dep242-5-5-1":"\"Por tanto, si tu hermano peca contra ti, ve y repréndelo estando tú y él solos; si te oye, has ganado a tu hermano.","dep242-5-5-2":"Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados y limpiarnos de toda maldad.","dep242-5-5-3":"El que oculta sus pecados no prosperará, pero el que los confiesa y se aparta de ellos alcanzará misericordia.","dep242-6-1-1":"pero recibiréis poder cuando haya venido sobre vosotros el Espíritu Santo, y me seréis testigos en Jerusalén, en toda Judea, en Samaria y hasta lo último de la tierra.","dep242-6-1-2":"Y todo esto proviene de Dios, quien nos reconcilió consigo mismo por Cristo, y nos dio el ministerio de la reconciliación: Dios estaba en Cristo reconciliando consigo al mundo, no tomándoles en cuenta a los hombres sus pecados, y nos encargó a nosotros la palabra de la reconciliación.","dep242-6-2-1":"Te suplico encarecidamente delante de Dios y del Señor Jesucristo, que juzgará a los vivos y a los muertos en su manifestación y en su Reino, que prediques la palabra y que instes a tiempo y fuera de tiempo. Redarguye, reprende, exhorta con toda paciencia y doctrina,","dep242-6-2-2":"porque el Hijo del hombre vino a buscar y a salvar lo que se había perdido.","dep242-6-2-3":"Al contrario, si hablamos es porque Dios nos aprobó y nos confió el evangelio. No procuramos agradar a los hombres, sino a Dios, que prueba nuestros corazones,","dep242-6-2-4":"Si anuncio el evangelio, no tengo por qué gloriarme, porque me es impuesta necesidad; y ¡ay de mí si no anunciara el evangelio!","dep242-6-2-5":"¿Cómo, pues, invocarán a aquel en el cual no han creído? ¿Y cómo creerán en aquel de quien no han oído? ¿Y cómo oirán sin haber quien les predique?","dep242-6-2-6":"el cual quiere que todos los hombres sean salvos y vengan al conocimiento de la verdad,","dep242-6-2-7":"Entonces Jehová le dijo: —Tú tienes lástima de una calabacera en la que no trabajaste, ni a la cual has hecho crecer, que en espacio de una noche nació y en espacio de otra noche pereció, ¿y no tendré yo piedad de Nínive, aquella gran ciudad donde hay más de ciento veinte mil personas que no saben discernir entre su mano derecha y su mano izquierda, y muchos animales?","dep242-6-2-8":"Os digo que así habrá más gozo en el cielo por un pecador que se arrepiente, que por noventa y nueve justos que no necesitan de arrepentimiento.","dep242-6-2-9":"lo que hemos visto y oído, eso os anunciamos, para que también vosotros tengáis comunión con nosotros; y nuestra comunión verdaderamente es con el Padre y con su Hijo Jesucristo.","dep242-6-2-10":"Los entendidos resplandecerán como el resplandor del firmamento; y los que enseñan la justicia a la multitud, como las estrellas, a perpetua eternidad.","dep242-6-3-1":"Y les dijo: —Venid en pos de mí, y os haré pescadores de hombres.","dep242-6-3-2":"para que seáis irreprochables y sencillos, hijos de Dios sin mancha en medio de una generación maligna y perversa, en medio de la cual resplandecéis como lumbreras en el mundo, asidos de la palabra de vida, para que en el día de Cristo yo pueda gloriarme de que no he corrido en vano, ni en vano he trabajado.","dep242-6-3-3":"y por mí, a fin de que al abrir mi boca me sea dada palabra para dar a conocer con denuedo el misterio del evangelio,","dep242-6-3-4":"Al contrario, santificad a Dios el Señor en vuestros corazones, y estad siempre preparados para presentar defensa con mansedumbre y reverencia ante todo el que os demande razón de la esperanza que hay en vosotros.","dep242-6-3-5":"Muchos de los samaritanos de aquella ciudad creyeron en él por la palabra de la mujer, que daba testimonio diciendo: \"Me dijo todo lo que he hecho\".","dep242-6-3-6":"La palabra de Dios es viva, eficaz y más cortante que toda espada de dos filos: penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón.","dep242-6-3-7":"así será mi palabra que sale de mi boca: no volverá a mí vacía, sino que hará lo que yo quiero y será prosperada en aquello para lo cual la envié.","dep242-6-3-8":"pero nosotros predicamos a Cristo crucificado, para los judíos ciertamente tropezadero, y para los gentiles locura. En cambio para los llamados, tanto judíos como griegos, Cristo es poder y sabiduría de Dios,","dep242-6-3-9":"pues nuestro evangelio no llegó a vosotros en palabras solamente, sino también en poder, en el Espíritu Santo y en plena certidumbre. Bien sabéis cómo nos portamos entre vosotros por amor de vosotros.","dep242-6-3-10":"Si confiesas con tu boca que Jesús es el Señor y crees en tu corazón que Dios lo levantó de entre los muertos, serás salvo, porque con el corazón se cree para justicia, pero con la boca se confiesa para salvación.","dep242-6-3-11":"porque dice: \"En tiempo aceptable te he oído, y en día de salvación te he socorrido\". Ahora es el tiempo aceptable; ahora es el día de salvación.","dep242-6-3-12":"Examinaos a vosotros mismos, para ver si estáis en la fe; probaos a vosotros mismos. ¿O no os conocéis a vosotros mismos? ¿No sabéis que Jesucristo está en vosotros? ¡A menos que estéis reprobados!","dep242-6-3-13":"Pablo, como acostumbraba, fue a ellos, y por tres sábados discutió con ellos, declarando y exponiendo por medio de las Escrituras que era necesario que el Cristo padeciera y resucitara de los muertos. Y decía: \"Jesús, a quien yo os anuncio, es el Cristo\".","dep242-6-4-1":"Pero de ninguna cosa hago caso ni estimo preciosa mi vida para mí mismo, con tal que acabe mi carrera con gozo, y el ministerio que recibí del Señor Jesús, para dar testimonio del evangelio de la gracia de Dios.","dep242-6-4-2":"El Espíritu dijo a Felipe: \"Acércate y júntate a ese carro\". Acudiendo Felipe, lo oyó que leía al profeta Isaías, y dijo: —Pero ¿entiendes lo que lees?","dep242-6-4-3":"porque no podemos dejar de decir lo que hemos visto y oído.","dep242-6-5-1":"Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó.","dep242-6-5-2":"He aquí que no se ha acortado la mano de Jehová para salvar, ni se ha endurecido su oído para oir; pero vuestras iniquidades han hecho división entre vosotros y vuestro Dios y vuestros pecados han hecho que oculte de vosotros su rostro para no oíros.","dep242-6-5-3":"Por tanto, como el pecado entró en el mundo por un hombre y por el pecado la muerte, así la muerte pasó a todos los hombres, por cuanto todos pecaron.","dep242-6-5-4":"por cuanto todos pecaron y están destituidos de la gloria de Dios,","dep242-6-5-5":"Y de la manera que está establecido para los hombres que mueran una sola vez, y después de esto el juicio,","dep242-6-5-6":"en llama de fuego, para dar retribución a los que no conocieron a Dios ni obedecen al evangelio de nuestro Señor Jesucristo. Estos sufrirán pena de eterna perdición, excluidos de la presencia del Señor y de la gloria de su poder,","dep242-6-5-7":"porque la paga del pecado es muerte, pero la dádiva de Dios es vida eterna en Cristo Jesús, Señor nuestro.","dep242-6-5-8":"Pero los cobardes e incrédulos, los abominables y homicidas, los fornicarios y hechiceros, los idólatras y todos los mentirosos tendrán su parte en el lago que arde con fuego y azufre, que es la muerte segunda\".","dep242-6-5-9":"porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios. No por obras, para que nadie se gloríe,","dep242-6-5-10":"No desecho la gracia de Dios, pues si por la Ley viniera la justicia, entonces en vano murió Cristo.","dep242-6-5-11":"Y en ningún otro hay salvación, porque no hay otro nombre bajo el cielo, dado a los hombres, en que podamos ser salvos.","dep242-6-5-12":"pues ya sabéis que fuisteis rescatados de vuestra vana manera de vivir (la cual recibisteis de vuestros padres) no con cosas corruptibles, como oro o plata,","dep242-6-5-13":"Los judíos piden señales y los griegos buscan sabiduría, pero nosotros predicamos a Cristo crucificado, para los judíos ciertamente tropezadero, y para los gentiles locura.","dep242-6-5-14":"Puesto que el mundo, mediante su sabiduría, no reconoció a Dios a través de las obras que manifiestan su sabiduría, agradó a Dios salvar a los creyentes por la locura de la predicación.","dep242-6-5-15":"Mirad que nadie os engañe por medio de filosofías y huecas sutilezas basadas en las tradiciones de los hombres, conforme a los elementos del mundo, y no según Cristo.","dep242-6-5-16":"Estos no nacieron de sangre, ni por voluntad de carne, ni por voluntad de varón, sino de Dios.","dep242-6-5-17":"Lo que nace de la carne, carne es; y lo que nace del Espíritu, espíritu es. No te maravilles de que te dije: \"Os es necesario nacer de nuevo\".","dep242-6-5-18":"El espíritu es el que da vida; la carne para nada aprovecha. Las palabras que yo os he hablado son espíritu y son vida.","dep242-6-5-19":"Asimismo, Cristo padeció una sola vez por los pecados, el justo por los injustos, para llevarnos a Dios, siendo a la verdad muerto en la carne, pero vivificado en espíritu;","dep242-6-5-20":"\"De tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree no se pierda, sino que tenga vida eterna.","dep242-6-5-21":"Pero Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros.","dep242-6-5-22":"Primeramente os he enseñado lo que asimismo recibí: Que Cristo murió por nuestros pecados, conforme a las Escrituras; que fue sepultado y que resucitó al tercer día, conforme a las Escrituras;","dep242-6-5-23":"Y a vosotros, estando muertos en pecados y en la incircuncisión de vuestra carne, os dio vida juntamente con él, perdonándoos todos los pecados.","dep242-6-5-24":"\"De cierto, de cierto os digo: El que oye mi palabra y cree al que me envió tiene vida eterna, y no vendrá a condenación, sino que ha pasado de muerte a vida.","dep242-6-5-25":"Mas a todos los que lo recibieron, a quienes creen en su nombre, les dio potestad de ser hechos hijos de Dios.","dep242-6-5-26":"Yo estoy a la puerta y llamo; si alguno oye mi voz y abre la puerta, entraré a él y cenaré con él y él conmigo.","dep242-6-5-27":"Si confiesas con tu boca que Jesús es el Señor y crees en tu corazón que Dios lo levantó de entre los muertos, serás salvo, porque con el corazón se cree para justicia, pero con la boca se confiesa para salvación.","dep242-7-1-1":"Este estaba en el principio con Dios. Todas las cosas por medio de él fueron hechas, y sin él nada de lo que ha sido hecho fue hecho.","dep242-7-1-2":"porque en él fueron creadas todas las cosas, las que hay en los cielos y las que hay en la tierra, visibles e invisibles; sean tronos, sean dominios, sean principados, sean potestades; todo fue creado por medio de él y para él. Y él es antes que todas las cosas, y todas las cosas en él subsisten.","dep242-7-1-3":"Él es también la cabeza del cuerpo que es la iglesia, y es el principio, el primogénito de entre los muertos, para que en todo tengala preeminencia,","dep242-7-1-4":"sobre todo principado y autoridad, poder y señorío, y sobre todo nombre que se nombra, no solo en este siglo, sino también en el venidero.","dep242-7-1-5":"para que en el nombre de Jesús se doble toda rodilla de los que están en los cielos, en la tierra y debajo de la tierra; y toda lengua confiese que Jesucristo es el Señor, para gloria de Dios Padre.","dep242-7-1-6":"Cristo para esto murió, resucitó y volvió a vivir: para ser Señor así de los muertos como de los que viven.","dep242-7-1-7":"¿O ignoráis que vuestro cuerpo es templo del Espíritu Santo, el cual está en vosotros, el cual habéis recibido de Dios, y que no sois vuestros?, pues habéis sido comprados por precio; glorificad, pues, a Dios en vuestro cuerpo y en vuestro espíritu, los cuales son de Dios.","dep242-7-1-8":"y él por todos murió, para que los que viven ya no vivan para sí, sino para aquel que murió y resucitó por ellos.","dep242-7-2-1":"Buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.","dep242-7-2-2":"Respondió Jesús y dijo: —De cierto os digo que no hay nadie que haya dejado casa, o hermanos, o hermanas, o padre, o madre, o mujer, o hijos, o tierras, por causa de mí y del evangelio, que no reciba cien veces más ahora en este tiempo: casas, hermanos, hermanas, madres, hijos y tierras, aunque con persecuciones, y en el siglo venidero la vida eterna.","dep242-7-2-3":"y le dijo: —Por mí mismo he jurado, dice Jehová, que por cuanto has hecho esto y no me has rehusado a tu hijo, tu único hijo, de cierto te bendeciré y multiplicaré tu descendencia como las estrellas del cielo y como la arena que está a la orilla del mar; tu descendencia se adueñará de las puertas de sus enemigos.","dep242-7-2-4":"\"Y tú, Salomón, hijo mío, reconoce al Dios de tu padre, y sírvele con corazón perfecto y con ánimo generoso; porque Jehová escudriña los corazones de todos, y entiende todo intento de los pensamientos. Si tú le buscas, lo hallarás; pero si lo dejas, él te desechará para siempre.","dep242-7-2-5":"Porque los ojos de Jehová contemplan toda la tierra, para mostrar su poder a favor de los que tienen un corazón perfecto para con él. Locamente has procedido en esto; por eso de aquí en adelante habrá más guerra contra ti\".","dep242-7-2-6":"\"Por cuanto en mí ha puesto su amor, yo también lo libraré; lo pondré en alto, por cuanto ha conocido mi nombre.","dep242-7-2-7":"Por eso Jehová, el Dios de Israel, dice: \"Yo había prometido que tu casa y la casa de tu padre andarían siempre delante de mí\"; pero ahora ha dicho Jehová: \"Nunca haga yo tal cosa, porque yo honro a los que me honran, y los que me desprecian serán tenidos en poco.","dep242-7-3-1":"Y decía a todos: —Si alguno quiere venir en pos de mí, niéguese a sí mismo, tome su cruz cada día y sígame.","dep242-7-3-2":"Cuando los caminos del hombre son agradables a Jehová, aun a sus enemigos los pone en paz con él.","dep242-7-3-3":"\"Confía en Jehová con todo tu corazón y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos y él hará derechas tus veredas.","dep242-7-3-4":"En cuanto a la pasada manera de vivir, despojaos del viejo hombre, que está corrompido por los deseos engañosos, y vestíos del nuevo hombre, creado según Dios en la justicia y santidad de la verdad.","dep242-7-3-5":"Huye también de las pasiones juveniles y sigue la justicia, la fe, el amor y la paz, con los que de corazón limpio invocan al Señor.","dep242-7-3-6":"porque nada hemos traído a este mundo y, sin duda, nada podremos sacar. pero los que quieren enriquecerse caen en tentación y lazo, y en muchas codicias necias y dañosas que hunden a los hombres en destrucción y perdición,","dep242-7-3-7":"Mirad, pues, con diligencia cómo andéis, no como necios sino como sabios, aprovechando bien el tiempo, porque los días son malos.","dep242-7-3-8":"y en seguida los llamó. Entonces, dejando a su padre, Zebedeo, en la barca con los jornaleros, lo siguieron.","dep242-7-4-1":"conforme a mi anhelo y esperanza de que en nada seré avergonzado; antes bien con toda confianza, como siempre, ahora también será magnificado Cristo en mi cuerpo, tanto si vivo como si muero,","dep242-7-4-2":"pues todos buscan sus propios intereses y no los de Cristo Jesús. Pero ya conocéis los méritos de él, que como hijo a padre ha servido conmigo en el evangelio.","dep242-7-4-3":"Otros experimentaron oprobios, azotes y, a más de esto, prisiones y cárceles. Estos hombres, de los cuales el mundo no era digno, anduvieron errantes por los desiertos, por los montes, por las cuevas y por las cavernas de la tierra.","dep242-8-1":"Haré de ti una nación grande, te bendeciré, engrandeceré tu nombre y serás bendición. Bendeciré a los que te bendigan, y a los que te maldigan maldeciré; y serán benditas en ti todas las familias de la tierra\".","dep242-8-2":"él dice: \"Poco es para mí que solo seas mi siervo para levantar las tribus de Jacob y restaurar el resto de Israel; también te he dado por luz de las naciones, para que seas mi salvación hasta lo último de la tierra\".","dep242-8-3":"Por tanto, id y haced discípulos a todas las naciones, bautizándolos en el nombre del Padre, del Hijo y del Espíritu Santo, y enseñándoles que guarden todas las cosas que os he mandado. Y yo estoy con vosotros todos los días, hasta el fin del mundo\". Amén.","dep242-8-4":"pero recibiréis poder cuando haya venido sobre vosotros el Espíritu Santo, y me seréis testigos en Jerusalén, en toda Judea, en Samaria y hasta lo último de la tierra.","dep242-8-5":"Después oí la voz del Señor, que decía: —¿A quién enviaré y quién irá por nosotros? Entonces respondí yo: —Heme aquí, envíame a mí.","dep242-8-6":"para ser ministro de Jesucristo a los gentiles, ministrando el evangelio de Dios, para que los gentiles le sean como ofrenda agradable, santificada por el Espíritu Santo.","dep242-8-7":"Pídeme, y te daré por herencia las naciones y como posesión tuya los confines de la tierra.","dep242-8-8":"¡Exaltado seas, Dios, sobre los cielos! ¡Sobre toda la tierra sea tu gloria!","dep242-8-9":"en la esperanza de la vida eterna. Dios, que no miente, prometió esta vida desde antes del principio de los siglos, y a su debido tiempo manifestó su palabra por medio de la predicación que me fue encomendada por mandato de Dios, nuestro Salvador.","dep242-8-10":"Pero el Señor estuvo a mi lado y me dio fuerzas, para que por mí fuera cumplida la predicación, y que todos los gentiles oyeran. Así fui librado de la boca del león.","dep242-8-11":"Nosotros anunciamos a Cristo, amonestando a todo hombre y enseñando a todo hombre en toda sabiduría, a fin de presentar perfecto en Cristo Jesús a todo hombre. Para esto también trabajo, luchando según la fuerza de él, la cual actúa poderosamente en mí.","dep242-8-12":"Y esto pido en oración: que vuestro amor abunde aún más y más en conocimiento y en toda comprensión, llenos de frutos de justicia que son por medio de Jesucristo, para gloria y alabanza de Dios.","dep242-8-13":"Lo que has oído de mí ante muchos testigos, esto encarga a hombres fieles que sean idóneos para enseñar también a otros.","dep242-8-14":"El pequeño llegará a ser un millar; del menor saldrá un pueblo poderoso. Yo Jehová, a su tiempo haré que esto se cumpla pronto.","dep242-8-15":"Por tanto, nosotros también, teniendo en derredor nuestro tan grande nube de testigos, despojémonos de todo peso y del pecado que nos asedia, y corramos con paciencia la carrera que tenemos por delante,","dep242-8-16":"Porque los ojos de Jehová contemplan toda la tierra, para mostrar su poder a favor de los que tienen un corazón perfecto para con él. Locamente has procedido en esto; por eso de aquí en adelante habrá más guerra contra ti\".","dep242-8-17":"Porque la tierra se llenará del conocimiento de la gloria de Jehová, como las aguas cubren el mar.","dep242-8-18":"Porque desde donde el sol nace hasta donde se pone, es grande mi nombre entre las naciones, y en todo lugar se ofrece a mi nombre incienso y ofrenda limpia. Grande es mi nombre entre las naciones, dice Jehová de los ejércitos;"},"vie":{"assurance-1":"Chừng ấy tức là Đức Chúa Trời đã ban sự sống đời đời cho chúng ta, và sự sống ấy ở trong Con Ngài. Ai có Đức Chúa Con thì có sự sống; ai không có Con Đức Chúa Trời thì không có sự sống.","assurance-2":"Đến bây giờ, các ngươi chưa từng nhơn danh ta mà cầu xin điều chi hết. Hãy cầu xin đi, các ngươi sẽ được, hầu cho sự vui mừng các ngươi được trọn vẹn.","assurance-3":"Những sự cám dỗ đến cho anh em, chẳng có sự nào quá sức loài người. Đức Chúa Trời là thành tín, Ngài chẳng hề cho anh em bị cám dỗ quá sức mình đâu; nhưng trong sự cám dỗ, Ngài cũng mở đàng cho ra khỏi, để anh em có thể chịu được.","assurance-4":"Còn nếu chúng ta xưng tội mình, thì Ngài là thành tín công bình để tha tội cho chúng ta, và làm cho chúng ta sạch mọi điều gian ác.","assurance-5":"Hãy hết lòng tin cậy Đức Giê-hô-va, Chớ nương cậy nơi sự thông sáng của con; Phàm trong các việc làm của con, khá nhận biết Ngài, Thì Ngài sẽ chỉ dẫn các nẻo của con.","living-1":"Ta là gốc nho, các ngươi là nhánh. Ai cứ ở trong ta và ta trong họ thì sinh ra lắm trái; vì ngoài ta, các ngươi chẳng làm chi được.","living-2":"Bây giờ tôi giao phó anh em cho Đức Chúa Trời và cho đạo của ơn Ngài, là giao phó cho Đấng có thể gây dựng và ban gia tài cho anh em chung với hết thảy những người được nên thánh.","living-3":"Vì hết thảy kẻ nào được Thánh Linh của Đức Chúa Trời dắt dẫn, đều là con của Đức Chúa Trời.","living-4":"vì chúng ta bước đi bởi đức tin, chớ chẳng phải bởi mắt thấy.","living-5":"Hỡi kẻ rất yêu dấu, nếu Đức Chúa Trời đã yêu chúng ta dường ấy, thì chúng ta cũng phải yêu nhau.","living-6":"Nhưng, nếu chúng ta đi trong sự sáng cũng như chính mình Ngài ở trong sự sáng, thì chúng ta giao thông cùng nhau; và huyết của Đức Chúa Jêsus, Con Ngài, làm sạch mọi tội chúng ta.","living-7":"nhưng hãy tôn Đấng Christ, là Chúa, làm thánh trong lòng mình. Hãy thường thường sẵn sàng để trả lời mọi kẻ hỏi lẽ về sự trông cậy trong anh em, song phải hiền hòa và kính sợ,","living-8":"Mỗi người nên tùy theo lòng mình đã định mà quyên ra, không phải phàn nàn hay vì ép uổng; vì Đức Chúa Trời yêu kẻ thí của cách vui lòng.","tms60-A-1":"Vậy, nếu ai ở trong Đấng Christ, thì nấy là người dựng nên mới; những sự cũ đã qua đi, nầy mọi sự đều trở nên mới.","tms60-A-2":"Tôi đã bị đóng đinh vào thập tự giá với Đấng Christ, mà tôi sống, không phải là tôi sống nữa, nhưng Đấng Christ sống trong tôi; nay tôi còn sống trong xác thịt, ấy là tôi sống trong đức tin của Con Đức Chúa Trời, là Đấng đã yêu tôi, và đã phó chính mình Ngài vì tôi.","tms60-A-3":"Vậy, hỡi anh em, tôi lấy sự thương xót của Đức Chúa Trời khuyên anh em dâng thân thể mình làm của lễ sống và thánh, đẹp lòng Đức Chúa Trời, ấy là sự thờ phượng phải lẽ của anh em.","tms60-A-4":"Ai có các điều răn của ta và vâng giữ lấy, ấy là kẻ yêu mến ta; người nào yêu mến ta sẽ được Cha ta yêu lại, ta cũng sẽ yêu người, và tỏ cho người biết ta.","tms60-A-5":"Cả Kinh Thánh đều là bởi Đức Chúa Trời soi dẫn, có ích cho sự dạy dỗ, bẻ trách, sửa trị, dạy người trong sự công bình,","tms60-A-6":"Quyển sách luật pháp này chớ xa miệng ngươi, hãy suy gẫm ngày và đêm, hầu cho cẩn thận làm theo mọi điều đã chép ở trong; vì như vậy ngươi mới được may mắn trong con đường mình, và mới được phước.","tms60-A-7":"Ví bằng các ngươi cứ ở trong ta, và những lời ta ở trong các ngươi, hãy cầu xin mọi điều mình muốn, thì sẽ được điều đó.","tms60-A-8":"Chớ lo phiền chi hết, nhưng trong mọi sự hãy dùng lời cầu nguyện, nài xin, và sự tạ ơn và trình các sự cầu xin của mình cho Đức Chúa Trời. Sự bình an của Đức Chúa Trời vượt quá mọi sự hiểu biết, sẽ gìn giữ lòng và ý tưởng anh em trong Đức Chúa Jêsus Christ.","tms60-A-9":"Vì nơi nào có hai ba người nhơn danh ta nhóm nhau lại, thì ta ở giữa họ.","tms60-A-10":"Ai nấy hãy coi sóc nhau để khuyên giục về lòng yêu thương và việc tốt lành; chớ bỏ qua sự nhóm lại như mấy kẻ quen làm, nhưng phải khuyên bảo nhau, và hễ anh em thấy ngày ấy hầu gần chừng nào, thì càng phải làm như vậy chừng nấy.","tms60-A-11":"Ngài phán cùng hai người rằng: Các ngươi hãy theo ta, ta sẽ cho các ngươi nên tay đánh lưới người.","tms60-A-12":"Thật vậy, tôi không hổ thẹn về Tin Lành đâu, vì là quyền phép của Đức Chúa Trời để cứu mọi kẻ tin, trước là người Giu-đa, sau là người Gờ-réc;","tms60-B-1":"vì mọi người đều đã phạm tội, thiếu mất sự vinh hiển của Đức Chúa Trời,","tms60-B-2":"Chúng ta thảy đều như chiên đi lạc, ai theo đường nấy; Đức Giê-hô-va đã làm cho tội lỗi của hết thảy chúng ta đều chất trên người.","tms60-B-3":"Vì tiền công của tội lỗi là sự chết; nhưng sự ban cho của Đức Chúa Trời là sự sống đời đời trong Đức Chúa Jêsus Christ, Chúa chúng ta.","tms60-B-4":"Theo như đã định cho loài người phải chết một lần, rồi chịu phán xét,","tms60-B-5":"Nhưng Đức Chúa Trời tỏ lòng yêu thương Ngài đối với chúng ta, khi chúng ta còn là người có tội, thì Đấng Christ vì chúng ta chịu chết.","tms60-B-6":"Vả, Đấng Christ cũng vì tội lỗi chịu chết một lần, là Đấng công bình thay cho kẻ không công bình, để dẫn chúng ta đến cùng Đức Chúa Trời; về phần xác thịt thì Ngài đã chịu chết, nhưng về phần linh hồn thì được sống.","tms60-B-7":"Vả, ấy là nhờ ân điển, bởi đức tin, mà anh em được cứu, điều đó không phải đến từ anh em, bèn là sự ban cho của Đức Chúa Trời. Ay chẳng phải bởi việc làm đâu, hầu cho không ai khoe mình;","tms60-B-8":"không phải cứu vì việc công bình chúng ta đã làm, nhưng cứ theo lòng thương xót Ngài, bởi sự rửa về sự lại sanh và sự đổi mới của Đức Thánh Linh","tms60-B-9":"Nhưng hễ ai đã nhận Ngài, thì Ngài ban cho quyền phép trở nên con cái Đức Chúa Trời, là ban cho những kẻ tin danh Ngài,","tms60-B-10":"Nầy, ta đứng ngoài cửa mà gõ; nếu ai nghe tiếng ta mà mở cửa cho, thì ta sẽ vào cùng người ấy, ăn bữa tối với người, và người với ta.","tms60-B-11":"Ta đã viết những điều nầy cho các con, hầu cho các con biết mình có sự sống đời đời, là kẻ nào tin đến danh Con Đức Chúa Trời.","tms60-B-12":"Quả thật, quả thật, ta nói cùng các ngươi, ai nghe lời ta mà tin Đấng đã sai ta, thì được sự sống đời đời, và không đến sự phán xét, song vượt khỏi sự chết mà đến sự sống.","tms60-C-1":"Anh em há chẳng biết mình là đền thờ của Đức Chúa Trời, và Thánh Linh Đức Chúa Trời ở trong anh em sao?","tms60-C-2":"Về phần chúng ta, chúng ta chẳng nhận lấy thần thế gian, nhưng đã nhận lấy Thánh Linh từ Đức Chúa Trời đến, hầu cho được hiểu biết những ơn mà chúng ta nhận lãnh bởi Đức Chúa Trời;","tms60-C-3":"Đừng sợ, vì ta ở với ngươi; chớ kinh khiếp, vì ta là Đức Chúa Trời ngươi! Ta sẽ bổ sức cho ngươi; phải, ta sẽ giúp đỡ ngươi, lấy tay hữu công bình ta mà nâng đỡ ngươi.","tms60-C-4":"Tôi làm được mọi sự nhờ Đấng ban thêm sức cho tôi.","tms60-C-5":"Ay là nhờ sự nhơn từ Đức Giê-hô-va mà chúng ta chưa tuyệt. Vì sự thương xót của Ngài chẳng dứt. Mỗi buổi sáng thì lại mới luôn, sự thành tín Ngài là lớn lắm.","tms60-C-6":"Đức Chúa Trời chẳng phải là người để nói dối, Cũng chẳng phải là con loài người đặng hối cải. Điều Ngài đã nói, Ngài há sẽ chẳng làm ư? Điều Ngài đã phán, Ngài há sẽ chẳng làm ứng nghiệm sao?","tms60-C-7":"Người nào để trí mình nương dựa nơi Ngài, thì Ngài sẽ gìn giữ người trong sự bình yên trọn vẹn, vì người nhờ cậy Ngài.","tms60-C-8":"lại hãy trao mọi điều lo lắng mình cho Ngài, vì Ngài hay săn sóc anh em.","tms60-C-9":"Ngài đã không tiếc chính Con mình, nhưng vì chúng ta hết thảy mà phó Con ấy cho, thì Ngài há chẳng cũng sẽ ban mọi sự luôn với Con ấy cho chúng ta sao?","tms60-C-10":"Đức Chúa Trời tôi sẽ làm cho đầy đủ mọi sự cần dùng của anh em y theo sự giàu có của Ngài ở nơi vinh hiển trong Đức Chúa Jêsus Christ.","tms60-C-11":"Vả, vì chính mình Ngài chịu khổ trong khi bị cám dỗ, nên có thể cứu những kẻ bị cám dỗ vậy.","tms60-C-12":"Ngươi trẻ tuổi phải làm sao cho đường lối mình được trong sạch? Phải cẩn thận theo lời Chúa. Tôi đã giấu lời Chúa trong lòng tôi, Để tôi không phạm tội cùng Chúa.","tms60-D-1":"Nhưng trước hết, hãy tìm kiếm nước Đức Chúa Trời và sự công bình của Ngài, thì Ngài sẽ cho thêm các ngươi mọi điều ấy nữa.","tms60-D-2":"Đoạn, Ngài phải cùng mọi người rằng: Nếu ai muốn theo ta, phải tự bỏ mình đi, mỗi ngày vác thập tự giá mình mà theo ta.","tms60-D-3":"Chớ yêu thế gian, cũng đừng yêu các vật ở thế gian nữa; nếu ai yêu thế gian, thì sự kính mến Đức Chúa Cha chẳng ở trong người ấy. Vì mọi sự trong thế gian, như sự mê tham của xác thịt, sự mê tham của mắt, và sự kiêu ngạo của đời, đều chẳng từ Cha mà đến, nhưng từ thế gian mà ra.","tms60-D-4":"Đừng làm theo đời nầy, nhưng hãy biến hóa bởi sự đổi mới của tâm thần mình, để thử cho biết ý muốn tốt lành, đẹp lòng và trọn vẹn của Đức Chúa Trời là thể nào.","tms60-D-5":"Vậy, hỡi anh em yêu dấu của tôi, hãy vững vàng, chớ rúng động, hãy làm công việc Chúa cách dư dật luôn, vì biết rằng công khó của anh em trong Chúa chẳng phải là vô ích đâu.","tms60-D-6":"Vậy, anh em hãy nghĩ đến Đấng đã chịu sự đối nghịch của kẻ tội lỗi dường ấy, hầu cho khỏi bị mỏi mệt sờn lòng.","tms60-D-7":"Vì Con người đã đến không phải để người ta hầu việc mình, song để hầu việc người ta, và phó sự sống mình làm giá chuộc cho nhiều người.","tms60-D-8":"Vả, chúng tôi chẳng rao giảng chính mình chúng tôi, nhưng rao giảng Đức Chúa Jêsus Christ, tức là Chúa; và vì tình yêu mến Đức Chúa Jêsus mà chúng tôi xưng mình là tôi tớ của anh em.","tms60-D-9":"Hãy lấy tài vật và huê lợi đầu mùa của con, Mà tôn vinh Đức Giê-hô-va; Vậy, các vựa lẫm con sẽ đầy dư dật, Và những thùng của con sẽ tràn rượu mới.","tms60-D-10":"Hãy biết rõ điều đó, hễ ai gieo ít thì gặt ít, ai gieo nhiều thì gặt nhiều. Mỗi người nên tùy theo lòng mình đã định mà quyên ra, không phải phàn nàn hay vì ép uổng; vì Đức Chúa Trời yêu kẻ thí của cách vui lòng.","tms60-D-11":"Nhưng khi Đức Thánh Linh giáng trên các ngươi, thì các ngươi sẽ nhận lấy quyền phép, và làm chứng về ta tại thành Giê-ru-sa-lem, cả xứ Giu-đê, xứ Sa-ma-ri, cho đến cùng trái đất.","tms60-D-12":"Vậy, hãy đi dạy dỗ muôn dân, hãy nhơn danh Đức Cha, Đức Con, và Đức Thánh Linh mà làm phép báp tem cho họ, và dạy họ giữ hết cả mọi điều mà ta đã truyền cho các ngươi. Và nầy, ta thường ở cùng các ngươi luôn cho đến tận thế.","tms60-E-1":"Ta ban cho các ngươi một điều răn mới, nghĩa là các ngươi phải yêu nhau; như ta đã yêu các ngươi thể nào, thì các ngươi cũng hãy yêu nhau thể ấy. Nếu các ngươi yêu nhau, thì ấy là tại điều đó mà thiên hạ sẽ nhận biết các ngươi là môn đồ ta.","tms60-E-2":"Hỡi các con cái bé mọn, chớ yêu mến bằng lời nói và lưỡi, nhưng bằng việc làm và lẽ thật.","tms60-E-3":"Chớ làm sự chi vì lòng tranh cạnh hoặc vì hư vinh, nhưng hãy khiêm nhường, coi người khác như tôn trọng hơn mình. Mỗi người trong anh em chớ chăm về lợi riêng mình, nhưng phải chăm về lợi kẻ khác nữa.","tms60-E-4":"Cũng khuyên bọn trẻ tuổi, hãy phục theo các trưởng lão. Hết thảy đối đãi với nhau phải trang sức bằng khiêm nhường; vì Đức Chúa Trời chống cự kẻ kiêu ngạo, mà ban ơn cho kẻ khiêm nhường. Vậy, hãy hạ mình xuống dưới tay quyền phép của Đức Chúa Trời, hầu cho đến ký thuận hiệp Ngài nhắc anh em lên;","tms60-E-5":"Phàm những sự gian dâm, hoặc sự ô uế, hoặc sự tham lam, cũng chớ nên nói đến giữa anh em, theo như cách xứng đáng cho các thánh đồ.","tms60-E-6":"Hỡi kẻ rất yêu dấu, anh em như người ở trọ, kẻ đi đường, tôi khuyên phải kiêng những điều xác thịt ưa thích, là điều chống trả với linh hồn.","tms60-E-7":"Các ngươi chớ ăn trộm ăn cắp, chớ nói dối, và chớ lừa đảo nhau.","tms60-E-8":"Cũng vì cớ ấy, nên tôi vẫn gắng sức cho có lương tâm không trách móc trước mặt Đức Chúa Trời và trước mặt loài người.","tms60-E-9":"Vả, không có đức tin, thì chẳng hề có thế nào ở cho đẹp ý Ngài; vì kẻ đến gần Đức Chúa Trời phải tin rằng có Đức Chúa Trời, và Ngài là Đấng hay thưởng cho kẻ tìm kiếm Ngài.","tms60-E-10":"Người chẳng có lưỡng lự hoặc hoài nghi về lời hứa Đức Chúa Trời, nhưng càng mạnh mẽ trong đức tin, và ngợi khen Đức Chúa Trời, vì tin chắc rằng điều chi Đức Chúa Trời đã hứa, Ngài cũng có quyền làm trọn được.","tms60-E-11":"Chớ mệt nhọc về sự làm lành, vì nếu chúng ta không trễ nải, thì đến kỳ chúng ta sẽ gặt. Vậy, đương lúc có dịp tiện, hãy làm điều thiện cho mọi người, nhứt là cho anh em chúng ta trong đức tin.","tms60-E-12":"Sự sáng các ngươi hãy soi trước mặt người ta như vậy, đặng họ thấy những việc lành của các ngươi, và ngợi khen Cha các ngươi ở trên trời.","tms180-s1-1-1":"Ban đầu có Ngôi Lời, Ngôi Lời ở cùng Đức Chúa Trời, và Ngôi Lời là Đức Chúa Trời. Ngôi Lời đã trở nên xác thịt, ở giữa chúng ta, đầy ơn và lẽ thật; chúng ta đã ngắm xem sự vinh hiển của Ngài, thật như vinh hiển của Con một đến từ nơi Cha.","tms180-s1-1-2":"Nhưng nói về Con thì lại phán rằng: Hỡi Đức Chúa Trời, ngôi Chúa còn mãi đời nọ qua đời kia, Quyền bính của nước Chúa là quyền bính ngay thẳng.","tms180-s1-1-3":"Vì chúng ta không có thầy tế lễ thượng phẩm chẳng có thể cảm thương sự yếu đuối chúng ta, bèn có một thầy tế lễ bị thử thách trong mọi việc cũng như chúng ta, song chẳng phạm tội.","tms180-s1-1-4":"Đức Chúa Jêsus khôn ngoan càng thêm, thân hình càng lớn, càng được đẹp lòng Đức Chúa Trời và người ta.","tms180-s1-1-5":"Vả trước hết tôi đã dạy dỗ anh em điều mà chính tôi đã nhận lãnh, ấy là Đấng Christ chịu chết vì tội chúng ta theo lời Kinh Thánh; Ngài đã bị chôn, đến ngày thứ ba, Ngài sống lại, theo lời Kinh Thánh;","tms180-s1-1-6":"Nhưng bây giờ, Đấng Christ đã từ kẻ chết sống lại, Ngài là trái đầu mùa của những kẻ ngủ.","tms180-s1-1-7":"Chẳng hề ai thấy Đức Chúa Trời; chỉ Con một ở trong lòng Cha, là Đấng đã giải bày Cha cho chúng ta biết.","tms180-s1-1-8":"Con là sự chói sáng của sự vinh hiển Đức Chúa Trời và hình bóng của bổn thể Ngài, lấy lời có quyền phép Ngài nâng đỡ muôn vật; sau khi Con làm xong sự sạch tội, bèn ngồi bên hữu Đấng tôn nghiêm ở trong nơi rất cao,","tms180-s1-1-9":"Bởi Con người đã đến tìm và cứu kẻ bị mất.","tms180-s1-1-10":"vì biết rằng chẳng phải bởi vật hay hư nát như bạc hoặc vàng mà anh em đã được chuộc khỏi sự ăn ở không ra chi của tổ tiên truyền lại cho mình, bèn là bởi huyết báu Đấng Christ, dường như huyết của chiên con không lỗi không vít,","tms180-s1-1-11":"Vì sẽ có tiếng kêu lớn và tiếng của thiên sứ lớn cùng tiếng kèn của Đức Chúa Trời, thì chính mình Chúa ở trên trời giáng xuống; bấy giờ những kẻ chết trong Đấng Christ, sẽ sống lại trước hết. Kế đến chúng ta là kẻ sống, mà còn ở lại, sẽ cùng nhau đều được cất lên với những người ấy giữa đám mây, tại nơi
