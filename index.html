में दुःख उठाया, तो वह उनकी भी सहायता कर सकता है, जिनकी परीक्षा होती है।","tms60-C-12":"जवान अपनी चाल को किस उपाय से शुद्ध रखे? तेरे वचन का पालन करने से। मैंने तेरे वचन को अपने हृदय में रख छोड़ा है, कि तेरे विरुद्ध पाप न करूँ।","tms60-D-1":"इसलिए पहले तुम परमेश्‍वर के राज्य और धार्मिकता की खोज करो तो ये सब वस्तुएँ तुम्हें मिल जाएँगी।","tms60-D-2":"उसने सबसे कहा, “यदि कोई मेरे पीछे आना चाहे, तो अपने आप से इन्कार करे और प्रति-दिन अपना क्रूस उठाए हुए मेरे पीछे हो ले।","tms60-D-3":"तुम न तो संसार से और न संसार की वस्तुओं से प्रेम रखो यदि कोई संसार से प्रेम रखता है, तो उसमें पिता का प्रेम नहीं है। क्योंकि जो कुछ संसार में है, अर्थात् शरीर की अभिलाषा, और आँखों की अभिलाषा और जीविका का घमण्ड, वह पिता की ओर से नहीं, परन्तु संसार ही की ओर से है।","tms60-D-4":"और इस संसार के सदृश न बनो; परन्तु तुम्हारी बुद्धि के नये हो जाने से तुम्हारा चाल-चलन भी बदलता जाए, जिससे तुम परमेश्‍वर की भली, और भावती, और सिद्ध इच्छा अनुभव से मालूम करते रहो।","tms60-D-5":"इसलिए हे मेरे प्रिय भाइयों, दृढ़ और अटल रहो, और प्रभु के काम में सर्वदा बढ़ते जाओ, क्योंकि यह जानते हो, कि तुम्हारा परिश्रम प्रभु में व्यर्थ नहीं है।","tms60-D-6":"इसलिए उस पर ध्यान करो, जिस ने अपने विरोध में पापियों का इतना वाद-विवाद सह लिया कि तुम निराश होकर साहस न छोड़ दो।","tms60-D-7":"क्योंकि मनुष्य का पुत्र इसलिए नहीं आया, कि उसकी सेवा टहल की जाए, पर इसलिए आया, कि आप सेवा टहल करे, और बहुतों के छुटकारे के लिये अपना प्राण दे।”","tms60-D-8":"क्योंकि हम अपने को नहीं, परन्तु मसीह यीशु को प्रचार करते हैं, कि वह प्रभु है; और उसके विषय में यह कहते हैं, कि हम यीशु के कारण तुम्हारे सेवक हैं।","tms60-D-9":"अपनी सम्पत्ति के द्वारा और अपनी भूमि की सारी पहली उपज देकर यहोवा की प्रतिष्ठा करना; इस प्रकार तेरे खत्ते भरे और पूरे रहेंगे, और तेरे रसकुण्डों से नया दाखमधु उमण्डता रहेगा।","tms60-D-10":"परन्तु बात तो यह है, कि जो थोड़ा बोता है वह थोड़ा काटेगा भी; और जो बहुत बोता है, वह बहुत काटेगा। हर एक जन जैसा मन में ठाने वैसा ही दान करे; न कुढ़-कुढ़ के, और न दबाव से, क्योंकि परमेश्‍वर हर्ष से देनेवाले से प्रेम रखता है।","tms60-D-11":"परन्तु जब पवित्र आत्मा तुम पर आएगा तब तुम सामर्थ्य पाओगे; और यरूशलेम और सारे यहूदिया और सामरिया में, और पृथ्वी की छोर तक मेरे गवाह होंगे।”","tms60-D-12":"इसलिए तुम जाकर सब जातियों के लोगों को चेला बनाओ; और उन्हें पिता, और पुत्र, और पवित्र आत्मा के नाम से बपतिस्मा दो, और उन्हें सब बातें जो मैंने तुम्हें आज्ञा दी है, मानना सिखाओ और देखो, मैं जगत के अन्त तक सदैव तुम्हारे संग हूँ।”","tms60-E-1":"मैं तुम्हें एक नई आज्ञा देता हूँ, कि एक दूसरे से प्रेम रखो जैसा मैंने तुम से प्रेम रखा है, वैसा ही तुम भी एक दूसरे से प्रेम रखो। यदि आपस में प्रेम रखोगे तो इसी से सब जानेंगे, कि तुम मेरे चेले हो।”","tms60-E-2":"हे मेरे प्रिय बालकों, हम वचन और जीभ ही से नहीं, पर काम और सत्य के द्वारा भी प्रेम करें।","tms60-E-3":"स्वार्थ या मिथ्यागर्व के लिये कुछ न करो, पर दीनता से एक दूसरे को अपने से अच्छा समझो। हर एक अपनी ही हित की नहीं, वरन् दूसरों के हित की भी चिन्ता करे।","tms60-E-4":"हे नवयुवकों, तुम भी वृद्ध पुरुषों के अधीन रहो, वरन् तुम सब के सब एक दूसरे की सेवा के लिये दीनता से कमर बाँधे रहो, क्योंकि “परमेश्‍वर अभिमानियों का विरोध करता है, परन्तु दीनों पर अनुग्रह करता है।” इसलिए परमेश्‍वर के बलवन्त हाथ के नीचे दीनता से रहो, जिससे वह तुम्हें उचित समय पर बढ़ाए।","tms60-E-5":"जैसा पवित्र लोगों के योग्य है, वैसा तुम में व्यभिचार, और किसी प्रकार के अशुद्ध काम, या लोभ की चर्चा तक न हो।","tms60-E-6":"हे प्रियों मैं तुम से विनती करता हूँ कि तुम अपने आपको परदेशी और यात्री जानकर उन सांसारिक अभिलाषाओं से जो आत्मा से युद्ध करती हैं, बचे रहो।","tms60-E-7":"“तुम चोरी न करना, और एक दूसरे से, न तो कपट करना, और न झूठ बोलना।","tms60-E-8":"इससे मैं आप भी यत्न करता हूँ, कि परमेश्‍वर की और मनुष्यों की ओर मेरा विवेक सदा निर्दोष रहे।","tms60-E-9":"और विश्वास बिना उसे प्रसन्‍न करना अनहोना है, क्योंकि परमेश्‍वर के पास आनेवाले को विश्वास करना चाहिए, कि वह है; और अपने खोजनेवालों को प्रतिफल देता है।","tms60-E-10":"और न अविश्वासी होकर परमेश्‍वर की प्रतिज्ञा पर संदेह किया, पर विश्वास में दृढ़ होकर परमेश्‍वर की महिमा की, और निश्चय जाना कि जिस बात की उसने प्रतिज्ञा की है, वह उसे पूरा करने में भी सामर्थी है।","tms60-E-11":"हम भले काम करने में साहस न छोड़े, क्योंकि यदि हम ढीले न हों, तो ठीक समय पर कटनी काटेंगे। इसलिए जहाँ तक अवसर मिले हम सब के साथ भलाई करें; विशेष करके विश्वासी भाइयों के साथ।","tms60-E-12":"उसी प्रकार तुम्हारा उजियाला मनुष्यों के सामने चमके कि वे तुम्हारे भले कामों को देखकर तुम्हारे पिता की, जो स्वर्ग में हैं, बड़ाई करें।","tms180-s1-1-1":"आदि में वचन था, और वचन परमेश्‍वर के साथ था, और वचन परमेश्‍वर था। और वचन देहधारी हुआ; और अनुग्रह और सच्चाई से परिपूर्ण होकर हमारे बीच में डेरा किया, और हमने उसकी ऐसी महिमा देखी, जैसी पिता के एकलौते की महिमा।","tms180-s1-1-2":"परन्तु पुत्र के विषय में कहता है, “हे परमेश्‍वर, तेरा सिंहासन युगानुयुग रहेगा, तेरे राज्य का राजदण्ड न्याय का राजदण्ड है।","tms180-s1-1-3":"क्योंकि हमारा ऐसा महायाजक नहीं, जो हमारी निर्बलताओं में हमारे साथ दुःखी न हो सके; वरन् वह सब बातों में हमारे समान परखा तो गया, तो भी निष्पाप निकला।","tms180-s1-1-4":"और यीशु बुद्धि और डील-डौल में और परमेश्‍वर और मनुष्यों के अनुग्रह में बढ़ता गया।","tms180-s1-1-5":"इसी कारण मैंने सबसे पहले तुम्हें वही बात पहुँचा दी, जो मुझे पहुँची थी, कि पवित्रशास्त्र के वचन के अनुसार यीशु मसीह हमारे पापों के लिये मर गया। और गाड़ा गया; और पवित्रशास्त्र के अनुसार तीसरे दिन जी भी उठा।","tms180-s1-1-6":"परन्तु सचमुच मसीह मुर्दों में से जी उठा है, और जो सो गए हैं, उनमें पहला फल हुआ।","tms180-s1-1-7":"परमेश्‍वर को किसी ने कभी नहीं देखा, एकलौता पुत्र जो पिता की गोद में हैं, उसी ने उसे प्रगट किया।","tms180-s1-1-8":"वह उसकी महिमा का प्रकाश, और उसके तत्व की छाप है, और सब वस्तुओं को अपनी सामर्थ्य के वचन से संभालता है: वह पापों को धोकर ऊँचे स्थानों पर महामहिमन् के दाहिने जा बैठा।","tms180-s1-1-9":"क्योंकि मनुष्य का पुत्र खोए हुओं को ढूँढ़ने और उनका उद्धार करने आया है।”","tms180-s1-1-10":"क्योंकि तुम जानते हो कि तुम्हारा निकम्मा चाल-चलन जो पूर्वजों से चला आता है उससे तुम्हारा छुटकारा चाँदी-सोने अर्थात् नाशवान वस्तुओं के द्वारा नहीं हुआ, पर निर्दोष और निष्कलंक मेम्‍ने अर्थात् मसीह के बहुमूल्य लहू के द्वारा हुआ।","tms180-s1-1-11":"क्योंकि प्रभु आप ही स्वर्ग से उतरेगा; उस समय ललकार, और प्रधान दूत का शब्द सुनाई देगा, और परमेश्‍वर की तुरही फूँकी जाएगी, और जो मसीह में मरे हैं, वे पहले जी उठेंगे। तब हम जो जीवित और बचे रहेंगे, उनके साथ बादलों पर उठा लिए जाएँगे, कि हवा में प्रभु से मिलें, और इस रीति से हम सदा प्रभु के साथ रहेंगे।","tms180-s1-1-12":"हे प्रियों, अब हम परमेश्‍वर की सन्तान हैं, और अब तक यह प्रगट नहीं हुआ, कि हम क्या कुछ होंगे! इतना जानते हैं, कि जब यीशु मसीह प्रगट होगा तो हम भी उसके समान होंगे, क्योंकि हम उसको वैसा ही देखेंगे जैसा वह है। और जो कोई उस पर यह आशा रखता है, वह अपने आप को वैसा ही पवित्र करता है, जैसा वह पवित्र है।","tms180-s1-2-1":"परन्तु जब वह अर्थात् सत्य का आत्मा आएगा, तो तुम्हें सब सत्य का मार्ग बताएगा, क्योंकि वह अपनी ओर से न कहेगा, परन्तु जो कुछ सुनेगा, वही कहेगा, और आनेवाली बातें तुम्हें बताएगा। वह मेरी महिमा करेगा, क्योंकि वह मेरी बातों में से लेकर तुम्हें बताएगा।","tms180-s1-2-2":"इसलिए मैं तुम्हें चेतावनी देता हूँ कि जो कोई परमेश्‍वर की आत्मा की अगुआई से बोलता है, वह नहीं कहता कि यीशु श्रापित है; और न कोई पवित्र आत्मा के बिना कह सकता है कि यीशु प्रभु है।","tms180-s1-2-3":"परन्तु जब कि परमेश्‍वर का आत्मा तुम में बसता है, तो तुम शारीरिक दशा में नहीं, परन्तु आत्मिक दशा में हो। यदि किसी में मसीह का आत्मा नहीं तो वह उसका जन नहीं।","tms180-s1-2-4":"और तुम जो पुत्र हो, इसलिए परमेश्‍वर ने अपने पुत्र के आत्मा को, जो ‘हे अब्बा, हे पिता’ कहकर पुकारता है, हमारे हृदय में भेजा है।","tms180-s1-2-5":"और दाखरस से मतवाले न बनो, क्योंकि इससे लुचपन होता है, पर पवित्र आत्मा से परिपूर्ण होते जाओ,","tms180-s1-2-6":"पर मैं कहता हूँ, आत्मा के अनुसार चलो, तो तुम शरीर की लालसा किसी रीति से पूरी न करोगे।","tms180-s1-2-7":"परन्तु जैसा लिखा है, “जो आँख ने नहीं देखी, और कान ने नहीं सुनी, और जो बातें मनुष्य के चित्त में नहीं चढ़ी वे ही हैं, जो परमेश्‍वर ने अपने प्रेम रखनेवालों के लिये तैयार की हैं।” परन्तु परमेश्‍वर ने उनको अपने आत्मा के द्वारा हम पर प्रगट किया; क्योंकि आत्मा सब बातें, वरन् परमेश्‍वर की गूढ़ बातें भी जाँचता है।","tms180-s1-2-8":"परन्तु सहायक अर्थात् पवित्र आत्मा जिसे पिता मेरे नाम से भेजेगा, वह तुम्हें सब बातें सिखाएगा, और जो कुछ मैंने तुम से कहा है, वह सब तुम्हें स्मरण कराएगा।”","tms180-s1-2-9":"और मेरे वचन, और मेरे प्रचार में ज्ञान की लुभानेवाली बातें नहीं; परन्तु आत्मा और सामर्थ्य का प्रमाण था, इसलिए कि तुम्हारा विश्वास मनुष्यों के ज्ञान पर नहीं, परन्तु परमेश्‍वर की सामर्थ्य पर निर्भर हो।","tms180-s1-2-10":"क्योंकि हमारा सुसमाचार तुम्हारे पास न केवल वचन मात्र ही में वरन् सामर्थ्य और पवित्र आत्मा, और बड़े निश्चय के साथ पहुँचा है; जैसा तुम जानते हो, कि हम तुम्हारे लिये तुम में कैसे बन गए थे।","tms180-s1-2-11":"परन्तु ये सब प्रभावशाली कार्य वही एक आत्मा करवाता है, और जिसे जो चाहता है वह बाँट देता है।","tms180-s1-2-12":"वरदान तो कई प्रकार के हैं, परन्तु आत्मा एक ही है। और प्रभावशाली कार्य कई प्रकार के हैं, परन्तु परमेश्‍वर एक ही है, जो सब में हर प्रकार का प्रभाव उत्‍पन्‍न करता है।","tms180-s1-3-1":"हे प्रभु यहोवा, तूने बड़े सामर्थ्य और बढ़ाई हुई भुजा से आकाश और पृथ्वी को बनाया है! तेरे लिये कोई काम कठिन नहीं है।","tms180-s1-3-2":"अहा, परमेश्‍वर का धन और बुद्धि और ज्ञान क्या ही गम्भीर है! उसके विचार कैसे अथाह, और उसके मार्ग कैसे अगम हैं!","tms180-s1-3-3":"फिर यहोवा की यह वाणी है, क्या कोई ऐसे गुप्त स्थानों में छिप सकता है, कि मैं उसे न देख सकूँ? क्या स्वर्ग और पृथ्वी दोनों मुझसे परिपूर्ण नहीं हैं?","tms180-s1-3-4":"परमेश्‍वर सब प्रकार का अनुग्रह तुम्हें बहुतायत से दे सकता है। जिससे हर बात में और हर समय, सब कुछ, जो तुम्हें आवश्यक हो, तुम्हारे पास रहे, और हर एक भले काम के लिये तुम्हारे पास बहुत कुछ हो।","tms180-s1-3-5":"हे यहोवा! महिमा, पराक्रम, शोभा, सामर्थ्य और वैभव, तेरा ही है; क्योंकि आकाश और पृथ्वी में जो कुछ है, वह तेरा ही है; हे यहोवा! राज्य तेरा है, और तू सभी के ऊपर मुख्य और महान ठहरा है। इसलिए अब हे हमारे परमेश्‍वर! हम तेरा धन्यवाद और तेरे महिमायुक्त नाम की स्तुति करते हैं।","tms180-s1-3-6":"परन्तु प्रभु विश्वासयोग्य है; वह तुम्हें दृढ़ता से स्थिर करेगा: और उस दुष्ट से सुरक्षित रखेगा।","tms180-s1-3-7":"परमेश्‍वर आत्मा है, और अवश्य है कि उसकी आराधना करनेवाले आत्मा और सच्चाई से आराधना करें।”","tms180-s1-3-8":"पर जैसा तुम्हारा बुलानेवाला पवित्र है, वैसे ही तुम भी अपने सारे चाल-चलन में पवित्र बनो। क्योंकि लिखा है, “पवित्र बनो, क्योंकि मैं पवित्र हूँ।”","tms180-s1-3-9":"यहोवा महान और अति स्तुति के योग्य है, और उसकी बड़ाई अगम है।","tms180-s1-3-10":"प्रेम इसमें नहीं कि हमने परमेश्‍वर से प्रेम किया पर इसमें है, कि उसने हम से प्रेम किया और हमारे पापों के प्रायश्चित के लिये अपने पुत्र को भेजा।","tms180-s1-3-11":"परन्तु प्रभु दयालु और अनुग्रहकारी परमेश्‍वर है, तू विलम्ब से कोप करनेवाला और अति करुणामय है।","tms180-s1-3-12":"और हम जानते हैं, कि जो लोग परमेश्‍वर से प्रेम रखते हैं, उनके लिये सब बातें मिलकर भलाई ही को उत्‍पन्‍न करती है; अर्थात् उन्हीं के लिये जो उसकी इच्छा के अनुसार बुलाए हुए हैं।","tms180-s2-1-1":"वरन् प्रेम में सच बोलें और सब बातों में उसमें जो सिर है, अर्थात् मसीह में बढ़ते जाएँ,","tms180-s2-1-2":"एक दूसरे से झूठ मत बोलो क्योंकि तुम ने पुराने मनुष्यत्व को उसके कामों समेत उतार डाला है।","tms180-s2-1-3":"जो दूसरे के अपराध को ढाँप देता है, वह प्रेम का खोजी ठहरता है, परन्तु जो बात की चर्चा बार-बार करता है, वह परम मित्रों में भी फूट करा देता है।","tms180-s2-1-4":"जो चुगली करता फिरता वह भेद प्रगट करता है, परन्तु विश्वासयोग्य मनुष्य बात को छिपा रखता है।","tms180-s2-1-5":"और उसे ऐसा प्रगट करूँ, जैसा मुझे करना उचित है। तुम्हारा वचन सदा अनुग्रह सहित और सुहावना हो, कि तुम्हें हर मनुष्य को उचित रीति से उत्तर देना आ जाए।","tms180-s2-1-6":"कोमल उत्तर सुनने से जलजलाहट ठण्डी होती है, परन्तु कटुवचन से क्रोध भड़क उठता है।","tms180-s2-1-7":"इसलिए तुम आपस में एक दूसरे के सामने अपने-अपने पापों को मान लो; और एक दूसरे के लिये प्रार्थना करो, जिससे चंगे हो जाओ; धर्मी जन की प्रार्थना के प्रभाव से बहुत कुछ हो सकता है।","tms180-s2-1-8":"इसलिए यदि तू अपनी भेंट वेदी पर लाए, और वहाँ तू स्मरण करे, कि मेरे भाई के मन में मेरी ओर से कुछ विरोध है, तो अपनी भेंट वहीं वेदी के सामने छोड़ दे, और जाकर पहले अपने भाई से मेल मिलाप कर, और तब आकर अपनी भेंट चढ़ा।","tms180-s2-1-9":"हे मेरे प्रिय भाइयों, यह बात तुम जान लो, हर एक मनुष्य सुनने के लिये तत्पर और बोलने में धीर और क्रोध में धीमा हो।","tms180-s2-1-10":"जो बिना बात सुने उत्तर देता है, वह मूर्ख ठहरता है, और उसका अनादर होता है।","tms180-s2-1-11":"ठट्ठा करनेवाले को न डाँट, ऐसा न हो कि वह तुझ से बैर रखे, बुद्धिमान को डाँट, वह तो तुझ से प्रेम रखेगा। बुद्धिमान को शिक्षा दे, वह अधिक बुद्धिमान होगा; धर्मी को चिता दे, वह अपनी विद्या बढ़ाएगा।","tms180-s2-1-12":"“यदि तेरा भाई तेरे विरुद्ध अपराध करे, तो जा और अकेले में बातचीत करके उसे समझा; यदि वह तेरी सुने तो तूने अपने भाई को पा लिया।","tms180-s2-2-1":"एक दूसरे पर कृपालु, और करुणामय हो, और जैसे परमेश्‍वर ने मसीह में तुम्हारे अपराध क्षमा किए, वैसे ही तुम भी एक दूसरे के अपराध क्षमा करो।","tms180-s2-2-2":"और यदि किसी को किसी पर दोष देने को कोई कारण हो, तो एक दूसरे की सह लो, और एक दूसरे के अपराध क्षमा करो: जैसे प्रभु ने तुम्हारे अपराध क्षमा किए, वैसे ही तुम भी करो।","tms180-s2-2-3":"अर्थात् सारी दीनता और नम्रता सहित, और धीरज धरकर प्रेम से एक दूसरे की सह लो,","tms180-s2-2-4":"और प्रभु के दास को झगड़ालू नहीं होना चाहिए, पर सब के साथ कोमल और शिक्षा में निपुण, और सहनशील हो। और विरोधियों को नम्रता से समझाए, क्या जाने परमेश्‍वर उन्हें मन फिराव का मन दे, कि वे भी सत्य को पहचानें।","tms180-s2-2-5":"क्रोध तो करो, पर पाप मत करो; सूर्य अस्त होने तक तुम्हारा क्रोध न रहे।","tms180-s2-2-6":"पर अब तुम भी इन सब को अर्थात् क्रोध, रोष, बैर-भाव, निन्दा, और मुँह से गालियाँ बकना ये सब बातें छोड़ दो।","tms180-s2-2-7":"और ध्यान से देखते रहो, ऐसा न हो, कि कोई परमेश्‍वर के अनुग्रह से वंचित रह जाए, या कोई कड़वी जड़ फूटकर कष्ट दे, और उसके द्वारा बहुत से लोग अशुद्ध हो जाएँ।","tms180-s2-2-8":"सब प्रकार की कड़वाहट और प्रकोप और क्रोध, और कलह, और निन्दा सब बैर-भाव समेत तुम से दूर की जाए।","tms180-s2-2-9":"क्योंकि यदि तुमने अपराध करके घूँसे खाए और धीरज धरा, तो उसमें क्या बड़ाई की बात है? पर यदि भला काम करके दुःख उठाते हो और धीरज धरते हो, तो यह परमेश्‍वर को भाता है। और तुम इसी के लिये बुलाए भी गए हो क्योंकि मसीह भी तुम्हारे लिये दुःख उठाकर, तुम्हें एक आदर्श दे गया है कि तुम भी उसके पद-चिन्ह पर चलो।","tms180-s2-2-10":"हे प्रियों अपना बदला न लेना; परन्तु परमेश्‍वर को क्रोध का अवसर दो, क्योंकि लिखा है, “बदला लेना मेरा काम है, प्रभु कहता है मैं ही बदला दूँगा।”","tms180-s2-2-11":"क्रोध की क्रूरता और प्रकोप की बाढ़, परन्तु ईर्ष्या के सामने कौन ठहर सकता है?","tms180-s2-2-12":"इसलिए कि जहाँ ईर्ष्या और विरोध होता है, वहाँ बखेड़ा और हर प्रकार का दुष्कर्म भी होता है।","tms180-s2-3-1":"धीरज, और प्रोत्साहन का दाता परमेश्‍वर तुम्हें यह वरदान दे, कि मसीह यीशु के अनुसार आपस में एक मन रहो। ताकि तुम एक मन और एक स्वर होकर हमारे प्रभु यीशु मसीह के पिता परमेश्‍वर की स्‍तुति करो।","tms180-s2-3-2":"हे भाइयों, मैं तुम से यीशु मसीह जो हमारा प्रभु है उसके नाम के द्वारा विनती करता हूँ, कि तुम सब एक ही बात कहो और तुम में फूट न हो, परन्तु एक ही मन और एक ही मत होकर मिले रहो।","tms180-s2-3-3":"परन्तु तुम में ऐसा न होगा; परन्तु जो कोई तुम में बड़ा होना चाहे, वह तुम्हारा सेवक बने; और जो तुम में प्रधान होना चाहे वह तुम्हारा दास बने;","tms180-s2-3-4":"हे भाइयों, तुम स्वतंत्र होने के लिये बुलाए गए हो; परन्तु ऐसा न हो, कि यह स्वतंत्रता शारीरिक कामों के लिये अवसर बने, वरन् प्रेम से एक दूसरे के दास बनो।","tms180-s2-3-5":"हम में से हर एक अपने पड़ोसी को उसकी भलाई के लिये सुधारने के निमित्त प्रसन्‍न करे।","tms180-s2-3-6":"स्वार्थ या मिथ्यागर्व के लिये कुछ न करो, पर दीनता से एक दूसरे को अपने से अच्छा समझो। हर एक अपनी ही हित की नहीं, वरन् दूसरों के हित की भी चिन्ता करे।","tms180-s2-3-7":"इस कारण एक दूसरे को शान्ति दो, और एक दूसरे की उन्नति का कारण बनो, जैसा कि तुम करते भी हो।","tms180-s2-3-8":"एक से दो अच्छे हैं, क्योंकि उनके परिश्रम का अच्छा फल मिलता है। क्योंकि यदि उनमें से एक गिरे, तो दूसरा उसको उठाएगा; परन्तु हाय उस पर जो अकेला होकर गिरे और उसका कोई उठानेवाला न हो।","tms180-s2-3-9":"जब उसने भीड़ को देखा तो उसको लोगों पर तरस आया, क्योंकि वे उन भेड़ों के समान जिनका कोई चरवाहा न हो, व्याकुल और भटके हुए से थे।","tms180-s2-3-10":"आनन्द करनेवालों के साथ आनन्द करो, और रोनेवालों के साथ रोओ।","tms180-s2-3-11":"पर जो ज्ञान ऊपर से आता है वह पहले तो पवित्र होता है फिर मिलनसार, कोमल और मृदुभाव और दया, और अच्छे फलों से लदा हुआ और पक्षपात और कपटरहित होता है।","tms180-s2-3-12":"हे भाइयों, यदि कोई मनुष्य किसी अपराध में पकड़ा जाए, तो तुम जो आत्मिक हो, नम्रता के साथ ऐसे को संभालो, और अपनी भी देख-रेख करो, कि तुम भी परीक्षा में न पड़ो।","tms180-s3-1-1":"क्योंकि उसके ईश्वरीय सामर्थ्य ने सब कुछ जो जीवन और भक्ति से सम्बन्ध रखता है, हमें उसी की पहचान के द्वारा दिया है, जिस ने हमें अपनी ही महिमा और सद्गुण के अनुसार बुलाया है। जिनके द्वारा उसने हमें बहुमूल्य और बहुत ही बड़ी प्रतिज्ञाएँ दी हैं ताकि इनके द्वारा तुम उस सड़ाहट से छूटकर जो संसार में बुरी अभिलाषाओं से होती है, ईश्वरीय स्वभाव के सहभागी हो जाओ।","tms180-s3-1-2":"क्योंकि परमेश्‍वर की जितनी प्रतिज्ञाएँ हैं, वे सब उसी में ‘हाँ’ के साथ हैं इसलिए उसके द्वारा आमीन भी हुई, कि हमारे द्वारा परमेश्‍वर की महिमा हो।","tms180-s3-1-3":"हमारे प्रभु यीशु मसीह के परमेश्‍वर, और पिता का धन्यवाद हो, जो दया का पिता, और सब प्रकार की शान्ति का परमेश्‍वर है। वह हमारे सब क्लेशों में शान्ति देता है; ताकि हम उस शान्ति के कारण जो परमेश्‍वर हमें देता है, उन्हें भी शान्ति दे सके, जो किसी प्रकार के क्लेश में हों।","tms180-s3-1-4":"इसलिए न तो लगानेवाला कुछ है, और न सींचनेवाला, परन्तु परमेश्‍वर जो बढ़ानेवाला है। लगानेवाला और सींचनेवाला दोनों एक हैं; परन्तु हर एक व्यक्ति अपने ही परिश्रम के अनुसार अपनी ही मजदूरी पाएगा।","tms180-s3-1-5":"परन्तु वह तो यहोवा की व्यवस्था से प्रसन्‍न रहता; और उसकी व्यवस्था पर रात-दिन ध्यान करता रहता है। वह उस वृक्ष के समान है, जो बहती पानी की धाराओं के किनारे लगाया गया है और अपनी ऋतु में फलता है, और जिसके पत्ते कभी मुरझाते नहीं। और जो कुछ वह पुरुष करे वह सफल होता है।","tms180-s3-1-6":"क्योंकि यदि ये बातें तुम में वर्तमान रहें, और बढ़ती जाएँ, तो तुम्हें हमारे प्रभु यीशु मसीह की पहचान में निकम्मे और निष्फल न होने देंगी।","tms180-s3-1-7":"अब परमेश्‍वर जो सारे अनुग्रह का दाता है, जिसने तुम्हें मसीह में अपनी अनन्त महिमा के लिये बुलाया, तुम्हारे थोड़ी देर तक दुःख उठाने के बाद आप ही तुम्हें सिद्ध और स्थिर और बलवन्त करेगा।","tms180-s3-1-8":"और उसने मुझसे कहा, “मेरा अनुग्रह तेरे लिये बहुत है; क्योंकि मेरी सामर्थ्य निर्बलता में सिद्ध होती है।” इसलिए मैं बड़े आनन्द से अपनी निर्बलताओं पर घमण्ड करूँगा, कि मसीह की सामर्थ्य मुझ पर छाया करती रहे।","tms180-s3-1-9":"हमारे परमेश्‍वर और प्रभु यीशु मसीह के पिता का धन्यवाद हो कि उसने हमें मसीह में स्वर्गीय स्थानों में सब प्रकार की आत्मिक आशीष दी है।","tms180-s3-1-10":"यहोवा को अपने सुख का मूल जान, और वह तेरे मनोरथों को पूरा करेगा। अपने मार्ग की चिन्ता यहोवा पर छोड़; और उस पर भरोसा रख, वही पूरा करेगा।","tms180-s3-1-11":"मेरे प्रिय बालकों, मैं ये बातें तुम्हें इसलिए लिखता हूँ, कि तुम पाप न करो; और यदि कोई पाप करे तो पिता के पास हमारा एक सहायक है, अर्थात् धर्मी यीशु मसीह। और वही हमारे पापों का प्रायश्चित है: और केवल हमारे ही नहीं, वरन् सारे जगत के पापों का भी।","tms180-s3-1-12":"उदयाचल अस्ताचल से जितनी दूर है, उसने हमारे अपराधों को हम से उतनी ही दूर कर दिया है।","tms180-s3-2-1":"क्योंकि परमेश्‍वर का वचन जीवित, प्रबल, और हर एक दोधारी तलवार से भी बहुत तेज है, प्राण, आत्मा को, गाँठ-गाँठ, और गूदे-गूदे को अलग करके, आर-पार छेदता है; और मन की भावनाओं और विचारों को जाँचता है।","tms180-s3-2-2":"“जिस प्रकार से वर्षा और हिम आकाश से गिरते हैं और वहाँ ऐसे ही लौट नहीं जाते, वरन् भूमि पर पड़कर उपज उपजाते हैं जिससे बोलनेवाले को बीज और खानेवाले को रोटी मिलती है, उसी प्रकार से मेरा वचन भी होगा जो मेरे मुख से निकलता है; वह व्यर्थ ठहरकर मेरे पास न लौटेगा, परन्तु, जो मेरी इच्छा है उसे वह पूरा करेगा, और जिस काम के लिये मैंने उसको भेजा है उसे वह सफल करेगा।","tms180-s3-2-3":"पर पहले यह जान लो कि पवित्रशास्त्र की कोई भी भविष्यद्वाणी किसी की अपने ही विचारधारा के आधार पर पूर्ण नहीं होती। क्योंकि कोई भी भविष्यद्वाणी मनुष्य की इच्छा से कभी नहीं हुई पर भक्त जन पवित्र आत्मा के द्वारा उभारे जाकर परमेश्‍वर की ओर से बोलते थे।","tms180-s3-2-4":"इसलिए हम भी परमेश्‍वर का धन्यवाद निरन्तर करते हैं; कि जब हमारे द्वारा परमेश्‍वर के सुसमाचार का वचन तुम्हारे पास पहुँचा, तो तुम ने उसे मनुष्यों का नहीं, परन्तु परमेश्‍वर का वचन समझकर (और सचमुच यह ऐसा ही है) ग्रहण किया और वह तुम में जो विश्वास रखते हो, कार्य करता है।","tms180-s3-2-5":"जब तेरे वचन मेरे पास पहुँचे, तब मैंने उन्हें मानो खा लिया, और तेरे वचन मेरे मन के हर्ष और आनन्द का कारण हुए; क्योंकि, हे सेनाओं के परमेश्‍वर यहोवा, मैं तेरा कहलाता हूँ।","tms180-s3-2-6":"उसकी आज्ञा का पालन करने से मैं न हटा, और मैंने उसके वचन अपनी इच्छा से कहीं अधिक काम के जानकर सुरक्षित रखे।","tms180-s3-2-7":"ये लोग तो थिस्सलुनीके के यहूदियों से भले थे और उन्होंने बड़ी लालसा से वचन ग्रहण किया, और प्रतिदिन पवित्रशास्त्रों में ढूँढ़ते रहे कि ये बातें ऐसी ही हैं कि नहीं।","tms180-s3-2-8":"तुम पवित्रशास्त्र में ढूँढ़ते हो, क्योंकि समझते हो कि उसमें अनन्त जीवन तुम्हें मिलता है, और यह वही है, जो मेरी गवाही देता है; फिर भी तुम जीवन पाने के लिये मेरे पास आना नहीं चाहते।","tms180-s3-2-9":"तब यीशु ने उन यहूदियों से जिन्होंने उस पर विश्वास किया था, कहा, “यदि तुम मेरे वचन में बने रहोगे, तो सचमुच मेरे चेले ठहरोगे। और सत्य को जानोगे, और सत्य तुम्हें स्वतंत्र करेगा।”","tms180-s3-2-10":"यीशु ने उत्तर दिया, “लिखा है, “‘मनुष्य केवल रोटी ही से नहीं, “परन्तु हर एक वचन से जो परमेश्‍वर के मुख से निकलता है जीवित रहेगा।”","tms180-s3-2-11":"आकाश और पृथ्वी टल जाएँगे, परन्तु मेरे शब्‍द कभी न टलेंगी।","tms180-s3-2-12":"सत्य के द्वारा उन्हें पवित्र कर: तेरा वचन सत्य है।","tms180-s3-3-1":"इस कारण तुम मगन होते हो, यद्यपि अवश्य है कि अब कुछ दिन तक नाना प्रकार की परीक्षाओं के कारण दुःख में हो, और यह इसलिए है कि तुम्हारा परखा हुआ विश्वास, जो आग से ताए हुए नाशवान सोने से भी कहीं अधिक बहुमूल्य है, यीशु मसीह के प्रगट होने पर प्रशंसा, महिमा, और आदर का कारण ठहरे।","tms180-s3-3-2":"हे मेरे भाइयों, जब तुम नाना प्रकार की परीक्षाओं में पड़ो तो इसको पूरे आनन्द की बात समझो, पर धीरज को अपना पूरा काम करने दो, कि तुम पूरे और सिद्ध हो जाओ और तुम में किसी बात की घटी न रहे।","tms180-s3-3-3":"क्योंकि हमें उन्हीं के समान सुसमाचार सुनाया गया है, पर सुने हुए वचन से उन्हें कुछ लाभ न हुआ; क्योंकि सुननेवालों के मन में विश्वास के साथ नहीं बैठा।","tms180-s3-3-4":"और मेरा धर्मी जन विश्वास से जीवित रहेगा, और यदि वह पीछे हट जाए तो मेरा मन उससे प्रसन्‍न न होगा।”","tms180-s3-3-5":"और उन सब के साथ विश्वास की ढाल लेकर स्थिर रहो जिससे तुम उस दुष्ट के सब जलते हुए तीरों को बुझा सको।","tms180-s3-3-6":"पर हे परमेश्‍वर के जन, तू इन बातों से भाग; और धार्मिकता, भक्ति, विश्वास, प्रेम, धीरज, और नम्रता का पीछा कर। विश्वास की अच्छी कुश्ती लड़; और उस अनन्त जीवन को धर ले, जिसके लिये तू बुलाया गया, और बहुत गवाहों के सामने अच्छा अंगीकार किया था।","tms180-s3-3-7":"अब विश्वास आशा की हुई वस्तुओं का निश्चय, और अनदेखी वस्तुओं का प्रमाण है।","tms180-s3-3-8":"इसलिए विश्वास सुनने से, और सुनना मसीह के वचन से होता है।","tms180-s3-3-9":"ताकि तुम आलसी न हो जाओ; वरन् उनका अनुकरण करो, जो विश्वास और धीरज के द्वारा प्रतिज्ञाओं के वारिस होते हैं।","tms180-s3-3-10":"वैसे ही विश्वास भी, यदि कर्म सहित न हो तो अपने स्वभाव में मरा हुआ है।","tms180-s3-3-11":"तो भी यह जानकर कि मनुष्य व्यवस्था के कामों से नहीं, पर केवल यीशु मसीह पर विश्वास करने के द्वारा धर्मी ठहरता है, हमने आप भी मसीह यीशु पर विश्वास किया, कि हम व्यवस्था के कामों से नहीं पर मसीह पर विश्वास करने से धर्मी ठहरें; इसलिए कि व्यवस्था के कामों से कोई प्राणी धर्मी न ठहरेगा।","tms180-s3-3-12":"क्योंकि हम विश्वास से धर्मी ठहरे, तो अपने प्रभु यीशु मसीह के द्वारा परमेश्‍वर के साथ मेल रखें,","tms180-s4-1-1":"परन्तु परमेश्‍वर का धन्यवाद हो, जो हमारे प्रभु यीशु मसीह के द्वारा हमें जयवन्त करता है।","tms180-s4-1-2":"परन्तु परमेश्‍वर का धन्यवाद हो, जो मसीह में सदा हमको जय के उत्सव में लिये फिरता है, और अपने ज्ञान की सुगन्ध हमारे द्वारा हर जगह फैलाता है।","tms180-s4-1-3":"क्योंकि हमारी लड़ाई के हथियार शारीरिक नहीं, पर गढ़ों को ढा देने के लिये परमेश्‍वर के द्वारा सामर्थी हैं। हम कल्पनाओं को, और हर एक ऊँची बात को, जो परमेश्‍वर की पहचान के विरोध में उठती है, खण्डन करते हैं; और हर एक भावना को कैद करके मसीह का आज्ञाकारी बना देते हैं।","tms180-s4-1-4":"इसलिए प्रभु में और उसकी शक्ति के प्रभाव में बलवन्त बनो। परमेश्‍वर के सारे हथियार बाँध लो कि तुम शैतान की युक्तियों के सामने खड़े रह सको।","tms180-s4-1-5":"“और वे मेम्‍ने के लहू के कारण, और अपनी गवाही के वचन के कारण, उस पर जयवन्त हुए, क्योंकि उन्होंने अपने प्राणों को प्रिय न जाना, यहाँ तक कि मृत्यु भी सह ली।","tms180-s4-1-6":"इसलिए परमेश्‍वर के अधीन हो जाओ; और शैतान का सामना करो, तो वह तुम्हारे पास से भाग निकलेगा। परमेश्‍वर के निकट आओ, तो वह भी तुम्हारे निकट आएगा: हे पापियों, अपने हाथ शुद्ध करो; और हे दुचित्ते लोगों अपने हृदय को पवित्र करो।","tms180-s4-1-7":"क्योंकि शारीरिक व्यक्ति शरीर की बातों पर मन लगाते हैं; परन्तु आध्यात्मिक आत्मा की बातों पर मन लगाते हैं। शरीर पर मन लगाना तो मृत्यु है, परन्तु आत्मा पर मन लगाना जीवन और शान्ति है।","tms180-s4-1-8":"वरन् प्रभु यीशु मसीह को पहन लो, और शरीर की अभिलाषाओं को पूरा करने का उपाय न करो।","tms180-s4-1-9":"हे प्रिय बालकों, तुम परमेश्‍वर के हो और उन आत्माओं पर जय पाई है; क्योंकि जो तुम में है, वह उससे जो संसार में है, बड़ा है।","tms180-s4-1-10":"क्योंकि जो कुछ परमेश्‍वर से उत्‍पन्‍न हुआ है, वह संसार पर जय प्राप्त करता है, और वह विजय जिससे संसार पर जय प्राप्त होती है हमारा विश्वास है। संसार पर जय पानेवाला कौन है? केवल वह जिसका विश्वास है, कि यीशु, परमेश्‍वर का पुत्र है।","tms180-s4-1-11":"उसके परमेश्‍वर की व्यवस्था उसके हृदय में बनी रहती है, उसके पैर नहीं फिसलते।","tms180-s4-1-12":"इसलिए पाप तुम्हारे नाशवान शरीर में राज्य न करे, कि तुम उसकी लालसाओं के अधीन रहो। और न अपने अंगों को अधर्म के हथियार होने के लिये पाप को सौंपो, पर अपने आपको मरे हुओं में से जी उठा हुआ जानकर परमेश्‍वर को सौंपो, और अपने अंगों को धार्मिकता के हथियार होने के लिये परमेश्‍वर को सौंपो।","tms180-s4-2-1":"इसलिए, हे भाइयों, जो-जो बातें सत्य हैं, और जो-जो बातें आदरणीय हैं, और जो-जो बातें उचित हैं, और जो-जो बातें पवित्र हैं, और जो-जो बातें सुहावनी हैं, और जो-जो बातें मनभावनी हैं, अर्थात्, जो भी सद्‍गुण और प्रशंसा की बातें हैं, उन्हीं पर ध्यान लगाया करो।","tms180-s4-2-2":"शुद्ध लोगों के लिये सब वस्तुएँ शुद्ध हैं, पर अशुद्ध और अविश्वासियों के लिये कुछ भी शुद्ध नहीं वरन् उनकी बुद्धि और विवेक दोनों अशुद्ध हैं।","tms180-s4-2-3":"भला मनुष्य अपने मन के भले भण्डार से भली बातें निकालता है; और बुरा मनुष्य अपने मन के बुरे भण्डार से बुरी बातें निकालता है; क्योंकि जो मन में भरा है वही उसके मुँह पर आता है।","tms180-s4-2-4":"सबसे अधिक अपने मन की रक्षा कर; क्योंकि जीवन का मूल स्रोत वही है।","tms180-s4-2-5":"“शरीर का दीया आँख है: इसलिए यदि तेरी आँख अच्छी हो, तो तेरा सारा शरीर भी उजियाला होगा।","tms180-s4-2-6":"परन्तु मैं तुम से यह कहता हूँ, कि जो कोई किसी स्त्री पर कुदृष्टि डाले वह अपने मन में उससे व्यभिचार कर चुका।","tms180-s4-2-7":"क्योंकि परमेश्‍वर की इच्छा यह है, कि तुम पवित्र बनो अर्थात् व्यभिचार से बचे रहो,","tms180-s4-2-8":"भोजन पेट के लिये, और पेट भोजन के लिये है, परन्तु परमेश्‍वर इसको और उसको दोनों को नाश करेगा, परन्तु देह व्यभिचार के लिये नहीं, वरन् प्रभु के लिये; और प्रभु देह के लिये है।","tms180-s4-2-9":"कोई गंदी बात तुम्हारे मुँह से न निकले, पर आवश्यकता के अनुसार वही निकले जो उन्नति के लिये उत्तम हो, ताकि उससे सुननेवालों पर अनुग्रह हो।","tms180-s4-2-10":"और मैं तुम से कहता हूँ, कि जो-जो निकम्मी बातें मनुष्य कहेंगे, न्याय के दिन हर एक बात का लेखा देंगे। क्योंकि तू अपनी बातों के कारण निर्दोष और अपनी बातों ही के कारण दोषी ठहराया जाएगा।”","tms180-s4-2-11":"सब प्रकार की बुराई से बचे रहो।","tms180-s4-2-12":"किसी बूढ़े को न डाँट; पर उसे पिता जानकर समझा दे, और जवानों को भाई जानकर; बूढ़ी स्त्रियों को माता जानकर; और जवान स्त्रियों को पूरी पवित्रता से बहन जानकर, समझा दे।","tms180-s4-3-1":"और जो कुछ तुम प्रार्थना में विश्वास से माँगोगे वह सब तुम को मिलेगा।”","tms180-s4-3-2":"“माँगो, तो तुम्हें दिया जाएगा; ढूँढ़ो, तो तुम पाओगे; खटखटाओ, तो तुम्हारे लिये खोला जाएगा। क्योंकि जो कोई माँगता है, उसे मिलता है; और जो ढूँढ़ता है, वह पाता है; और जो खटखटाता है, उसके लिये खोला जाएगा।","tms180-s4-3-3":"परन्तु जब तू प्रार्थना करे, तो अपनी कोठरी में जा; और द्वार बन्द कर के अपने पिता से जो गुप्त में है प्रार्थना कर; और तब तेरा पिता जो गुप्त में देखता है, तुझे प्रतिफल देगा।","tms180-s4-3-4":"और भोर को दिन निकलने से बहुत पहले, वह उठकर निकला, और एक जंगली स्थान में गया और वहाँ प्रार्थना करने लगा।","tms180-s4-3-5":"मुझसे प्रार्थना कर और मैं तेरी सुनकर तुझे बड़ी-बड़ी और कठिन बातें बताऊँगा जिन्हें तू अभी नहीं समझता।","tms180-s4-3-6":"अब जो ऐसा सामर्थी है, कि हमारी विनती और समझ से कहीं अधिक काम कर सकता है, उस सामर्थ्य के अनुसार जो हम में कार्य करता है,","tms180-s4-3-7":"और हमें उसके सामने जो साहस होता है, वह यह है; कि यदि हम उसकी इच्छा के अनुसार कुछ माँगते हैं, तो हमारी सुनता है। और जब हम जानते हैं, कि जो कुछ हम माँगते हैं वह हमारी सुनता है, तो यह भी जानते हैं, कि जो कुछ हमने उससे माँगा, वह पाया है।","tms180-s4-3-8":"निरन्तर प्रार्थना में लगे रहो। हर बात में धन्यवाद करो: क्योंकि तुम्हारे लिये मसीह यीशु में परमेश्‍वर की यहीं इच्छा है।","tms180-s4-3-9":"फिर यह मुझसे दूर हो कि मैं तुम्हारे लिये प्रार्थना करना छोड़कर यहोवा के विरुद्ध पापी ठहरूँ; मैं तो तुम्हें अच्छा और सीधा मार्ग दिखाता रहूँगा।","tms180-s4-3-10":"तब उसने अपने चेलों से कहा, “फसल तो बहुत हैं पर मजदूर थोड़े हैं। इसलिए फसल के स्वामी से विनती करो कि वह अपने खेत में काम करने के लिये मजदूर भेज दे।”","tms180-s4-3-11":"इसलिए हम उसके द्वारा स्तुतिरूपी बलिदान, अर्थात् उन होंठों का फल जो उसके नाम का अंगीकार करते हैं, परमेश्‍वर के लिये सर्वदा चढ़ाया करें।","tms180-s4-3-12":"यहोवा की स्तुति करो। हे मेरे मन यहोवा की स्तुति कर! मैं जीवन भर यहोवा की स्तुति करता रहूँगा; जब तक मैं बना रहूँगा, तब तक मैं अपने परमेश्‍वर का भजन गाता रहूँगा।","tms180-s5-1-1":"जिन पर परमेश्‍वर ने प्रगट करना चाहा, कि उन्हें ज्ञात हो कि अन्यजातियों में उस भेद की महिमा का मूल्य क्या है, और वह यह है, कि मसीह जो महिमा की आशा है तुम में रहता है। जिसका प्रचार करके हम हर एक मनुष्य को जता देते हैं और सारे ज्ञान से हर एक मनुष्य को सिखाते हैं, कि हम हर एक व्यक्ति को मसीह में सिद्ध करके उपस्थित करें।","tms180-s5-1-2":"अर्थात् परमेश्‍वर ने मसीह में होकर अपने साथ संसार का मेल मिलाप कर लिया, और उनके अपराधों का दोष उन पर नहीं लगाया और उसने मेल मिलाप का वचन हमें सौंप दिया है। इसलिए हम मसीह के राजदूत हैं; मानो परमेश्‍वर हमारे द्वारा समझाता है: हम मसीह की ओर से निवेदन करते हैं, कि परमेश्‍वर के साथ मेल मिलाप कर लो।","tms180-s5-1-3":"पर जैसा परमेश्‍वर ने हमें योग्य ठहराकर सुसमाचार सौंपा, हम वैसा ही वर्णन करते हैं; और इसमें मनुष्यों को नहीं, परन्तु परमेश्‍वर को, जो हमारे मनों को जाँचता है, प्रसन्‍न करते हैं।","tms180-s5-1-4":"क्योंकि सबसे स्वतंत्र होने पर भी मैंने अपने आप को सब का दास बना दिया है; कि अधिक लोगों को खींच लाऊँ।","tms180-s5-1-5":"क्या तुम नहीं कहते, ‘कटनी होने में अब भी चार महीने पड़े हैं?’ देखो, मैं तुम से कहता हूँ, अपनी आँखें उठाकर खेतों पर दृष्टि डालो, कि वे कटनी के लिये पक चुके हैं।","tms180-s5-1-6":"और वैसे ही हम तुम्हारी लालसा करते हुए, न केवल परमेश्‍वर का सुसमाचार, पर अपना-अपना प्राण भी तुम्हें देने को तैयार थे, इसलिए कि तुम हमारे प्यारे हो गए थे।","tms180-s5-1-7":"जैसा लिखा है: “कोई धर्मी नहीं, एक भी नहीं। सब भटक गए हैं, सब के सब निकम्मे बन गए; कोई भलाई करनेवाला नहीं, एक भी नहीं।","tms180-s5-1-8":"और जो परमेश्‍वर को नहीं पहचानते, और हमारे प्रभु यीशु के सुसमाचार को नहीं मानते उनसे पलटा लेगा। वे प्रभु के सामने से, और उसकी शक्ति के तेज से दूर होकर अनन्त विनाश का दण्ड पाएँगे।","tms180-s5-1-9":"वह आप ही हमारे पापों को अपनी देह पर लिए हुए क्रूस पर चढ़ गया, जिससे हम पापों के लिये मर करके धार्मिकता के लिये जीवन बिताएँ। उसी के मार खाने से तुम चंगे हुए।","tms180-s5-1-10":"जिस ने हमारा उद्धार किया, और पवित्र बुलाहट से बुलाया, और यह हमारे कामों के अनुसार नहीं; पर अपनी मनसा और उस अनुग्रह के अनुसार है; जो मसीह यीशु में अनादि काल से हम पर हुआ है।","tms180-s5-1-11":"कि यदि तू अपने मुँह से यीशु को प्रभु जानकर अंगीकार करे और अपने मन से विश्वास करे, कि परमेश्‍वर ने उसे मरे हुओं में से जिलाया, तो तू निश्चय उद्धार पाएगा। क्योंकि धार्मिकता के लिये मन से विश्वास किया जाता है, और उद्धार के लिये मुँह से अंगीकार किया जाता है।","tms180-s5-1-12":"और मैं उन्हें अनन्त जीवन देता हूँ, और वे कभी नाश नहीं होंगी, और कोई उन्हें मेरे हाथ से छीन न लेगा। मेरा पिता, जिस ने उन्हें मुझ को दिया है, सबसे बड़ा है, और कोई उन्हें पिता के हाथ से छीन नहीं सकता।","tms180-s5-2-1":"मनुष्य का सारा चालचलन अपनी दृष्टि में तो ठीक होता है, परन्तु यहोवा मन को जाँचता है,","tms180-s5-2-2":"यदि मनुष्य सारे जगत को प्राप्त करे और अपने प्राण की हानि उठाए, तो उसे क्या लाभ होगा?","tms180-s5-2-3":"यदि कोई उसकी इच्छा पर चलना चाहे, तो वह इस उपदेश के विषय में जान जाएगा कि वह परमेश्‍वर की ओर से है, या मैं अपनी ओर से कहता हूँ।","tms180-s5-2-4":"यीशु ने उनको उत्तर दिया, “वैद्य भले चंगों के लिये नहीं, परन्तु बीमारों के लिये अवश्य है। मैं धर्मियों को नहीं, परन्तु पापियों को मन फिराने के लिये बुलाने आया हूँ।”","tms180-s5-2-5":"तुम जो एक दूसरे से आदर चाहते हो और वह आदर जो एकमात्र परमेश्‍वर की ओर से है, नहीं चाहते, किस प्रकार विश्वास कर सकते हो?","tms180-s5-2-6":"इसलिए जो उसके द्वारा परमेश्‍वर के पास आते हैं, वह उनका पूरा-पूरा उद्धार कर सकता है, क्योंकि वह उनके लिये विनती करने को सर्वदा जीवित है।","tms180-s5-2-7":"कल के दिन के विषय में डींग मत मार, क्योंकि तू नहीं जानता कि दिन भर में क्या होगा।","tms180-s5-2-8":"तो फिर, हम में से हर एक परमेश्‍वर को अपना-अपना लेखा देगा।","tms180-s5-2-9":"तुम पवित्रशास्त्र में ढूँढ़ते हो, क्योंकि समझते हो कि उसमें अनन्त जीवन तुम्हें मिलता है, और यह वही है, जो मेरी गवाही देता है;","tms180-s5-2-10":"ऐसा मार्ग है, जो मनुष्य को ठीक जान पड़ता है, परन्तु उसके अन्त में मृत्यु ही मिलती है।","tms180-s5-2-11":"“तब वह बाईं ओर वालों से कहेगा, ‘हे श्रापित लोगों, मेरे सामने से उस अनन्त आग में चले जाओ, जो शैतान और उसके दूतों के लिये तैयार की गई है।","tms180-s5-2-12":"क्योंकि उसके अनदेखे गुण, अर्थात् उसकी सनातन सामर्थ्य और परमेश्‍वरत्व, जगत की सृष्टि के समय से उसके कामों के द्वारा देखने में आते हैं, यहाँ तक कि वे निरुत्तर हैं।","tms180-s5-3-1":"क्योंकि तुम जानते हो कि तुम्हारा निकम्मा चाल-चलन जो पूर्वजों से चला आता है उससे तुम्हारा छुटकारा चाँदी-सोने अर्थात् नाशवान वस्तुओं के द्वारा नहीं हुआ, पर निर्दोष और निष्कलंक मेम्‍ने अर्थात् मसीह के बहुमूल्य लहू के द्वारा हुआ।","tms180-s5-3-2":"और सब बातें परमेश्‍वर की ओर से हैं, जिस ने मसीह के द्वारा अपने साथ हमारा मेल मिलाप कर लिया, और मेल मिलाप की सेवा हमें सौंप दी है।","tms180-s5-3-3":"हमको मसीह में उसके लहू के द्वारा छुटकारा, अर्थात् अपराधों की क्षमा, परमेश्‍वर के उस अनुग्रह के धन के अनुसार मिला है,","tms180-s5-3-4":"तब तुम पर पाप की प्रभुता न होगी, क्योंकि तुम व्यवस्था के अधीन नहीं वरन् अनुग्रह के अधीन हो। तो क्या हुआ? क्या हम इसलिए पाप करें कि हम व्यवस्था के अधीन नहीं वरन् अनुग्रह के अधीन हैं? कदापि नहीं!","tms180-s5-3-5":"क्योंकि तुम सब उस विश्वास करने के द्वारा जो मसीह यीशु पर है, परमेश्‍वर की सन्तान हो।","tms180-s5-3-6":"पर तुम एक चुना हुआ वंश, और राज-पदधारी, याजकों का समाज, और पवित्र लोग, और परमेश्‍वर की निज प्रजा हो, इसलिए कि जिसने तुम्हें अंधकार में से अपनी अद्भुत ज्योति में बुलाया है, उसके गुण प्रगट करो।","tms180-s5-3-7":"जो पाप से अज्ञात था, उसी को उसने हमारे लिये पाप ठहराया, कि हम उसमें होकर परमेश्‍वर की धार्मिकता बन जाएँ।","tms180-s5-3-8":"परन्तु उसी की ओर से तुम मसीह यीशु में हो, जो परमेश्‍वर की ओर से हमारे लिये ज्ञान ठहरा अर्थात् धार्मिकता, और पवित्रता, और छुटकारा।","tms180-s5-3-9":"क्योंकि उसने एक ही चढ़ावे के द्वारा उन्हें जो पवित्र किए जाते हैं, सर्वदा के लिये सिद्ध कर दिया है।","tms180-s5-3-10":"परन्तु उसके अनुग्रह से उस छुटकारे के द्वारा जो मसीह यीशु में है, सेंत-मेंत धर्मी ठहराए जाते हैं।","tms180-s5-3-11":"पर हमारा स्वदेश स्वर्ग में है; और हम एक उद्धारकर्ता प्रभु यीशु मसीह के वहाँ से आने की प्रतीक्षा करते हैं।","tms180-s5-3-12":"क्योंकि उसमें ईश्वरत्व की सारी परिपूर्णता सदेह वास करती है। और तुम मसीह में भरपूर हो गए हो जो सारी प्रधानता और अधिकार का शिरोमणि है।","dep242-1-1":"अपने आप को परखो, कि विश्वास में हो कि नहीं; अपने आप को जाँचो, क्या तुम अपने विषय में यह नहीं जानते, कि यीशु मसीह तुम में है? नहीं तो तुम निकम्मे निकले हो।","dep242-1-2":"और वह गवाही यह है, कि परमेश्‍वर ने हमें अनन्त जीवन दिया है और यह जीवन उसके पुत्र में है। जिसके पास पुत्र है, उसके पास जीवन है; और जिसके पास परमेश्‍वर का पुत्र नहीं, उसके पास जीवन भी नहीं है।","dep242-1-3":"मैं तुम से सच-सच कहता हूँ, कि जो कोई विश्वास करता है, अनन्त जीवन उसी का है।","dep242-1-4":"मैंने तुम्हें, जो परमेश्‍वर के पुत्र के नाम पर विश्वास करते हो, इसलिए लिखा है कि तुम जानो कि अनन्त जीवन तुम्हारा है।","dep242-1-5":"हमको मसीह में उसके लहू के द्वारा छुटकारा, अर्थात् अपराधों की क्षमा, परमेश्‍वर के उस अनुग्रह के धन के अनुसार मिला है,","dep242-1-6":"इसलिए अब जो मसीह यीशु में हैं, उन पर दण्ड की आज्ञा नहीं।","dep242-1-7":"परन्तु उसके अनुग्रह से उस छुटकारे के द्वारा जो मसीह यीशु में है, सेंत-मेंत धर्मी ठहराए जाते हैं।","dep242-1-8":"क्योंकि हम विश्वास से धर्मी ठहरे, तो अपने प्रभु यीशु मसीह के द्वारा परमेश्‍वर के साथ मेल रखें,","dep242-1-9":"हमारे प्रभु यीशु मसीह के परमेश्‍वर और पिता का धन्यवाद हो, जिसने यीशु मसीह को मरे हुओं में से जी उठने के द्वारा, अपनी बड़ी दया से हमें जीवित आशा के लिये नया जन्म दिया,","dep242-1-10":"तो उसने हमारा उद्धार किया और यह धार्मिक कामों के कारण नहीं, जो हमने आप किए, पर अपनी दया के अनुसार, नये जन्म के स्नान, और पवित्र आत्मा के हमें नया बनाने के द्वारा हुआ।","dep242-1-11":"इसलिए कि जितने लोग परमेश्‍वर के आत्मा के चलाए चलते हैं, वे ही परमेश्‍वर के पुत्र हैं।","dep242-1-12":"क्योंकि तुम सब उस विश्वास करने के द्वारा जो मसीह यीशु पर है, परमेश्‍वर की सन्तान हो।","dep242-1-13":"परन्तु जब कि परमेश्‍वर का आत्मा तुम में बसता है, तो तुम शारीरिक दशा में नहीं, परन्तु आत्मिक दशा में हो। यदि किसी में मसीह का आत्मा नहीं तो वह उसका जन नहीं।","dep242-1-14":"और मैं पिता से विनती करूँगा, और वह तुम्हें एक और सहायक देगा, कि वह सर्वदा तुम्हारे साथ रहे। अर्थात् सत्य की आत्मा, जिसे संसार ग्रहण नहीं कर सकता, क्योंकि वह न उसे देखता है और न उसे जानता है: तुम उसे जानते हो, क्योंकि वह तुम्हारे साथ रहता है, और वह तुम में होगा।","dep242-1-15":"न गहराई और न कोई और सृष्टि, हमें परमेश्‍वर के प्रेम से, जो हमारे प्रभु मसीह यीशु में है, अलग कर सकेगी।","dep242-1-16":"और मैं उन्हें अनन्त जीवन देता हूँ, और वे कभी नाश नहीं होंगी, और कोई उन्हें मेरे हाथ से छीन न लेगा। मेरा पिता, जिस ने उन्हें मुझ को दिया है, सबसे बड़ा है, और कोई उन्हें पिता के हाथ से छीन नहीं सकता।","dep242-1-17":"और उसी में तुम पर भी जब तुम ने सत्य का वचन सुना, जो तुम्हारे उद्धार का सुसमाचार है, और जिस पर तुम ने विश्वास किया, प्रतिज्ञा किए हुए पवित्र आत्मा की छाप लगी।","dep242-1-18":"क्योंकि तुम ने नाशवान नहीं पर अविनाशी बीज से परमेश्‍वर के जीविते और सदा ठहरनेवाले वचन के द्वारा नया जन्म पाया है।","dep242-2-1-1":"तो भी यहोवा इसलिए विलम्ब करता है कि तुम पर अनुग्रह करे, और इसलिए ऊँचे उठेगा कि तुम पर दया करे। क्योंकि यहोवा न्यायी परमेश्‍वर है; क्या ही धन्य हैं वे जो उस पर आशा लगाए रहते हैं।","dep242-2-1-2":"परमेश्‍वर विश्वासयोग्य है; जिस ने तुम को अपने पुत्र हमारे प्रभु यीशु मसीह की संगति में बुलाया है।","dep242-2-1-3":"“जब तक यहोवा मिल सकता है तब तक उसकी खोज में रहो, जब तक वह निकट है तब तक उसे पुकारो;","dep242-2-1-4":"तूने कहा है, “मेरे दर्शन के खोजी हो।” इसलिए मेरा मन तुझसे कहता है, “हे यहोवा, तेरे दर्शन का मैं खोजी रहूँगा।”","dep242-2-1-5":"मैं दाखलता हूँ: तुम डालियाँ हो; जो मुझ में बना रहता है, और मैं उसमें, वह बहुत फल फलता है, क्योंकि मुझसे अलग होकर तुम कुछ भी नहीं कर सकते।","dep242-2-1-6":"जवान सिंहों को तो घटी होती और वे भूखे भी रह जाते हैं; परन्तु यहोवा के खोजियों को किसी भली वस्तु की घटी न होगी।","dep242-2-1-7":"प्रातःकाल को अपनी करुणा की बात मुझे सुना, क्योंकि मैंने तुझी पर भरोसा रखा है। जिस मार्ग पर मुझे चलना है, वह मुझ को बता दे, क्योंकि मैं अपना मन तेरी ही ओर लगाता हूँ। मुझ को यह सिखा, कि मैं तेरी इच्छा कैसे पूरी करूँ, क्योंकि मेरा परमेश्‍वर तू ही है! तेरी भली आत्मा मुझ को धर्म के मार्ग में ले चले!","dep242-2-1-8":"मैं अपने पहरे पर खड़ा रहूँगा, और गुम्मट पर चढ़कर ठहरा रहूँगा, और ताकता रहूँगा कि मुझसे वह क्या कहेगा? मैं अपने दिए हुए उलाहने के विषय में क्या उत्तर दूँ?","dep242-2-2-1":"हे मेरे प्राण तू क्यों गिरा जाता है? तू अन्दर ही अन्दर क्यों व्याकुल है? परमेश्‍वर पर भरोसा रख; क्योंकि वह मेरे मुख की चमक और मेरा परमेश्‍वर है, मैं फिर उसका धन्यवाद करूँगा।","dep242-2-2-2":"और विश्वास के कर्ता और सिद्ध करनेवाले यीशु की ओर ताकते रहें; जिस ने उस आनन्द के लिये जो उसके आगे धरा था, लज्जा की कुछ चिन्ता न करके, क्रूस का दुःख सहा; और सिंहासन पर परमेश्‍वर के दाहिने जा बैठा।","dep242-2-2-3":"मैं यहोवा की बाट जोहता हूँ, मैं जी से उसकी बाट जोहता हूँ, और मेरी आशा उसके वचन पर है; पहरूए जितना भोर को चाहते हैं, हाँ, पहरूए जितना भोर को चाहते हैं, उससे भी अधिक मैं यहोवा को अपने प्राणों से चाहता हूँ।","dep242-2-2-4":"जैसे हिरनी नदी के जल के लिये हाँफती है, वैसे ही, हे परमेश्‍वर, मैं तेरे लिये हाँफता हूँ।","dep242-2-2-5":"अपना बोझ यहोवा पर डाल दे वह तुझे सम्भालेगा; वह धर्मी को कभी टलने न देगा।","dep242-2-2-6":"धन्य है प्रभु, जो प्रतिदिन हमारा बोझ उठाता है; वही हमारा उद्धारकर्ता परमेश्‍वर है। (सेला)","dep242-2-2-7":"हे यहोवा, तू मेरा शरणस्थान ठहरा है। तूने जो परमप्रधान को अपना धाम मान लिया है, इसलिए कोई विपत्ति तुझ पर न पड़ेगी, न कोई दुःख तेरे डेरे के निकट आएगा।।","dep242-2-2-8":"“हे सब परिश्रम करनेवालों और बोझ से दबे लोगों, मेरे पास आओ; मैं तुम्हें विश्राम दूँगा। मेरा जूआ अपने ऊपर उठा लो; और मुझसे सीखो; क्योंकि मैं नम्र और मन में दीन हूँ: और तुम अपने मन में विश्राम पाओगे।","dep242-2-2-9":"मैंने पौ फटने से पहले दुहाई दी; मेरी आशा तेरे वचनों पर थी। मेरी आँखें रात के एक-एक पहर से पहले खुल गईं, कि मैं तेरे वचन पर ध्यान करूँ।","dep242-2-2-10":"हे यहोवा, भोर को मेरी वाणी तुझे सुनाई देगी, मैं भोर को प्रार्थना करके तेरी बाट जोहूँगा।","dep242-2-2-11":"आओ हम झुककर दण्डवत् करें, और अपने कर्ता यहोवा के सामने घुटने टेकें!","dep242-2-2-12":"इसलिए हम उसके द्वारा स्तुतिरूपी बलिदान, अर्थात् उन होंठों का फल जो उसके नाम का अंगीकार करते हैं, परमेश्‍वर के लिये सर्वदा चढ़ाया करें।","dep242-2-2-13":"भोर को हमें अपनी करुणा से तृप्त कर, कि हम जीवन भर जयजयकार और आनन्द करते रहें।","dep242-2-2-14":"क्योंकि वह अभिलाषी जीव को सन्तुष्ट करता है, और भूखे को उत्तम पदार्थों से तृप्त करता है।","dep242-2-3-15":"और भोर को दिन निकलने से बहुत पहले, वह उठकर निकला, और एक जंगली स्थान में गया और वहाँ प्रार्थना करने लगा।","dep242-2-3-1":"और यहोवा मूसा से इस प्रकार आमने-सामने बातें करता था, जिस प्रकार कोई अपने भाई से बातें करे। और मूसा तो छावनी में फिर लौट आता था, पर यहोशू नामक एक जवान, जो नून का पुत्र और मूसा का टहलुआ था, वह तम्बू में से न निकलता था।","dep242-2-3-2":"जब दानिय्येल को मालूम हुआ कि उस पत्र पर हस्ताक्षर किया गया है, तब वह अपने घर में गया जिसकी ऊपरी कोठरी की खिड़कियाँ यरूशलेम की ओर खुली रहती थीं, और अपनी रीति के अनुसार जैसा वह दिन में तीन बार अपने परमेश्‍वर के सामने घुटने टेककर प्रार्थना और धन्यवाद करता था, वैसा ही तब भी करता रहा।","dep242-2-3-3":"और बिना दृष्टान्त कहे उनसे कुछ भी नहीं कहता था; परन्तु एकान्त में वह अपने निज चेलों को सब बातों का अर्थ बताता था।","dep242-3-1-1":"क्योंकि कोई भी भविष्यद्वाणी मनुष्य की इच्छा से कभी नहीं हुई पर भक्त जन पवित्र आत्मा के द्वारा उभारे जाकर परमेश्‍वर की ओर से बोलते थे।","dep242-3-1-2":"सम्पूर्ण पवित्रशास्त्र परमेश्‍वर की प्रेरणा से रचा गया है और उपदेश, और समझाने, और सुधारने, और धार्मिकता की शिक्षा के लिये लाभदायक है,","dep242-3-1-3":"आकाश और पृथ्वी टल जाएँगे, परन्तु मेरे शब्‍द कभी न टलेंगी।","dep242-3-1-4":"क्योंकि “हर एक प्राणी घास के समान है, और उसकी सारी शोभा घास के फूल के समान है: घास सूख जाती है, और फूल झड़ जाता है। परन्तु प्रभु का वचन युगानुयुग स्थिर रहता है।” और यह ही सुसमाचार का वचन है जो तुम्हें सुनाया गया था।","dep242-3-1-5":"सत्य के द्वारा उन्हें पवित्र कर: तेरा वचन सत्य है।","dep242-3-1-6":"अब हे प्रभु यहोवा, तू ही परमेश्‍वर है, और तेरे वचन सत्य हैं, और तूने अपने दास को यह भलाई करने का वचन दिया है;","dep242-3-1-7":"यहोवा की यह भी वाणी है कि क्या मेरा वचन आग सा नहीं है? फिर क्या वह ऐसा हथौड़ा नहीं जो पत्थर को फोड़ डाले?","dep242-3-1-8":"जिसके लिये मैं कुकर्मी के समान दुःख उठाता हूँ, यहाँ तक कि कैद भी हूँ; परन्तु परमेश्‍वर का वचन कैद नहीं।","dep242-3-1-9":"यीशु ने उत्तर दिया, “लिखा है, “‘मनुष्य केवल रोटी ही से नहीं, “परन्तु हर एक वचन से जो परमेश्‍वर के मुख से निकलता है जीवित रहेगा।”","dep242-3-1-10":"तब उसने मूसा से और सब भविष्यद्वक्ताओं से आरम्भ करके सारे पवित्रशास्त्रों में से, अपने विषय में की बातों का अर्थ, उन्हें समझा दिया।","dep242-3-2-1":"क्योंकि तुम ने नाशवान नहीं पर अविनाशी बीज से परमेश्‍वर के जीविते और सदा ठहरनेवाले वचन के द्वारा नया जन्म पाया है।","dep242-3-2-2":"उसने अपनी ही इच्छा से हमें सत्य के वचन के द्वारा उत्‍पन्‍न किया, ताकि हम उसकी सृष्टि किए हुए प्राणियों के बीच पहले फल के समान हो।","dep242-3-2-3":"नये जन्मे हुए बच्चों के समान निर्मल आत्मिक दूध की लालसा करो, ताकि उसके द्वारा उद्धार पाने के लिये बढ़ते जाओ,","dep242-3-2-4":"और अब मैं तुम्हें परमेश्‍वर को, और उसके अनुग्रह के वचन को सौंप देता हूँ; जो तुम्हारी उन्नति कर सकता है, और सब पवित्र किये गये लोगों में सहभागी होकर विरासत दे सकता है।","dep242-3-2-5":"तेरा वचन मेरे पाँव के लिये दीपक, और मेरे मार्ग के लिये उजियाला है।","dep242-3-2-6":"वह तेरे चलने में तेरी अगुआई, और सोते समय तेरी रक्षा, और जागते समय तुझे शिक्षा देगी। आज्ञा तो दीपक है और शिक्षा ज्योति, और अनुशासन के लिए दी जानेवाली डाँट जीवन का मार्ग है,","dep242-3-2-7":"वह अपने वचन के द्वारा उनको चंगा करता और जिस गड्ढे में वे पड़े हैं, उससे निकालता है।","dep242-3-2-8":"सूबेदार ने उत्तर दिया, “हे प्रभु, मैं इस योग्य नहीं, कि तू मेरी छत के तले आए, पर केवल मुँह से कह दे तो मेरा सेवक चंगा हो जाएगा।","dep242-3-2-9":"जब तेरे वचन मेरे पास पहुँचे, तब मैंने उन्हें मानो खा लिया, और तेरे वचन मेरे मन के हर्ष और आनन्द का कारण हुए; क्योंकि, हे सेनाओं के परमेश्‍वर यहोवा, मैं तेरा कहलाता हूँ।","dep242-3-2-10":"मैंने तेरी चितौनियों को सदा के लिये अपना निज भाग कर लिया है, क्योंकि वे मेरे हृदय के हर्ष का कारण है।","dep242-3-2-11":"और उद्धार का टोप, और आत्मा की तलवार जो परमेश्‍वर का वचन है, ले लो।","dep242-3-2-12":"क्योंकि परमेश्‍वर का वचन जीवित, प्रबल, और हर एक दोधारी तलवार से भी बहुत तेज है, प्राण, आत्मा को, गाँठ-गाँठ, और गूदे-गूदे को अलग करके, आर-पार छेदता है; और मन की भावनाओं और विचारों को जाँचता है।","dep242-3-3-1":"ये लोग तो थिस्सलुनीके के यहूदियों से भले थे और उन्होंने बड़ी लालसा से वचन ग्रहण किया, और प्रतिदिन पवित्रशास्त्रों में ढूँढ़ते रहे कि ये बातें ऐसी ही हैं कि नहीं।","dep242-3-3-2":"आहा! मैं तेरी व्यवस्था में कैसी प्रीति रखता हूँ! दिन भर मेरा ध्यान उसी पर लगा रहता है।","dep242-3-3-3":"क्योंकि एज्रा ने यहोवा की व्यवस्था का अर्थ जान लेने, और उसके अनुसार चलने, और इस्राएल में विधि और नियम सिखाने के लिये अपना मन लगाया था।","dep242-3-3-4":"उसकी आज्ञा का पालन करने से मैं न हटा, और मैंने उसके वचन अपनी इच्छा से कहीं अधिक काम के जानकर सुरक्षित रखे।","dep242-3-3-5":"शमौन ने उसको उत्तर दिया, “हे स्वामी, हमने सारी रात मेहनत की और कुछ न पकड़ा; तो भी तेरे कहने से जाल डालूँगा।” जब उन्होंने ऐसा किया, तो बहुत मछलियाँ घेर लाए, और उनके जाल फटने लगे।","dep242-3-4-1":"इसलिए विश्वास सुनने से, और सुनना मसीह के वचन से होता है।","dep242-3-4-2":"उसने कहा, “हाँ; परन्तु धन्य वे हैं, जो परमेश्‍वर का वचन सुनते और मानते हैं।”","dep242-3-4-3":"धन्य है वह जो इस भविष्यद्वाणी के वचन को पढ़ता है, और वे जो सुनते हैं और इसमें लिखी हुई बातों को मानते हैं, क्योंकि समय निकट है।","dep242-3-4-4":"और वह उसे अपने पास रखे, और अपने जीवन भर उसको पढ़ा करे, जिससे वह अपने परमेश्‍वर यहोवा का भय मानना, और इस व्यवस्था और इन विधियों की सारी बातों को मानने में चौकसी करना, सीखे;","dep242-3-4-5":"ये लोग तो थिस्सलुनीके के यहूदियों से भले थे और उन्होंने बड़ी लालसा से वचन ग्रहण किया, और प्रतिदिन पवित्रशास्त्रों में ढूँढ़ते रहे कि ये बातें ऐसी ही हैं कि नहीं।","dep242-3-4-6":"अपने आप को परमेश्‍वर का ग्रहणयोग्य और ऐसा काम करनेवाला ठहराने का प्रयत्न कर, जो लज्जित होने न पाए, और जो सत्य के वचन को ठीक रीति से काम में लाता हो।","dep242-3-4-7":"और ये आज्ञाएँ जो मैं आज तुझको सुनाता हूँ वे तेरे मन में बनी रहें","dep242-3-4-8":"हे मेरे पुत्र, मेरी बातों को माना कर, और मेरी आज्ञाओं को अपने मन में रख छोड़। उनको अपनी उँगलियों में बाँध, और अपने हृदय की पटिया पर लिख ले।","dep242-3-4-9":"क्या ही धन्य है वह मनुष्य जो दुष्टों की योजना पर नहीं चलता, और न पापियों के मार्ग में खड़ा होता; और न ठट्ठा करनेवालों की मण्डली में बैठता है! परन्तु वह तो यहोवा की व्यवस्था से प्रसन्‍न रहता; और उसकी व्यवस्था पर रात-दिन ध्यान करता रहता है।","dep242-3-4-10":"व्यवस्था की यह पुस्तक तेरे चित्त से कभी न उतरने पाए, इसी में दिन-रात ध्यान दिए रहना, इसलिए कि जो कुछ उसमें लिखा है उसके अनुसार करने की तू चौकसी करे; क्योंकि ऐसा ही करने से तेरे सब काम सफल होंगे, और तू प्रभावशाली होगा।","dep242-4-1-1":"निरन्तर प्रार्थना में लगे रहो।","dep242-4-1-2":"प्रार्थना में लगे रहो, और धन्यवाद के साथ उसमें जागृत रहो;","dep242-4-1-3":"सब बातों का अन्त तुरन्त होनेवाला है; इसलिए संयमी होकर प्रार्थना के लिये सचेत रहो।","dep242-4-1-4":"अब मैं सबसे पहले यह आग्रह करता हूँ, कि विनती, प्रार्थना, निवेदन, धन्यवाद, सब मनुष्यों के लिये किए जाएँ। राजाओं और सब ऊँचे पदवालों के निमित्त इसलिए कि हम विश्राम और चैन के साथ सारी भक्ति और गरिमा में जीवन बिताएँ।","dep242-4-2-1":"और जो कुछ तुम मेरे नाम से माँगोगे, वही मैं करूँगा कि पुत्र के द्वारा पिता की महिमा हो। यदि तुम मुझसे मेरे नाम से कुछ माँगोगे, तो मैं उसे करूँगा।","dep242-4-2-2":"अब जो ऐसा सामर्थी है, कि हमारी विनती और समझ से कहीं अधिक काम कर सकता है, उस सामर्थ्य के अनुसार जो हम में कार्य करता है,","dep242-4-2-3":"मुझसे प्रार्थना कर और मैं तेरी सुनकर तुझे बड़ी-बड़ी और कठिन बातें बताऊँगा जिन्हें तू अभी नहीं समझता।","dep242-4-2-4":"पर यदि तुम में से किसी को बुद्धि की घटी हो, तो परमेश्‍वर से माँगो, जो बिना उलाहना दिए सब को उदारता से देता है; और उसको दी जाएगी।","dep242-4-2-5":"मैं यहोवा के पास गया, तब उसने मेरी सुन ली, और मुझे पूरी रीति से निर्भय किया।","dep242-4-2-6":"और संकट के दिन मुझे पुकार; मैं तुझे छुड़ाऊँगा, और तू मेरी महिमा करने पाएगा।”","dep242-4-2-7":"जब वे प्रार्थना कर चुके, तो वह स्थान जहाँ वे इकट्ठे थे हिल गया, और वे सब पवित्र आत्मा से परिपूर्ण हो गए, और परमेश्‍वर का वचन साहस से सुनाते रहे।","dep242-4-2-8":"और इसके साथ ही साथ हमारे लिये भी प्रार्थना करते रहो, कि परमेश्‍वर हमारे लिये वचन सुनाने का ऐसा द्वार खोल दे, कि हम मसीह के उस भेद का वर्णन कर सकें जिसके कारण मैं कैद में हूँ।","dep242-4-3-1":"अब तक तुम ने मेरे नाम से कुछ नहीं माँगा; माँगो तो पाओगे ताकि तुम्हारा आनन्द पूरा हो जाए।।","dep242-4-3-2":"और जो कुछ तुम प्रार्थना में विश्वास से माँगोगे वह सब तुम को मिलेगा।”","dep242-4-3-3":"और हर समय और हर प्रकार से आत्मा में प्रार्थना, और विनती करते रहो, और जागते रहो कि सब पवित्र लोगों के लिये लगातार विनती किया करो,","dep242-4-3-4":"और हमें उसके सामने जो साहस होता है, वह यह है; कि यदि हम उसकी इच्छा के अनुसार कुछ माँगते हैं, तो हमारी सुनता है। और जब हम जानते हैं, कि जो कुछ हम माँगते हैं वह हमारी सुनता है, तो यह भी जानते हैं, कि जो कुछ हमने उससे माँगा, वह पाया है।","dep242-4-3-5":"यदि मैं मन में अनर्थ की बात सोचता, तो प्रभु मेरी न सुनता।","dep242-4-3-6":"और जो कुछ हम माँगते हैं, वह हमें उससे मिलता है; क्योंकि हम उसकी आज्ञाओं को मानते हैं; और जो उसे भाता है वही करते हैं।","dep242-4-3-7":"फिर मैं तुम से कहता हूँ, यदि तुम में से दो जन पृथ्वी पर किसी बात के लिये जिसे वे माँगें, एक मन के हों, तो वह मेरे पिता की ओर से जो स्वर्ग में है उनके लिये हो जाएगी।","dep242-4-3-8":"“माँगो, तो तुम्हें दिया जाएगा; ढूँढ़ो, तो तुम पाओगे; खटखटाओ, तो तुम्हारे लिये खोला जाएगा।","dep242-4-3-9":"तब उस समय तुम मुझको पुकारोगे और आकर मुझसे प्रार्थना करोगे और मैं तुम्हारी सुनूँगा। तुम मुझे ढूँढ़ोगे और पाओगे भी; क्योंकि तुम अपने सम्पूर्ण मन से मेरे पास आओगे।","dep242-4-3-10":"परन्तु यदि तुम मेरी ओर फिरो, और मेरी आज्ञाएँ मानो, और उन पर चलो, तो चाहे तुम में से निकाले हुए लोग आकाश की छोर में भी हों, तो भी मैं उनको वहाँ से इकट्ठा करके उस स्थान में पहुँचाऊँगा, जिसे मैंने अपने नाम के निवास के लिये चुन लिया है।","dep242-4-4-1":"जब दानिय्येल को मालूम हुआ कि उस पत्र पर हस्ताक्षर किया गया है, तब वह अपने घर में गया जिसकी ऊपरी कोठरी की खिड़कियाँ यरूशलेम की ओर खुली रहती थीं, और अपनी रीति के अनुसार जैसा वह दिन में तीन बार अपने परमेश्‍वर के सामने घुटने टेककर प्रार्थना और धन्यवाद करता था, वैसा ही तब भी करता रहा।","dep242-4-4-2":"परन्तु उसकी चर्चा और भी फैलती गई, और बड़ी भीड़ उसकी सुनने के लिये और अपनी बीमारियों से चंगे होने के लिये इकट्ठी हुई। परन्तु वह निर्जन स्थानों में अलग जाकर प्रार्थना किया करता था।","dep242-4-4-3":"और उन दिनों में वह पहाड़ पर प्रार्थना करने को निकला, और परमेश्‍वर से प्रार्थना करने में सारी रात बिताई।","dep242-4-4-4":"एलिय्याह भी तो हमारे समान दुःख-सुख भोगी मनुष्य था; और उसने गिड़गिड़ाकर प्रार्थना की; कि बारिश न बरसे; और साढ़े तीन वर्ष तक भूमि पर बारिश नहीं बरसा। फिर उसने प्रार्थना की, तो आकाश से वर्षा हुई, और भूमि फलवन्त हुई।","dep242-4-4-5":"आधी रात के लगभग पौलुस और सीलास प्रार्थना करते हुए परमेश्‍वर के भजन गा रहे थे, और कैदी उनकी सुन रहे थे।","dep242-4-5-1":"हे यहोवा! महिमा, पराक्रम, शोभा, सामर्थ्य और वैभव, तेरा ही है; क्योंकि आकाश और पृथ्वी में जो कुछ है, वह तेरा ही है; हे यहोवा! राज्य तेरा है, और तू सभी के ऊपर मुख्य और महान ठहरा है। इसलिए अब हे हमारे परमेश्‍वर! हम तेरा धन्यवाद और तेरे महिमायुक्त नाम की स्तुति करते हैं।","dep242-4-5-2":"अब मैं सबसे पहले यह आग्रह करता हूँ, कि विनती, प्रार्थना, निवेदन, धन्यवाद, सब मनुष्यों के लिये किए जाएँ। राजाओं और सब ऊँचे पदवालों के निमित्त इसलिए कि हम विश्राम और चैन के साथ सारी भक्ति और गरिमा में जीवन बिताएँ।","dep242-4-5-3":"हर बात में धन्यवाद करो: क्योंकि तुम्हारे लिये मसीह यीशु में परमेश्‍वर की यहीं इच्छा है।","dep242-4-5-4":"यदि हम अपने पापों को मान लें, तो वह हमारे पापों को क्षमा करने, और हमें सब अधर्म से शुद्ध करने में विश्वासयोग्य और धर्मी है।","dep242-4-5-5":"किसी भी बात की चिन्ता मत करो; परन्तु हर एक बात में तुम्हारे निवेदन, प्रार्थना और विनती के द्वारा धन्यवाद के साथ परमेश्‍वर के सम्मुख उपस्थित किए जाएँ। तब परमेश्‍वर की शान्ति, जो सारी समझ से बिलकुल परे है, तुम्हारे हृदय और तुम्हारे विचारों को मसीह यीशु में सुरक्षित रखेगी।","dep242-5-1-1":"पर अब मसीह यीशु में तुम जो पहले दूर थे, मसीह के लहू के द्वारा निकट हो गए हो।","dep242-5-1-2":"और उसके क्रूस पर बहे हुए लहू के द्वारा मेल-मिलाप करके, सब वस्तुओं को उसी के द्वारा से अपने साथ मेल कर ले चाहे वे पृथ्वी पर की हों, चाहे स्वर्ग की।","dep242-5-1-3":"जो कुछ हमने देखा और सुना है उसका समाचार तुम्हें भी देते हैं, इसलिए कि तुम भी हमारे साथ सहभागी हो; और हमारी यह सहभागिता पिता के साथ, और उसके पुत्र यीशु मसीह के साथ है।","dep242-5-1-4":"प्रभु यीशु मसीह का अनुग्रह और परमेश्‍वर का प्रेम और पवित्र आत्मा की सहभागिता तुम सब के साथ होती रहे।","dep242-5-2-1":"क्योंकि जहाँ दो या तीन मेरे नाम पर इकट्ठे होते हैं वहाँ मैं उनके बीच में होता हूँ।”","dep242-5-2-2":"देखो, यह क्या ही भली और मनोहर बात है कि भाई लोग आपस में मिले रहें! वह हेर्मोन की उस ओस के समान है, जो सिय्योन के पहाड़ों पर गिरती है! यहोवा ने तो वहीं सदा के जीवन की आशीष ठहराई है।","dep242-5-2-3":"वरन् जिस दिन तक आज का दिन कहा जाता है, हर दिन एक दूसरे को समझाते रहो, ऐसा न हो, कि तुम में से कोई जन पाप के छल में आकर कठोर हो जाए।","dep242-5-2-4":"एक से दो अच्छे हैं, क्योंकि उनके परिश्रम का अच्छा फल मिलता है। क्योंकि यदि उनमें से एक गिरे, तो दूसरा उसको उठाएगा; परन्तु हाय उस पर जो अकेला होकर गिरे और उसका कोई उठानेवाला न हो।","dep242-5-2-5":"जवानी की अभिलाषाओं से भाग; और जो शुद्ध मन से प्रभु का नाम लेते हैं, उनके साथ धार्मिकता, और विश्वास, और प्रेम, और मेल-मिलाप का पीछा कर।","dep242-5-2-6":"जैसे लोहा लोहे को चमका देता है, वैसे ही मनुष्य का मुख अपने मित्र की संगति से चमकदार हो जाता है। जैसे जल में मुख की परछाई मुख को प्रगट करती है, वैसे ही मनुष्य का मन मनुष्य को प्रगट करती है।","dep242-5-2-7":"बुद्धिमानों की संगति कर, तब तू भी बुद्धिमान हो जाएगा, परन्तु मूर्खों का साथी नाश हो जाएगा।","dep242-5-2-8":"जब तक कि हम सब के सब विश्वास, और परमेश्‍वर के पुत्र की पहचान में एक न हो जाएँ, और एक सिद्ध मनुष्य न बन जाएँ और मसीह के पूरे डील-डौल तक न बढ़ जाएँ।","dep242-5-2-9":"और वे प्रेरितों से शिक्षा पाने, और संगति रखने में और रोटी तोड़ने में और प्रार्थना करने में लौलीन रहे। और परमेश्‍वर की स्तुति करते थे, और सब लोग उनसे प्रसन्‍न थे; और जो उद्धार पाते थे, उनको प्रभु प्रतिदिन उनमें मिला देता था।","dep242-5-3-1":"इसलिए कि तुम पहले दिन से लेकर आज तक सुसमाचार के फैलाने में मेरे सहभागी रहे हो। केवल इतना करो कि तुम्हारा चाल-चलन मसीह के सुसमाचार के योग्य हो कि चाहे मैं आकर तुम्हें देखूँ, चाहे न भी आऊँ, तुम्हारे विषय में यह सुनूँ कि तुम एक ही आत्मा में स्थिर हो, और एक चित्त होकर सुसमाचार के विश्वास के लिये परिश्रम करते रहते हो।","dep242-5-3-2":"और प्रेम, और भले कामों में उस्काने के लिये एक दूसरे की चिन्ता किया करें। और एक दूसरे के साथ इकट्ठा होना न छोड़ें, जैसे कि कितनों की रीति है, पर एक दूसरे को समझाते रहें; और ज्यों-ज्यों उस दिन को निकट आते देखो, त्यों-त्यों और भी अधिक यह किया करो।","dep242-5-3-3":"और उनके विषय में मेरी यह गवाही है, कि उन्होंने अपनी सामर्थ्य भर वरन् सामर्थ्य से भी बाहर मन से दिया। और इस दान में और पवित्र लोगों की सेवा में भागी होने के अनुग्रह के विषय में हम से बार-बार बहुत विनती की।","dep242-5-3-4":"पर जैसे-जैसे मसीह के दुःखों में सहभागी होते हो, आनन्द करो, जिससे उसकी महिमा के प्रगट होते समय भी तुम आनन्दित और मगन हो।","dep242-5-3-5":"तुम एक दूसरे के भार उठाओ, और इस प्रकार मसीह की व्यवस्था को पूरी करो।","dep242-5-4-1":"अतः यदि मसीह में कुछ प्रोत्साहन और प्रेम से ढाढ़स और आत्मा की सहभागिता, और कुछ करुणा और दया हो, तो मेरा यह आनन्द पूरा करो कि एक मन रहो और एक ही प्रेम, एक ही चित्त, और एक ही मनसा रखो।","dep242-5-4-2":"स्वार्थ या मिथ्यागर्व के लिये कुछ न करो, पर दीनता से एक दूसरे को अपने से अच्छा समझो। हर एक अपनी ही हित की नहीं, वरन् दूसरों के हित की भी चिन्ता करे।","dep242-5-4-3":"तुम्हारे लिये हमारे मन में कुछ संकोच नहीं, पर तुम्हारे ही मनों में संकोच है। तुम्हारे लिये हमारे मन में कुछ संकोच नहीं, पर तुम्हारे ही मनों में संकोच है।","dep242-5-4-4":"और मसीह के भय से एक दूसरे के अधीन रहो।","dep242-5-4-5":"वे चुप रहे क्योंकि, मार्ग में उन्होंने आपस में यह वाद-विवाद किया था, कि हम में से बड़ा कौन है? तब उसने बैठकर बारहों को बुलाया, और उनसे कहा, “यदि कोई बड़ा होना चाहे, तो सबसे छोटा और सब का सेवक बने।”","dep242-5-4-6":"और ध्यान से देखते रहो, ऐसा न हो, कि कोई परमेश्‍वर के अनुग्रह से वंचित रह जाए, या कोई कड़वी जड़ फूटकर कष्ट दे, और उसके द्वारा बहुत से लोग अशुद्ध हो जाएँ।","dep242-5-4-7":"और अंधकार के निष्फल कामों में सहभागी ोंकि परमेश्‍वर का वचन जीवित, प्रबल, और हर एक दोधारी तलवार से भी बहुत तेज है, प्राण, आत्मा को, गाँठ-गाँठ, और गूदे-गूदे को अलग करके, आर-पार छेदता है; और मन की भावनाओं और विचारों को जाँचता है।","dep242-6-3-7":"उसी प्रकार से मेरा वचन भी होगा जो मेरे मुख से निकलता है; वह व्यर्थ ठहरकर मेरे पास न लौटेगा, परन्तु, जो मेरी इच्छा है उसे वह पूरा करेगा, और जिस काम के लिये मैंने उसको भेजा है उसे वह सफल करेगा।","dep242-6-3-8":"परन्तु हम तो उस क्रूस पर चढ़ाए हुए मसीह का प्रचार करते हैं जो यहूदियों के निकट ठोकर का कारण, और अन्यजातियों के निकट मूर्खता है; परन्तु जो बुलाए हुए हैं क्या यहूदी, क्या यूनानी, उनके निकट मसीह परमेश्‍वर की सामर्थ्य, और परमेश्‍वर का ज्ञान है।","dep242-6-3-9":"क्योंकि हमारा सुसमाचार तुम्हारे पास न केवल वचन मात्र ही में वरन् सामर्थ्य और पवित्र आत्मा, और बड़े निश्चय के साथ पहुँचा है; जैसा तुम जानते हो, कि हम तुम्हारे लिये तुम में कैसे बन गए थे।","dep242-6-3-10":"कि यदि तू अपने मुँह से यीशु को प्रभु जानकर अंगीकार करे और अपने मन से विश्वास करे, कि परमेश्‍वर ने उसे मरे हुओं में से जिलाया, तो तू निश्चय उद्धार पाएगा। क्योंकि धार्मिकता के लिये मन से विश्वास किया जाता है, और उद्धार के लिये मुँह से अंगीकार किया जाता है।","dep242-6-3-11":"क्योंकि वह तो कहता है, “अपनी प्रसन्नता के समय मैंने तेरी सुन ली, और उद्धार के दिन मैंने तेरी, सहायता की।” देखो; अभी प्रसन्नता का समय है; देखो, अभी उद्धार का दिन है।","dep242-6-3-12":"अपने आप को परखो, कि विश्वास में हो कि नहीं; अपने आप को जाँचो, क्या तुम अपने विषय में यह नहीं जानते, कि यीशु मसीह तुम में है? नहीं तो तुम निकम्मे निकले हो।","dep242-6-3-13":"और पौलुस अपनी रीति के अनुसार उनके पास गया, और तीन सब्त के दिन पवित्रशास्त्रों से उनके साथ वाद-विवाद किया; और उनका अर्थ खोल-खोलकर समझाता था कि मसीह का दुःख उठाना, और मरे हुओं में से जी उठना, अवश्य था; “यही यीशु जिसकी मैं तुम्हें कथा सुनाता हूँ, मसीह है।”","dep242-6-4-1":"परन्तु मैं अपने प्राण को कुछ नहीं समझता कि उसे प्रिय जानूँ, वरन् यह कि मैं अपनी दौड़ को, और उस सेवा को पूरी करूँ, जो मैंने परमेश्‍वर के अनुग्रह के सुसमाचार पर गवाही देने के लिये प्रभु यीशु से पाई है।","dep242-6-4-2":"तब पवित्र आत्मा ने फिलिप्पुस से कहा, “निकट जाकर इस रथ के साथ हो ले।” फिलिप्पुस उसकी ओर दौड़ा और उसे यशायाह भविष्यद्वक्ता की पुस्तक पढ़ते हुए सुना, और पूछा, “तू जो पढ़ रहा है क्या उसे समझता भी है?”","dep242-6-4-3":"क्योंकि यह तो हम से हो नहीं सकता, कि जो हमने देखा और सुना है, वह न कहें।”","dep242-6-5-1":"तब परमेश्‍वर ने मनुष्य को अपने स्वरूप के अनुसार उत्‍पन्‍न किया, अपने ही स्वरूप के अनुसार परमेश्‍वर ने उसको उत्‍पन्‍न किया; नर और नारी करके उसने मनुष्यों की सृष्टि की।","dep242-6-5-2":"सुनो, यहोवा का हाथ ऐसा छोटा नहीं हो गया कि उद्धार न कर सके, न वह ऐसा बहरा हो गया है कि सुन न सके; परन्तु तुम्हारे अधर्म के कामों ने तुमको तुम्हारे परमेश्‍वर से अलग कर दिया है, और तुम्हारे पापों के कारण उसका मुँह तुम से ऐसा छिपा है कि वह नहीं सुनता।","dep242-6-5-3":"इसलिए जैसा एक मनुष्य के द्वारा पाप जगत में आया, और पाप के द्वारा मृत्यु आई, और इस रीति से मृत्यु सब मनुष्यों में फैल गई, क्योंकि सब ने पाप किया।","dep242-6-5-4":"इसलिए कि सब ने पाप किया है और परमेश्‍वर की महिमा से रहित है,","dep242-6-5-5":"और जैसे मनुष्यों के लिये एक बार मरना और उसके बाद न्याय का होना नियुक्त है।","dep242-6-5-6":"और जो परमेश्‍वर को नहीं पहचानते, और हमारे प्रभु यीशु के सुसमाचार को नहीं मानते उनसे पलटा लेगा। वे प्रभु के सामने से, और उसकी शक्ति के तेज से दूर होकर अनन्त विनाश का दण्ड पाएँगे।","dep242-6-5-7":"क्योंकि पाप की मजदूरी तो मृत्यु है, परन्तु परमेश्‍वर का वरदान हमारे प्रभु मसीह यीशु में अनन्त जीवन है।","dep242-6-5-8":"परन्तु डरपोकों, अविश्वासियों, घिनौनों, हत्यारों, व्यभिचारियों, टोन्हों, मूर्तिपूजकों, और सब झूठों का भाग उस झील में मिलेगा, जो आग और गन्धक से जलती रहती है: यह दूसरी मृत्यु है।”","dep242-6-5-9":"क्योंकि विश्वास के द्वारा अनुग्रह ही से तुम्हारा उद्धार हुआ है, और यह तुम्हारी ओर से नहीं, वरन् परमेश्‍वर का दान है; और न कर्मों के कारण, ऐसा न हो कि कोई घमण्ड करे।","dep242-6-5-10":"मैं परमेश्‍वर के अनुग्रह को व्यर्थ नहीं ठहराता, क्योंकि यदि व्यवस्था के द्वारा धार्मिकता होती, तो मसीह का मरना व्यर्थ होता।","dep242-6-5-11":"और किसी दूसरे के द्वारा उद्धार नहीं; क्योंकि स्वर्ग के नीचे मनुष्यों में और कोई दूसर यक्ति को मसीह में सिद्ध करके उपस्थित करें। और इसी के लिये मैं उसकी उस शक्ति के अनुसार जो मुझ में सामर्थ्य के साथ प्रभाव डालती है तन मन लगाकर परिश्रम भी करता हूँ।","dep242-8-12":"और मैं यह प्रार्थना करता हूँ, कि तुम्हारा प्रेम, ज्ञान और सब प्रकार के विवेक सहित और भी बढ़ता जाए, और उस धार्मिकता के फल से जो यीशु मसीह के द्वारा होते हैं, भरपूर होते जाओ जिससे परमेश्‍वर की महिमा और स्तुति होती रहे।","dep242-8-13":"और जो बातें तूने बहुत गवाहों के सामने मुझसे सुनी हैं, उन्हें विश्वासी मनुष्यों को सौंप दे; जो औरों को भी सिखाने के योग्य हों।","dep242-8-14":"छोटे से छोटा एक हजार हो जाएगा और सबसे दुर्बल एक सामर्थी जाति बन जाएगा। मैं यहोवा हूँ; ठीक समय पर यह सब कुछ शीघ्रता से पूरा करूँगा।","dep242-8-15":"इस कारण जब कि गवाहों का ऐसा बड़ा बादल हमको घेरे हुए है, तो आओ, हर एक रोकनेवाली वस्तु, और उलझानेवाले पाप को दूर करके, वह दौड़ जिसमें हमें दौड़ना है, धीरज से दौड़ें।","dep242-8-16":"देख, यहोवा की दृष्टि सारी पृथ्वी पर इसलिए फिरती रहती है कि जिनका मन उसकी ओर निष्कपट रहता है, उनकी सहायता में वह अपनी सामर्थ्य दिखाए। तूने यह काम मूर्खता से किया है, इसलिए अब से तू लड़ाइयों में फँसा रहेगा।”","dep242-8-17":"क्योंकि पृथ्वी यहोवा की महिमा के ज्ञान से ऐसी भर जाएगी जैसे समुद्र जल से भर जाता है।","dep242-8-18":"क्योंकि उदयाचल से लेकर अस्ताचल तक अन्यजातियों में मेरा नाम महान है, और हर कहीं मेरे नाम पर धूप और शुद्ध भेंट चढ़ाई जाती है; क्योंकि अन्यजातियों में मेरा नाम महान है, सेनाओं के यहोवा का यही वचन है।"}}};

/* 선택 가능한 역본 목록 — '원문'은 암송카드에 원래 입력돼 있던 본문 */
const TRANS_LIST = [
  { id: 'orig', name: '암송카드 원문', short: '원문', refLang: 'ko' },
].concat(TRANS ? TRANS.translations : []);
const DEFAULT_TRANS = TRANS ? 'grg' : 'orig';

const collections = DATA.collections;
const verses = DATA.verses;
const verseById = new Map(verses.map(v => [v.id, v]));

/* ── 참조 표기 ─────────────────────────────────── */
function fmtVerseNums(list, lang) {
  return list.map(seg => {
    let s = String(seg.start);
    if (seg.end) s += '-' + seg.end;
    if (seg.suffix) s += (lang === 'ko' ? seg.suffix : (seg.suffix === '상' ? 'a' : 'b'));
    return s;
  }).join(',');
}
function fmtRef(ref, lang, style) {
  const b = BOOKS[ref.book];
  let name;
  if (!b) name = ref.book;
  else if (lang === 'ko') name = (style === 'abbr' ? b.koAbbr : b.ko);
  else name = b[lang] || b.en;
  return name + ' ' + ref.chapter + ':' + fmtVerseNums(ref.verses, lang);
}

/* 주소 병기: 해당 언어 표기 + 영어 표기 (영어 역본은 하나만) */
function fmtRefDual(ref, lang, style) {
  const main = fmtRef(ref, lang, style);
  const sub = lang === 'en' ? '' : fmtRef(ref, 'en', style);
  return { main: main, sub: sub === main ? '' : sub };
}
function refDualHTML(ref, lang, cls) {
  const d = fmtRefDual(ref, lang);
  return '<span class="' + cls + '">' + esc(d.main) +
    (d.sub ? '<em class="ref-en">' + esc(d.sub) + '</em>' : '') + '</span>';
}

/* ── 본문 텍스트 공급자 ─────────────────────────────
 * 선택된 역본(state.trans)의 본문을 반환.
 * 'orig' = 암송카드 원문(예전 앱에서 입력된 텍스트),
 * 그 외 = 성경 DB에서 추출한 역본 텍스트. */
function getVerseText(v, transId) {
  if (transId === 'orig') return (v.texts && v.texts.ko) || null;
  return (TRANS && TRANS.texts[transId] && TRANS.texts[transId][v.id]) || null;
}
/* 폴백: 선택 역본에 없으면 개역개정 → 원문 순 */
function getVerseTextWithFallback(v, transId) {
  const t = getVerseText(v, transId);
  if (t) return { text: t, fallback: false };
  return { text: getVerseText(v, 'grg') || getVerseText(v, 'orig') || '', fallback: true };
}
function curTrans() {
  return TRANS_LIST.find(t => t.id === state.trans) || TRANS_LIST[0];
}

/* ── 저장소 (localStorage 불가 환경에서도 동작) ──── */
const mem = {};
function loadSet(k) {
  try { const raw = localStorage.getItem('bmc.' + k + '.v1'); return new Set(raw ? JSON.parse(raw) : []); }
  catch (e) { return new Set(mem[k] || []); }
}
function saveSet(k, set) {
  mem[k] = [...set];
  try { localStorage.setItem('bmc.' + k + '.v1', JSON.stringify([...set])); } catch (e) {}
}

/* ── 글자 크기 배율 (사용자 조절, 저장됨) ────────── */
const FS_MIN = 0.7, FS_MAX = 1.6, FS_STEP = 0.1;
function loadFontScale() {
  try {
    const v = parseFloat(localStorage.getItem('bmc.fontScale.v1'));
    if (v >= FS_MIN && v <= FS_MAX) return v;
  } catch (e) {}
  return 1;
}
function applyFontScale(v) {
  document.documentElement.style.setProperty('--fs', v);
  try { localStorage.setItem('bmc.fontScale.v1', String(v)); } catch (e) {}
}

/* ── 상태 ─────────────────────────────────────── */
function loadTrans() {
  try {
    const v = localStorage.getItem('bmc.trans.v1');
    if (v && TRANS_LIST.some(t => t.id === v)) return v;
  } catch (e) {}
  return DEFAULT_TRANS;
}
const state = {
  stack: [{ name: 'home' }],
  trans: loadTrans(),
  fav: loadSet('favorites'),
  done: loadSet('completed'),
  mode: 'card',
  index: 0,
  flipped: false,
  fontScale: loadFontScale(),
};
applyFontScale(state.fontScale);
const cur = () => state.stack[state.stack.length - 1];

function push(s) {
  state.stack.push(s);
  if (s.name === 'verses') { state.mode = 'card'; state.index = s.startIndex || 0; state.flipped = false; }
  pushHistory();   // 안드로이드 뒤로가기가 이전 단계로 오도록 기록을 쌓는다
  render();
}
/* 화면 안의 '이전' 버튼도 브라우저 뒤로가기를 통하게 해서
   앱 상태와 히스토리가 어긋나지 않게 한다. */
function pop() { if (state.stack.length > 1) history.back(); }
function goHome() {
  if (state.stack.length > 1) {
    state.stack = [{ name: 'home' }];
    pushHistory();
    render();
  }
}

const getCollection = id => collections.find(c => c.id === id);

function selectVerses(f) {
  return verses.filter(v =>
    (!f.collectionId || v.collectionId === f.collectionId) &&
    (!f.sectionId || v.sectionId === f.sectionId) &&
    (!f.subsectionId || v.subsectionId === f.subsectionId));
}
function currentVerses() {
  const s = cur();
  if (s.kind === 'favorites') return [...state.fav].map(id => verseById.get(id)).filter(Boolean);
  if (s.kind === 'completed') return [...state.done].map(id => verseById.get(id)).filter(Boolean);
  return selectVerses(s);
}

function cardFooter(v) {
  const col = getCollection(v.collectionId);
  const sec = col.sections.find(s => s.id === v.sectionId);
  const sub = sec && sec.subsections.find(s => s.id === v.subsectionId);
  return {
    code: v.code.replace(/^s/, ''),
    groupName: (sub && sub.name) || (sec && sec.name) || col.shortName,
    color: col.color,
  };
}

/* ── 암송 타이핑 채점 ──────────────────────────────
 * 입력한 본문과 정답을 글자 단위로 맞춰 보고 결과를 표시한다.
 *   · 틀린 글자 / 빠뜨린 글자 / 더 쓴 글자 → 빨간 물결 밑줄
 *   · 띄어쓰기만 다른 곳            → 초록 ✓ 표시 (틀린 것으로 치지 않음)
 *   · 문장부호는 비교에서 제외 (암송에서는 중요하지 않음)
 * 한글 조사·어미가 붙어 있어 어절이 아닌 글자 단위로 비교한다. */
const PUNCT = /[.,!?;:'"()\[\]{}·…「」『』“”‘’\-–—~/\\]/;

function tokenizeForGrade(s) {
  // 유의미한 글자만 남기고, 각 글자 앞의 공백·문장부호를 원래 순서대로 보관
  const out = [];
  let gap = '';
  for (const ch of (s || '')) {
    if (/\s/.test(ch)) { gap += ' '; continue; }
    if (PUNCT.test(ch)) { gap += ch; continue; }
    out.push({ ch: ch, gap: gap.replace(/ {2,}/g, ' '), sp: gap.indexOf(' ') >= 0 });
    gap = '';
  }
  return out;
}

/** 최장 공통 부분수열로 정렬해 편집 연산 목록을 만든다 */
function diffTokens(a, b) {
  const n = a.length, m = b.length;
  const dp = new Int32Array((n + 1) * (m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i * (m + 1) + j] = a[i].ch === b[j].ch
        ? dp[(i + 1) * (m + 1) + (j + 1)] + 1
        : Math.max(dp[(i + 1) * (m + 1) + j], dp[i * (m + 1) + (j + 1)]);
    }
  }
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i].ch === b[j].ch) { ops.push({ t: 'ok', u: a[i], c: b[j] }); i++; j++; }
    else if (dp[(i + 1) * (m + 1) + j] >= dp[i * (m + 1) + (j + 1)]) { ops.push({ t: 'extra', u: a[i] }); i++; }
    else { ops.push({ t: 'miss', c: b[j] }); j++; }
  }
  while (i < n) { ops.push({ t: 'extra', u: a[i] }); i++; }
  while (j < m) { ops.push({ t: 'miss', c: b[j] }); j++; }
  return ops;
}

function gradeHTML(input, answer) {
  const a = tokenizeForGrade(input);
  const b = tokenizeForGrade(answer);
  if (!a.length) return { html: '', ok: 0, total: b.length, spaceOnly: 0, empty: true };
  const ops = diffTokens(a, b);
  let html = '', ok = 0, spaceOnly = 0;
  for (const op of ops) {
    if (op.t === 'ok') {
      ok++;
      const spDiff = op.u.sp !== op.c.sp;
      if (spDiff) spaceOnly++;
      html += esc(op.u.gap) +
        (spDiff ? '<i class="sp-mark">✓</i>' : '') +
        esc(op.u.ch);
    } else if (op.t === 'extra') {
      html += esc(op.u.gap) + '<u class="bad">' + esc(op.u.ch) + '</u>';
    } else {
      html += (op.c.sp ? ' ' : '') + '<u class="bad miss">' + esc(op.c.ch) + '</u>';
    }
  }
  return { html: html, ok: ok, total: b.length, spaceOnly: spaceOnly, empty: false };
}

function progressOf(collectionId) {
  const list = selectVerses({ collectionId: collectionId });
  const done = list.reduce((n, v) => n + (state.done.has(v.id) ? 1 : 0), 0);
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function homeHTML() {

function groupHTML(s) {
  const col = getCollection(s.collectionId);
  const section = s.sectionId ? col.sections.find(x => x.id === s.sectionId) : null;
  let rows = '';
  if (section) {
    // 하위 그룹이 있는 단계에도 그 단계의 '전체 보기'를 제공
    const secCount = selectVerses({ collectionId: col.id, sectionId: section.id }).length;
    rows += '<button class="group-row all-row" data-action="open-verses" data-col="' + col.id +
      '" data-sec="' + section.id + '" data-all="1">' +
      '<span class="group-name">전체 보기</span><span class="group-count">' + secCount + '구절</span>' +
      '<span class="chevron">›</span></button>';
  }
  if (!section) {
    rows += '<button class="group-row all-row" data-action="open-verses" data-col="' + col.id + '">' +
      '<span class="group-name">전체 보기</span><span class="group-count">' + col.verseCount + '구절</span><span class="chevron">›</span></button>';
    rows += col.sections.map(sec => {
      const count = selectVerses({ collectionId: col.id, sectionId: sec.id }).length;
      const hasSubs = sec.subsections && sec.subsections.length;
      return '<button class="group-row" data-action="' + (hasSubs ? 'open-group' : 'open-verses') + '" data-col="' + col.id + '" data-sec="' + sec.id + '">' +
        '<span class="group-badge">' + esc(sec.id.split('-').pop().toUpperCase()) + '</span>' +
        '<span class="group-name">' + esc(sec.name) + '</span>' +
        '<span class="group-count">' + count + '구절</span><span class="chevron">›</span></button>';
    }).join('');
  } else {
    rows += section.subsections.map(sub => {
      const count = selectVerses({ collectionId: col.id, subsectionId: sub.id }).length;
      return '<button class="group-row" data-action="open-verses" data-col="' + col.id + '" data-sec="' + section.id + '" data-sub="' + sub.id + '">' +
        '<span class="group-badge">' + esc(sub.id.split('-').pop()) + '</span>' +

}
