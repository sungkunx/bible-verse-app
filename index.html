す。","tms180-s2-1-6":"柔らかい答は憤りをとどめ、激しい言葉は怒りをひきおこす。","tms180-s2-1-7":"だから、互いに罪を告白し合い、また、いやされるようにお互いのために祈りなさい。義人の祈りは、大いに力があり、効果のあるものである。","tms180-s2-1-8":"だから、�壇に供え物をささげうとする場合、兄弟が自分に対して何かうらみをいだいていることを、そこで思い出したなら、 その供え物を祭壇の前に残しておき、まず行ってその兄弟と和解し、それから帰ってきて、供え物をささげることにしなさい。","tms180-s2-1-9":"愛する兄弟たちよ。このことを知っておきなさい。人はすべて、聞くに早く、語るにおそく、怒るにおそくあるべきである。","tms180-s2-1-10":"事をよく聞かないで答える者は、愚かであって恥をこうむる。","tms180-s2-1-11":"あざける者を責めるな、おそらく彼はあなたを憎むであろう。知恵ある者を責めよ、彼はあなたを愛する。 知恵ある者に教訓を授けよ、彼はますます知恵を得る。正しい者を教えよ、彼は学に進む。","tms180-s2-1-12":"もしあなたの兄弟が罪を犯すなら、行って、彼とふたりだけの所で忠告しなさい。もし聞いてくれたら、あなたの兄弟を得たことになる。","tms180-s2-2-1":"互に情深く、あわれみ深い者となり、神がキリストにあってあなたがたをゆるして下さったように、あなたがたも互にゆるし合いなさい。","tms180-s2-2-2":"互いに忍びあい、もし互に責むべきことがあれば、ゆるし合いなさい。しゅもあなたがたをゆるして下さったのだから、そのように、あなたがたもゆるし合いなさい。","tms180-s2-2-3":"できる限り謙虚で、かつ柔和であり、寛容を示し、愛をもって互に忍びあい、","tms180-s2-2-4":"主の僕たる者は争ってはならない。だれに対しても親切であって、よく教え、よく忍び、 反対する者を柔和な心で教え導くべきである。おそらく神は、彼に悔改めの心を与えて、真理を知らせ、","tms180-s2-2-5":"怒ることがあっても、罪を犯してはならない。憤ったままで、日が暮れるようであってはならない。","tms180-s2-2-6":"しかし今は、いっさいこれらのことを捨て、怒り、憤り、悪意、そしり、口から出る恥ずべき言葉を、捨ててしまいなさい。","tms180-s2-2-7":"気をつけて、神の恵みからもれることのないように、また、苦い根がはえ出て、あなたがたを悩まし、それによって多くの人が汚されることのないようにしなさい。また、","tms180-s2-2-8":"すべての無慈悲、憤り、怒り、騒ぎ、そしり、また、いっさいの悪意を捨て去りなさい。","tms180-s2-2-9":"悪いことをして打ちたたかれ、それを忍んだとしても、なんの手柄になるのか、しかし善を行って苦しみを受け、しかもそれを耐え忍んでいるとすれば、これこそ神によみせられることである。 あなたがたは、実に、そうするようにと召されたのである。","tms180-s2-2-10":"愛する者たちよ、自分で復習をしないで、むしろ、神の怒りに任せなさい。なぜなら、「主が言われる。復習はわたしのすることである。わたし自身が報復する」と書いてあるからである。","tms180-s2-2-11":"憤りはむごく、怒りははげしい、しかしねたみの前には、だれが立ちえよう。","tms180-s2-2-12":"ねたみと党派心とのあるところには、混乱とあらゆる忌むべき行為とがある。","tms180-s2-3-1":"どうか、忍耐と慰めとの神が、あなたがたに、キリスト・イエスにならって互いに同じ思いをいだかせ、 こうして、心を一つにして、声を合わせて、わたしたちの主イエス・キリストの父なる神をあがめさせて下さるように。","tms180-s2-3-2":"さて、兄弟たちよ。わたしたちの主イエス・キリストの名によって、あなたがたに勧める。みな語ることを一つにし、お互の間に分争がないようにし、同じ心、同じ思いになって、堅く結び合ってほしい。","tms180-s2-3-3":"あなたがたの間ではそうであってはならない。かえって、あなたがたの間で偉くなりたいと思う者は、仕える人となり、 あなたがたの間でかしらになりたいと思う者は、僕とならねばならない。","tms180-s2-3-4":"兄弟たちよ。あなたがたが召されたのは、実に、自由を得るためである。ただ、その自由を、肉の働く機会としないで、愛をもって互に仕えなさい。","tms180-s2-3-5":"わたしたちひとりびとりは、隣り人の徳を高めるために、その益を図って彼を喜ばすべきである。","tms180-s2-3-6":"何事も党派心や虚栄からするのでなく、へりくだった心をもって互いに人を自分よりすぐれた者としなさい。 おのおの、自分のことばかりではなく、他人のことも考えなさい。","tms180-s2-3-7":"だから、あなたがたは、今しているように、互に慰め合い、相互の徳を高めなさい。","tms180-s2-3-8":"ふたりはひとりにまさる。彼らはその労苦によって良い報いを得るからである。 すなわち彼らが倒れる時には、そのひとりがその友を助け起す。しかしひとりであって、その倒れる時、これを助け起す者のない者はわざわいである。","tms180-s2-3-9":"また群衆が飼う者のない羊のように弱り果てて、倒れているのをごらんになって、彼らを深くあわれまれた。","tms180-s2-3-10":"喜ぶ者と共に喜び、泣く者と共に泣きなさい。","tms180-s2-3-11":"しかし上からの知恵は、第一に清く、次に平和、寛容、温順であり、あわれみと良い実とに満ち、かたより見ず、偽りがない。","tms180-s2-3-12":"兄弟たちよ、もしもある人が罪過に陥っていることがわかったなら、霊の人であるあなたがたは、柔和な心をもって、その人を正しなさい。それと同時に、もしか自分自身も誘惑に陥ることがありはしないかと、反省しなさい。","tms180-s3-1-1":"いのちと信心とにかかわるすべてのことは、主イエスの神聖な力によって、わたしたちに与えられている。それは、ご自身の栄光と徳とによって、わたしたちを召された方を知る知識によるのである。 また、それらのものによって、尊く、大いなる約束が、わたしたちに与えられている。それは、あなたがたが、世のある欲のために滅びることを免れ、神の性質にあずかる者となるためである。","tms180-s3-1-2":"なぜなら、神の約束はことごとく、彼において「しかり」となったからである。だから、わたしたちは、彼によって「アァメン」と唱えて、神に栄光を帰するのである。","tms180-s3-1-3":"ほむべきかな、わたしたちの主イエス・キリストの父なる神、あわれみ深き父、慰めに満ちたる神。 神は、いかなる患難の中にいる時でもわたしたちを慰めて下さり、また、わたしたち自身も、神に慰めていただくその慰めをもって、あらゆる患難の中にある人々を慰めることができるようにして下さったのである。","tms180-s3-1-4":"だから、植える者も水をそそぐ者も、ともに取るに足りない。大事なのは、成長させて下さる神のみである。 植える者と水をそそぐ者とは一つであって、それぞれの働きに応じて報酬を得るであろう。","tms180-s3-1-5":"このような人は主のおきてをよろこび、昼も夜もそのおきてを思う。 このような人は流れのほとりに植えられた木の／時が来ると実を結び、その葉もしぼまないように、そのなすところは皆栄える。","tms180-s3-1-6":"これらのものがあなたがたに備わって、いよいよ豊かになるならば、わたしたちの主イエス・キリストを知る知識について、あなたがたは、怠る者、実を結ばない者となることはないであろう。","tms180-s3-1-7":"あなたがたをキリストにある永遠の栄光に招き入れて下さったあふるる恵みの神は、しばらくの苦しみの後、あなたがたをいやし、強め、力づけ、不動のものとして下さるであろう。","tms180-s3-1-8":"ところが、主が言われた、「わたしの恵みはあなたに対して十分である。わたしの力は弱いところに完全にあらわれる」。それだから、キリストの力がわたしに宿るように、むしろ、喜んで自分の弱さを誇ろう。","tms180-s3-1-9":"ほむべきかな、わたしたちの主イエス・キリストの父なる神。神はキリストであって、天上で霊のもろもろの祝福をもって、わたしたちを祝福し、","tms180-s3-1-10":"主によって喜びをなせ。主はあなたの心の願いをかなえられる。 あなたの道を主にゆだねよ。主に信頼せよ、主はそれをなしとげ、","tms180-s3-1-11":"わたしの子たちよ。これらのことを書きおくるのは、あなたがたが罪を犯さないようになるためである。もし、罪を犯す者があれば、父のみもとには、わたしたちのための助け主、すなわち、義なるイエス・キリストがおられる。 彼は、わたしたちの罪のための、あがないの供え物である。ただ、わたしたちの罪のためばかりではなく、全世界の罪のためである。","tms180-s3-1-12":"東が西から遠いように、主はわれらのとがをわれらから遠ざけられる。","tms180-s3-2-1":"というのは、神の言は生きていて、力があり、もろ刃のつるぎよりも鋭くて、精神と霊魂と、関節と骨髄とを切り離すまでに刺しとおして、心の思いと志しとを見分けることができる。","tms180-s3-2-2":"天から雨が降り、雪が落ちてまた帰らず、地を潤して物を生えさせ、芽を出させて、種まく者に種を与え、食べる者にかてを与える。 このように、わが口から出る言葉も、むなしくわたしに帰らない。わたしの喜ぶところのことをなし、わたしが命じ送った事を果す。","tms180-s3-2-3":"聖書の預言はすべて、自分勝手に解釈すべきでないことを、まず第一に知るべきである。 なぜなら、預言は決して人間の意志から出たものではなく、人々が聖霊に感じ、神によって語ったものだからである。","tms180-s3-2-4":"これらのことを考えて、わたしたちがまた絶えず神に感謝しているのは、あなたがたがわたしたちの説いた神の言を聞いた時に、それを人間の言葉としてではなく、神の言としてーー事実そのとおりであるがーーうけいれてくれたことである。そして、この神の言は、信じるあなたがたのうちに働いているのである。","tms180-s3-2-5":"わたしはみ言葉を与えられて、それを食べました。み言葉は、わたしに喜びとなり、心の楽しみとなりました。万軍の神、主よ、わたしは、あなたの名をもって／となえられている者です。","tms180-s3-2-6":"わたしは彼のくちびるの命令にそむかず、／その口の言葉をわたしの胸にたくわえた。","tms180-s3-2-7":"ここにいるユダヤ人はテサロニケの者たちよりも素直であって、心から教えを受けいれ、果たしてそのとおりがどうかを知ろうとして、日々聖書を調べていた。","tms180-s3-2-8":"あなたがたは、聖書の中に永遠の命があると思って調べているが、この聖書は、わたしについてあかしをするものである。 しかも、あなたがたは、命を得るためにわたしのもとへこようともしない。","tms180-s3-2-9":"イエスは自分を信じたユダヤ人たちに言われた、「もしわたしの言葉のうちにとどまっておるなら、あなたがたは、ほんとうにわたしの弟子なのである。 また真理を知るであろう。そして真理は、あなたがたに自由を得させるであろう」。","tms180-s3-2-10":"イエスは答えて言われた。「『人はパンだけで生きるものではなく、神の口から出る一つ一つの言葉で生きるものである』と書いてある」。","tms180-s3-2-11":"天地は滅びるであろう。しかしわたしの言葉は滅びることがない。","tms180-s3-2-12":"真理によって彼らを聖別して下さい。あなたの御言は真理であります。","tms180-s3-3-1":"そのことを思って、今しばらくのあいだは、さまざまな試練で悩まねばならないかも知れないが、あなたがたは大いに喜んでいる。 こうして、あなたがたの信仰はためされて、火で精錬されても朽ちるほかない金よりもはるかに尊いことが明らかにされ、イエス・キリストの現れるとき、さんびと栄光とほまれとに変わるであろう。","tms180-s3-3-2":"わたしの兄弟たちよ。あなたがたが、いろいろな試練に会った場合、それをむしろ非常に喜ばしいことと思いなさい。 だから、なんら欠点のない、完全な、でき上がった人となるように、その忍耐力を十分に働かせるがよい。","tms180-s3-3-3":"というのは、彼らと同じく、わたしたちにも福音を伝えられているのである。しかし、その聞いた御言は、彼らには無益であった。それが、聞いた者たちに、信仰によって結びつけつけられなかったからである。","tms180-s3-3-4":"わが義人は、信仰によって生きる。もし信仰を捨てるなら、わたしのたましいはこれを喜ばない」。","tms180-s3-3-5":"その上に、信仰のたてを手に取りなさい。それをもって、悪しき者の放つ火の矢を消すことができるであろう。","tms180-s3-3-6":"しかし、神の人よ。あなたはこれらの事を避けなさい。そして、義と信心と信仰と愛と忍耐と柔和とを追い求めなさい。 信仰の戦いをりっぱに勝ちぬいて、永遠のいのちを獲得しなさい。あなたは、そのために召され、多くの証人の前で、りっぱなあかしをしたのである。","tms180-s3-3-7":"さて、信仰とは、望んでいる事がらを確信し、まだ見ていない事実を確認することである。","tms180-s3-3-8":"したがって、信仰は聞くことによるのであり、聞くことはキリストの言葉から来るのである。","tms180-s3-3-9":"怠ることがなく、信仰と忍耐とをもって約束のものを受け継ぐ人々に見習う者となるようにと願ってやまない。","tms180-s3-3-10":"信仰も、それと同様に、行いを伴わなければ、それは死んだものである。","tms180-s3-3-11":"人の義とされるのは律法の行いによるのではなく、ただキリスト・イエスを信じる信仰によることを認めて、わたしたちもキリスト・イエスを信じたのである。それは、律法の行いによるのではなく、キリストを信じる信仰によって義とされるためである。なぜなら、律法の行いによっては、だれひとり義とされることがないからである。","tms180-s3-3-12":"このように、わたしたちは、信仰によって義とされたのだから、わたしたちの主イエス・キリストにより、神に対して平和を得ている。","tms180-s4-1-1":"しかし感謝すべきことはに、神はわたしたちの主イエス・キリストによって、わたしたちに勝利を賜ったのである。","tms180-s4-1-2":"しかるに、神は感謝すべきかな。神はいつもわたしたちをキリストの凱旋に伴い行き、わたしたちをとおしてキリストを知る知識のかおりを、至る所に放って下さるのである。","tms180-s4-1-3":"わたしたちの戦いの武器は、肉のものではなく、神のためには要塞をも破壊するほどの力があるものである。わたしたちはさまざまな議論を破り、 神の知恵に逆らって立てられたあらゆる障害物を打ちこわし、すべての思いをとりこにしてキリストに服従させ、","tms180-s4-1-4":"最後に言う。主にあって、その偉大な力によって、強くなりなさい。 悪魔の策略に対抗して立ちうるために、神の武具で身を固めなさい。","tms180-s4-1-5":"兄弟たちは、小羊の血と彼らのあかしの言葉とによって、彼にうち勝ち、死に至るまでもそのいのちを惜しまなかった。","tms180-s4-1-6":"そういうわけだから、神に従いなさい。そして、悪魔に立ちむかいなさい。そうすれば、彼はあなたがたから逃げ去るであろう。 神に近づきなさい。そうすれば、神はあなたがたに近づいて下さるであろう。罪人どもよ、手をきよめよ。二心の者どもよ、心を清くせよ。","tms180-s4-1-7":"なぜなら、肉に従う者は肉のことを思い、霊に従う者は霊のことを思うからである。 肉の思いは死であるが、霊の思いは、いのちと平安とである。","tms180-s4-1-8":"あなたがたは、主イエス・キリストを着なさい。肉の欲を満たすことに心を向けてはならない。","tms180-s4-1-9":"子たちよ。あなたがたは神から出た者であって、彼らにうち勝ったのである。あなたがたのうちにいますのは、世にある者よりも大いなる者なのである。","tms180-s4-1-10":"なぜなら、すべて神から生まれた者は、世に勝つからである。そして、わたしたちの信仰こそ、世に勝たしめた勝利の力である。 世に勝つ者はだれか。イエスを神の子と信じる者ではないか。","tms180-s4-1-11":"その心には神のおきてがあり、その歩みはすべることがない。","tms180-s4-1-12":"だから、あなたがたの死ぬべきからだを罪の支配にゆだねて、その欲情に従わせることをせず、 また、あなたがたの肢体の不義の武器として罪にささげてはならない。むしろ、死人の中から生かされた者として、自分自身を神にささげ、自分の肢体を義の武器として神にささげるがよい。","tms180-s4-2-1":"最後に、兄弟たちよ。すべて真実なこと、すべて尊ぶべきこと、すべて正しいこと、すべて純真なこと、すべて愛すべきこと、すべてほまれあること、また徳といわれるもの、称賛に値するものがあれば、それらのものを心にとめなさい。","tms180-s4-2-2":"きよい人には、すべてのものがきよい。しかし、汚れている不信仰な人には、きよいものは一つもなく、その知性も良心も汚れてしまっている。","tms180-s4-2-3":"善人は良い心の倉から良い者を取り出し、悪人は悪い倉から悪い物を取り出す。心からあふれ出ることを、口が語るものである。","tms180-s4-2-4":"油断することなく、あなたの心を守れ、命の泉は、これから流れ出るからである。","tms180-s4-2-5":"目はからだのあかりである。だから、あなたの目が澄んでおれば、全身も明るいだろう。","tms180-s4-2-6":"しかし、わたしはあなたがたに言う。だれでも、情欲をいだいて女を見る者は、心の中ですでに姦淫をしたのである。","tms180-s4-2-7":"神のみこころは、あなたがたが清くなることである。すなわち、不品行を慎み、","tms180-s4-2-8":"食物は腹のため、腹は食物のためである。しかし神は、それもこれも滅ぼすであろう。からだは不品行のためではなく。主のためであり、主はからだのためである。","tms180-s4-2-9":"悪い言葉をいっさい、あなたがたの口から出してはいけない。必要があれば、人の徳を高めるのに役立つような言葉を語って、聞いている者の益になるようにしなさい。","tms180-s4-2-10":"あなたがたに言うが、審判の日には、人はその語る無益な言葉に対して、言い開きをしなければならないであろう。 あなたは、自分の言葉によって正しいとされ、自分の言葉によって罪ありとされるからである」。","tms180-s4-2-11":"あらゆる種類の悪から遠ざかりなさい。","tms180-s4-2-12":"老人をとがめてはいけない。むしろ父親に対するように、話をしてあげなさい。若い男には兄弟に対するように、 年とった女には母に対するように、若い女には、真に純潔な思いをもって、姉妹に対するように、勧告しなさい。","tms180-s4-3-1":"また、祈りのとき、信じて求めるものは、みな与えられるであろう」。","tms180-s4-3-2":"求めよ、そうすれば、与えられるであろう。捜せ、そうすれば、見いだすであろう。門をたたけ、そうすれば、あけてもらえるであろう。す べて求める者は得、捜す者は見いだし、門をたたく者はあけてもらえるからである。","tms180-s4-3-3":"あなたは祈る時には、自分のへやにはいり、戸を閉じて、隠れた所においでになるあなたの父に祈りなさい。すると、隠れた事を見ておられるあなたの父は、報いてくださるであろう。","tms180-s4-3-4":"朝早く、夜の明けるよほど前に、イエスは起きて寂しい所へ出て行き、そこで祈っておられた。","tms180-s4-3-5":"わたしに呼び求めよ、そうすれば、わたしはあなたに答える。そしてあなたの知らない大きな隠されている事を、あなたに示す。","tms180-s4-3-6":"どうか、わたしたちのうちに働く力によって、わたしたちが求めまた思うところのいっさいを、はるかに越えてかなえて下さることができるかたに、","tms180-s4-3-7":"わたしたちが神に対していだいている確信は、こうである。すなわち、わたしたちが何事でも神の御旨に従って願い求めるなら、神はそれを聞きいれて下さるということである。 そして、わたしたちが願い求めることは、なんでも聞きいれて下さるとわかれば、神に願い求めたことはすでにかなえられたことを、知るのである。","tms180-s4-3-8":"絶えず祈りなさい。 すべての事について、感謝しなさい。これが、キリスト・イエスにあって、神をあなたがたに求めておられることである。","tms180-s4-3-9":"また、わたしは、あなたがたのために祈ることをやめて主に罪を犯すことは、けっしてしないであろう。わたしはまた良い、正しい道を、あなたがたに教えるであろう。","tms180-s4-3-10":"そして弟子たちに言われた、「収穫は多いが、働き人が少ない。 だから、収穫の主に願って、その収穫のために働き人を送り出すようにしてもらいなさい」。","tms180-s4-3-11":"だから、わたしたちはイエスによって、さんびのいけにえ、すなわち、彼の御名をたたえるくちびるのみを、たえず神にささげようではないか。","tms180-s4-3-12":"主をほめたたえよ。わが魂よ、主をほめたたえよ。 わたしは生けるかぎりは主をほめたたえ、ながらえる間は、わが神をほめうたおう。","tms180-s5-1-1":"神は彼らに、異邦人の受くべきこの奥義が、いかに栄光に富んだものであるかを、知らせようとされたのである。この奥義は、あなたがたのうちにいますキリストであり、栄光の望みである。 わたしたちはこのキリストを宣べ伝え、知恵をつくしてすべての人を訓戒し、また、すべての人を教えている。それは、彼らがキリストにあって全き者として立つようになるためである。","tms180-s5-1-2":"すなわち、神はキリストにおいて世をご自分に和解させ、その罪過の責任をこれに負わせることをしないで、わたしたちに和解の福音をゆだねられたのである。 神がわたしたちをとおして勧めをなさるのであるから、わたしたちはキリストの使者なのである。そこで、わたしたちはキリストに代わって願う、神の和解を受けなさい。","tms180-s5-1-3":"かえって、わたしたちは神の信任を受けて福音を託されたので、人間に喜ばれるためではなく、わたしたちの心を見分ける神に喜ばれるように、福音を語るのである。","tms180-s5-1-4":"わたしは、すべての人に対して自由であるが、できるだけ多くの人を得るために、自ら進んですべての人の奴隷になった。","tms180-s5-1-5":"あなたがたは、刈入れ時が来るまでには、まだ四か月あると、言っているではないか。しかし、わたしはあなたがたに言う。目をあけて畑を見なさい。はや色づいて刈入れを待っている。","tms180-s5-1-6":"このように、あなたがたを慕わしく思っていたので、ただ神の福音ばかりではなく、自分のいのちまでもあなたがたに与えたいと願ったほどでに、あなたがたを愛したのである。","tms180-s5-1-7":"次のように書いてある、「義人はいない、ひとりもいない。 すべての人は迷い出て、ことごとく無益なものになっている。害を行う者はいない、ひとりもいない。","tms180-s5-1-8":"その時、主は神を認めない者たちや、わたしたちの主イエスの福音に聞き従わない者たちに報復し、 そして、彼らの主のみ顔とその力の栄光から退けられて、永遠の滅びに至る刑罰を受けるであろう。","tms180-s5-1-9":"さらに、わたしたちが罪に死に、義に生きるために、十字架にかかって、わたしたちの罪をご自分の身に負われた。その傷によって、あなたがたは、いやされたのである。","tms180-s5-1-10":"神はわたしたちを救い、聖なる招きをもって召して下さったのであるが、それは、わたしたちのわざによるのではなく、神ご自身の計画に基き、また、永遠の昔にキリスト・イエスにあってわたしたちに賜っていた恵み、","tms180-s5-1-11":"すなわち、自分の口で、イエスは主であると告白し、自分の心で、神が死人の中からイエスをよみがえらせたと信じるなら、あなたは救われる。 なぜなら、人は心に信じて義とされ、口で告白して救われるからである。","tms180-s5-1-12":"わたしは、彼らに永遠の命を与える。だから、彼らはいつまでも滅びることがなく、また、彼らをわたしの手から奪い去る者はない。 わたしの父がわたしに下さったものは、すべてにまさるものである。そしてだれも父のみ手から、それを奪い取ることはできない。","tms180-s5-2-1":"人の道は自分の目には正しく見える、しかし主は人の心をはかられる。","tms180-s5-2-2":"人が全世界をもうけても、自分の命を損したら、なんの得になろうか。","tms180-s5-2-3":"神のみこころを行おうと思う者であれば、だれでも、わたしの語っているこの教が神からのものか、それとも、わたし自身から出たものか、わかるであろう。","tms180-s5-2-5":"互いに誉れを受けながら、ただひとりの神からの誉れを求めようとしないあなたがたは、どうして信じることができようか。","tms180-s5-2-6":"そこでまた、彼は、いつも生きていて彼らのためにとりなしておられるので、彼によって神に来る人人を、いつも救うことができるのである。","tms180-s5-2-7":"あすのことを誇ってはならない、一日のうちに何がおこるかを／知ることができないからだ。","tms180-s5-2-8":"だから、わたしたちひとりびとりは、神に対して自分の言いひらきをすべきである。","tms180-s5-2-9":"あなたがたは、聖書の中に永遠の命があると思って調べているが、この聖書は、わたしについてあかしをするものである。","tms180-s5-2-10":"人が見て自ら正しいとする道でも、その終りはついに死に至る道となるものがある。","tms180-s5-2-11":"それから左にいる人々にも言うであろう、『のろわれた者どもよ、わたしを離れて、悪魔とその使いたちとのために用意されている永遠の火にはいってしまえ。","tms180-s5-2-12":"神の見えない性質、すなわち、神の永遠の力と神性とは、天地創造このかた、被造物において知られていて、明らかに認められるからである。したがって、彼らには弁解の余地がない。","tms180-s5-3-1":"あなたがたのよく知っているとおり、あなたがたの先祖伝来の空疎な生活からあがない出されたのは、金や銀のような朽ちる物によったのではなく、 きずも、しみもない小羊のようなキリストの尊い血によったのである。","tms180-s5-3-2":"しかし、すべてこれらの事は、神から出ている。神はキリストによって、わたしたちをご自分に和解させ、かつ和解の努めをわたしたちに授けて下さった。","tms180-s5-3-3":"わたしたちは、御子にあって、神の豊かな恵みのゆえに、その血によるあがない、すなわち、罪過のゆるしを受けたのである。","tms180-s5-3-4":"なぜなら、あなたがたは律法の下にあるのではなく、恵みの下にあるので、罪に支配されることはないからである。 それでは、どうなのか。律法の下にではなく、恵みの下にあるからといって、わたしたちは罪を犯すべきであろうか。断じてそうではない。","tms180-s5-3-5":"あなたがたはみな、キリスト・イエスにある信仰によって、神の子なのである。","tms180-s5-3-6":"しかし、あなたがたは、選ばれた種族、祭司の国、聖なる国民、神につける民である。それによって、暗やみから驚くべき光を招き入れて下さったかたのみわざを、あなたがたが語り伝えるためである。","tms180-s5-3-7":"神はわたしたちの罪のために、罪を知らないかたを罪とされた。それは、わたしたちが、彼にあって神の義となるためなのである。","tms180-s5-3-8":"あなたがたがキリスト・イエスにあるのは、神によるのである。キリストは神に立てられて、わたしたちの知恵となり、議と聖とあがないとになられたのである。","tms180-s5-3-9":"彼は一つのささげ物によって、きよめられた者たちを永遠に全うされたのである。","tms180-s5-3-10":"彼らは、価なしに、神の恵みにより、キリスト・イエスによるあがないによって義とされるのである。","tms180-s5-3-11":"しかし、わたしたちの国籍は天にある。そこから、救主、主イエス・キリストのこられるのを、わたしたちは待ち望んでいる。","tms180-s5-3-12":"キリストにこそ、満ちみちているいっさいの神の徳が、かたちをとって宿っており、 そしてあなたがたは、キリストにあって、それに満たされているのである。彼はすべての支配と権威とのかしらであり、","dep242-1-1":"あなたがたは、はたして信仰があるかどうか、自分を反省し、自分を吟味するがよい。それとも、イエス・キリストがあなたがたのうちにおられることを、悟らないのか。もし悟らなければ、あなたがたは、にせものとして見捨てられる。","dep242-1-2":"そのあかしとは、神が永遠のいのちをわたしたちに賜り、かつ、そのいのちが御子のうちにあるということである。 御子を持つ者はいのちを持ち、神の御子を持たない者はいのちを持っていない。","dep242-1-3":"よくよくあなたがたに言っておく。信じる者には永遠の命がある。","dep242-1-4":"これらのことをあなたがたに書きおくったのは、神の子の御名を信じるあなたがたに、永遠のいのちを持っていることを、悟らせるためである。","dep242-1-5":"わたしたちは、御子にあって、神の豊かな恵みのゆえに、その血によるあがない、すなわち、罪過のゆるしを受けたのである。","dep242-1-6":"こういうわけで、今やキリスト・イエスにある者は罪に定められることがない。","dep242-1-7":"彼らは、価なしに、神の恵みにより、キリスト・イエスによるあがないによって義とされるのである。","dep242-1-8":"このように、わたしたちは、信仰によって義とされたのだから、わたしたちの主イエス・キリストにより、神に対して平和を得ている。","dep242-1-9":"ほむべきかな、わたしたちの主イエス・キリストの父なる神、神は、その豊かなあわれみにより、イエス・キリストを死人の中からよみがえらせ、それにより、わたしたちを新たに生まれさせて生ける望みをいだかせ、","dep242-1-10":"わたしたちの行った義のわざによってではなく、ただ神のあわれみによって、再生の洗いを受け、聖霊により新たにされて、わたしたちは救われたのである。","dep242-1-11":"すべて神の御霊に導かれている者は、すなわち、神の子である。","dep242-1-12":"あなたがたはみな、キリスト・イエスにある信仰によって、神の子なのである。","dep242-1-13":"しかし、神の御霊があなたがたの内に宿っているなら、あなたがたは肉におるのではなく、霊におるのである。もし、キリストの霊を持たない人がいるなら、その人はキリストのものではない。","dep242-1-14":"わたしは父にお願いしよう。そうすれば、父は別に助け主を送って、いつまでもあなたがたと共におらせて下さるであろう。 それは真理の御霊である。この世はそれを見ようともせず、知ろうともしないで、それを受けることができない。あなたがたはそれを知っている。なぜなら、それはあなたがたと共におり、またあなたがたのうちにいるからである。","dep242-1-15":"高いものも深いものも、その他どんな被造物も、わたしたちの主キリスト・イエスにおける神の愛から、わたしたちを引き離すことはできないのである。","dep242-1-16":"わたしは、彼らに永遠の命を与える。だから、彼らはいつまでも滅びることがなく、また、彼らをわたしの手から奪い去る者はない。 わたしの父がわたしに下さったものは、すべてにまさるものである。そしてだれも父のみ手から、それを奪い取ることはできない。","dep242-1-17":"あなたがたもまた、キリストにあって、真理の言葉、すなわち、あなたがたの救いの福音を聞き、また、彼を信じた結果、約束された聖霊の証印をおされたのである。","dep242-1-18":"あなたがたが新たに生まれたのは、朽ちる種からではなく、朽ちない種から、すなわち、神の変わることのない生ける御言によったのである。","dep242-2-1-1":"それゆえ、主は待っていて、あなたがたに恵を施される。それゆえ、主は立ちあがって、あなたがたをあわれまれる。主は公平の神でいらせられる。すべて主を待ち望む者はさいわいである。","dep242-2-1-2":"神は真実なかたである。あなたがたは神によって召され、御子、わたしたちの主イエス・キリストとの交わりに、はいらせていただいたのである。","dep242-2-1-3":"あなたがたは主にお会いすることのできるうちに、主を尋ねよ。近くおられるうちに呼び求めよ。","dep242-2-1-4":"あなたは仰せられました、「わが顔をたずね求めよ」と。あなたにむかって、わたしの心は言います、「主よ、わたしはみ顔をたずね求めます」と。","dep242-2-1-5":"わたしはぶどうの木、あなたがたはその枝である。もし人がわたしにつながっており、またわたしがその人とつながっておれば、その人は実を豊から結ぶようになる。わたしから離れては、あなたがたは何一つできないからである。","dep242-2-1-6":"若きししは乏しくなって飢えることがある。しかし主を求める者は良き物に欠けることはない。","dep242-2-1-7":"あしたに、あなたのいつくしみを聞かせてください。わたしはあなたに信頼します。わが歩むべき道を教えてください。わが魂はあなたを仰ぎ望みます。 あなたのみむねを行うことを教えてください。あなたはわが神です。恵みふかい、みたまをもって／わたしを平らかな道に導いてください。","dep242-2-1-8":"わたしはわたしの見張所に立ち、物見やぐらに身を置き、望み見て、彼がわたしになんと語られるかを見、またわたしの訴えについて／わたし自らなんと答えたらよかろうかを見よう。","dep242-2-2-1":"わが魂よ、何ゆえうなだれるのか。何ゆえわたしのうちに思いみだれるのか。神を待ち望め。わたしはなおわが助け、わが神なる主をほめたたえるであろう。","dep242-2-2-2":"信仰の導き手であり、またその完成者であるイエスを仰ぎ見つつ、走ろうではないか。彼は、自分の前におかれている喜びのゆえに、恥もいとわないで十字架を忍び、神の御座の右に座するに至ったのである。","dep242-2-2-3":"わたしは主を待ち望みます、わが魂は待ち望みます。そのみ言葉によって、わたしは望みをいだきます。 わが魂は夜回りが暁を待つにまさり、夜回りが暁を待つにまさって主を待ち望みます。","dep242-2-2-4":"神よ、しかが谷川を慕いあえぐように、わが魂もあなたを慕いあえぐ。","dep242-2-2-5":"あなたの荷を主にゆだねよ。主はあなたをささえられる。主は正しい人の動かされるのを決してゆるされない。","dep242-2-2-6":"日々にわれらの荷を負われる主はほむべきかな。神はわれらの救である。〔セラ","dep242-2-2-7":"あなたは主を避け所とし、いと高き者をすまいとしたので、 災はあなたに臨まず、悩みはあなたの天幕に近づくことはない。","dep242-2-2-8":"すべて重荷を負うて苦労している者は、わたしのもとにきなさい。あなたがたを休ませてあげよう。 わたしは柔和で心のへりくだった者であるから、わたしのくびきを負うて、わたしに学びなさい。そうすれば、あなたがたの魂に休みが与えられるであろう。","dep242-2-2-9":"わたしは朝早く起き出て呼ばわります。わたしはみ言葉によって望みをいだくのです。 わが目は夜警の交代する時に先だってさめ、あなたの約束を深く思います。","dep242-2-2-10":"主よ、朝ごとにあなたはわたしの声を聞かれます。わたしは朝ごとにあなたのために／いけにえを備えて待ち望みます。","dep242-2-2-11":"さあ、われらは拝み、ひれ伏し、われらの造り主、主のみ前にひざまずこう。","dep242-2-2-12":"だから、わたしたちはイエスによって、さんびのいけにえ、すなわち、彼の御名をたたえるくちびるのみを、たえず神にささげようではないか。","dep242-2-2-13":"あしたに、あなたのいつくしみをもって／われらを飽き足らせ、世を終るまで喜び楽しませてください。","dep242-2-2-14":"主はかわいた魂を満ち足らせ、飢えた魂を良き物で満たされるからである。","dep242-2-3-15":"朝早く、夜の明けるよほど前に、イエスは起きて寂しい所へ出て行き、そこで祈っておられた。","dep242-2-3-1":"人がその友と語るように、主はモーセと顔を合わせて語られた。こうしてモーセは宿営に帰ったが、その従者なる若者、ヌンの子ヨシュアは幕屋を離れなかった。","dep242-2-3-2":"ダニエルは、その文書の署名されたことを知って家に帰り、二階のへやの、エルサレムに向かって窓の開かれた所で、以前からおこなっていたように、一日に三度ずつ、ひざをかがめて神の前に祈り、かつ感謁�た。","dep242-2-3-3":"譬によらないでは語られなかったが、自分の弟子たちには、ひそかにすべてのことを解き明かされた。","dep242-3-1-1":"なぜなら、預言は決して人間の意志から出たものではなく、人々が聖霊に感じ、神によって語ったものだからである。","dep242-3-1-2":"聖書は、すべて神の霊感を受けて書かれたものであって、人を教え、戒め、正しくし、義に導くのに有益である。","dep242-3-1-3":"天地は滅びるであろう。しかしわたしの言葉は滅びることがない。","dep242-3-1-4":"「人はみな草のごとく、その栄華はみな草の花に似ている。草は枯れ、花は散る。 しかし、主の言葉は、とこしえに残る」。","dep242-3-1-5":"真理によって彼らを聖別して下さい。あなたの御言は真理であります。","dep242-3-1-6":"主なる神よ、あなたは神にましまし、あなたの言葉は真実です。あなたはこの良き事をしもべに約束されました。","dep242-3-1-7":"主は仰せられる、わたしの言葉は火のようではないか。また岩を打ち砕く鎚のようではないか。","dep242-3-1-8":"この福音のために、わたしは悪者のように苦しめられ、ついに鎖につながれるに至った。しかし、神の言はつながれてはいない。","dep242-3-1-9":"イエスは答えて言われた。「『人はパンだけで生きるものではなく、神の口から出る一つ一つの言葉で生きるものである』と書いてある」。","dep242-3-1-10":"こう言って、モーセやすべての預言者からはじめて、聖書全体にわたり、ご自身についてしるしてある事どもを、説きあかされた。","dep242-3-2-1":"あなたがたが新たに生まれたのは、朽ちる種からではなく、朽ちない種から、すなわち、神の変わることのない生ける御言によったのである。","dep242-3-2-2":"父は、わたしたちを、いわば被造物の初穂とするために、真理の言葉によって御旨のままに、生み出して下さったのである。","dep242-3-2-3":"今生まれたばかりの乳飲み子のように、混じりけのない霊の乳を慕い求めなさい。それによっておい育ち、救に入るようになるためである。","dep242-3-2-4":"今わたしは、主とその恵みの言とに、あなたがたをゆだねる。御言には、あなたがたの徳をたて、聖別されたすべての人々と共に、御国をつがせる力がある。","dep242-3-2-5":"あなたのみ言葉はわが足のともしび、わが道の光です。","dep242-3-2-6":"これは、あなたが歩くとき、あなたを導き、あなたが寝るとき、あなたを守り、あなたが目ざめるとき、あなたと語る。 戒めはともしびである、教は光である、教訓の懲らしめは命の道である。","dep242-3-2-7":"そのみ言葉をつかわして、彼らをいやし、彼らを滅びから助け出された。","dep242-3-2-8":"そこで百卒長は答えて言った、「主よ、わたしの屋根の下にあなたをお入れする資格は、わたしにはございません。ただ、あなたの言葉を下さい。そうすれば僕はなおります。","dep242-3-2-9":"わたしはみ言葉を与えられて、それを食べました。み言葉は、わたしに喜びとなり、心の楽しみとなりました。万軍の神、主よ、わたしは、あなたの名をもって／となえられている者です。","dep242-3-2-10":"あなたのあかしはとこしえにわが嗣業です。まことに、そのあかしはわが心の喜びです。","dep242-3-2-11":"また、救いのかぶとをかぶり、御霊の剣、すなわち、神の言を取りなさい。","dep242-3-2-12":"というのは、神の言は生きていて、力があり、もろ刃のつるぎよりも鋭くて、精神と霊魂と、関節と骨髄とを切り離すまでに刺しとおして、心の思いと志しとを見分けることができる。","dep242-3-3-1":"ここにいるユダヤ人はテサロニケの者たちよりも素直であって、心から教えを受けいれ、果たしてそのとおりがどうかを知ろうとして、日々聖書を調べていた。","dep242-3-3-2":"いかにわたしはあなたのおきてを／愛することでしょう。わたしはひねもすこれを深く思います。","dep242-3-3-3":"エズラは心をこめて主の律法を調べ、これを行い、かつイスラエルのうちに定めとおきてとを教えた。","dep242-3-3-4":"わたしは彼のくちびるの命令にそむかず、／その口の言葉をわたしの胸にたくわえた。","dep242-3-4-1":"したがって、信仰は聞くことによるのであり、聞くことはキリストの言葉から来るのである。","dep242-3-4-2":"しかしイエスは言われた、「いや、めぐまれているのは、むしろ、神の言を聞いてそれを守る人たちである」。","dep242-3-4-3":"この預言の言葉を朗読する者と、これを聞いて、その中に書かれていることを守る者たちは、さいわいである。時が近づいているからである。","dep242-3-4-4":"世に生きながらえる日の間、常にそれを自分のもとに置いて読み、こうしてその神、主を恐れることを学び、この律法のすべての言葉と、これらの定めとを守って行わなければならない。","dep242-3-4-5":"ここにいるユダヤ人はテサロニケの者たちよりも素直であって、心から教えを受けいれ、果たしてそのとおりがどうかを知ろうとして、日々聖書を調べていた。","dep242-3-4-6":"あなたは真理の言葉を正しく教え、恥じることのない練達した働き人になって、神に自分をささげるように努めはげみなさい。","dep242-3-4-7":"きょう、わたしがあなたに命じるこれらの言葉をあなたの心に留め、","dep242-3-4-8":"わが子よ、わたしの言葉を守り、わたしの戒めをあなたの心にたくわえよ。 これをあなたの指にむすび、これをあなたの心の碑にしるせ。","dep242-3-4-9":"悪しき者のはかりごとに歩まず、罪びとの道に立たず、あざける者の座にすわらぬ人はさいわいである。 このような人は主のおきてをよろこび、昼も夜もそのおきてを思う。","dep242-3-4-10":"この律法の書をあなたの口から離すことなく、昼も夜もそれを思い、そのうちにしるされていることを、ことごとく守って行わなければならない。そうするならば、あなたの道は栄え、あなたは勝利を得るであろう。","dep242-4-1-1":"絶えず祈りなさい。","dep242-4-1-2":"目をさまして、感謝のうちに祈り、ひたすら祈り続けなさい。","dep242-4-1-3":"万物の終わりが近づいている。だから、心を確かにし、身を謹んで、努めて祈りなさい。","dep242-4-1-4":"そこで、まず第一に勧める。すべての人のために、王たちと上に立っているすべての人々のために、願いと、祈りと、とりなしと、感謝とをささげなさい。 それはわたしたちが、安らかで静かな一生を、真に信心深くまた謹厳に過ごすためである。","dep242-4-2-1":"わたしの名によって願うことは、なんでもかなえてあげよう。父が子によって栄光をお受けになるためである。 何事でもわたしの名によって願うならば、わたしはそれをかなえてあげよう。","dep242-4-2-2":"どうか、わたしたちのうちに働く力によって、わたしたちが求めまた思うところのいっさいを、はるかに越えてかなえて下さることができるかたに、","dep242-4-2-3":"わたしに呼び求めよ、そうすれば、わたしはあなたに答える。そしてあなたの知らない大きな隠されている事を、あなたに示す。","dep242-4-2-4":"あなたがたのうち、知恵に不足している者があれば、その人は、とがめもせず惜しみなくすべての人に与える神に、願い求めるがよい。そうすれば、与えられるであろう。","dep242-4-2-5":"わたしが主に求めたとき、主はわたしに答え、すべての恐れからわたしを助け出された。","dep242-4-2-6":"悩みの日にわたしを呼べ、わたしはあなたを助け、あなたはわたしをあがめるであろう」。","dep242-4-2-7":"彼らが祈りを終えると、その集まっていた場所が揺れ動き、一同は聖霊に満たされて、大胆に神の言を語り出した。","dep242-4-2-8":"同時にわたしたちのためにも、神の御言のために門を開いて下さって、わたしたちがキリストの奥義を語れるように（わたしは、実は、そのために獄につながれているのである）、","dep242-4-3-1":"今までは、あなたがたはわたしの名によって求めたことはなかった。求めなさい。そうすれば、与えられるであろう。そして、あなたがたの喜びが満ちあふれるであろう。","dep242-4-3-2":"また、祈りのとき、信じて求めるものは、みな与えられるであろう」。","dep242-4-3-3":"絶えず祈と願いをし、どんな時でも御霊によって祈り、そのために目をさましてうむことがなく、すべての聖徒のために祈りつづけなさい。","dep242-4-3-4":"わたしたちが神に対していだいている確信は、こうである。すなわち、わたしたちが何事でも神の御旨に従って願い求めるなら、神はそれを聞きいれて下さるということである。 そして、わたしたちが願い求めることは、なんでも聞きいれて下さるとわかれば、神に願い求めたことはすでにかなえられたことを、知るのである。","dep242-4-3-5":"もしわたしが心に不義をいだいていたならば、主はお聞きにならないであろう。","dep242-4-3-6":"そして願い求めるものは、なんでもいただけるのである。それは、わたしたちが神の戒めを守り、みこころにかなうことを、行っているからである。","dep242-4-3-7":"また、よく言っておく。もしあなたがたのうちふたりが、どんな願い事についても地上で心を合わせるなら、天にいますわたしの父はそれをかなえて下さるであろう。","dep242-4-3-8":"求めよ、そうすれば、与えられるであろう。捜せ、そうすれば、見いだすであろう。門をたたけ、そうすれば、あけてもらえるであろう。す","dep242-4-3-9":"その時、あなたがたはわたしに呼ばわり、来て、わたしに祈る。わたしはあなたがたの祈を聞く。 あなたがたはわたしを尋ね求めて、わたしに会う。もしあなたがたが一心にわたしを尋ね求めるならば、","dep242-4-3-10":"しかし、あなたがたがわたしに立ち返り、わたしの戒めを守って、これを行うならば、たといあなたがたのうちの散らされた者が、天の果にいても、わたしはそこから彼らを集め、わたしの名を住まわせるために選んだ所に連れて来る』と。","dep242-4-4-1":"ダニエルは、その文書の署名されたことを知って家に帰り、二階のへやの、エルサレムに向かって窓の開かれた所で、以前からおこなっていたように、一日に三度ずつ、ひざをかがめて神の前に祈り、かつ感謁�た。","dep242-4-4-3":"このころ、イエスは祈るために山へ行き、夜を徹して神に祈られた。","dep242-4-4-4":"エリヤは、わたしたちと同じ人間であったが、雨が降らないようにと祈りをささげたところ、三年六ヶ月のあいだ、地上に雨が降らなかった。 それから、ふたたび祈ったところ、天は雨を降らせ、地はその実をみのらせた。","dep242-4-4-5":"真夜中ごろ、パウロとシラスとは、神に祈り、さんびを歌いつづけたが、囚人たちは耳をすまして聞きいっていた。","dep242-4-5-1":"主よ、大いなることと、力と、栄光と、勝利と、威光とはあなたのものです。天にあるもの、地にあるものも皆あなたのものです。主よ、国もまたあなたのものです。あなたは万有のかしらとして、あがめられます。 われわれの神よ、われわれは、いま、あなたに感謝し、あなたの光栄ある名をたたえます。","dep242-4-5-2":"そこで、まず第一に勧める。すべての人のために、王たちと上に立っているすべての人々のために、願いと、祈りと、とりなしと、感謝とをささげなさい。 それはわたしたちが、安らかで静かな一生を、真に信心深くまた謹厳に過ごすためである。","dep242-4-5-3":"すべての事について、感謝しなさい。これが、キリスト・イエスにあって、神をあなたがたに求めておられることである。","dep242-4-5-4":"もし、わたしたちが自分の罪を告白するならば、神は真実で正しいかたであるから、その罪をゆるし、すべての不義からわたしたちをきよめて下さる。","dep242-4-5-5":"何事も思い煩ってはならない。ただ、事ごとに、感謝をもって祈りと願いとをささげ、あなたがたの求めるところを神に申し上げるがよい。 そうすれば、人知ではとうてい測り知ることのできない神の平安が、あなたがたの心と思いとを、キリスト・イエスにあって守るであろう。","dep242-5-1-1":"ところが、あなたがたは、このように以前は遠く離れていたが、今ではキリスト・イエスにあって、キリストの血によって近いものとなったのである。","dep242-5-1-2":"そして、その十字架の血によって平和をつくり、万物、すなわち、地にあるもの、天にあるものを、ことごとく、彼によってご自分と和解させて下さったのである。","dep242-5-1-3":"すなわち、わたしたちが見たもの、聞いたものを、あなたがたにも告げ知らせる。それは、あなたがたも、わたしたちの交わりにあずかるようになるためである。わたしたちの交わりとは、父ならびに御子イエス・キリストとの交わりのことである。","dep242-5-1-4":"主イエス・キリストの恵みと、神の愛と、聖霊の交わりとが、あなたがた一同と共にあるように。","dep242-5-2-1":"ふたりまたは三人が、わたしの名によって集まっている所には、わたしもその中にいるのである。","dep242-5-2-2":"見よ、兄弟が和合して共におるのは／いかに麗しく楽しいことであろう。 またヘルモンの露がシオンの山に下るようだ。これは主がかしこに祝福を命じ、とこしえに命を与えられたからである。","dep242-5-2-3":"あなたがたの中に、罪の惑わしに陥って、心をかたくなにする者がないように、「きょう」といううちに、日々を、互いに励まし合いなさい。","dep242-5-2-4":"ふたりはひとりにまさる。彼らはその労苦によって良い報いを得るからである。 すなわち彼らが倒れる時には、そのひとりがその友を助け起す。しかしひとりであって、その倒れる時、これを助け起す者のない者はわざわいである。","dep242-5-2-5":"そこで、あなたはわかい時の情欲を避けなさい。そして、きよい心をもって主を呼び求める人々と共に、義と信仰と愛と平和とを追い求めなさい。","dep242-5-2-6":"鉄は鉄をとぐ、そのように人はその友の顔をとぐ。 水にうつせば顔と顔とが応じるように、人の心はその人をうつす。","dep242-5-2-7":"知恵ある者とともに歩む者は知恵を得る。愚かな者の友となる者は害をうける。","dep242-5-2-8":"わたしたちすべての者が、神の子を信じる信仰の一致と彼を知る知識の一致とに到達し、全ったき人となり、ついに、キリストの満ちみちた徳の高さにまで至るためである。","dep242-5-2-9":"そして一同はひたすら、使徒たちの教えを守り、信徒の交わりをなし、共にパンをさき、祈りをしていた。 神をさんびし、すべての人に好意を持たれていた。そして主は、救われる者を日々仲間に加えて下さったのである。","dep242-5-3-1":"あなたがたが最初の日から今日に至るまで、福音にあずかっていることを感謝している。 ただ、あなたがたはキリストの福音にふさわしく生活しなさい。そして、わたしが行ってあなたがたに会うにしても、離れているにしても、あなたがたが一つの霊によって堅く立ち、一つ心になって福音の信仰のために力を会わせて戦い、","dep242-5-3-2":"愛と善行とを励むように互に努め、 ある人たちがいつもしているように、集会をやめることはしないで互に励まし、かの日が近づいているのを見て、ますます、そうしようではないか。","dep242-5-3-3":"わたしはあかしするが、彼らは力に応じて、否、力以上に施しをした。すなわち、自ら進んで、 聖徒たちへの奉仕に加わる恵みにあずかりたいと、わたしたちに熱心に願い出て、","dep242-5-3-4":"むしろ、キリストの苦しみにあずかればあずかるほど、喜ぶがよい。それは、キリストの栄光が現れる際に、よろこびにあふれるためである。","dep242-5-3-5":"互に重荷を負い合いなさい。そうすれば、あなたがたはキリストの律法を全うするであろう。","dep242-5-4-1":"そこで、あなたがたに、キリストによる勧め、愛の励まし、御霊の交わり、熱愛とあわれみとが、いくらかてせもあるなら、 どうか同じ思いとなり、同じ愛の心を持ち、心を合わせ、一つ 9":"すなわち、わたしたちが見たもの、聞いたものを、あなたがたにも告げ知らせる。それは、あなたがたも、わたしたちの交わりにあずかるようになるためである。わたしたちの交わりとは、父ならびに御子イエス・キリストとの交わりのことである。","dep242-6-2-10":"賢い者は、大空の輝きのように輝き、また多くの人を義に導く者は、星のようになって永遠にいたるでしょう。","dep242-6-3-1":"イエスは彼らに言われた、「わたしについてきなさい。あなたがたを、人間をとる漁師にしてあげよう」。","dep242-6-3-2":"それは、あなたがたが責められるところのない純真な者となり、曲った邪悪な時代のただ中にあって、傷のない神の子となるためである。あなたがたは、いのちの言葉を堅く持って、彼らの間で星のようにこの世に輝いている。 このようにして、キリストの日に、わたしは自分の走ったことがむだでなく、労したことがむだではなかったと誇ることができる。","dep242-6-3-3":"また、わたしが口を開くときに語るべき言葉を賜り、大胆に福音の奥義を明らかに示しうるように、わたしのためにも祈ってほしい。","dep242-6-3-4":"ただ、心の中でキリストを主とあがめなさい。また、あなたがたのうちにある望みについて説明を求める人には、いつでも弁明のできる用意をしていなさい。","dep242-6-3-5":"さて、この町からきた多くのサマリヤ人は、「この人は、わたしのしたことを何もかも言いあてた」とあかしした女の言葉によって、イエスを信じた。","dep242-6-3-6":"というのは、神の言は生きていて、力があり、もろ刃のつるぎよりも鋭くて、精神と霊魂と、関節と骨髄とを切り離すまでに刺しとおして、心の思いと志しとを見分けることができる。","dep242-6-3-7":"このように、わが口から出る言葉も、むなしくわたしに帰らない。わたしの喜ぶところのことをなし、わたしが命じ送った事を果す。","dep242-6-3-8":"しかしわたしたちは、十字架につけられたキリストを宣べ伝える。このキリストは、ユダヤ人にはつまずかせるもの、異邦人には愚かなものであるか、 召された者自身にとっては、ユダヤ人にもギリシャ人にも、神の力、神の知恵たるキリストなのである。","dep242-6-3-9":"なぜなら、わたしたちの福音があなたがたに伝えられたとき、それは言葉だけによらず、力と聖霊と強い確信とによったからである。わたしたちが、あなたがたの間で、みんなのためにどんなことをしたか、あなたがたの知っているとおりである。","dep242-6-3-10":"すなわち、自分の口で、イエスは主であると告白し、自分の心で、神が死人の中からイエスをよみがえらせたと信じるなら、あなたは救われる。 なぜなら、人は心に信じて義とされ、口で告白して救われるからである。","dep242-6-3-11":"神はこう言われる、「わたしは、恵みの時にあなたがたの願いを聞きいれ、救いの日にあなたを助けた」。見よ、今は恵みの時、見よ、今は救いの日である。","dep242-6-3-12":"あなたがたは、はたして信仰があるかどうか、自分を反省し、自分を吟味するがよい。それとも、イエス・キリストがあなたがたのうちにおられることを、悟らないのか。もし悟らなければ、あなたがたは、にせものとして見捨てられる。","dep242-6-3-13":"パウロは例によって、そのかいどうにはいって行って、三つの安息日にわたり、聖書に基づいて彼らと論じ、 キリストは必ず苦難を受け、そして死人の中からよみがえるべきことを、また「わたしがあなたがたに伝えているこのイエスこそは、キリストである」とのことを、説明もし論証もした。","dep242-6-4-1":"しかし、わたしは自分の行程を走り終え、主イエスから賜った、神のめぐみの福音をあかしする任務を果たし得さえしたら、このいのちは自分にとって、少しも惜しいとは思わない。","dep242-6-4-2":"御霊がピリポに「進み寄って、あの馬車に並んで行きなさい」と言った。 そこでピリポが駆けて行くと、預言者イザヤの書を読んでいるその人の声が聞こえたので、「あなたは、読んでいることが、おわかりですか」と尋ねた。","dep242-6-4-3":"わたしたちとしては、自分の見たこと聞いたことを、語らないわけにはいかない」。","dep242-6-5-1":"神は自分のかたちに人を創造された。すなわち、神のかたちに創造し、男と女とに創造された。","dep242-6-5-2":"見よ、主の手が短くて、救い得ないのではない。その耳が鈍くて聞き得ないのでもない。 ただ、あなたがたの不義が／あなたがたと、あなたがたの神との間を隔てたのだ。またあなたがたの罪が／主の顔をおおったために、お聞きにならないのだ。","dep242-6-5-3":"このようなわけて、ひとりの人によって、罪がこの世にはいり、また罪によって死がはいってきたように、こうして、すべての人が罪を犯したので、死が全人類にはいり込んだのである。","dep242-6-5-4":"すなわち、すべての人は罪を犯したため、神の栄光を受けられなくなっており、","dep242-6-5-5":"そして、一度だけ死ぬことと、死んだ後さばきを受けることが、人間に定まっているように、","dep242-6-5-6":"その時、主は神を認めない者たちや、わたしたちの主イエスの福音に聞き従わない者たちに報復し、 そして、彼らの主のみ顔とその力の栄光から退けられて、永遠の滅びに至る刑罰を受けるであろう。","dep242-6-5-7":"罪の支払う報酬は死である。しかし神の賜物は、わたしたちの主イエス・キリストにおける永遠のいのちである。","dep242-6-5-8":"しかし、おくびょうな者、信じない者、忌むべき者、人殺し、姦淫を行う者、まじないをする者、偶像を拝む者、すべて偽りを言う者には、火と硫黄の燃えている池が、彼らの受くべき報いである。これが第二の死である」。","dep242-6-5-9":"あなたがたの救われたのは、実に、恵みにより、信仰によるのである。それは、あなたがた自身から出たものではなく、神の賜物である。 決して行いによるのではない。それは、だれも誇ることがないためなのである。","dep242-6-5-10":"わたしは、神の恵みを無にはしない。もし、義が律法によって得られるとすれば、キリストの死はむだであったことになる。","dep242-6-5-11":"この人による以外には救いはない。わたしたちを救いうる名は、にれを別にしては、天下のだれにも与えられていないからである」。","dep242-6-5-12":"あなたがたのよく知っているとおり、あなたがたの先祖伝来の空疎な生活からあがない出されたのは、金や銀のような朽ちる物によったのではなく、","dep242-6-5-13":"ユダヤ人はしるしを請い、ギリシャ人は知恵を求める。 しかしわたしたちは、十字架につけられたキリストを宣べ伝える。このキリストは、ユダヤ人にはつまずかせるもの、異邦人には愚かなものであるか、","dep242-6-5-14":"この世は、自分の知恵によって神を認めるに至らなかった。それは、神の知恵にかなっている。そこで神は、宣教の愚かさによって、信じる者を救うこととされたのである。","dep242-6-5-15":"あなたがたは、むなしいだましごとの哲学で、人のとりこにされないように、気をつけなさい。それはキリストに従わず、世のもろもろの霊力に従う人間の言い伝えに基づくものにすぎない。","dep242-6-5-16":"それらの人は、血すじによらず、肉の欲によらず、また、人の欲にもよらず、ただ神によって生まれたのである。","dep242-6-5-17":"肉から生まれる者は肉であり、霊から生まれる者は霊である。 あなたがたは新しく生まれなければからないと、わたしが言ったからとて、不思議に思うには及ばない。","dep242-6-5-18":"人を生かすものは霊であって、肉はなんの役にも立たない。わたしがあなたがたに話した言葉は霊であり、また命である。","dep242-6-5-19":"キリストも、あなたがたを神に近づけようとして、自らは義なるかたであるのに、不義なる人々のために、ひとたび罪のゆえに死なれたのである。ただし、肉においては殺されたが、霊においては生かされたのである。","dep242-6-5-20":"神はそのひとり子を賜ったほどに、この世を愛して下さった。それは御子を信じる者がひとりも滅びないで、永遠の命を得るためである。","dep242-6-5-21":"しかし、まだ罪人であった時、わたしたちのためにキリストが死んで下さったことによって、神はわたしたちに対する愛を示されたのである。","dep242-6-5-22":"わたしが最も大事なこととしてあなたがたに伝えたのは、わたし自身も受けたことであった。すなわちキリストが、聖書に書いてあるとおり、わたしたちの罪のために死んだこと、 そして葬られたこと、聖書に書いてあるとおり、三日目によみがえったこと、","dep242-6-5-23":"あなたがたは、先には罪の中にあり、かつ肉の割礼がないままで死んでいた者であるが、神は、あなたがたをキリストと共に生かし、わたしたちのいっさいの罪をゆるして下さった。","dep242-6-5-24":"よくよくあなたがたに言っておく。わたしの言葉を聞いて、わたしをつかわされたかたを信じる者は、永遠の命を受け、またさばかれることがなく、死から命に移っているのである。","dep242-6-5-25":"しかし、彼を受けいれた者、すなわち、その名を信じた人々には、彼は神の子となる力を与えたのである。","dep242-6-5-26":"見よ、わたしを聞いて戸をあけるなら、わたしはその中にはいって彼と食を共にし、彼もまたわたしと食を共にするであろう。","dep242-6-5-27":"すなわち、自分の口で、イエスは主であると告白し、自分の心で、神が死人の中からイエスをよみがえらせたと信じるなら、あなたは救われる。 なぜなら、人は心に信じて義とされ、口で告白して救われるからである。","dep242-7-1-1":"この言は初めに神と共にあった。 すべてのものは。これによってできた。でたもののうち。一つとしてこれによらないものはなかった。","dep242-7-1-2":"万物は、天にあるものも地にあるものも、見えるものも見えないものも、位も主権も、支配も権威も、みな御子にあって造られたからである。これらいっさいのものは、御子によって造られ、御子のために造られてのである。 彼は万物よりも先にあり、万物は彼にあって成り立っている。","dep242-7-1-3":"そして自らは、そのからだなる教会のかしらである。彼は初めの者であり、死人の中から最初に生まれたかたである。それは、ご自身がすべてのことにおいて第一の者となるためである。","dep242-7-1-4":"彼を、すべての支配、権威、権力、権勢の上におき、また、この世ばかりでなくきたるべき世においても唱えられる、あらゆる名の上におかれたのである。","dep242-7-1-5":"それは、イエスの御名によって、天上のもの、地上のもの、地下のものなど、あらゆるものがひざをかかめ、また、 あらゆる舌が、「イエス・ゃ�ストは主である」と告白して、栄光を父なる神に帰するためである。","dep242-7-1-6":"なぜなら、キリストは、死者と生者との主となるために、死んで生き返られたからである。","dep242-7-1-7":"あなたがたは知らないのか。自分のからだは、神から受けて自分の内に宿っている聖霊の宮であって、あなたがたは、もはや自分自身のものではないのである。 あなたがたは、代価を払って買い取られてのだ。それだから、自分のからだをもって、神の栄光をあらわしなさい。","dep242-7-1-8":"そして、彼がすべての人のために死んだのは、生きている者がもはや自分のためにではなく、自分のために死んでよみがえったかたのために、生きるためである。","dep242-7-2-1":"まず神の国と神の義とを求めなさい。そうすれば、これらのものは、すべて添え与えられるであろう。","dep242-7-2-2":"イエスは言われた、「よく聞いておくがよい。だれでもわたしのために、また福音のために、家、兄弟、姉妹、母、父、子、もしくは畑を捨てた者は、 必ずその百倍を受ける。すなわち、今この時代では家、兄弟、姉妹、母、子および畑を迫害と共に受け、また、きたるべき世では永遠の生命を受ける。","dep242-7-2-3":"言った、「主は言われた、『わたしは自分をさして誓う。あなたがこの事をし、あなたの子、あなたのひとり子をも惜しまなかったので、 わたしは大いにあなたを祝福し、大いにあなたの子孫をふやして、天の星のように、浜べの砂のようにする。あなたの子孫は敵の門を打ち取り、","dep242-7-2-4":"わが子ソロモンよ、あなたの父の神を知り、全き心をもって喜び勇んで彼に仕えなさい。主はすべての心を探り、すべての思いを悟られるからである。あなたがもし彼を求めるならば会うことができる。しかしあなたがもしかれを捨てるならば彼は長くあなたを捨てられるであろう。","dep242-7-2-5":"主の目はあまねく全地を行きめぐり、自分に向かって心を全うする者のために力をあらわされる。今度の事では、あなたは愚かな事をした。ゆえにこの後、あなたに戦争が臨むであろう」。","dep242-7-2-6":"彼はわたしを愛して離れないゆえに、わたしは彼を助けよう。彼はわが名を知るゆえに、わたしは彼を守る。","dep242-7-2-7":"それゆえイスラエルの神、主は仰せられる、『わたしはかつて、「あなたの家とあなたの父の家とは、永久にわたしの前に歩むであろう」と言った』。しかし今、主は仰せられる、『決してそうはしない。わたしを尊ぶ者を、わたしは尊び、わたしを卑しめる者は、軽んぜられるであろう。","dep242-7-3-1":"それから、みんなの者に、言われた、「だれでもわたしについてきたいと思うなら、自分を捨て、日々自分の十字架を負うて、わたしに従ってきなさい。","dep242-7-3-2":"人の道が主を喜ばせる時、主はその人の敵をもその人と和らがせられる。","dep242-7-3-3":"心をつくして主に信頼せよ、自分の知識にたよってはならない。 すべての道で主を認めよ、そうすれば、主はあなたの道をまっすぐにされる。","dep242-7-3-4":"すなわち、あなたがたは、以前の生活に属する、情欲に迷って滅び行く古き人を脱ぎ捨て、 真の義と聖とをそなえた神にかたどって造られた新しい人を着るべきである。","dep242-7-3-5":"そこで、あなたはわかい時の情欲を避けなさい。そして、きよい心をもって主を呼び求める人々と共に、義と信仰と愛と平和とを追い求めなさい。","dep242-7-3-6":"わたしたちは、何ひとつ持たないでこの世にきた。また、何ひとつ持たないでこの世を去って行く。 富むことを願い求める者は、誘惑と、わなとに陥り、また、人を滅びと破壊とに沈ませる、無分別な恐ろしいさまざまの情欲に陥るのである。","dep242-7-3-7":"そこで、あなたがたの歩きかたによく注意して、賢くない者のようにではなく、賢い者のように歩き、 今の時を生かして用いなさい。今は悪い時代なのである。","dep242-7-3-8":"そこで、すぐ彼らをお招きになると、父ゼベダイを雇人たちと一緒に船において、イエスのあとについて行った。","dep242-7-4-1":"そこで、わたしが切実な思いで待ち望むことは、わたしが、どんな事があっても恥じることなく、かえって、いつものよいに今も、大胆に語ることによって、生きるにも死ぬにも、わたしの身によってキリストがあがめられることである。","dep242-7-4-2":"人はみな、自分のことを求めるだけで、キリスト・イエスのことは求めていない。 しかし、テモテの練達ぶりは、あなたがたの知っているとおりである。すなわち、子が父に対するようにして、わたしと一緒に福音に仕えてきたのである。","dep242-7-4-3":"なおほかの者たちは、あざけられ、むち打たれ、しばりあげられ、投獄されるほどのめに会った。 （この世は彼らの住む所ではなかった）、荒野と山の中と岩の穴と土の穴とを、さまよい続けた。","dep242-8-1":"わたしはあなたを大いなる国民とし、あなたを祝福し、あなたの名を大きくしよう。あなたは祝福の基となるであろう。 あなたを祝福する者をわたしは祝福し、／あなたをのろう者をわたしはのろう。地のすべてのやからは、／あなたによって祝福される」。","dep242-8-2":"主は言われる、「あなたがわがしもべとなって、ヤコブのもろもろの部族をおこし、イスラエルのうちの残った者を帰らせることは、いとも軽い事である。わたしはあなたを、もろもろの国びとの光となして、わが救を地の果にまでいたらせよう」と。","dep242-8-3":"それゆえに、あなたがたは行って、すべての国民を弟子として、父と子と聖霊との名によって、彼らにバプテスマを施し、 あなたがたに命じておいたいっさいのことを守るように教えよ。見よ、わたしは世の終わりまで、いつもあなたがたと共にいるのである」。","dep242-8-4":"ただ、聖霊があなたがたにくだる時、あなたがたは力を受けて、エルサレム、ユダヤとサマリヤの全土、さらに地のはてまで、わたしの証人となるであろう」。","dep242-8-5":"わたしはまた主の言われる声を聞いた、「わたしはだれをつかわそうか。だれがわれわれのために行くだろうか」。その時わたしは言った、「ここにわたしがおります。わたしをおつかわしください」。","dep242-8-6":"このように恵みを受けたものは、わたしが異邦人のためにキリスト・イエスに仕える者となり、神の福音のために祭司の役を勤め、こうして異邦人を、聖霊によってきよめられた、御旨にかなうささげ物とするためである。","dep242-8-7":"わたしに求めよ、わたしはもろもろの国を／嗣業としておまえに与え、地のはてまでもおまえの所有として与える。","dep242-8-8":"神よ、みずからを天よりも高くし、みさかえを全地の上にあげてください。","dep242-8-9":"偽りのない神が永遠の昔に約束された永遠のいのちの望みに基くのである。 神は、定められた時に及んで、御言を宣教によって明らかにされたが、わたしは、わたしたちの救主なる神の任命によって、この宣教をゆだねられたのであるーー","dep242-8-10":"しかし、わたしが御言を余すところなく宣べ伝えて、すべての異邦人に聞かせるように、主はわたしを助け、力づけて下さった。そして、わたしは、ししの口から助け出されたのである。","dep242-8-11":"わたしたちはこのキリストを宣べ伝え、知恵をつくしてすべての人を訓戒し、また、すべての人を教えている。それは、彼らがキリストにあって全き者として立つようになるためである。 わたしはこのために、わたしのうちに力強く働いておられるかたの力により、苦闘しながら努力しているのである。","dep242-8-12":"わたしはこう祈る。あなたがたの愛が、深い知識において、するどい感覚において、いよいよ増し加わり、 イエス・キリストによる義の実に満たされて、神の栄光とほまれとをあらわすに至るように。","dep242-8-13":"そして、あなたが多くの証人の前でわたしから聞いたことを、さらにほかの者たちにも教えることのできるような忠実な人々に、ゆだねなさい。","dep242-8-14":"その最も小さい者は氏族となり、その最も弱い者は強い国となる。わたしは主である。その時がくるならば、すみやかにこの事をなす。","dep242-8-15":"こういうわけで、わたしたちは、このような多くの証人に雲のように囲まれているのであるから、いっさいの重荷と、からみつく罪とをかなぐりすてて、わたしたちの参加すべき競争を、堪え忍んで走りぬこうではないか。","dep242-8-16":"主の目はあまねく全地を行きめぐり、自分に向かって心を全うする者のために力をあらわされる。今度の事では、あなたは愚かな事をした。ゆえにこの後、あなたに戦争が臨むであろう」。","dep242-8-17":"海が水でおおわれているように、地は主の栄光の知識で満たされるからである。","dep242-8-18":"日の出る所から没する所まで、国々のうちにわが名はあがめられている。また、どこでも香と清いささげ物が、わが名のためにささげられる。これはわが名が国々のうちにあがめられているからであると、万軍の主は言われる。"},"chs":{"assurance-1":"这见证，就是神赐给我们永生，这永生也是在他儿子里面。 人有了神的儿子就有生命。没有神的儿子就没有生命。","assurance-2":"向来你们没有奉我的名求什么，如今你们求就必得着，叫你们的喜乐可以满足。","assurance-3":"你们所遇见的试探，无非是人所能受的。神是信实的，必不叫你们受试探过于所能受的。在受试探的时候，总要给你们开一条出路，叫你们能忍受得住。","assurance-4":"我们若认自己的罪，神是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义。","assurance-5":"你要专心仰赖耶和华，不可倚靠自己的聪明。 在你一切所行的事上，都要认定他，他必指引你的路。","living-1":"我是葡萄树，你们是枝子。常在我里面的，我也常在他里面，这人就多结果子。因为离了我，你们就不能作什么。","living-2":"如今我把你们交托神，和他恩惠的道。这道能建立你们，叫你们和一切成圣的人同得基业。","living-3":"因为凡被神的灵引导的，都是神的儿子。","living-4":"因我们行事为人，是凭着信心，不是凭着眼见。","living-5":"亲爱的弟兄阿，神既是这样爱我们，我们也当彼此相爱。","living-6":"我们若在光明中行，如同神在光明中，就彼此相交，他儿子耶稣的血也洗净我们一切的罪。","living-7":"只要心里尊主基督为圣。有人问你们心中盼望的缘由，就要常作准备，以温柔敬畏的心回答各人。","living-8":"各人要随本心所酌定的。不要作难，不要勉强，因为捐得乐意的人，是神所喜爱的。","tms60-A-1":"若有人在基督里，他就是新造的人。旧事已过，都变成新的了。","tms60-A-2":"我已经与基督同钉十字架。现在活着的，不再是我，乃是基督在我里面活着。并且我如今在肉身活着，是因信神的儿子而活，他是爱我，为我舍己。","tms60-A-3":"所以弟兄们，我以神的慈悲劝你们，将身体献上，当作活祭，是圣洁的，是神所喜悦的。你们如此事奉，乃是理所当然的。","tms60-A-4":"有了我的命令又遵守的，这人就是爱我的。爱我的必蒙我父爱他，我也要爱他，并且要向他显现。","tms60-A-5":"圣经都是神所默示的（或作凡神所默示的圣经），于教训，督责，使人归正，教导人学义，都是有益的。","tms60-A-6":"这律法书不可离开你的口，总要昼夜思想，好使你谨守遵行这书上所写的一切话。如此，你的道路就可以亨通，凡事顺利。","tms60-A-7":"你们若常在我里面，我的话也常在你们里面，凡你们所愿意的，祈求就给你们成就。","tms60-A-8":"应当一无挂虑，只要凡事借着祷告，祈求，和感谢，将你们所要的告诉神。 神所赐出人意外的平安，必在基督耶稣里，保守你们的心怀意念。","tms60-A-9":"因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间。","tms60-A-10":"又要彼此相顾，激发爱心，勉励行善。 你们不可停止聚会，好像那些停止惯了的人，倒要彼此劝勉。既知道（原文作看见）那日子临近，就更当如此。","tms60-A-11":"耶稣对他们说，来跟从我，我要叫你们得人如得鱼一样。","tms60-A-12":"我不以福音为耻。这福音本是神的大能，要救一切相信的，先是犹太人，后是希利尼人。","tms60-B-1":"因为世人都犯了罪，亏缺了神的荣耀。","tms60-B-2":"我们都如羊走迷，各人偏行己路。耶和华使我们众人的罪孽都归在他身上。","tms60-B-3":"因为罪的工价乃是死。惟有神的恩赐，在我们的主基督耶稣里乃是永生。","tms60-B-4":"按着定命，人人都有一死，死后且有审判。","tms60-B-5":"惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。","tms60-B-6":"因基督也曾一次为罪受苦（受苦有古卷作受死），就是义的代替不义的，为要引我们到神面前。按着肉体说他被治死。按着灵性说他复活了。","tms60-B-7":"你们得救是本乎恩，也因着信，这并不是出于自己，乃是神所赐的。 也不是出于行为，免得有人自夸。","tms60-B-8":"他便救了我们，并不是因我们自己所行的义，乃是照他的怜悯，借着重生的洗，和圣灵的更新。","tms60-B-9":"凡接待他的，就是信他名的人，他就赐他们权柄，作神的儿女。","tms60-B-10":"看哪，我站在门外叩门。若有听见我声音就开门的，我要进到他那里去，我与他，他与我一同坐席。","tms60-B-11":"我将这些话写给你们信奉神儿子之名的人，要叫你们知道自己有永生。","tms60-B-12":"我实实在在地告诉你们，那听我话，又信差我来者的，就有永生，不至于定罪，是已经出死入生了。","tms60-C-1":"岂不知你们是神的殿，神的灵住在你们里头吗？","tms60-C-2":"我们所领受的，并不是世上的灵，乃是从神来的灵，叫我们能知道神开恩赐给我们的事。","tms60-C-3":"你不要害怕，因为我与你同在。不要惊惶，因为我是你的神。我必坚固你，我必帮助你，我必用我公义的右手扶持你。","tms60-C-4":"我靠着那加给我力量的，凡事都能作。","tms60-C-5":"我们不至消灭，是出于耶和华诸般的慈爱。是因他的怜悯不至断绝。 每早晨，这都是新的。你的诚实极其广大。","tms60-C-6":"神非人，必不致说谎，也非人子，必不致后悔。他说话岂不照着行呢？他发言岂不要成就呢？","tms60-C-7":"坚心倚赖你的，你必保守他十分平安，因为他倚靠你。","tms60-C-8":"你们要将一切的忧虑卸给神，因为他顾念你们。","tms60-C-9":"神既不爱惜自己的儿子为我们众人舍了，岂不也把万物和他一同白白地赐给我们吗？","tms60-C-10":"我的神必照他荣耀的丰富，在基督耶稣里，使你们一切所需用的都充足。","tms60-C-11":"他自己既然被试探而受苦，就能搭救被试探的人。","tms60-C-12":"少年人用什么洁净他的行为呢？是要遵行你的话。 我将你的话藏在心里，免得我得罪你。","tms60-D-1":"你们要先求他的国和他的义。这些东西都要加给你们了。","tms60-D-2":"耶稣又对众人说，若有人要跟从我，就当舍己，天天背起他的十字架来，跟从我。","tms60-D-3":"不要爱世界，和世界上的事。人若爱世界，爱父的心就不在他里面了。 因为凡世界上的事，就像肉体的情欲，眼目的情欲，并今生的骄傲，都不是从父来的，乃是从世界来的。","tms60-D-4":"不要效法这个世界。只要心意更新而变化，叫你们察验何为神的善良，纯全可喜悦的旨意。","tms60-D-5":"所以我亲爱的弟兄们，你们务要坚固不可摇动，常常竭力多作主工，因为知道你们的劳苦，在主里面不是徒然的。","tms60-D-6":"那忍受罪人这样顶撞的，你们要思想，免得疲倦灰心。","tms60-D-7":"因为人子来，并不是要受人的服事，乃是要服事人，并且要舍命，作多人的赎价。","tms60-D-8":"我们原不是传自己，乃是传基督耶稣为主，并且自己因耶稣作你们的仆人。","tms60-D-9":"你要以财物，和一切初熟的土产，尊荣耶和华。 这样，你的仓房，必充满有余，你的酒榨，有新酒盈溢。","tms60-D-10":"少种的少收，多种的多收。这话是真的。 各人要随本心所酌定的。不要作难，不要勉强，因为捐得乐意的人，是神所喜爱的。","tms60-D-11":"但圣灵降临在你们身上，你们就必得着能力。并要在耶路撒冷，犹太全地，和撒玛利亚，直到地极，作我的见证。","tms60-D-12":"所以你们要去，使万民作我的门徒，奉父子圣灵的名，给他们施洗。（或作给他们施洗归于父子圣灵的名） 凡我所吩咐你们的，都教训他们遵守，我就常与你们同在，直到世界的末了。","tms60-E-1":"我赐给你们一条新命令，乃是叫你们彼此相爱。我怎样爱你们，你们也要怎样相爱。 你们若有彼此相爱的心，众人因此就认出你们是我的门徒了。","tms60-E-2":"小子们哪，我们相爱，不要只在言语和舌头上。总要在行为和诚实上。","tms60-E-3":"凡事不可结党，不可贪图虚浮的荣耀。只要存心谦卑，各人看别人比自己强。 各人不要单顾自己的事，也要顾别人的事。","tms60-E-4":"你们年幼的，也要顺服年长的。就是你们众人，也都要以谦卑束腰，彼此顺服。因为神阻挡骄傲的人，赐恩给谦卑的人。 所以你们要自卑，服在神大能的手下，到了时候他必叫你们升高。","tms60-E-5":"至于淫乱，并一切污秽，或是贪婪，在你们中间连提都不可，方合圣徒的体统。","tms60-E-6":"亲爱的弟兄阿你们是客旅，是寄居的。我劝你们要禁戒肉体的私欲。这私欲是与灵魂争战的。","tms60-E-7":"你们不可偷盗，不可欺骗，也不可彼此说谎。","tms60-E-8":"我因此自己勉励，对神，对人，常存无亏的良心。","tms60-E-9":"人非有信就不能得神的喜悦。因为到神面前来的人，必须信有神，且信他赏赐那寻求他的人。","tms60-E-10":"并且仰望神的应许，总没有因不信，心里起疑惑。反倒因信，心里得坚固，将荣耀归给神。 且满心相信，神所应许的必能作成。","tms60-E-11":"我们行善，不可丧志。若不灰心，到了时候，就要收成。 所以有了机会，就当向众人行善。向信徒一家的人更当这样。","tms60-E-12":"你们的光也当这样照在人前，叫他们看见你们的好行为，便将荣耀归给你们在天上的父。","tms180-s1-1-1":"太初有道，道与神同在，道就是神。 道成了肉身住在我们中间，充充满满的有恩典有真理。我们也见过他的荣光，正是父独生子的荣光。","tms180-s1-1-2":"论到子却说，神阿，你的宝座是永永远远的，你的国权是正直的。","tms180-s1-1-3":"因我们的大祭司，并非不能体恤我们的软弱。他也曾凡事受过试探，与我们一样。只是他没有犯罪。","tms180-s1-1-4":"耶稣的智慧和身量，（身量或作年纪）并神和人喜爱他的心，都一齐增长。","tms180-s1-1-5":"我当日所领受又传给你们的，第一，就是基督照圣经所说，为我们的罪死了。 而且埋葬了。又照圣经所说，第三天复活了。","tms180-s1-1-6":"但基督已经从死里复活，成为睡了之人初熟的果子。","tms180-s1-1-7":"从来没有人看见神。只有在父怀里的独生子将他表明出来。","tms180-s1-1-8":"他是神荣耀所发的光辉，是神本体的真像，常用他权能的命令托住万有，他洗净了人的罪，就坐在高天至大者的右边。","tms180-s1-1-9":"人子来，为要寻找拯救失丧的人。","tms180-s1-1-10":"知道你们得赎，脱去你们祖宗所传流虚妄的行为，不是凭着能坏的金银等物。 乃是凭着基督的宝血，如同无瑕疵无玷污的羔羊之血。","tms180-s1-1-11":"因为主必亲自从天降临，有呼叫的声音，和天使长的声音，又有神的号吹响。那在基督里死了的人必先复活。 以后我们这活着还存留的人，必和他们一同被提到云里，在空中与主相遇。这样，我们就要和主永远同在。","tms180-s1-1-12":"亲爱的弟兄阿，我们现在是神的儿女，将来如何，还未显明。但我们知道主若显现，我们必要像他。因为必得见他的真体。 凡向他有这指望的，就洁净自己，像他洁净一样。","tms180-s1-2-1":"只等真理的圣灵来了，他要引导你们明白（原文作进入）一切的真理。因为他不是凭自己说的，乃是把他所听见的都说出来。并要把将来的事告诉你们。 他要荣耀我。因为他要将受于我的，告诉你们。","tms180-s1-2-2":"所以我告诉你们，被神的灵感动的，没有说耶稣是可咒诅的。若不是被圣灵感动的，也没有能说耶稣是主的。","tms180-s1-2-3":"如果神的灵住在你们心里，你们就不属肉体，乃属圣灵了。人若没有基督的灵，就不是属基督的。","tms180-s1-2-4":"你们既为儿子，神就差他儿子的灵，进入你们（原文作我们）的心，呼叫阿爸，父。","tms180-s1-2-5":"不要醉酒，酒能使人放荡，乃要被圣灵充满。","tms180-s1-2-6":"我说，你们当顺着圣灵而行，就不放纵肉体的情欲了。","tms180-s1-2-7":"如经上所记，神为爱他的人所预备的，是眼睛未曾看见，耳朵未曾听见，人心也未曾想到的。 只有神借着圣灵向我们显明了。因为圣灵参透万事，就是神深奥的事也参透了。","tms180-s1-2-8":"但保惠师，就是父因我的名所要差来的圣灵，他要将一切的事，指教你们，并且要叫你们想起我对你们所说的一切话。","tms180-s1-2-9":"我说的话，讲的道，不是用智慧委婉的言语，乃是用圣灵和大能的明证。 叫你们的信不在乎人的智慧，只在乎神的大能。","tms180-s1-2-10":"因为我们的福音传到你们那里，不独在乎言语，也在乎权能和圣灵，并充足的信心，正如你们知道我们在你们那里，为你们的缘故是怎样为人。","tms180-s1-2-11":"这一切都是这位圣灵所运行，随己意分给各人的。","tms180-s1-2-12":"恩赐原有分别，圣灵却是一位。 功用也有分别，神却是一位，在众人里面运行一切的事。","tms180-s1-3-1":"主耶和华阿，你曾用大能和伸出来的膀臂创造天地，在你没有难成的事。","tms180-s1-3-2":"深哉，神丰富的智慧和知识。他的判断，何其难测，他的踪迹，何其难寻，","tms180-s1-3-3":"耶和华说，人岂能在隐密处藏身，使我看不见他呢？耶和华说，我岂不充满天地吗？","tms180-s1-3-4":"神能将各样的恩惠，多多地加给你们。使你们凡事常常充足，能多行各样善事。","tms180-s1-3-5":"耶和华阿，尊大，能力，荣耀，强胜，威严都是你的。凡天上地下的都是你的。国度也是你的，并且你为至高，为万有之首。 我们的神阿，现在我们称谢你，赞美你荣耀之名。","tms180-s1-3-6":"但主是信实的，要坚固你们，保护你们脱离那恶者。（或作脱离凶恶）","tms180-s1-3-7":"神是个灵（或无个字）所以拜他的，必须用心灵和诚实拜他。","tms180-s1-3-8":"那召你们的既是圣洁，你们在一切所行的事上也要圣洁。 因为经上记着说，你们要圣洁，因为我是圣洁的。","tms180-s1-3-9":"耶和华本为大，该受大赞美。其大无法测度。","tms180-s1-3-10":"不是我们爱神，乃是神爱我们，差他的儿子，为我们的罪作了挽回祭，这就是爱了。","tms180-s1-3-11":"主阿，你是有怜悯有恩典的神，不轻易发怒，并有丰盛的慈爱和诚实。","tms180-s1-3-12":"我们晓得万事都互相效力，叫爱神的人得益处，就是按他旨意被召的人。","tms180-s2-1-1":"惟用爱心说诚实话，凡事长进，连于元首基督。","tms180-s2-1-2":"不要彼此说谎，因你们已经脱去旧人和旧人的行为，","tms180-s2-1-3":"遮掩人过的，寻求人爱。屡次挑错的，离间密友。","tms180-s2-1-4":"往来传舌的，泄漏密事。心中诚实的，遮隐事情。","tms180-s2-1-5":"叫我按着所该说的话，将这奥秘发明出来。 你们的言语要常常带着和气，好像用盐调和，就可知道该怎样回答各人。","tms180-s2-1-6":"回答柔和，使怒消退。言语暴戾，触动怒气。","tms180-s2-1-7":"所以你们要彼此认罪，互相代求，使你们可以得医治。义人祈祷所发的力量，是大有功效的。","tms180-s2-1-8":"所以你在祭坛上献礼物的时候，若想起弟兄向你怀怨， 就把礼物留在坛前，先去同弟兄和好，然后来献礼物。","tms180-s2-1-9":"我亲爱的弟兄们，这是你们所知道的。但你们各人要快快地听，慢慢地说，慢慢地动怒。","tms180-s2-1-10":"未曾听完先回答的，便是他的愚昧，和羞辱。","tms180-s2-1-11":"不要责备亵慢人，恐怕他恨你。要责备智慧人，他必爱你。 教导智慧人，他就越发有智慧。指示义人，他就增长学问。","tms180-s2-1-12":"倘若你的弟兄得罪你，你就去趁着只有他和你在一处的时候，指出他的错来。他若听你，你便得了你的弟兄。","tms180-s2-2-1":"并要以恩慈相待，存怜悯的心，彼此饶恕，正如神在基督里饶恕了你们一样。","tms180-s2-2-2":"倘若这人与那人有嫌隙，总要彼此包容，彼此饶恕。主怎样饶恕了你们，你们也要怎样饶恕人。","tms180-s2-2-3":"凡事谦虚，温柔，忍耐，用爱心互相宽容，","tms180-s2-2-4":"然而主的仆人不可争竞，只要温温和和的待众人，善于教导，存心忍耐， 用温柔劝戒那抵挡的人。或者神给他们悔改的心，可以明白真道。","tms180-s2-2-5":"生气却不要犯罪。不可含怒到日落。","tms180-s2-2-6":"但现在你们要弃绝这一切的事，以及恼恨，忿怒，恶毒，（或作阴毒）毁谤，并口中污秽的言语。","tms180-s2-2-7":"又要谨慎，恐怕有人失了神的恩。恐怕有毒根生出来扰乱你们，因此叫众人沾染污秽。","tms180-s2-2-8":"一切苦毒，恼恨，忿怒，嚷闹，毁谤，并一切的恶毒，（或作阴毒）都当从你们中间除掉。","tms180-s2-2-9":"你们若因犯罪受责打，能忍耐，有什么可夸的呢？但你们若因行善受苦，能忍耐，这在神看是可喜爱的。 你们蒙召原是为此。因基督也为你们受过苦，给你们留下榜样，叫你们跟随他的脚踪行。","tms180-s2-2-10":"亲爱的弟兄，不要自己伸冤，宁可让步，听凭主怒。（或作让人发怒）因为经上记着，主说，伸冤在我。我必报应。","tms180-s2-2-11":"忿怒为残忍，怒气为狂澜，惟有嫉妒，谁能敌得住呢？","tms180-s2-2-12":"在何处有嫉妒分争，就在何处有扰乱，和各样的坏事。","tms180-s2-3-1":"但愿赐忍耐安慰的神，叫你们彼此同心，效法基督耶稣。 一心一口，荣耀神，我们主耶稣基督的父。","tms180-s2-3-2":"弟兄们，我借我们主耶稣基督的名，劝你们都说一样的话。你们中间也不可分党。只要一心一意彼此相合。","tms180-s2-3-3":"只是在你们中间不可这样。你们中间谁愿为大，就必作你们的用人。 谁愿为首，就必作你们的仆人。","tms180-s2-3-4":"弟兄们，你们蒙召，是要得自由。只是不可将你们的自由当作放纵情欲的机会。总要用爱心互相服事。","tms180-s2-3-5":"我们各人务要叫邻舍喜悦，使他得益处，建立德行","tms180-s2-3-6":"凡事不可结党，不可贪图虚浮的荣耀。只要存心谦卑，各人看别人比自己强。 各人不要单顾自己的事，也要顾别人的事。","tms180-s2-3-7":"所以你们该彼此劝慰，互相建立，正如你们素常所行的。","tms180-s2-3-8":"两个人总比一个人好，因为二人劳碌同得美好的果效。 若是跌倒，这人可以扶起他的同伴。若是孤身跌倒，没有别人扶起他来。这人就有祸了。","tms180-s2-3-9":"他看见许多的人，就怜悯他们。因为他们困苦流离，如同羊没有牧人一般。","tms180-s2-3-10":"与喜乐的人要同乐。与哀哭的人要同哭。","tms180-s2-3-11":"惟独从上头来的智慧，先是清洁，后是和平，温良柔顺，满有怜悯，多结善果，没有偏见，没有假冒。","tms180-s2-3-12":"弟兄们，若有人偶然被过犯所胜，你们属灵的人，就当用温柔的心，把他挽回过来。又当自己小心，恐怕也被引诱。","tms180-s3-1-1":"神的神能已将一切关乎生命和虔敬的事赐给我们，皆因我们认识那用自己荣耀和美德召我们的主。 因此他已将又宝贵又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，就得与神的性情有分。","tms180-s3-1-2":"神的应许，不论有多少，在基督都是是的，所以借着他也都是实在的，（实在原文作阿们）叫神因我们得荣耀。","tms180-s3-1-3":"愿颂赞归与我们的主耶稣基督的父神，就是发慈悲的父，赐各样安慰的神。 我们在一切患难中，他就安慰我们，叫我们能用神所赐的安慰，去安慰那遭各样患难的人。","tms180-s3-1-4":"可见栽种的算不得什么，浇灌的也算不得什么。只在那叫他生长的神。 栽种的和浇灌的都是一样。但将来各人要照自己的工夫，得自己的赏赐。","tms180-s3-1-5":"惟喜爱耶和华的律法，昼夜思想，这人便为有福。 他要像一棵树栽在溪水旁，按时候结果子，叶子也不枯干。凡他所作的，尽都顺利。","tms180-s3-1-6":"你们若充充足足地有这几样，就必使你们在认识我们的主耶稣基督上，不至于闲懒不结果子了。","tms180-s3-1-7":"那赐诸般恩典的神，曾在基督里召你们，得享他永远的荣耀，等你们暂受苦难之后，必要亲自成全你们，坚固你们，赐力量给你们。","tms180-s3-1-8":"他对我说，我的恩典够你用的。因为我的能力，是在人的软弱上显得完全。所以我更喜欢夸自己的软弱，好叫基督的能力覆庇我。","tms180-s3-1-9":"愿颂赞归与我们主耶稣基督的父神，他在基督里，曾赐给我们天上各样属灵的福气。","tms180-s3-1-10":"又要以耶和华为乐。他就将你心里所求的赐给你。 当将你的事交托耶和华，并倚靠他，他就必成全。","tms180-s3-1-11":"我小子们哪，我将这些话写给你们，是要叫你们不犯罪。若有人犯罪，在父那里我们有一位中保，就是那义者耶稣基督。 他为我们的罪作了挽回祭。不是单为我们的罪，也是为普天下人的罪。","tms180-s3-1-12":"东离西有多远，他叫我们的过犯，离我们也有多远。","tms180-s3-2-1":"神的道是活泼的，是有功效的，比一切两刃的剑更快，甚至魂与灵，骨节与骨髓，都能刺入剖开，连心中的思念和主意，都能辨明。","tms180-s3-2-2":"雨雪从天而降，并不返回，却滋润地土，使地上发芽结实，使撒种的有种，使要吃的有粮。 我口所出的话，也必如此，决不徒然返回，却要成就我所喜悦的，在我发他去成就的事上（发他去成就或作所命定）必然亨通。","tms180-s3-2-3":"第一要紧的，该知道经上所有的预言，没有可随私意解说的。 因为预言从来没有出于人意的，乃是人被圣灵感动说出神的话来。","tms180-s3-2-4":"为此，我们也不住地感谢神，因你们听见我们所传神的道，就领受了，不以为是人的道，乃以为是神的道。这道实在是神的，并且运行在你们信主的人心中。","tms180-s3-2-5":"耶和华万军之神阿，我得着你的言语就当食物吃了。你的言语是我心中的欢喜快乐，因我是称为你名下的人。","tms180-s3-2-6":"他嘴唇的命令，我未曾背弃。我看重他口中的言语，过于我需用的饮食。","tms180-s3-2-7":"这地方的人，贤于帖撒罗尼迦的人，甘心领受这道，天天考查圣经，要晓得这道，是与不是。","tms180-s3-2-8":"你们查考圣经。（或作应当查考圣经）因你们以为内中有永生。给我作见证的就是这经。 然而你们不肯到我这里来得生命。","tms180-s3-2-9":"耶稣对信他的犹太人说，你们若常常遵守我的道，就真是我的门徒。 你们必晓得真理，真理必叫你们得以自由。","tms180-s3-2-10":"耶稣却回答说，经上记着说，人活着，不是单靠食物，乃是靠神口里所出的一切话。","tms180-s3-2-11":"天地要废去，我的话却不能废去。","tms180-s3-2-12":"求你用真理使他们成圣。你的道就是真理。","tms180-s3-3-1":"因此，你们是大有喜乐，但如今，在百般的试炼中暂时忧愁。 叫你们的信心既被试验，就比那被火试验，仍然能坏的金子，更显宝贵。可以在耶稣基督显现的时候，得着称赞，荣耀，尊贵。","tms180-s3-3-2":"我的弟兄们，你们落在百般试炼中，都要以为大喜乐。 但忍耐也当成功，使你们成全完备，毫无缺欠。","tms180-s3-3-3":"因为有福音传给我们，像传给他们一样。只是所听见的道与他们无益，因为他们没有信心与所听见的道调和。","tms180-s3-3-4":"只是义人必因信得生。（义人有古卷作我的义人）他若退后，我心里就不喜欢他。","tms180-s3-3-5":"此外又拿着信德当作藤牌，可以灭尽那恶者一切的火箭。","tms180-s3-3-6":"但你这属神的人，要逃避这些事，追求公义，敬虔，信心，爱心，忍耐，温柔。 你要为真道打那美好的仗，持定永生。你为此被召，也在许多见证人面前，已经作了那美好的见证。","tms180-s3-3-7":"信就是所望之事的实底，是未见之事的确据。","tms180-s3-3-8":"可见信道是从听道来的，听道是从基督的话来的。","tms180-s3-3-9":"并且不懈怠。总要效法那些凭信心和忍耐承受应许的人。","tms180-s3-3-10":"这样信心若没有行为就是死的。","tms180-s3-3-11":"既知道人称义，不是因行律法，乃是因信耶稣基督，连我们也信了基督耶稣，使我们因信基督称义，不因行律法称义，因为凡有血气的，没有一人因行律法称义。","tms180-s3-3-12":"我们既因信称义，就借着我们的主耶稣基督，得与神相和。","tms180-s4-1-1":"感谢神，使我们借着我们的主耶稣基督得胜。","tms180-s4-1-2":"感谢神，常帅领我们在基督里夸胜，并借着我们在各处显扬那因认识基督而有的香气。","tms180-s4-1-3":"我们争战的兵器，本不是属血气的，乃是在神面前有能力可以攻破坚固的营垒， 将各样的计谋，各样拦阻人认识神的那些自高之事，一概攻破了，又将人所有的心意夺回，使他都顺服基督。","tms180-s4-1-4":"我还有末了的话，你们要靠着主，倚赖他的大能大力，作刚强的人。 要穿戴神所赐的全副军装，就能抵挡魔鬼的诡计。","tms180-s4-1-5":"弟兄胜过它，是因羔羊的血，和自己所见证的道。他们虽至于死，也不爱惜性命。","tms180-s4-1-6":"故此你们要顺服神，务要抵挡魔鬼，魔鬼就必离开你们逃跑了。 你们亲近神，神就必亲近你们。有罪的人哪，要洁净你们的手。心怀二意的人哪，要清洁你们的心。","tms180-s4-1-7":"因为随从肉体的人体贴肉体的事，随从圣灵的人体贴圣灵的事。 体贴肉体的，就是死，体贴圣灵的，乃是生命，平安。","tms180-s4-1-8":"总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。","tms180-s4-1-9":"小子们哪，你们是属神的，并且胜了他们。因为那在你们里面的，比那在世界上的更大。","tms180-s4-1-10":"因为凡从神生的，就胜过世界。使我们胜了世界的，就是我们的信心。 胜过世界的是谁呢？不是那信耶稣是神儿子的吗？","tms180-s4-1-11":"神的律法在他心里。他的脚总不滑跌。","tms180-s4-1-12":"所以不要容罪在你们必死的身上作王，使你们顺从身子的私欲。 也不要将你们的肢体献给罪作不义的器具。倒要像从死里复活的人，将自己献给神。并将肢体作义的器具献给神。","tms180-s4-2-1":"弟兄们，我还有未尽的话。凡是真实的，可敬的，公义的，清洁的，可爱的，有美名的。若有什么德行，若有什么称赞，这些事你们都要思念。","tms180-s4-2-2":"在洁净的人，凡物都洁净。在污秽不信的人，什么都不洁净。连心地和天良，也都污秽了。","tms180-s4-2-3":"善人从他心里所存的善，就发出善来。恶人从他心里所存的恶，就发出恶来。因为心里所充满的，口里就说出来。","tms180-s4-2-4":"你要保守你心，胜过保守一切。（或作你要切切保守你心）因为一生的果效，是由心发出。","tms180-s4-2-5":"眼睛就是身上的灯。你的眼睛若了亮，全身就光明。","tms180-s4-2-6":"只是我告诉你们，凡看见妇女就动淫念的，这人心里已经与她犯奸淫了。","tms180-s4-2-7":"神的旨意就是要你们成为圣洁，远避淫行。","tms180-s4-2-8":"食物是为肚腹，肚腹是为食物。但神要叫这两样都废坏。身子不是为淫乱，乃是为主。主也是为身子。","tms180-s4-2-9":"污秽的言语，一句不可出口，只要随事说造就人的好话，叫听见的人得益处。","tms180-s4-2-10":"我又告诉你们，凡人所说的闲话，当审判的日子，必要句句供出来。 因为要凭你的话定你为义，也要凭你的话，定你有罪。","tms180-s4-2-11":"各样的恶事要禁戒不作。","tms180-s4-2-12":"不可严责老年人，只要劝他如同父亲。劝少年人如同弟兄。 劝老年妇女如同母亲。劝少年妇女如同姐妹。总要清清洁洁的。","tms180-s4-3-1":"你们祷告，无论求什么，只要信，就必得着。","tms180-s4-3-2":"你们祈求，就给你们。寻找，就寻见。叩门，就给你们开门。 因为凡祈求的，就得着。寻找的，就寻见。叩门的，就给他开门。","tms180-s4-3-3":"你祷告的时候，要进你的内屋，关上门，祷告你在暗中的父，你父在暗中察看，必然报答你。","tms180-s4-3-4":"次日早晨，天未亮的时候，耶稣起来，到旷野地方去，在那里祷告。","tms180-s4-3-5":"你求告我，我就应允你，并将你所不知道，又大又难的事指示你。","tms180-s4-3-6":"神能照着运行在我们心里的大力，充充足足的成就一切超过我们所求所想的。","tms180-s4-3-7":"我们若照他的旨意求什么，他就听我们。这是我们向他所存坦然无惧的心。 既然知道他听我们一切所求的，就知道我们所求于他的无不得着。","tms180-s4-3-8":"不住地祷告。 凡事谢恩。因为这是神在基督耶稣里向你们所定的旨意。","tms180-s4-3-9":"至于我，断不停止为你们祷告，以致得罪耶和华。我必以善道正路指教你们。","tms180-s4-3-10":"于是对门徒说，要收的庄稼多，作工的人少。 所以你们当求庄稼的主，打发工人出去，收他的庄稼。","tms180-s4-3-11":"我们应当靠着耶稣，常常以颂赞为祭献给神，这就是那承认主名之人嘴唇的果子。","tms180-s4-3-12":"你们要赞美耶和华。我的心哪，你要赞美耶和华。 我一生要赞美耶和华。我还活的时候要歌颂我的神。","tms180-s5-1-1":"神愿意叫他们知道，这奥秘在外邦人中有何等丰盛的荣耀。就是基督在你们心里成了有荣耀的盼望。 我们传扬他，是用诸般的智慧，劝戒各人，教导各人。要把各人在基督里完完全全的引到神面前。","tms180-s5-1-2":"这就是神在基督里叫世人与自己和好，不将他们的过犯归到他们身上。并且将这和好的道理托付了我们。 所以我们作基督的使者，就好像神借我们劝你们一般。我们替基督求你们与神和好。","tms180-s5-1-3":"但神既然验中了我们，把福音托付我们，我们就照样讲，不是要讨人喜欢，乃是要讨那察验我们心的神喜欢。","tms180-s5-1-4":"我虽是自由的，无人辖管，然而我甘心作了众人的仆人，为要多得人。","tms180-s5-1-5":"你们岂不说，到收割的时候，还有四个月吗？我告诉你们，举目向田观看，庄稼已经熟了，（原文作发白）可以收割了。","tms180-s5-1-6":"我们既是这样爱你们，不但愿意将神的福音给你们，连自己的性命也愿意给你们，因你们是我们所疼爱的。","tms180-s5-1-7":"就如经上所记，没有义人，连一个也没有。 都是偏离正路，一同变为无用。没有行善的，连一个也没有。","tms180-s5-1-8":"要报应那不认识神，和那不听从我主耶稣福音的人。 他们要受刑罚，就是永远沉沦，离开主的面和他权能的荣光。","tms180-s5-1-9":"他被挂在木头上亲身担当了我们的罪，使我们既然在罪上死，就得以在义上活。因他受的鞭伤，你们便得了医治。","tms180-s5-1-10":"神救了我们，以圣召召我们，不是按我们的行为，乃是按他的旨意，和恩典。这恩典是万古之先，在基督耶稣里赐给我们的。","tms180-s5-1-11":"你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。 因为人心里相信，就可以称义。口里承认，就可以得救。","tms180-s5-1-12":"我又赐给他们永生。他们永不灭亡，谁也不能从我手里把他们夺去。 我父把羊赐给我，他比万有都大。谁也不能从我父手里把他们夺去。","tms180-s5-2-1":"人所行的，在自己眼中都看为正，惟有耶和华衡量人心。","tms180-s5-2-2":"人就是赚得全世界，赔上自己的生命，有什么益处呢？","tms180-s5-2-3":"人若立志遵着他的旨意行，就必晓得这教训或是出于神，或是我凭着自己说的。","tms180-s5-2-4":"耶稣对他们说，无病的人用不着医生。有病的人才用得着。 我来本不是召义人悔改。乃是召罪人悔改。","tms180-s5-2-5":"你们互相受荣耀，却不求从独一之神来的荣耀，怎能信我呢？","tms180-s5-2-6":"凡靠着他进到神面前的人，他都能拯救到底。因为他是长远活着，替他们祈求。","tms180-s5-2-7":"不要为明日自夸，因为一日要生何事，你尚且不能知道。","tms180-s5-2-8":"这样看来，我们各人必要将自己的事，在神面前说明。","tms180-s5-2-9":"你们查考圣经。（或作应当查考圣经）因你们以为内中有永生。给我作见证的就是这经。","tms180-s5-2-10":"有一条路人以为正。至终成为死亡之路。","tms180-s5-2-11":"王又要向那左边的说，你们这被咒诅的人，离开我，进入那为魔鬼和他的使者所预备的永火里去。","tms180-s5-2-12":"自从造天地以来，神的永能和神性是明明可知的，虽是眼不能见，但借着所造之物，就可以晓得，叫人无可推诿。","tms180-s5-3-1":"知道你们得赎，脱去你们祖宗所传流虚妄的行为，不是凭着能坏的金银等物。 乃是凭着基督的宝血，如同无瑕疵无玷污的羔羊之血。","tms180-s5-3-2":"一切都是出于神，他借着基督使我们与他和好，又将劝人与他和好的职分赐给我们。","tms180-s5-3-3":"我们借这爱子的血，得蒙救赎，过犯得以赦免，乃是照他丰富的恩典。","tms180-s5-3-4":"罪必不能作你们的主。因你们不在律法之下，乃在恩典之下。 这却怎么样呢？我们在恩典之下，不在律法之下，就可以犯罪吗？断乎不可。","tms180-s5-3-5":"所以你们因信基督耶稣，都是神的儿子。","tms180-s5-3-6":"惟有你们是被拣选的族类，是有君尊的祭司，是圣洁的国度，是属神的子民，要叫你们宣扬那召你们出黑暗入奇妙光明者的美德。","tms180-s5-3-7":"神使那无罪的（无罪原文作不知罪），替我们成为罪。好叫我们在他里面成为神的义。","tms180-s5-3-8":"但你们得在基督耶稣里，是本乎神，神又使他成为我们的智慧，公义，圣洁，救赎。","tms180-s5-3-9":"因为他一次献祭，便叫那得以成圣的人永远完全。","tms180-s5-3-10":"如今却蒙神的恩典，因基督耶稣的救赎，就白白地称义。","tms180-s5-3-11":"我们却是天上的国民。并且等候救主，就是主耶稣基督，从天上降临。","tms180-s5-3-12":"因为神本性一切的丰盛，都有形有体的居住在基督里面。 你们在他里面也得了丰盛。他是各样执政掌权者的元首。","dep242-1-1":"你们总要自己省察有信心没有。也要自己试验。岂不知你们若不是可弃绝的，就有耶稣基督在你们心里吗？","dep242-1-2":"这见证，就是神赐给我们永生，这永生也是在他儿子里面。 人有了神的儿子就有生命。没有神的儿子就没有生命。","dep242-1-3":"我实实在在地告诉你们，信的人有永生。","dep242-1-4":"我将这些话写给你们信奉神儿子之名的人，要叫你们知道自己有永生。","dep242-1-5":"我们借这爱子的血，得蒙救赎，过犯得以赦免，乃是照他丰富的恩典。","dep242-1-6":"如今那些在基督耶稣里的，就不定罪了。","dep242-1-7":"如今却蒙神的恩典，因基督耶稣的救赎，就白白地称义。","dep242-1-8":"我们既因信称义，就借着我们的主耶稣基督，得与神相和。","dep242-1-9":"愿颂赞归与我们主耶稣基督的父神，他曾照自己的大怜悯，借耶稣基督从死里复活重生了我们，叫我们有活泼的盼望，","dep242-1-10":"他便救了我们，并不是因我们自己所行的义，乃是照他的怜悯，借着重生的洗，和圣灵的更新。","dep242-1-11":"因为凡被神的灵引导的，都是神的儿子。","dep242-1-12":"所以你们因信基督耶稣，都是神的儿子。","dep242-1-13":"如果神的灵住在你们心里，你们就不属肉体，乃属圣灵了。人若没有基督的灵，就不是属基督的。","dep242-1-14":"我要求父，父就另外赐给你们一位保惠师，（或作训慰师下同）叫他永远与你们同在。 就是真理的圣灵，乃世人不能接受的。因为不见他，也不认识他。你们却认识他。因他常与你们同在，也要在你们里面。","dep242-1-15":"是高处的，是低处的，是别的受造之物，都不能叫我们与神的爱隔绝。这爱是在我们的主基督耶稣里的。","dep242-1-16":"我又赐给他们永生。他们永不灭亡，谁也不能从我手里把他们夺去。 我父把羊赐给我，他比万有都大。谁也不能从我父手里把他们夺去。","dep242-1-17":"你们既听见真理的道，就是那叫你们得救的福音，也信了基督，既然信他，就受了所应许的圣灵为印记。","dep242-1-18":"你们蒙了重生，不是由于能坏的种子，乃是由于不能坏的种子，是借着神活泼常存的道。","dep242-2-1-1":"耶和华必然等候，要施恩给你们。必然兴起，好怜悯你们。因为耶和华是公平的神。凡等候他的，都是有福的。","dep242-2-1-2":"神是信实的，你们原是被他所召，好与他儿子，我们的主耶稣基督，一同得分。","dep242-2-1-3":"当趁耶和华可寻找的时候寻找他，相近的时候求告他。","dep242-2-1-4":"你说，你们当寻求我的面。那时我心向你说，耶和华阿，你的面我正要寻求。","dep242-2-1-5":"我是葡萄树，你们是枝子。常在我里面的，我也常在他里面，这人就多结果子。因为离了我，你们就不能作什么。","dep242-2-1-6":"少壮狮子，还缺食忍饿。但寻求耶和华的。什么好处都不缺。","dep242-2-1-7":"求你使我清晨得听你慈爱之言，因我倚靠你。求你使我知道当行的路，因我的心仰望你。 求你指教我遵行你的旨意，因你是我的神。你的灵本为善。求你引我到平坦之地。","dep242-2-1-8":"我要站在守望所，立在望楼上观看，看耶和华对我说什么话，我可用什么话向他诉冤。（向他诉冤或作回答所疑问的）。","dep242-2-2-1":"我的心哪，你为何忧闷？为何在我里面烦躁？应当仰望神。因我还要称赞他。他是我脸上的光荣，（原文作帮助），是我的神。","dep242-2-2-2":"仰望为我们信心创始成终的耶稣。（或作仰望那将真道创始成终的耶稣）他因那摆在前面的喜乐，就轻看羞辱，忍受了十字架的苦难，便坐在神宝座的右边。","dep242-2-2-3":"我等候耶和华，我的心等候。我也仰望他的话。 我的心等候主，胜于守夜的，等候天亮，胜于守夜的，等候天亮。","dep242-2-2-4":"（可拉后裔的训诲诗，交与伶长。）神阿，我的心切慕你，如鹿切慕溪水。","dep242-2-2-5":"你要把你的重担卸给耶和华，他必抚养你，他永不叫义人动摇。","dep242-2-2-6":"天天背负我们重担的主，就是拯救我们的神。是应当称颂的。（细拉）","dep242-2-2-7":"耶和华是我的避难所。你已将至高者当你的居所。 祸患必不临到你，灾害也不挨近你的帐棚。","dep242-2-2-8":"凡劳苦担重担的人，可以到我这里来，我就使你们得安息。 我心里柔和谦卑，你们当负我的轭，学我的样式，这样，你们心里就必得享安息。","dep242-2-2-9":"我趁天未亮呼求。我仰望了你的言语。 我趁夜更未换，将眼睁开，为要思想你的话语。","dep242-2-2-10":"耶和华阿，早晨你必听我的声音。早晨我必向你陈明我的心意，并要儆醒。","dep242-2-2-11":"来阿，我们要屈身敬拜，在造我们的耶和华面前跪下。","dep242-2-2-12":"我们应当靠着耶稣，常常以颂赞为祭献给神，这就是那承认主名之人嘴唇的果子。","dep242-2-2-13":"求你使我们早早饱得你的慈爱，好叫我们一生一世欢呼喜乐。","dep242-2-2-14":"因他使心里渴慕的人，得以知足，使心里饥饿的人，得饱美物。","dep242-2-3-15":"次日早晨，天未亮的时候，耶稣起来，到旷野地方去，在那里祷告。","dep242-2-3-1":"耶和华与摩西面对面说话，好像人与朋友说话一般。摩西转到营里去，惟有他的帮手，一个少年人嫩的儿子约书亚，不离开会幕。","dep242-2-3-2":"但以理知道这禁令盖了玉玺，就到自己家里（他楼上的窗户开向耶路撒冷），一日三次，双膝跪在他神面前，祷告感谢，与素常一样。","dep242-2-3-3":"若不用比喻，就不对他们讲。没有人的时候，就把一切的道讲给门徒听。","dep242-3-1-1":"因为预言从来没有出于人意的，乃是人被圣灵感动说出神的话来。","dep242-3-1-2":"圣经都是神所默示的（或作凡神所默示的圣经），于教训，督责，使人归正，教导人学义，都是有益的。","dep242-3-1-3":"天地要废去，我的话却不能废去。","dep242-3-1-4":"因为凡有血气的，尽都如草，他的美荣，都像草上的花。草必枯干，花必凋谢。 惟有主的道是永存的。所传给你们的福音就是这道。","dep242-3-1-5":"求你用真理使他们成圣。你的道就是真理。","dep242-3-1-6":"主耶和华阿，惟有你是神。你的话是真实的。你也应许将这福气赐给仆人。","dep242-3-1-7":"耶和华说，我的话岂不像火，又像能打碎磐石的大锤吗？","dep242-3-1-8":"我为这福音受苦难，甚至被捆绑，像犯人一样。然而神的道，却不被捆绑。","dep242-3-1-9":"耶稣却回答说，经上记着说，人活着，不是单靠食物，乃是靠神口里所出的一切话。","dep242-3-1-10":"于是从摩西和众先知起，凡经上所指着自己的话，都给他们讲解明白了。","dep242-3-2-1":"你们蒙了重生，不是由于能坏的种子，乃是由于不能坏的种子，是借着神活泼常存的道。","dep242-3-2-2":"他按自己的旨意，用真道生了我们，叫我们在他所造的万物中，好像初熟的果子。","dep242-3-2-3":"就要爱慕那纯净的灵奶，像才生的婴孩爱慕奶一样，叫你们因此渐长，以致得救。","dep242-3-2-4":"如今我把你们交托神，和他恩惠的道。这道能建立你们，叫你们和一切成圣的人同得基业。","dep242-3-2-5":"你的话是我脚前的灯，是我路上的光。","dep242-3-2-6":"你行走，他必引导你。你躺卧，他必保守你。你睡醒，他必与你谈论。 因为诫命是灯，法则（或作指教）是光。训诲的责备是生命的道。","dep242-3-2-7":"他发命医治他们，救他们脱离死亡。","dep242-3-2-8":"百夫长回答说，主阿，你到我舍下，我不敢当。只要你说一句话，我的仆人就必好了。","dep242-3-2-9":"耶和华万军之神阿，我得着你的言语就当食物吃了。你的言语是我心中的欢喜快乐，因我是称为你名下的人。","dep242-3-2-10":"我以你的法度为永远的产业。因这是我心中所喜爱的。","dep242-3-2-11":"并戴上救恩的头盔，拿着圣灵的宝剑，就是神的道。","dep242-3-2-12":"神的道是活泼的，是有功效的，比一切两刃的剑更快，甚至魂与灵，骨节与骨髓，都能刺入剖开，连心中的思念和主意，都能辨明。","dep242-3-3-1":"这地方的人，贤于帖撒罗尼迦的人，甘心领受这道，天天考查圣经，要晓得这道，是与不是。","dep242-3-3-2":"我何等爱慕你的律法，终日不住地思想。","dep242-3-3-3":"以斯拉定志考究遵行耶和华的律法，又将律例典章教训以色列人。","dep242-3-3-4":"他嘴唇的命令，我未曾背弃。我看重他口中的言语，过于我需用的饮食。","dep242-3-3-5":"西门说，夫子，我们整夜劳力，并没有打着什么。但依从你的话，我就下网。 他们下了网，就圈住许多鱼，网险些裂开。","dep242-3-4-1":"可见信道是从听道来的，听道是从基督的话来的。","dep242-3-4-2":"耶稣说，是却还不如听神之道而遵守的人有福。","dep242-3-4-3":"念这书上预言的，和那些听见又遵守其中所记载的，都是有福的。因为日期近了。","dep242-3-4-4":"存在他那里，要平生诵读，好学习敬畏耶和华他的神，谨守遵行这律法书上的一切言语和这些律例，","dep242-3-4-5":"这地方的人，贤于帖撒罗尼迦的人，甘心领受这道，天天考查圣经，要晓得这道，是与不是。","dep242-3-4-6":"你当竭力，在神面前得蒙喜悦，作无愧的工人，按着正意分解真理的道。","dep242-3-4-7":"我今日所吩咐你的话都要记在心上，","dep242-3-4-8":"我儿，你要遵守我的言语，将我的命令存记在心。 系在你指头上，刻在你心版上。","dep242-3-4-9":"不从恶人的计谋，不站罪人的道路，不坐亵慢人的座位。 惟喜爱耶和华的律法，昼夜思想，这人便为有福。","dep242-3-4-10":"这律法书不可离开你的口，总要昼夜思想，好使你谨守遵行这书上所写的一切话。如此，你的道路就可以亨通，凡事顺利。","dep242-4-1-1":"不住地祷告。","dep242-4-1-2":"你们要恒切祷告，在此儆醒感恩。","dep242-4-1-3":"万物的结局近了。所以你们要谨慎自守，儆醒祷告。","dep242-4-1-4":"我劝你第一要为万人恳求祷告，代求，祝谢。 为君王和一切在位的也该如此。使我们可以敬虔端正，平安无事的度日。","dep242-4-2-1":"你们奉我的名，无论求什么，我必成就，叫父因儿子得荣耀。 你们若奉我的名求什么，我必成就。","dep242-4-2-2":"神能照着运行在我们心里的大力，充充足足的成就一切超过我们所求所想的。","dep242-4-2-3":"你求告我，我就应允你，并将你所不知道，又大又难的事指示你。","dep242-4-2-4":"你们中间若有缺少智慧的，应当求那厚赐与众人，也不斥责人的神，主就必赐给他。","dep242-4-2-5":"我曾寻求耶和华，他就应允我，救我脱离了一切的恐惧。","dep242-4-2-6":"并要在患难之日求告我，我必搭救你。你也要荣耀我。","dep242-4-2-7":"祷告完了，聚会的地方震动，他们就都被圣灵充满，放胆讲论神的道。","dep242-4-2-8":"也要为我们祷告，求神给我们开传道的门，能以讲基督的奥秘，（我为此被捆锁）。","dep242-4-3-1":"向来你们没有奉我的名求什么，如今你们求就必得着，叫你们的喜乐可以满足。","dep242-4-3-2":"你们祷告，无论求什么，只要信，就必得着。","dep242-4-3-3":"靠着圣灵，随时多方祷告祈求，并要在此儆醒不倦，为众圣徒祈求，","dep242-4-3-4":"我们若照他的旨意求什么，他就听我们。这是我们向他所存坦然无惧的心。 既然知道他听我们一切所求的，就知道我们所求于他的无不得着。","dep242-4-3-5":"我若心里注重罪孽，主必不听。","dep242-4-3-6":"并且我们一切所求的，就从他得着。因为我们遵守他的命令，行他所喜悦的事。","dep242-4-3-7":"我又告诉你们，若是你们中间有两个人在地上，同心合意地求什么事，我在天上的父，必为他们成全。","dep242-4-3-8":"你们祈求，就给你们。寻找，就寻见。叩门，就给你们开门。","dep242-4-3-9":"你们要呼求我，祷告我，我就应允你们。 你们寻求我，若专心寻求我，就必寻见。","dep242-4-3-10":"但你们若归向我，谨守遵行我的诫命，你们被赶散的人虽在天涯，我也必从那里将他们招聚回来，带到我所选择立为我名的居所。","dep242-4-4-1":"但以理知道这禁令盖了玉玺，就到自己家里（他楼上的窗户开向耶路撒冷），一日三次，双膝跪在他神面前，祷告感谢，与素常一样。","dep242-4-4-2":"但耶稣的名声越发传扬出去。有极多的人聚集来听道，也指望医治他们的病。 耶稣却退到旷野去祷告。","dep242-4-4-3":"那时耶稣出去上山祷告。整夜祷告神。","dep242-4-4-4":"以利亚与我们是一样性情的人，他恳切祷告，求不要下雨，雨就三年零六个月不下在地上。 他又祷告，天就降下雨来，地也生出土产。","dep242-4-4-5":"约在半夜，保罗和西拉，祷告唱诗赞美神，众囚犯也侧耳而听。","dep242-4-5-1":"耶和华阿，尊大，能力，荣耀，强胜，威严都是你的。凡天上地下的都是你的。国度也是你的，并且你为至高，为万有之首。 我们的神阿，现在我们称谢你，赞美你荣耀之名。","dep242-4-5-2":"我劝你第一要为万人恳求祷告，代求，祝谢。 为君王和一切在位的也该如此。使我们可以敬虔端正，平安无事的度日。","dep242-4-5-3":"凡事谢恩。因为这是神在基督耶稣里向你们所定的旨意。","dep242-4-5-4":"我们若认自己的罪，神是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义。","dep242-4-5-5":"应当一无挂虑，只要凡事借着祷告，祈求，和感谢，将你们所要的告诉神。 神所赐出人意外的平安，必在基督耶稣里，保守你们的心怀意念。","dep242-5-1-1":"你们从前远离神的人，如今却在基督耶稣里，靠着他的血，已经得亲近了。","dep242-5-1-2":"既然借着他在十字架上所流的血，成就了和平，便借着他叫万有，无论是地上的，天上的，都与自己和好了。","dep242-5-1-3":"我们将所看见，所听见的，传给你们，使你们与我们相交。我们乃是与父并他儿子耶稣基督相交的。","dep242-5-1-4":"愿主耶稣基督的恩惠，神的慈爱，圣灵的感动，常与你们众人同在。","dep242-5-2-1":"因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间。","dep242-5-2-2":"（大卫上行之诗。）看哪，弟兄和睦同居，是何等的善，何等的美。 又好比黑门的甘露，降在锡安山。因为在那里有耶和华所命定的福，就是永远的生命。","dep242-5-2-3":"总要趁着还有今日，天天彼此相劝，免得你们中间，有人被罪迷惑，心里就刚硬了。","dep242-5-2-4":"两个人总比一个人好，因为二人劳碌同得美好的果效。 若是跌倒，这人可以扶起他的同伴。若是孤身跌倒，没有别人扶起他来。这人就有祸了。","dep242-5-2-5":"你要逃避少年的私欲，同那清心祷告主的人追求公义，信德，仁爱，和平。","dep242-5-2-6":"铁磨铁，磨出刃来。朋友相感，（原文作磨朋友的脸）也是如此。 水中照脸，彼此相符。人与人，心也相对。","dep242-5-2-7":"与智慧人同行的，必得智慧。和愚昧人作伴的，必受亏损。","dep242-5-2-8":"直等到我们众人在真道上同归于一，认识神的儿子，得以长大成人，满有基督长成的身量。","dep242-5-2-9":"都恒心遵守使徒的教训，彼此交接，掰饼，祈祷。 赞美神，得众民的喜爱。主将得救的人，天天加给他们。","dep242-5-3-1":"因为从头一天直到如今，你们是同心合意地兴旺福音。 只要你们行事为人与基督的福音相称。叫我或来见你们，或不在你们那里，可以听见你们的景况，知道你们同有一个心志，站立得稳，为所信的福音齐心努力。","dep242-5-3-2":"又要彼此相顾，激发爱心，勉励行善。 你们不可停止聚会，好像那些停止惯了的人，倒要彼此劝勉。既知道（原文作看见）那日子临近，就更当如此。","dep242-5-3-3":"我可以证明他们是按着力量，而且也过了力量，自己甘心乐意的捐助。 再三地求我们，准他们在这供给圣徒的恩情上有分。","dep242-5-3-4":"倒要欢喜。因为你们是与基督一同受苦，使你们在他荣耀显现的时候，也可以欢喜快乐。","dep242-5-3-5":"你们各人的重担要互相担当，如此就完全了基督的律法。","dep242-5-4-1":"所以在基督里若有什么劝勉，爱心有什么安慰，圣灵有什么交通，心中有什么慈悲怜悯， 你们就要意念相同，爱心相同，有一样的心思，有一样的意念，使我的喜乐可以满足。","dep242-5-4-2":"凡事不可结党，不可贪图虚浮的荣耀。只要存心谦卑，各人看别人比自己强。 各人不要单顾自己的事，也要顾别人的事。","dep242-5-4-3":"你们狭窄，原不在乎我们，是在乎自己的心肠狭窄。 你们狭窄，原不在乎我们，是在乎自己的心肠狭窄。","dep242-5-4-4":"又当存敬畏基督的心，彼此顺服。","dep242-5-4-5":"门徒不作声，因为他们在路上彼此争论谁为大。 耶稣坐下，叫十二个门徒来，说，若有人愿意作首先的，他必作众人末后的，作众人的用人。","dep242-5-4-6":"又要谨慎，恐怕有人失了神的恩。恐怕有毒根生出来扰乱你们，因此叫众人沾染污秽。","dep242-5-4-7":"那暗昧无益的事，不要与人同行，倒要责备行这事的人","dep242-5-4-8":"凡在军中当兵的，不将世务缠身，好叫那招他当兵的人喜悦。","dep242-5-5-9":"所以你在祭坛上献礼物的时候，若想起弟兄向你怀怨， 就把礼物留在坛前，先去同弟兄和好，然后来献礼物。","dep242-5-5-1":"倘若你的弟兄得罪你，你就去趁着只有他和你在一处的时候，指出他的错来。他若听你，你便得了你的弟兄。","dep242-5-5-2":"我们若认自己的罪，神是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义。","dep242-5-5-3":"遮掩自己罪过的，必不亨通。承认离弃罪过的，必蒙怜恤。","dep242-6-1-1":"但圣灵降临在你们身上，你们就必得着能力。并要在耶路撒冷，犹太全地，和撒玛利亚，直到地极，作我的见证。","dep242-6-1-2":"一切都是出于神，他借着基督使我们与他和好，又将劝人与他和好的职分赐给我们。 这就是神在基督里叫世人与自己和好，不将他们的过犯归到他们身上。并且将这和好的道理托付了我们。","dep242-6-2-1":"我在神面前，并在将来审判活人死人的基督耶稣面前，凭着他的显现和他的国度嘱咐你。 务要传道。无论得时不得时，总要专心，并用百般的忍耐，各样的教训，责备人，警戒人，劝勉人。","dep242-6-2-2":"人子来，为要寻找拯救失丧的人。","dep242-6-2-3":"但神既然验中了我们，把福音托付我们，我们就照样讲，不是要讨人喜欢，乃是要讨那察验我们心的神喜欢。","dep242-6-2-4":"我传福音原没有可夸的。因为我是不得已的。若不传福音，我便有祸了。","dep242-6-2-5":"然而人未曾信他，怎能求他呢？未曾听见他，怎能信他呢？没有传道的，怎能听见呢？","dep242-6-2-6":"他愿意万人得救，明白真道。","dep242-6-2-7":"耶和华说，这蓖麻不是你栽种的，也不是你培养的。一夜发生，一夜干死，你尚且爱惜。 何况这尼尼微大城，其中不能分辨左手右手的有十二万多人，并有许多牲畜。我岂能不爱惜呢？","dep242-6-2-8":"我告诉你们，一个罪人悔改，在天上也要这样为他欢喜，较比为九十九个不用悔改的义人，欢喜更大。","dep242-6-2-9":"我们将所看见，所听见的，传给你们，使你们与我们相交。我们乃是与父并他儿子耶稣基督相交的。","dep242-6-2-10":"智慧人必发光如同天上的光。那使多人归义的，必发光如星，直到永永远远。","dep242-6-3-1":"耶稣对他们说，来跟从我，我要叫你们得人如得鱼一样。","dep242-6-3-2":"使你们无可指摘，诚实无伪，在这弯曲悖谬的世代，作神无瑕疵的儿女。你们显在这世代中，好像明光照耀， 将生命的道表明出来，叫我在基督的日子，好夸我没有空跑，也没有徒劳。","dep242-6-3-3":"也为我祈求，使我得着口才，能以放胆，开口讲明福音的奥秘，","dep242-6-3-4":"只要心里尊主基督为圣。有人问你们心中盼望的缘由，就要常作准备，以温柔敬畏的心回答各人。","dep242-6-3-5":"那城里有好些撒玛利亚人信了耶稣，因为那妇人作见证说，他将我素来所行的一切事，都给我说出来了。","dep242-6-3-6":"神的道是活泼的，是有功效的，比一切两刃的剑更快，甚至魂与灵，骨节与骨髓，都能刺入剖开，连心中的思念和主意，都能辨明。","dep242-6-3-7":"我口所出的话，也必如此，决不徒然返回，却要成就我所喜悦的，在我发他去成就的事上（发他去成就或作所命定）必然亨通。","dep242-6-3-8":"我们却是传钉十字架的基督，在犹太人为绊脚石，在外邦人为愚拙。 但在那蒙召的无论是犹太人，希利尼人，基督总为神的能力，神的智慧。","dep242-6-3-9":"因为我们的福音传到你们那里，不独在乎言语，也在乎权能和圣灵，并充足的信心，正如你们知道我们在你们那里，为你们的缘故是怎样为人。","dep242-6-3-10":"你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。 因为人心里相信，就可以称义。口里承认，就可以得救。","dep242-6-3-11":"因为他说，在悦纳的时候，我应允了你。在拯救的日子，我搭救了你。看哪，现在正是悦纳的时候，现在正是拯救的日子。","dep242-6-3-12":"你们总要自己省察有信心没有。也要自己试验。岂不知你们若不是可弃绝的，就有耶稣基督在你们心里吗？","dep242-6-3-13":"保罗照他素常的规矩进去，一连三个安息日，本着圣经与他们辩论， 讲解陈明基督必须受害，从死里复活。又说，我所传与你们的这位耶稣，就是基督。","dep242-6-4-1":"我却不以性命为念，也不看为宝贵，只要行完我的路程，成就我从主耶稣所领受的职事，证明神恩惠的福音。","dep242-6-4-2":"圣灵对腓利说，你去贴近那车走。 腓利就跑到太监那里，听见他念先知以赛亚的书，便问他说，你所念的，你明白吗？","dep242-6-4-3":"我们所看见所听见的，不能不说。","dep242-6-5-1":"神就照着自己的形像造人，乃是照着他的形像造男造女。","dep242-6-5-2":"耶和华的膀臂，并非缩短不能拯救。耳朵，并非发沉不能听见。 但你们的罪孽使你们与神隔绝，你们的罪恶使他掩面不听你们。","dep242-6-5-3":"这就如罪是从一人入了世界，死又是从罪来的，于是死就临到众人，因为众人都犯了罪。","dep242-6-5-4":"因为世人都犯了罪，亏缺了神的荣耀。","dep242-6-5-5":"按着定命，人人都有一死，死后且有审判。","dep242-6-5-6":"要报应那不认识神，和那不听从我主耶稣福音的人。 他们要受刑罚，就是永远沉沦，离开主的面和他权能的荣光。","dep242-6-5-7":"因为罪的工价乃是死。惟有神的恩赐，在我们的主基督耶稣里乃是永生。","dep242-6-5-8":"惟有胆怯的，不信的，可憎的，杀人的，淫乱的，行邪术的，拜偶像的，和一切说谎话的，他们的分就在烧着硫磺的火湖里。这是第二次的死。","dep242-6-5-9":"你们得救是本乎恩，也因着信，这并不是出于自己，乃是神所赐的。 也不是出于行为，免得有人自夸。","dep242-6-5-10":"我不废掉神的恩。义若是借着律法得的，基督就是徒然死了。","dep242-6-5-11":"除他以外，别无拯救。因为在天下人间，没有赐下别的名，我们可以靠着得救。","dep242-6-5-12":"知道你们得赎，脱去你们祖宗所传流虚妄的行为，不是凭着能坏的金银等物。","dep242-6-5-13":"犹太人是要神迹，希利尼人是求智慧。 我们却是传钉十字架的基督，在犹太人为绊脚石，在外邦人为愚拙。","dep242-6-5-14":"世人凭自己的智慧，既不认识神，神就乐意用人所当作愚拙的道理，拯救那些信的人。这就是神的智慧了。","dep242-6-5-15":"你们要谨慎，恐怕有人用他的理学，和虚空的妄言，不照着基督，乃照人间的遗传，和世上的小学，就把你们掳去。","dep242-6-5-16":"这等人不是从血气生的，不是从情欲生的，也不是从人意生的，乃是从神生的。","dep242-6-5-17":"从肉身生的，就是肉身。从灵生的，就是灵。 我说，你们必须重生，你不要以为希奇。","dep242-6-5-18":"叫人活着的乃是灵，肉体是无益的。我对你们所说的话，就是灵，就是生命。","dep242-6-5-19":"因基督也曾一次为罪受苦（受苦有古卷作受死），就是义的代替不义的，为要引我们到神面前。按着肉体说他被治死。按着灵性说他复活了。","dep242-6-5-20":"神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。","dep242-6-5-21":"惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。","dep242-6-5-22":"我当日所领受又传给你们的，第一，就是基督照圣经所说，为我们的罪死了。 而且埋葬了。又照圣经所说，第三天复活了。","dep242-6-5-23":"你们从前在过犯，和未受割礼的肉体中死了，神赦免了你们（或作我们）一切过犯，便叫你们与基督一同活过来。","dep242-6-5-24":"我实实在在地告诉你们，那听我话，又信差我来者的，就有永生，不至于定罪，是已经出死入生了。","dep242-6-5-25":"凡接待他的，就是信他名的人，他就赐他们权柄，作神的儿女。","dep242-6-5-26":"看哪，我站在门外叩门。若有听见我声音就开门的，我要进到他那里去，我与他，他与我一同坐席。","dep242-6-5-27":"你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。 因为人心里相信，就可以称义。口里承认，就可以得救。","dep242-7-1-1":"这道太初与神同在。 万物是借着他造的。凡被造的，没有一样不是借着他造的。","dep242-7-1-2":"因为万有都是靠他造的，无论是天上的，地上的，能看见的，不能看见的，或是有位的，主治的，执政的，掌权的，一概都是借着他造的，又是为他造的。 他在万有之先，万有也靠他而立。","dep242-7-1-3":"他也是教会全体之首。他是元始，是从死里首先复生的，使他可以在凡事上居首位。","dep242-7-1-4":"远超过一切执政的，掌权的，有能的，主治的，和一切有名的。不但是今世的，连来世的也都超过了。","dep242-7-1-5":"叫一切在天上的，地上的，和地底下的，因耶稣的名，无不屈膝， 无不口称耶稣基督为主，使荣耀归与父神。","dep242-7-1-6":"因此基督死了，又活了，为要作死人并活人的主。","dep242-7-1-7":"岂不知你们的身子就是圣灵的殿吗？这圣灵是从神而来，住在你们里头的。并且你们不是自己的人。 因为你们是重价买来的。所以要在你们的身子上荣耀神。","dep242-7-1-8":"并且他替众人死，是叫那些活着的人，不再为自己活，乃为替他们死而复活的主活。","dep242-7-2-1":"你们要先求他的国和他的义。这些东西都要加给你们了。","dep242-7-2-2":"耶稣说，我实在告诉你们，人为我和福音，撇下房屋，或是弟兄，姐妹，父母，儿女，田地。 没有不在今世得百倍的，就是房屋，弟兄，姐妹，母亲，儿女，田地，并且要受逼迫。在来世必得永生。","dep242-7-2-3":"耶和华说，你既行了这事，不留下你的儿子，就是你独生的儿子，我便指着自己起誓说， 论福，我必赐大福给你。论子孙，我必叫你的子孙多起来，如同天上的星，海边的沙。你子孙必得着仇敌的城门，","dep242-7-2-4":"我儿所罗门哪，你当认识耶和华你父的神，诚心乐意地事奉他。因为他鉴察众人的心，知道一切心思意念。你若寻求他，他必使你寻见。你若离弃他，他必永远丢弃你。","dep242-7-2-5":"耶和华的眼目遍察全地，要显大能帮助向他心存诚实的人。你这事行得愚昧。此后，你必有争战的事。","dep242-7-2-6":"神说，因为他专心爱我，我就要搭救他。因为他知道我的名，我要把他安置在高处。","dep242-7-2-7":"因此，耶和华以色列的神说，我曾说，你和你父家必永远行在我面前。现在我却说，决不容你们这样行。因为尊重我的，我必重看他。藐视我的，他必被轻视。","dep242-7-3-1":"耶稣又对众人说，若有人要跟从我，就当舍己，天天背起他的十字架来，跟从我。","dep242-7-3-2":"人所行的若蒙耶和华喜悦，耶和华也使他的仇敌与他和好。","dep242-7-3-3":"你要专心仰赖耶和华，不可倚靠自己的聪明。 在你一切所行的事上，都要认定他，他必指引你的路。","dep242-7-3-4":"就要脱去你们从前行为上的旧人。这旧人是因私欲的迷惑，渐渐变坏的。 并且穿上新人。这新人是照着神的形像造的，有真理的仁义，和圣洁。","dep242-7-3-5":"你要逃避少年的私欲，同那清心祷告主的人追求公义，信德，仁爱，和平。","dep242-7-3-6":"因为我们没有带什么到世上来，也不能带什么去。 但那些想要发财的人，就陷在迷惑，落在网罗，和许多无知有害的私欲里，叫人沉在败坏和灭亡中。","dep242-7-3-7":"你们要谨慎行事，不要像愚昧人，当像智慧人。 要爱惜光阴，因为现今的世代邪恶。","dep242-7-3-8":"耶稣随即招呼他们。他们就把父亲西庇太，和雇工人留在船上，跟从耶稣去了。","dep242-7-4-1":"照着我所切慕所盼望的，没有一事叫我羞愧，只要凡事放胆。无论是生，是死，总叫基督在我身上照常显大。","dep242-7-4-2":"别人都求自己的事，并不求耶稣基督的事。 但你们知道提摩太的明证，他兴旺福音与我同劳，待我像儿子待父亲一样。","dep242-7-4-3":"又有人忍受戏弄，鞭打，捆锁，监禁，各等的磨炼。 在旷野，山岭，山洞，地穴，飘流无定。本是世界不配有的人。","dep242-8-1":"我必叫你成为大国，我必赐福给你，叫你的名为大，你也要叫别人得福。 为你祝福的，我必赐福与他。那咒诅你的，我必咒诅他，地上的万族都要因你得福。","dep242-8-2":"现在他说，你作我的仆人，使雅各众支派复兴，使以色列中得保全的归回，尚为小事，我还要使你作外邦人的光，叫你施行我的救恩，直到地极。","dep242-8-3":"所以你们要去，使万民作我的门徒，奉父子圣灵的名，给他们施洗。（或作给他们施洗归于父子圣灵的名） 凡我所吩咐你们的，都教训他们遵守，我就常与你们同在，直到世界的末了。","dep242-8-4":"但圣灵降临在你们身上，你们就必得着能力。并要在耶路撒冷，犹太全地，和撒玛利亚，直到地极，作我的见证。","dep242-8-5":"我又听见主的声音，说，我可以差遣谁呢？谁肯为我们去呢？我说，我在这里，请差遣我。","dep242-8-6":"使我为外邦人作基督耶稣的仆役，作神福音的祭司，叫所献上的外邦人，因着圣灵，成为圣洁，可蒙悦纳。","dep242-8-7":"你求我，我就将列国赐你为基业，将地极赐你为田产。","dep242-8-8":"神阿，愿你崇高，过于诸天。愿你的荣耀，高过全地。","dep242-8-9":"盼望那无谎言的神在万古之先所应许的永生， 到了日期，借着传扬的工夫，把他的道显明了。这传扬的责任，是按着神我们救主的命令交托了我。","dep242-8-10":"惟有主站在我旁边，加给我力量，使福音被我尽都传明，叫外邦人都听见。我也从狮子口里被救出来。","dep242-8-11":"我们传扬他，是用诸般的智慧，劝戒各人，教导各人。要把各人在基督里完完全全的引到神面前。 我也为此劳苦，照着他在我里面运用的大能，尽心竭力。","dep242-8-12":"我所祷告的，就是要你们的爱心，在知识和各样见识上，多而又多。 并靠着耶稣基督结满了仁义的果子，叫荣耀称赞归与神。","dep242-8-13":"你在许多见证人面前听见我所教训的，也要交托那忠心能教导别人的人。","dep242-8-14":"至小的族要加增千倍，微弱的国必成为强盛。我耶和华要按定期速成这事。","dep242-8-15":"我们既有这许多的见证人，如同云彩围着我们，就当放下各样的重担，脱去容易缠累我们的罪，存心忍耐，奔那摆在我们前头的路程，","dep242-8-16":"耶和华的眼目遍察全地，要显大能帮助向他心存诚实的人。你这事行得愚昧。此后，你必有争战的事。","dep242-8-17":"认识耶和华荣耀的知识，要充满遍地，好像水充满洋海一般。","dep242-8-18":"万军之耶和华说，从日出之地到日落之处，我的名在外邦中必尊为大。在各处，人必奉我的名烧香，献洁净的供物。因为我的名在外邦中必尊为大。"},"esp":{"assurance-1":"Y este es el testimonio: que Dios nos ha dado vida eterna y esta vida está en su Hijo. El que tiene al Hijo tiene la vida; el que no tiene al Hijo de Dios no tiene la vida.","assurance-2":"Hasta ahora nada habéis pedido en mi nombre; pedid, y recibiréis, para que vuestro gozo sea completo.","assurance-3":"No os ha sobrevenido ninguna prueba que no sea humana; pero fiel es Dios, que no os dejará ser probados más de lo que podéis resistir, sino que dará también juntamente con la prueba la salida, para que podáis soportarla.","assurance-4":"Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados y limpiarnos de toda maldad.","assurance-5":"\"Confía en Jehová con todo tu corazón y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos y él hará derechas tus veredas.","living-1":"\"Yo soy la vid, vosotros los pámpanos; el que permanece en mí y yo en él, este lleva mucho fruto, porque separados de mí nada podéis hacer.","living-2":"\"Y ahora, hermanos, os encomiendo a Dios y a la palabra de su gracia, que tiene poder para sobreedificaros y daros herencia con todos los santificados.","living-3":"Todos los que son guiados por el Espíritu de Dios, son hijos de Dios,","living-4":"(porque por fe andamos, no por vista).","living-5":"Amados, si Dios así nos ha amado, también debemos amarnos unos a otros.","living-6":"Pero si andamos en luz, como él está en luz, tenemos comunión unos con otros y la sangre de Jesucristo, su Hijo, nos limpia de todo pecado.","living-7":"Al contrario, santificad a Dios el Señor en vuestros corazones, y estad siempre preparados para presentar defensa con mansedumbre y reverencia ante todo el que os demande razón de la esperanza que hay en vosotros.","living-8":"Cada uno dé como propuso en su corazón: no con tristeza ni por obligación, porque Dios ama al dador alegre.","tms60-A-1":"De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; todas son hechas nuevas.","tms60-A-2":"Con Cristo estoy juntamente crucificado, y ya no vivo yo, mas vive Cristo en mí; y lo que ahora vivo en la carne, lo vivo en la fe del Hijo de Dios, el cual me amó y se entregó a sí mismo por mí.","tms60-A-3":"Por lo tanto, hermanos, os ruego por las misericordias de Dios que presentéis vuestros cuerpos como sacrificio vivo, santo, agradable a Dios, que es vuestro verdadero culto.","tms60-A-4":"El que tiene mis mandamientos y los guarda, ese es el que me ama; y el que me ama será amado por mi Padre, y yo lo amaré y me manifestaré a él.","tms60-A-5":"Toda la Escritura es inspirada por Dios y útil para enseñar, para redargüir, para corregir, para instruir en justicia,","tms60-A-6":"Nunca se apartará de tu boca este libro de la Ley, sino que de día y de noche meditarás en él, para que guardes y hagas conforme a todo lo que está escrito en él, porque entonces harás prosperar tu camino y todo te saldrá bien.","tms60-A-7":"Si permanecéis en mí y mis palabras permanecen en vosotros, pedid todo lo que queráis y os será hecho.","tms60-A-8":"Por nada estéis angustiados, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias. Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús.","tms60-A-9":"porque donde están dos o tres congregados en mi nombre, allí estoy yo en medio de ellos.","tms60-A-10":"Y considerémonos unos a otros para estimularnos al amor y a las buenas obras, no dejando de congregarnos, como algunos tienen por costumbre, sino exhortándonos; y tanto más, cuanto veis que aquel día se acerca.","tms60-A-11":"Y les dijo: —Venid en pos de mí, y os haré pescadores de hombres.","tms60-A-12":"No me avergüenzo del evangelio, porque es poder de Dios para salvación de todo aquel que cree, del judío primeramente y también del griego,","tms60-B-1":"por cuanto todos pecaron y están destituidos de la gloria de Dios,","tms60-B-2":"Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino; mas Jehová cargó en él el pecado de todos nosotros.","tms60-B-3":"porque la paga del pecado es muerte, pero la dádiva de Dios es vida eterna en Cristo Jesús, Señor nuestro.","tms60-B-4":"Y de la manera que está establecido para los hombres que mueran una sola vez, y después de esto el juicio,","tms60-B-5":"Pero Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros.","tms60-B-6":"Asimismo, Cristo padeció una sola vez por los pecados, el justo por los injustos, para llevarnos a Dios, siendo a la verdad muerto en la carne, pero vivificado en espíritu;","tms60-B-7":"porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios. No por obras, para que nadie se gloríe,","tms60-B-8":"nos salvó, no por obras de justicia que nosotros hubiéramos hecho, sino por su misericordia, por el lavamiento de la regeneración y por la renovación en el Espíritu Santo,","tms60-B-9":"Mas a todos los que lo recibieron, a quienes creen en su nombre, les dio potestad de ser hechos hijos de Dios.","tms60-B-10":"Yo estoy a la puerta y llamo; si alguno oye mi voz y abre la puerta, entraré a él y cenaré con él y él conmigo.","tms60-B-11":"Estas cosas os he escrito a vosotros que creéis en el nombre del Hijo de Dios, para que sepáis que tenéis vida eterna y para que creáis en el nombre del Hijo de Dios.","tms60-B-12":"\"De cierto, de cierto os digo: El que oye mi palabra y cree al que me envió tiene vida eterna, y no vendrá a condenación, sino que ha pasado de muerte a vida.","tms60-C-1":"¿Acaso no sabéis que sois templo de Dios y que el Espíritu de Dios está en vosotros?","tms60-C-2":"Y nosotros no hemos recibido el espíritu del mundo, sino el Espíritu que proviene de Dios, para que sepamos lo que Dios nos ha concedido.","tms60-C-3":"No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo; siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.","tms60-C-4":"Todo lo puedo en Cristo que me fortalece.","tms60-C-5":"Que por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias; nuevas son cada mañana. ¡Grande es tu fidelidad!","tms60-C-6":"Dios no es hombre, para que mienta, ni hijo de hombre para que se arrepienta. ¿Acaso dice y no hace? ¿Acaso promete y no cumple?","tms60-C-7":"Tú guardarás en completa paz a aquel cuyo pensamiento en ti persevera, porque en ti ha confiado.","tms60-C-8":"Echad toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.","tms60-C-9":"El que no escatimó ni a su propio Hijo, sino que lo entregó por todos nosotros, ¿cómo no nos dará también con él todas las cosas?","tms60-C-10":"Mi Dios, pues, suplirá todo lo que os falta conforme a sus riquezas en gloria en Cristo Jesús.","tms60-C-11":"Pues en cuanto él mismo padeció siendo tentado, es poderoso para socorrer a los que son tentados.","tms60-C-12":"¿Con qué limpiará el joven su camino? ¡Con guardar tu palabra! En mi corazón he guardado tus dichos, para no pecar contra ti.","tms60-D-1":"Buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.","tms60-D-2":"Y decía a todos: —Si alguno quiere venir en pos de mí, niéguese a sí mismo, tome su cruz cada día y sígame.","tms60-D-3":"No améis al mundo ni las cosas que están en el mundo. Si alguno ama al mundo, el amor del Padre no está en él, porque nada de lo que hay en el mundo —los deseos de la carne, los deseos de los ojos y la vanagloria de la vida— proviene del Padre, sino del mundo.","tms60-D-4":"No os conforméis a este mundo, sino transformaos por medio de la renovación de vuestro entendimiento, para que comprobéis cuál es la buena voluntad de Dios, agradable y perfecta.","tms60-D-5":"Así que, hermanos míos amados, estad firmes y constantes, creciendo en la obra del Señor siempre, sabiendo que vuestro trabajo en el Señor no es en vano.","tms60-D-6":"Considerad a aquel que sufrió tal contradicción de pecadores contra sí mismo, para que vuestro ánimo no se canse hasta desmayar,","tms60-D-7":"porque el Hijo del hombre no vino para ser servido, sino para servir y para dar su vida en rescate por todos.","tms60-D-8":"No nos predicamos a nosotros mismos, sino a Jesucristo como Señor, y a nosotros como vuestros siervos por amor de Jesús,","tms60-D-9":"\"Honra a Jehová con tus bienes y con las primicias de todos tus frutos; entonces tus graneros estarán colmados con abundancia y tus lagares rebosarán de mosto.","tms60-D-10":"Pero esto digo: El que siembra escasamente, también segará escasamente; y el que siembra generosamente, generosamente también segará. Cada uno dé como propuso en su corazón: no con tristeza ni por obligación, porque Dios ama al dador alegre.","tms60-D-11":"pero recibiréis poder cuando haya venido sobre vosotros el Espíritu Santo, y me seréis testigos en Jerusalén, en toda Judea, en Samaria y hasta lo último de la tierra.","tms60-D-12":"Por tanto, id y haced discípulos a todas las naciones, bautizándolos en el nombre del Padre, del Hijo y del Espíritu Santo, y enseñándoles que guarden todas las cosas que os he mandado. Y yo estoy con vosotros todos los días, hasta el fin del mundo\". Amén.","tms60-E-1":"Un mandamiento nuevo os doy: Que os améis unos a otros; como yo os he amado, que también os améis unos a otros. En esto conocerán todos que sois mis discípulos, si tenéis amor los unos por los otros.","tms60-E-2":"Hijitos míos, no amemos de palabra ni de lengua, sino de hecho y en verdad.","tms60-E-3":"Nada hagáis por rivalidad o por vanidad; antes bien, con humildad, estimando cada uno a los demás como superiores a él mismo. No busquéis vuestro propio provecho, sino el de los demás.","tms60-E-4":"Igualmente, jóvenes, estad sujetos a los ancianos; y todos, sumisos unos a otros, revestíos de humildad, porque \"Dios resiste a los soberbios, y da gracia a los humildes\". Humillaos, pues, bajo la poderosa mano de Dios, para que él os exalte a su debido tiempo.","tms60-E-5":"Pero fornicación y toda impureza o avaricia, ni aun se nombre entre vosotros, como conviene a santos.","tms60-E-6":"Amados, yo os ruego como a extranjeros y peregrinos, que os abstengáis de los deseos carnales que batallan contra el alma.","tms60-E-7":"\"No robaréis, no mentiréis ni os engañaréis el uno al otro.","tms60-E-8":"Por esto procuro tener siempre una conciencia sin ofensa ante Dios y ante los hombres.","tms60-E-9":"Pero sin fe es imposible agradar a Dios, porque es necesario que el que se acerca a Dios crea que él existe y que recompensa a los que lo buscan.","tms60-E-10":"Tampoco dudó, por incredulidad, de la promesa de Dios, sino que se fortaleció por la fe, dando gloria a Dios, plenamente convencido de que era también poderoso para hacer todo lo que había prometido.","tms60-E-11":"No nos cansemos, pues, de hacer bien, porque a su tiempo segaremos, si no desmayamos. Así que, según tengamos oportunidad, hagamos bien a todos, y especialmente a los de la familia de la fe.","tms60-E-12":"Así alumbre vuestra luz delante de los hombres, para que vean vuestras buenas obras y glorifiquen a vuestro Padre que está en los cielos.","tms180-s1-1-1":"En el principio era el Verbo, el Verbo estaba con Dios y el Verbo era Dios. Y el Verbo se hizo carne y habitó entre nosotros lleno de gracia y de verdad; y vimos su gloria, gloria como del unigénito del Padre.","tms180-s1-1-2":"Pero del Hijo dice: \"Tu trono, Dios, por los siglos de los siglos. Cetro de equidad es el cetro de tu Reino.","tms180-s1-1-3":"No tenemos un Sumo sacerdote que no pueda compadecerse de nuestras debilidades, sino uno que fue tentado en todo según nuestra semejanza, pero sin pecado.","tms180-s1-1-4":"Y Jesús crecía en sabiduría, en estatura y en gracia para con Dios y los hombres.","tms180-s1-1-5":"Primeramente os he enseñado lo que asimismo recibí: Que Cristo murió por nuestros pecados, conforme a las Escrituras; que fue sepultado y que resucitó al tercer día, conforme a las Escrituras;","tms180-s1-1-6":"Pero ahora Cristo ha resucitado de los muertos; primicias de los que murieron es hecho,","tms180-s1-1-7":"A Dios nadie lo ha visto jamás; el unigénito Hijo, que está en el seno del Padre, él lo ha dado a conocer.","tms180-s1-1-8":"Él, que es el resplandor de su gloria, la imagen misma de su sustancia y quien sustenta todas las cosas con la palabra de su poder, habiendo efectuado la purificación de nuestros pecados por medio de sí mismo, se sentó a la diestra de la Majestad en las alturas,","tms180-s1-1-9":"porque el Hijo del hombre vino a buscar y a salvar lo que se había perdido.","tms180-s1-1-10":"pues ya sabéis que fuisteis rescatados de vuestra vana manera de vivir (la cual recibisteis de vuestros padres) no con cosas corruptibles, como oro o plata, sino con la sangre preciosa de Cristo, como de un cordero sin mancha y sin contaminación.","tms180-s1-1-11":"El Señor mismo, con voz de mando, con voz de arcángel y con trompeta de Dios, descenderá del cielo. Entonces, los muertos en Cristo resucitarán primero. Luego nosotros, los que vivimos, los que hayamos quedado, seremos arrebatados juntamente con ellos en las nubes para recibir al Señor en el aire, y así estaremos siempre con el Señor.","tms180-s1-1-12":"Amados, ahora somos hijos de Dios y aún no se ha manifestado lo que hemos de ser; pero sabemos que cuando él se manifieste, seremos semejantes a él, porque lo veremos tal como él es. Y todo aquel que tiene esta esperanza en él, se purifica a sí mismo, así como él es puro.","tms180-s1-2-1":"Pero cuando venga el Espíritu de verdad, él os guiará a toda la verdad, porque no hablará por su propia cuenta, sino que hablará todo lo que oiga y os hará saber las cosas que habrán de venir. Él me glorificará, porque tomará de lo mío y os lo hará saber.","tms180-s1-2-2":"Por tanto, os hago saber que nadie que hable por el Espíritu de Dios dice de Jesús: \"¡Sea anatema!\", como tampoco nadie puede exclamar: \"¡Jesús es el Señor!\", sino por el Espíritu Santo.","tms180-s1-2-3":"Pero vosotros no vivís según la carne, sino según el Espíritu, si es que el Espíritu de Dios está en vosotros. Y si alguno no tiene el Espíritu de Cristo, no es de él.","tms180-s1-2-4":"Y por cuanto sois hijos, Dios envió a vuestros corazones el Espíritu de su Hijo, el cual clama: \"¡Abba, Padre!\"","tms180-s1-2-5":"No os embriaguéis con vino, en lo cual hay disolución; antes bien sed llenos del Espíritu,","tms180-s1-2-6":"Digo, pues: Andad en el Espíritu, y no satisfagáis los deseos de la carne,","tms180-s1-2-7":"Antes bien, como está escrito: \"Cosas que ojo no vio ni oído oyó ni han subido al corazón del hombre, son las que Dios ha preparado para los que lo aman\". Pero Dios nos las reveló a nosotros por el Espíritu, porque el Espíritu todo lo escudriña, aun lo profundo de Dios,","tms180-s1-2-8":"Pero el Consolador, el Espíritu Santo, a quien el Padre enviará en mi nombre, él os enseñará todas las cosas y os recordará todo lo que yo os he dicho.","tms180-s1-2-9":"y ni mi palabra ni mi predicación fueron con palabras persuasivas de humana sabiduría, sino con demostración del Espíritu y de poder, para que vuestra fe no esté fundada en la sabiduría de los hombres, sino en el poder de Dios.","tms180-s1-2-10":"pues nuestro evangelio no llegó a vosotros en palabras solamente, sino también en poder, en el Espíritu Santo y en plena certidumbre. Bien sabéis cómo nos portamos entre vosotros por amor de vosotros.","tms180-s1-2-11":"Pero todas estas cosas las hace uno y el mismo Espíritu, repartiendo a cada uno en particular como él quiere.","tms180-s1-2-12":"Ahora bien, hay diversidad de dones, pero el Espíritu es el mismo. Y hay diversidad de actividades, pero Dios, que hace todas las cosas en todos, es el mismo.","tms180-s1-3-1":"\"¡Ah, Señor Jehová!, tú hiciste el cielo y la tierra con tu gran poder y con tu brazo extendido. Nada hay que sea difícil para ti.","tms180-s1-3-2":"¡Profundidad de las riquezas, de la sabiduría y del conocimiento de Dios! ¡Cuán insondables son sus juicios e inescrutables sus caminos!,","tms180-s1-3-3":"¿Se ocultará alguno, dice Jehová, en escondrijos donde yo no lo vea? ¿No lleno yo, dice Jehová, el cielo y la tierra?","tms180-s1-3-4":"Y poderoso es Dios para hacer que abunde en vosotros toda gracia, a fin de que, teniendo siempre en todas las cosas todo lo necesario, abundéis para toda buena obra;","tms180-s1-3-5":"Tuya es, Jehová, la magnificencia y el poder, la gloria, la victoria y el honor; porque todas las cosas que están en los cielos y en la tierra son tuyas. Tuyo, Jehová, es el reino, y tú eres excelso sobre todos. Ahora pues, Dios nuestro, nosotros alabamos y loamos tu glorioso nombre.","tms180-s1-3-6":"Pero fiel es el Señor, que os afirmará y guardará del mal.","tms180-s1-3-7":"Dios es Espíritu, y los que lo adoran, en espíritu y en verdad es necesario que lo adoren.","tms180-s1-3-8":"sino, así como aquel que os llamó es santo, sed también vosotros santos en toda vuestra manera de vivir, porque escrito está: \"Sed santos, porque yo soy santo\".","tms180-s1-3-9":"Gra
