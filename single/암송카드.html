 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요","en":null}},{"id":"dep242-5-5-3","collectionId":"dep242","sectionId":"5","subsectionId":"5-5","number":3,"code":"5-5-3","title":"2-2. 하나님과의 관계","ref":{"book":"Prov","chapter":28,"verses":[{"start":13}]},"texts":{"ko":"자기의 죄를 숨기는 자는 형통치 못하나 죄를 자복하고 버리는 자는 불쌍히 여김을 받으리라","en":null}},{"id":"dep242-6-1-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-1","number":1,"code":"6-1-1","title":"모든 그리스도인","ref":{"book":"Acts","chapter":1,"verses":[{"start":8}]},"texts":{"ko":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","en":null}},{"id":"dep242-6-1-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-1","number":2,"code":"6-1-2","title":"모든 그리스도인","ref":{"book":"2Cor","chapter":5,"verses":[{"start":18,"end":19}]},"texts":{"ko":"모든 것이 하나님께로 났나니 저가 그리스도로 말미암아 우리를 자기와 화목하게 하시고 또 우리에게 화목하게 하는 직책을 주셨으니 이는 하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며 저희의 죄를 저희에게 돌리지 아니하시고 화목하게 하는 말씀을 우리에게 부탁하셨느니라","en":null}},{"id":"dep242-6-2-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":1,"code":"6-2-1","title":"하나님의 명령","ref":{"book":"2Tim","chapter":4,"verses":[{"start":1,"end":2}]},"texts":{"ko":"하나님 앞과 산 자와 죽은 자를 심판하실 그리스도 예수 앞에서 그의 나타나실 것과 그의 나라를 두고 엄히 명하노니 너는 말씀을 전파하라 때를 얻든지 못 얻든지 항상 힘쓰라 범사에 오래 참음과 가르침으로 경책하며 경계하며 권하라","en":null}},{"id":"dep242-6-2-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":2,"code":"6-2-2","title":"잃어버린 자에 대한 사랑","ref":{"book":"Luke","chapter":19,"verses":[{"start":10}]},"texts":{"ko":"인자의 온 것은 잃어버린 자를 찾아 구원하려 함이니라","en":null}},{"id":"dep242-6-2-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":3,"code":"6-2-3","title":"복음 전할 부탁을 받음","ref":{"book":"1Thess","chapter":2,"verses":[{"start":4}]},"texts":{"ko":"오직 하나님의 옳게 여기심을 입어 복음 전할 부탁을 받았으니 우리가 이와 같이 말함은 사람을 기쁘게 하려 함이 아니요 오직 우리 마음을 감찰하시는 하나님을 기쁘시게 하려 함이라","en":null}},{"id":"dep242-6-2-4","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":4,"code":"6-2-4","title":"부득불 할 일이므로","ref":{"book":"1Cor","chapter":9,"verses":[{"start":16}]},"texts":{"ko":"내가 복음을 전할찌라도 자랑할 것이 없음은 내가 부득불 할 일임이라 만일 복음을 전하지 아니하면 내게 화가 있을 것임이로라","en":null}},{"id":"dep242-6-2-5","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":5,"code":"6-2-5","title":"전파해야 믿게 되므로","ref":{"book":"Rom","chapter":10,"verses":[{"start":14}]},"texts":{"ko":"그런즉 저희가 믿지 아니하는 이를 어찌 부르리요 듣지도 못한 이를 어찌 믿으리요 전파하는 자가 없이 어찌 들으리요","en":null}},{"id":"dep242-6-2-6","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":6,"code":"6-2-6","title":"모든 사람이 구원받길 원하시므로","ref":{"book":"1Tim","chapter":2,"verses":[{"start":4}]},"texts":{"ko":"하나님은 모든 사람이 구원을 받으며 진리를 아는데 이르기를 원하시느니라","en":null}},{"id":"dep242-6-2-7","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":7,"code":"6-2-7","title":"사람을 가장 아끼시므로","ref":{"book":"Jonah","chapter":4,"verses":[{"start":10,"end":11}]},"texts":{"ko":"여호와께서 가라사대 네가 수고도 아니하였고 배양도 아니하였고 하룻밤에 났다가 하룻밤에 망한 이 박 넝쿨을 네가 아꼈거든 하물며 이 큰 성읍, 니느웨에는 좌우를 분변치 못하는 자가 십 이만 여명이요 육축도 많이 있나니 내가 아끼는 것이 어찌 합당치 아니하냐","en":null}},{"id":"dep242-6-2-8","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":8,"code":"6-2-8","title":"죄인 하나의 회개를 기뻐하시므로","ref":{"book":"Luke","chapter":15,"verses":[{"start":7}]},"texts":{"ko":"내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라","en":null}},{"id":"dep242-6-2-9","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":9,"code":"6-2-9","title":"주 안에서의 축복된 교제를 위해","ref":{"book":"1John","chapter":1,"verses":[{"start":3}]},"texts":{"ko":"우리가 보고 들은 바를 너희에게도 전함은 너희로 우리와 사귐이 있게 하려 함이니 우리의 사귐은 아버지와 그 아들 예수 그리스도와 함께 함이라","en":null}},{"id":"dep242-6-2-10","collectionId":"dep242","sectionId":"6","subsectionId":"6-2","number":10,"code":"6-2-10","title":"영원한 영광이 있음","ref":{"book":"Dan","chapter":12,"verses":[{"start":3}]},"texts":{"ko":"지혜 있는 자는 궁창의 빛과 같이 빛날 것이요 많은 사람을 옳은데로 돌아오게 한 자는 별과 같이 영원토록 비취리라","en":null}},{"id":"dep242-6-3-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":1,"code":"6-3-1","title":"먼저 주님을 따를 것","ref":{"book":"Matt","chapter":4,"verses":[{"start":19}]},"texts":{"ko":"말씀하시되 나를 따라 오너라 내가 너희로 사람을 낚는 어부가 되게 하리라 하시니","en":null}},{"id":"dep242-6-3-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":2,"code":"6-3-2","title":"선한 간증의 삶을 살 것","ref":{"book":"Phil","chapter":2,"verses":[{"start":15,"end":16}]},"texts":{"ko":"이는 너희가 흠이 없고 순전하여 어그러지고 거스리는 세대 가운데서 하나님의 흠 없는 자녀로 세상에서 그들 가운데 빛들로 나타내며 생명의 말씀을 밝혀 나의 달음질도 헛되지 아니하고 수고도 헛되지 아니함으로 그리스도의 날에 나로 자랑할 것이 있게 하려 함이라","en":null}},{"id":"dep242-6-3-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":3,"code":"6-3-3","title":"기도할 것","ref":{"book":"Eph","chapter":6,"verses":[{"start":19}]},"texts":{"ko":"또 나를 위하여 구할 것은 내게 말씀을 주사 나로 입을 벌려 복음의 비밀을 담대히 알리게 하옵소서 할 것이니","en":null}},{"id":"dep242-6-3-4","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":4,"code":"6-3-4","title":"대답할 것을 예비할 것","ref":{"book":"1Pet","chapter":3,"verses":[{"start":15}]},"texts":{"ko":"너희 마음에 그리스도를 주로 삼아 거룩하게 하고 너희 속에 있는 소망에 관한 이유를 묻는 자에게는 대답할 것을 항상 예비하되 온유와 두려움으로 하고","en":null}},{"id":"dep242-6-3-5","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":5,"code":"6-3-5","title":"간증을 사용할 것","ref":{"book":"John","chapter":4,"verses":[{"start":39}]},"texts":{"ko":"여자의 말이 그가 나의 행한 모든 것을 내게 말하였다 증거하므로 그 동네 중에 많은 사마리아인이 예수를 믿는지라","en":null}},{"id":"dep242-6-3-6","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":6,"code":"6-3-6","title":"말씀의 능력을 믿고 전할 것","ref":{"book":"Heb","chapter":4,"verses":[{"start":12}]},"texts":{"ko":"하나님의 말씀은 살았고 운동력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 감찰하나니","en":null}},{"id":"dep242-6-3-7","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":7,"code":"6-3-7","title":"말씀의 결과를 믿고 전할 것","ref":{"book":"Isa","chapter":55,"verses":[{"start":11}]},"texts":{"ko":"내 입에서 나가는 말도 헛되이 내게로 돌아오지 아니하고 나의 뜻을 이루며 나의 명하여 보낸 일에 형통하리라","en":null}},{"id":"dep242-6-3-8","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":8,"code":"6-3-8","title":"전도의 초점을 예수님께 둘 것","ref":{"book":"1Cor","chapter":1,"verses":[{"start":23,"end":24}]},"texts":{"ko":"우리는 십자가에 못 박힌 그리스도를 전하니 유대인에게는 거리끼는 것이요 이방인에게는 미련한 것이로되 오직 부르심을 입은 자들에게는 유대인이나 헬라인이나 그리스도는 하나님의 능력이요 하나님의 지혜니라","en":null}},{"id":"dep242-6-3-9","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":9,"code":"6-3-9","title":"능력과 확신으로 전할 것","ref":{"book":"1Thess","chapter":1,"verses":[{"start":5}]},"texts":{"ko":"이는 우리 복음이 말로만 너희에게 이른 것이 아니라 오직 능력과 성령과 큰 확신으로 된 것이니 우리가 너희 가운데서 너희를 위하여 어떠한 사람이 된 것은 너희 아는 바와 같으니라","en":null}},{"id":"dep242-6-3-10","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":10,"code":"6-3-10","title":"영접하도록 도울 것","ref":{"book":"Rom","chapter":10,"verses":[{"start":9,"end":10}]},"texts":{"ko":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라","en":null}},{"id":"dep242-6-3-11","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":11,"code":"6-3-11","title":"미루지 않도록 도울 것","ref":{"book":"2Cor","chapter":6,"verses":[{"start":2}]},"texts":{"ko":"가라사대 내가 은혜 베풀 때에 너를 듣고 구원의 날에 너를 도왔다 하셨으니 보라 지금은 은혜 받을만한 때요 보라 지금은 구원의 날이로다","en":null}},{"id":"dep242-6-3-12","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":12,"code":"6-3-12","title":"구원을 확증토록 할 것","ref":{"book":"2Cor","chapter":13,"verses":[{"start":5}]},"texts":{"ko":"너희가 믿음에 있는가 너희 자신을 시험하고 너희 자신을 확증하라 예수 그리스도께서 너희 안에 계신 줄을 너희가 스스로 알지 못하느냐 그렇지 않으면 너희가 버리운 자니라","en":null}},{"id":"dep242-6-3-13","collectionId":"dep242","sectionId":"6","subsectionId":"6-3","number":13,"code":"6-3-13","title":"전도 성경공부를 할 것","ref":{"book":"Acts","chapter":17,"verses":[{"start":2,"end":3}]},"texts":{"ko":"바울이 자기의 규례대로 저희에게로 들어가서 세 안식일에 성경을 가지고 강론하며 뜻을 풀어 그리스도가 해를 받고 죽은 자 가운데서 다시 살아야 할것을 증명하고 이르되 내가 너희에게 전하는 이 예수가 곧 그리스도라 하니","en":null}},{"id":"dep242-6-4-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-4","number":1,"code":"6-4-1","title":"바울","ref":{"book":"Acts","chapter":20,"verses":[{"start":24}]},"texts":{"ko":"나의 달려갈 길과 주 예수께 받은 사명 곧 하나님의 은혜의 복음 증거하는 일을 마치려 함에는 나의 생명을 조금도 귀한 것으로 여기지 아니하노라","en":null}},{"id":"dep242-6-4-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-4","number":2,"code":"6-4-2","title":"빌립","ref":{"book":"Acts","chapter":8,"verses":[{"start":29,"end":30}]},"texts":{"ko":"성령이 빌립더러 이르시되 이 병거로 가까이 나아가라 하시거늘 빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느뇨","en":null}},{"id":"dep242-6-4-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-4","number":3,"code":"6-4-3","title":"베드로와 요한","ref":{"book":"Acts","chapter":4,"verses":[{"start":20}]},"texts":{"ko":"우리는 보고 들은 것을 말하지 아니할 수 없다 하니","en":null}},{"id":"dep242-6-5-1","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":1,"code":"6-5-1","title":"1-1. 하나님의 형상으로 지음받음","ref":{"book":"Gen","chapter":1,"verses":[{"start":27}]},"texts":{"ko":"하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고","en":null}},{"id":"dep242-6-5-2","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":2,"code":"6-5-2","title":"2-1. 죄로 인해 하나님과 분리됨","ref":{"book":"Isa","chapter":59,"verses":[{"start":1,"end":2}]},"texts":{"ko":"여호와의 손이 짧아 구원치 못하심도 아니요 귀가 둔하여 듣지 못하심도 아니라 오직 너희 죄악이 너희와 너희 하나님 사이를 내었고 너희 죄가 그 얼굴을 가리워서 너희를 듣지 않으시게 함이니","en":null}},{"id":"dep242-6-5-3","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":3,"code":"6-5-3","title":"3-1. 인간의 상태-죄인","ref":{"book":"Rom","chapter":5,"verses":[{"start":12}]},"texts":{"ko":"이러므로 한 사람으로 말미암아 죄가 세상에 들어오고 죄로 말미암아 사망이 왔나니 이와 같이 모든 사람이 죄를 지었으므로 사망이 모든 사람에게 이르렀느니라","en":null}},{"id":"dep242-6-5-4","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":4,"code":"6-5-4","title":"3-1. 인간의 상태-죄인","ref":{"book":"Rom","chapter":3,"verses":[{"start":23}]},"texts":{"ko":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니","en":null}},{"id":"dep242-6-5-5","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":5,"code":"6-5-5","title":"3-2. 인간의 상태-심판","ref":{"book":"Heb","chapter":9,"verses":[{"start":27}]},"texts":{"ko":"한번 죽는 것은 사람에게 정하신 것이요 그 후에는 심판이 있으리니","en":null}},{"id":"dep242-6-5-6","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":6,"code":"6-5-6","title":"3-2. 인간의 상태-심판","ref":{"book":"2Thess","chapter":1,"verses":[{"start":8,"end":9}]},"texts":{"ko":"하나님을 모르는 자들과 우리 주 예수의 복음을 복종치 않는 자들에게 형벌을 주시리니 이런 자들이 주의 얼굴과 그의 힘의 영광을 떠나 영원한 멸망의 형벌을 받으리로다","en":null}},{"id":"dep242-6-5-7","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":7,"code":"6-5-7","title":"3-3. 인간의 상태-사망","ref":{"book":"Rom","chapter":6,"verses":[{"start":23}]},"texts":{"ko":"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라","en":null}},{"id":"dep242-6-5-8","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":8,"code":"6-5-8","title":"3-3. 인간의 상태-사망","ref":{"book":"Rev","chapter":21,"verses":[{"start":8}]},"texts":{"ko":"그러나 두려워하는 자들과 믿지 아니하는 자들과 흉악한 자들과 살인자들과 행음자들과 술객들과 우상 숭배자들과 모든 거짓말 하는 자들은 불과 유황으로 타는 못에 참예하리니 이것이 둘째 사망이라","en":null}},{"id":"dep242-6-5-9","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":9,"code":"6-5-9","title":"4-1. 인간의 힘으로 구원받지 못함-행위","ref":{"book":"Eph","chapter":2,"verses":[{"start":8,"end":9}]},"texts":{"ko":"너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑치 못하게 함이니라","en":null}},{"id":"dep242-6-5-10","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":10,"code":"6-5-10","title":"4-1. 인간의 힘으로 구원받지 못함-행위","ref":{"book":"Gal","chapter":2,"verses":[{"start":21}]},"texts":{"ko":"내가 하나님의 은혜를 폐하지 아니하노니 만일 의롭게 되는 것이 율법으로 말미암으면 그리스도께서 헛되이 죽으셨느니라","en":null}},{"id":"dep242-6-5-11","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":11,"code":"6-5-11","title":"4-2. 인간의 힘으로 구원받지 못함-종교","ref":{"book":"Acts","chapter":4,"verses":[{"start":12}]},"texts":{"ko":"다른이로서는 구원을 얻을 수 없나니 천하 인간에 구원을 얻을만한 다른 이름을 우리에게 주신 일이 없음이니라 하였더라","en":null}},{"id":"dep242-6-5-12","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":12,"code":"6-5-12","title":"4-3. 인간의 힘으로 구원받지 못함-돈","ref":{"book":"1Pet","chapter":1,"verses":[{"start":18}]},"texts":{"ko":"너희가 알거니와 너희 조상의 유전한 망령된 행실에서 구속된 것은 은이나 금 같이 없어질 것으로 한 것이 아니요","en":null}},{"id":"dep242-6-5-13","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":13,"code":"6-5-13","title":"4-4. 인간의 힘으로 구원받지 못함-신비의 체험","ref":{"book":"1Cor","chapter":1,"verses":[{"start":22,"end":23}]},"texts":{"ko":"유대인은 표적을 구하고 헬라인은 지혜를 찾으나 우리는 십자가에 못 박힌 그리스도를 전하니 유대인에게는 거리끼는 것이요 이방인에게는 미련한 것이로되","en":null}},{"id":"dep242-6-5-14","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":14,"code":"6-5-14","title":"4-5. 인간의 힘으로 구원받지 못함-지혜","ref":{"book":"1Cor","chapter":1,"verses":[{"start":21}]},"texts":{"ko":"하나님의 지혜에 있어서는 이 세상이 자기 지혜로 하나님을 알지 못하는고로 하나님께서 전도의 미련한 것으로 믿는 자들을 구원하시기를 기뻐하셨도다","en":null}},{"id":"dep242-6-5-15","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":15,"code":"6-5-15","title":"4-6. 인간의 힘으로 구원받지 못함-학문과 전통","ref":{"book":"Col","chapter":2,"verses":[{"start":8}]},"texts":{"ko":"누가 철학과 헛된 속임수로 너희를 노략할까 주의하라 이것이 사람의 유전과 세상의 초등 학문을 좇음이요 그리스도를 좇음이 아니니라","en":null}},{"id":"dep242-6-5-16","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":16,"code":"6-5-16","title":"4-7. 인간의 힘으로 구원받지 못함-혈통","ref":{"book":"John","chapter":1,"verses":[{"start":13}]},"texts":{"ko":"이는 혈통으로나 육정으로나 사람의 뜻으로 나지 아니하고 오직 하나님께로서 난 자들이니라","en":null}},{"id":"dep242-6-5-17","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":17,"code":"6-5-17","title":"4-8. 인간의 힘으로 구원받지 못함-육은 무익함","ref":{"book":"John","chapter":3,"verses":[{"start":6,"end":7}]},"texts":{"ko":"육으로 난 것은 육이요 성령으로 난 것은 영이니 내가 네게 거듭나야 하겠다 하는 말을 기이히 여기지 말라","en":null}},{"id":"dep242-6-5-18","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":18,"code":"6-5-18","title":"4-8. 인간의 힘으로 구원받지 못함-육은 무익함","ref":{"book":"John","chapter":6,"verses":[{"start":63}]},"texts":{"ko":"살리는 것은 영이니 육은 무익하니라 내가 너희에게 이른 말이 영이요 생명이라","en":null}},{"id":"dep242-6-5-19","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":19,"code":"6-5-19","title":"5-1. 하나님께로 인도하는 다리","ref":{"book":"1Pet","chapter":3,"verses":[{"start":18}]},"texts":{"ko":"그리스도께서도 한번 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니","en":null}},{"id":"dep242-6-5-20","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":20,"code":"6-5-20","title":"5-2. 독생자를 주심","ref":{"book":"John","chapter":3,"verses":[{"start":16}]},"texts":{"ko":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라","en":null}},{"id":"dep242-6-5-21","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":21,"code":"6-5-21","title":"5-3. 죄를 위해 죽으심","ref":{"book":"Rom","chapter":5,"verses":[{"start":8}]},"texts":{"ko":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라","en":null}},{"id":"dep242-6-5-22","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":22,"code":"6-5-22","title":"5-4. 부활하심","ref":{"book":"1Cor","chapter":15,"verses":[{"start":3,"end":4}]},"texts":{"ko":"내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고 장사 지낸바 되었다가 성경대로 사흘만에 다시 살아나사","en":null}},{"id":"dep242-6-5-23","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":23,"code":"6-5-23","title":"5-5. 모든 죄를 사하심","ref":{"book":"Col","chapter":2,"verses":[{"start":13}]},"texts":{"ko":"또 너희의 범죄와 육체의 무할례로 죽었던 너희를 하나님이 그와 함께 살리시고 우리에게 모든 죄를 사하시고","en":null}},{"id":"dep242-6-5-24","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":24,"code":"6-5-24","title":"6-1. 듣고 믿어야 함","ref":{"book":"John","chapter":5,"verses":[{"start":24}]},"texts":{"ko":"내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라","en":null}},{"id":"dep242-6-5-25","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":25,"code":"6-5-25","title":"6-2. 영접해야 함","ref":{"book":"John","chapter":1,"verses":[{"start":12}]},"texts":{"ko":"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니","en":null}},{"id":"dep242-6-5-26","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":26,"code":"6-5-26","title":"6-2. 영접해야 함","ref":{"book":"Rev","chapter":3,"verses":[{"start":20}]},"texts":{"ko":"볼찌어다 내가 문밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그로 더불어 먹고 그는 나로 더불어 먹으리라","en":null}},{"id":"dep242-6-5-27","collectionId":"dep242","sectionId":"6","subsectionId":"6-5","number":27,"code":"6-5-27","title":"6-3. 영접 기도","ref":{"book":"Rom","chapter":10,"verses":[{"start":9,"end":10}]},"texts":{"ko":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라","en":null}},{"id":"dep242-7-1-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":1,"code":"7-1-1","title":"창조의 주 되신 그리스도","ref":{"book":"John","chapter":1,"verses":[{"start":2,"end":3}]},"texts":{"ko":"그가 태초에 하나님과 함께 계셨고 만물이 그로 말미암아 지은바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라","en":null}},{"id":"dep242-7-1-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":2,"code":"7-1-2","title":"만물의 주 되신 그리스도","ref":{"book":"Col","chapter":1,"verses":[{"start":16,"end":17}]},"texts":{"ko":"만물이 그에게 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 보좌들이나 주관들이나 정사들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고 또한 그가 만물보다 먼저 계시고 만물이 그 안에 함께 섰느니라.","en":null}},{"id":"dep242-7-1-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":3,"code":"7-1-3","title":"교회의 머리되신 그리스도","ref":{"book":"Col","chapter":1,"verses":[{"start":18}]},"texts":{"ko":"그는 몸인 교회의 머리라 그가 근본이요 죽은 자들 가운데서 먼저 나신 자니 이는 친히 만물의 으뜸이 되려 하심이요","en":null}},{"id":"dep242-7-1-4","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":4,"code":"7-1-4","title":"모든 권세위에 뛰어나신 그리스도","ref":{"book":"Eph","chapter":1,"verses":[{"start":21}]},"texts":{"ko":"모든 정사와 권세와 능력과 주관하는 자와 이 세상뿐 아니라 오는 세상에 일컫는 모든 이름 위에 뛰어나게 하시고","en":null}},{"id":"dep242-7-1-5","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":5,"code":"7-1-5","title":"모든 사람의 주님되신 그리스도","ref":{"book":"Phil","chapter":2,"verses":[{"start":10,"end":11}]},"texts":{"ko":"하늘에 있는 자들과 땅에 있는 자들과 땅 아래 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고 모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라","en":null}},{"id":"dep242-7-1-6","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":6,"code":"7-1-6","title":"산 자와 죽은 자의 주님 되심","ref":{"book":"Rom","chapter":14,"verses":[{"start":9}]},"texts":{"ko":"이를 위하여 그리스도께서 죽었다가 다시 살으셨으니 곧 죽은 자와 산 자의 주가 되려 하심이니라","en":null}},{"id":"dep242-7-1-7","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":7,"code":"7-1-7","title":"피 값으로 우리를 사심","ref":{"book":"1Cor","chapter":6,"verses":[{"start":19,"end":20}]},"texts":{"ko":"너희 몸은 너희가 하나님께로부터 받은바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라. 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라","en":null}},{"id":"dep242-7-1-8","collectionId":"dep242","sectionId":"7","subsectionId":"7-1","number":8,"code":"7-1-8","title":"헌신의 결단을 할 것","ref":{"book":"2Cor","chapter":5,"verses":[{"start":15}]},"texts":{"ko":"저가 모든 사람을 대신하여 죽으심은 산 자들로 하여금 다시는 저희 자신을 위하여 살지 않고 오직 저희를 대신하여 죽었다가 다시 사신 자를 위하여 살게하려 함이니라","en":null}},{"id":"dep242-7-2-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":1,"code":"7-2-1","title":"필요를 채워주심","ref":{"book":"Matt","chapter":6,"verses":[{"start":33}]},"texts":{"ko":"너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라","en":null}},{"id":"dep242-7-2-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":2,"code":"7-2-2","title":"넘치는 보상","ref":{"book":"Mark","chapter":10,"verses":[{"start":29,"end":30}]},"texts":{"ko":"예수께서 가라사대 내가 진실로 너희에게 이르노니 나와 및 복음을 위하여 집이나 형제나 자매나 어미나 아비나 자식이나 전토를 버린 자는 금세에 있어 집과 형제와 자매와 모친과 자식과 전토를 백배나 받되 핍박을 겸하여 받고 내세에 영생을 받지 못할 자가 없느니라","en":null}},{"id":"dep242-7-2-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":3,"code":"7-2-3","title":"약속을 주심","ref":{"book":"Gen","chapter":22,"verses":[{"start":16,"end":17}]},"texts":{"ko":"가라사대 여호와께서 이르시기를 내가 나를 가리켜 맹세하노니 네가 이같이 행하여 네 아들 네 독자를 아끼지 아니하였은즉 내가 네게 큰 복을 주고 네 씨로 크게 성하여 하늘의 별과 같고 바닷가의 모래와 같게 하리니 네 씨가 그 대적의 문을 얻으리라","en":null}},{"id":"dep242-7-2-4","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":4,"code":"7-2-4","title":"함께해 주심","ref":{"book":"1Chr","chapter":28,"verses":[{"start":9}]},"texts":{"ko":"내 아들 솔로몬아 너는 네 아비의 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길찌어다 여호와께서는 뭇 마음을 감찰하사 모든 사상을 아시나니 네가 저를 찾으면 만날 것이요 버리면 저가 너를 영원히 버리시리라","en":null}},{"id":"dep242-7-2-5","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":5,"code":"7-2-5","title":"능력을 베푸심","ref":{"book":"2Chr","chapter":16,"verses":[{"start":9}]},"texts":{"ko":"여호와의 눈은 온 땅을 두루 감찰하사 전심으로 자기에게 향하는 자를 위하여 능력을 베푸시나니","en":null}},{"id":"dep242-7-2-6","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":6,"code":"7-2-6","title":"보호해 주심","ref":{"book":"Ps","chapter":91,"verses":[{"start":14}]},"texts":{"ko":"하나님이 가라사대 저가 나를 사랑한즉 내가 저를 건지리라 저가 내 이름을 안즉 내가 저를 높이리라","en":null}},{"id":"dep242-7-2-7","collectionId":"dep242","sectionId":"7","subsectionId":"7-2","number":7,"code":"7-2-7","title":"귀히 여겨 주심","ref":{"book":"1Sam","chapter":2,"verses":[{"start":30}]},"texts":{"ko":"나를 존중히 여기는 자를 내가 존중히 여기고 나를 멸시하는 자를 내가 경멸히 여기리라","en":null}},{"id":"dep242-7-3-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":1,"code":"7-3-1","title":"자기 자신","ref":{"book":"Luke","chapter":9,"verses":[{"start":23}]},"texts":{"ko":"또 무리에게 이르시되 아무든지 나를 따라 오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 좇을 것이니라","en":null}},{"id":"dep242-7-3-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":2,"code":"7-3-2","title":"대인 관계","ref":{"book":"Prov","chapter":16,"verses":[{"start":7}]},"texts":{"ko":"사람의 행위가 여호와를 기쁘시게 하면 그 사람의 원수라도 그로 더불어 화목하게 하시느니라","en":null}},{"id":"dep242-7-3-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":3,"code":"7-3-3","title":"장래 진로","ref":{"book":"Prov","chapter":3,"verses":[{"start":5,"end":6}]},"texts":{"ko":"너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라","en":null}},{"id":"dep242-7-3-4","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":4,"code":"7-3-4","title":"세상 욕심","ref":{"book":"Eph","chapter":4,"verses":[{"start":22},{"start":24}]},"texts":{"ko":"너희는 유혹의 욕심을 따라 썩어져 가는구습을 좇는 옛 사람을 벗어버리고 오직 심령으로 새롭게 되어 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라","en":null}},{"id":"dep242-7-3-5","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":5,"code":"7-3-5","title":"정욕","ref":{"book":"2Tim","chapter":2,"verses":[{"start":22}]},"texts":{"ko":"또한 네가 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 좇으라","en":null}},{"id":"dep242-7-3-6","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":6,"code":"7-3-6","title":"재물","ref":{"book":"1Tim","chapter":6,"verses":[{"start":7},{"start":9}]},"texts":{"ko":"우리가 세상에 아무것도 가지고 온 것이 없으매 또한 아무것도 가지고 가지 못하리니 우리가 먹을 것과 입을 것이 있은즉 족한 줄로 알 것이니라 부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 정욕에 떨어지나니 곧 사람으로 침륜과 멸망에 빠지게 하는 것이라","en":null}},{"id":"dep242-7-3-7","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":7,"code":"7-3-7","title":"시간 사용","ref":{"book":"Eph","chapter":5,"verses":[{"start":15,"end":16}]},"texts":{"ko":"그런즉 너희가 어떻게 행할 것을 자세히 주의하여 지혜없는 자 같이 말고 오직 지혜 있는 자 같이 하여 세월을 아끼라 때가 악하니라","en":null}},{"id":"dep242-7-3-8","collectionId":"dep242","sectionId":"7","subsectionId":"7-3","number":8,"code":"7-3-8","title":"부르심","ref":{"book":"Mark","chapter":1,"verses":[{"start":20}]},"texts":{"ko":"곧 부르시니 그 아비 세베대를 삯군들과 함께 배에 버려 두고 예수를 따라가니라","en":null}},{"id":"dep242-7-4-1","collectionId":"dep242","sectionId":"7","subsectionId":"7-4","number":1,"code":"7-4-1","title":"1, 바울","ref":{"book":"Phil","chapter":1,"verses":[{"start":20}]},"texts":{"ko":"나의 간절한 기대와 소망을 따라 아무 일에든지 부끄럽지 아니하고 오직 전과 같이 이제도 온전히 담대하여 살든지 죽든지 내 몸에서 그리스도가 존귀히 되게 하려 하나니","en":null}},{"id":"dep242-7-4-2","collectionId":"dep242","sectionId":"7","subsectionId":"7-4","number":2,"code":"7-4-2","title":"디모데","ref":{"book":"Phil","chapter":2,"verses":[{"start":21,"end":22}]},"texts":{"ko":"저희가 다 자기 일을 구하고 그리스도 예수의 일을 구하지 아니하되 디모데의 연단을 너희가 아나니 자식이 아비에게 함같이 나와 함께 복음을 위하여 수고하였느니라","en":null}},{"id":"dep242-7-4-3","collectionId":"dep242","sectionId":"7","subsectionId":"7-4","number":3,"code":"7-4-3","title":"믿음의 용사들","ref":{"book":"Heb","chapter":11,"verses":[{"start":36},{"start":38,"suffix":"상"}]},"texts":{"ko":"또 어떤이들은 희롱과 채찍질 뿐아니라 결박과 옥에 갇히는 시험도 받았으며 돌로 치는 것과 톱으로 켜는 것과 시험과 칼에 죽는 것을 당하고 양과 염소의 가죽을 입고 유리하여 궁핍과 환난과 학대를 받았으니(이런 사람은 세상이 감당치 못하도다)","en":null}},{"id":"dep242-8-1","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":1,"code":"8-1","title":"세계를 위한 하나님의 관심과 약속","ref":{"book":"Gen","chapter":12,"verses":[{"start":2,"end":3}]},"texts":{"ko":"내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대케 하리니 너는 복의 근원이 될찌라 너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 내가 저주하리니 땅의 모든 족속이 너를 인하여 복을 얻을 것이니라 하신지라","en":null}},{"id":"dep242-8-2","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":2,"code":"8-2","title":"세계를 위한 하나님의 관심과 약속","ref":{"book":"Isa","chapter":49,"verses":[{"start":6}]},"texts":{"ko":"그가 가라사대 네가 나의 종이 되어 야곱의 지파들을 일으키며 이스라엘 중에 보전된 자를 돌아오게 할 것은 오히려 경한 일이라 내가 또 너로 이방의 빛을 삼아 나의 구원을 베풀어서 땅 끝까지 이르게 하리라","en":null}},{"id":"dep242-8-3","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":3,"code":"8-3","title":"지상사명","ref":{"book":"Matt","chapter":28,"verses":[{"start":19,"end":20}]},"texts":{"ko":"그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼찌어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라","en":null}},{"id":"dep242-8-4","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":4,"code":"8-4","title":"지상사명","ref":{"book":"Acts","chapter":1,"verses":[{"start":8}]},"texts":{"ko":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","en":null}},{"id":"dep242-8-5","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":5,"code":"8-5","title":"선교에 헌신할 것","ref":{"book":"Isa","chapter":6,"verses":[{"start":8}]},"texts":{"ko":"내가 또 주의 목소리를 들은즉 이르시되 내가 누구를 보내며 누가 우리를 위하여 갈꼬 그 때에 내가 가로되 내가 여기 있나이다 나를 보내소서","en":null}},{"id":"dep242-8-6","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":6,"code":"8-6","title":"선교에 헌신할 것","ref":{"book":"Rom","chapter":15,"verses":[{"start":16}]},"texts":{"ko":"이 은혜는 곧 나로 이방인을 위하여 그리스도 예수의 일군이 되어 하나님의 복음의 제사장 직무를 하게 하사 이방인을 제물로 드리는 그것이 성령 안에서 거룩하게 되어 받으심직하게 하려 하심이라","en":null}},{"id":"dep242-8-7","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":7,"code":"8-7","title":"세계를 위해 기도할 것","ref":{"book":"Ps","chapter":2,"verses":[{"start":8}]},"texts":{"ko":"내게 구하라 내가 열방을 유업으로 주리니 네 소유가 땅 끝까지 이르리로다","en":null}},{"id":"dep242-8-8","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":8,"code":"8-8","title":"세계를 위해 기도할 것","ref":{"book":"Ps","chapter":57,"verses":[{"start":5}]},"texts":{"ko":"하나님이여 주는 하늘 위에 높이 들리시며 주의 영광은 온 세계 위에 높아지기를 원하나이다","en":null}},{"id":"dep242-8-9","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":9,"code":"8-9","title":"전도할 것","ref":{"book":"Titus","chapter":1,"verses":[{"start":2,"end":3}]},"texts":{"ko":"영생의 소망을 인함이라 이 영생은 거짓이 없으신 하나님이 영원한 때 전부터 약속하신 것인데 자기 때에 자기의 말씀을 전도로 나타내셨으니 이 전도는 우리 구주 하나님의 명대로 내게 맡기신 것이라","en":null}},{"id":"dep242-8-10","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":10,"code":"8-10","title":"전도할 것","ref":{"book":"2Tim","chapter":4,"verses":[{"start":17}]},"texts":{"ko":"주께서 내 곁에 서서 나를 강건케 하심은 나로 말미암아 전도의 말씀이 온전히 전파되어 이방인으로 듣게 하려 하심이니 내가 사자의 입에서 건지웠느니라","en":null}},{"id":"dep242-8-11","collectionId":"dep242","sectionId":"8","subsectionId":null,"number":11,"code":"8-11","title":"성장을 도울 것","ref":{"book":"Col","chapter":1,"verses":[{"start":28,"end":29}]},"texts":{"ko":"우리가 그를 전파하여 각 사람을 권하고 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 안에서 완전한 자로 세우려 함이니 이를 위하여 나도 내 속에서 능력으로 역사하시는 이의 역사를 따라 힘을 다하 const collections = DATA.collections;
const verses = DATA.verses;
const verseById = new Map(verses.map(v => [v.id, v]));

/* ── 참조 표기 ─────────────────────────────────── */
function fmtVerseNums(list, lang) {
  return list.map(seg => {
    let s = String(seg.start);
    if (seg.end) s += '-' + seg.end;
    if (seg.suffix) s += (lang === 'ko' ? seg.suffix : (seg.suffix === '상' ? 'a' : 'b'));
    return s;
  }).join(',');
}
function fmtRef(ref, lang, style) {
  const b = BOOKS[ref.book];
  const name = !b ? ref.book : (lang === 'en' ? b.en : (style === 'abbr' ? b.koAbbr : b.ko));
  return name + ' ' + ref.chapter + ':' + fmtVerseNums(ref.verses, lang);
}

/* ── 본문 텍스트 공급자 ─────────────────────────────
 * 지금은 내장 텍스트. 전체 성경 DB가 준비되면 이 함수만
 * ref(book/chapter/verses) 기반 조회로 교체하면 된다. */
function getVerseText(v, lang) { return (v.texts && v.texts[lang]) || null; }

/* ── 저장소 (localStorage 불가 환경에서도 동작) ──── */
const mem = {};
function loadSet(k) {
  try { const raw = localStorage.getItem('bmc.' + k + '.v1'); return new Set(raw ? JSON.parse(raw) : []); }
  catch (e) { return new Set(mem[k] || []); }
}
function saveSet(k, set) {
  mem[k] = [...set];
  try { localStorage.setItem('bmc.' + k + '.v1', JSON.stringify([...set])); } catch (e) {}
}

/* ── 글자 크기 배율 (사용자 조절, 저장됨) ────────── */
const FS_MIN = 0.7, FS_MAX = 1.6, FS_STEP = 0.1;
function loadFontScale() {
  try {
    const v = parseFloat(localStorage.getItem('bmc.fontScale.v1'));
    if (v >= FS_MIN && v <= FS_MAX) return v;
  } catch (e) {}
  return 1;
}
function applyFontScale(v) {
  document.documentElement.style.setProperty('--fs', v);
  try { localStorage.setItem('bmc.fontScale.v1', String(v)); } catch (e) {}
}

/* ── 상태 ─────────────────────────────────────── */
const state = {
  stack: [{ name: 'home' }],
  lang: 'ko',
  fav: loadSet('favorites'),
  done: loadSet('completed'),
  mode: 'card',
  index: 0,
  flipped: false,
  fontScale: loadFontScale(),
};
applyFontScale(state.fontScale);
const cur = () => state.stack[state.stack.length - 1];

function push(s) {
  state.stack.push(s);
  if (s.name === 'verses') { state.mode = 'card'; state.index = s.startIndex || 0; state.flipped = false; }
  render();
}
function pop() { if (state.stack.length > 1) { state.stack.pop(); render(); } }
function goHome() { state.stack = [{ name: 'home' }]; render(); }

const getCollection = id => collections.find(c => c.id === id);

function selectVerses(f) {
  return verses.filter(v =>
    (!f.collectionId || v.collectionId === f.collectionId) &&
    (!f.sectionId || v.sectionId === f.sectionId) &&
    (!f.subsectionId || v.subsectionId === f.subsectionId));
}
function currentVerses() {
  const s = cur();
  if (s.kind === 'favorites') return [...state.fav].map(id => verseById.get(id)).filter(Boolean);
  if (s.kind === 'completed') return [...state.done].map(id => verseById.get(id)).filter(Boolean);
  return selectVerses(s);
}

function cardFooter(v) {
  const col = getCollection(v.collectionId);
  const sec = col.sections.find(s => s.id === v.sectionId);
  const sub = sec && sec.subsections.find(s => s.id === v.subsectionId);
  return {
    code: v.code.replace(/^s/, ''),
    groupName: (sub && sub.name) || (sec && sec.name) || col.shortName,
    color: col.color,
  };
}

    '<h1 class="topbar-title">' + esc(title) + '</h1>' +
    '<div class="topbar-side topbar-right">' +
    (opts.lang ? '<button class="pill-btn" data-action="lang">' + (state.lang === 'ko' ? 'En' : '한') + '</button>' : '') +
    '</div></header>';
}

/* ── 홈 화면 ──────────────────────────────────── */
function homeHTML() {
  const cols = collections.map(c =>
    '<button class="collection-card" style="--accent:' + c.color + '" data-action="open-col" data-id="' + c.id + '">' +
    '<span class="collection-stripe"></span>' +
    '<span class="collection-info">' +
    '<span class="collection-name">' + esc(c.name) + '</span>' +
    '<span class="collection-meta">' + c.verseCount + '구절' + (c.sections.length ? ' · ' + c.sections.length + '개 주제' : '') + '</span>' +
    '</span><span class="chevron">›</span></button>').join('');
  return topbarHTML('말씀 암송 카드', { lang: true }) +
    '<main class="home-main">' +
    '<p class="home-caption">암송집을 선택하세요</p>' +
    '<div class="collection-list">' + cols + '</div>' +
    '<div class="home-shortcuts">' +
    '<button class="shortcut-card" data-action="open-kind" data-kind="favorites"><span class="shortcut-icon star">★</span>즐겨찾기<span class="shortcut-count">' + state.fav.size + '</span></button>' +
    '<button class="shortcut-card" data-action="open-kind" data-kind="completed"><span class="shortcut-icon check">✓</span>암송완료<span class="shortcut-count">' + state.done.size + '</span></button>' +
    '</div></main>';
}

/* ── 그룹(섹션/서브섹션) 화면 ─────────────────── */
function groupHTML(s) {
  const col = getCollection(s.collectionId);
  const section = s.sectionId ? col.sections.find(x => x.id === s.sectionId) : null;
  let rows = '';
  if (!section) {
    rows += '<button class="group-row all-row" data-action="open-verses" data-col="' + col.id + '">' +
      '<span class="group-name">전체 보기</span><span class="group-count">' + col.verseCount + '구절</span><span class="chevron">›</span></button>';
    rows += col.sections.map(sec => {
      const count = selectVerses({ collectionId: col.id, sectionId: sec.id }).length;
      const hasSubs = sec.subsections && sec.subsections.length;
      return '<button class="group-row" data-action="' + (hasSubs ? 'open-group' : 'open-verses') + '" data-col="' + col.id + '" data-sec="' + sec.id + '">' +
        '<span class="group-badge">' + esc(sec.id.split('-').pop().toUpperCase()) + '</span>' +
        '<span class="group-name">' + esc(sec.name) + '</span>' +
        '<span class="group-count">' + count + '구절</span><span class="chevron">›</span></button>';
    }).join('');
  } else {
    rows += section.subsections.map(sub => {
      const count = selectVerses({ collectionId: col.id, subsectionId: sub.id }).length;
      return '<button class="group-row" data-action="open-verses" data-col="' + col.id + '" data-sec="' + section.id + '" data-sub="' + sub.id + '">' +
        '<span class="group-badge">' + esc(sub.id.split('-').pop()) + '</span>' +
        '<span class="group-name">' + esc(sub.name) + '</span>' +
        '<span class="group-count">' + count + '구절</span><span class="chevron">›</span></button>';
    }).join('');
  }
  return topbarHTML(section ? section.name : col.name, { back: true, home: true }) +
    '<main class="group-main" style="--accent:' + col.color + '">' + rows + '</main>';
}

/* ── 카드 마크업 ──────────────────────────────── */
function cardHTML(v) {
  const f = cardFooter(v);
  const refFull = fmtRef(v.ref, state.lang, 'full');
  const text = getVerseText(v, state.lang);
  const fallback = !text && state.lang === 'en';
  const body = text || getVerseText(v, 'ko') || '';
  return '<div class="card3d' + (state.flipped ? ' flipped' : '') + '" style="--accent:' + f.color + '">' +
    '<div class="card-inner">' +
    '<div class="card-face card-front">' +
    '<div class="card-head"><h2 class="card-title">' + esc(v.title) + '</h2>' +
    '<div class="card-ref">' + esc(refFull) + '</div></div>' +
    '<p class="card-body">' + esc(body) + '</p>' +
    (fallback ? '<div class="card-note">영어 본문이 아직 없어 한국어로 표시합니다</div>' : '') +
    '<div class="card-foot"><span class="card-code">' + esc(f.code) + ' <em>' + esc(f.groupName) + '</em></span>' +
    '<span class="card-foot-ref">' + esc(refFull) + '</span></div>' +
    '</div>' +
    '<div class="card-face card-back">' +
    '<div class="card-head"><h2 class="card-title">' + esc(v.title) + '</h2></div>' +
    '<div class="card-back-center"><div class="card-back-ref">' + esc(refFull) + '</div>' +
    '<div class="card-back-hint">본문을 떠올려 보세요 · 탭하면 본문 보기</div></div>' +
    '<div class="card-foot"><span class="card-code">' + esc(f.code) + ' <em>' + esc(f.groupName) + '</em></span></div>' +
    '</div></div></div>';
}

/* ── 구절 화면 (카드/리스트) ──────────────────── */
function verseScreenHTML(s, list) {
  let inner;
  if (!list.length) {
    inner = '<p class="empty-note">아직 담긴 구절이 없습니다</p>';
  } else if (state.mode === 'card') {
    inner =
      '<div class="deck-area"><div class="deck" id="deck">' +
      '<div class="deck-under under-2" id="under2"></div>' +
      '<div class="deck-under under-1" id="under1"></div>' +
      '<div class="deck-current" id="deckCurrent"></div>' +
      '</div>' +
      '<div class="deck-controls">' +
      '<button class="nav-btn" data-action="prev" id="btnPrev">‹</button>' +
      '<button class="action-btn" data-action="fav" id="btnFav">★</button>' +
      '<span class="deck-counter" id="counter"></span>' +
      '<button class="action-btn" data-action="done" id="btnDone">✓</button>' +
      '<button class="nav-btn" data-action="next" id="btnNext">›</button>' +
      '</div>' +
      '<p class="deck-hint">카드를 탭하면 본문이 가려집니다 · 좌우로 넘겨보세요</p></div>';
  } else {
    inner = '<div class="verse-list">' + list.map((v, i) => {
      const f = cardFooter(v);
      const text = getVerseText(v, state.lang) || getVerseText(v, 'ko') || '';
      return '<div class="verse-row" style="--accent:' + f.color + '">' +
        '<button class="verse-row-main" data-action="open-card" data-idx="' + i + '">' +
        '<div class="verse-row-top"><span class="verse-row-code">' + esc(f.code) + '</span>' +
        '<span class="verse-row-title">' + esc(v.title) + '</span>' +
        '<span class="verse-row-ref">' + esc(fmtRef(v.ref, state.lang, 'abbr')) + '</span></div>' +
        '<p class="verse-row-text">' + esc(text) + '</p></button>' +
        '<div class="verse-row-actions">' +
        '<button class="row-action' + (state.fav.has(v.id) ? ' star-on' : '') + '" data-action="row-fav" data-id="' + v.id + '">★</button>' +
        '<button class="row-action' + (state.done.has(v.id) ? ' check-on' : '') + '" data-action="row-done" data-id="' + v.id + '">✓</button>' +
        '</div></div>';
    }).join('') + '</div>';
  }
  return topbarHTML(s.title, { back: true, home: true, lang: true }) +
    '<div class="toolbar">' +
    '<div class="mode-toggle">' +
    '<button data-action="mode-card" class="' + (state.mode === 'card' ? 'on' : '') + '">카드</button>' +
    '<button data-action="mode-list" class="' + (state.mode === 'list' ? 'on' : '') + '">리스트</button>' +
    '</div>' +
    '<div class="font-controls">' +
    '<button class="font-btn" data-action="font-dec" aria-label="글자 작게"' + (state.fontScale <= FS_MIN + 0.001 ? ' disabled' : '') + '><span class="ga">가</span>−</button>' +
    '<button class="font-btn" data-action="font-inc" aria-label="글자 크게"' + (state.fontScale >= FS_MAX - 0.001 ? ' disabled' : '') + '><span class="ga">가</span>+</button>' +
    '</div></div>' + inner;
}

/* ── 덱 갱신 (카드 넘김/체크 시 부분 갱신) ─────── */
function updateDeck(fromStack) {
  const list = currentVerses();
  if (state.index >= list.length) state.index = Math.max(0, list.length - 1);
  const v = list[state.index];
  const el = document.getElementById('deckCurrent');
  if (!el || !v) return;
  el.style.transition = 'none';
  el.innerHTML = cardHTML(v);
  if (fromStack) {
    // 뒤 카드뭉치 위치에서 앞으로 올라오는 연출
    el.style.transform = 'translateY(7px) scale(0.975)';
    el.offsetHeight; // 강제 리플로우 — 드래그하던 위치가 아니라 이 위치에서 시작
    el.style.transition = 'transform 0.24s ease-out';
    el.style.transform = '';
  } else {
    el.style.transform = '';
  }
  document.getElementById('under1').style.display = state.index + 1 < list.length ? '' : 'none';
  document.getElementById('under2').style.display = state.index + 2 < list.length ? '' : 'none';
  document.getElementById('counter').innerHTML = (state.index + 1) + ' <em>/ ' + list.length + '</em>';
  document.getElementById('btnPrev').disabled = state.index === 0;
  document.getElementById('btnNext').disabled = state.index >= list.length - 1;
  document.getElementById('btnFav').className = 'action-btn' + (state.fav.has(v.id) ? ' star-on' : '');
  document.getElementById('btnDone').className = 'action-btn' + (state.done.has(v.id) ? ' check-on' : '');
  fitCardBody();
}

/* 본문이 카드에 안 들어가면 글자를 단계적으로 줄여서 맞춘다.
 * (최소 68%까지 — 그래도 넘치면 스크롤로 본다) */
function fitCardBody() {
  const body = document.querySelector('#deckCurrent .card-front .card-body');
  if (!body) return;
  body.style.fontSize = '';
  body.style.lineHeight = '';
  const base = parseFloat(getComputedStyle(body).fontSize);
  let k = 1;
  while (body.scrollHeight > body.clientHeight + 1 && k > 0.68) {
    k -= 0.04;
    body.style.fontSize = (base * k).toFixed(2) + 'px';
    if (k < 0.85) body.style.lineHeight = '1.65';
  }
}

/* 카드 넘김: 잔상은 "드래그하던 그 위치"에서 이어서 날아가고,
 * 새 카드는 뒤 카드뭉치에서 한 장 올라오듯 나타난다.
 * (잔상이 가운데로 되돌아간 뒤 날아가면 두 장이 움직이는 느낌이 남) */
function goCard(dir, fromDx) {
  const list = currentVerses();
  const next = state.index + dir;
  if (next < 0 || next >= list.length) { resetCardTransform(); return; }
  fromDx = fromDx || 0;
  const deck = document.getElementById('deck');
  const curEl = document.getElementById('deckCurrent');
  if (deck && curEl) {
    const ghost = document.createElement('div');
    ghost.className = 'deck-leaving';
    ghost.innerHTML = curEl.innerHTML;
    // 시작 위치 = 현재 드래그 위치
    ghost.style.transform = 'translateX(' + fromDx + 'px) rotate(' + fromDx * 0.04 + 'deg)';
    ghost.style.opacity = '1';
    deck.appendChild(ghost);
    ghost.offsetHeight; // 강제 리플로우 — 시작 위치를 확정시켜야 transition이 걸림
    ghost.style.transition = 'transform 0.24s ease-out, opacity 0.24s ease-out';
    ghost.style.transform = 'translateX(' + (dir > 0 ? -120 : 120) + '%) rotate(' + (dir > 0 ? -7 : 7) + 'deg)';
    ghost.style.opacity = '0.3';
    setTimeout(() => ghost.remove(), 300);
  }
  state.index = next;
  state.flipped = false;
  updateDeck(true);
}

function toggleSet(kind, id) {
  const set = kind === 'fav' ? state.fav : state.done;
  set.has(id) ? set.delete(id) : set.add(id);
  saveSet(kind === 'fav' ? 'favorites' : 'completed', set);
}

/* ── 렌더 ─────────────────────────────────────── */
const root = document.getElementById('root');
function render() {
  const s = cur();
  if (s.name === 'home') root.innerHTML = homeHTML();
  else if (s.name === 'group') root.innerHTML = groupHTML(s);
  else {
    root.innerHTML = verseScreenHTML(s, currentVerses());
    if (state.mode === 'card') updateDeck();
  }
  window.scrollTo(0, 0);
}

/* ── 이벤트 (위임) ────────────────────────────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  const s = cur();
  if (a === 'back') pop();
  else if (a === 'go-home') goHome();
  else if (a === 'lang') { state.lang = state.lang === 'ko' ? 'en' : 'ko'; render(); }
  else if (a === 'open-col') {
    const col = getCollection(btn.dataset.id);
    if (!col.sections.length) push({ name: 'verses', collectionId: col.id, title: col.name });
    else push({ name: 'group', collectionId: col.id });
  }
  else if (a === 'open-kind') {
    push({ name: 'verses', kind: btn.dataset.kind, title: btn.dataset.kind === 'favorites' ? '즐겨찾기' : '암송완료' });
  }
  else if (a === 'open-group') push({ name: 'group', collectionId: btn.dataset.col, sectionId: btn.dataset.sec });
  else if (a === 'open-verses') {
    const col = getCollection(btn.dataset.col);
    const sec = btn.dataset.sec && col.sections.find(x => x.id === btn.dataset.sec);
    const sub = sec && btn.dataset.sub && sec.subsections.find(x => x.id === btn.dataset.sub);
    push({
      name: 'verses', collectionId: col.id,
      sectionId: btn.dataset.sec || null, subsectionId: btn.dataset.sub || null,
      title: sub ? sub.name : (sec ? sec.name : (btn.dataset.sec ? '' : col.shortName + ' 전체')),
    });
  }
  else if (a === 'mode-card') { state.mode = 'card'; render(); }
  else if (a === 'mode-list') { state.mode = 'list'; render(); }
  else if (a === 'font-inc' || a === 'font-dec') {
    const d = a === 'font-inc' ? FS_STEP : -FS_STEP;
    state.fontScale = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, state.fontScale + d)) * 10) / 10;
    applyFontScale(state.fontScale);
    render(); // 버튼 활성 상태 갱신 + 카드 자동 맞춤 재계산
  }
  else if (a === 'open-card') { state.mode = 'card'; state.index = +btn.dataset.idx; state.flipped = false; render(); }
  else if (a === 'prev') goCard(-1);
  else if (a === 'next') goCard(1);
  else if (a === 'fav' || a === 'done') {
    const v = currentVerses()[state.index];
    if (v) { toggleSet(a, v.id); s.kind ? render() : updateDeck(); }
  }
  else if (a === 'row-fav' || a === 'row-done') {
    toggleSet(a === 'row-fav' ? 'fav' : 'done', btn.dataset.id);
    render();
  }
});

/* ── 덱 스와이프 + 탭 뒤집기 ─────────────────────
 * 터치는 touch 이벤트로 직접 처리하고, 첫 움직임에서
 * 가로/세로 방향을 잠근다. 가로로 판정되면 preventDefault로
 * 브라우저 스크롤 가로채기를 막아 끝까지 우리가 제어한다.
 * (기존 pointer 이벤트 방식은 손가락이 조금만 비스듬해도
 *  브라우저가 스크롤로 가져가며 pointercancel로 끊겼음) */
let drag = null;

function setCardTransform(dx) {
  const el = document.getElementById('deckCurrent');
  if (!el) return;
  el.style.transition = 'none';
  el.style.transform = 'translateX(' + dx + 'px) rotate(' + dx * 0.04 + 'deg)';
}
function resetCardTransform() {
  const el = document.getElementById('deckCurrent');
  if (el) { el.style.transition = 'transform 0.25s ease'; el.style.transform = ''; }
}
function dampedDx(dx) {
  const list = currentVerses();
  const atEdge = (dx > 0 && state.index === 0) || (dx < 0 && state.index >= list.length - 1);
  return atEdge ? dx * 0.3 : dx; // 끝 카드에서는 저항감
}

function dragStart(x, y, target) {
  // 터치 시작 지점의 스크롤 가능한 본문 (세로 드래그 시 직접 스크롤)
  let scrollEl = null;
  if (target && target.closest) {
    const body = target.closest('.card-body');
    if (body && body.scrollHeight > body.clientHeight + 1) scrollEl = body;
  }
  drag = { x, y, lock: null, t: Date.now(), lastX: x, lastT: Date.now(), vx: 0,
           scrollEl, scrollTop: scrollEl ? scrollEl.scrollTop : 0 };
}
function dragMove(x, y, e) {
  if (!drag) return;
  const dx = x - drag.x, dy = y - drag.y;
  if (!drag.lock) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 아직 판정 전
    drag.lock = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
  }
  if (drag.lock !== 'h') {
    // 세로: 본문이 스크롤 가능하면 직접 스크롤 (3D 카드 구조에서
    // 브라우저 기본 스크롤이 안 먹는 기기 대응)
    if (drag.scrollEl) {
      if (e && e.cancelable) e.preventDefault();
      drag.scrollEl.scrollTop = drag.scrollTop - dy;
    }
    return;
  }
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now > drag.lastT) drag.vx = (x - drag.lastX) / (now - drag.lastT);
  drag.lastX = x; drag.lastT = now;
  setCardTransform(dampedDx(dx));
}
function dragEnd(x) {
  if (!drag) return false;
  const d = drag; drag = null;
  const dx = x - d.x;
  const dt = Date.now() - d.t;

  if (d.lock === 'h') {
    const deckEl = document.getElementById('deck');
    const width = deckEl ? deckEl.offsetWidth : 320;
    const threshold = Math.min(60, width * 0.18);
    // 플릭 판정: 마지막 순간 속도 또는 제스처 전체 평균 속도
    const avx = dt > 0 ? dx / dt : 0;
    const flick = (Math.abs(d.vx) > 0.25 || Math.abs(avx) > 0.35) &&
      Math.abs(dx) > 15 && (d.vx === 0 || (d.vx < 0) === (dx < 0));
    const list = currentVerses();
    if ((dx < -threshold || (flick && dx < 0)) && state.index < list.length - 1) { goCard(1, dx); return true; }
    if ((dx > threshold || (flick && dx > 0)) && state.index > 0) { goCard(-1, dx); return true; }
    resetCardTransform();
    return true; // 가로 드래그였으면 탭으로 치지 않음
  }
  if (!d.lock && dt < 400) { // 탭 → 뒤집기
    state.flipped = !state.flipped;
    const card = document.querySelector('#deckCurrent .card3d');
    if (card) card.classList.toggle('flipped', state.flipped);
    return true;
  }
  resetCardTransform();
  return false;
}
function dragCancel() { drag = null; resetCardTransform(); }

/* 터치 (모바일) */
document.addEventListener('touchstart', e => {
  if (!e.target.closest('#deck')) return;
  if (e.touches.length !== 1) { dragCancel(); return; }
  dragStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!drag) return;
  dragMove(e.touches[0].clientX, e.touches[0].clientY, e);
}, { passive: false });
document.addEventListener('touchend', e => {
  if (!drag) return;
  const handled = dragEnd(e.changedTouches[0].clientX);
  if (handled && e.cancelable) e.preventDefault(); // 고스트 클릭 방지
}, { passive: false });
document.addEventListener('touchcancel', dragCancel);

/* 마우스 (데스크톱) */
let mouseDown = false;
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#deck')) return;
  mouseDown = true;
  dragStart(e.clientX, e.clientY, e.target);
});
document.addEventListener('mousemove', e => {
  if (mouseDown) dragMove(e.clientX, e.clientY, null);
});
document.addEventListener('mouseup', e => {
  if (!mouseDown) return;
  mouseDown = false;
  dragEnd(e.clientX);
});

/* 키보드 (데스크톱) */
document.addEventListener('keydown', e => {
  if (cur().name !== 'verses' || state.mode !== 'card') return;
  if (e.key === 'ArrowLeft') goCard(-1);
  else if (e.key === 'ArrowRight') goCard(1);
  else if (e.key === ' ') {
    e.preventDefault();
    state.flipped = !state.flipped;
    const card = document.querySelector('#deckCurrent .card3d');
    if (card) card.classList.toggle('flipped', state.flipped);
  }
});

render();
</script>
</body>
</html>
